<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

 "day": "اليوم"}}, "en": {"dir": "ltr", "meta": {"htmlLang": "en", "pageTitle": "The Healthy Week Dinner Plan - French Home Cooking"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "A FREE HEALTHY RECIPE GUIDE", "title1": "THE HEALTHY", "accent": "French", "title2": "WEEK DINNER PLAN", "subtitle": "Your favorite French home-cooked dishes, made lighter — grilled, baked, in parchment, and full of vegetables.", "footer": "7 HEALTHY DINNERS · 1 SHOPPING LIST · REAL HOME FLAVOR"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Eating healthy doesn't mean giving up your everyday cooking", "p": ["Most people think \"diet\" means cutting out everything you love and eating bland food. The truth is your favorite French home cooking can be lighter and healthier without losing its flavor.", "This plan has seven real French dinners — grilled, baked, or in parchment instead of fried, lean protein, and plenty of vegetables in every recipe. One shopping list, simple cooking."], "rules": ["General healthy eating — not a strict or restrictive diet", "Protein + vegetables on every plate", "Most recipes use just one pan or sheet"]}, "howto": {"eyebrow": "HOW TO USE THIS PLAN", "title": "Four steps. That's it.", "steps": [{"title": "Shop once", "body": "Use the shopping list on the next page — all 7 dinners in one trip."}, {"title": "Cook in any order", "body": "Days are numbered for convenience, not sequence. Save the fastest recipe for your busiest night."}, {"title": "Use the swap tips", "body": "Every recipe has a swap if you want to vary the protein or use what's already in your fridge."}, {"title": "Balance your plate", "body": "Round out any plate with extra salad or vegetables if you want more volume without more calories."}]}, "shopping": {"eyebrow": "YOUR ONE TRIP", "title": "Shopping list", "note": "Salt, black pepper, and olive oil are assumed pantry basics and aren't listed below.", "categories": [{"name": "Produce", "items": ["1 lemon", "3 heads garlic", "2 zucchini", "1 eggplant", "1 bell pepper", "1 carrot", "1 potato", "3 tomatoes", "1 can crushed tomatoes", "7 oz mushrooms", "1 onion", "1 shallot", "7 oz green beans", "Lettuce or mixed greens", "Fresh basil", "Parsley", "Dill (optional)"]}, {"name": "Protein", "items": ["8 chicken breasts (for three recipes)", "4 skinless chicken thighs", "4 white fish fillets", "1 lb shrimp, peeled", "2 cans tuna in water", "4 eggs"]}, {"name": "Pantry", "items": ["Brown rice (2 cups)", "1 cup cooked white beans", "Herbes de Provence", "Thyme", "Vegetable broth"]}]}, "recipes": [{"title": "Roast Lemon Herbes de Provence Chicken with Brown Rice & Vegetables", "time": "35 min", "serves": "Serves 4", "equip": "1 sheet pan + 1 pot for rice", "ing": ["4 chicken breasts", "1 tsp herbes de Provence", "Juice of 1 lemon", "2 cloves garlic, minced", "1 cup brown rice", "1 cup mixed vegetables (zucchini, pepper, carrot)"], "steps": ["Cook the brown rice according to the package.", "Season the chicken with herbes de Provence, lemon juice, garlic, salt, and pepper; let it sit 10 min.", "Preheat the oven to 425°F (220°C) and roast the chicken 20-22 min, until cooked through.", "Meanwhile, sauté the vegetables in a pan with a little oil until tender but still crisp.", "Serve the chicken with the rice and vegetables."], "swap": "Swap the chicken for white fish or firm tofu.", "leftover": "Shred the leftover chicken and toss with the vegetables in a big salad for lunch the next day."}, {"title": "Fish en Papillote with Vegetables", "time": "25 min", "serves": "Serves 4", "equip": "Parchment paper + sheet pan", "ing": ["4 white fish fillets", "1 zucchini, thinly sliced", "1 carrot, in thin sticks", "1 lemon, sliced", "2 cloves garlic, minced", "Chopped parsley or dill"], "steps": ["Preheat the oven to 400°F (200°C).", "Cut 4 large rectangles of parchment paper.", "Divide the vegetables in the center of each parcel, place the fish on top, add garlic, a lemon slice, and the herbs.", "Fold each parcel closed tightly and place them on a sheet pan.", "Bake 15-18 min, until the fish is steamed through and the vegetables are tender."], "swap": "Any white fish or even shrimp work very well in parchment.", "leftover": "Open the parcel and serve the fish with a little rice the next day for a fast lunch."}, {"title": "Light Pistou Vegetable Soup", "time": "35 min", "serves": "Serves 4", "equip": "1 pot", "ing": ["1 zucchini, diced", "1 carrot, diced", "1 potato, diced", "1 cup cooked white beans", "4 cups vegetable broth", "Fresh basil and 1 clove garlic, for the pistou"], "steps": ["Simmer the zucchini, carrot, potato, and white beans in the broth for 20-25 min, until the vegetables are tender.", "Meanwhile, blend the basil with the garlic and a drizzle of olive oil to make the pistou.", "Serve the soup hot with a spoonful of pistou on top."], "swap": "Add cooked shredded chicken to the soup for extra protein.", "leftover": "Freezes well without the pistou — add fresh pistou when serving."}, {"title": "Light Chicken Chasseur", "time": "35 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["4 skinless chicken thighs", "7 oz mushrooms, sliced", "1 shallot or small onion, chopped", "1 cup crushed tomatoes", "2 cloves garlic, minced", "Fresh or dried thyme"], "steps": ["Season the chicken and brown it in a skillet with a little oil, 4-5 min per side; set aside.", "In the same skillet, sauté the shallot and garlic, then add the mushrooms and cook 5 min.", "Add the crushed tomatoes and thyme, and return the chicken to the skillet.", "Cover and simmer 15-18 min, until the chicken is cooked through.", "Serve as is, or with a little brown rice."], "swap": "Use chicken breast instead of thighs for a lighter version.", "leftover": "The sauce is even better the next day — reheat gently and serve over rice."}, {"title": "Ratatouille with Grilled Chicken", "time": "40 min", "serves": "Serves 4", "equip": "1 large skillet + 1 skillet", "ing": ["1 eggplant, diced", "1 zucchini, diced", "1 bell pepper, diced", "1 onion, chopped", "2 tomatoes, chopped", "4 chicken breasts"], "steps": ["Sauté the onion in a large skillet with a little oil until translucent.", "Add the eggplant and pepper, and cook 10 min.", "Add the zucchini and tomato, lower the heat, and simmer 20 min until the vegetables are very tender.", "Meanwhile, season and grill the chicken in another skillet, 6-7 min per side.", "Serve the chicken over a generous portion of ratatouille."], "swap": "Ratatouille is also delicious topped with a poached egg instead of chicken, for a meat-free night.", "leftover": "The ratatouille tastes even better the next day — reheat and add the chicken or an egg."}, {"title": "Provençal-Style Shrimp with Brown Rice", "time": "20 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb shrimp, peeled", "3 cloves garlic, minced", "1 tomato, chopped", "1 tbsp olive oil", "Chopped parsley", "1 cup cooked brown rice"], "steps": ["Heat the oil in a skillet over medium-high heat.", "Add the garlic and cook 30 sec until fragrant.", "Add the shrimp and tomato, and cook 3-4 min until the shrimp are pink.", "Stir in the parsley and serve over brown rice."], "swap": "Chicken strips or white fish work the same way, just cook a bit longer.", "leftover": "Reheat gently in a skillet — the microwave makes shrimp rubbery."}, {"title": "Light Salade Niçoise", "time": "20 min", "serves": "Serves 4", "equip": "1 pot (for eggs and beans)", "ing": ["2 cans tuna in water, drained", "4 eggs", "7 oz green beans", "Lettuce or mixed greens", "1 tomato, in wedges", "Olive oil and vinegar dressing"], "steps": ["Hard-boil the eggs (about 9 min), then plunge them into cold water and peel.", "Steam or boil the green beans 4-5 min, until tender but still crisp.", "Arrange the lettuce, tomato, and green beans on a platter.", "Add the tuna and the eggs cut into wedges.", "Drizzle with the dressing before serving."], "swap": "Swap the tuna for grilled chicken or cooked shrimp.", "leftover": "Keep the ingredients separate in the fridge and build a fresh salad the next day."}], "bonus": {"eyebrow": "BONUS", "title": "Balance & leftover guide", "items": ["Cook a bigger batch of brown rice early in the week — it's the base of several recipes.", "Want more volume without more calories? Add a green salad or extra ratatouille to any plate.", "Shrimp and fish reheat best in a skillet over low heat, not the microwave.", "In a hurry? Cook a bigger batch of ratatouille and keep it for several days."]}, "closing": {"title": "A full week, no deprivation.", "body": "Seven healthy French dinners, one shopping trip, and the home-cooked flavor you actually love. Keep this guide handy and reach for it any week you want balance without giving up your favorite food.", "madeBy": "MADE BY @SARA.ALARABY"}, "labels": {"ingredients": "Ingredients", "instructions": "Instructions", "swap": "Swap it", "leftover": "Leftover tip", "day": "Day"}}, "pt": {"dir": "ltr", "meta": {"htmlLang": "pt", "pageTitle": "O Plano de Jantares Saudáveis da Semana - Comida Francesa Caseira"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UM GUIA DE RECEITAS SAUDÁVEIS GRÁTIS", "title1": "O PLANO DE JANTARES", "accent": "Franceses", "title2": "SAUDÁVEIS DA SEMANA", "subtitle": "Seus pratos franceses caseiros favoritos, mais leves — grelhados, assados, em papillote, e cheios de legumes.", "footer": "7 JANTARES SAUDÁVEIS · 1 LISTA DE COMPRAS · SABOR CASEIRO DE VERDADE"}, "intro": {"eyebrow": "INTRODUÇÃO", "title": "Comer saudável não significa abrir mão da cozinha do dia a dia", "p": ["A maioria pensa que \"dieta\" significa cortar tudo que você ama e comer coisas sem graça. A verdade é que sua comida francesa caseira favorita pode ficar mais leve e saudável sem perder o sabor.", "Este plano tem sete jantares franceses de verdade — grelhados, assados ou em papillote em vez de fritos, proteína magra, e bastante legume em cada receita. Uma lista de compras, cozinha simples."], "rules": ["Alimentação saudável geral — não é uma dieta rígida ou restritiva", "Proteína + vegetais em cada prato", "A maioria das receitas usa só uma frigideira ou assadeira"]}, "howto": {"eyebrow": "COMO USAR ESSE PLANO", "title": "Quatro passos. Só isso.", "steps": [{"title": "Faça as compras de uma vez", "body": "Use a lista de compras na próxima página — os 7 jantares em uma só ida ao mercado."}, {"title": "Cozinhe na ordem que quiser", "body": "Os dias são numerados por organização, não por obrigação. Guarde a receita mais rápida para o dia mais corrido."}, {"title": "Use as dicas de substituição", "body": "Cada receita tem uma substituição caso queira variar a proteína ou usar o que já tem na geladeira."}, {"title": "Equilibre o seu prato", "body": "Complete qualquer prato com mais salada ou legumes se quiser mais volume sem mais calorias."}]}, "shopping": {"eyebrow": "SUA ÚNICA IDA AO MERCADO", "title": "Lista de compras", "note": "Sal, pimenta-do-reino e azeite são considerados básicos que você já tem — por isso não estão na lista.", "categories": [{"name": "Hortifrúti", "items": ["1 limão", "3 cabeças de alho", "2 abobrinhas", "1 berinjela", "1 pimentão", "1 cenoura", "1 batata", "3 tomates", "1 lata de tomate pelado picado", "200g de cogumelos", "1 cebola", "1 chalota", "200g de vagem", "Alface ou folhas verdes variadas", "Manjericão fresco", "Salsinha", "Endro (opcional)"]}, {"name": "Proteína", "items": ["8 peitos de frango (para três receitas)", "4 sobrecoxas de frango sem pele", "4 filés de peixe branco", "500g de camarão limpo", "2 latas de atum em água", "4 ovos"]}, {"name": "Despensa", "items": ["Arroz integral (2 xícaras)", "1 xícara de feijão branco cozido", "Ervas da Provença", "Tomilho", "Caldo de legumes"]}]}, "recipes": [{"title": "Frango Assado ao Limão e Ervas da Provença com Arroz Integral e Legumes", "time": "35 min", "serves": "Serve 4", "equip": "1 assadeira + 1 panela para o arroz", "ing": ["4 peitos de frango", "1 colher (chá) de ervas da Provença", "Suco de 1 limão", "2 dentes de alho, picados", "1 xícara de arroz integral", "1 xícara de legumes variados (abobrinha, pimentão, cenoura)"], "steps": ["Cozinhe o arroz integral conforme a embalagem.", "Tempere o frango com as ervas da Provença, o suco de limão, o alho, sal e pimenta; deixe descansar 10 min.", "Preaqueça o forno a 220°C e asse o frango por 20-22 min, até cozinhar por completo.", "Enquanto isso, refogue os legumes numa frigideira com um pouco de óleo até ficarem macios mas ainda crocantes.", "Sirva o frango com o arroz e os legumes."], "swap": "Troque o frango por peixe branco ou tofu firme.", "leftover": "Desfie o frango que sobrou e misture com os legumes numa salada grande para o almoço do dia seguinte."}, {"title": "Peixe em Papillote com Legumes", "time": "25 min", "serves": "Serve 4", "equip": "Papel-manteiga + assadeira", "ing": ["4 filés de peixe branco", "1 abobrinha, em rodelas finas", "1 cenoura, em palitos finos", "1 limão, fatiado", "2 dentes de alho, picados", "Salsinha ou endro picados"], "steps": ["Preaqueça o forno a 200°C.", "Corte 4 grandes retângulos de papel-manteiga.", "Divida os legumes no centro de cada trouxinha, coloque o peixe por cima, adicione o alho, uma fatia de limão e as ervas.", "Feche cada trouxinha bem fechada e coloque numa assadeira.", "Asse por 15-18 min, até o peixe cozinhar no vapor e os legumes ficarem macios."], "swap": "Qualquer peixe branco ou até camarão funcionam muito bem em papillote.", "leftover": "Abra a trouxinha e sirva o peixe com um pouco de arroz no dia seguinte para um almoço rápido."}, {"title": "Sopa de Legumes Leve ao Pistou", "time": "35 min", "serves": "Serve 4", "equip": "1 panela", "ing": ["1 abobrinha, em cubos", "1 cenoura, em cubos", "1 batata, em cubos", "1 xícara de feijão branco cozido", "4 xícaras de caldo de legumes", "Manjericão fresco e 1 dente de alho, para o pistou"], "steps": ["Cozinhe a abobrinha, a cenoura, a batata e o feijão branco no caldo por 20-25 min, até os legumes ficarem macios.", "Enquanto isso, bata o manjericão com o alho e um fio de azeite para fazer o pistou.", "Sirva a sopa quente com uma colher de pistou por cima."], "swap": "Adicione frango cozido desfiado à sopa para mais proteína.", "leftover": "Congela bem sem o pistou — adicione o pistou fresco na hora de servir."}, {"title": "Frango Chasseur Leve", "time": "35 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["4 sobrecoxas de frango, sem pele", "200g de cogumelos, fatiados", "1 chalota ou cebola pequena, picada", "1 xícara de tomate pelado picado", "2 dentes de alho, picados", "Tomilho fresco ou seco"], "steps": ["Tempere o frango e doure numa frigideira com um pouco de óleo, 4-5 min de cada lado; reserve.", "Na mesma frigideira, refogue a chalota e o alho, depois adicione os cogumelos e cozinhe por 5 min.", "Adicione o tomate picado e o tomilho, e volte o frango para a frigideira.", "Tampe e cozinhe por 15-18 min, até o frango cozinhar por completo.", "Sirva como está, ou com um pouco de arroz integral."], "swap": "Use peito de frango em vez de sobrecoxa para uma versão mais leve.", "leftover": "O molho fica ainda melhor no dia seguinte — esquente suavemente e sirva sobre arroz."}, {"title": "Ratatouille com Frango Grelhado", "time": "40 min", "serves": "Serve 4", "equip": "1 frigideira grande + 1 frigideira", "ing": ["1 berinjela, em cubos", "1 abobrinha, em cubos", "1 pimentão, em cubos", "1 cebola, picada", "2 tomates, picados", "4 peitos de frango"], "steps": ["Refogue a cebola numa frigideira grande com um pouco de óleo até ficar transparente.", "Adicione a berinjela e o pimentão, e cozinhe por 10 min.", "Adicione a abobrinha e o tomate, abaixe o fogo, e cozinhe por 20 min até os legumes ficarem bem macios.", "Enquanto isso, tempere e grelhe o frango em outra frigideira, 6-7 min de cada lado.", "Sirva o frango sobre uma boa porção de ratatouille."], "swap": "A ratatouille também fica ótima com um ovo pochê por cima em vez do frango, para uma noite sem carne.", "leftover": "A ratatouille fica ainda melhor no dia seguinte — esquente e adicione o frango ou um ovo."}, {"title": "Camarão à Provençal com Arroz Integral", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de camarão limpo", "3 dentes de alho, picados", "1 tomate, picado", "1 colher (sopa) de azeite", "Salsinha picada", "1 xícara de arroz integral cozido"], "steps": ["Aqueça o azeite numa frigideira em fogo médio-alto.", "Adicione o alho e cozinhe por 30 seg até perfumar.", "Adicione o camarão e o tomate, e cozinhe por 3-4 min até o camarão ficar rosado.", "Misture a salsinha e sirva sobre o arroz integral."], "swap": "Tiras de frango ou peixe branco funcionam do mesmo jeito, só precisam de um pouco mais de tempo.", "leftover": "Esquente suavemente numa frigideira — o micro-ondas deixa o camarão borrachudo."}, {"title": "Salada Niçoise Leve", "time": "20 min", "serves": "Serve 4", "equip": "1 panela (para ovos e vagem)", "ing": ["2 latas de atum em água, escorrido", "4 ovos", "200g de vagem", "Alface ou folhas verdes variadas", "1 tomate, em gomos", "Molho de azeite e vinagre"], "steps": ["Cozinhe os ovos até ficarem duros (cerca de 9 min), depois mergulhe em água fria e descasque.", "Cozinhe a vagem no vapor ou em água fervente por 4-5 min, até ficar macia mas ainda crocante.", "Arrume a alface, o tomate e a vagem num prato.", "Adicione o atum e os ovos cortados em gomos.", "Regue com o molho antes de servir."], "swap": "Troque o atum por frango grelhado ou camarão cozido.", "leftover": "Guarde os ingredientes separados na geladeira e monte a salada fresca no dia seguinte."}], "bonus": {"eyebrow": "BÔNUS", "title": "Guia de equilíbrio e sobras", "items": ["Cozinhe o arroz integral em maior quantidade no início da semana — é a base de várias receitas.", "Quer mais volume sem mais calorias? Adicione uma salada verde ou mais ratatouille a qualquer prato.", "Camarão e peixe esquentam melhor numa frigideira em fogo baixo, não no micro-ondas.", "Com pressa? Cozinhe a ratatouille em maior quantidade e guarde por vários dias."]}, "closing": {"title": "Uma semana completa, sem privação.", "body": "Sete jantares franceses saudáveis, uma ida ao mercado, e o sabor caseiro que você realmente ama. Guarde este guia à mão e use sempre que quiser equilíbrio sem abrir mão da sua comida favorita.", "madeBy": "FEITO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Modo de preparo", "swap": "Substituição", "leftover": "Dica de sobras", "day": "Dia"}}, "es": {"dir": "ltr", "meta": {"htmlLang": "es", "pageTitle": "El Plan de Cenas Saludables de la Semana - Cocina Casera Francesa"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUÍA DE RECETAS SALUDABLES GRATIS", "title1": "EL PLAN DE CENAS", "accent": "Francesas", "title2": "SALUDABLES DE LA SEMANA", "subtitle": "Tus platos franceses caseros favoritos, más ligeros — a la plancha, al horno, en papillote, y llenos de verduras.", "footer": "7 CENAS SALUDABLES · 1 LISTA DE COMPRAS · SABOR CASERO DE VERDAD"}, "intro": {"eyebrow": "INTRODUCCIÓN", "title": "Comer saludable no significa renunciar a tu cocina de siempre", "p": ["La mayoría piensa que \"dieta\" significa eliminar todo lo que te gusta y comer cosas sin sabor. La verdad es que tu comida francesa casera favorita puede ser más ligera y saludable sin perder su sabor.", "Este plan tiene siete cenas francesas de verdad — a la plancha, al horno o en papillote en lugar de fritas, proteína magra, y muchas verduras en cada receta. Una lista de compras, cocina sencilla."], "rules": ["Alimentación saludable general — no es una dieta estricta ni restrictiva", "Proteína + verduras en cada plato", "La mayoría de las recetas usan solo un sartén o una bandeja"]}, "howto": {"eyebrow": "CÓMO USAR ESTE PLAN", "title": "Cuatro pasos. Nada más.", "steps": [{"title": "Compra una sola vez", "body": "Usa la lista de compras en la siguiente página — las 7 cenas en un solo viaje."}, {"title": "Cocina en cualquier orden", "body": "Los días están numerados por organización, no por obligación. Guarda la receta más rápida para tu noche más ocupada."}, {"title": "Usa los tips de sustitución", "body": "Cada receta tiene una sustitución por si quieres variar la proteína o usar lo que ya tienes en el refrigerador."}, {"title": "Equilibra tu plato", "body": "Completa cualquier plato con más ensalada o verduras si quieres más volumen sin más calorías."}]}, "shopping": {"eyebrow": "TU ÚNICO VIAJE AL SÚPER", "title": "Lista de compras", "note": "La sal, la pimienta negra y el aceite de oliva se consideran básicos que ya tienes, por eso no están en la lista.", "categories": [{"name": "Verduras y frutas", "items": ["1 limón", "3 cabezas de ajo", "2 calabacitas", "1 berenjena", "1 pimiento", "1 zanahoria", "1 papa", "3 tomates", "1 lata de tomate triturado", "200g de champiñones", "1 cebolla", "1 chalota", "200g de ejotes", "Lechuga o mezcla de hojas verdes", "Albahaca fresca", "Perejil", "Eneldo (opcional)"]}, {"name": "Proteína", "items": ["8 pechugas de pollo (para tres recetas)", "4 muslos de pollo sin piel", "4 filetes de pescado blanco", "500g de camarón pelado", "2 latas de atún al natural", "4 huevos"]}, {"name": "Despensa", "items": ["Arroz integral (2 tazas)", "1 taza de frijoles blancos cocidos", "Hierbas de Provenza", "Tomillo", "Caldo de verduras"]}]}, "recipes": [{"title": "Pollo Asado al Limón y Hierbas de Provenza con Arroz Integral y Verduras", "time": "35 min", "serves": "Para 4", "equip": "1 bandeja + 1 olla para el arroz", "ing": ["4 pechugas de pollo", "1 cdta de hierbas de Provenza", "Jugo de 1 limón", "2 dientes de ajo, picados", "1 taza de arroz integral", "1 taza de verduras variadas (calabacita, pimiento, zanahoria)"], "steps": ["Cocina el arroz integral según el paquete.", "Sazona el pollo con las hierbas de Provenza, el jugo de limón, el ajo, sal y pimienta; deja reposar 10 min.", "Precalienta el horno a 220°C y hornea el pollo 20-22 min, hasta que esté bien cocido.", "Mientras tanto, saltea las verduras en un sartén con un poco de aceite hasta que estén tiernas pero aún crujientes.", "Sirve el pollo con el arroz y las verduras."], "swap": "Sustituye el pollo por pescado blanco o tofu firme.", "leftover": "Deshebra el pollo sobrante y mézclalo con las verduras en una ensalada grande para la comida del día siguiente."}, {"title": "Pescado en Papillote con Verduras", "time": "25 min", "serves": "Para 4", "equip": "Papel para hornear + bandeja", "ing": ["4 filetes de pescado blanco", "1 calabacita, en rodajas finas", "1 zanahoria, en bastones finos", "1 limón, en rodajas", "2 dientes de ajo, picados", "Perejil o eneldo picado"], "steps": ["Precalienta el horno a 200°C.", "Corta 4 rectángulos grandes de papel para hornear.", "Reparte las verduras en el centro de cada paquete, coloca el pescado encima, agrega el ajo, una rodaja de limón y las hierbas.", "Cierra bien cada paquete y colócalos en una bandeja.", "Hornea 15-18 min, hasta que el pescado esté cocido al vapor y las verduras tiernas."], "swap": "Cualquier pescado blanco o incluso camarón funcionan muy bien en papillote.", "leftover": "Abre el paquete y sirve el pescado con un poco de arroz al día siguiente para una comida rápida."}, {"title": "Sopa de Verduras Ligera al Pistou", "time": "35 min", "serves": "Para 4", "equip": "1 olla", "ing": ["1 calabacita, en cubos", "1 zanahoria, en cubos", "1 papa, en cubos", "1 taza de frijoles blancos cocidos", "4 tazas de caldo de verduras", "Albahaca fresca y 1 diente de ajo, para el pistou"], "steps": ["Cocina a fuego lento la calabacita, la zanahoria, la papa y los frijoles blancos en el caldo por 20-25 min, hasta que las verduras estén tiernas.", "Mientras tanto, licúa la albahaca con el ajo y un chorrito de aceite de oliva para hacer el pistou.", "Sirve la sopa caliente con una cucharada de pistou encima."], "swap": "Agrega pollo cocido deshebrado a la sopa para más proteína.", "leftover": "Se congela bien sin el pistou — agrega el pistou fresco al momento de servir."}, {"title": "Pollo Chasseur Ligero", "time": "35 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["4 muslos de pollo, sin piel", "200g de champiñones, en láminas", "1 chalota o cebolla pequeña, picada", "1 taza de tomate triturado", "2 dientes de ajo, picados", "Tomillo fresco o seco"], "steps": ["Sazona el pollo y dóralo en un sartén con un poco de aceite, 4-5 min por lado; reserva.", "En el mismo sartén, sofríe la chalota y el ajo, luego agrega los champiñones y cocina 5 min.", "Agrega el tomate triturado y el tomillo, y regresa el pollo al sartén.", "Tapa y deja cocinar 15-18 min, hasta que el pollo esté bien cocido.", "Sirve tal cual, o con un poco de arroz integral."], "swap": "Usa pechuga de pollo en vez de muslo para una versión más ligera.", "leftover": "La salsa sabe aún mejor al día siguiente — recalienta suavemente y sirve sobre arroz."}, {"title": "Ratatouille con Pollo a la Plancha", "time": "40 min", "serves": "Para 4", "equip": "1 sartén grande + 1 sartén", "ing": ["1 berenjena, en cubos", "1 calabacita, en cubos", "1 pimiento, en cubos", "1 cebolla, picada", "2 tomates, picados", "4 pechugas de pollo"], "steps": ["Sofríe la cebolla en un sartén grande con un poco de aceite hasta que esté transparente.", "Agrega la berenjena y el pimiento, y cocina 10 min.", "Agrega la calabacita y el tomate, baja el fuego, y deja cocinar 20 min hasta que las verduras estén muy tiernas.", "Mientras tanto, sazona y cocina el pollo a la plancha en otro sartén, 6-7 min por lado.", "Sirve el pollo sobre una buena porción de ratatouille."], "swap": "El ratatouille también queda delicioso con un huevo poché encima en vez de pollo, para una noche sin carne.", "leftover": "El ratatouille sabe aún mejor al día siguiente — recaliéntalo y agrega el pollo o un huevo."}, {"title": "Camarones a la Provenzal con Arroz Integral", "time": "20 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de camarón pelado", "3 dientes de ajo, picados", "1 tomate, picado", "1 cda de aceite de oliva", "Perejil picado", "1 taza de arroz integral cocido"], "steps": ["Calienta el aceite en un sartén a fuego medio-alto.", "Agrega el ajo y cocina 30 seg hasta que aromatice.", "Agrega el camarón y el tomate, y cocina 3-4 min hasta que el camarón esté rosado.", "Agrega el perejil y sirve sobre el arroz integral."], "swap": "Tiras de pollo o pescado blanco funcionan igual, solo necesitan un poco más de tiempo.", "leftover": "Recalienta suavemente en un sartén — el microondas deja el camarón chicloso."}, {"title": "Ensalada Niçoise Ligera", "time": "20 min", "serves": "Para 4", "equip": "1 olla (para huevos y ejotes)", "ing": ["2 latas de atún al natural, escurrido", "4 huevos", "200g de ejotes", "Lechuga o mezcla de hojas verdes", "1 tomate, en cuartos", "Aderezo de aceite de oliva y vinagre"], "steps": ["Cocina los huevos duros (unos 9 min), luego sumérgelos en agua fría y pélalos.", "Cocina los ejotes al vapor o en agua hirviendo 4-5 min, hasta que estén tiernos pero aún crujientes.", "Acomoda la lechuga, el tomate y los ejotes en un platón.", "Agrega el atún y los huevos cortados en cuartos.", "Rocía con el aderezo antes de servir."], "swap": "Sustituye el atún por pollo a la plancha o camarón cocido.", "leftover": "Guarda los ingredientes por separado en el refrigerador y arma la ensalada fresca al día siguiente."}], "bonus": {"eyebrow": "EXTRA", "title": "Guía de equilibrio y sobras", "items": ["Cocina una tanda más grande de arroz integral a principios de semana — es la base de varias recetas.", "¿Quieres más volumen sin más calorías? Agrega una ensalada verde o más ratatouille a cualquier plato.", "El camarón y el pescado se recalientan mejor en un sartén a fuego bajo, no en el microondas.", "¿Con prisa? Cocina el ratatouille en mayor cantidad y guárdalo para varios días."]}, "closing": {"title": "Una semana completa, sin privaciones.", "body": "Siete cenas francesas saludables, un solo viaje al súper, y el sabor casero que realmente amas. Ten esta guía a la mano y úsala cualquier semana que quieras equilibrio sin renunciar a tu comida favorita.", "madeBy": "HECHO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Preparación", "swap": "Sustitución", "leftover": "Tip de sobras", "day": "Día"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena Sano della Settimana - Cucina Casalinga Francese"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA A RICETTE SANE", "title1": "LA SETTIMANA", "accent": "Francese", "title2": "SANA A CENA", "subtitle": "I tuoi piatti casalinghi francesi preferiti, resi più leggeri — alla griglia, al forno, al cartoccio, e pieni di verdure.", "footer": "7 CENE SANE · 1 LISTA DELLA SPESA · VERO SAPORE DI CASA"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Mangiare sano non significa rinunciare alla tua cucina di ogni giorno", "p": ["Molte persone pensano che \"dieta\" significhi eliminare tutto ciò che ami e mangiare cibo insipido. La verità è che la tua cucina casalinga francese preferita può essere più leggera e sana senza perdere il suo sapore.", "Questo piano ha sette vere cene francesi — alla griglia, al forno o al cartoccio invece che fritte, proteine magre, e tante verdure in ogni ricetta. Una lista della spesa, cottura semplice."], "rules": ["Alimentazione sana in generale — non una dieta rigida o restrittiva", "Proteine + verdure in ogni piatto", "La maggior parte delle ricette usa solo una padella o una teglia"]}, "howto": {"eyebrow": "COME USARE QUESTO PIANO", "title": "Quattro passaggi. Tutto qui.", "steps": [{"title": "Fai la spesa una volta", "body": "Usa la lista della spesa nella pagina successiva — tutte e 7 le cene in un solo giro."}, {"title": "Cucina nell'ordine che vuoi", "body": "I giorni sono numerati per comodità, non per obbligo. Tieni la ricetta più veloce per la sera più impegnata."}, {"title": " ollo con pesce bianco o tofu compatto.", "leftover": "Sfilaccia il pollo avanzato e mescolalo con le verdure in una grande insalata per il pranzo del giorno dopo."}, {"title": "Pesce al Cartoccio con Verdure", "time": "25 min", "serves": "Per 4 persone", "equip": "Carta forno + teglia", "ing": ["4 filetti di pesce bianco", "1 zucchina, a fette sottili", "1 carota, a bastoncini sottili", "1 limone, a fette", "2 spicchi d'aglio, tritati", "Prezzemolo o aneto tritato"], "steps": ["Preriscalda il forno a 200°C.", "Taglia 4 grandi rettangoli di carta forno.", "Dividi le verdure al centro di ogni cartoccio, adagia il pesce sopra, aggiungi aglio, una fetta di limone e le erbe.", "Chiudi bene ogni cartoccio e disponili su una teglia.", "Cuoci 15-18 min, finché il pesce è cotto a vapore e le verdure sono tenere."], "swap": "Qualsiasi pesce bianco, o anche i gamberi, funzionano molto bene al cartoccio.", "leftover": "Apri il cartoccio e servi il pesce con un po' di riso il giorno dopo per un pranzo veloce."}, {"title": "Zuppa di Verdure Leggera al Pistou", "time": "35 min", "serves": "Per 4 persone", "equip": "1 pentola", "ing": ["1 zucchina, a cubetti", "1 carota, a cubetti", "1 patata, a cubetti", "1 tazza di fagioli bianchi cotti", "1 litro di brodo vegetale", "Basilico fresco e 1 spicchio d'aglio, per il pistou"], "steps": ["Cuoci a fuoco lento zucchine, carota, patata e fagioli bianchi nel brodo per 20-25 min, finché le verdure sono tenere.", "Nel frattempo, frulla il basilico con l'aglio e un filo d'olio d'oliva per fare il pistou.", "Servi la zuppa calda con un cucchiaio di pistou sopra."], "swap": "Aggiungi pollo sfilacciato cotto alla zuppa per più proteine.", "leftover": "Si congela bene senza il pistou — aggiungi il pistou fresco al momento di servire."}, {"title": "Pollo alla Cacciatora Leggero", "time": "35 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["4 cosce di pollo senza pelle", "200 g di funghi, a fette", "1 scalogno o cipollina, tritato",   return e;

      num.style.background = DAY_COLORS[i];
      row.appendChild(num);
      row.appendChild(el('div','ins-text', s));
      insCol.appendChild(row);
    });

    body.appendChild(ingCol); body.appendChild(insCol);
    card.appendChild(body);
    list.appendChild(card);
  });

  // Bonus
  document.getElementById('bnEyebrow').textContent = d.bonus.eyebrow;
  document.getElementById('bnTitle').textContent = d.bonus.title;
  const bnItems = document.getElementById('bnItems'); bnItems.innerHTML='';

  document.getElementById('clTitle').textContent = d.closing.title;
  document.getElementById('clBody').textContent = d.closing.body;
  document.getElementById('clMadeBy').textContent = d.closing.madeBy;

  document.getElementById('backLink').textContent = (window.BACK_LINK_TEXT[lang] || window.BACK_LINK_TEXT.en);

  try{ localStorage.setItem('sd_lang', lang); }catch(e){}
}

document.getElementById('langSwitcher').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  render(btn.getAttribute('data-lang'));
});

(function init(){
  let lang = 'fr';
  try{
    const saved = localStorage.getItem('sd_lang');
    if(saved && DATA[saved]) lang = saved;
    else {
      const nav = (navigator.language||'en').slice(0,2).toLowerCase();
      if(DATA[nav]) lang = nav;
    }
  }catch(e){}
  render(lang);
})();

  function pick(dict){ var l = currentLang(); return dict[l] || dict.en || dict.ar; }

  function addMsg(text, isUser){
    var div = document.createElement('div');
    div.className = 'sara-msg' + (isUser ? ' user' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderNode(nodeId){
    var node = TREE[nodeId];
    addMsg(pick(node.msg), false);
    optionsEl.innerHTML = '';
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'sara-opt-btn' + (opt.wa ? ' wa' : '');
      btn.textContent = pick(opt.label);
      btn.addEventListener('click', function(){ handleOption(opt, nodeId); });
      optionsEl.appendChild(btn);
    });
  }

  function handleOption(opt, fromNode){
    if (!opt.back) addMsg(pick(opt.label), true);
    if (opt.wa) {
      window.open(waLink(currentLang()), '_blank');
      return;
    }
    if (opt.link) {
      window.location.href = opt.link;
      return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

  function openPanel(){
    panel.classList.add('open');
    document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
    if (!messagesEl.hasChildNodes()) {
      history = ["root"];
      renderNode("root");
    }
  }

    fab = document.getElementById('saraFab');
    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
