<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

 a skillet over high heat; cook the chicken 6–8 min, stirring, until charred and cooked through.", "Serve over rice with tomato and cucumber, and a drizzle of tahini sauce if you like."], "swap": "The same spice mix works with shrimp or ground turkey — cut the shrimp cook time to 3 min.", "leftover": "Wrap in flatbread with pickles the next day for a fast lunch."}, {"title": "Garlic-Cumin Shrimp Skillet", "time": "15 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb shrimp, peeled", "3 tbsp butter", "4 cloves garlic, minced", "1 tsp cumin", "1/2 tsp paprika", "Juice of 1 lemon", "1 cup cooked rice", "Chopped parsley (optional)"], "steps": ["Melt the butter in a skillet over medium-high heat.", "Add the garlic, cumin, and paprika; cook 30 sec until fragrant.", "Add the shrimp; cook 2–3 min per side until pink.", "Stir in the lemon juice and serve over rice with parsley."], "swap": "Chicken strips work too — just cook 6–7 min per side.", "leftover": "Reheat gently in a skillet — the microwave makes shrimp rubbery."}, {"title": "Sheet-Pan Chicken with Onion & Tomato", "time": "35 min", "serves": "Serves 4", "equip": "1 sheet pan", "ing": ["4 chicken thighs", "2 onions, sliced", "2 tomatoes, sliced", "3 cloves garlic, minced", "1 tsp mixed seven-spice", "1 tsp cumin", "3 tbsp oil", "Salt and pepper"], "steps": ["Preheat the oven to 425°F (220°C).", "Toss the sliced onion and tomato with 1 tbsp oil and half the spices on a sheet pan.", "Rub the chicken with the remaining oil and spices; nestle into the pan.", "Roast 30–35 min, until the chicken is cooked through and golden."], "swap": "No oven-safe pan? Sear the chicken in a skillet 6–7 min per side and cook the onion and tomato separately.", "leftover": "Shred the chicken and toss with the roasted onion and tomato over rice the next day."}, {"title": "Baked Fish with Tahini Sauce", "time": "25 min", "serves": "Serves 4", "equip": "1 sheet pan", "ing": ["4 white fish fillets (or salmon)", "1 onion, thinly sliced", "1/2 cup tahini", "Juice of 1 lemon", "2 cloves garlic, minced", "1/4 cup water", "2 tbsp oil", "Salt, pepper, and chopped parsley"], "steps": ["Preheat the oven to 400°F (200°C). Whisk the tahini with the lemon juice, garlic, water, and salt until smooth.", "Lay the onion slices on a sheet pan, top with the fish, and season with salt, pepper, and oil.", "Pour the tahini sauce over the fish and roast 18–20 min, until it flakes easily.", "Sprinkle with parsley before serving."], "swap": "Salmon works beautifully here too, with the same cook time.", "leftover": "Flake into a rice bowl with extra tahini sauce for a fast lunch the next day."}, {"title": "Skillet Turkey Kofta", "time": "20 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb ground turkey", "1/2 onion, grated", "2 cloves garlic, minced", "1 tsp cumin", "1 tsp dried coriander", "A pinch of cinnamon", "Salt and pepper", "2 tbsp oil", "Flatbread and yogurt sauce, for serving"], "steps": ["Mix the turkey with the grated onion, garlic, spices, salt, and pepper; shape into flat patties.", "Heat the oil in a skillet and cook the patties 4–5 min per side, until browned and cooked through.", "Serve in warm flatbread with yogurt sauce, tomato, and pickles."], "swap": "Ground beef, chicken, or even a plant-based crumble work the same way.", "leftover": "Chop and toss into a rice bowl or salad the next day."}, {"title": "Alexandrian Garlic Liver", "time": "15 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb beef or chicken liver, thinly sliced", "4 cloves garlic, minced", "1 tsp cumin", "1/2 tsp dried chili flakes", "1 green bell pepper, sliced", "3 tbsp oil", "Salt and pepper", "Juice of 1/2 lemon", "Bread, for serving"], "steps": ["Heat the oil in a skillet over high heat.", "Add the liver; sear 2 min per side until browned outside but still tender inside.", "Add the garlic, cumin, chili flakes, and bell pepper; cook 2 more min.", "Turn off the heat, stir in the lemon juice, salt, and pepper, and serve hot with bread."], "swap": "Chicken liver cooks faster than beef — watch it closely so it doesn't turn tough.", "leftover": "Best fresh, but it also makes a great cold sandwich the next day."}], "bonus": {"eyebrow": "BONUS", "title": "Freezer & leftover guide", "items": ["Dawood Basha and turkey kofta both freeze well for up to 2 months — portion before freezing.", "Rice freezes beautifully: portion it flat in bags and reheat straight from frozen with a splash of water.", "Shrimp and fish reheat best in a skillet over low heat, not the microwave.", "Any leftover vegetables can be blitzed with broth into a quick soup."]}, "closing": {"title": "That's a wrap.", "body": "Seven Middle Eastern dinners, one shopping trip, zero time standing in front of the fridge. Keep this guide somewhere you'll actually see it, and reach for it any week you want your evenings back.", "madeBy": "MADE BY @SARA.ALARABY"}, "labels": {"ingredients": "Ingredients", "instructions": "Instructions", "swap": "Swap it", "leftover": "Leftover tip", "day": "Day"}}, "pt": {"dir": "ltr", "meta": {"htmlLang": "pt", "pageTitle": "O Plano de Jantares Árabes Sem Decisões de 7 Dias"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UM GUIA DE RECEITAS GRÁTIS", "title1": "O PLANO DE JANTARES", "accent": "Sem Decisões", "title2": "ÁRABES DE 7 DIAS", "subtitle": "Chega de ficar parada na frente da geladeira sem saber o que fazer. Comece a comer comida árabe caseira de verdade hoje à noite.", "footer": "7 JANTARES DE VERDADE · 1 LISTA DE COMPRAS · ZERO INDECISÃO"}, "intro": {"eyebrow": "INTRODUÇÃO", "title": "Por que \"o que eu faço hoje?\" cansa tanto", "p": ["São 18h. Você está cansada. Abre a geladeira, encara o conteúdo, fecha de novo, e ainda não tem ideia do que fazer. Isso não é um problema de cozinha — é um problema de decisão. Depois de um dia inteiro cheio de escolhas, seu cérebro não tem mais energia para planejar uma refeição do zero.", "Este plano tira a decisão do caminho. Sete jantares árabes de verdade, organizados em ordem, com uma única lista de compras que você faz de uma vez só. Você não vai mais passar a semana pensando no jantar — é só abrir o guia e cozinhar."], "rules": ["30 minutos ou menos, do início ao fim", "Ingredientes do dia a dia, de qualquer mercado", "Faxina mínima — na maioria das noites, uma frigideira só"]}, "howto": {"eyebrow": "COMO USAR ESSE PLANO", "title": "Quatro passos. Só isso.", "steps": [{"title": "Faça as compras de uma vez", "body": "Use a lista consolidada na próxima página — os 7 jantares, uma ida ao mercado, organizada por seção."}, {"title": "Cozinhe na ordem que quiser", "body": "Os dias são numerados por organização, não por obrigação. Guarde a receita mais rápida para o dia mais corrido."}, {"title": "Use as dicas de substituição", "body": "Cada receita se adapta às suas necessidades alimentares ou à proteína que você tiver em casa ou em promoção."}, {"title": "Não desperdice as sobras", "body": "Cada receita já traz uma sugestão pronta pro que sobrar no dia seguinte."}]}, "shopping": {"eyebrow": "SUA ÚNICA IDA AO MERCADO", "title": "Lista de compras", "note": "Sal, pimenta e azeite são considerados básicos que você já tem — por isso não estão na lista.", "categories": [{"name": "Hortifrúti", "items": ["4-5 cebolas amarelas", "2 cabeças de alho", "4 limões", "3 tomates", "1 pimentão verde", "1 pepino", "Salsinha fresca (opcional)", "Picles (opcional)"]}, {"name": "Laticínios", "items": ["Manteiga", "Iogurte natural"]}, {"name": "Proteína", "items": ["500g de carne moída", "4 peitos de frango", "500g de camarão", "4 sobrecoxas de frango", "4 filés de peixe branco ou salmão", "500g de peru moído", "500g de fígado bovino ou de frango"]}, {"name": "Despensa", "items": ["Arroz (cerca de 2 xícaras)", "1 lata de tomate pelado", "Molho de tomate", "Tahine", "Pão sírio", "Temperos: cominho, coentro seco, páprica, sete-especiarias, canela, pimenta seca em flocos"]}]}, "recipes": [{"title": "Dawood Basha (Almôndegas ao Molho de Tomate)", "time": "30 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de carne moída", "1 cebola ralada", "2 dentes de alho, picados", "1 lata de tomate pelado", "1 colher (sopa) de molho de tomate", "1 colher (chá) de cominho", "1 colher (chá) de sete-especiarias", "Sal e pimenta-do-reino", "2 colheres (sopa) de óleo", "Arroz, para servir"], "steps": ["Misture a carne com a cebola ralada, o alho, o cominho, as especiarias, o sal e a pimenta; molde bolinhas pequenas.", "Aqueça o óleo numa frigideira e doure as almôndegas por 5–6 min, virando conforme cozinham.", "Adicione o tomate pelado, o molho de tomate e 1 xícara de água; deixe cozinhar em fogo baixo por 12–15 min até o molho engrossar.", "Sirva quente sobre arroz."], "swap": "Carne de cordeiro ou peru moído também funcionam bem. Uma pitada de canela dá um toque especial.", "leftover": "Recheie um pão sírio com um fio de tahine no dia seguinte — fica ainda melhor."}, {"title": "Shawarma de Frango na Frigideira", "time": "25 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["4 peitos de frango, em tiras finas", "2 colheres (sopa) de tempero para shawarma", "3 dentes de alho, picados", "Suco de 1 limão", "2 colheres (sopa) de óleo", "1 xícara de arroz cozido", "Tomate e pepino fatiados, para servir"], "steps": ["Misture o frango com o tempero de shawarma, o alho, o suco de limão e o óleo; deixe descansar 5 min enquanto a frigideira esquenta.", "Aqueça a frigideira em fogo alto; cozinhe o frango por 6–8 min, mexendo, até dourar e cozinhar por completo.", "Sirva sobre arroz com tomate e pepino, e um fio de molho tahine se quiser."], "swap": "A mesma mistura de temperos funciona com camarão ou peru moído — reduza o tempo do camarão para 3 min.", "leftover": "Enrole num pão sírio com picles no dia seguinte para um almoço rápido."}, {"title": "Camarão na Manteiga de Alho e Cominho", "time": "15 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de camarão limpo", "3 colheres (sopa) de manteiga", "4 dentes de alho, picados", "1 colher (chá) de cominho", "1/2 colher (chá) de páprica", "Suco de 1 limão", "1 xícara de arroz cozido", "Salsinha picada (opcional)"], "steps": ["Derreta a manteiga numa frigideira em fogo médio-alto.", "Adicione o alho, o cominho e a páprica; cozinhe por 30 seg até perfumar.", "Adicione o camarão; cozinhe 2–3 min de cada lado até ficar rosado.", "Misture o suco de limão e sirva sobre arroz com salsinha."], "swap": "Tiras de frango também funcionam — só cozinhe por 6–7 min de cada lado.", "leftover": "Esquente suavemente numa frigideira — o micro-ondas deixa o camarão borrachudo."}, {"title": "Frango Assado com Cebola e Tomate", "time": "35 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 sobrecoxas de frango", "2 cebolas, fatiadas", "2 tomates, fatiados", "3 dentes de alho, picados", "1 colher (chá) de sete-especiarias", "1 colher (chá) de cominho", "3 colheres (sopa) de óleo", "Sal e pimenta"], "steps": ["Preaqueça o forno a 220°C.", "Misture a cebola e o tomate fatiados com 1 colher de óleo e metade das especiarias na assadeira.", "Tempere o frango com o óleo e as especiarias restantes; acomode na assadeira.", "Asse por 30–35 min, até o frango cozinhar por completo e dourar."], "swap": "Sem forma própria pro forno? Doure o frango na frigideira 6–7 min de cada lado e cozinhe a cebola e o tomate à parte.", "leftover": "Desfie o frango e misture com a cebola e o tomate assados sobre arroz no dia seguinte."}, {"title": "Peixe Assado com Molho Tahine", "time": "25 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 filés de peixe branco (ou salmão)", "1 cebola, em fatias finas", "1/2 xícara de tahine", "Suco de 1 limão", "2 dentes de alho, picados", "1/4 xícara de água", "2 colheres (sopa) de óleo", "Sal, pimenta e salsinha picada"], "steps": ["Preaqueça o forno a 200°C. Misture o tahine com o suco de limão, o alho, a água e o sal até ficar homogêneo.", "Coloque as fatias de cebola numa assadeira, cubra com o peixe e tempere com sal, pimenta e óleo.", "Regue o peixe com o molho tahine e asse por 18–20 min, até lascar facilmente.", "Salpique salsinha antes de servir."], "swap": "Salmão também fica ótimo aqui, com o mesmo tempo de cozimento.", "leftover": "Desfie num bowl de arroz com mais um pouco de tahine para um almoço rápido no dia seguinte."}, {"title": "Almôndegas de Peru na Frigideira", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de peru moído", "1/2 cebola ralada", "2 dentes de alho, picados", "1 colher (chá) de cominho", "1 colher (chá) de coentro seco", "Uma pitada de canela", "Sal e pimenta", "2 colheres (sopa) de óleo", "Pão sírio e molho de iogurte, para servir"], "steps": ["Misture o peru com a cebola ralada, o alho, as especiarias, o sal e a pimenta; molde discos achatados.", "Aqueça o óleo numa frigideira e cozinhe por 4–5 min de cada lado, até dourar e cozinhar por completo.", "Sirva num pão sírio quentinho com molho de iogurte, tomate e picles."], "swap": "Carne moída, frango ou até uma opção vegetal funcionam do mesmo jeito.", "leftover": "Pique e misture num bowl de arroz ou salada no dia seguinte."}, {"title": "Fígado Alexandrino ao Alho", "time": "15 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de fígado bovino ou de frango, em fatias finas", "4 dentes de alho, picados", "1 colher (chá) de cominho", "1/2 colher (chá) de pimenta seca em flocos", "1 pimentão verde, fatiado", "3 colheres (sopa) de óleo", "Sal e pimenta", "Suco de 1/2 limão", "Pão, para servir"], "steps": ["Aqueça o óleo numa frigideira em fogo alto.", "Adicione o fígado; sele por 2 min de cada lado até dourar por fora e ficar macio por dentro.", "Adicione o alho, o cominho, a pimenta em flocos e o pimentão; cozinhe por mais 2 min.", "Desligue o fogo, misture o suco de limão, o sal e a pimenta, e sirva quente com pão."], "swap": "Fígado de frango cozinha mais rápido que o bovino — fique de olho para não ficar duro.", "leftover": "Fica melhor fresco, mas também vira um ótimo sanduíche frio no dia seguinte."}], "bonus": {"eyebrow": "BÔNUS", "title": "Guia de congelamento e sobras", "items": ["O Dawood Basha e as almôndegas de peru congelam bem por até 2 meses — porcione antes de congelar.", "O arroz congela muito bem: distribua em sacos achatados e esquente direto do congelador com um pouco de água.", "Camarão e peixe esquentam melhor numa frigideira em fogo baixo, não no micro-ondas.", "Sobras de legumes de qualquer noite podem virar uma sopa rápida com um pouco de caldo."]}, "closing": {"title": "Prontinho!", "body": "Sete jantares árabes, uma ida ao mercado, zero tempo parada na frente da geladeira. Guarde este guia em algum lugar que você realmente vai ver, e use sempre que quiser suas noites de volta.", "madeBy": "FEITO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Modo de preparo", "swap": "Substituição", "leftover": "Dica de sobras", "day": "Dia"}}, "es": {"dir": "ltr", "meta": {"htmlLang": "es", "pageTitle": "El Plan de Cenas Árabes Sin Decisiones de 7 Días"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUÍA DE RECETAS GRATIS", "title1": "EL PLAN DE CENAS", "accent": "Sin Decisiones", "title2": "ÁRABES DE 7 DÍAS", "subtitle": "Deja de quedarte frente al refrigerador sin saber qué hacer. Empieza a comer comida árabe casera de verdad esta noche.", "footer": "7 CENAS DE VERDAD · 1 LISTA DE COMPRAS · CERO DUDAS"}, "intro": {"eyebrow": "INTRODUCCIÓN", "title": "Por qué cansa tanto pensar \"¿qué hago de cenar?\"", "p": ["Son las 6pm. Estás cansada. Abres el refrigerador, te quedas viéndolo, lo cierras de nuevo y sigues sin idea de qué hacer. Esto no es un problema de cocina — es un problema de decisión. Después de un día entero lleno de decisiones, tu cerebro ya no tiene energía para planear una comida desde cero.", "Este plan elimina la decisión por completo. Siete cenas árabes de verdad, organizadas en orden, con una sola lista de compras que haces una vez. No vas a pasar la semana pensando qué cenar — solo abres esta guía y cocinas."], "rules": ["30 minutos o menos, de principio a fin", "Ingredientes comunes de cualquier supermercado", "Limpieza mínima — la mayoría de las noches, un solo sartén"]}, "howto": {"eyebrow": "CÓMO USAR ESTE PLAN", "title": "Cuatro pasos. Nada más.", "steps": [{"title": "Compra una sola vez", "body": "Usa la lista consolidada en la siguiente página — las 7 cenas, un solo viaje, organizada por sección."}, {"title": "Cocina en cualquier orden", "body": "Los días están numerados por organización, no por obligación. Guarda la receta más rápida para tu noche más ocupada."}, {"title": "Usa los tips de sustitución", "body": "Cada receta se adapta a tus necesidades alimenticias o a la proteína que tengas a la mano o en oferta."}, {"title": "No desperdicies las sobras", "body": "Cada receta incluye una sugerencia lista para las sobras del día siguiente."}]}, "shopping": {"eyebrow": "TU ÚNICO VIAJE AL SÚPER", "title": "Lista de compras", "note": "La sal, la pimienta y el aceite de oliva se consideran básicos que ya tienes en casa, por eso no están en la lista.", "categories": [{"name": "Verduras y frutas", "items": ["4-5 cebollas amarillas", "2 cabezas de ajo", "4 limones", "3 tomates", "1 pimiento verde", "1 pepino", "Perejil fresco (opcional)", "Encurtidos (opcional)"]}, {"name": "Lácteos y refrigerador", "items": ["Mantequilla", "Yogur natural"]}, {"name": "Proteína", "items": ["500g de carne molida", "4 pechugas de pollo", "500g de camarón", "4 muslos de pollo", "4 filetes de pescado blanco o salmón", "500g de pavo molido", "500g de hígado de res o de pollo"]}, {"name": "Despensa", "items": ["Arroz (unas 2 tazas)", "1 lata de tomate triturado", "Salsa de tomate", "Tahini", "Pan árabe", "Especias: comino, cilantro seco, páprika, especias mixtas, canela, chile seco en hojuelas"]}]}, "recipes": [{"title": "Dawood Basha (Albóndigas en Salsa de Tomate)", "time": "30 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de carne molida", "1 cebolla rallada", "2 dientes de ajo, picados", "1 lata de tomate triturado", "1 cda de salsa de tomate", "1 cdta de comino", "1 cdta de especias mixtas", "Sal y pimienta negra", "2 cdas de aceite", "Arroz, para servir"], "steps": ["Mezcla la carne con la cebolla rallada, el ajo, el comino, las especias, la sal y la pimienta; forma bolitas pequeñas.", "Calienta el aceite en un sartén y dora las albóndigas 5–6 min, volteándolas mientras se cocinan.", "Agrega el tomate triturado, la salsa de tomate y 1 taza de agua; deja cocinar a fuego lento 12–15 min hasta que la salsa espese.", "Sirve caliente sobre arroz."], "swap": "El cordero o el pavo molido también funcionan bien. Una pizca de canela le da más profundidad.", "leftover": "Rellena pan árabe con un poco de tahini al día siguiente — sabe todavía mejor."}, {"title": "Shawarma de Pollo en Sartén", "time": "25 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["4 pechugas de pollo, en tiras finas", "2 cdas de especias para shawarma", "3 dientes de ajo, picados", "Jugo de 1 limón", "2 cdas de aceite", "1 taza de arroz cocido", "Tomate y pepino en rodajas, para servir"], "steps": ["Mezcla el pollo con las especias para shawarma, el ajo, el jugo de limón y el aceite; deja reposar 5 min mientras se calienta el sartén.", "Calienta el sartén a fuego alto; cocina el pollo 6–8 min, moviendo, hasta que se dore y esté bien cocido.", "Sirve sobre arroz con tomate y pepino, y un poco de salsa tahini si gustas."], "swap": "La misma mezcla de especias funciona con camarón o pavo molido — reduce el tiempo del camarón a 3 min.", "leftover": "Envuelve en pan árabe con encurtidos al día siguiente para un almuerzo rápido."}, {"title": "Camarones al Ajo y Comino", "time": "15 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de camarón pelado", "3 cdas de mantequilla", "4 dientes de ajo, picados", "1 cdta de comino", "1/2 cdta de páprika", "Jugo de 1 limón", "1 taza de arroz cocido", "Perejil picado (opcional)"], "steps": ["Derrite la mantequilla en un sartén a fuego medio-alto.", "Agrega el ajo, el comino y la páprika; cocina 30 seg hasta que aromatice.", "Agrega el camarón; cocina 2–3 min por lado hasta que esté rosado.", "Agrega el jugo de limón y sirve sobre arroz con perejil."], "swap": "Tiras de pollo también funcionan — solo cocina 6–7 min por lado.", "leftover": "Recalienta suavemente en sartén — el microondas deja el camarón chicloso."}, {"title": "Pollo al Horno con Cebolla y Tomate", "time": "35 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 muslos de pollo", "2 cebollas, en rodajas", "2 tomates, en rodajas", "3 dientes de ajo, picados", "1 cdta de especias mixtas", "1 cdta de comino", "3 cdas de aceite", "Sal y pimienta"], "steps": ["Precalienta el horno a 220°C.", "Mezcla la cebolla y el tomate en rodajas con 1 cda de aceite y la mitad de las especias en la bandeja.", "Unta el pollo con el aceite y las especias restantes; acomódalo en la bandeja.", "Hornea 30–35 min, hasta que el pollo esté bien cocido y dorado."], "swap": "¿Sin bandeja apta para horno? Dora el pollo en sartén 6–7 min por lado y cocina la cebolla y el tomate aparte.", "leftover": "Deshebra el pollo y mézclalo con la cebolla y el tomate asados sobre arroz al día siguiente."}, {"title": "Pescado al Horno con Salsa Tahini", "time": "25 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 filetes de pescado blanco (o salmón)", "1 cebolla, en rodajas finas", "1/2 taza de tahini", "Jugo de 1 limón", "2 dientes de ajo, picados", "1/4 taza de agua", "2 cdas de aceite", "Sal, pimienta y perejil picado"], "steps": ["Precalienta el horno a 200°C. Mezcla el tahini con el jugo de limón, el ajo, el agua y la sal hasta que quede tersa.", "Coloca las rodajas de cebolla en una bandeja, cubre con el pescado y sazona con sal, pimienta y aceite.", "Baña el pescado con la salsa tahini y hornea 18–20 min, hasta que se desmenuce fácilmente.", "Espolvorea perejil antes de servir."], "swap": "El salmón también queda delicioso aquí, con el mismo tiempo de cocción.", "leftover": "Desmenúzalo en un bowl de arroz con un poco más de tahini para un almuerzo rápido al día siguiente."}, {"title": "Sartén de Kofta de Pavo", "time": "20 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de pavo molido", "1/2 cebolla rallada", "2 dientes de ajo, picados", "1 cdta de comino", "1 cdta de cilantro seco", "Una pizca de canela", "Sal y pimienta", "2 cdas de aceite", "Pan árabe y salsa de yogur, para servir"], "steps": ["Mezcla el pavo con la cebolla rallada, el ajo, las especias, la sal y la pimienta; forma discos aplanados.", "Calienta el aceite en un sartén y cocina 4–5 min por lado, hasta dorar y cocinar por completo.", "Sirve en pan árabe tibio con salsa de yogur, tomate y encurtidos."], "swap": "Carne molida, pollo o incluso una opción vegetal funcionan igual de bien.", "leftover": "Pica y agrega a un bowl de arroz o ensalada al día siguiente."}, {"title": "Hígado Alejandrino al Ajo", "time": "15 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de hígado de res o de pollo, en rebanadas finas", "4 dientes de ajo, picados", "1 cdta de comino", "1/2 cdta de chile seco en hojuelas", "1 pimiento verde, en tiras", "3 cdas de aceite", "Sal y pimienta", "Jugo de 1/2 limón", "Pan, para servir"], "steps": ["Calienta el aceite en un sartén a fuego alto.", "Agrega el hígado; sella 2 min por lado hasta dorar por fuera y quedar tierno por dentro.", "Agrega el ajo, el comino, el chile en hojuelas y el pimiento; cocina 2 min más.", "Apaga el fuego, agrega el jugo de limón, la sal y la pimienta, y sirve caliente con pan."], "swap": "El hígado de pollo se cocina más rápido que el de res — vigílalo para que no quede duro.", "leftover": "Es mejor recién hecho, pero también se convierte en un gran sándwich frío al día siguiente."}], "bonus": {"eyebrow": "EXTRA", "title": "Guía de congelación y sobras", "items": ["El Dawood Basha y la kofta de pavo se congelan bien hasta por 2 meses — porciona antes de congelar.", "El arroz se congela muy bien: repártelo en bolsas planas y caliéntalo directo del congelador con un poco de agua.", "El camarón y el pescado se recalientan mejor en sartén a fuego bajo, no en el microondas.", "Las verduras que sobren de cualquier noche se pueden licuar con caldo para una sopa rápida."]}, "closing": {"title": "¡Listo!", "body": "Siete cenas árabes, un solo viaje al súper, cero tiempo parada frente al refrigerador. Guarda esta guía en algún lugar donde realmente la veas, y úsala cualquier semana que quieras recuperar tus noches.", "madeBy": "HECHO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Preparación", "swap": "Sustitución", "leftover": "Tip de sobras", "day": "Día"}}, "fr": {"dir": "ltr", "meta": {"htmlLang": "fr", "pageTitle": "Le Plan de Dîners Orientaux Sans Prise de Tête sur 7 Jours"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UN GUIDE DE RECETTES GRATUIT", "title1": "LE PLAN DE DÎNERS", "accent": "Sans Prise de Tête", "title2": "ORIENTAUX SUR 7 JOURS", "subtitle": "Arrête de rester plantée devant le frigo sans savoir quoi préparer. Commence à manger de la vraie cuisine orientale maison ce soir.", "footer": "7 VRAIS DÎNERS · 1 LISTE DE COURSES · ZÉRO HÉSITATION"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Pourquoi « qu'est-ce que je fais ce soir ? » épuise autant", "p": ["Il est 18h. Tu es fatiguée. Tu ouvres le frigo, tu le fixes, tu le refermes, et tu n'as toujours aucune idée de quoi préparer. Ce n'est pas un problème de cuisine — c'est un problème de décision. Après une journée entière remplie de choix, ton cerveau n'a plus l'énergie de planifier un repas à partir de rien.", "Ce plan supprime complètement la décision. Sept vrais dîners orientaux, organisés dans l'ordre, avec une seule liste de courses que tu achètes en une fois. Tu ne passeras plus la semaine à te demander quoi préparer — il te suffit d'ouvrir ce guide et de cuisiner."], "rules": ["30 minutes ou moins, du début à la fin", "Des ingrédients du quotidien, disponibles partout", "Un minimum de vaisselle — la plupart des soirs, une seule poêle"]}, "howto": {"eyebrow": "COMMENT UTILISER CE PLAN", "title": "Quatre étapes. C'est tout.", "steps": [{"title": "Fais les courses une seule fois", "body": "Utilise la liste regroupée à la page suivante — les 7 dîners, en un seul passage, organisée par rayon."}, {"title": "Cuisine dans l'ordre que tu veux", "body": "Les jours sont numérotés pour l'organisation, pas pour l'obligation. Garde la recette la plus rapide pour ton soir le plus chargé."}, {"title": "Utilise les astuces de substitution", "body": "Chaque recette s'adapte à tes besoins alimentaires ou à la protéine que tu as sous la main ou en promotion."}, {"title": "Ne gaspille pas les restes", "body": "Chaque recette inclut une suggestion toute prête pour les restes du lendemain."}]}, "shopping": {"eyebrow": "TON SEUL PASSAGE AU SUPERMARCHÉ", "title": "Liste de courses", "note": "Le sel, le poivre et l'huile d'olive sont considérés comme des basiques que tu as déjà — ils ne sont donc pas listés ci-dessous.", "categories": [{"name": "Fruits et légumes", "items": ["4-5 oignons jaunes", "2 têtes d'ail", "4 citrons", "3 tomates", "1 poivron vert", "1 concombre", "Persil frais (facultatif)", "Cornichons (facultatif)"]}, {"name": "Produits laitiers", "items": ["Beurre", "Yaourt nature"]}, {"name": "Protéines", "items": ["500g de bœuf haché", "4 blancs de poulet", "500g de crevettes", "4 hauts de cuisse de poulet", "4 filets de poisson blanc ou de saumon", "500g de dinde hachée", "500g de foie de bœuf ou de volaille"]}, {"name": "Épicerie", "items": ["Riz (environ 2 tasses)", "1 boîte de tomates concassées", "Sauce tomate", "Tahini", "Pain pita", "Épices : cumin, coriandre séchée, paprika, mélange d'épices, cannelle, piment séché en flocons"]}]}, "recipes": [{"title": "Dawood Basha (Boulettes de Viande à la Sauce Tomate)", "time": "30 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de bœuf haché", "1 oignon, râpé", "2 gousses d'ail, hachées", "1 boîte de tomates concassées", "1 c. à soupe de sauce tomate", "1 c. à café de cumin", "1 c. à café de mélange d'épices", "Sel et poivre noir", "2 c. à soupe d'huile", "Riz, pour servir"], "steps": ["Mélange le bœuf avec l'oignon râpé, l'ail, le cumin, les épices, le sel et le poivre ; forme de petites boulettes.", "Fais chauffer l'huile dans une poêle et fais dorer les boulettes 5–6 min, en les retournant.", "Ajoute les tomates concassées, la sauce tomate et 1 tasse d'eau ; laisse mijoter 12–15 min jusqu'à ce que la sauce épaississe.", "Sers chaud sur du riz."], "swap": "L'agneau haché ou la dinde hachée fonctionnent bien aussi. Une pincée de cannelle apporte plus de profondeur.", "leftover": "Fourre dans un pain pita avec un filet de tahini le lendemain — c'est encore meilleur."}, {"title": "Poêlée de Poulet Shawarma", "time": "25 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["4 blancs de poulet, en fines lanières", "2 c. à soupe d'épices à shawarma", "3 gousses d'ail, hachées", "Jus d'1 citron", "2 c. à soupe d'huile", "1 tasse de riz cuit", "Tomate et concombre en tranches, pour servir"], "steps": ["Mélange le poulet avec les épices à shawarma, l'ail, le jus de citron et l'huile ; laisse reposer 5 min pendant que la poêle chauffe.", "Fais chauffer une poêle à feu vif ; fais cuire le poulet 6–8 min, en remuant, jusqu'à ce qu'il soit doré et bien cuit.", "Sers sur du riz avec tomate et concombre, et un filet de sauce tahini si tu veux."], "swap": "Le même mélange d'épices fonctionne avec des crevettes ou de la dinde hachée — réduis la cuisson des crevettes à 3 min.", "leftover": "Enroule dans du pain pita avec des cornichons le lendemain pour un déjeuner rapide."}, {"title": "Poêlée de Crevettes à l'Ail et au Cumin", "time": "15 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de crevettes décortiquées", "3 c. à soupe de beurre", "4 gousses d'ail, hachées", "1 c. à café de cumin", "1/2 c. à café de paprika", "Jus d'1 citron", "1 tasse de riz cuit", "Persil haché (facultatif)"], "steps": ["Fais fondre le beurre dans une poêle à feu moyen-vif.", "Ajoute l'ail, le cumin et le paprika ; fais cuire 30 sec jusqu'à ce que ça embaume.", "Ajoute les crevettes ; fais cuire 2–3 min de chaque côté jusqu'à ce qu'elles soient roses.", "Incorpore le jus de citron et sers sur du riz avec du persil."], "swap": "Des lanières de poulet fonctionnent aussi — fais-les juste cuire 6–7 min de chaque côté.", "leftover": "Réchauffe doucement à la poêle — le micro-ondes rend les crevettes caoutchouteuses."}, {"title": "Poulet au Four à l'Oignon et à la Tomate", "time": "35 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 hauts de cuisse de poulet", "2 oignons, en tranches", "2 tomates, en tranches", "3 gousses d'ail, hachées", "1 c. à café de mélange d'épices", "1 c. à café de cumin", "3 c. à soupe d'huile", "Sel et poivre"], "steps": ["Préchauffe le four à 220°C.", "Mélange l'oignon et la tomate en tranches avec 1 c. à soupe d'huile et la moitié des épices sur la plaque.", "Enduis le poulet avec le reste de l'huile et des épices ; place-le sur la plaque.", "Fais cuire 30–35 min, jusqu'à ce que le poulet soit bien cuit et doré."], "swap": "Pas de plaque allant au four ? Fais dorer le poulet à la poêle 6–7 min de chaque côté et fais cuire l'oignon et la tomate séparément.", "leftover": "Effiloche le poulet et mélange-le avec l'oignon et la tomate rôtis sur du riz le lendemain."}, {"title": "Poisson au Four, Sauce Tahini", "time": "25 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 filets de poisson blanc (ou saumon)", "1 oignon, en fines tranches", "1/2 tasse de tahini", "Jus d'1 citron", "2 gousses d'ail, hachées", "1/4 tasse d'eau", "2 c. à soupe d'huile", "Sel, poivre et persil haché"], "steps": ["Préchauffe le four à 200°C. Fouette le tahini avec le jus de citron, l'ail, l'eau et le sel jusqu'à consistance lisse.", "Dispose les tranches d'oignon sur une plaque, recouvre avec le poisson et assaisonne de sel, poivre et huile.", "Nappe le poisson de sauce tahini et fais cuire 18–20 min, jusqu'à ce qu'il s'effeuille facilement.", "Parsème de persil avant de servir."], "swap": "Le saumon est délicieux ici aussi, avec le même temps de cuisson.", "leftover": "Émiette dans un bol de riz avec un peu plus de tahini pour un déjeuner rapide le lendemain."}, {"title": "Poêlée de Kofta de Dinde", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de dinde hachée", "1/2 oignon, râpé", "2 gousses d'ail, hachées", "1 c. à café de cumin", "1 c. à café de coriandre séchée", "Une pincée de cannelle", "Sel et poivre", "2 c. à soupe d'huile", "Pain pita et sauce au yaourt, pour servir"], "steps": ["Mélange la dinde avec l'oignon râpé, l'ail, les épices, le sel et le poivre ; forme des galettes plates.", "Fais chauffer l'huile dans une poêle et fais cuire 4–5 min de chaque côté, jusqu'à ce que ce soit doré et bien cuit.", "Sers dans un pain pita tiède avec sauce au yaourt, tomate et cornichons."], "swap": "Le bœuf haché, le poulet ou même une option végétale fonctionnent tout aussi bien.", "leftover": "Coupe en morceaux et ajoute à un bol de riz ou une salade le lendemain."}, {"title": "Foie à l'Alexandrine, à l'Ail", "time": "15 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de foie de bœuf ou de volaille, en fines tranches", "4 gousses d'ail, hachées", "1 c. à café de cumin", "1/2 c. à café de piment séché en flocons", "1 poivron vert, en tranches", "3 c. à soupe d'huile", "Sel et poivre", "Jus d'1/2 citron", "Pain, pour servir"], "steps": ["Fais chauffer l'huile dans une poêle à feu vif.", "Ajoute le foie ; saisis 2 min de chaque côté jusqu'à ce qu'il soit doré à l'extérieur et encore tendre à l'intérieur.", "Ajoute l'ail, le cumin, le piment en flocons et le poivron ; fais cuire 2 min de plus.", "Éteins le feu, incorpore le jus de citron, le sel et le poivre, et sers chaud avec du pain."], "swap": "Le foie de volaille cuit plus vite que celui de bœuf — surveille-le pour qu'il ne devienne pas dur.", "leftover": "Meilleur frais, mais il fait aussi un excellent sandwich froid le lendemain."}], "bonus": {"eyebrow": "EN BONUS", "title": "Guide de congélation et de restes", "items": ["Le Dawood Basha et la kofta de dinde se congèlent bien jusqu'à 2 mois — portionne avant de congeler.", "Le riz se congèle très bien : répartis-le dans des sachets à plat, et réchauffe-le congelé avec un peu d'eau.", "Les crevettes et le poisson se réchauffent mieux à la poêle à feu doux, pas au micro-ondes.", "Les légumes restants de n'importe quelle soirée peuvent être mixés avec du bouillon pour une soupe rapide."]}, "closing": {"title": "Et voilà !", "body": "Sept dîners orientaux, un seul passage au supermarché, zéro minute plantée devant le frigo. Garde ce guide quelque part où tu le verras vraiment, et réutilise-le chaque semaine où tu veux retrouver tes soirées.", "madeBy": "CRÉÉ PAR @SARA.ALARABY"}, "labels": {"ingredients": "Ingrédients", "instructions": "Préparation", "swap": "Substitution", "leftover": "Astuce restes", "day": "Jour"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena Mediorientale di 7 Giorni Senza Pensieri"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA", "title1": "IL PIANO CENA", "accent": "Mediorientale", "title2": "SENZA PENSIERI, 7 GIORNI", "subtitle": "Basta stare davanti al frigo chiedendoti cosa preparare. Inizia stasera con vero cibo mediorientale fatto in casa.", "footer": "7 CENE VERE · 1 LISTA DELLA SPESA · ZERO INDECISIONE"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Perché \"cosa preparo stasera?\" è così estenuante", "p": ["Sono le 18. Sei stanca. Apri il frigo, lo fissi, lo richiudi, e ancora non hai idea di cosa preparare. Non è un problema di cucina — è un problema di decisioni. Dopo una giornata intera di scelte, il tuo cervello non ha più energie per pianificare un pasto da zero.", "Questo piano elimina la decisione del tutto. Sette vere cene mediorientali, organizzate in ordine, con un'unica lista della spesa da comprare una volta sola. Non passerai la settimana a chiederti cosa c'è per cena — apri semplicemente questa guida e cucini."], "rules": ["30 minuti o meno, dall'inizio alla fine", "Ingredienti di uso quotidiano, disponibili in qualsiasi supermercato", "Pulizia minima — quasi sempre una sola padella"]}, "howto": {"eyebrow": "COME USARE QUESTO PIANO", "title": "Quattro passaggi. Tutto qui.", "steps": [{"title": "Fai la spesa una volta", "body": "Usa la lista unica nella pagina successiva — tutte e 7 le cene, un solo giro, organizzata per reparto."}, {"title": "Cucina nell'ordine che vuoi", "body": "I giorni sono numerati per comodità, non per obbligo. Tieni la ricetta più veloce per la sera più impegnata."}, {"title": "Usa i consigli per le sostituzioni", "body": "Ogni ricetta si adatta a esigenze alimentari diverse o a qualunque proteina tu abbia in casa o in offerta."}, {"title": "Non sprecare gli avanzi", "body": "Ogni ricetta include un'idea già pronta per riutilizzare gli avanzi il giorno dopo."}]}, "shopping": {"eyebrow": "IL TUO UNICO GIRO", "title": "Lista della spesa", "note": "Sale, pepe e olio d'oliva sono considerati basi di dispensa e non sono elencati qui sotto.", "categories": [{"name": "Frutta e verdura", "items": ["4-5 cipolle dorate", "2 teste d'aglio", "4 limoni", "3 pomodori", "1 peperone verde", "1 cetriolo", "Prezzemolo fresco (facoltativo)", "Sottaceti (facoltativo)"]}, {"name": "Latticini e frigo", "items": ["Burro", "Yogurt bianco naturale"]}, {"name": "Proteine", "items": ["450 g di carne macinata di manzo", "4 petti di pollo", "450 g di gamberi", "4 cosce di pollo", "4 filetti di pesce bianco o salmone", "450 g di tacchino macinato", "450 g di fegato di manzo o pollo"]}, {"name": "Dispensa", "items": ["Riso (circa 2 tazze)", "1 lattina di pomodori pelati", "Salsa di pomodoro", "Tahina", "Pita o pane piatto", "Spezie: cumino, coriandolo essiccato, paprika, miscela di sette spezie, cannella, peperoncino in scaglie essiccato"]}]}, "recipes": [{"title": "Dawood Basha (Polpette al Sugo di Pomodoro)", "time": "30 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["450 g di carne macinata di manzo", "1 cipolla, grattugiata", "2 spicchi d'aglio, tritati", "1 lattina di pomodori pelati", "1 cucchiaio di salsa di pomodoro", "1 cucchiaino di cumino", "1 cucchiaino di miscela di sette spezie", "Sale e pepe nero", "2 cucchiai di olio", "Riso, per servire"], "steps": ["Mescola il manzo con la cipolla grattugiata, l'aglio, il cumino, le spezie, sale e pepe; forma delle piccole polpette.", "Scalda l'olio in padella e rosola le polpette 5–6 min, girandole durante la cottura.", "Aggiungi i pomodori pelati, la salsa di pomodoro e 250 ml di acqua; cuoci a fuoco lento 12–15 min finché il sugo si addensa.", "Servi caldo sopra il riso."], "swap": "Vanno bene anche agnello o tacchino macinati. Un pizzico di cannella dà una marcia in più.", "leftover": "Il giorno dopo, mettile in una pita con un filo di tahina — sono ancora più buone."}, {"title": "Ciotola di Shawarma di Pollo in Padella", "time": "25 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["4 petti di pollo, a fette sottili", "2 cucchiai di miscela di spezie per shawarma", "3 spicchi d'aglio, tritati", "Succo di 1 limone", "2 cucchiai di olio", "1 tazza di riso cotto", "Pomodoro e cetriolo a fette, per servire"], "steps": ["Condisci il pollo con le spezie per shawarma, l'aglio, il succo di limone e l'olio; lascia riposare 5 min mentre la padella si scalda.", "Scalda una padella a fuoco alto; cuoci il pollo 6–8 min, mescolando, finché è ben rosolato e cotto.", "Servi sopra il riso con pomodoro e cetriolo, e un filo di salsa tahina se ti va."], "swap": "La stessa m     var div = document.createElement('div');
    div.className = 'sara-msg' + (isUser ? ' user' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderNode(nodeId){
    var node = TREE[nodeId];
    addMsg(pick(node.msg), false);
    optionsEl.innerHTML = '';
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'sara-opt-btn' + (opt.wa ? ' wa' : '');
      btn.textContent = pick(opt.label);
      btn.addEventListener('click', function(){ handleOption(opt, nodeId); });
      optionsEl.appendChild(btn);
    });
  }

  function handleOption(opt, fromNode){
    if (!opt.back) addMsg(pick(opt.label), true);
    if (opt.wa) {
      window.open(waLink(currentLang()), '_blank');
      return;
    }
    if (opt.link) {
      window.location.href = opt.link;
      return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

  function openPanel(){
    panel.classList.add('open');
    document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
    if (!messagesEl.hasChildNodes()) {
      history = ["root"];
      renderNode("root");
    }
  }

  function init(){
    fab = document.getElementById('saraFab');
    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<!-- =================== END SARA ASSISTANT WIDGET =================== -->
