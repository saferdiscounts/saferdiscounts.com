o vintes» (quatre-vingts), e o 90 é literalmente «quatro vintes e dez» (quatre-vingt-dix). É um sistema antigo que ainda se usa em França (ao contrário da Bélgica e da Suíça, que têm palavras diretas).</em>", "italic": true}], "tip": false}, {"title": "Dias da semana e meses", "blocks": [{"type": "table", "headers": ["Dia", "Francês"], "rows": [[{"t": "segunda", "b": false}, {"t": "lundi", "b": false}], [{"t": "terça", "b": false}, {"t": "mardi", "b": false}], [{"t": "quarta", "b": false}, {"t": "mercredi", "b": false}], [{"t": "quinta", "b": false}, {"t": "jeudi", "b": false}], [{"t": "sexta", "b": false}, {"t": "vendredi", "b": false}], [{"t": "sábado", "b": false}, {"t": "samedi", "b": false}], [{"t": "domingo", "b": false}, {"t": "dimanche", "b": false}]]}, {"type": "h3", "text": "<strong>Meses</strong>"}, {"type": "table", "headers": ["Mês", "Francês", "Mês", "Francês"], "rows": [[{"t": "janeiro", "b": false}, {"t": "janvier", "b": false}, {"t": "julho", "b": false}, {"t": "juillet", "b": false}], [{"t": "fevereiro", "b": false}, {"t": "février", "b": false}, {"t": "agosto", "b": false}, {"t": "août", "b": false}], [{"t": "março", "b": false}, {"t": "mars", "b": false}, {"t": "setembro", "b": false}, {"t": "septembre", "b": false}], [{"t": "abril", "b": false}, {"t": "avril", "b": false}, {"t": "outubro", "b": false}, {"t": "octobre", "b": false}], [{"t": "maio", "b": false}, {"t": "mai", "b": false}, {"t": "novembro", "b": false}, {"t": "novembre", "b": false}], [{"t": "junho", "b": false}, {"t": "juin", "b": false}, {"t": "dezembro", "b": false}, {"t": "décembre", "b": false}]]}], "tip": false}, {"title": "Cores", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "vermelho", "b": false}, {"t": "ruj", "b": false}, {"t": "<strong>rouge</strong>", "b": true}], [{"t": "azul", "b": false}, {"t": "blö", "b": false}, {"t": "<strong>bleu</strong>", "b": true}], [{"t": "verde", "b": false}, {"t": "ver", "b": false}, {"t": , [{"t": "tio", "b": false}, {"t": "õkl", "b": false}, {"t": "<strong>oncle</strong>", "b": true}], [{"t": "tia", "b": false}, {"t": "tãt", "b": false}, {"t": "<strong>tante</strong>", "b": true}]]}], "tip": false}, {"title": "Comida e bebida", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "pão", "b": false}, {"t": "pã", "b": false}, {"t": "<strong>pain</strong>", "b": true}], [{"t": "água", "b": false}, {"t": "ô", "b": false}, {"t": "<strong>eau</strong>", "b": true}], [{"t": "café", "b": false}, {"t": "kafé", "b": false}, {"t": "<strong>café</strong>", "b": true}], [{"t": "chá", "b": false}, {"t": "té", "b": false}, {"t": "<strong>thé</strong>", "b": true}], [{"t": "carne", "b": false}, {"t": "viãd", "b": false}, {"t": "<strong>viande</strong>", "b": true}], [{"t": "frango", "b": false}, {"t": "pulé", "b": false}, {"t": "<strong>poulet</strong>", "b": true}], [{"t": "peixe", "b": false}, {"t": "puasõ", "b": false}, {"t": "<strong>poisson</strong>", "b": true}], [{"t": "queijo", "b": false}, {"t": "fromaj", "b": false}, {"t": "<strong>fromage</strong>", "b": true}], [{"t": "fruta", "b": false}, {"t": "früi", "b": false}, {"t": "<strong>fruit</strong>", "b": true}], [{"t": "vegetais", "b": false}, {"t": "légüm", "b": false}, {"t": "<strong>légumes</strong>", "b": true}], [{"t": "sobremesa", "b": false}, {"t": "désser", "b": false}, {"t": "<strong>dessert</strong>", "b": true}], [{"t": "pequeno-almoço", "b": false}, {"t": "pöti déjöné", "b": false}, {"t": "<strong>petit-déjeuner</strong>", "b": true}], [{"t": "almoço", "b": false}, {"t": "déjöné", "b": false}, {"t": "<strong>déjeuner</strong>", "b": true}], [{"t": "jantar", "b": false}, {"t": "diné", "b": false}, {"t": "<strong>dîner</strong>", "b": true}]]}], "tip": false}, {"title": "Frases essenciais para viagens e hotéis", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "Onde está...?", "b": false}, {"t": "u sö truv", "b": false}, {"t": "<strong>Où se trouve...?</strong>", "b": true}], [{"t": "Quanto custa isto?", "b": false}, {"t": "kombiã sa kut", "b": false}, {"t": "<strong>Combien ça coûte?</strong>", "b": true}], [{"t": "Posso ver o menu?", "b": false}, {"t": "jö pö vuar lö menü", "b": false}, {"t": "<strong>Je peux voir le menu?</strong>", "b": true}], [{"t": "A conta, por favor", "b": false}, {"t": "ladisiõ sil vu ple", "b": false}, {"t": "<strong>L'addition, s'il vous plaît</strong>", "b": true}], [{"t": "Onde é a casa de banho?", "b": false}, {"t": "u sõ le tualet", "b": false}, {"t": "<strong>Où sont les toilettes?</strong>", "b": true}], [{"t": "Preciso de ajuda", "b": false}, {"t": "jé bözuã déd", "b": false}, {"t": "<strong>J'ai besoin d'aide</strong>", "b": true}], [{"t": "Não percebo", "b": false}, {"t": "jö nö kompró pa", "b": false}, {"t": "<strong>Je ne comprends pas</strong>", "b": true}], [{"t": "Pode repetir, por favor?", "b": false}, {"t": "puvé vu répété", "b": false}, {"t": "<strong>Pouvez-vous répéter, s'il vous plaît?</strong>", "b": true}], [{"t": "Fala inglês?", "b": false}, {"t": "parlé vu ãglé", "b": false}, {"t": "<strong>Parlez-vous anglais?</strong>", "b": true}], [{"t": "Quero reservar um quarto", "b": false}, {"t": "jö vudré rézervé ün shãbr", "b": false}, {"t": "<strong>Je voudrais réserver une chambre</strong>", "b": true}], [{"t": "A que horas parte o comboio?", "b": false}, {"t": "a kel ör par lö trã", "b": false}, {"t": "<strong>À quelle heure part le train?</strong>", "b": true}], [{"t": "Onde posso apanhar um táxi?", "b": false}, {"t": "u püij prãdr ãn taxi", "b": false}, {"t": "<strong>Où puis-je prendre un taxi?</strong>", "b": true}]]}], "tip": false}, {"title": "Expressões e gírias francesas autênticas", "blocks": [{"type": "p", "html": "Estas expressões são as que separam quem fala francês «correto» de quem soa verdadeiramente francês. Usa-as no contexto certo e vais ver a reação das pessoas mudar completamente:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Expressão"], "rows": [[{"t": "Combinado/está bem", "b": false}, {"t": "sa marsh", "b": false}, {"t": "<strong>Ça marche</strong>", "b": true}], [{"t": "Fantástico!", "b": false}, {"t": "jénial", "b": false}, {"t": "<strong>Génial!</strong>", "b": true}], [{"t": "Sinceramente (muleta de fala muito comum)", "b": false}, {"t": "frãshmã", "b": false}, {"t": "<strong>Franchement</strong>", "b": true}], [{"t": "Coisa (palavra genérica para qualquer coisa)", "b": false}, {"t": "trük", "b": false}, {"t": "<strong>Truc</strong>", "b": true}], [{"t": "Sei lá/não me interessa (expressão de indiferença famosa)", "b": false}, {"t": "bof", "b": false}, {"t": "<strong>Bof</strong>", "b": true}], [{"t": "Não faz mal", "b": false}, {"t": "sé pa grav", "b": false}, {"t": "<strong>C'est pas grave</strong>", "b": true}], [{"t": "Por isso (conector muito usado entre os jovens)", "b": false}, {"t": "dü ku", "b": false}, {"t": "<strong>Du coup</strong>", "b": true}]]}], "tip": false}, {"title": "Diálogo prático completo", "blocks": [{"type": "p", "html": "Um diálogo simples num café — lê em voz alta várias vezes e tenta imitar a pronúncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "Bonjour! Bienvenue. Qu'est-ce que vous voulez?", "trans": "Olá! Bem-vindo. O que deseja?"}, {"speaker": "Cliente:", "orig": "Bonjour! Je voudrais un café, s'il vous plaît.", "trans": "Olá! Queria um café, por favor."}, {"speaker": "Empregado:", "orig": "C'est tout?", "trans": "Só isso?"}, {"speaker": "Cliente:", "orig": "Oui, et l'addition, s'il vous plaît.", "trans": "Sim, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "Ça fait deux euros. Merci!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "De rien, à bientôt!", "trans": "De nada, até breve!"}]}], "tip": false}, {"title": "Plano de ação: como aprender rápido", "blocks": [{"type": "list", "label": "<strong>7 passos para fixar a língua rapidamente</strong>", "intro": null, "items": ["Ouve música e séries francesas todos os dias, nem que sejam 10 minutos — o ouvido adapta-se ao ritmo antes da mente.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo e velocidade.", "Aproveita a vantagem que já tens com os sons nasais e o «r» gutural — já os conheces do português!", "Não traduzas na tua cabeça — tenta pensar diretamente na palavra francesa em vez de passares primeiro pelo português.", "Usa uma aplicação como o Duolingo ou o Babbel junto com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo com erros — a fluência vem da prática, não da memorização.", "Pratica a «Liaison» lendo frases completas em voz alta, para te habituares a ligar as palavras."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Francês — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível em que realmente consigas desenrascar-te em viagens, no trabalho e no dia a dia em França, este livro vai dar-te: os tempos verbais que precisas, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "<strong>Antes de começares</strong>", "intro": null, "items": ["Deves já saber: cumprimentos, pronomes, o verbo être, a conjugação do presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenrascares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de avançares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["je", "tu", "il/elle", "nous", "vous/ils"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vós/eles", "b": false}]]}, {"type": "h3", "text": "<strong>Presente — os padrões regulares</strong>"}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": false}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": false}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": false}]]}, {"type": "h3", "text": "<strong>être (presente)</strong>"}, {"type": "table", "headers": ["Pronome", "être"], "rows": [[{"t": "je", "b": false}, {"t": "suis", "b": false}], [{"t": "il/elle", "b": false}, {"t": "est", "b": false}], [{"t": "nous", "b": false}, {"t": "sommes", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "sont", "b": false}]]}], "tip": false}, {"title": "O passado composto (Passé Composé)", "blocks": [{"type": "p", "html": "Este é o tempo básico do passado no francês falado, formado por um verbo auxiliar (Avoir ou être) no presente + o particípio passado — exatamente a mesma ideia do italiano.", "italic": false}, {"type": "h3", "text": "<strong>Com Avoir (para a maioria dos verbos)</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": "je", "b": false}, {"t": "ai parlé (falei)", "b": false}], [{"t": "tu", "b": false}, {"t": "as parlé", "b": false}], [{"t": "il/elle", "b": false}, {"t": "a parlé", "b": false}], [{"t": "nous", "b": false}, {"t": "avons parlé", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "ont parlé", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "Com être (verbos de movimento e reflexivos)", "trans": "Muito importante: com être, o particípio passado tem de concordar em género e número com o sujeito, tal como um adjetivo. Entre os verbos de movimento mais comuns que usam être estão: aller (ir), venir (vir), partir (partir), arriver (chegar), entrer (entrar), sortir (sair), monter (subir), descendre (descer), naître (nascer), mourir (morrer), rester (ficar), tomber (cair)."}]}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": "je (homem)", "b": false}, {"t": "suis allé (fui)", "b": false}], [{"t": "je (mulher)", "b": false}, {"t": "suis allée", "b": false}], [{"t": "il", "b": false}, {"t": "est allé", "b": false}], [{"t": "elle", "b": false}, {"t": "est allée", "b": false}], [{"t": "nous (masc./misto)", "b": false}, {"t": "sommes allés", "b": false}]]}, {"type": "p", "html": "<em>Os restantes verbos usam Avoir como habitualmente.</em>", "italic": true}], "tip": false}, {"title": "O pretérito imperfeito (Imparfait)", "blocks": [{"type": "p", "html": "Usa-se para descrever algo que acontecia repetidamente ou de forma contínua no passado — não um evento único e terminado, mas um hábito ou a descrição de um estado. Uma coisa bastante simpática no francês: o verbo être é o único verbo irregular neste tempo!", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)", "être (o único irregular)"], "rows": [[{"t": "je", "b": false}, {"t": "finissais", "b": false}, {"t": "parlais", "b": false}, {"t": "étais", "b": false}], [{"t": "il/elle", "b": false}, {"t": "finissait", "b": false}, {"t": "parlait", "b": false}, {"t": "était", "b": false}], [{"t": "nous", "b": false}, {"t": "finissions", "b": false}, {"t": "parlions", "b": false}, {"t": "étions", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "finissaient", "b": false}, {"t": "parlaient", "b": false}, {"t": "étaient", "b": false}]]}, {"type": "p", "html": "Regra de formação: pega na forma «nous» do presente, tira o «-ons», e acrescenta as terminações do Imparfait (ais, ais, ait, ions, iez, aient). Exemplo: Quand j'étais enfant, j'habitais au Caire. (Quando era criança, vivia no Cairo)", "italic": false}], "tip": false}, {"title": "O futuro, o futuro próximo e o condicional", "blocks": [{"type": "h3", "text": "<strong>Futuro próximo (o mais fácil e o mais usado ao falar) — Aller + infinitivo</strong>"}, {"type": "table", "headers": ["Pronome", "Exemplo"], "rows": [[{"t": "je", "b": false}, {"t": "vais parler (vou falar)", "b": false}], [{"t": "il/elle", "b": false}, {"t": "va parler (vai falar)", "b": false}], [{"t": "nous", "b": false}, {"t": "allons parler (vamos falar)", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "vont parler (vão falar)", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "Futuro (Futur Simple)", "trans": "Forma-se com o infinitivo (retirando o e final nos verbos -re) + terminações fixas:"}]}, {"type": "table", "headers": ["Pronome", "parler"], "rows": [[{"t": "je", "b": false}, {"t": "parlerai", "b": false}], [{"t": "tu", "b": false}, {"t": "parleras", "b": false}], [{"t": "il/elle", "b": false}, {"t": "parlera", "b": false}], [{"t": "nous", "b": false}, {"t": "parlerons", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "parleront", "b": false}]]}, {"type": "p", "html": "<em>Verbos irregulares (só a raiz muda): être → serai / avoir → aurai / faire → ferai / aller → irai</em>", "italic": true}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "O condicional (Conditionnel) — para pedidos educados e hipóteses", "trans": "Mesma base do futuro + terminações do Imparfait (ais, ais, ait, ions, iez, aient):"}]}, {"type": "table", "headers": ["Pronome", "parler", "vouloir"], "rows": [[{"t": "je", "b": false}, {"t": "parlerais", "b": false}, {"t": "voudrais", "b": false}], [{"t": "il/elle", "b": false}, {"t": "parlerait", "b": false}, {"t": "voudrait", "b": false}], [{"t": "nous", "b": false}, {"t": "parlerions", "b": false}, {"t": "voudrions", "b": false}]]}, {"type": "p", "html": "Exemplos práticos: Je voudrais réserver une table. (Gostaria de reservar uma mesa) — Pourriez-vous m'aider? (Poderia ajudar-me?)", "italic": false}], "tip": false}, {"title": "O modo conjuntivo — Subjonctif (aspetos básicos)", "blocks": [{"type": "p", "html": "Esta forma usa-se para a dúvida, o desejo, a hipótese, ou depois de verbos como «é preciso que», «quero que». Forma-se a partir da forma «ils» do presente (sem o -ent) + terminações e, es, e, ions, iez, ent.", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "que je", "b": false}, {"t": "finisse", "b": false}, {"t": "parle", "b": false}], [{"t": "que tu", "b": false}, {"t": "finisses", "b": false}, {"t": "parles", "b": false}], [{"t": "qu'il/elle", "b": false}, {"t": "finisse", "b": false}, {"t": "parle", "b": false}], [{"t": "que nous", "b": false}, {"t": "finissions", "b": false}, {"t": "parlions", "b": false}], [{"t": "qu'ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": false}]]}, {"type": "h3", "text": "<strong>Quando se usa?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Depois de «il faut que» (é preciso que...): Il faut que tu viennes. (É preciso que venhas)", "Depois de «je veux que» (quero que...): Je veux que tu m'aides. (Quero que me ajudes)", "Depois de «il est possible que» (é possível que): Il est possible qu'il pleuve. (É possível que chova)", "Depois de «bien que» (embora): Bien qu'il soit fatigué, il travaille. (Embora esteja cansado, ele trabalha)", "Nota importante: o verbo «espérer» (esperar/desejar) em francês usa o presente do indicativo normal, e não o Subjonctif — ao contrário do português e do espanhol! J'espère que tu vas bien. (e não «que tu ailles»)."]}], "tip": false}, {"title": "Os verbos reflexivos", "blocks": [{"type": "p", "html": "O pronome coloca-se sempre antes do verbo conjugado, tal como acontece no português brasileiro e no espanhol:", "italic": false}, {"type": "table", "headers": ["Pronome", "se lever (levantar-se)", "s'appeler (chamar-se)", "se laver (lavar-se)"], "rows": [[{"t": "je", "b": false}, {"t": "me lève", "b": false}, {"t": "m'appelle", "b": false}, {"t": "me lave", "b": false}], [{"t": "tu", "b": false}, {"t": "te lèves", "b": false}, {"t": "t'appelles", "b": false}, {"t": "te laves", "b": false}], [{"t": "il/elle", "b": false}, {"t": "se lève", "b": false}, {"t": "s'appelle", "b": false}, {"t": "se lave", "b": false}], [{"t": "nous", "b": false}, {"t": "nous levons", "b": false}, {"t": "nous appelons", "b": false}, {"t": "nous lavons", "b": false}]]}, {"type": "p", "html": "Exemplo muito comum: «Comment tu t'appelles?» (Como te chamas?) — Resposta: «Je m'appelle Ahmed.» (Chamo-me Ahmed)", "italic": false}], "tip": false}, {"title": "Pronomes de objeto e a sua posição", "blocks": [{"type": "h3", "text": "<strong>A tabela</strong>"}, {"type": "table", "headers": ["Sujeito", "Objeto direto", "Objeto indireto"], "rows": [[{"t": "je", "b": false}, {"t": "me", "b": false}, {"t": "me", "b": false}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "te", "b": false}], [{"t": "il/elle", "b": false}, {"t": "le / la", "b": false}, {"t": "lui", "b": false}], [{"t": "nous", "b": false}, {"t": "nous", "b": false}, {"t": "nous", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "les", "b": false}, {"t": "leur", "b": false}]]}, {"type": "h3", "text": "<strong>Onde colocar o pronome?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Regra geral: o pronome coloca-se sempre antes do verbo conjugado: Je te vois demain. (Vejo-te amanhã)", "Nos tempos compostos (como o Passé Composé), o pronome coloca-se antes do verbo auxiliar: Je t'ai vu hier. (Vi-te ontem)", "A única exceção: o imperativo afirmativo, onde o pronome se coloca depois do verbo com hífen: Regarde-moi! (Olha para mim!)"]}], "tip": false}, {"title": "Preposições e a sua fusão com os artigos definidos", "blocks": [{"type": "p", "html": "O francês tem uma fusão simples mas importante entre preposições e artigos definidos:", "italic": false}, {"type": "table", "headers": ["Preposição", "+ le", "+ les", "Nota"], "rows": [[{"t": "à (a/para)", "b": false}, {"t": "au", "b": false}, {"t": "aux", "b": false}, {"t": "sem fusão com la: à la plage", "b": false}], [{"t": "de (de)", "b": false}, {"t": "du", "b": false}, {"t": "des", "b": false}, {"t": "sem fusão com la: de la musique", "b": false}]]}, {"type": "p", "html": "Exemplos: Je vais au marché. (Vou ao mercado) — Le livre est du professeur. (O livro é do professor) — Je parle aux étudiants. (Falo com os estudantes)", "italic": false}], "tip": false}, {"title": "Comparação, superlativos e conectores avançados", "blocks": [{"type": "h3", "text": "<strong>Comparação e superlativos</strong>"}, {"type": "table", "headers": ["Uso", "Estrutura", "Exemplo"], "rows": [[{"t": "mais que", "b": false}, {"t": "plus... que", "b": false}, {"t": "Plus cher que (mais caro que)", "b": false}], [{"t": "menos que", "b": false}, {"t": "moins... que", "b": false}, {"t": "Moins cher que (menos caro que)", "b": false}], [{"t": "tão... como", "b": false}, {"t": "aussi... que", "b": false}, {"t": "Aussi bon que (tão bom como)", "b": false}], [{"t": "o mais", "b": false}, {"t": "le plus / la plus", "b": false}, {"t": "Le plus cher (o mais caro)", "b": false}]]}, {"type": "table", "headers": ["Adjetivo", "Forma comparativa irregular"], "rows": [[{"t": "bon (bom)", "b": false}, {"t": "meilleur (melhor)", "b": false}], [{"t": "mauvais (mau)", "b": false}, {"t": "pire (pior)", "b": false}], [{"t": "bien (advérbio: bem)", "b": false}, {"t": "mieux (melhor)", "b": false}]]}, {"type": "h3", "text": "<strong>Conectores avançados</strong>"}, {"type": "table", "headers": ["Significado", "Conector"], "rows": [[{"t": "mas", "b": false}, {"t": "mais", "b": false}], [{"t": "mas (mais formal)", "b": false}, {"t": "cependant / toutefois", "b": false}], [{"t": "por isso", "b": false}, {"t": "donc", "b": false}], [{"t": "porque", "b": false}, {"t": "parce que", "b": false}] , "b": false}, {"t": "métro", "b": false}, {"t": "<strong>métro</strong>", "b": true}], [{"t": "estação", "b": false}, {"t": "gar", "b": false}, {"t": "<strong>gare</strong>", "b": true}]]}], "tip": false}, {"title": "Vocabulário: compras, negociação e trabalho", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "Pode fazer-me um desconto?", "b": false}, {"t": "puvé vu fer ün rédüksiõ", "b": false}, {"t": "<strong>Pouvez-vous faire une réduction?</strong>", "b": true}], [{"t": "Está muito caro", "b": false}, {"t": "sé tro sher", "b": false}, {"t": "<strong>C'est trop cher</strong>", "b": true}], [{"t": "promoção", "b": false}, {"t": "promosiõ", "b": false}, {"t": "<strong>promotion</strong>", "b": true}], [{"t": "fatura", "b": false}, {"t": "faktür", "b": false}, {"t": "<strong>facture</strong>", "b": true}], [{"t": "reunião", "b": false}, {"t": "réüniõ", "b": false}, {"t": "<strong>réunion</strong>", "b": true}], [{"t": "negócio", "b": false}, {"t": "afer", "b": false}, {"t": "<strong>affaire</strong>", "b": true}], [{"t": "empresa", "b": false}, {"t": "ãtröpriz", "b": false}, {"t": "<strong>entreprise</strong>", "b": true}], [{"t": "cliente", "b": false}, {"t": "kliã", "b": false}, {"t": "<strong>client</strong>", "b": true}], [{"t": "contrato", "b": false}, {"t": "kõtra", "b": false}, {"t": "<strong>contrat</strong>", "b": true}], [{"t": "prazo", "b": false}, {"t": "délé", "b": false}, {"t": "<strong>délai</strong>", "b": true}]]}], "tip": false}, {"title": "Etiqueta: formal ou informal?", "blocks": [{"type": "h3", "text": "<strong>Quando usar tu e quando usar vous?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Usa «vous» com qualquer pessoa mais velha, no trabalho, ou da primeira vez que te encontras com alguém — os franceses são bastante sensíveis a este aspeto, e conjuga-se como a forma do plural.", "Usa «tu» só com amigos, família, ou pessoas da tua idade, depois de alguém te convidar explicitamente a fazê-lo.", "O aperto de mão ou os beijinhos na face (la bise) são comuns em contextos sociais, mas no trabalho o aperto de mão normal é o mais adequado.", "A pontualidade é muito importante em contextos formais em França.", "A gorjeta (pourboire) costuma estar incluída no preço (service compris), mas deixar trocos é bem visto e apreciado."]}], "tip": false}, {"title": "Expressões idiomáticas avançadas", "blocks": [{"type": "table", "headers": ["Significado/uso", "Expressão em francês"], "rows": [[{"t": "Estar deprimido/triste (literalmente «ter a barata»)", "b": false}, {"t": "Avoir le cafard", "b": false}], [{"t": "Ser muito caro (literalmente «custar os olhos da cara» — mesma expressão em português e espanhol!)", "b": false}, {"t": "Coûter les yeux de la tête", "b": false}], [{"t": "Faltar a um encontro combinado (literalmente «pôr um coelho a alguém»)", "b": false}, {"t": "Poser un lapin à quelqu'un", "b": false}], [{"t": "Estar rouco (literalmente «ter um gato na garganta»)", "b": false}, {"t": "Avoir un chat dans la gorge", "b": false}], [{"t": "Chover torrencialmente (literalmente «chovem cordas»)", "b": false}, {"t": "Il pleut des cordes", "b": false}], [{"t": "Não ser do meu gosto (literalmente «não é a minha chávena de chá»)", "b": false}, {"t": "Ce n'est pas ma tasse de thé", "b": false}], [{"t": "Complicar algo simples sem necessidade", "b": false}, {"t": "Chercher midi à quatorze heures", "b": false}]]}], "tip": false}, {"title": "Diálogos práticos avançados (5 cenários reais)", "blocks": [{"type": "h3", "text": "<strong>1) No aeroporto — atraso no voo</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Passager:", "orig": "Bonsoir, mon vol pour Paris est en retard?", "trans": "Boa noite, o meu voo para Paris está atrasado?"}, {"speaker": "Employé:", "orig": "Oui, malheureusement il a une heure de retard.", "trans": "Sim, infelizmente está atrasado uma hora."}, {"speaker": "Passager:", "orig": "Je vais rater ma correspondance pour Lyon?", "trans": "Vou perder a ligação para Lyon?"}, {"speaker": "Employé:", "orig": "Ne vous inquiétez pas, nous avons déjà réorganisé votre voyage.", "trans": "Não se preocupe, já reorganizámos a sua viagem."}]}, {"type": "h3", "text": "<strong>2) Reclamação no hotel</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Client:", "orig": "Excusez-moi, la climatisation de ma chambre ne marche pas.", "trans": "Desculpe, o ar condicionado do meu quarto não funciona."}, {"speaker": "Réception:", "orig": "Je suis désolé. J'envoie quelqu'un tout de suite.", "trans": "Lamento imenso. Vou enviar alguém já."}, {"speaker": "Client:", "orig": "Merci. Je voudrais aussi changer de chambre, si possible.", "trans": "Obrigado. Gostaria também de mudar de quarto, se possível."}, {"speaker": "Réception:", "orig": "Bien sûr, je vais vérifier la disponibilité.", "trans": "Claro, vou verificar a disponibilidade."}]}, {"type": "h3", "text": "<strong>3) Na farmácia</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Client:", "orig": "Bonsoir, je ne me sens pas bien. J'ai mal à la tête et de la fièvre.", "trans": "Boa noite, não me sinto bem. Tenho dor de cabeça e febre."}, {"speaker": "Pharmacien:", "orig": "Depuis quand avez-vous ces symptômes?", "trans": "Há quanto tempo tem estes sintomas?"}, {"speaker": "Client:", "orig": "Depuis hier soir.", "trans": "Desde ontem à noite."}, {"speaker": "Pharmacien:", "orig": "Prenez ce médicament toutes les huit heures.", "trans": "Tome este medicamento a cada oito horas."}]}, {"type": "h3", "text": "<strong>4) Aluguer de um carro</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Client:", "orig": "Je voudrais louer une voiture pour trois jours.", "trans": "Gostaria de alugar um carro por três dias."}, {"speaker": "Employé:", "orig": "Bien sûr. Puis-je voir votre permis de conduire?", "trans": "Claro. Posso ver a sua carta de condução?"}, {"speaker": "Client:", "orig": "Voilà. L'assurance est incluse?", "trans": "Aqui tem. O seguro está incluído?"}, {"speaker": "Employé:", "orig": "Oui, l'assurance de base est incluse dans le prix.", "trans": "Sim, o seguro básico está incluído no preço."}]}, {"type": "h3", "text": "<strong>5) Perguntar por direções</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Touriste:", "orig": "Excusez-moi, comment j'arrive à la tour Eiffel?", "trans": "Desculpe, como chego à torre Eiffel?"}, {"speaker": "Habitant:", "orig": "Continuez tout droit et tournez à droite à la deuxième rue.", "trans": "Siga sempre em frente e depois vire à direita na segunda rua."}, {"speaker": "Touriste:", "orig": "C'est très loin d'ici?", "trans": "É muito longe daqui?"}, {"speaker": "Habitant:", "orig": "Non, c'est à dix minutes à pied.", "trans": "Não, fica a dez minutos a pé."}]}], "tip": false}, {"title": "Texto de leitura para prática", "blocks": [{"type": "p", "html": "Lê este texto em voz alta algumas vezes, e tenta perceber sem traduzires cada palavra:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>Vocabulário-chave do texto</strong>"}, {"type": "table", "headers": ["Significado", "Palavra"], "rows": [[{"t": "centro da cidade", "b": false}, {"t": "centre-ville", "b": false}], [{"t": "a torre Eiffel", "b": false}, {"t": "la tour Eiffel", "b": false}], [{"t": "o rio Sena em Paris", "b": false}, {"t": "la Seine", "b": false}], [{"t": "inesquecível", "b": false}, {"t": "inoubliable", "b": false}]]}, {"type": "h3", "text": "<strong>Perguntas de compreensão</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Quando é que a família foi a Paris?", "O que fizeram depois do check-in?", "Onde ouviram música ao vivo?"]}, {"type": "p", "html": "<em>Respostas: 1) Ontem 2) Foram ao centro almoçar 3) Perto do rio Sena, à noite</em>", "italic": true}], "tip": false}, {"title": "Conclusão e próximos passos para a fluência", "blocks": [{"type": "list", "label": "<strong>Para atingires a fluência completa</strong>", "intro": null, "items": ["Lê jornais ou artigos franceses simples diariamente e tenta perceber pelo contexto antes de traduzir.", "Fala com falantes nativos (online, ou se viajares) — a prática real é a coisa mais valiosa agora.", "Escreve um pequeno diário em francês todos os dias — até 3-4 frases fazem grande diferença ao longo do tempo.", "Revê estes tempos verbais de vez em quando até se tornarem automáticos.", "Não tenhas medo de errar na conversa — os franceses apreciam muito qualquer pessoa que tente falar a sua língua."]}], "tip": true}], "closingBasic": "Parabéns antecipados pela tua jornada com o francês — Bonne chance! (boa sorte!)", "closingAdvanced": "A tua jornada com o francês está agora pronta para um nível em que realmente podes confiar — Bonne chance! (boa sorte!)"}, "ptbr": {"chapters": [{"title": "Introdução: Porque aprender francês?", "blocks": [{"type": "p", "html": "O francês é a língua oficial em mais de 29 países, falada por mais de 300 milhões de pessoas em todo o mundo, e reconhecida mundialmente como a língua da diplomacia, da arte e da literatura. Este livro dá-te uma base sólida no francês padrão falado em França.", "italic": false}, {"type": "p", "html": "A boa notícia: o francês tem uma gramática lógica e bastante organizada. A principal dificuldade está na pronúncia — há letras que ficam mudas, sons nasais característicos, e um fenómeno chamado «Liaison» que liga as palavras entre si. É exatamente nisso que vamos focar-nos já a partir do primeiro capítulo.", "italic": false}, {"type": "list", "label": "<strong>Objetivos deste livro</strong>", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Focar na pronúncia correta para que o teu sotaque soe autenticamente francês.", "Dar-te frases práticas que podes usar desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e fundamentos de pronúncia", "blocks": [{"type": "p", "html": "O francês usa o alfabeto latino, mas muitas letras ficam mudas no final da palavra. Esta tabela apresenta as letras e sons mais distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "mezon", "b": false}, {"t": "<strong>maison (s entre vogais = z)</strong>", "b": true}], [{"t": "olá/bom dia", "b": false}, {"t": "bonjur", "b": false}, {"t": "<strong>bonjour (on = som nasal, j = «j» suave)</strong>", "b": true}], [{"t": "obrigado", "b": false}, {"t": "mersi", "b": false}, {"t": "<strong>merci</strong>", "b": true}], [{"t": "gato", "b": false}, {"t": "sha", "b": false}, {"t": "<strong>chat (ch = «x» português, e o t final é mudo)</strong>", "b": true}], [{"t": "eu", "b": false}, {"t": "jö", "b": false}, {"t": "<strong>je (som «j» suave, exatamente como o «j» português!)</strong>", "b": true}], [{"t": "rapaz", "b": false}, {"t": "garson", "b": false}, {"t": "<strong>garçon (ç = s)</strong>", "b": true}], [{"t": "francês", "b": false}, {"t": "fransé", "b": false}, {"t": "<strong>français (ç = s, e o s final é mudo)</strong>", "b": true}], [{"t": "água", "b": false}, {"t": "ô", "b": false}, {"t": "<strong>eau (toda a combinação eau soa apenas «ô»)</strong>", "b": true}], [{"t": "ovo", "b": false}, {"t": "öf", "b": false}, {"t": "<strong>œuf (som vocálico único, sem equivalente direto no português)</strong>", "b": true}], [{"t": "vinho", "b": false}, {"t": "van", "b": false}, {"t": "<strong>vin (in = som nasal)</strong>", "b": true}], [{"t": "pão", "b": false}, {"t": "pan", "b": false}, {"t": "<strong>pain (ain = o mesmo som nasal)</strong>", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro vão fazer a maior diferença para soares verdadeiramente francês — e boas notícias: o português já te dá uma vantagem enorme em várias delas!", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["As consoantes finais geralmente ficam mudas (como o t em chat), a não ser que sejam seguidas de e.", "Os sons nasais (an, en, in, on, un) pronunciam-se pelo nariz — e já os conheces do português (ão, ãe)! Uma grande vantagem para ti, já que a maioria das línguas não tem este fenómeno.", "A letra r francesa é um som gutural muito parecido com o «r» do português europeu — outra vantagem que já tens.", "O grupo ch pronuncia-se exatamente como o «x» português (chave) — soa igual!", "As letras j, e g antes de e ou i, pronunciam-se com o mesmo som suave que já conheces do «j» português (já, jogo) — nada a aprender de novo aqui.", "O fenómeno da «Liaison»: a consoante final que normalmente é muda pode pronunciar-se se a palavra seguinte começar por vogal — como em «les amis», que se pronuncia «lezami» e não «le ami»."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "Bom dia/olá (formal)", "b": false}, {"t": "bonjur", "b": false}, {"t": "<strong>Bonjour</strong>", "b": true}], [{"t": "Boa noite (ao chegar)", "b": false}, {"t": "bonsuar", "b": false}, {"t": "<strong>Bonsoir</strong>", "b": true}], [{"t": "Olá (casual)", "b": false}, {"t": "salú", "b": false}, {"t": "<strong>Salut</strong>", "b": true}], [{"t": "Como estás?", "b": false}, {"t": "comã sa va", "b": false}, {"t": "<strong>Comment ça va?</strong>", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "sa va biã, mersi", "b": false}, {"t": "<strong>Ça va bien, merci</strong>", "b": true}], [{"t": "Prazer em conhecer-te", "b": false}, {"t": "onshãté", "b": false}, {"t": "<strong>Enchanté</strong>", "b": true}], [{"t": "Até breve", "b": false}, {"t": "a biãtô", "b": false}, {"t": "<strong>À bientôt</strong>", "b": true}], [{"t": "Até amanhã", "b": false}, {"t": "a demã", "b": false}, {"t": "<strong>À demain</strong>", "b": true}], [{"t": "Adeus", "b": false}, {"t": "o rövuar", "b": false}, {"t": "<strong>Au revoir</strong>", "b": true}], [{"t": "Por favor (formal)", "b": false}, {"t": "sil vu ple", "b": false}, {"t": "<strong>S'il vous plaît</strong>", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "mersi", "b": false}, {"t": "<strong>Merci</strong>", "b": true}], [{"t": "De nada", "b": false}, {"t": "dö riã", "b": false}, {"t": "<strong>De rien</strong>", "b": true}], [{"t": "Desculpa", "b": false}, {"t": "pardõ / exküze mua", "b": false}, {"t": "<strong>Pardon / Excusez-moi</strong>", "b": true}], [{"t": "Sim", "b": false}, {"t": "ui", "b": false}, {"t": "<strong>Oui</strong>", "b": true}], [{"t": "Não", "b": false}, {"t": "nõ", "b": false}, {"t": "<strong>Non</strong>", "b": true}]]}], "tip": false}, {"title": "Pronomes e o verbo «être» (ser/estar)", "blocks": [{"type": "p", "html": "Uma coisa que distingue o francês do português, do espanhol e do italiano: não há dois verbos separados para «ser/estar» — existe apenas um, chamado «être», que cobre a identidade e o estado temporário ao mesmo tempo.", "italic": false}, {"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["Português", "Francês"], "rows": [[{"t": "eu", "b": false}, {"t": "je", "b": false}], [{"t": "tu", "b": false}, {"t": "tu", "b": false}], [{"t": "ele/ela", "b": false}, {"t": "il / elle", "b": false}], [{"t": "nós", "b": false}, {"t": "nous", "b": false}], [{"t": "vós/você (formal ou plural)", "b": false}, {"t": "vous", "b": false}], [{"t": "eles/elas", "b": false}, {"t": "ils / elles", "b": false}]]}, {"type": "h3", "text": "<strong>être — ser/estar</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "je", "b": false}, {"t": "suis", "b": false}], [{"t": "tu", "b": false}, {"t": "es", "b": false}], [{"t": "il/elle", "b": false}, {"t": "est", "b": false}], [{"t": "nous", "b": false}, {"t": "sommes", "b": false}], [{"t": "vous", "b": false}, {"t": "êtes", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "sont", "b": false}]]}, {"type": "p", "html": "Exemplo: Je suis égyptien — Eu sou egípcio. — Je suis à Paris — Estou (agora) em Paris. Repara como o mesmo verbo cobre as duas situações!", "italic": false}], "tip": false}, {"title": "Verbos comuns e a sua conjugação", "blocks": [{"type": "p", "html": "Os verbos regulares franceses dividem-se em dois grupos principais consoante a terminação: er, ir. Sabendo o padrão, consegues conjugar qualquer verbo regular:", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir: terminar)", "-er (parler: falar)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": false}], [{"t": "tu", "b": false}, {"t": "finis", "b": false}, {"t": "parles", "b": false}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": false}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": false}], [{"t": "vous", "b": false}, {"t": "finissez", "b": false}, {"t": "parlez", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": false}]]}, {"type": "h3", "text": "<strong>Verbos irregulares importantes (formas «je» e «tu»)</strong>"}, {"type": "table", "headers": ["Significado", "je", "tu", "Verbo"], "rows": [[{"t": "ter", "b": false}, {"t": "ai", "b": false}, {"t": "as", "b": false}, {"t": "avoir", "b": false}], [{"t": "ir", "b": false}, {"t": "vais", "b": false}, {"t": "vas", "b": false}, {"t": "aller", "b": false}], [{"t": "fazer", "b": false}, {"t": "fais", "b": false}, {"t": "fais", "b": false}, {"t": "faire", "b": false}], [{"t": "poder", "b": false}, {"t": "peux", "b": false}, {"t": "peux", "b": false}, {"t": "pouvoir", "b": false}], [{"t": "querer", "b": false}, {"t": "veux", "b": false}, {"t": "veux", "b": false}, {"t": "vouloir", "b": false}], [{"t": "saber", "b": false}, {"t": "sais", "b": false}, {"t": "sais", "b": false}, {"t": "savoir", "b": false}]]}], "tip": false}, {"title": "Números de 0 a 100", "blocks": [{"type": "table", "headers": ["Nº", "Francês", "Nº", "Francês"], "rows": [[{"t": "0", "b": false}, {"t": "zéro", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": false}], [{"t": "1", "b": false}, {"t": "un", "b": false}, {"t": "12", "b": false}, {"t": "douze", "b": false}], [{"t": "2", "b": false}, {"t": "deux", "b": false}, {"t": "13", "b": false}, {"t": "treize", "b": false}], [{"t": "3", "b": false}, {"t": "trois", "b": false}, {"t": "14", "b": false}, {"t": "quatorze", "b": false}], [{"t": "4", "b": false}, {"t": "quatre", "b": false}, {"t": "15", "b": false}, {"t": "quinze", "b": false}], [{"t": "5", "b": false}, {"t": "cinq", "b": false}, {"t": "16", "b": false}, {"t": "seize", "b": false}], [{"t": "6", "b": false}, {"t": "six", "b": false}, {"t": "17", "b": false}, {"t": "dix-sept", "b": false}], [{"t": "7", "b": false}, {"t": "sept", "b": false}, {"t": "18", "b": false}, {"t": "dix-huit", "b": false}], [{"t": "8", "b": false}, {"t": "huit", "b": false}, {"t": "19", "b": false}, {"t": "dix-neuf", "b": false}], [{"t": "9", "b": false}, {"t": "neuf", "b": false}, {"t": "20", "b": false}, {"t": "vingt", "b": false}], [{"t": "10", "b": false}, {"t": "dix", "b": false}, {"t": "30", "b": false}, {"t": "trente", "b": false}]]}, {"type": "table", "headers": ["Nº", "Francês", "Nº", "Francês"], "rows": [[{"t": "40", "b": false}, {"t": "quarante", "b": false}, {"t": "80", "b": false}, {"t": "quatre-vingts", "b": false}], [{"t": "50", "b": false}, {"t": "cinquante", "b": false}, {"t": "90", "b": false}, {"t": "quatre-vingt-dix", "b": false}], [{"t": "60", "b": false}, {"t": "soixante", "b": false}, {"t": "100", "b": false}, {"t": "cent", "b": false}], [{"t": "70", "b": false}, {"t": "soixante-dix", "b": false}, {"t": "", "b": false}, {"t": "", "b": false}]]}, {"type": "p", "html": "<em>Curiosidade: o francês não tem palavras separadas para 70, 80 e 90! O 70 é literalmente «sessenta e dez» (soixante-dix), o 80 é literalmente «quatro vintes» (quatre-vingts), e o 90 é literalmente «quatro vintes e dez» (quatre-vingt-dix). É um sistema antigo que ainda se usa em França (ao contrário da Bélgica e da Suíça, que têm palavras diretas).</em>", "italic": true}], "tip": false}, {"title": "Dias da semana e meses", "blocks": [{"type": "table", "headers": ["Dia", "Francês"], "rows": [[{"t": "segunda", "b": false}, {"t": "lundi", "b": false}], [{"t": "terça", "b": false}, {"t": "mardi", "b": false}], [{"t": "quarta", "b": false}, {"t": "mercredi", "b": false}], [{"t": "quinta", "b": false}, {"t": "jeudi", "b": false}], [{"t": "sexta", "b": false}, {"t": "vendredi", "b": false}], [{"t": "sábado", "b": false}, {"t": "samedi", "b": false}], [{"t": "domingo", "b": false}, {"t": "dimanche", "b": false}]]}, {"type": "h3", "text": "<strong>Meses</strong>"}, {"type": "table", "headers": ["Mês", "Francês", "Mês", "Francês"], "rows": [[{"t": "janeiro", "b": false}, {"t": "janvier", "b": false}, {"t": "julho", "b": false}, {"t": "juillet", "b": false}], [{"t": "fevereiro", "b": false}, {"t": "février", "b": false}, {"t": "agosto", "b": false}, {"t": "août", "b": false}], [{"t": "março", "b": false}, {"t": "mars", "b": false}, {"t": "setembro", "b": false}, {"t": "septembre", "b": false}], [{"t": "abril", "b": false}, {"t": "avril", "b": false}, {"t": "outubro", "b": false}, {"t": "octobre", "b": false}], [{"t": "maio", "b": false}, {"t": "mai", "b": false}, {"t": "novembro", "b": false}, {"t": "novembre", "b": false}], [{"t": "junho", "b": false}, {"t": "juin", "b": false}, {"t": "dezembro", "b": false}, {"t": "décembre", "b": false}]]}], "tip": false}, {"title": "Cores", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "vermelho", "b": false}, {"t": "ruj", "b": false}, {"t": "<strong>rouge</strong>", "b": true}], [{"t": "azul", "b": false}, {"t": "blö", "b": false}, {"t": "<strong>bleu</strong>", "b": true}], [{"t": "verde", "b": false}, {"t": "ver", "b": false}, {"t": "<strong>vert</strong>", "b": true}], [{"t": "amarelo", "b": false}, {"t": "jôn", "b": false}, {"t": "<strong>jaune</strong>", "b": true}], [{"t": "preto", "b": false}, {"t": "nuar", "b": false}, {"t": "<strong>noir</strong>", "b": true}], [{"t": "branco", "b": false}, {"t": "blã", "b": false}, {"t": "<strong>blanc</strong>", "b": true}], [{"t": "laranja", "b": false}, {"t": "orãj", "b": false}, {"t": "<strong>orange</strong>", "b": true}], [{"t": "roxo", "b": false}, {"t": "violé", "b": false}, {"t": "<strong>violet</strong>", "b": true}], [{"t": "rosa", "b": false}, {"t": "roz", "b": false}, {"t": "<strong>rose</strong>", "b": true}], [{"t": "cinzento", "b": false}, {"t": "gri", "b": false}, {"t": "<strong>gris</strong>", "b": true}], [{"t": "castanho", "b": false}, {"t": "marrõ", "b": false}, {"t": "<strong>marron</strong>", "b": true}]]}], "tip": false}, {"title": "Membros da família", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "mãe", "b": false}, {"t": "mer", "b": false}, {"t": "<strong>mère</strong>", "b": true}], [{"t": "pai", "b": false}, {"t": "per", "b": false}, {"t": "<strong>père</strong>", "b": true}], [{"t": "irmão", "b": false}, {"t": "frer", "b": false}, {"t": "<strong>frère</strong>", "b": true}], [{"t": "irmã", "b": false}, {"t": "sör", "b": false}, {"t": "<strong>sœur</strong>", "b": true}], [{"t": "filho", "b": false}, {"t": "fis", "b": false}, {"t": "<strong>fils</strong>", "b": true}], [{"t": "filha", "b": false}, {"t": "fii", "b": false}, {"t": "<strong>fille</strong>", "b": true}], [{"t": "avô", "b": false}, {"t": "grã-per", "b": false}, {"t": "<strong>grand-père</strong>", "b": true}], [{"t": "avó", "b": false}, {"t": "grã-mer", "b": false}, {"t": "<strong>grand-mère</strong>", "b": true}], [{"t": "marido", "b": false}, {"t": "mari", "b": false}, {"t": "<strong>mari</strong>", "b": true}], [{"t": "esposa", "b": false}, {"t": "fam", "b": false}, {"t": "<strong>femme</strong>", "b": true}], [{"t": "tio", "b": false}, {"t": "õkl", "b": false}, {"t": "<strong>oncle</strong>", "b": true}], [{"t": "tia", "b": false}, {"t": "tãt", "b": false}, {"t": "<strong>tante</strong>", "b": true}]]}], "tip": false}, {"title": "Comida e bebida", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "pão", "b": false}, {"t": "pã", "b": false}, {"t": "<strong>pain</strong>", "b": true}], [{"t": "água", "b": false}, {"t": "ô", "b": false}, {"t": "<strong>eau</strong>", "b": true}], [{"t": "café", "b": false}, {"t": "kafé", "b": false}, {"t": "<strong>café</strong>", "b": true}], [{"t": "chá", "b": false}, {"t": "té", "b": false}, {"t": "<strong>thé</strong>", "b": true}], [{"t": "carne", "b": false}, {"t": "viãd", "b": false}, {"t": "<strong>viande</strong>", "b": true}], [{"t": "frango", "b": false}, {"t": "pulé", "b": false}, {"t": "<strong>poulet</strong>", "b": true}], [{"t": "peixe", "b": false}, {"t": "puasõ", "b": false}, {"t": "<strong>poisson</strong>", "b": true}], [{"t": "queijo", "b": false}, {"t": "fromaj", "b": false}, {"t": "<strong>fromage</strong>", "b": true}], [{"t": "fruta", "b": false}, {"t": "früi", "b": false}, {"t": "<strong>fruit</strong>", "b": true}], [{"t": "vegetais", "b": false}, {"t": "légüm", "b": false}, {"t": "<strong>légumes</strong>", "b": true}], [{"t": "sobremesa", "b": false}, {"t": "désser", "b": false}, {"t": "<strong>dessert</strong>", "b": true}], [{"t": "pequeno-almoço", "b": false}, {"t": "pöti déjöné", "b": false}, {"t": "<strong>petit-déjeuner</strong>", "b": true}], [{"t": "almoço", "b": false}, {"t": "déjöné", "b": false}, {"t": "<strong>déjeuner</strong>", "b": true}], [{"t": "jantar", "b": false}, {"t": "diné", "b": false}, {"t": "<strong>dîner</strong>", "b": true}]]}], "tip": false}, {"title": "Frases essenciais para viagens e hotéis", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "Onde está...?", "b": false}, {"t": "u sö truv", "b": false}, {"t": "<strong>Où se trouve...?</strong>", "b": true}], [{"t": "Quanto custa isto?", "b": false}, {"t": "kombiã sa kut", "b": false}, {"t": "<strong>Combien ça coûte?</strong>", "b": true}], [{"t": "Posso ver o menu?", "b": false}, {"t": "jö pö vuar lö menü", "b": false}, {"t": "<strong>Je peux voir le menu?</strong>", "b": true}], [{"t": "A conta, por favor", "b": false}, {"t": "ladisiõ sil vu ple", "b": false}, {"t": "<strong>L'addition, s'il vous plaît</strong>", "b": true}], [{"t": "Onde é a casa de banho?", "b": false}, {"t": "u sõ le tualet", "b": false}, {"t": "<strong>Où sont les toilettes?</strong>", "b": true}], [{"t": "Preciso de ajuda", "b": false}, {"t": "jé bözuã déd", "b": false}, {"t": "<strong>J'ai besoin d'aide</strong>", "b": true}], [{"t": "Não percebo", "b": false}, {"t": "jö nö kompró pa", "b": false}, {"t": "<strong>Je ne comprends pas</strong>", "b": true}], [{"t": "Pode repetir, por favor?", "b": false}, {"t": "puvé vu répété", "b": false}, {"t": "<strong>Pouvez-vous répéter, s'il vous plaît?</strong>", "b": true}], [{"t": "Fala inglês?", "b": false}, {"t": "parlé vu ãglé", "b": false}, {"t": "<strong>Parlez-vous anglais?</strong>", "b": true}], [{"t": "Quero reservar um quarto", "b": false}, {"t": "jö vudré rézervé ün shãbr", "b": false}, {"t": "<strong>Je voudrais réserver une chambre</strong>", "b": true}], [{"t": "A que horas parte o comboio?", "b": false}, {"t": "a kel ör par lö trã", "b": false}, {"t": "<strong>À quelle heure part le train?</strong>", "b": true}], [{"t": "Onde posso apanhar um táxi?", "b": false}, {"t": "u püij prãdr ãn taxi", "b": false}, {"t": "<strong>Où puis-je prendre un taxi?</strong>", "b": true}]]}], "tip": false}, {"title": "Expressões e gírias francesas autênticas", "blocks": [{"type": "p", "html": "Estas expressões são as que separam quem fala francês «correto» de quem soa verdadeiramente francês. Usa-as no contexto certo e vais ver a reação das pessoas mudar completamente:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Expressão"], "rows": [[{"t": "Combinado/está bem", "b": false}, {"t": "sa marsh", "b": false}, {"t": "<strong>Ça marche</strong>", "b": true}], [{"t": "Fantástico!", "b": false}, {"t": "jénial", "b": false}, {"t": "<strong>Génial!</strong>", "b": true}], [{"t": "Sinceramente (muleta de fala muito comum)", "b": false}, {"t": "frãshmã", "b": false}, {"t": "<strong>Franchement</strong>", "b": true}], [{"t": "Coisa (palavra genérica para qualquer coisa)", "b": false}, {"t": "trük", "b": false}, {"t": "<strong>Truc</strong>", "b": true}], [{"t": "Sei lá/não me interessa (expressão de indiferença famosa)", "b": false}, {"t": "bof", "b": false}, {"t": "<strong>Bof</strong>", "b": true}], [{"t": "Não faz mal", "b": false}, {"t": "sé pa grav", "b": false}, {"t": "<strong>C'est pas grave</strong>", "b": true}], [{"t": "Por isso (conector muito usado entre os jovens)", "b": false}, {"t": "dü ku", "b": false}, {"t": "<strong>Du coup</strong>", "b": true}]]}], "tip": false}, {"title": "Diálogo prático completo", "blocks": [{"type": "p", "html": "Um diálogo simples num café — lê em voz alta várias vezes e tenta imitar a pronúncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "Bonjour! Bienvenue. Qu'est-ce que vous voulez?", "trans": "Olá! Bem-vindo. O que deseja?"}, {"speaker": "Cliente:", "orig": "Bonjour! Je voudrais un café, s'il vous plaît.", "trans": "Olá! Queria um café, por favor."}, {"speaker": "Empregado:", "orig": "C'est tout?", "trans": "Só isso?"}, {"speaker": "Cliente:", "orig": "Oui, et l'addition, s'il vous plaît.", "trans": "Sim, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "Ça fait deux euros. Merci!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "De rien, à bientôt!", "trans": "De nada, até breve!"}]}], "tip": false}, {"title": "Plano de ação: como aprender rápido", "blocks": [{"type": "list", "label": "<strong>7 passos para fixar a língua rapidamente</strong>", "intro": null, "items": ["Ouve música e séries francesas todos os dias, nem que sejam 10 minutos — o ouvido adapta-se ao ritmo antes da mente.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo e velocidade.", "Aproveita a vantagem que já tens com os sons nasais e o «r» gutural — já os conheces do português!", "Não traduzas na tua cabeça — tenta pensar diretamente na palavra francesa em vez de passares primeiro pelo português.", "Usa uma aplicação como o Duolingo ou o Babbel junto com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo com erros — a fluência vem da prática, não da memorização.", "Pratica a «Liaison» lendo frases completas em voz alta, para te habituares a ligar as palavras."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Francês — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível em que realmente consigas desenrascar-te em viagens, no trabalho e no dia a dia em França, este livro vai dar-te: os tempos verbais que precisas, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "<strong>Antes de começares</strong>", "intro": null, "items": ["Deves já saber: cumprimentos, pronomes, o verbo être, a conjugação do presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenrascares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de avançares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["je", "tu", "il/elle", "nous", "vous/ils"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vós/eles", "b": false}]]}, {"type": "h3", "text": "<strong>Presente — os padrões regulares</strong>"}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": false}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": false}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": false}]]}, {"type": "h3", "text": "<strong>être (presente)</strong>"}, {"type": "table", "headers": ["Pronome", "être"], "rows": [[{"t": "je", "b": false}, {"t": "suis", "b": false}], [{"t": "il/elle", "b": false}, {"t": "est", "b": false}], [{"t": "nous", "b": false}, {"t": "sommes", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "sont", "b": false}]]}], "tip": false}, {"title": "O passado composto (Passé Composé)", "blocks": [{"type": "p", "html": "Este é o tempo básico do passado no francês falado, formado por um verbo auxiliar (Avoir ou être) no presente + o particípio passado — exatamente a mesma ideia do italiano.", "italic": false}, {"type": "h3", "text": "<strong>Com Avoir (para a maioria dos verbos)</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": "je", "b": false}, {"t": "ai parlé (falei)", "b": false}], [{"t": "tu", "b": false}, {"t": "as parlé", "b": false}], [{"t": "il/elle", "b": false}, {"t": "a parlé", "b": false}], [{"t": "nous", "b": false}, {"t": "avons parlé", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "ont parlé", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "Com être (verbos de movimento e reflexivos)", "trans": "Muito importante: com être, o particípio passado tem de concordar em género e número com o sujeito, tal como um adjetivo. Entre os verbos de movimento mais comuns que usam être estão: aller (ir), venir (vir), partir (partir), arriver (chegar), entrer (entrar), sortir (sair), monter (subir), descendre (descer), naître (nascer), mourir (morrer), rester (ficar), tomber (cair)."}]}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": "je (homem)", "b": false}, {"t": "suis allé (fui)", "b": false}], [{"t": "je (mulher)", "b": false}, {"t": "suis allée", "b": false}], [{"t": "il", "b": false}, {"t": "est allé", "b": false}], [{"t": "elle", "b": false}, {"t": "est allée", "b": false}], [{"t": "nous (masc./misto)", "b": false}, {"t": "sommes allés", "b": false}]]}, {"type": "p", "html": "<em>Os restantes verbos usam Avoir como habitualmente.</em>", "italic": true}], "tip": false}, {"title": "O pretérito imperfeito (Imparfait)", "blocks": [{"type": "p", "html": "Usa-se para descrever algo que acontecia repetidamente ou de forma contínua no passado — não um evento único e terminado, mas um hábito ou a descrição de um estado. Uma coisa bastante simpática no francês: o verbo être é o único verbo irregular neste tempo!", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)", "être (o único irregular)"], "rows": [[{"t": "je", "b": false}, {"t": "finissais", "b": false}, {"t": "parlais", "b": false}, {"t": "étais", "b": false}], [{"t": "il/elle", "b": false}, {"t": "finissait", "b": false}, {"t": "parlait", "b": false}, {"t": "était", "b": false}], [{"t": "nous", "b": false}, {"t": "finissions", "b": false}, {"t": "parlions", "b": false}, {"t": "étions", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "finissaient", "b": false}, {"t": "parlaient", "b": false}, {"t": "étaient", "b": false}]]}, {"type": "p", "html": "Regra de formação: pega na forma «nous» do presente, tira o «-ons», e acrescenta as terminações do Imparfait (ais, ais, ait, ions, iez, aient). Exemplo: Quand j'étais enfant, j'habitais au Caire. (Quando era criança, vivia no Cairo)", "italic": false}], "tip": false}, {"title": "O futuro, o futuro próximo e o condicional", "blocks": [{"type": "h3", "text": "<strong>Futuro próximo (o mais fácil e o mais usado ao falar) — Aller + infinitivo</strong>"}, {"type": "table", "headers": ["Pronome", "Exemplo"], "rows": [[{"t": "je", "b": false}, {"t": "vais parler (vou falar)", "b": false}], [{"t": "il/elle", "b": false}, {"t": "va parler (vai falar)", "b": false}], [{"t": "nous", "b": false}, {"t": "allons parler (vamos falar)", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "vont parler (vão falar)", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "Futuro (Futur Simple)", "trans": "Forma-se com o infinitivo (retirando o e final nos verbos -re) + terminações fixas:"}]}, {"type": "table", "headers": ["Pronome", "parler"], "rows": [[{"t": "je", "b": false}, {"t": "parlerai", "b": false}], [{"t": "tu", "b": false}, {"t": "parleras", "b": false}], [{"t": "il/elle", "b": false}, {"t": "parlera", "b": false}], [{"t": "nous", "b": false}, {"t": "parlerons", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "parleront", "b": false}]]}, {"type": "p", "html": "<em>Verbos irregulares (só a raiz muda): être → serai / avoir → aurai / faire → ferai / aller → irai</em>", "italic": true}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "O condicional (Conditionnel) — para pedidos educados e hipóteses", "trans": "Mesma base do futuro + terminações do Imparfait (ais, ais, ait, ions, iez, aient):"}]}, {"type": "table", "headers": ["Pronome", "parler", "vouloir"], "rows": [[{"t": "je", "b": false}, {"t": "parlerais", "b": false}, {"t": "voudrais", "b": false}], [{"t": "il/elle", "b": false}, {"t": "parlerait", "b": false}, {"t": "voudrait", "b": false}], [{"t": "nous", "b": false}, {"t": "parlerions", "b": false}, {"t": "voudrions", "b": false}]]}, {"type": "p", "html": "Exemplos práticos: Je voudrais réserver une table. (Gostaria de reservar uma mesa) — Pourriez-vous m'aider? (Poderia ajudar-me?)", "italic": false}], "tip": false}, {"title": "O modo conjuntivo — Subjonctif (aspetos básicos)", "blocks": [{"type": "p", "html": "Esta forma usa-se para a dúvida, o desejo, a hipótese, ou depois de verbos como «é preciso que», «quero que». Forma-se a partir da forma «ils» do presente (sem o -ent) + terminações e, es, e, ions, iez, ent.", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "que je", "b": false}, {"t": "finisse", "b": false}, {"t": "parle", "b": false}], [{"t": "que tu", "b": false}, {"t": "finisses", "b": false}, {"t": "parles", "b": false}], [{"t": "qu'il/elle", "b": false}, {"t": "finisse", "b": false}, {"t": "parle", "b": false}], [{"t": "que nous", "b": false}, {"t": "finissions", "b": false}, {"t": "parlions", "b": false}], [{"t": "qu'ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": false}]]}, {"type": "h3", "text": "<strong>Quando se usa?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Depois de «il faut que» (é preciso que...): Il faut que tu viennes. (É preciso que venhas)", "Depois de «je veux que» (quero que...): Je veux que tu m'aides. (Quero que me ajudes)", "Depois de «il est possible que» (é possível que): Il est possible qu'il pleuve. (É possível que chova)", "Depois de «bien que» (embora): Bien qu'il soit fatigué, il travaille. (Embora esteja cansado, ele trabalha)", "Nota importante: o verbo «espérer» (esperar/desejar) em francês usa o presente do indicativo normal, e não o Subjonctif — ao contrário do português e do espanhol! J'espère que tu vas bien. (e não «que tu ailles»)."]}], "tip": false}, {"title": "Os verbos reflexivos", "blocks": [{"type": "p", "html": "O pronome coloca-se sempre antes do verbo conjugado, tal como acontece no português brasileiro e no espanhol:", "italic": false}, {"type": "table", "headers": ["Pronome", "se lever (levantar-se)", "s'appeler (chamar-se)", "se laver (lavar-se)"], "rows": [[{"t": <script>
(function(){
  var DATA = window.GUIDE_DATA;       // { ar: {chapters:[...], closingBasic, closingAdvanced}, en: {...}, ... }
  var STR = window.GUIDE_STRINGS;     // per-language UI strings for this guide
  var META = window.GUIDE_META;       // { waNumberByLang, ptFallback }

  function waLink(lang){
    var num = META.waNumberByLang[lang] || META.waNumberByLang.en;
    var msg = STR.waMsg[lang] || STR.waMsg.en;
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }

  function renderTableBlock(b){
    var html = '<table><thead><tr>' + b.headers.map(function(h){ return '<th>'+h+'</th>'; }).join('') + '</tr></thead><tbody>';
    b.rows.forEach(function(row){
      html += '<tr>' + row.map(function(c){ return '<td'+(c.b?' class="phrase-it"':'')+'>'+c.t+'</td>'; }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function renderListBlock(b, isTip, tipLabelFallback){
    var boxClass = isTip ? 'tip-box' : 'goal-box';
    var html = '<div class="'+boxClass+'">';
    if (isTip) {
      html += '<span class="tip-label">' + (b.label || tipLabelFallback || '') + '</span>';
    } else if (b.label) {
      html += '<strong>' + b.label + '</strong>';
    }
    if (b.intro) html += '<p style="margin-top:8px;">' + b.intro + '</p>';
    if (b.items && b.items.length) {
      html += '<ul>' + b.items.map(function(it){ return '<li>' + it + '</li>'; }).join('') + '</ul>';
    }
    html += '</div>';
    return html;
  }

  function renderDialogueBlock(b){
    var html = '<div class="dialogue">';
    b.lines.forEach(function(line){
      html += '<div class="line">';
      if (line.speaker) html += '<span class="speaker">' + line.speaker + '</span> ';
      html += '<span class="orig">' + line.orig + '</span><br><span class="trans">' + (line.trans || '') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderBlock(b, isTip, tipLabelFallback){
    switch(b.type){
      case 'p': return '<p' + (b.italic ? ' style="font-style:italic;"' : '') + '>' + b.html + '</p>';
      case 'h3': return '<h3>' + b.text + '</h3>';
      case 'table': return renderTableBlock(b);
      case 'list': return renderListBlock(b, isTip, tipLabelFallback);
      case 'dialogue': return renderDialogueBlock(b);
      default: return '';
    }
  }

  function render(lang){
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    var doc = DATA[lang] || DATA.en;
    var s = STR;

    document.getElementById('brand-text').textContent = s.brand[lang] || s.brand.en;
    document.getElementById('back-link').textContent = s.backLink[lang] || s.backLink.en;
    document.getElementById('nav-cta').innerHTML = '💬 ' + (s.navCta[lang] || s.navCta.en);
    document.getElementById('nav-cta').href = waLink(lang);
    document.getElementById('hero-title').textContent = s.mainTitle[lang] || s.mainTitle.en;
    document.getElementById('hero-subtitle').textContent = s.mainSubtitle[lang] || s.mainSubtitle.en;
    document.getElementById('byline-name').textContent = s.bylineName[lang] || s.bylineName.en;
    document.getElementById('byline-meta').textContent = s.bylineMeta[lang] || s.bylineMeta.en;
    document.getElementById('toc-heading').textContent = s.tocHeading[lang] || s.tocHeading.en;
    document.getElementById('cta-h3').textContent = s.ctaH3[lang] || s.ctaH3.en;
    document.getElementById('cta-p').textContent = s.ctaP[lang] || s.ctaP.en;
    document.getElementById('cta-btn-text').textContent = s.navCta[lang] || s.navCta.en;
    document.getElementById('cta-btn-bottom').href = waLink(lang);
    document.getElementById('floating-wa').href = waLink(lang);
    document.getElementById('footer-copyright').textContent = s.footerCopyright[lang] || s.footerCopyright.en;
    document.getElementById('footer-back').textContent = s.footerBack[lang] || s.footerBack.en;

    var chapters = doc.chapters;
    var tocHtml = '';
    var chaptersHtml = '';
    chapters.forEach(function(ch, i){
      var num = i + 1;
      if (ch.dividerBefore) {
        tocHtml += '<span class="toc-part">' + (s.partTag[lang]||s.partTag.en) + ' — ' + (s.partTitle[lang]||s.partTitle.en) + '</span>';
      }
      tocHtml += '<a href="#c' + num + '">' + num + '. ' + ch.title + '</a>';

      if (ch.dividerBefore) {
        chaptersHtml += '<div class="part-divider"><span class="tag">' + (s.partTag[lang]||s.partTag.en) + '</span><h2>' + (s.partTitle[lang]||s.partTitle.en) + '</h2></div>';
      }
      chaptersHtml += '<div class="chapter" id="c' + num + '"><h2>' + num + '. ' + ch.title + '</h2>';
      ch.blocks.forEach(function(b){
        chaptersHtml += renderBlock(b, ch.tip, null);
      });
      if (i === chapters.length - 1 && doc.closingAdvanced) {
        chaptersHtml += '<p style="text-align:center;font-weight:800;color:var(--brand-blue-dark);margin-top:20px;">' + doc.closingAdvanced + '</p>';
      }
      chaptersHtml += '</div>';
    });
    document.getElementById('toc-grid').innerHTML = tocHtml;
    document.getElementById('chapters-container').innerHTML = chaptersHtml;
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ render(btn.getAttribute('data-lang')); });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(DATA[savedLang] ? savedLang : 'ar');
})();
</script>
