 false}, {"title": "خطة عملية: إزاي تتعلم بسرعة", "blocks": [{"type": "list", "label": "<strong>٧ خطوات لتثبيت اللغة بسرعة</strong>", "intro": null, "items": ["اسمع أغاني ومسلسلات فرنسية يوميًا ولو ١٠ دقايق بس — الأذن بتتعود على النغمة قبل العقل.", "اتمرّن على «الشادوينج»: اسمع جملة قصيرة وكررها فورًا بنفس النغمة والسرعة.", "ركّز على الأصوات الأنفية وحرف الـr قدام المرآة لحد ما تحس إنها بقت طبيعية.", "متترجمش في دماغك — حاول تفكر بالكلمة الفرنساوية مباشرة من غير ما تمر بالعربي.", "استخدم تطبيق زي Duolingo أو Babbel جنب الكتيب ده لتثبيت المفردات بالتكرار.", "اتكلم من أول يوم ولو غلط — الطلاقة بتيجي بالممارسة مش بالحفظ.", "استغل ظاهرة الـLiaison في التمرين — اقرأ جمل كاملة بصوت عالٍ عشان تعتاد الربط بين الكلمات."]}], "tip": true}, {"title": "مقدمة: الكتيب ده لمين؟", "blocks": [{"type": "p", "html": "الكتيب ده هو الجزء التاني بعد كتيب «تعلّم الفرنساوي بسهولة» اللي غطّى الأساسيات. لو خلّصت المستوى الأساسي وعايز مستوى تقدر تعتمد عليه فعلاً في السفر والشغل والحياة اليومية في فرنسا، فالكتيب ده هيدّيك: الأزمنة اللي هتحتاجها عشان تحكي عن الماضي والمستقبل، مفردات عملية لمواقف حقيقية، وحوارات واقعية.", "italic": false}, {"type": "list", "label": "<strong>قبل ما تبدأ</strong>", "intro": null, "items": ["لازم تكون عارف: التحيات، الضمائر، فعل être، تصريف المضارع، والأرقام — كلهم في الكتيب الأساسي.", "هدفنا هنا مش تعلّم كل حاجة عن اللغة، لكن نديك أدوات كافية تتصرف بيها لوحدك في أي موقف.", "خد وقتك في كل فصل، وطبّق الأمثلة بصوت عالٍ قبل ما تكمل للي بعده."]}], "tip": false, "dividerBefore": true}, {"title": "مراجعة سريعة للمستوى الأساسي", "blocks": [{"type": "h3", "text": "<strong>الضمائر</strong>"}, {"type": "table", "headers": ["je", "tu", "il/elle", "nous", "vous/ils"], "rows": [[{"t": "أنا", "b": false}, {"t": "إنتَ", "b": false}, {"t": "هو/هي", "b": false}, {"t": "إحنا", "b": false}, {"t": "إنتوا/هما", "b": false}]]}, {"type": "h3", "text": "<strong>المضارع — الأنماط المنتظمة</strong>"}, {"type": "table", "headers": ["الضمير", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "je ans": "مساء الخير، رحلتي لباريس متأخرة؟"}, {"speaker": "Employé:", "orig": "Oui, malheureusement il a une heure de retard.", "trans": "أيوه للأسف متأخرة ساعة."}, {"speaker": "Passager:", "orig": "Je vais rater ma correspondance pour Lyon?", "trans": "هفوّت الرحلة اللي هتوصلني ليون؟"}, {"speaker": "Employé:", "orig": "Ne vous inquiétez pas, nous avons déjà réorganisé votre voyage.", "trans": "متقلقش، إحنا رتبنا رحلتك تاني."}]}, {"type": "h3", "text": "<strong>٢) شكوى في الفندق</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Client:", "orig": "Excusez-moi, la climatisation de ma chambre ne marche pas.", "trans": "معلش، تكييف أوضتي مش شغال."}, {"speaker": "Réception:", "orig": "Je suis désolé. J'envoie quelqu'un tout de suite.", "trans": "آسفين جدًا. هبعتلك حد فورًا."}, {"speaker": "Client:", "orig": "Merci. Je voudrais aussi changer de chambre, si possible.", "trans": "شكرًا. حبيت كمان أغيّر أوضة لو ممكن."}, {"speaker": "Réception:", "orig": "Bien sûr, je vais vérifier la disponibilité.", "trans": "أكيد، هشوف لو فيه أوضة فاضية."}]}, {"type": "h3", "text": "<strong>٣) في الصيدلية</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Client:", "orig": "Bonsoir, je ne me sens pas bien. J'ai mal à la tête et de la fièvre.", "trans": "مساء الخير، مش حاسس إني كويس. عندي صداع وسخونية."}, {"speaker": "Pharmacien:", "orig": "Depuis quand avez-vous ces symptômes?", "trans": "من امتى وأنت حاسس بالأعراض دي؟"}, {"speaker": "Client:", "orig": "Depuis hier soir.", "trans": "من امبارح بالليل."}, {"speaker": "Pharmacien:", "orig": "Prenez ce médicament toutes les huit heures.", "trans": "خد الدوا ده كل ٨ ساعات."}]}, {"type": "h3", "text": "<strong>٤) تأجير عربية</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Client:", "orig": "Je voudrais louer une voiture pour trois jours.", "trans": "عايز أأجّر عربية لتلات أيام."}, {"speaker": "Employé:", "orig": "Bien sûr. Puis-je voir votre permis de conduire?", "trans": "أكيد. ممكن أشوف رخصة القيادة؟"}, {"speaker": "Client:", "orig": "Voilà. L'assurance est incluse?", "trans": "اتفضل. التأمين داخل في السعر؟"}, {"speaker": "Employé:", "orig": "Oui, l'assurance de base est incluse dans le prix.", "trans": "أيوه، التأمين الأساسي داخل في السعر."}]}, {"type": "h3", "text": "<strong>٥) سؤال عن الاتجاهات</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Touriste:", "orig": "Excusez-moi, comment j'arrive à la tour Eiffel?", "trans": "معلش، أروح إزاي لبرج إيفل؟"}, {"speaker": "Habitant:", "orig": "Continuez tout droit et tournez à droite à la deuxième rue.", "trans": "كمّل دُغري وبعدين لف يمين في تاني شارع."}, {"speaker": "Touriste:", "orig": "C'est très loin d'ici?", "trans": "ده بعيد أوي من هنا؟"}, {"speaker": "Habitant:", "orig": "Non, c'est à dix minutes à pied.", "trans": "لأ، حوالي ١٠ دقايق مشي."}]}], "tip": false}, {"title": "نص قرائي للتدريب", "blocks": [{"type": "p", "html": "اقرأ النص ده كذا مرة بصوت عالٍ، وحاول تفهمه من غير ما تترجم كل كلمة:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>مفردات مهمة من النص</strong>"}, {"type": "table", "headers": ["المعنى", "الكلمة"], "rows": [[{"t": "وسط البلد", "b": false}, {"t": "centre-ville", "b": false}], [{"t": "برج إيفل", "b": false}, {"t": "la tour Eiffel", "b": false}], [{"t": "نهر السين في باريس", "b": false}, {"t": "la Seine", "b": false}], [{"t": "ما يُنسى", "b": false}, {"t": "inoubliable", "b": false}]]}, {"type": "h3", "text": "<strong>أسئلة للفهم</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["الأسرة راحت باريس إمتى؟", "عملوا إيه بعد الـcheck-in؟", "سمعوا موسيقى حية فين؟"]}, {"type": "p", "html": "<em>الإجابات: ١) بالأمس ٢) راحوا وسط البلد يتغدّوا ٣) جنب نهر السين بالليل</em>", "italic": true}], "tip": false}, {"title": "خاتمة وخطوات نحو الطلاقة الكاملة", "blocks": [{"type": "list", "label": "<strong>للوصول للطلاقة الكاملة</strong>", "intro": null, "items": ["اقرأ جرايد أو مقالات فرنسية بسيطة يوميًا وحاول تفهم من السياق قبل ما تترجم.", "اتكلم مع متحدثين أصليين (أونلاين أو لو سافرت) — التطبيق العملي أهم حاجة دلوقتي.", "اكتب يوميات قصيرة بالفرنساوي كل يوم — حتى ٣-٤ جمل بتفرق كتير على المدى الطويل.", "راجع الأزمنة دي كل شوية لحد ما تبقى تلقائية من غير ما تفكر فيها.", "متخافش من الغلط في المحادثة — الفرنساويين بيتقدّروا جدًا أي حد بيحاول يتكلم لغتهم."]}], "tip": true}], "closingBasic": "مبروك مقدمًا على رحلتك مع اللغة الفرنسية — Bonne chance! (حظ سعيد!)", "closingAdvanced": "رحلتك مع الفرنساوي بقت جاهزة للمستوى اللي تقدر تعتمد عليه فعلاً — Bonne chance! (حظ سعيد!)"}, "en": {"chapters": [{"title": "Introduction: why learn French?", "blocks": [{"type": "p", "html": "French is the official language in more than 29 countries, spoken by over 300 million people worldwide, and is recognised globally as the language of diplomacy, art and literature. This book gives you a solid foundation in standard French as spoken in France.", "italic": false}, {"type": "p", "html": "The good news: French grammar is logical and fairly organised. The main difficulty lies in pronunciation — there are silent letters, distinctive nasal sounds, and a phenomenon called «Liaison» that links words together. That is exactly what we'll focus on from the very first chapter.", "italic": false}, {"type": "list", "label": "Goals of this book", "intro": null, "items": ["Give you a solid base of essential vocabulary and grammar in the shortest time possible.", "Focus on correct pronunciation so your accent sounds authentically French.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The alphabet and pronunciation basics", "blocks": [{"type": "p", "html": "French uses the Latin alphabet, but many letters go silent at the end of a word. This table shows the most distinctive letters and sounds:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Word"], "rows": [[{"t": "house", "b": false}, {"t": "meh-ZOHN", "b": false}, {"t": "maison (s between vowels = z)", "b": true}], [{"t": "hello/good morning", "b": false}, {"t": "bohn-ZHOOR", "b": false}, {"t": "bonjour (on = nasal sound, j = soft «zh»)", "b": true}], [{"t": "thank you", "b": false}, {"t": "mehr-SEE", "b": false}, {"t": "merci", "b": true}], [{"t": "cat", "b": false}, {"t": "SHAH", "b": false}, {"t": "chat (ch = «sh», final t is silent)", "b": true}], [{"t": "I", "b": false}, {"t": "ZHUH", "b": false}, {"t": "je (soft «zh» sound — careful, nothing like English j)", "b": true}], [{"t": "boy", "b": false}, {"t": "gar-SOHN", "b": false}, {"t": "garçon (ç = s)", "b": true}], [{"t": "French", "b": false}, {"t": "frahn-SEH", "b": false}, {"t": "français (ç = s, final s is silent)", "b": true}], [{"t": "water", "b": false}, {"t": "OH", "b": false}, {"t": "eau (the whole group eau is just «oh»)", "b": true}], [{"t": "egg", "b": false}, {"t": "UHF", "b": false}, {"t": "œuf (a vowel sound with no direct English equivalent)", "b": true}], [{"t": "wine", "b": false}, {"t": "VAHN", "b": false}, {"t": "vin (in = nasal sound)", "b": true}]]}], "tip": false}, {"title": "The golden rules for authentic pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference to sounding truly French:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Final consonants are usually silent (like the t in chat), unless followed by an e.", "Nasal sounds (an, en, in, on, un) are pronounced through the nose — English doesn't have this, so practise in front of a mirror.", "The French r is a guttural sound, made at the back of the throat — very different from the English r.", "Watch out for an important false friend! The letter j, and g before e or i, are pronounced with a soft «zh» sound (as in «je») — completely different from the hard English j.", "The group ch is pronounced like English «sh», never like a hard c.", "The «Liaison» phenomenon: a final consonant that's normally silent can be pronounced if the next word starts with a vowel — as in «les amis», pronounced «lezami» rather than «le ami»."]}], "tip": false}, {"title": "Greetings and essential phrases", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "French"], "rows": [[{"t": "Good morning/hello (formal)", "b": false}, {"t": "bohn-ZHOOR", "b": false}, {"t": "Bonjour", "b": true}], [{"t": "Good evening (on arrival)", "b": false}, {"t": "bohn-SWAHR", "b": false}, {"t": "Bonsoir", "b": true}], [{"t": "Hi (casual)", "b": false}, {"t": "sah-LUE", "b": false}, {"t": "Salut", "b": true}], [{"t": "How are you?", "b": false}, {"t": "koh-mahn sah VAH", "b": false}, {"t": "Comment ça va?", "b": true}], [{"t": "Fine, thanks", "b": false}, {"t": "sah vah bee-EN, mehr-SEE", "b": false}, {"t": "Ça va bien, merci", "b": true}], [{"t": "Nice to meet you", "b": false}, {"t": "ohn-shahn-TAY", "b": false}, {"t": "Enchanté", "b": true}], [{"t": "See you soon", "b": false}, {"t": "ah bee-en-TOH", "b": false}, {"t": "À bientôt", "b": true}], [{"t": "See you tomorrow", "b": false}, {"t": "ah duh-MAHN", "b": false}, {"t": "À demain", "b": true}], [{"t": "Goodbye", "b": false}, {"t": "oh ruh-VWAHR", "b": false}, {"t": "Au revoir", "b": true}], [{"t": "Please (formal)", "b": false}, {"t": "seel voo PLEH", "b": false}, {"t": "S'il vous plaît", "b": true}], [{"t": "Thank you", "b": false}, {"t": "mehr-SEE", "b": false}, {"t": "Merci", "b": true}], [{"t": "You're welcome", "b": false}, {"t": "duh ree-EN", "b": false}, {"t": "De rien", "b": true}], [{"t": "Excuse me", "b": false}, {"t": "par-DOHN / ex-kuh-ZAY mwah", "b": false}, {"t": "Pardon / Excusez-moi", "b": true}], [{"t": "Yes", "b": false}, {"t": "WEE", "b": false}, {"t": "Oui", "b": true}], [{"t": "No", "b": false}, {"t": "NOHN", "b": false}, {"t": "Non", "b": true}]]}], "tip": false}, {"title": "Pronouns and the verb «être» (to be)", "blocks": [{"type": "p", "html": "Unlike English, French has no separate verb for \"to be\" states versus locations — one single verb, «être», covers identity, description and temporary state alike.", "italic": false}, {"type": "h3", "text": "Pronouns"}, {"type": "table", "headers": ["English", "French"], "rows": [[{"t": "I", "b": false}, {"t": "je", "b": true}], [{"t": "you (singular, informal)", "b": false}, {"t": "tu", "b": true}], [{"t": "he/she", "b": false}, {"t": "il / elle", "b": true}], [{"t": "we", "b": false}, {"t": "nous", "b": true}], [{"t": "you (formal/plural)", "b": false}, {"t": "vous", "b": true}], [{"t": "they", "b": false}, {"t": "ils / elles", "b": true}]]}, {"type": "h3", "text": "être — to be"}, {"type": "table", "headers": ["Pronoun", "Conjugation"], "rows": [[{"t": "je", "b": false}, {"t": "suis", "b": true}], [{"t": "tu", "b": false}, {"t": "es", "b": true}], [{"t": "il/elle", "b": false}, {"t": "est", "b": true}], [{"t": "nous", "b": false}, {"t": "sommes", "b": true}], [{"t": "vous", "b": false}, {"t": "êtes", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "sont", "b": true}]]}, {"type": "p", "html": "Example: Je suis anglais — I am English. — Je suis à Paris — I am (currently) in Paris. Notice how the same verb covers both!", "italic": false}], "tip": false}, {"title": "Common verbs and their conjugation", "blocks": [{"type": "p", "html": "Regular French verbs fall into two main groups by their ending: -er, -ir. Once you know the pattern, you can conjugate any regular verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ir (finir: to finish)", "-er (parler: to speak)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": true}], [{"t": "tu", "b": false}, {"t": "finis", "b": false}, {"t": "parles", "b": true}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": true}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": true}], [{"t": "vous", "b": false}, {"t": "finissez", "b": false}, {"t": "parlez", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": true}]]}, {"type": "h3", "text": "Key irregular verbs (je and tu forms)"}, {"type": "table", "headers": ["Meaning", "je", "tu", "Verb"], "rows": [[{"t": "to have", "b": false}, {"t": "ai", "b": false}, {"t": "as", "b": false}, {"t": "avoir", "b": true}], [{"t": "to go", "b": false}, {"t": "vais", "b": false}, {"t": "vas", "b": false}, {"t": "aller", "b": true}], [{"t": "to do/make", "b": false}, {"t": "fais", "b": false}, {"t": "fais", "b": false}, {"t": "faire", "b": true}], [{"t": "to be able to", "b": false}, {"t": "peux", "b": false}, {"t": "peux", "b": false}, {"t": "pouvoir", "b": true}], [{"t": "to want", "b": false}, {"t": "veux", "b": false}, {"t": "veux", "b": false}, {"t": "vouloir", "b": true}], [{"t": "to know", "b": false}, {"t": "sais", "b": false}, {"t": "sais", "b": false}, {"t": "savoir", "b": true}]]}], "tip": false}, {"title": "Numbers from 0 to 100", "blocks": [{"type": "table", "headers": ["No.", "French", "No.", "French"], "rows": [[{"t": "0", "b": false}, {"t": "zéro", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": true}], [{"t": "1", "b": false}, {"t": "un", "b": false}, {"t": "12", "b": false}, {"t": "douze", "b": true}], [{"t": "2", "b": false}, {"t": "deux", "b": false}, {"t": "13", "b": false}, {"t": "treize", "b": true}], [{"t": "3", "b": false}, {"t": "trois", "b": false}, {"t": "14", "b": false}, {"t": "quatorze", "b": true}], [{"t": "4", "b": false}, {"t": "quatre", "b": false}, {"t": "15", "b": false}, {"t": "quinze", "b": true}], [{"t": "5", "b": false}, {"t": "cinq", "b": false}, {"t": "16", "b": false}, {"t": "seize", "b": true}], [{"t": "6", "b": false}, {"t": "six", "b": false}, {"t": "17", "b": false}, {"t": "dix-sept", "b": true}], [{"t": "7", "b": false}, {"t": "sept", "b": false}, {"t": "18", "b": false}, {"t": "dix-huit", "b": true}], [{"t": "8", "b": false}, {"t": "huit", "b": false}, {"t": "19", "b": false}, {"t": "dix-neuf", "b": true}], [{"t": "9", "b": false}, {"t": "neuf", "b": false}, {"t": "20", "b": false}, {"t": "vingt", "b": true}], [{"t": "10", "b": false}, {"t": "dix", "b": false}, {"t": "30", "b": false}, {"t": "trente", "b": true}]]}, {"type": "table", "headers": ["No.", "French", "No.", "French"], "rows": [[{"t": "40", "b": false}, {"t": "quarante", "b": false}, {"t": "80", "b": false}, {"t": "quatre-vingts", "b": true}], [{"t": "50", "b": false}, {"t": "cinquante", "b": false}, {"t": "90", "b": false}, {"t": "quatre-vingt-dix", "b": true}], [{"t": "60", "b": false}, {"t": "soixante", "b": false}, {"t": "100", "b": false}, {"t": "cent", "b": true}], [{"t": "70", "b": false}, {"t": "soixante-dix", "b": false}, {"t": "", "b": false}, {"t": "", "b": true}]]}, {"type": "p", "html": "Fun fact: French has no separate words for 70, 80 and 90! 70 is literally «sixty-ten» (soixante-dix), 80 is «four twenties» (quatre-vingts), and 90 is «four-twenty-ten» (quatre-vingt-dix). It's an old counting system still used in France (unlike Belgium and Switzerland, which have direct words).", "italic": true}], "tip": false}, {"title": "Days of the week and months", "blocks": [{"type": "table", "headers": ["Day", "French"], "rows": [[{"t": "Monday", "b": false}, {"t": "lundi", "b": true}], [{"t": "Tuesday", "b": false}, {"t": "mardi", "b": true}], [{"t": "Wednesday", "b": false}, {"t": "mercredi", "b": true}], [{"t": "Thursday", "b": false}, {"t": "jeudi", "b": true}], [{"t": "Friday", "b": false}, {"t": "vendredi", "b": true}], [{"t": "Saturday", "b": false}, {"t": "samedi", "b": true}], [{"t": "Sunday", "b": false}, {"t": "dimanche", "b": true}]]}, {"type": "h3", "text": "Months"}, {"type": "table", "headers": ["Month", "French", "Month", "French"], "rows": [[{"t": "January", "b": false}, {"t": "janvier", "b": false}, {"t": "July", "b": false}, {"t": "juillet", "b": true}], [{"t": "February", "b": false}, {"t": "février", "b": false}, {"t": "August", "b": false}, {"t": "août", "b": true}], [{"t": "March", "b": false}, {"t": "mars", "b": false}, {"t": "September", "b , "b": true}], [{"t": "daughter", "b": false}, {"t": "fee-yuh", "b": false}, {"t": "fille", "b": true}], [{"t": "grandfather", "b": false}, {"t": "grahn-pehr", "b": false}, {"t": "grand-père", "b": true}], [{"t": "grandmother", "b": false}, {"t": "grahn-mehr", "b": false}, {"t": "grand-mère", "b": true}], [{"t": "husband", "b": false}, {"t": "mah-REE", "b": false}, {"t": "mari", "b": true}], [{"t": "wife", "b": false}, {"t": "fahm", "b": false}, {"t": "femme", "b": true}], [{"t": "uncle", "b": false}, {"t": "ohnkl", "b": false}, {"t": "oncle", "b": true}], [{"t": "aunt", "b": false}, {"t": "tahnt", "b": false}, {"t": "tante", "b": true}]]}], "tip": false}, {"title": "Food and drink", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "French"], "rows": [[{"t": "bread", "b": false}, {"t": "pan", "b": false}, {"t": "pain", "b": true}], [{"t": "water", "b": false}, {"t": "oh", "b": false}, {"t": "eau", "b": true}], [{"t": "coffee", "b": false}, {"t": "kah-FAY", "b": false}, {"t": "café", "b": true}], [{"t": "tea", "b": false}, {"t": "tay", "b": false}, {"t": "thé", "b": true}], [{"t": "meat", "b": false}, {"t": "vee-AHND", "b": false}, {"t": "viande", "b": true}], [{"t": "chicken", "b": false}, {"t": "poo-LEH", "b": false}, {"t": "poulet", "b": true}], [{"t": "fish", "b": false}, {"t": "pwah-SOHN", "b": false}, {"t": "poisson", "b": true}], [{"t": "cheese", "b": false}, {"t": "froh-MAHZH", "b": false}, {"t": "fromage", "b": true}], [{"t": "fruit", "b": false}, {"t": "frwee", "b": false}, {"t": "fruit", "b": true}], [{"t": "vegetables", "b": false}, {"t": "lay-GUEM", "b": false}, {"t": "légumes", "b": true}], [{"t": "dessert", "b": false}, {"t": "deh-SEHR", "b": false}, {"t": "dessert", "b": true}], [{"t": "breakfast", "b": false}, {"t": "puh-tee day-zhuh-NAY", "b": false}, {"t": "petit-déjeuner", "b": true}], [{"t": "lunch", "b": false}, {"t": "day-zhuh-NAY", "b": false}, {"t": "déjeuner", "b": true}], [{"t": "dinner", "b": false}, {"t": "dee-NAY", "b": false}, {"t": "dîner", "b": true}]]}], "tip": false}, {"title": "Essential phrases for travel and hotels", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "French"], "rows": [[{"t": "Where is...?", "b": false}, {"t": "oo suh troov", "b": false}, {"t": "Où se trouve...?", "b": true}], [{"t": "How much is this?", "b": false}, {"t": "kohm-bee-EN sah koot", "b": false}, {"t": "Combien ça coûte?", "b": true}], [{"t": "Can I see the menu?", "b": false}, {"t": "zhuh puh vwahr luh muh-NUE", "b": false}, {"t": "Je peux voir le menu?", "b": true}], [{"t": "The bill, please", "b": false}, {"t": "lah-dee-see-OHN seel voo pleh", "b": false}, {"t": "L'addition, s'il vous plaît", "b": true}], [{"t": "Where is the toilet?", "b": false}, {"t": "oo sohn lay twah-LEHT", "b": false}, {"t": "Où sont les toilettes?", "b": true}], [{"t": "I need help", "b": false}, {"t": "zhay buh-zwan ded", "b": false}, {"t": "J'ai besoin d'aide", "b": true}], [{"t": "I don't understand", "b": false}, {"t": "zhuh nuh kohm-prahn pah", "b": false}, {"t": "Je ne comprends pas", "b": true}], [{"t": "Can you repeat, please?", "b": false}, {"t": "poo-vay voo ruh-peh-TAY", "b": false}, {"t": "Pouvez-vous répéter, s'il vous plaît?", "b": true}], [{"t": "Do you speak English?", "b": false}, {"t": "par-lay voo ahn-GLEH", "b": false}, {"t": "Parlez-vous anglais?", "b": true}], [{"t": "I'd like to book a room", "b": false}, {"t": "zhuh voo-DRAY reh-zehr-vay ewn shahmbr", "b": false}, {"t": "Je voudrais réserver une chambre", "b": true}], [{"t": "What time does the train leave?", "b": false}, {"t": "ah kel uhr par luh trahn", "b": false}, {"t": "À quelle heure part le train?", "b": true}], [{"t": "Where can I get a taxi?", "b": false}, {"t": "oo pweezh prahn-dr an taxi", "b": false}, {"t": "Où puis-je prendre un taxi?", "b": true}]]}], "tip": false}, {"title": "Authentic French expressions and slang", "blocks": [{"type": "p", "html": "These expressions are what separate someone who speaks «textbook» French from someone who sounds genuinely French. Use them in the right context and watch how people's reactions change:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Expression"], "rows": [[{"t": "Okay/sounds good", "b": false}, {"t": "sah marsh", "b": false}, {"t": "Ça marche", "b": true}], [{"t": "Awesome!", "b": false}, {"t": "zhay-nee-AHL", "b": false}, {"t": "Génial!", "b": true}], [{"t": "Honestly (very common filler)", "b": false}, {"t": "frahnsh-MAHN", "b": false}, {"t": "Franchement", "b": true}], [{"t": "Thing/stuff (generic word)", "b": false}, {"t": "truek", "b": false}, {"t": "Truc", "b": true}], [{"t": "Meh/whatever (famous indifference word)", "b": false}, {"t": "bohf", "b": false}, {"t": "Bof", "b": true}], [{"t": "No big deal", "b": false}, {"t": "seh pah grahv", "b": false}, {"t": "C'est pas grave", "b": true}], [{"t": "So/as a result (very popular with young people)", "b": false}, {"t": "due koo", "b": false}, {"t": "Du coup", "b": true}]]}], "tip": false}, {"title": "Full practice dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it aloud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "Bonjour! Bienvenue. Qu'est-ce que vous voulez?", "trans": "Hello! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "Bonjour! Je voudrais un café, s'il vous plaît.", "trans": "Hello! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "C'est tout?", "trans": "Is that all?"}, {"speaker": "Customer:", "orig": "Oui, et l'addition, s'il vous plaît.", "trans": "Yes, and the bill, please."}, {"speaker": "Waiter:", "orig": "Ça fait deux euros. Merci!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "De rien, à bientôt!", "trans": "You're welcome, see you soon!"}]}], "tip": false}, {"title": "Action plan: how to learn fast", "blocks": [{"type": "list", "label": "7 steps to lock in the language quickly", "intro": null, "items": ["Listen to French music and shows every day, even just 10 minutes — the ear adapts to the rhythm before the mind does.", "Practise «shadowing»: listen to a short sentence and repeat it immediately at the same speed and rhythm.", "Practise nasal sounds in front of a mirror — they're the biggest challenge for an English speaker.", "Don't translate in your head — try to think directly in French rather than going through English first.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary.", "Speak from day one, even if you make mistakes — fluency comes from practice, not memorisation.", "Practise «Liaison» by reading full sentences aloud, to get used to linking words together."]}], "tip": true}, {"title": "Introduction: who is this book for?", "blocks": [{"type": "p", "html": "This book is the second part after «Learn French — Easy, Fun and Fast», which covered the basics. If you've already finished the basic level and want to reach a level where you can genuinely get by while travelling, working, and living day to day in France, this book will give you: the verb tenses you need, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "Before you start", "intro": null, "items": ["You should already know: greetings, pronouns, the verb être, present-tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take each chapter slowly, and practise the examples out loud before moving on to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick review of the basic level", "blocks": [{"type": "table", "headers": ["je", "tu", "il/elle", "nous", "vous/ils"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you (pl)/they", "b": true}]]}, {"type": "h3", "text": "Present tense — the regular patterns"}, {"type": "table", "headers": ["Pronoun", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": true}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": true}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": true}], [{"t": "vous", "b": false}, {"t": "finissez", "b": false}, {"t": "parlez", "b": true}]]}], "tip": false}, {"title": "The past: Passé Composé and Imparfait", "blocks": [{"type": "p", "html": "French distinguishes between a completed action (Passé Composé, roughly the English simple past) and a habitual or descriptive past (Imparfait, roughly \"used to\" / \"was -ing\"). The Passé Composé is formed with avoir or être + past participle.", "italic": false}, {"type": "table", "headers": ["Pronoun", "avoir + participle (parler → parlé)", "être + participle (aller → allé)"], "rows": [[{"t": "j'/je", "b": false}, {"t": "j'ai parlé", "b": false}, {"t": "je suis allé(e)", "b": true}], [{"t": "tu", "b": false}, {"t": "tu as parlé", "b": false}, {"t": "tu es allé(e)", "b": true}], [{"t": "il/elle", "b": false}, {"t": "il a parlé", "b": false}, {"t": "il est allé(e)", "b": true}], [{"t": "nous", "b": false}, {"t": "nous avons parlé", "b": false}, {"t": "nous sommes allé(e)s", "b": true}], [{"t": "vous", "b": false}, {"t": "vous avez parlé", "b": false}, {"t": "vous êtes allé(e)(s)", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "ils ont parlé", "b": false}, {"t": "ils sont allé(e)s", "b": true}]]}, {"type": "p", "html": "Rule of thumb: most verbs use avoir. A group of roughly 16 movement/change verbs (aller, venir, partir, arriver, entrer, sortir, monter, descendre, naître, mourir, etc.) and all reflexive verbs use être — and in that case the participle agrees with the subject, like an adjective.", "italic": false}, {"type": "h3", "text": "The Imparfait"}, {"type": "table", "headers": ["Pronoun", "parler → imparfait"], "rows": [[{"t": "je", "b": false}, {"t": "parlais", "b": true}], [{"t": "tu", "b": false}, {"t": "parlais", "b": true}], [{"t": "il/elle", "b": false}, {"t": "parlait", "b": true}], [{"t": "nous", "b": false}, {"t": "parlions", "b": true}], [{"t": "vous", "b": false}, {"t": "parliez", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "parlaient", "b": true}]]}, {"type": "p", "html": "Example: Quand j'étais petit, j'habitais à Londres (Imparfait: description) — Hier, je suis allé au marché (Passé Composé: one-off event).", "italic": false}], "tip": false}, {"title": "Future, near future and conditional", "blocks": [{"type": "table", "headers": ["Use", "Formation", "Example"], "rows": [[{"t": "Near future (upcoming intention)", "b": false}, {"t": "aller (present) + infinitive", "b": false}, {"t": "Je vais partir demain — I'm going to leave tomorrow", "b": true}], [{"t": "Simple future (prediction)", "b": false}, {"t": "infinitive + endings (-ai, -as, -a, -ons, -ez, -ont)", "b": false}, {"t": "Je partirai l'année prochaine — I will leave next year", "b": true}], [{"t": "Conditional (hypothesis, politeness)", "b": false}, {"t": "future stem + imparfait endings", "b": false}, {"t": "Je voudrais un café — I would like a coffee", "b": true}]]}], "tip": false}, {"title": "Reflexive verbs and object pronouns", "blocks": [{"type": "table", "headers": ["Subject pronoun", "Reflexive pronoun", "se laver (to wash oneself)"], "rows": [[{"t": "je", "b": false}, {"t": "me", "b": false}, {"t": "je me lave", "b": true}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "tu te laves", "b": true}], [{"t": "il/elle", "b": false}, {"t": "se", "b": false}, {"t": "il se lave", "b": true}], [{"t": "nous", "b": false}, {"t": "nous", "b": false}, {"t": "nous nous lavons", "b": true}], [{"t": "vous", "b": false}, {"t": "vous", "b": false}, {"t": "vous vous lavez", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "se", "b": false}, {"t": "ils se lavent", "b": true}]]}, {"type": "p", "html": "Direct object pronouns (me, te, le/la, nous, vous, les) and indirect object pronouns (me, te, lui, nous, vous, leur) go before the verb, unlike English word order: Je le vois (I see him/it), Je lui parle (I speak to him/her).", "italic": false}], "tip": false}, {"title": "Prepositions and their fusion with articles", "blocks": [{"type": "p", "html": "The prepositions à and de obligatorily fuse with the definite articles le and les:", "italic": false}, {"type": "table", "headers": ["Preposition + article", "Fused form", "Example"], "rows": [[{"t": "à + le", "b": false}, {"t": "au", "b": false}, {"t": "Je vais au marché", "b": true}], [{"t": "à + les", "b": false}, {"t": "aux", "b": false}, {"t": "Je parle aux enfants", "b": true}], [{"t": "de + le", "b": false}, {"t": "du", "b": false}, {"t": "Je viens du bureau", "b": true}], [{"t": "de + les", "b": false}, {"t": "des", "b": false}, {"t": "La couleur des fleurs", "b": true}]]}, {"type": "p", "html": "Note: à la and à l' never change (à la maison, à l'école), and the same is true for de la and de l'.", "italic": false}], "tip": false}, {"title": "Comparatives, superlatives and advanced connectors", "blocks": [{"type": "table", "headers": ["Structure", "French", "Meaning"], "rows": [[{"t": "more... than", "b": false}, {"t": "plus... que", "b": false}, {"t": "Il est plus grand que moi", "b": true}], [{"t": "less... than", "b": false}, {"t": "moins... que", "b": false}, {"t": "C'est moins cher qu'avant", "b": true}], [{"t": "as... as", "b": false}, {"t": "aussi... que", "b": false}, {"t": "Elle est aussi rapide que lui", "b": true}], [{"t": "the most", "b": false}, {"t": "le plus / la plus", "b": false}, {"t": "C'est le plus beau quartier", "b": true}], [{"t": "however", "b": false}, {"t": "cependant", "b": false}, {"t": "formal contrast connector", "b": true}], [{"t": "therefore/so", "b": false}, {"t": "donc", "b": false}, {"t": "consequence connector", "b": true}], [{"t": "although", "b": false}, {"t": "bien que (+ subjunctive)", "b": false}, {"t": "concession connector", "b": true}]]}], "tip": false}, {"title": "Vocabulary: airport and customs", "blocks": [{"type": "table", "headers": ["Meaning", "French"], "rows": [[{"t": "boarding pass", "b": false}, {"t": "carte d'embarquement", "b": true}], [{"t": "carry-on luggage", "b": false}, {"t": "bagage à main", "b": true}], [{"t": "baggage claim", "b": false}, {"t": "retrait des bagages", "b": true}], [{"t": "delayed flight", "b": false}, {"t": "vol retardé", "b": true}], [{"t": "customs", "b": false}, {"t": "douane", "b": true}], [{"t": "passport", "b": false}, {"t": "passeport", "b": true}], [{"t": "nothing to declare", "b": false}, {"t": "rien à déclarer", "b": true}], [{"t": "boarding gate", "b": false}, {"t": "porte d'embarquement", "b": true}]]}], "tip": false}, {"title": "Vocabulary: hotel, health and emergencies", "blocks": [{"type": "table", "headers": ["Meaning", "French"], "rows": [[{"t": "There's no hot water", "b": false}, {"t": "Il n'y a pas d'eau chaude", "b": true}], [{"t": "The room isn't ready", "b": false}, {"t": "La chambre n'est pas prête", "b": true}], [{"t": "I'd like to change rooms", "b": false}, {"t": "Je voudrais changer de chambre", "b": true}], [{"t": "pharmacy", "b": false}, {"t": "pharmacie", "b": true}], [{"t": "I need a doctor", "b": false}, {"t": "J'ai besoin d'un médecin", "b": true}], [{"t": "It hurts here", "b": false}, {"t": "J'ai mal ici", "b": true}], [{"t": "Call an ambulance!", "b": false}, {"t": "Appelez une ambulance!", "b": true}], [{"t": "hospital", "b": false}, {"t": "hôpital", "b": true}], [{"t": "health insurance", "b": false}, {"t": "assurance maladie", "b": true}]]}], "tip": false}, {"title": "Vocabulary: bank, police and official matters", "blocks": [{"type": "table", "headers": ["Meaning", "French"], "rows": [[{"t": "current account", "b": false}, {"t": "compte courant", "b": true}], [{"t": "ATM", "b": false}, {"t": "distributeur automatique", "b": true}], [{"t": "exchange rate", "b": false}, {"t": "taux de change", "b": true}], [{"t": "I've lost my wallet", "b": false}, {"t": "J'ai perdu mon portefeuille", "b": true}], [{"t": "police report", "b": false}, {"t": "dépôt de plainte", "b": true}], [{"t": "police station", "b": false}, {"t": "commissariat de police", "b": true}], [{"t": "town hall", "b": false}, {"t": "mairie", "b": true}], [{"t": "residence permit", "b": false}, {"t": "titre de séjour", "b": true}]]}], "tip": false}, {"title": "Vocabulary: transport and directions", "blocks": [{"type": "table", "headers": ["Meaning", "French"], "rows": [[{"t": "one-way ticket", "b": false}, {"t": "billet aller simple", "b": true}], [{"t": "round trip", "b": false}, {"t": "aller-retour", "b": true}], [{"t": "car rental", "b": false}, {"t": "location de voiture", "b": true}], [{"t": "Turn right", "b": false}, {"t": "Tournez à droite", "b": true}], [{"t": "Go straight ahead", "b": false}, {"t": "Allez tout droit", "b": true}], [{"t": "traffic light", "b": false}, {"t": "feu (de circulation)", "b": true}], [{"t": "roundabout", "b": false}, {"t": "rond-point", "b": true}], [{"t": "platform", "b": false}, {"t": "quai", "b": true}], [{"t": "bus stop", "b": false}, {"t": "arrêt de bus", "b": true}]]}], "tip": false}, {"title": "Vocabulary: shopping and work", "blocks": [{"type": "table", "headers": ["Meaning", "French"], "rows": [[{"t": "Can you give me a discount?", "b": false}, {"t": "Vous pouvez me faire une remise?", "b": true}], [{"t": "size (clothing)", "b": false}, {"t": "taille", "b": true}], [{"t": "fitting room", "b": false}, {"t": "cabine d'essayage", "b": true}], [{"t": "meeting", "b": false}, {"t": "réunion", "b": true}], [{"t": "deadline", "b": false}, {"t": "date limite", "b": true}], [{"t": "job application", "b": false}, {"t": "candidature", "b": true}], [{"t": "job interview", "b": false}, {"t": "entretien d'embauche", "b": true}], [{"t": "salary", "b": false}, {"t": "salaire", "b": true}]]}], "tip": false}, {"title": "Etiquette: formal or informal?", "blocks": [{"type": "p", "html": "French clearly distinguishes tu (informal, friends and family) from vous (formal, strangers, superiors, professional settings) — a distinction English lost centuries ago. Using tu in the wrong context can come across as rude. When in doubt, always use vous until you're invited to switch (on peut se tutoyer?).", "italic": false}, {"type": "list", "label": "Practical rules", "intro": null, "items": ["With strangers, shopkeepers, colleagues you don't know well: vous.", "With friends, children, pets, family: tu.", "Formal emails open with «Madame, Monsieur» and close with «Cordialement» or «Veuillez agréer mes salutations distinguées»."]}], "tip": false}, {"title": "Advanced idiomatic expressions", "blocks": [{"type": "table", "headers": ["Meaning", "Expression"], "rows": [[{"t": "To cost an arm and a leg", "b": false}, {"t": "Coûter les yeux de la tête", "b": true}], [{"t": "To be distracted/miles away", "b": false}, {"t": "Avoir la tête ailleurs", "b": true}], [{"t": "To pretend nothing happened", "b": false}, {"t": "Faire comme si de rien n'était", "b": true}], [{"t": "To be broke", "b": false}, {"t": "Être fauché", "b": true}], [{"t": "To get into trouble", "b": false}, {"t": "Se mettre dans le pétrin", "b": true}], [{"t": "To break the ice", "b": false}, {"t": "Briser la glace", "b": true}]]}], "tip": false}, {"title": "Advanced practice dialogues", "blocks": [{"type": "p", "html": "Scenario: solving a hotel problem.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas.", "trans": "Hello, there's a problem with my room, the air conditioning isn't working."}, {"speaker": "Receptionist:", "orig": "Je suis désolée, je vais envoyer quelqu'un tout de suite. Voulez-vous changer de chambre en attendant?", "trans": "I'm sorry, I'll send someone right away. Would you like to change rooms in the meantime?"}, {"speaker": "Guest:", "orig": "Oui, ce serait plus simple, merci.", "trans": "Yes, that would be simpler, thank you."}]}, {"type": "p", "html": "Scenario: at the doctor's.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "Qu'est-ce qui ne va pas?", "trans": "What's wrong?"}, {"speaker": "Patient:", "orig": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre.", "trans": "I've had a sore throat for three days and I have a bit of a fever."}, {"speaker": "Doctor:", "orig": "Je vais vous prescrire des médicaments. Reposez-vous bien.", "trans": "I'll prescribe you some medicine. Rest well."}]}], "tip": false}, {"title": "Conclusion and next steps toward fluency", "blocks": [{"type": "list", "label": "How to keep improving", "intro": null, "items": ["Watch French shows and films with French subtitles, not English ones, to train your ear.", "Read a short article from an online French newspaper every day (Le Monde, Le Figaro).", "Find a language exchange partner for conversation practice (tandem).", "Write a short daily diary of a few sentences in French.", "Don't fear mistakes: true fluency comes from consistent practice, not grammatical perfection."]}], "tip": true}], "closingBasic": "Good luck in advance on your French journey — Bonne chance!", "closingAdvanced": "Congratulations on how far you've come — keep going, real fluency is closer than you think! Bonne continuation!"}, "it": {"chapters": [{"title": "Introduzione: perché imparare il francese?", "blocks": [{"type": "p", "html": "Il francese è lingua ufficiale in più di 29 paesi, parlata da oltre 300 milioni di persone nel mondo, ed è riconosciuta come la lingua della diplomazia, dell'arte e della letteratura. Questo libro ti dà una base solida nel francese standard parlato in Francia.", "italic": false}, {"type": "p", "html": "La buona notizia: il francese, come l'italiano, è una lingua latina, quindi il vocabolario ti sembrerà spesso familiare. La difficoltà principale sta nella pronuncia: ci sono lettere mute, suoni nasali caratteristici, e un fenomeno chiamato «Liaison» che collega le parole tra loro. È proprio su questo che ci concentreremo fin dal primo capitolo.", "italic": false}, {"type": "list", "label": "Obiettivi di questo libro", "intro": null, "items": ["Darti una base solida di vocabolario e grammatica essenziale nel minor tempo possibile.", "Concentrarci sulla pronuncia corretta perché il tuo accento suoni autenticamente francese.", "Darti frasi pratiche da usare fin dal primo giorno in situazioni reali."]}], "tip": false}, {"title": "L'alfabeto e le basi della pronuncia", "blocks": [{"type": "p", "html": "Il francese usa l'alfabeto latino, ma molte lettere finali diventano mute. Questa tabella presenta le lettere e i suoni più distintivi:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Parola"], "rows": [[{"t": "casa", "b": false}, {"t": "mezòn", "b": false}, {"t": "maison (la s tra vocali si legge z)", "b": true}], [{"t": "ciao/buongiorno", "b": false}, {"t": "bongiùr", "b": false}, {"t": "bonjour (on = suono nasale, j = «sci» dolce)", "b": true}], [{"t": "grazie", "b": false}, {"t": "mersì", "b": false}, {"t": "merci", "b": true}], [{"t": "gatto", "b": false}, {"t": "sha", "b": false}, {"t": "chat (ch = «sc» come in «scena», la t finale è muta)", "b": true}], [{"t": "io", "b": false}, {"t": "gio", "b": false}, {"t": "je (suono «sci» dolce — attenzione, non è la g dura italiana)", "b": true}], [{"t": "ragazzo", "b": false}, {"t": "garsòn", "b": false}, {"t": "garçon (ç = s)", "b": true}], [{"t": "francese", "b": false}, {"t": "franseh", "b": false}, {"t": "français (ç = s, la s finale è muta)", "b": true}], [{"t": "acqua", "b": false}, {"t": "o", "b": false}, {"t": "eau (tutto il gruppo eau si legge solo «o»)", "b": true}], [{"t": "uovo", "b": false}, {"t": "euf", "b": false}, {"t": "œuf (suono vocalico che non esiste in italiano)", "b": true}], [{"t": "vino", "b": false}, {"t": "van", "b": false}, {"t": "vin (in = suono nasale)", "b": true}]]}], "tip": false}, {"title": "Le regole d'oro per una pronuncia autentica", "blocks": [{"type": "p", "html": "Queste 6 regole d'oro fanno la maggiore differenza per suonare davvero francese:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Le consonanti finali sono di solito mute (come la t in chat), a meno che non siano seguite da una e.", "I suoni nasali (an, en, in, on, un) si pronunciano con l'aria che passa dal naso — l'italiano non ha questo fenomeno, quindi va praticato davanti allo specchio.", "La r francese è un suono gutturale, prodotto in gola — molto diverso dalla r italiana, che è invece vibrante.", "Attenzione a un «falso amico» importante: la j, e la g davanti a e o i, si pronunciano con un suono dolce tipo «sci» (come in «je») — completamente diverso dalla g italiana dura.", "Il gruppo ch si pronuncia come la «sc» italiana in «scena», mai come la c dura.", "Il fenomeno della «Liaison»: la consonante finale, di solito muta, si pronuncia se la parola seguente inizia per vocale — come in «les amis», che suona «lezami» e non «le ami»."]}], "tip": false}, {"title": "Saluti e frasi essenziali", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Francese"], "rows": [[{"t": "Buongiorno (formale)", "b": false}, {"t": "bongiùr", "b": false}, {"t": "Bonjour", "b": true}], [{"t": "Buonasera (arrivando)", "b": false}, {"t": "bonsuàr", "b": false}, {"t": "Bonsoir", "b": true}], [{"t": "Ciao (informale)", "b": false}, {"t": "salù", "b": false}, {"t": "Salut", "b": true}], [{"t": "Come stai?", "b": false}, {"t": "komàn sa va", "b": false}, {"t": "Comment ça va?", "b": true}], [{"t": "Bene, grazie", "b": false}, {"t": "sa va bien, mersì", "b": false}, {"t": "Ça va bien, merci", "b": true}], [{"t": "Piacere di conoscerti", "b": false}, {"t": "onsciantè", "b": false}, {"t": "Enchanté", "b": true}], [{"t": "A presto", "b": false}, {"t": "a biantò", "b": false}, {"t": "À bientôt", "b": true}], [{"t": "A domani", "b": false}, {"t": "a dëmàn", "b": false}, {"t": "À demain", "b": true}], [{"t": "Arrivederci", "b": false}, {"t": "o rëvuàr", "b": false}, {"t": "Au revoir", "b": true}], [{"t": "Per favore (formale)", "b": false}, {"t": "sil vu plè", "b": false}, {"t": "S'il vous plaît", "b": true}], [{"t": "Grazie", "b": false}, {"t": "mersì", "b": false}, {"t": "Merci", "b": true}], [{"t": "Prego", "b": false}, {"t": "dë rien", "b": false}, {"t": "De rien", "b": true}], [{"t": "Scusa", "b": false}, {"t": "pardòn / eskiusè mua", "b": false}, {"t": "Pardon / Excusez-moi", "b": true}], [{"t": "Sì", "b": false}, {"t": "uì", "b": false}, {"t": "Oui", "b": true}], [{"t": "No", "b": false}, {"t": "non", "b": false}, {"t": "Non", "b": true}]]}], "tip": false}, {"title": "I pronomi e il verbo «être» (essere/stare)", "blocks": [{"type": "p", "html": "Una cosa che distingue il francese dall'italiano: non esistono due verbi separati per «essere» e «stare» — c'è un solo verbo, «être», che copre sia l'identità sia lo stato temporaneo.", "italic": false}, {"type": "h3", "text": "Pronomi"}, {"type": "table", "headers": ["Italiano", "Francese"], "rows": [[{"t": "io", "b": false}, {"t": "je", "b": true}], [{"t": "tu", "b": false}, {"t": "tu", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "il / elle", "b": true}], [{"t": "noi", "b": false}, {"t": "nous", "b": true}], [{"t": "voi/lei formale", "b": false}, {"t": "vous", "b": true}], [{"t": "loro", "b": false}, {"t": "ils / elles", "b": true}]]}, {"type": "h3", "text": "être — essere/stare"}, {"type": "table", "headers": ["Pronome", "Coniugazione"], "rows": [[{"t": "je", "b": false}, {"t": "suis", "b": true}], [{"t": "tu", "b": false}, {"t": "es", "b": true}], [{"t": "il/elle", "b": false}, {"t": "est", "b": true}], [{"t": "nous", "b": false}, {"t": "sommes", "b": true}], [{"t": "vous", "b": false}, {"t": "êtes", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "sont", "b": true}]]}, {"type": "p", "html": "Esempio: Je suis italien — Sono italiano. — Je suis à Paris — Sono (ora) a Parigi. Nota come lo stesso verbo copre entrambe le situazioni!", "italic": false}], "tip": false}, {"title": "Verbi comuni e la loro coniugazione", "blocks": [{"type": "p", "html": "I verbi regolari francesi si dividono in due gruppi principali secondo la desinenza: -er, -ir. Conoscendo lo schema, puoi coniugare qualsiasi verbo regolare:", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir: finire)", "-er (parler: parlare)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": true}], [{"t": "tu", "b": false}, {"t": "finis", "b": false}, {"t": "parles", "b": true}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": true}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": true}], [{"t": "vous", "b": false}, {"t": "finissez", "b": false}, {"t": "parlez", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": true}]]}, {"type": "h3", "text": "Verbi irregolari importanti (forme «je» e «tu»)"}, {"type": "table", "headers": ["Significato", "je", "tu", "Verbo"], "rows": [[{"t": "avere", "b": false}, {"t": "ai", "b": false}, {"t": "as", "b": false}, {"t": "avoir", "b": true}], [{"t": "andare", "b": false}, {"t": "vais", "b": false}, {"t": "vas", "b": false}, {"t": "aller", "b": true}], [{"t": "fare", "b": false}, {"t": "fais", "b": false}, {"t": "fais", "b": false}, {"t": "faire", "b": true}], [{"t": "potere", "b": false}, {"t": "peux", "b": false}, {"t": "peux", "b": false}, {"t": "pouvoir", "b": true}], [{"t": "volere", "b": false}, {"t": "veux", "b": false}, {"t": "veux", "b": false}, {"t": "vouloir", "b": true}], [{"t": "sapere", "b": false}, {"t": "sais", "b": false}, {"t": "sais", "b": false}, {"t": "savoir", "b": true}]]}], "tip": false}, {"title": "I nu  «quattro venti-dieci» (quatre-vingt-dix). È un sistema antico ancora in uso in Francia (a differenza del Belgio e della Svizzera, che hanno parole dirette).", "italic": true}], "tip": false}, {"title": "Giorni della settimana e mesi", "blocks": [{"type": "table", "headers": ["Giorno", "Francese"], "rows": [[{"t": "lunedì", "b": false}, {"t": "lundi", "b": true}], [{"t": "martedì", "b": false}, {"t": "mardi", "b": true}], [{"t": "mercoledì", "b": false}, {"t": "mercredi", "b": true}], [{"t": "giovedì", "b": false}, {"t": "jeudi", "b": true}], [{"t": "venerdì", "b": false}, {"t": "vendredi", "b": true}], [{"t": "sabato", "b": false}, {"t": "samedi", "b": true}], [{"t": "domenica", "b": false}, {"t": "dimanche", "b": true}]]}, {"type": "h3", "text": "Mesi"}, {"type": "table", "headers": ["Mese", "Francese", "Mese", "Francese"], "rows": [[{"t": "gennaio", "b": false}, {"t": "janvier", "b": false}, {"t": "luglio", "b": false}, {"t": "juillet", "b": true}], [{"t": "febbraio", "b": false}, {"t": "février", "b": false}, {"t": "agosto", "b": false}, {"t": "août", "b": true}], [{"t": "marzo", "b": false}, {"t": "mars", "b": false}, {"t": "settembre", "b": false}, {"t": "septembre", "b": true}], [{"t": "aprile", "b": false}, {"t": "avril", "b": false}, {"t": "ottobre", "b": false}, {"t": "octobre", "b": true}], [{"t": "maggio", "b": false}, {"t": "mai", "b": false}, {"t": "novembre", "b": false}, {"t": "novembre", "b": true}], [{"t": "giugno", "b": false}, {"t": "juin", "b": false}, {"t": "dicembre", "b": false}, {"t": "décembre", "b": true}]]}], "tip": false}, {"title": "I colori", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Francese"], "rows": [[{"t": "rosso", "b": false}, {"t": "rugi", "b": false}, {"t": "rouge", "b": true}], [{"t": "blu", "b": false}, {"t": "blö", "b": false}, {"t": "bleu", "b": true}], [{"t": "verde", "b": false}, {"t": "ver", "b": false}, {"t": "vert", "b": true}], [{"t": "giallo", "b": false}, {"t": "giòn", "b": false}, {"t": , [{"t": "acqua", "b": false}, {"t": "o", "b": false}, {"t": "eau", "b": true}], [{"t": "caffè", "b": false}, {"t": "kafè", "b": false}, {"t": "café", "b": true}], [{"t": "tè", "b": false}, {"t": "tè", "b": false}, {"t": "thé", "b": true}], [{"t": "carne", "b": false}, {"t": "viand", "b": false}, {"t": "viande", "b": true}], [{"t": "pollo", "b": false}, {"t": "pulè", "b": false}, {"t": "poulet", "b": true}], [{"t": "pesce", "b": false}, {"t": "puason", "b": false}, {"t": "poisson", "b": true}], [{"t": "formaggio", "b": false}, {"t": "fromagi", "b": false}, {"t": "fromage", "b": true}], [{"t": "frutta", "b": false}, {"t": "früì", "b": false}, {"t": "fruit", "b": true}], [{"t": "verdure", "b": false}, {"t": "legüm", "b": false}, {"t": "légumes", "b": true}], [{"t": "dolce", "b": false}, {"t": "dessèr", "b": false}, {"t": "dessert", "b": true}], [{"t": "colazione", "b": false}, {"t": "pëtì degiunè", "b": false}, {"t": "petit-déjeuner", "b": true}], [{"t": "pranzo", "b": false}, {"t": "degiunè", "b": false}, {"t": "déjeuner", "b": true}], [{"t": "cena", "b": false}, {"t": "dinè", "b": false}, {"t": "dîner", "b": true}]]}], "tip": false}, {"title": "Frasi essenziali per viaggi e hotel", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Francese"], "rows": [[{"t": "Dov'è...?", "b": false}, {"t": "u sö truv", "b": false}, {"t": "Où se trouve...?", "b": true}], [{"t": "Quanto costa?", "b": false}, {"t": "combien sa kut", "b": false}, {"t": "Combien ça coûte?", "b": true}], [{"t": "Posso vedere il menù?", "b": false}, {"t": "gio pö vuar lö menü", "b": false}, {"t": "Je peux voir le menu?", "b": true}], [{"t": "Il conto, per favore", "b": false}, {"t": "ladision sil vu plè", "b": false}, {"t": "L'addition, s'il vous plaît", "b": true}], [{"t": "Dov'è il bagno?", "b": false}, {"t": "u son lè tualet", "b": false}, {"t": "Où sont les toilettes?", "b": true}], [{"t": "Ho bisogno di aiuto", "b": false}, {"t": "gè bözuan dèd", "b": false}, {"t": "J'ai besoin d'aide", "b": true}], [{"t": "Non capisco", "b": false}, {"t": "gio nö comprand pa", "b": false}, {"t": "Je ne comprends pas", "b": true}], [{"t": "Può ripetere, per favore?", "b": false}, {"t": "puvè vu repetè", "b": false}, {"t": "Pouvez-vous répéter, s'il vous plaît?", "b": true}], [{"t": "Parla inglese?", "b": false}, {"t": "parlè vu anglè", "b": false}, {"t": "Parlez-vous anglais?", "b": true}], [{"t": "Vorrei prenotare una camera", "b": false}, {"t": "gio vudrè rezervè ün shambr", "b": false}, {"t": "Je voudrais réserver une chambre", "b": true}], [{"t": "A che ora parte il treno?", "b": false}, {"t": "a kel ör par lö tran", "b": false}, {"t": "À quelle heure part le train?", "b": true}], [{"t": "Dove posso prendere un taxi?", "b": false}, {"t": "u püig prandr an taxi", "b": false}, {"t": "Où puis-je prendre un taxi?", "b": true}]]}], "tip": false}, {"title": "Espressioni e slang francese autentico", "blocks": [{"type": "p", "html": "Queste espressioni sono ciò che distingue chi parla un francese «corretto» da chi suona davvero francese. Usale nel contesto giusto e vedrai cambiare la reazione della gente:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Espressione"], "rows": [[{"t": "Va bene/d'accordo", "b": false}, {"t": "sa marsh", "b": false}, {"t": "Ça marche", "b": true}], [{"t": "Fantastico!", "b": false}, {"t": "genial", "b": false}, {"t": "Génial!", "b": true}], [{"t": "Sinceramente (intercalare comune)", "b": false}, {"t": "franshmàn", "b": false}, {"t": "Franchement", "b": true}], [{"t": "Coso/roba (parola generica)", "b": false}, {"t": "trük", "b": false}, {"t": "Truc", "b": true}], [{"t": "Boh/non mi importa (espressione di indifferenza)", "b": false}, {"t": "bof", "b": false}, {"t": "Bof", "b": true}], [{"t": "Non fa niente", "b": false}, {"t": "sè pa grav", "b": false}, {"t": "C'est pas grave", "b": true}], [{"t": "Perciò (connettore molto usato dai giovani)", "b": false}, {"t": "dü ku", "b": false}, {"t": "Du coup", "b": true}]]}], "tip": false}, {"title": "Dialogo pratico completo", "blocks": [{"type": "p", "html": "Un dialogo semplice in un caffè — leggilo ad alta voce più volte e prova a imitare la pronuncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cameriere:", "orig": "Bonjour! Bienvenue. Qu'est-ce que vous voulez?", "trans": "Buongiorno! Benvenuto. Cosa desidera?"}, {"speaker": "Cliente:", "orig": "Bonjour! Je voudrais un café, s'il vous plaît.", "trans": "Buongiorno! Vorrei un caffè, per favore."}, {"speaker": "Cameriere:", "orig": "C'est tout?", "trans": "Solo questo?"}, {"speaker": "Cliente:", "orig": "Oui, et l'addition, s'il vous plaît.", "trans": "Sì, e il conto, per favore."}, {"speaker": "Cameriere:", "orig": "Ça fait deux euros. Merci!", "trans": "Sono due euro. Grazie!"}, {"speaker": "Cliente:", "orig": "De rien, à bientôt!", "trans": "Prego, a presto!"}]}], "tip": false}, {"title": "Piano d'azione: come imparare in fretta", "blocks": [{"type": "list", "label": "7 passi per fissare la lingua velocemente", "intro": null, "items": ["Ascolta musica e serie francesi ogni giorno, anche solo 10 minuti — l'orecchio si abitua al ritmo prima della mente.", "Pratica lo «shadowing»: ascolta una frase breve e ripetila subito con lo stesso ritmo e la stessa velocità.", "Pratica i suoni nasali davanti allo specchio — sono la sfida più grande per un italiano.", "Non tradurre nella tua testa — prova a pensare direttamente in francese invece di passare prima per l'italiano.", "Usa un'app come Duolingo o Babbel insieme a questo libro per rinforzare il vocabolario.", "Parla fin dal primo giorno, anche se sbagli — la scioltezza viene dalla pratica, non dalla memorizzazione.", "Pratica la «Liaison» leggendo frasi intere ad alta voce, per abituarti a collegare le parole."]}], "tip": true}, {"title": "Introduzione: per chi è questo libro?", "blocks": [{"type": "p", "html": "Questo libro è la seconda parte dopo «Imparare il Francese — Facile, Divertente e Veloce», che ha coperto le basi. Se hai già finito il livello base e vuoi raggiungere un livello che ti permetta davvero di cavartela in viaggio, al lavoro e nella vita quotidiana in Francia, questo libro ti darà: i tempi verbali di cui hai bisogno, vocabolario pratico per situazioni reali, e dialoghi realistici.", "italic": false}, {"type": "list", "label": "Prima di iniziare", "intro": null, "items": ["Dovresti già conoscere: saluti, pronomi, il verbo être, la coniugazione del presente e i numeri — tutto questo è nel libro base.", "Il nostro obiettivo qui non è insegnarti tutto sulla lingua, ma darti abbastanza strumenti per cavartela da solo in qualsiasi situazione.", "Vai con calma in ogni capitolo, e pratica gli esempi ad alta voce prima di passare al successivo."]}], "tip": false, "dividerBefore": true}, {"title": "Ripasso veloce del livello base", "blocks": [{"type": "table", "headers": ["je", "tu", "il/elle", "nous", "vous/ils"], "rows": [[{"t": "io", "b": false}, {"t": "tu", "b": false}, {"t": "lui/lei", "b": false}, {"t": "noi", "b": false}, {"t": "voi/loro", "b": true}]]}, {"type": "h3", "text": "Presente — gli schemi regolari"}, {"type": "table", "headers": ["Pronome", "-ir (finir)", "-er (parler)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": true}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": true}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": true}], [{"t": "vous", "b": false}, {"t": "finissez", "b": false}, {"t": "parlez", "b": true}]]}], "tip": false}, {"title": "Il passato: Passé Composé e Imparfait", "blocks": [{"type": "p", "html": "Il francese, come l'italiano, distingue tra un'azione compiuta (Passé Composé, simile al passato prossimo) e un'azione abituale o descrittiva nel passato (Imparfait, simile all'imperfetto). Il Passé Composé si forma con avoir o être + participio passato.", "italic": false}, {"type": "table", "headers": ["Pronome", "avoir + participio (parler → parlé)", "être + participio (aller → allé)"], "rows": [[{"t": "j'/je", "b": false}, {"t": "j'ai parlé", "b": false}, {"t": "je suis allé(e)", "b": true}], [{"t": "tu", "b": false}, {"t": "tu as parlé", "b": false}, {"t": "tu es allé(e)", "b": true}], [{"t": "il/elle", "b": false}, {"t": "il a parlé", "b": false}, {"t": "il est allé(e)", "b": true}], [{"t": "nous", "b": false}, {"t": "nous avons parlé", "b": false}, {"t": "nous sommes allé(e)s", "b": true}], [{"t": "vous", "b": false}, {"t": "vous avez parlé", "b": false}, {"t": "vous êtes allé(e)(s)", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "ils ont parlé", "b": false}, {"t": "ils sont allé(e)s", "b": true}]]}, {"type": "p", "html": "Regola pratica: la maggior parte dei verbi usa avoir. Un gruppo di circa 16 verbi di movimento/cambiamento (aller, venir, partir, arriver, entrer, sortir, monter, descendre, naître, mourir, ecc.) e tutti i verbi riflessivi usano être — e in quel caso il participio si accorda con il soggetto, proprio come in italiano.", "italic": false}, {"type": "h3", "text": "L'Imparfait"}, {"type": "table", "headers": ["Pronome", "parler → imparfait"], "rows": [[{"t": "je", "b": false}, {"t": "parlais", "b": true}], [{"t": "tu", "b": false}, {"t": "parlais", "b": true}], [{"t": "il/elle", "b": false}, {"t": "parlait", "b": true}], [{"t": "nous", "b": false}, {"t": "parlions", "b": true}], [{"t": "vous", "b": false}, {"t": "parliez", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "parlaient", "b": true}]]}, {"type": "p", "html": "Esempio: Quand j'étais petit, j'habitais à Rome (Imparfait: descrizione) — Hier, je suis allé au marché (Passé Composé: fatto puntuale).", "italic": false}], "tip": false}, {"title": "Futuro, futuro prossimo e condizionale", "blocks": [{"type": "table", "headers": ["Uso", "Formazione", "Esempio"], "rows": [[{"t": "Futuro prossimo (intenzione vicina)", "b": false}, {"t": "aller (presente) + infinito", "b": false}, {"t": "Je vais partir demain — Sto per partire domani", "b": true}], [{"t": "Futuro semplice (previsione)", "b": false}, {"t": "infinito + terminazioni (-ai, -as, -a, -ons, -ez, -ont)", "b": false}, {"t": "Je partirai l'année prochaine — Partirò l'anno prossimo", "b": true}], [{"t": "Condizionale (ipotesi, cortesia)", "b": false}, {"t": "radice del futuro + terminazioni dell'imparfait", "b": false}, {"t": "Je voudrais un café — Vorrei un caffè", "b": true}]]}], "tip": false}, {"title": "Verbi riflessivi e pronomi complemento", "blocks": [{"type": "table", "headers": ["Pronome soggetto", "Pronome riflessivo", "se laver (lavarsi)"], "rows": [[{"t": "je", "b": false}, {"t": "me", "b": false}, {"t": "je me lave", "b": true}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "tu te laves", "b": true}], [{"t": "il/elle", "b": false}, {"t": "se", "b": false}, {"t": "il se lave", "b": true}], [{"t": "nous", "b": false}, {"t": "nous", "b": false}, {"t": "nous nous lavons", "b": true}], [{"t": "vous", "b": false}, {"t": "vous", "b": false}, {"t": "vous vous lavez", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "se", "b": false}, {"t": "ils se lavent", "b": true}]]}, {"type": "p", "html": "I pronomi complemento diretto (me, te, le/la, nous, vous, les) e indiretto (me, te, lui, nous, vous, leur) si posizionano prima del verbo, non dopo come spesso in italiano parlato: Je le vois (Lo vedo), Je lui parle (Gli/Le parlo).", "italic": false}], "tip": false}, {"title": "Preposizioni e la loro fusione con gli articoli", "blocks": [{"type": "p", "html": "Le preposizioni à e de si fondono obbligatoriamente con gli articoli determinativi le e les:", "italic": false}, {"type": "table", "headers": ["Preposizione + articolo", "Forma fusa", "Esempio"], "rows": [[{"t": "à + le", "b": false}, {"t": "au", "b": false}, {"t": "Je vais au marché", "b": true}], [{"t": "à + les", "b": false}, {"t": "aux", "b": false}, {"t": "Je parle aux enfants", "b": true}], [{"t": "de + le", "b": false}, {"t": "du", "b": false}, {"t": "Je viens du bureau", "b": true}], [{"t": "de + les", "b": false}, {"t": "des", "b": false}, {"t": "La couleur des fleurs", "b": true}]]}, {"type": "p", "html": "Nota: à la e à l' non cambiano mai (à la maison, à l'école), lo stesso vale per de la e de l'.", "italic": false}], "tip": false}, {"title": "Comparativi, superlativi e connettori avanzati", "blocks": [{"type": "table", "headers": ["Struttura", "Francese", "Significato"], "rows": [[{"t": "più... di", "b": false}, {"t": "plus... que", "b": false}, {"t": "Il est plus grand que moi", "b": true}], [{"t": "meno... di", "b": false}, {"t": "moins... que", "b": false}, {"t": "C'est moins cher qu'avant", "b": true}], [{"t": "tanto quanto", "b": false}, {"t": "aussi... que", "b": false}, {"t": "Elle est aussi rapide que lui", "b": true}], [{"t": "il più/la più", "b": false}, {"t": "le plus / la plus", "b": false}, {"t": "C'est le plus beau quartier", "b": true}], [{"t": "tuttavia", "b": false}, {"t": "cependant", "b": false}, {"t": "connettore formale di contrasto", "b": true}], [{"t": "quindi", "b": false}, {"t": "donc", "b": false}, {"t": "connettore di conseguenza", "b": true}], [{"t": "sebbene", "b": false}, {"t": "bien que (+ congiuntivo)", "b": false}, {"t": "connettore di concessione", "b": true}]]}], "tip": false}, {"title": "Vocabolario: aeroporto e dogana", "blocks": [{"type": "table", "headers": ["Significato", "Francese"], "rows": [[{"t": "carta d'imbarco", "b": false}, {"t": "carte d'embarquement", "b": true}], [{"t": "bagaglio a mano", "b": false}, {"t": "bagage à main", "b": true}], [{"t": "ritiro bagagli", "b": false}, {"t": "retrait des bagages", "b": true}], [{"t": "volo in ritardo", "b": false}, {"t": "vol retardé", "b": true}], [{"t": "dogana", "b": false}, {"t": "douane", "b": true}], [{"t": "passaporto", "b": false}, {"t": "passeport", "b": true}], [{"t": "niente da dichiarare", "b": false}, {"t": "rien à déclarer", "b": true}], [{"t": "porta d'imbarco", "b": false}, {"t": "porte d'embarquement", "b": true}]]}], "tip": false}, {"title": "Vocabolario: albergo, salute ed emergenze", "blocks": [{"type": "table", "headers": ["Significato", "Francese"], "rows": [[{"t": "Non c'è acqua calda", "b": false}, {"t": "Il n'y a pas d'eau chaude", "b": true}], [{"t": "La camera non è pronta", "b": false}, {"t": "La chambre n'est pas prête", "b": true}], [{"t": "Vorrei cambiare camera", "b": false}, {"t": "Je voudrais changer de chambre", "b": true}], [{"t": "farmacia", "b": false}, {"t": "pharmacie", "b": true}], [{"t": "Ho bisogno di un medico", "b": false}, {"t": "J'ai besoin d'un médecin", "b": true}], [{"t": "Mi fa male qui", "b": false}, {"t": "J'ai mal ici", "b": true}], [{"t": "Chiamate un'ambulanza!", "b": false}, {"t": "Appelez une ambulance!", "b": true}], [{"t": "ospedale", "b": false}, {"t": "hôpital", "b": true}], [{"t": "assicurazione sanitaria", "b": false}, {"t": "assurance maladie", "b": true}]]}], "tip": false}, {"title": "Vocabolario: banca, polizia e uffici", "blocks": [{"type": "table", "headers": ["Significato", "Francese"], "rows": [[{"t": "conto corrente", "b": false}, {"t": "compte courant", "b": true}], [{"t": "bancomat", "b": false}, {"t": "distributeur automatique", "b": true}], [{"t": "tasso di cambio", "b": false}, {"t": "taux de change", "b": true}], [{"t": "Ho perso il mio portafoglio", "b": false}, {"t": "J'ai perdu mon portefeuille", "b": true}], [{"t": "denuncia (di reato)", "b": false}, {"t": "dépôt de plainte", "b": true}], [{"t": "commissariato", "b": false}, {"t": "commissariat de police", "b": true}], [{"t": "comune/municipio", "b": false}, {"t": "mairie", "b": true}], [{"t": "permesso di soggiorno", "b": false}, {"t": "titre de séjour", "b": true}]]}], "tip": false}, {"title": "Vocabolario: trasporti e indicazioni", "blocks": [{"type": "table", "headers": ["Significato", "Francese"], "rows": [[{"t": "biglietto di sola andata", "b": false}, {"t": "billet aller simple", "b": true}], [{"t": "andata e ritorno", "b": false}, {"t": "aller-retour", "b": true}], [{"t": "noleggio auto", "b": false}, {"t": "location de voiture", "b": true}], [{"t": "Giri a destra", "b": false}, {"t": "Tournez à droite", "b": true}], [{"t": "Vada dritto", "b": false}, {"t": "Allez tout droit", "b": true}], [{"t": "semaforo", "b": false}, {"t": "feu (de circulation)", "b": true}], [{"t": "rotatoria", "b": false}, {"t": "rond-point", "b": true}], [{"t": "binario", "b": false}, {"t": "quai", "b": true}], [{"t": "fermata dell'autobus", "b": false}, {"t": "arrêt de bus", "b": true}]]}], "tip": false}, {"title": "Vocabolario: shopping e lavoro", "blocks": [{"type": "table", "headers": ["Significato", "Francese"], "rows": [[{"t": "Può farmi uno sconto?", "b": false}, {"t": "Vous pouvez me faire une remise?", "b": true}], [{"t": "taglia (vestiti)", "b": false}, {"t": "taille", "b": true}], [{"t": "camerino", "b": false}, {"t": "cabine d'essayage", "b": true}], [{"t": "riunione", "b": false}, {"t": "réunion", "b": true}], [{"t": "scadenza", "b": false}, {"t": "date limite", "b": true}], [{"t": "candidatura di lavoro", "b": false}, {"t": "candidature", "b": true}], [{"t": "colloquio", "b": false}, {"t": "entretien d'embauche", "b": true}], [{"t": "stipendio", "b": false}, {"t": "salaire", "b": true}]]}], "tip": false}, {"title": "Galateo: formale o informale?", "blocks": [{"type": "p", "html": "Il francese distingue chiaramente tra tu (informale, amici e familiari) e vous (formale, sconosciuti, superiori, contesti professionali). Usare tu al posto sbagliato può sembrare maleducato. In dubbio, usa sempre vous finché non ti viene proposto di darsi del tu (on peut se tutoyer?).", "italic": false}, {"type": "list", "label": "Regole pratiche", "intro": null, "items": ["Con sconosciuti, negozianti, colleghi che non conosci bene: vous.", "Con amici, bambini, animali, familiari: tu.", "Nelle email formali si apre con «Madame, Monsieur» e si chiude con «Cordialement» o «Veuillez agréer mes salutations distinguées»."]}], "tip": false}, {"title": "Espressioni idiomatiche avanzate", "blocks": [{"type": "table", "headers": ["Significato", "Espressione"], "rows": [[{"t": "Costare un occhio della testa", "b": false}, {"t": "Coûter les yeux de la tête", "b": true}], [{"t": "Avere altro per la testa (essere distratto)", "b": false}, {"t": "Avoir la tête ailleurs", "b": true}], [{"t": "Fare finta di niente", "b": false}, {"t": "Faire comme si de rien n'était", "b": true}], [{"t": "Essere al verde", "b": false}, {"t": "Être fauché", "b": true}], [{"t": "Mettersi nei guai", "b": false}, {"t": "Se mettre dans le pétrin", "b": true}], [{"t": "Rompere il ghiaccio", "b": false}, {"t": "Briser la glace", "b": true}]]}], "tip": false}, {"title": "Dialoghi pratici avanzati", "blocks": [{"type": "p", "html": "Scenario: risolvere un problema in albergo.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas.", "trans": "Buongiorno, c'è un problema con la mia camera, l'aria condizionata non funziona."}, {"speaker": "Réceptionniste:", "orig": "Je suis désolée, je vais envoyer quelqu'un tout de suite. Voulez-vous changer de chambre en attendant?", "trans": "Mi dispiace, manderò subito qualcuno. Vuole cambiare camera nel frattempo?"}, {"speaker": "Cliente:", "orig": "Oui, ce serait plus simple, merci.", "trans": "Sì, sarebbe più semplice, grazie."}]}, {"type": "p", "html": "Scenario: dal medico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médecin:", "orig": "Qu'est-ce qui ne va pas?", "trans": "Cosa non va?"}, {"speaker": "Patient:", "orig": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre.", "trans": "Ho mal di gola da tre giorni e ho un po' di febbre."}, {"speaker": "Médecin:", "orig": "Je vais vous prescrire des médicaments. Reposez-vous bien.", "trans": "Le prescriverò dei medicinali. Riposi bene."}]}], "tip": false}, {"title": "Conclusione e prossimi passi verso la scioltezza", "blocks": [{"type": "list", "label": "Come continuare a progredire", "intro": null, "items": ["Guarda serie e film francesi con sottotitoli in francese, non in italiano, per abituare l'orecchio.", "Leggi ogni giorno un breve articolo di un giornale francese online (Le Monde, Le Figaro).", "Trova un partner linguistico per fare scambi di conversazione (tandem).", "Scrivi un diario giornaliero di poche frasi in francese.", "Non temere gli errori: la scioltezza vera nasce dalla pratica costante, non dalla perfezione grammaticale."]}], "tip": true}], "closingBasic": "Congratulazioni in anticipo per il tuo viaggio nel francese — Bonne chance! (buona fortuna!)", "closingAdvanced": "Complimenti per il percorso fatto finora — continua così, la vera scioltezza è più vicina di quanto pensi! Bonne continuation!"}, "pt": {"chapters": [{"title": "Introdução: Porque aprender francês?", "blocks": [{"type": "p", "html": "O francês é a língua oficial em mais de 29 países, falada por mais de 300 milhões de pessoas em todo o mundo, e reconhecida mundialmente como a língua da diplomacia, da arte e da literatura. Este livro dá-te uma base sólida no francês padrão falado em França.", "italic": false}, {"type": "p", "html": "A boa notícia: o francês tem uma gramática lógica e bastante organizada. A principal dificuldade está na pronúncia — há letras que ficam mudas, sons nasais característicos, e um fenómeno chamado «Liaison» que liga as palavras entre si. É exatamente nisso que vamos focar-nos já a partir do primeiro capítulo.", "italic": false}, {"type": "list", "label": "<strong>Objetivos deste livro</strong>", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Focar na pronúncia correta para que o teu sotaque soe autenticamente francês.", "Dar-te frases práticas que podes usar desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e fundamentos de pronúncia", "blocks": [{"type": "p", "html": "O francês usa o alfabeto latino, mas muitas letras ficam mudas no final da palavra. Esta tabela apresenta as letras e sons mais distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "mezon", "b": false}, {"t": "<strong>maison (s entre vogais = z)</strong>", "b": true}], [{"t": "olá/bom dia", "b": false}, {"t": "bonjur", "b": false}, {"t": "<strong>bonjour (on = som nasal, j = «j» suave)</strong>", "b": true}], [{"t": "obrigado", "b": false}, {"t": "mersi", "b": false}, {"t": "<strong>merci</strong>", "b": true}], [{"t": "gato", "b": false}, {"t": "sha", "b": false}, {"t": "<strong>chat (ch = «x» português, e o t final é mudo)</strong>", "b": true}], [{"t": "eu", "b": false}, {"t": "jö", "b": false}, {"t": "<strong>je (som «j» suave, exatamente como o «j» português!)</strong>", "b": true}], [{"t": "rapaz", "b": false}, {"t": "garson", "b": false}, {"t": "<strong>garçon (ç = s)</strong>", "b": true}], [{"t": "francês", "b": false}, {"t": "fransé", "b": false}, {"t": "<strong>français (ç = s, e o s final é mudo)</strong>", "b": true}], [{"t": "água", "b": false}, {"t": "ô", "b": false}, {"t": "<strong>eau (toda a combinação eau soa apenas «ô»)</strong>", "b": true}], [{"t": "ovo", "b": false}, {"t": "öf", "b": false}, {"t": "<strong>œuf (som vocálico único, sem equivalente direto no português)</strong>", "b": true}], [{"t": "vinho", "b": false}, {"t": "van", "b": false}, {"t": "<strong>vin (in = som nasal)</strong>", "b": true}], [{"t": "pão", "b": false}, {"t": "pan", "b": false}, {"t": "<strong>pain (ain = o mesmo som nasal)</strong>", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro vão fazer a maior diferença para soares verdadeiramente francês — e boas notícias: o português já te dá uma vantagem enorme em várias delas!", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["As consoantes finais geralmente ficam mudas (como o t em chat), a não ser que sejam seguidas de e.", "Os sons nasais (an, en, in, on, un) pronunciam-se pelo nariz — e já os conheces do português (ão, ãe)! Uma grande vantagem para ti, já que a maioria das línguas não tem este fenómeno.", "A letra r francesa é um som gutural muito parecido com o «r» do português europeu — outra vantagem que já tens.", "O grupo ch pronuncia-se exatamente como o «x» português (chave) — soa igual!", "As letras j, e g antes de e ou i, pronunciam-se com o mesmo som suave que já conheces do «j» português (já, jogo) — nada a aprender de novo aqui.", "O fenómeno da «Liaison»: a consoante final que normalmente é muda pode pronunciar-se se a palavra seguinte começar por vogal — como em «les amis», que se pronuncia «lezami» e não «le ami»."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Francês"], "rows": [[{"t": "Bom dia/olá (formal)", "b": false}, {"t": "bonjur", "b": false}, {"t": "<strong>Bonjour</strong>", "b": true}], [{"t": "Boa noite (ao chegar)", "b": false}, {"t": "bonsuar", "b": false}, {"t": "<strong>Bonsoir</strong>", "b": true}], [{"t": "Olá (casual)", "b": false}, {"t": "salú", "b": false}, {"t": "<strong>Salut</strong>", "b": true}], [{"t": "Como estás?", "b": false}, {"t": "comã sa va", "b": false}, {"t": "<strong>Comment ça va?</strong>", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "sa va biã, mersi", "b": false}, {"t": "<strong>Ça va bien, merci</strong>", "b": true}], [{"t": "Prazer em conhecer-te", "b": false}, {"t": "onshãté", "b": false}, {"t": "<strong>Enchanté</strong>", "b": true}], [{"t": "Até breve", "b": false}, {"t": "a biãtô", "b": false}, {"t": "<strong>À bientôt</strong>", "b": true}], [{"t": "Até amanhã", "b": false}, {"t": "a demã", "b": false}, {"t": "<strong>À demain</strong>", "b": true}], [{"t": "Adeus", "b": false}, {"t": "o rövuar", "b": false}, {"t": "<strong>Au revoir</strong>", "b": true}], [{"t": "Por favor (formal)", "b": false}, {"t": "sil vu ple", "b": false}, {"t": "<strong>S'il vous plaît</strong>", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "mersi", "b": false}, {"t": "<strong>Merci</strong>", "b": true}], [{"t": "De nada", "b": false}, {"t": "dö riã", "b": false}, {"t": "<strong>De rien</strong>", "b": true}], [{"t": "Desculpa", "b": false}, {"t": "pardõ / exküze mua", "b": false}, {"t": "<strong>Pardon / Excusez-moi</strong>", "b": true}], [{"t": "Sim", "b": false}, {"t": "ui", "b": false}, {"t": "<strong>Oui</strong>", "b": true}], [{"t": "Não", "b": false}, {"t": "nõ", "b": false}, {"t": "<strong>Non</strong>", "b": true}]]}], "tip": false}, {"title": "Pronomes e o verbo «être» (ser/estar)", "blocks": [{"type": "p", "html": "Uma coisa que distingue o francês do português, do espanhol e do italiano: não há dois verbos separados para «ser/estar» — existe apenas um, chamado «être», que cobre a identidade e o estado temporário ao mesmo tempo.", "italic": false}, {"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["Português", "Francês"], "rows": [[{"t": "eu", "b": false}, {"t": "je", "b": false}], [{"t": "tu", "b": false}, {"t": "tu", "b": false}], [{"t": "ele/ela", "b": false}, {"t": "il / elle", "b": false}], [{"t": "nós", "b": false}, {"t": "nous", "b": false}], [{"t": "vós/você (formal ou plural)", "b": false}, {"t": "vous", "b": false}], [{"t": "eles/elas", "b": false}, {"t": "ils / elles", "b": false}]]}, {"type": "h3", "text": "<strong>être — ser/estar</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "je", "b": false}, {"t": "suis", "b": false}], [{"t": "tu", "b": false}, {"t": "es", "b": false}], [{"t": "il/elle", "b": false}, {"t": "est", "b": false}], [{"t": "nous", "b": false}, {"t": "sommes", "b": false}], [{"t": "vous", "b": false}, {"t": "êtes", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "sont", "b": false}]]}, {"type": "p", "html": "Exemplo: Je suis égyptien — Eu sou egípcio. — Je suis à Paris — Estou (agora) em Paris. Repara como o mesmo verbo cobre as duas situações!", "italic": false}], "tip": false}, {"title": "Verbos comuns e a sua conjugação", "blocks": [{"type": "p", "html": "Os verbos regulares franceses dividem-se em dois grupos principais consoante a terminação: er, ir. Sabendo o padrão, consegues conjugar qualquer verbo regular:", "italic": false}, {"type": "table", "headers": ["Pronome", "-ir (finir: terminar)", "-er (parler: falar)"], "rows": [[{"t": "je", "b": false}, {"t": "finis", "b": false}, {"t": "parle", "b": false}], [{"t": "tu", "b": false}, {"t": "finis", "b": false}, {"t": "parles", "b": false}], [{"t": "il/elle", "b": false}, {"t": "finit", "b": false}, {"t": "parle", "b": false}], [{"t": "nous", "b": false}, {"t": "finissons", "b": false}, {"t": "parlons", "b": false}], [{"t": "vous", "b": false}, {"t": "finissez", "b": false}, {"t": "parlez", "b": false}], [{"t": "ils/elles", "b": false}, {"t": "finissent", "b": false}, {"t": "parlent", "b": false}]]}, {"type": "h3", "text": "<strong>Verbos irregulares importantes (formas «je» e «tu»)</strong>"}, {"type": "table", "headers": ["Significado", "je", "tu", "Verbo"], "rows": [[{"t": "ter", "b": false}, {"t": "ai", "b": false}, {"t": "as", "b": false}, {"t": "avoir", "b": false}], [{"t": "ir", "b": false}, {"t": "vais", "b": false}, {"t": "vas", "b": false}, {"t": "aller", "b": false}], [{"t": "fazer", "b": false}, {"t": "fais", "b": false}, {"t": "fais", "b": false}, {"t": "faire", "b": false}], [{"t": "poder", "b": false}, {"t": "peux", "b": false}, {"t": "peux", "b": false}, {"t": "pouvoir", "b": false}], [{"t": "querer", "b": false}, {"t": "veux", "b": false}, {"t": "veux", "b": false}, {"t": "vouloir", "b": false}], [{"t": "saber", "b": false}, {"t": "sais", "b": false}, {"t": "sais", "b": false}, {"t": "savoir", "b": false}]]}], "tip": false}, {"title":
