<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

he shopping list on the next page — all 7 dinners in one trip."}, {"title": "Cook in any order", "body": "Days are numbered for convenience, not sequence. Save the fastest recipe for your busiest night."}, {"title": "Use the swap tips", "body": "Every recipe has a swap if you want to vary the protein or use what's already in your fridge."}, {"title": "Balance your plate", "body": "Round out any plate with extra salad or vegetables if you want more volume without more calories."}]}, "shopping": {"eyebrow": "YOUR ONE TRIP", "title": "Shopping list", "note": "Salt, black pepper, and olive oil are assumed pantry basics and aren't listed below.", "categories": [{"name": "Produce", "items": ["1 lemon", "2 heads garlic", "1 bell pepper", "2 tomatoes", "2 onions", "1 red onion", "1 carrot", "1 sweet potato", "1 cup cubed pumpkin or squash", "Collard greens or spinach", "Mixed salad greens", "Cilantro and parsley"]}, {"name": "Dairy & fridge", "items": ["Light coconut milk (small amount)"]}, {"name": "Protein", "items": ["4 chicken breasts (for two recipes)", "4 skinless chicken thighs", "4 white fish fillets", "1 lb shrimp, peeled", "1 lb lean ground beef"]}, {"name": "Pantry", "items": ["Brown rice (2 cups)", "Cooked or canned beans (3 cups total)", "1 can black beans", "Vegetable broth", "Dried herbs (oregano or thyme)"]}]}, "recipes": [{"title": "Grilled Lemon-Herb Chicken with Brown Rice & Beans", "time": "30 min", "serves": "Serves 4", "equip": "1 skillet + 1 pot", "ing": ["4 chicken breasts", "Juice of 1 lemon", "1 tsp dried herbs (oregano or thyme)", "2 cloves garlic, minced", "1 cup brown rice", "1 cup cooked beans"], "steps": ["Cook the brown rice according to the package.", "Season the chicken with lemon, herbs, garlic, salt, and pepper; let it sit 10 min.", "Heat a skillet over medium-high heat and grill the chicken 6-7 min per side until cooked through.", "Warm the beans in a small pot.", "Serve the chicken with the rice and beans."], "swap": "Swap the chicken for fish or firm tofu. Use whatever beans you already have on hand.", "leftover": "Shred the leftover chicken and mix with the rice and beans in a bowl for lunch the next day."}, {"title": "Light Moqueca-Style Baked Fish", "time": "30 min", "serves": "Serves 4", "equip": "1 sheet pan", "ing": ["4 white fish fillets", "1 bell pepper, sliced", "1 tomato, sliced", "1 onion, sliced", "2 cloves garlic, minced", "1/4 cup light coconut milk", "Chopped cilantro, to finish"], "steps": ["Preheat the oven to 400°F (200°C).", "Arrange the onion, pepper, and tomato on a sheet pan.", "Lay the fish on top, season with garlic, salt, and pepper, and drizzle with coconut milk.", "Bake 18-20 min, until the fish flakes easily.", "Finish with chopped cilantro before serving."], "swap": "Shrimp works well here too — cut the baking time to 10-12 min.", "leftover": "Flake the fish with the sauce over rice for a fast lunch."}, {"title": "Bean & Vegetable Soup", "time": "30 min", "serves": "Serves 4", "equip": "1 pot", "ing": ["2 cups cooked beans (or 1 can)", "1 carrot, chopped", "1 onion, chopped", "2 cloves garlic, minced", "4 cups vegetable broth", "Collard greens or spinach, chopped"], "steps": ["Sauté the onion and garlic in the pot with a little oil until soft.", "Add the beans, carrot, and broth; bring to a boil.", "Simmer 15 min until the carrot is tender.", "Lightly mash some of the beans to thicken the soup.", "Add the greens in the last 2 min and serve hot."], "swap": "Add cooked shredded chicken to the soup for extra protein.", "leftover": "Freezes well — keep portions on hand for a fast lunch anytime."}, {"title": "Garlic Shrimp with Brown Rice", "time": "20 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb shrimp, peeled", "4 cloves garlic, minced", "Juice of 1 lemon", "1 tbsp olive oil", "Chopped parsley", "1 cup cooked brown rice"], "steps": ["Heat the oil in a skillet over medium-high heat.", "Add the garlic and cook 30 sec until fragrant.", "Add the shrimp and cook 2-3 min per side until pink.", "Stir in the lemon juice and parsley, and serve over brown rice."], "swap": "Chicken strips or fish work the same way, just cook a bit longer.", "leftover": "Reheat gently in a skillet — the microwave makes shrimp rubbery."}, {"title": "Lean Ground Beef with Pumpkin & Vegetables", "time": "25 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb lean ground beef", "1 cup cubed pumpkin or squash", "1 onion, chopped", "2 cloves garlic, minced", "1 tomato, chopped", "Chopped parsley and cilantro"], "steps": ["Sauté the onion and garlic in a skillet with a little oil until soft.", "Add the ground beef and brown it, breaking it up, about 5 min.", "Add the pumpkin and tomato, and cook 12-15 min until the pumpkin is tender.", "Finish with parsley and cilantro and serve."], "swap": "Ground turkey or chicken work the same way for an even leaner version.", "leftover": "Tastes great the next day over rice or in a pita."}, {"title": "Baked Chicken with Vegetables & Sweet Potato Mash", "time": "40 min", "serves": "Serves 4", "equip": "1 sheet pan + 1 pot", "ing": ["4 skinless chicken thighs", "1 sweet potato, cubed", "1 carrot, cubed", "2 cloves garlic, minced", "1 tbsp olive oil", "Dried herbs, salt, and pepper"], "steps": ["Preheat the oven to 425°F (220°C).", "Boil the sweet potato in water until soft, about 15 min, and mash with a fork.", "Meanwhile, toss the chicken and carrot with the oil, garlic, and herbs, and bake on a sheet pan 30-35 min.", "Serve the chicken and carrot with the sweet potato mash."], "swap": "Use chicken breast instead of thighs for an even leaner version.", "leftover": "Shred the chicken and mix with the mash in a bowl the next day."}, {"title": "Full Salad Bowl with Grilled Chicken & Black Beans", "time": "20 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["4 chicken breasts, thinly sliced", "1 can black beans, drained", "Mixed salad greens", "1 tomato, chopped", "1/2 red onion, sliced", "Olive oil and lemon, for dressing"], "steps": ["Season the chicken with salt and pepper.", "Grill in a skillet over medium-high heat, 5-6 min per side, until cooked through.", "Slice the chicken and build the salad with the greens, black beans, tomato, and onion.", "Drizzle with olive oil and lemon before serving."], "swap": "Use chickpeas instead of black beans, or grilled shrimp instead of chicken.", "leftover": "Keep the ingredients separate in the fridge and build a fresh salad the next day."}], "bonus": {"eyebrow": "BONUS", "title": "Balance & leftover guide", "items": ["Cook a bigger batch of brown rice and beans early in the week — they're the base of several recipes.", "Want more volume without more calories? Add a green salad to any plate.", "Shrimp and fish reheat best in a skillet over low heat, not the microwave.", "Keep pre-chopped vegetables in the fridge to save time on busy days."]}, "closing": {"title": "A full week, no deprivation.", "body": "Seven healthy Brazilian dinners, one shopping trip, and the home flavor you actually love. Keep this guide handy and reach for it any week you want balance without giving up your favorite food.", "madeBy": "MADE BY @SARA.ALARABY"}, "labels": {"ingredients": "Ingredients", "instructions": "Instructions", "swap": "Swap it", "leftover": "Leftover tip", "day": "Day"}}, "es": {"dir": "ltr", "meta": {"htmlLang": "es", "pageTitle": "El Plan de Cenas Saludables de la Semana - Comida Brasileña Casera"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUÍA DE RECETAS SALUDABLES GRATIS", "title1": "EL PLAN DE CENAS", "accent": "Brasileñas", "title2": "SALUDABLES DE LA SEMANA", "subtitle": "Arroz, frijoles y el sabor casero que amas — solo que más ligero, equilibrado y sin dejar de ser delicioso.", "footer": "7 CENAS SALUDABLES · 1 LISTA DE COMPRAS · SABOR CASERO DE VERDAD"}, "intro": {"eyebrow": "INTRODUCCIÓN", "title": "Comer saludable no significa renunciar al arroz con frijoles", "p": ["La mayoría piensa que \"d rejil y cilantro y sirve."], "swap": "Pavo o pollo molido funcionan igual para una versión aún más magra.", "leftover": "Sabe muy bien al día siguiente sobre arroz o en pan árabe."}, {"title": "Pollo al Horno con Verduras y Puré de Camote", "time": "40 min", "serves": "Para 4", "equip": "1 bandeja + 1 olla", "ing": ["4 muslos de pollo, sin piel", "1 camote, en cubos", "1 zanahoria, en cubos", "2 dientes de ajo, picados", "1 cda de aceite de oliva", "Hierbas secas, sal y pimienta"], "steps": ["Precalienta el horno a 220°C.", "Hierve el camote en agua hasta que esté suave, unos 15 min, y machácalo con un tenedor.", "Mientras tanto, mezcla el pollo y la zanahoria con el aceite, el ajo y las hierbas, y hornea en una bandeja 30-35 min.", "Sirve el pollo y la zanahoria con el puré de camote."], "swap": "Usa pechuga de pollo en vez de muslo para una versión aún más magra.", "leftover": "Deshebra el pollo y mézclalo con el puré en un tazón al día siguiente."}, {"title": "Ensalada Completa con Pollo a la Plancha y Frijoles Negros", "time": "20 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["4 pechugas de pollo, en tiras finas", "1 lata de frijoles negros, escurridos", "Verduras de hoja variadas", "1 tomate, picado", "1/2 cebolla morada, en rodajas", "Aceite de oliva y limón, para aliñar"], "steps": ["Sazona el pollo con sal y pimienta.", "Cocina a la plancha en un sartén a fuego medio-alto, 5-6 min por lado, hasta que esté bien cocido.", "Rebana el pollo y arma la ensalada con las verduras de hoja, los frijoles negros, el tomate y la cebolla.", "Rocía con aceite de oliva y limón antes de servir."], "swap": "Usa garbanzos en vez de frijoles negros, o camarón a la plancha en vez de pollo.", "leftover": "Guarda los ingredientes por separado en el refrigerador y arma la ensalada fresca al día siguiente."}], "bonus": {"eyebrow": "EXTRA", "title": "Guía de equilibrio y sobras", "items": ["Cocina una tanda más grande de arroz integral y frijoles al inicio de la semana — son la base de varias recetas.", "¿Quieres más volumen sin más calorías? Agrega una ensalada verde a cualquier plato.", "El camarón y el pescado se recalientan mejor en un sartén a fuego bajo, no en el microondas.", "Guarda las verduras ya picadas en el refrigerador para ahorrar tiempo en los días ocupados."]}, "closing": {"title": "Una semana completa, sin privaciones.", "body": "Siete cenas brasileñas saludables, un solo viaje al súper, y el sabor casero que realmente amas. Ten esta guía a la mano y úsala cualquier semana que quieras equilibrio sin renunciar a tu comida favorita.", "madeBy": "HECHO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Preparación", "swap": "Sustitución", "leftover": "Tip de sobras", "day": "Día"}}, "fr": {"dir": "ltr", "meta": {"htmlLang": "fr", "pageTitle": "Le Plan de Dîners Sains de la Semaine - Cuisine Brésilienne Maison"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UN GUIDE DE RECETTES SAINES GRATUIT", "title1": "LE PLAN DE DÎNERS", "accent": "Brésiliens", "title2": "SAINS DE LA SEMAINE", "subtitle": "Du riz, des haricots, et la saveur maison que tu aimes — juste plus légère, équilibrée, et toujours aussi bonne.", "footer": "7 DÎNERS SAINS · 1 LISTE DE COURSES · VRAIE SAVEUR MAISON"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Manger sainement ne veut pas dire renoncer au riz aux haricots", "p": ["La plupart des gens pensent qu'un « régime » signifie éliminer tout ce qu'on aime et manger des plats fades. En réalité, ta cuisine brésilienne maison préférée peut devenir plus légère et plus saine sans perdre sa saveur.", "Ce plan propose sept vrais dîners brésiliens — grillés ou cuits au four plutôt que frits, des protéines maigres, et beaucoup de légumes dans chaque recette. Une seule liste de courses, une cuisine simple."], "rules": ["Une alimentation saine générale — pas un régime strict ni restrictif", "Des protéines + des légumes dans chaque assiette", "La plupart des recettes utilisent une seule poêle ou plaque"]}, "howto": {"eyebrow": "COMMENT UTILISER CE PLAN", "title": "Quatre étapes. C'est tout.", "steps": [{"title": "Fais les courses une seule fois", "body": "Utilise la liste de courses à la page suivante — les 7 dîners en un seul passage."}, {"title": "Cuisine dans l'ordre que tu veux", "body": "Les jours sont numérotés pour l'organisation, pas pour l'obligation. Garde la recette la plus rapide pour ton soir le plus chargé."}, {"title": "Utilise les astuces de substitution", "body": "Chaque recette a une astuce si tu veux varier la protéine ou utiliser ce que tu as déjà au frigo."}, {"title": "Équilibre ton assiette", "body": "Complète n'importe quelle assiette avec plus de salade ou de légumes si tu veux plus de volume sans plus de calories."}]}, "shopping": {"eyebrow": "TON SEUL PASSAGE AU SUPERMARCHÉ", "title": "Liste de courses", "note": "Le sel, le poivre noir et l'huile d'olive sont considérés comme des basiques que tu as déjà — ils ne sont donc pas listés ci-dessous.", "categories": [{"name": "Fruits et légumes", "items": ["1 citron", "2 têtes d'ail", "1 poivron", "2 tomates", "2 oignons", "1 oignon rouge", "1 carotte", "1 patate douce", "1 tasse de courge en cubes", "Chou vert ou épinards", "Mélange de salades vertes", "Coriandre et persil"]}, {"name": "Produits laitiers", "items": ["Lait de coco allégé (petite quantité)"]}, {"name": "Protéines", "items": ["4 blancs de poulet (pour deux recettes)", "4 hauts de cuisse de poulet sans peau", "4 filets de poisson blanc", "500g de crevettes décortiquées", "500g de bœuf haché maigre"]}, {"name": "Épicerie", "items": ["Riz complet (2 tasses)", "Haricots cuits ou en conserve (3 tasses au total)", "1 boîte de haricots noirs", "Bouillon de légumes", "Herbes séchées (origan ou thym)"]}]}, "recipes": [{"title": "Poulet Grillé au Citron et aux Herbes, Riz Complet et Haricots", "time": "30 min", "serves": "Pour 4", "equip": "1 poêle + 1 casserole", "ing": ["4 blancs de poulet", "Jus d'1 citron", "1 c. à café d'herbes séchées (origan ou thym)", "2 gousses d'ail, hachées", "1 tasse de riz complet", "1 tasse de haricots cuits"], "steps": ["Fais cuire le riz complet selon le paquet.", "Assaisonne le poulet avec le citron, les herbes, l'ail, le sel et le poivre ; laisse reposer 10 min.", "Fais chauffer une poêle à feu moyen-vif et grille le poulet 6-7 min de chaque côté jusqu'à ce qu'il soit bien cuit.", "Réchauffe les haricots dans une petite casserole.", "Sers le poulet avec le riz et les haricots."], "swap": "Remplace le poulet par du poisson ou du tofu ferme. Utilise les haricots que tu as déjà chez toi.", "leftover": "Effiloche le poulet restant et mélange-le avec le riz et les haricots dans un bol pour le déjeuner du lendemain."}, {"title": "Poisson au Four Façon Moqueca Légère", "time": "30 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 filets de poisson blanc", "1 poivron, en tranches", "1 tomate, en tranches", "1 oignon, en tranches", "2 gousses d'ail, hachées", "1/4 tasse de lait de coco allégé", "Coriandre hachée, pour finir"], "steps": ["Préchauffe le four à 200°C.", "Dispose l'oignon, le poivron et la tomate sur une plaque.", "Place le poisson par-dessus, assaisonne avec l'ail, le sel et le poivre, et arrose de lait de coco.", "Fais cuire 18-20 min, jusqu'à ce que le poisson s'effeuille facilement.", "Termine avec de la coriandre hachée avant de servir."], "swap": "Les crevettes fonctionnent bien ici aussi — réduis le temps de cuisson à 10-12 min.", "leftover": "Émiette le poisson avec la sauce sur du riz pour un déjeuner rapide."}, {"title": "Soupe de Haricots aux Légumes", "time": "30 min", "serves": "Pour 4", "equip": "1 casserole", "ing": ["2 tasses de haricots cuits (ou 1 boîte)", "1 carotte, coupée", "1 oignon, coupé", "2 gousses d'ail, hachées", "4 tasses de bouillon de légumes", "Chou vert ou épinards, coupés"], "steps": ["Fais revenir l'oignon et l'ail dans la casserole avec un peu d'huile jusqu'à ce qu'ils ramollissent.", "Ajoute les haricots, la carotte et le bouillon ; porte à ébullition.", "Laisse mijoter 15 min jusqu'à ce que la carotte soit tendre.", "Écrase légèrement une partie des haricots pour épaissir la soupe.", "Ajoute les légumes verts dans les 2 dernières minutes et sers chaud."], "swap": "Ajoute du poulet cuit effiloché à la soupe pour plus de protéines.", "leftover": "Se congèle bien — garde des portions pour un déjeuner rapide à tout moment."}, {"title": "Crevettes à l'Ail avec Riz Complet", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de crevettes décortiquées", "4 gousses d'ail, hachées", "Jus d'1 citron", "1 c. à soupe d'huile d'olive", "Persil haché", "1 tasse de riz complet cuit"], "steps": ["Fais chauffer l'huile dans une poêle à feu moyen-vif.", "Ajoute l'ail et fais cuire 30 sec jusqu'à ce qu'il embaume.", "Ajoute les crevettes et fais cuire 2-3 min de chaque côté jusqu'à ce qu'elles soient roses.", "Incorpore le jus de citron et le persil, et sers sur le riz complet."], "swap": "Des lanières de poulet ou du poisson fonctionnent de la même façon, il faut juste un peu plus de temps.", "leftover": "Réchauffe doucement à la poêle — le micro-ondes rend les crevettes caoutchouteuses."}, {"title": "Bœuf Haché Maigre avec Courge et Légumes", "time": "25 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de bœuf haché maigre", "1 tasse de courge en cubes", "1 oignon, haché", "2 gousses d'ail, hachées", "1 tomate, hachée", "Persil et coriandre hachés"], "steps": ["Fais revenir l'oignon et l'ail dans une poêle avec un peu d'huile jusqu'à ce qu'ils ramollissent.", "Ajoute le bœuf haché et fais-le dorer en l'émiettant, environ 5 min.", "Ajoute la courge et la tomate, et laisse cuire 12-15 min jusqu'à ce que la courge soit tendre.", "Termine avec le persil et la coriandre et sers."], "swap": "De la dinde ou du poulet haché fonctionnent de la même façon pour une version encore plus maigre.", "leftover": "Délicieux le lendemain sur du riz ou dans un pain pita."}, {"title": "Poulet au Four avec Légumes et Purée de Patate Douce", "time": "40 min", "serves": "Pour 4", "equip": "1 plaque + 1 casserole", "ing": ["4 hauts de cuisse de poulet, sans peau", "1 patate douce, en cubes", "1 carotte, en cubes", "2 gousses d'ail, hachées", "1 c. à soupe d'huile d'olive", "Herbes séchées, sel et poivre"], "steps": ["Préchauffe le four à 220°C.", "Fais bouillir la patate douce dans l'eau jusqu'à ce qu'elle soit tendre, environ 15 min, et écrase-la à la fourchette.", "Pendant ce temps, mélange le poulet et la carotte avec l'huile, l'ail et les herbes, et fais cuire sur une plaque 30-35 min.", "Sers le poulet et la carotte avec la purée de patate douce."], "swap": "Utilise du blanc de poulet à la place des hauts de cuisse pour une version encore plus maigre.", "leftover": "Effiloche le poulet et mélange-le avec la purée dans un bol le lendemain."}, {"title": "Bol Salade Complet au Poulet Grillé et Haricots Noirs", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["4 blancs de poulet, en fines tranches", "1 boîte de haricots noirs, égouttés", "Mélange de salades vertes", "1 tomate, hachée", "1/2 oignon rouge, en tranches", "Huile d'olive et citron, pour assaisonner"], "steps": ["Assaisonne le poulet avec le sel et le poivre.", "Fais-le griller dans une poêle à feu moyen-vif, 5-6 min de chaque côté, jusqu'à ce qu'il soit bien cuit.", "Tranche le poulet et compose la salade avec les feuilles vertes, les haricots noirs, la tomate et l'oignon.", "Arrose d'huile d'olive et de citron avant de servir."], "swap": "Utilise des pois chiches à la place des haricots noirs, ou des crevettes grillées à la place du poulet.", "leftover": "Garde les ingrédients séparés au frigo et compose une salade fraîche le lendemain."}], "bonus": {"eyebrow": "EN BONUS", "title": "Guide d'équilibre et de restes", "items": ["Cuis une plus grande quantité de riz complet et de haricots en début de semaine — ils sont la base de plusieurs recettes.", "Envie de plus de volume sans plus de calories ? Ajoute une salade verte à n'importe quelle assiette.", "Les crevettes et le poisson se réchauffent mieux à la poêle à feu doux, pas au micro-ondes.", "Garde des légumes déjà coupés au frigo pour gagner du temps les jours chargés."]}, "closing": {"title": "Une semaine complète, sans privation.", "body": "Sept dîners brésiliens sains, un seul passage au supermarché, et la saveur maison que tu aimes vraiment. Garde ce guide à portée de main et utilise-le chaque semaine où tu veux de l'équilibre sans renoncer à ton plat préféré.", "madeBy": "CRÉÉ PAR @SARA.ALARABY"}, "labels": {"ingredients": "Ingrédients", "instructions": "Préparation", "swap": "Substitution", "leftover": "Astuce restes", "day": "Jour"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena Settimanale Sano - Cucina Brasiliana"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA A RICETTE SANE", "title1": "LA SETTIMANA", "accent": "Brasiliana", "title2": "SANA A CENA", "subtitle": "Riso, fagioli, e il sapore di casa che ami — solo più leggero, equilibrato, e sempre delizioso.", "footer": "7 CENE SANE · 1 LISTA DELLA SPESA · VERO SAPORE DI CASA"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Mangiare sano non significa rinunciare a riso e fagioli", "p": ["Molte persone pensano che \"dieta\" significhi rinunciare a tutto ciò che amano e mangiare cibo insipido. La verità è che la tua cucina brasiliana di casa preferita può essere più leggera e sana senza perdere il suo sapore.", "Questo piano ha sette vere cene brasiliane — alla griglia o al forno invece che fritte, proteine magre, e tante verdure in ogni ricetta. Una lista della spesa, cottura semplice."], "rules": ["Alimentazione sana in generale — non una dieta rigida o restrittiva", "Proteine + verdure in ogni piatto", "La maggior parte delle ricette usa solo una padella o una teglia"]}, "howto": {"eyebrow": "COME USARE QUESTO PIANO", "title": "Quattro passaggi. Tutto qui.", "steps": [{"title": "Fai la spesa una volta", "body": "Usa la lista della spesa nella pagina successiva — tutte e 7 le cene in un solo giro."}, {"title": "Cucina nell'ordine che vuoi", "body": "I giorni sono numerati per comodità, non per obbligo. Tieni la ricetta più veloce per la sera più impegnata."}, {"title": "Usa i consigli per le sostituzioni", "body": "Ogni ricetta ha una sostituzione se vuoi variare la proteina o usare quello che hai già in frigo."}, {"title": "Bilancia il tuo piatto", "body": "Completa qualsiasi piatto con altra insalata o verdure se vuoi più volume senza più calorie."}]}, "shopping": {"eyebrow": "IL TUO UNICO GIRO", "title": "Lista della spesa", "note": "Sale, pepe nero e olio d'oliva sono considerati basi di dispensa e non sono elencati qui sotto.", "categories": [{"name": "Frutta e verdura", "items": ["1 limone", "2 teste d'aglio", "1 peperone", "2 pomodori", "2 cipolle", "1 cipolla rossa", "1 carota", "1 patata dolce", "1 tazza di zucca a cubetti", "Cavolo verde o spinaci", "Insalata mista", "Coriandolo e prezzemolo"]}, {"name": "Latticini e frigo", "items": ["Latte di cocco leggero (piccola quantità)"]}, {"name": "Proteine", "items": ["4 petti di pollo (per due ricette)", "4 cosce di pollo senza pelle", "4 filetti di pesce bianco", "450 g di gamberi, sgusciati", "450 g di carne macinata di manzo magra"]}, {"name": "Dispensa", "items": ["Riso integrale (2 tazze)", "Fagioli cotti o in scatola (3 tazze in totale)", "1 lattina di fagioli neri", "Brodo vegetale", "Erbe essiccate (origano o timo)"]}]}, "recipes": [{"title": "Pollo Grigliato al Limone ed Erbe con Riso Integrale e Fagioli", "time": "30 min", "serves": "Per 4 persone", "equip": "1 padella + 1 pentola", "ing": ["4 petti di pollo", "Succo di 1 limone", "1 cucchiaino di erbe essiccate (origano o timo)", "2 spicchi d'aglio, tritati", "1 tazza di riso integrale", "1 tazza di fagioli cotti"], "steps": ["Cuoci il riso integrale seguendo le istruzioni della confezione.", "Condisci il pollo con limone, erbe, aglio, sale e pepe; lascia riposare 10 min.", "Scalda una padella a fuoco medio-alto e griglia il pollo 6-7 min per lato finché cotto.", "Scalda i fagioli in una pentola piccola.", "Servi il pollo con il riso e i fagioli."], "swap": "Sostituisci il pollo con pesce o tofu compatto. Usa qualsiasi fagiolo tu abbia già in casa.", "leftover": "Sfilaccia il pollo avanzato e mescolalo con riso e fagioli in una ciotola per il pranzo del giorno dopo."}, {"title": "Pesce al Forno in Stile Moqueca Leggera", "time": "30 min", "serves": "Per 4 persone", "equip": "1 teglia", "ing": ["4 filetti di pesce bianco", "1 peperone, a fette", "1 pomodoro, a fette", "1 cipolla, a fette", "2 spicchi d'aglio, tritati", "60 ml di latte di cocco leggero", "Coriandolo tritato, per finire"], "steps": ["Preriscalda il forno a 200°C.", "Disponi cipolla, peperone e pomodoro su una teglia.", "Adagia il pesce sopra, condisci con aglio, sale e pepe, e irrora con il latte di cocco.", "Cuoci in forno 18-20 min, finché il pesce si sfalda facilmente.", "Completa con coriandolo tritato prima di servire."], "swap": "Anche i gamberi funzionano bene qui — riduci il tempo di cottura a 10-12 min.", "leftover": "Sfalda il pesce con il sugo sopra il riso per un pranzo veloce."}, {"title": "Zuppa di Fagioli e Verdure", "time": "30 min", "serves": "Per 4 persone", "equip": "1 pentola", "ing": ["2 tazze di fagioli cotti (o 1 lattina)", "1 carota, a pezzetti", "1 cipolla, a pezzetti", "2 spicchi d'aglio, tritati", "1 litro di brodo vegetale", "Cavolo verde o spinaci, tritati"], "steps": ["Fai soffriggere cipolla e aglio nella pentola con un filo d'olio finché morbidi.", "Aggiungi fagioli, carota e brodo; porta a ebollizione.", "Cuoci a fuoco lento 15 min finché la carota è tenera.", "Schiaccia leggermente alcuni fagioli per addensare la zuppa.", "Aggiungi le verdure a foglia negli ultimi 2 min e servi calda."], "swap": "Aggiungi pollo sfilacciato cotto alla zuppa p function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function render(lang){
  const d = DATA[lang];
  if(!d) return;
  document.documentElement.lang = d.meta.htmlLang;
  document.documentElement.dir = d.dir;
  document.title = d.meta.pageTitle;

  document.getElementById('brandName').textContent = d.nav.brand;

  document.querySelectorAll('#langSwitcher button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang')===lang);
  });

  // Hero
  document.getElementById('hEyebrow').textContent = d.hero.eyebrow;
  document.getElementById('hTitle1').textContent = d.hero.title1;
  document.getElementById('hAccent').textContent = d.hero.accent;
  document.getElementById('hTitle2').textContent = d.hero.title2;
  document.getElementById('hSubtitle').textContent = d.hero.subtitle;
  document.getElementById('hFoottag').textContent = d.hero.footer;

  // Intro
  document.getElementById('iEyebrow').textContent = d.intro.eyebrow;
  document.getElementById('iTitle').textContent = d.intro.title;
  const iParas = document.getElementById('iParas'); iParas.innerHTML='';
  d.intro.p.forEach(t=>{ const p = el('p','',t); iParas.appendChild(p); });
  const iRules = document.getElementById('iRules'); iRules.innerHTML='';
  d.intro.rules.forEach(t=>{ iRules.appendChild(el('div','',t)); });

  // How to
  document.getElementById('hwEyebrow').textContent = d.howto.eyebrow;
  document.getElementById('hwTitle').textContent = d.howto.title;
  const hwSteps = document.getElementById('hwSteps'); hwSteps.innerHTML='';
  d.howto.steps.forEach((s,i)=>{
    const step = el('div','step');
    const num = el('div','step-num', String(i+1));
    const body = el('div','step-body');
    body.appendChild(el('h3','',s.title));
    body.appendChild(el('p','',s.body));
    step.appendChild(num); step.appendChild(body);
    hwSteps.appendChild(step);
  });

  // Shopping
  document.getElementById('shEyebrow').textContent = d.shopping.eyebrow;
  document.getElementById('shTitle').textContent = d.shopping.title;
  document.getElementById('shNote').textContent = d.shopping.note;
  const shGrid = document.getElementById('shGrid'); shGrid.innerHTML='';
  const colA = el('div','shop-col'); const colB = el('div','shop-col');
  d.shopping.categories.forEach((cat,i)=>{
    const block = el('div','shop-block');
    block.appendChild(el('div','shop-cat', cat.name));
    cat.items.forEach(it=>{
      const row = el('div','shop-item');
      row.appendChild(el('span','box'));
      row.appendChild(el('span','',it));
      block.appendChild(row);
    });
    (i % 2 === 0 ? colA : colB).appendChild(block);
  });
  shGrid.appendChild(colA); shGrid.appendChild(colB);

  // Recipes
  document.getElementById('rcEyebrow').textContent = RECIPE_EYEBROW[lang] || "RECIPES";
  document.getElementById('rcTitle').textContent = RECIPE_WORD[lang] || "Recipes";
  const list = document.getElementById('recipeList'); list.innerHTML='';
  d.recipes.forEach((r,i)=>{
    const card = el('div','recipe');
    const head = el('div','recipe-head');
    head.style.background = DAY_COLORS[i];
    head.appendChild(el('div','day-label', d.labels.day + ' ' + (i+1) + ' / 7'));
    head.appendChild(el('h3','', r.title));
    const badges = el('div','badges');
    [r.time, r.serves, r.equip].forEach(b=>{ badges.appendChild(el('span','badge', b)); });
    head.appendChild(badges);
    card.appendChild(head);

    const body = el('div','recipe-body');
    const ingCol = el('div','');
    ingCol.appendChild(el('div','block-label', d.labels.ingredients));
    r.ing.forEach(it=>{ ingCol.appendChild(el('div','ing-item', '— '+it)); });
    const tips = el('div','tips');
    const swapTip = el('div','tip'); const swapB = el('b','',d.labels.swap+': '); swapTip.appendChild(swapB); swapTip.appendChild(document.createTextNode(r.swap));
    const leftTip = el('div','tip'); const leftB = el('b','',d.labels.leftover+': '); leftTip.appendChild(leftB); leftTip.appendChild(document.createTextNode(r.leftover));
    tips.appendChild(swapTip); tips.appendChild(leftTip);
    ingCol.appendChild(tips);

    const insCol = el('div','');
    insCol.appendChild(el('div','block-label', d.labels.instructions));
    r.steps.forEach((s,si)=>{
      const row = el('div','ins-step');
      const num = el('div','ins-num', String(si+1));
      num.style.background = DAY_COLORS[i];
      row.appendChild(num);
      row.appendChild(el('div','ins-text', s));
      insCol.appendChild(row);
    });

    body.appendChild(ingCol); body.appendChild(insCol);
    card.appendChild(body);
    list.appendChild(card);
  });

  // Bonus
  document.getElementById('bnEyebrow').textContent = d.bonus.eyebrow;
  document.getElementById('bnTitle').textContent = d.bonus.title;
  const bnItems = document.getElementById('bnItems'); bnItems.innerHTML='';
  d.bonus.items.forEach(t=>{ bnItems.appendChild(el('div','',t)); });

  // Closing
  document.getElementById('clTitle').textContent = d.closing.title;
  document.getElementById('clBody').textContent = d.closing.body;
  document.getElementById('clMadeBy').textContent = d.closing.madeBy;

  document.getElementById('backLink').textContent = (window.BACK_LINK_TEXT[lang] || window.BACK_LINK_TEXT.en);
  document.getElementById('ctaEyebrow').textContent = (window.CTA_LABEL[lang] || window.CTA_LABEL.en);
  document.getElementById('ctaBody').textContent = (window.CTA_BODY[lang] || window.CTA_BODY.en);
  document.getElementById('ctaBtn').innerHTML = '💬 ' + (window.CTA_BTN[lang] || window.CTA_BTN.en);
  document.getElementById('ctaBtn').href = 'https://wa.me/' + (window.WA_NUMBER_BY_LANG[lang]||window.WA_NUMBER_BY_LANG.en) + '?text=' + encodeURIComponent(window.WA_MSG[lang]||window.WA_MSG.en);

  try{ localStorage.setItem('sd_lang', lang); }catch(e){}
}

document.getElementById('langSwitcher').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  render(btn.getAttribute('data-lang'));
});

(function init(){
  let lang = 'pt';
  try{
    const saved = localStorage.getItem('sd_lang');
    if(saved && DATA[saved]) lang = saved;
    else {
      const nav = (navigator.language||'en').slice(0,2).toLowerCase();
      if(DATA[nav]) lang = nav;
    }
  }catch(e){}
  render(lang);
})();
</script>

  var history = ["root"];
  var messagesEl, optionsEl, fab, panel;

  function currentLang(){
    return document.documentElement.lang || (function(){ try{return localStorage.getItem('sd_lang')||'ar';}catch(e){return 'ar';} })();
  }

  function pick(dict){ var l = currentLang(); return dict[l] || dict.en || dict.ar; }

  function addMsg(text, isUser){
    var div = document.createElement('div');
    div.className = 'sara-msg' + (isUser ? ' user' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderNode(nodeId){
    var node = TREE[nodeId];
    addMsg(pick(node.msg), false);
    optionsEl.innerHTML = '';
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'sara-opt-btn' + (opt.wa ? ' wa' : '');
      btn.textContent = pick(opt.label);
      btn.addEventListener('click', function(){ handleOption(opt, nodeId); });
      optionsEl.appendChild(btn);
    });
  }

  function handleOption(opt, fromNode){
    if (!opt.back) addMsg(pick(opt.label), true);
    if (opt.wa) {
      window.open(waLink(currentLang()), '_blank');
      return;
    }
    if (opt.link) {
      window.location.href = opt.link;
      return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

  function openPanel(){
    panel.classList.add('open');
    document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
    if (!messagesEl.hasChildNodes()) {
      history = ["root"];
      renderNode("root");
    }
  }

  function init(){
    fab = document.getElementById('saraFab');
    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
