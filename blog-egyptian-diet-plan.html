<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

z integral", "1 taza de verduras mixtas (calabacita, pimiento, zanahoria)"], "steps": ["Cocina el arroz integral según el paquete (tarda más que el blanco — unos 25-30 min).", "Mezcla el pollo con el ajo, el jugo de limón, el aceite, sal y pimienta; deja reposar 10 min.", "Calienta un sartén a fuego medio-alto y cocina el pollo 6-7 min por lado hasta que esté bien cocido.", "Mientras tanto, saltea las verduras en otro sartén con un poco de aceite hasta que estén tiernas pero aún crujientes.", "Sirve el pollo con el arroz y las verduras."], "swap": "Sustituye el pollo por tiras de res o tofu. ¿Con prisa? Usa arroz blanco normal en vez de integral.", "leftover": "Deshebra el pollo sobrante y mézclalo con las verduras en una ensalada grande para el almuerzo del día siguiente."}, {"title": "Pescado a la Plancha con Comino y Limón, Ensalada de Tahini Ligera", "time": "25 min", "serves": "Para 4", "equip": "1 sartén o bandeja", "ing": ["4 filetes de pescado blanco", "1 cdta de comino", "Jugo de 1 limón y medio", "2 dientes de ajo, picados", "2 cdas de tahini", "Pepino y tomate, para la ensalada"], "steps": ["Sazona el pescado con el comino, la mitad del jugo de limón, sal y pimienta.", "Precalienta el horno a 200°C o un sartén a fuego medio, y cocina el pescado 6-8 min por lado hasta que se desmenuce fácilmente.", "Para la salsa, mezcla el tahini con el jugo de limón restante, el ajo y un poco de agua hasta que quede fluida.", "Corta el pepino y el tomate y sirve junto al pescado con la salsa de tahini aparte."], "swap": "Cualquier pescado blanco funciona aquí, o sustitúyelo por camarón para variar.", "leftover": "Desmenuza el pescado sobre una ensalada verde grande con la salsa de tahini extra para un almuerzo rápido."}, {"title": "Guiso de Res con Verduras al Horno", "time": "40 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["500g de carne magra, en cubos", "1 cebolla grande, en rodajas", "2 tomates, en rodajas", "1 pimiento, en rodajas", "1 calabacita, en rodajas", "3 dientes de ajo, picados", "1 cdta de comino y especias mixtas"], "steps": ["Precalienta el horno a 220°C.", "Coloca la carne y las verduras en una bandeja, agrega el ajo, las especias y 1 cda de aceite, y mezcla bien.", "Cubre con papel aluminio y hornea 25 min.", "Retira el papel y hornea 10-15 min más, hasta que la carne y las verduras estén bien cocidas y ligeramente doradas.", "Sirve tal cual, o con un poco de arroz integral."], "swap": "Usa pechuga de pollo en cubos en lugar de carne para una versión más ligera.", "leftover": "Sabe aún mejor al día siguiente — recalienta y sirve con arroz o en pan árabe."}, {"title": "Sopa de Lentejas con Verduras y Ensalada Verde", "time": "30 min", "serves": "Para 4", "equip": "1 olla", "ing": ["1 taza de lentejas amarillas", "1 zanahoria, picada", "1 cebolla, picada", "2 dientes de ajo, picados", "1 cdta de comino", "4 tazas de agua o caldo de verduras", "Lechuga o arúgula, para la ensalada"], "steps": ["Sofríe la cebolla y el ajo en la olla con un poco de aceite hasta que se ablanden.", "Agrega las lentejas, la zanahoria, el comino y el agua; deja hervir.", "Baja el fuego y cocina 20-25 min hasta que las lentejas estén suaves.", "Licúa ligeramente para una textura más suave, o déjala tal cual.", "Sirve con una ensalada verde simple a un lado."], "swap": "Agrega pollo cocido deshebrado a la sopa para más proteína.", "leftover": "Se congela bien — guarda porciones para un almuerzo rápido en cualquier momento."}, {"title": "Camarones al Ajo y Limón con Arroz Integral", "time": "20 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de camarón pelado", "4 dientes de ajo, picados", "Jugo de 1 limón", "1 cda de aceite de oliva", "Perejil picado", "1 taza de arroz integral cocido"], "steps": ["Calienta el aceite en un sartén a fuego medio-alto.", "Agrega el ajo y cocina 30 seg hasta que aromatice.", "Agrega el camarón y cocina 2-3 min por lado hasta que esté rosado.", "Agrega el jugo de limón y el perejil, y sirve sobre el arroz integral."], "swap": "Tiras de pollo o pescado funcionan igual, solo necesitan un poco más de tiempo.", "leftover": "Recalienta suavemente en un sartén — el microondas deja el camarón chicloso."}, {"title": "Pechuga de Pollo al Horno con Verduras Asadas", "time": "35 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 pechugas de pollo", "1 calabacita, en rodajas", "1 pimiento, en rodajas", "1 cebolla, en rodajas", "1 cda de aceite de oliva", "Especias mixtas, sal y pimienta"], "steps": ["Precalienta el horno a 220°C.", "Mezcla el pollo y las verduras con el aceite y las especias, y colócalos en una bandeja sin amontonar.", "Hornea 25-30 min, moviendo las verduras una vez, hasta que el pollo esté bien cocido y las verduras ligeramente doradas.", "Sirve tal cual, o con arroz integral o pan integral."], "swap": "Usa muslos de pollo en vez de pechuga para un sabor más intenso.", "leftover": "Rebana y agrega a una ensalada o sándwich integral al día siguiente."}, {"title": "Kofta de Pavo a la Plancha con Ensalada de Yogur", "time": "25 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de pavo molido", "1/2 cebolla rallada", "2 dientes de ajo, picados", "1 cdta de comino y cilantro seco", "1 taza de yogur natural", "Pepino y tomate, picados"], "steps": ["Mezcla el pavo con la cebolla rallada, el ajo, las especias, la sal y la pimienta; forma discos.", "Calienta un sartén con un poco de aceite en spray y cocina 4-5 min por lado hasta dorar y cocinar por completo.", "Para la ensalada, mezcla el yogur con el pepino, el tomate y una pizca de sal.", "Sirve la kofta con la ensalada de yogur a un lado."], "swap": "Usa pollo o carne molida magra en vez de pavo.", "leftover": "Rebana y agrega a una ensalada o un wrap integral al día siguiente."}], "bonus": {"eyebrow": "EXTRA", "title": "Guía de equilibrio y sobras", "items": ["Porciona el arroz integral y las lentejas cocidos en recipientes — se congelan bien hasta por un mes.", "¿Quieres más volumen sin más calorías? Agrega una ensalada verde o verduras salteadas a cualquier plato.", "El camarón y el pescado se recalientan mejor en un sartén a fuego bajo, no en el microondas.", "¿Con prisa? Cocina una tanda más grande de arroz integral desde el principio y reutilízala durante la semana."]}, "closing": {"title": "Una semana completa, sin privaciones.", "body": "Siete cenas egipcias saludables, un solo viaje al súper, y el sabor de la comida casera que realmente amas. Ten esta guía a la mano y úsala cualquier semana que quieras equilibrio sin renunciar a tu comida favorita.", "madeBy": "HECHO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Preparación", "swap": "Sustitución", "leftover": "Tip de sobras", "day": "Día"}}, "fr": {"dir": "ltr", "meta": {"htmlLang": "fr", "pageTitle": "Le Plan de Dîners Sains de la Semaine - Cuisine Égyptienne Maison"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UN GUIDE DE RECETTES SAINES GRATUIT", "title1": "LE PLAN DE DÎNERS", "accent": "Égyptiens", "title2": "SAINS DE LA SEMAINE", "subtitle": "Mange de la vraie cuisine égyptienne maison — plus légère, équilibrée, et pleine de saveur. Pas de privation, pas de plats de régime fades.", "footer": "7 DÎNERS SAINS · 1 LISTE DE COURSES · VRAIE SAVEUR ÉGYPTIENNE"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Manger sainement ne veut pas dire renoncer à la cuisine avec laquelle tu as grandi", "p": ["La plupart des gens pensent qu'un « régime » signifie éliminer tout ce qu'on aime et manger des plats bouillis et fades. En réalité, ta cuisine égyptienne maison préférée peut devenir plus légère et plus saine sans perdre sa saveur.", "Ce plan propose sept vrais dîners égyptiens — grillés ou cuits au four plutôt que frits, des protéines maigres, et du riz complet à la place du riz blanc dans la plupart des recettes. Une seule liste de courses, une cuisine simple."], "rules": ["Une alimentation saine générale — pas un régime strict ni restrictif", "Des protéines + des légumes dans chaque assiette", "La plupart des recettes utilisent une seule poêle ou plaque"]}, "howto": {"eyebrow": "COMMENT UTILISER CE PLAN", "title": "Quatre étapes. C'est tout.", "steps": [{"title": "Fais les courses une seule fois", "body": "Utilise la liste de courses à la page suivante — les 7 dîners en un seul passage."}, {"title": "Cuisine dans l'ordre que tu veux", "body": "Les jours sont numérotés pour l'organisation, pas pour l'obligation. Garde la recette la plus rapide pour ton soir le plus chargé."}, {"title": "Utilise les astuces de substitution", "body": "Chaque recette a une astuce si tu veux varier la protéine ou utiliser ce que tu as déjà au frigo."}, {"title": "Équilibre ton assiette", "body": "Complète n'importe quelle assiette avec plus de salade ou de légumes si tu veux plus de volume sans plus de calories."}]}, "shopping": {"eyebrow": "TON SEUL PASSAGE AU SUPERMARCHÉ", "title": "Liste de courses", "note": "Le sel, le poivre noir et l'huile d'olive sont considérés comme des basiques que tu as déjà — ils ne sont donc pas listés ci-dessous.", "categories": [{"name": "Fruits et légumes", "items": ["4-5 oignons", "2 têtes d'ail", "5 citrons", "4 tomates", "2 concombres", "2 courgettes", "2 poivrons", "1-2 carottes", "Persil frais (facultatif)", "Laitue ou roquette, pour la salade"]}, {"name": "Produits laitiers", "items": ["Yaourt nature", "Tahini"]}, {"name": "Protéines", "items": ["8 blancs de poulet (pour deux recettes)", "4 filets de poisson blanc", "500g de bœuf maigre, en cubes", "500g de crevettes décortiquées", "500g de dinde hachée"]}, {"name": "Épicerie", "items": ["Riz complet (environ 2 tasses)", "Lentilles jaunes (1 tasse)", "Huile d'olive", "Épices : cumin, coriandre séchée, mélange sept-épices, poivre noir"]}]}, "recipes": [{"title": "Poulet Grillé au Citron et à l'Ail, Riz Complet et Légumes", "time": "30 min", "serves": "Pour 4", "equip": "1 poêle + 1 casserole pour le riz", "ing": ["4 blancs de poulet", "3 gousses d'ail, hachées", "Jus de 2 citrons", "1 c. à soupe d'huile d'olive", "1 tasse de riz complet", "1 tasse de légumes variés (courgette, poivron, carotte)"], "steps": ["Fais cuire le riz complet selon le paquet (plus long que le riz blanc — environ 25-30 min).", "Mélange le poulet avec l'ail, le jus de citron, l'huile, le sel et le poivre ; laisse reposer 10 min.", "Fais chauffer une poêle à feu moyen-vif et cuis le poulet 6-7 min de chaque côté jusqu'à ce qu'il soit bien cuit.", "Pendant ce temps, fais sauter les légumes dans une autre poêle avec un peu d'huile jusqu'à ce qu'ils soient tendres mais encore croquants.", "Sers le poulet avec le riz et les légumes."], "swap": "Remplace le poulet par des lanières de bœuf ou du tofu. Pressé ? Utilise du riz blanc classique à la place du riz complet.", "leftover": "Effiloche le poulet restant et mélange-le avec les légumes dans une grande salade pour le déjeuner du lendemain."}, {"title": "Poisson Grillé au Cumin et Citron, Salade de Tahini Légère", "time": "25 min", "serves": "Pour 4", "equip": "1 poêle ou plaque", "ing": ["4 filets de poisson blanc", "1 c. à café de cumin", "Jus d'1 citron et demi", "2 gousses d'ail, hachées", "2 c. à soupe de tahini", "Concombre et tomate, pour la salade"], "steps": ["Assaisonne le poisson avec le cumin, la moitié du jus de citron, le sel et le poivre.", "Préchauffe le four à 200°C ou une poêle à feu moyen, et cuis le poisson 6-8 min de chaque côté jusqu'à ce qu'il s'effeuille facilement.", "Pour la sauce, fouette le tahini avec le reste du jus de citron, l'ail et un peu d'eau jusqu'à consistance fluide.", "Coupe le concombre et la tomate et sers-les à côté du poisson avec la sauce tahini à part."], "swap": "N'importe quel poisson blanc convient ici, ou remplace par des crevettes pour varier.", "leftover": "Émiette le poisson sur une grande salade verte avec le reste de sauce tahini pour un déjeuner rapide."}, {"title": "Tajine de Bœuf aux Légumes au Four", "time": "40 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["500g de bœuf maigre, en cubes", "1 gros oignon, en tranches", "2 tomates, en tranches", "1 poivron, en tranches", "1 courgette, en tranches", "3 gousses d'ail, hachées", "1 c. à café de cumin et d'épices mélangées"], "steps": ["Préchauffe le four à 220°C.", "Dispose le bœuf et les légumes sur une plaque, ajoute l'ail, les épices et 1 c. à soupe d'huile, et mélange bien.", "Couvre de papier aluminium et fais cuire 25 min.", "Retire le papier et poursuis la cuisson 10-15 min, jusqu'à ce que le bœuf et les légumes soient bien cuits et légèrement dorés.", "Sers tel quel, ou avec un peu de riz complet."], "swap": "Utilise du blanc de poulet en cubes à la place du bœuf pour une version plus légère.", "leftover": "Encore meilleur le lendemain — réchauffe et sers avec du riz ou dans un pain pita."}, {"title": "Soupe de Lentilles aux Légumes et Salade Verte", "time": "30 min", "serves": "Pour 4", "equip": "1 casserole", "ing": ["1 tasse de lentilles jaunes", "1 carotte, coupée", "1 oignon, coupé", "2 gousses d'ail, hachées", "1 c. à café de cumin", "4 tasses d'eau ou de bouillon de légumes", "Laitue ou roquette, pour la salade"], "steps": ["Fais revenir l'oignon et l'ail dans la casserole avec un peu d'huile jusqu'à ce qu'ils ramollissent.", "Ajoute les lentilles, la carotte, le cumin et l'eau ; porte à ébullition.", "Baisse le feu et laisse mijoter 20-25 min jusqu'à ce que les lentilles soient tendres.", "Mixe légèrement pour une texture plus lisse, ou laisse tel quel.", "Sers avec une salade verte simple à côté."], "swap": "Ajoute du poulet cuit effiloché à la soupe pour plus de protéines.", "leftover": "Se congèle bien — garde des portions pour un déjeuner rapide à tout moment."}, {"title": "Crevettes à l'Ail et au Citron avec Riz Complet", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de crevettes décortiquées", "4 gousses d'ail, hachées", "Jus d'1 citron", "1 c. à soupe d'huile d'olive", "Persil haché", "1 tasse de riz complet cuit"], "steps": ["Fais chauffer l'huile dans une poêle à feu moyen-vif.", "Ajoute l'ail et fais cuire 30 sec jusqu'à ce qu'il embaume.", "Ajoute les crevettes et fais cuire 2-3 min de chaque côté jusqu'à ce qu'elles soient roses.", "Incorpore le jus de citron et le persil, et sers sur le riz complet."], "swap": "Des lanières de poulet ou du poisson fonctionnent de la même façon, il faut juste un peu plus de temps.", "leftover": "Réchauffe doucement à la poêle — le micro-ondes rend les crevettes caoutchouteuses."}, {"title": "Blancs de Poulet au Four avec Légumes Rôtis", "time": "35 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 blancs de poulet", "1 courgette, en tranches", "1 poivron, en tranches", "1 oignon, en tranches", "1 c. à soupe d'huile d'olive", "Épices mélangées, sel et poivre"], "steps": ["Préchauffe le four à 220°C.", "Mélange le poulet et les légumes avec l'huile et les épices, et étale-les sur une plaque sans les entasser.", "Fais cuire 25-30 min, en remuant les légumes une fois, jusqu'à ce que le poulet soit bien cuit et les légumes légèrement dorés.", "Sers tel quel, ou avec du riz complet ou du pain complet."], "swap": "Utilise des hauts de cuisse à la place des blancs pour une saveur plus riche.", "leftover": "Tranche et ajoute à une salade ou un sandwich complet le lendemain."}, {"title": "Poêlée de Kofta de Dinde avec Salade au Yaourt", "time": "25 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de dinde hachée", "1/2 oignon, râpé", "2 gousses d'ail, hachées", "1 c. à café de cumin et de coriandre séchée", "1 tasse de yaourt nature", "Concombre et tomate, coupés"], "steps": ["Mélange la dinde avec l'oignon râpé, l'ail, les épices, le sel et le poivre ; forme des galettes.", "Fais chauffer une poêle avec un léger filet d'huile et cuis 4-5 min de chaque côté jusqu'à ce que ce soit doré et bien cuit.", "Pour la salade, mélange le yaourt avec le concombre, la tomate et une pincée de sel.", "Sers la kofta avec la salade au yaourt à côté."], "swap": "Utilise du poulet ou du bœuf haché maigre à la place de la dinde.", "leftover": "Tranche et ajoute à une salade ou un wrap complet le lendemain."}], "bonus": {"eyebrow": "EN BONUS", "title": "Guide d'équilibre et de restes", "items": ["Répartis le riz complet et les lentilles cuits dans des contenants — ils se congèlent bien jusqu'à un mois.", "Envie de plus de volume sans plus de calories ? Ajoute une salade verte ou des légumes sautés à n'importe quelle assiette.", "Les crevettes et le poisson se réchauffent mieux à la poêle à feu doux, pas au micro-ondes.", "Pressé ? Cuis une plus grande quantité de riz complet à l'avance et réutilise-la toute la semaine."]}, "closing": {"title": "Une semaine complète, sans privation.", "body": "Sept dîners égyptiens sains, un seul passage au supermarché, et la saveur de la cuisine maison que tu aimes vraiment. Garde ce guide à portée de main et utilise-le chaque semaine où tu veux de l'équilibre sans renoncer à ton plat préféré.", "madeBy": "CRÉÉ PAR @SARA.ALARABY"}, "labels": {"ingredients": "Ingrédients", "instructions": "Préparation", "swap": "Substitution", "leftover": "Astuce restes", "day": "Jour"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena Sano della Settimana - Cucina Casalinga Egiziana"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA A RICETTE SANE", "title1": "LA SETTIMANA", "accent": "Egiziana", "title2": "SANA A CENA", "subtitle": "Mangia vera cucina casalinga egiziana — più leggera, equilibrata, e piena di sapore. Niente rinunce, niente cibo da dieta noioso.", "footer": "7 CENE SANE · 1 LISTA DELLA SPESA · VERO SAPORE EGIZIANO"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Mangiare sano non significa rinunciare al cibo con cui sei cresciuta", "p": ["Molte persone pensano che \"dieta\" significhi eliminare tutto ciò che ami e mangiare cibo bollito e insipido. La verità è che la tua cucina casalin       return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

  function openPanel(){
    panel.classList.add('open');
    document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
    if (!messagesEl.hasChildNodes()) {
      history = ["root"];
      renderNode("root");
    }
  }

  function init(){
    fab = document.getElementById('saraFab');
    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<!-- =================== END SARA ASSISTANT WIDGET =================== -->
