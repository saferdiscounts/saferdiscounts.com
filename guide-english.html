": "rau match iz it", "b": false}, {"t": "How much is it?", "b": true}], [{"t": "Posso ver a ementa?", "b": false}, {"t": "can ai si de ménu", "b": false}, {"t": "Can I see the menu?", "b": true}], [{"t": "A conta, por favor", "b": false}, {"t": "de bil, plíz", "b": false}, {"t": "The bill, please", "b": true}], [{"t": "Onde é a casa de banho?", "b": false}, {"t": "uér iz de tóilet", "b": false}, {"t": "Where is the toilet?", "b": true}], [{"t": "Preciso de ajuda", "b": false}, {"t": "ai nid rélp", "b": false}, {"t": "I need help", "b": true}], [{"t": "Não percebo", "b": false}, {"t": "ai dôunt anderstênd", "b": false}, {"t": "I don't understand", "b": true}], [{"t": "Pode repetir, por favor?", "b": false}, {"t": "can iú ripít, plíz", "b": false}, {"t": "Can you repeat, please?", "b": true}], [{"t": "Fala português?", "b": false}, {"t": "du iú spik pórtchuguíz", "b": false}, {"t": "Do you speak Portuguese?", "b": true}], [{"t": "Queria reservar um quarto", "b": false}, {"t": "ai uud laic tu buk a rum", "b": false}, {"t": "I would like to book a room", "b": true}], [{"t": "A que horas sai o comboio?", "b": false}, {"t": "uót taim das de tréin liv", "b": false}, {"t": "What time does the train leave?", "b": true}], [{"t": "Onde posso apanhar um táxi?", "b": false}, {"t": "uér can ai guet a taxi", "b": false}, {"t": "Where can I get a taxi?", "b": true}]]}], "tip": false}, {"title": "Expressões e gírias inglesas autênticas", "blocks": [{"type": "p", "html": "Estas expressões são o que distingue alguém que fala um inglês «de manual» de alguém que soa realmente natural. Usa-as no contexto certo:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Expressão"], "rows": [[{"t": "Combinado/tudo bem", "b": false}, {"t": "chur / oukêi", "b": false}, {"t": "Sure / Okay", "b": true}], [{"t": "Fantástico!", "b": false}, {"t": "ôssom", "b": false}, {"t": "Awesome!", "b": true}], [{"t": "Sinceramente (muleta muito comum)", "b": false}, {"t": "ónestli", "b": false}, {"t": "Honestly", "b": true}], [{"t": "Coisa/troço (palavra genérica)", "b": false}, {"t": "staf", "b": false}, {"t": "Stuff", "b": true}], [{"t": "Tanto faz (indiferença)", "b": false}, {"t": "uóteva", "b": false}, {"t": "Whatever", "b": true}], [{"t": "Não faz mal", "b": false}, {"t": "nôu bíguí", "b": false}, {"t": "No biggie", "b": true}], [{"t": "Tipo/assim (muito usado pelos jovens)", "b": false}, {"t": "laic", "b": false}, {"t": "Like", "b": true}]]}], "tip": false}, {"title": "Diálogo prático completo", "blocks": [{"type": "p", "html": "Um diálogo simples num café — lê-o em voz alta várias vezes e tenta imitar a pronúncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "Hello! Welcome. What would you like?", "trans": "Olá! Bem-vindo. O que deseja?"}, {"speaker": "Cliente:", "orig": "Hi! I'd like a coffee, please.", "trans": "Olá! Queria um café, por favor."}, {"speaker": "Empregado:", "orig": "Is that all?", "trans": "Só isso?"}, {"speaker": "Cliente:", "orig": "Yes, and the bill, please.", "trans": "Sim, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "That's two euros. Thanks!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "You're welcome, see you soon!", "trans": "De nada, até breve!"}]}], "tip": false}, {"title": "Plano de ação: como aprender depressa", "blocks": [{"type": "list", "label": "7 passos para fixar a língua rapidamente", "intro": null, "items": ["Ouve podcasts e vê séries em inglês todos os dias, mesmo que só 10 minutos — o ouvido habitua-se antes da mente.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo e velocidade.", "Pratica os sons th e w ao espelho — são o maior desafio para um lusófono.", "Não traduzas na tua cabeça — tenta pensar diretamente em inglês.", "Usa uma aplicação como o Duolingo ou o Babbel juntamente com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo que erres — a fluência vem da prática, não da memorização.", "Vê filmes e séries primeiro com legendas em inglês, depois sem legendas — é a forma mais rápida de habituar o ouvido."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Inglês — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível que te permita realmente desenvencilhares-te a viajar, a trabalhar e no dia a dia, este livro vai dar-te: os tempos verbais de que precisas, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "Antes de começar", "intro": null, "items": ["Já deves conhecer: cumprimentos, pronomes, o verbo to be, a conjugação no presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenvencilhares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de passares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "table", "headers": ["I", "you", "he/she", "we", "you/they"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vocês/eles", "b": true}]]}, {"type": "h3", "text": "Presente — os padrões regulares"}, {"type": "table", "headers": ["Pronome", "to speak", "to work"], "rows": [[{"t": "I/you/we/they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}]]}], "tip": false}, {"title": "O passado: Past Simple e Past Continuous", "blocks": [{"type": "p", "html": "O inglês, tal como o português, distingue uma ação pontual e concluída no passado (Past Simple) de uma ação em curso num momento do passado (Past Continuous). O Past Simple dos verbos regulares forma-se com -ed:", "italic": false}, {"type": "table", "headers": ["Verbo", "Past Simple", "Exemplo"], "rows": [[{"t": "to work", "b": false}, {"t": "worked", "b": false}, {"t": "I worked yesterday — Trabalhei ontem", "b": true}], [{"t": "to play", "b": false}, {"t": "played", "b": false}, {"t": "She played tennis — Ela jogou ténis", "b": true}]]}, {"type": "p", "html": "Atenção: muitos verbos comuns são irregulares e têm de ser memorizados à parte: go → went, have → had, see → saw, do → did, come → came.", "italic": false}, {"type": "h3", "text": "O Past Continuous"}, {"type": "table", "headers": ["Pronome", "was/were + -ing"], "rows": [[{"t": "I/he/she", "b": false}, {"t": "was working", "b": true}], [{"t": "you/we/they", "b": false}, {"t": "were working", "b": true}]]}, {"type": "p", "html": "Exemplo: I was watching TV when you called — Estava a ver televisão quando telefonaste (ação em curso interrompida por outra).", "italic": false}], "tip": false}, {"title": "O Present Perfect e a sua diferença do passado", "blocks": [{"type": "p", "html": "O Present Perfect (have/has + particípio passado) é um dos conceitos mais difíceis para um lusófono, porque não corresponde exatamente ao nosso pretérito perfeito. Usa-se para uma ação passada ligada ao presente, sem um momento preciso:", "italic": false}, {"type": "table", "headers": ["Uso", "Exemplo", "Tradução"], "rows": [[{"t": "Experiência de vida (sem tempo preciso)", "b": false}, {"t": "I have visited Paris", "b": false}, {"t": "Já visitei Paris (uma vez, não importa quando)", "b": true}], [{"t": "Ação passada com tempo preciso → Past Simple", "b": false}, {"t": "I visited Paris in 2019", "b": false}, {"t": "Visitei Paris em 2019", "b": true}], [{"t": "Ação começada no passado e ainda em curso", "b": false}, {"t": "I have lived here for 5 years", "b": false}, {"t": "Vivo aqui há 5 anos", "b": true}]]}, {"type": "p", "html": "Regra prática: se há um momento preciso na frase (yesterday, in 2019, last week), usa sempre o Past Simple, nunca o Present Perfect — um erro muito comum entre lusófonos.", "italic": false}], "tip": false}, {"title": "Futuro: will, going to e o presente contínuo", "blocks": [{"type": "table", "headers": ["Uso", "Formação", "Exemplo"], "rows": [[{"t": "Previsão/decisão espontânea", "b": false}, {"t": "will + infinitivo", "b": false}, {"t": "I will call you tomorrow — Vou ligar-te amanhã", "b": true}], [{"t": "Intenção/plano já decidido", "b": false}, {"t": "going to + infinitivo", "b": false}, {"t": "I'm going to visit Rome — Vou visitar Roma", "b": true}], [{"t": "Programa marcado (com horário)", "b": false}, {"t": "presente contínuo", "b": false}, {"t": "I'm flying to London on Monday — Voo para Londres na segunda", "b": true}]]}], "tip": false}, {"title": "Verbos modais e a sua nuance", "blocks": [{"type": "table", "headers": ["Verbo modal", "Significado", "Exemplo"], "rows": [[{"t": "can", "b": false}, {"t": "poder (capacidade)", "b": false}, {"t": "I can swim — Sei nadar", "b": true}], [{"t": "could", "b": false}, {"t": "poder (passado/cortesia)", "b": false}, {"t": "Could you help me? — Podia ajudar-me?", "b": true}], [{"t": "must", "b": false}, {"t": "ter de (obrigação forte)", "b": false}, {"t": "You must wear a seatbelt — Tens de pôr o cinto", "b": true}], [{"t": "should", "b": false}, {"t": "devia (conselho)", "b": false}, {"t": "You should see a doctor — Devias ir ao médico", "b": true}], [{"t": "might", "b": false}, {"t": "poderá (possibilidade)", "b": false}, {"t": "It might rain — Pode chover", "b": true}]]}], "tip": false}, {"title": "Preposições e phrasal verbs", "blocks": [{"type": "p", "html": "Os phrasal verbs (verbo + preposição que muda completamente o significado) são um dos maiores desafios do inglês avançado — não têm um verdadeiro equivalente lógico em português e têm de ser decorados:", "italic": false}, {"type": "table", "headers": ["Phrasal verb", "Significado"], "rows": [[{"t": "give up", "b": false}, {"t": "desistir", "b": true}], [{"t": "look for", "b": false}, {"t": "procurar", "b": true}], [{"t": "get on with", "b": false}, {"t": "dar-se bem com", "b": true}], [{"t": "run out of", "b": false}, {"t": "ficar sem (algo)", "b": true}], [{"t": "look forward to", "b": false}, {"t": "ansiar por", "b": true}], [{"t": "put off", "b": false}, {"t": "adiar", "b": true}]]}], "tip": false}, {"title": "Vocabulário: aeroporto e alfândega", "blocks": [{"type": "table", "headers": ["Significado", "Inglês"], "rows": [[{"t": "cartão de embarque", "b": false}, {"t": "boarding pass", "b": true}], [{"t": "bagagem de mão", "b": false}, {"t": "hand luggage / carry-on", "b": true}], [{"t": "recolha de bagagem", "b": false}, {"t": "baggage claim", "b": true}], [{"t": "voo atrasado", "b": false}, {"t": "delayed flight", "b": true}], [{"t": "alfândega", "b": false}, {"t": "customs", "b": true}], [{"t": "passaporte", "b": false}, {"t": "passport", "b": true}], [{"t": "nada a declarar", "b": false}, {"t": "nothing to declare", "b": true}], [{"t": "porta de embarque", "b": false}, {"t": "boarding gate", "b": true}]]}], "tip": false}, {"title": "Vocabulário: hotel, saúde e emergências", "blocks": [{"type": "table", "headers": ["Significado", "Inglês"], "rows": [[{"t": "Não há água quente", "b": false}, {"t": "There's no hot water", "b": true}], [{"t": "O quarto não está pronto", "b": false}, {"t": "The room isn't ready", "b": true}], [{"t": "Queria mudar de quarto", "b": false}, {"t": "I would like to change rooms", "b": true}], [{"t": "farmácia", "b": false}, {"t": "pharmacy", "b": true}], [{"t": "Preciso de um médico", "b": false}, {"t": "I need a doctor", "b": true}], [{"t": "Dói-me aqui", "b": false}, {"t": "It hurts here", "b": true}], [{"t": "Chame uma ambulância!", "b": false}, {"t": "Call an ambulance!", "b": true}], [{"t": "hospital", "b": false}, {"t": "hospital", "b": true}], [{"t": "seguro de saúde", "b": false}, {"t": "health insurance", "b": true}]]}], "tip": false}, {"title": "Vocabulário: banco, polícia e repartições", "blocks": [{"type": "table", "headers": ["Significado", "Inglês"], "rows": [[{"t": "conta à ordem", "b": false}, {"t": "current account", "b": true}], [{"t": "multibanco", "b": false}, {"t": "ATM / cash machine", "b": true}], [{"t": "taxa de câmbio", "b": false}, {"t": "exchange rate", "b": true}], [{"t": "Perdi a carteira", "b": false}, {"t": "I've lost my wallet", "b": true}], [{"t": "queixa na polícia", "b": false}, {"t": "police report", "b": true}], [{"t": "esquadra da polícia", "b": false}, {"t": "police station", "b": true}], [{"t": "câmara municipal", "b": false}, {"t": "town hall", "b": true}], [{"t": "autorização de residência", "b": false}, {"t": "residence permit", "b": true}]]}], "tip": false}, {"title": "Vocabulário: transportes e direções", "blocks": [{"type": "table", "headers": ["Significado", "Inglês"], "rows": [[{"t": "bilhete simples", "b": false}, {"t": "one-way ticket", "b": true}], [{"t": "ida e volta", "b": false}, {"t": "round trip / return ticket", "b": true}], [{"t": "aluguer de carro", "b": false}, {"t": "car rental", "b": true}], [{"t": "Vire à direita", "b": false}, {"t": "Turn right", "b": true}], [{"t": "Siga em frente", "b": false}, {"t": "Go straight ahead", "b": true}], [{"t": "semáforo", "b": false}, {"t": "traffic light", "b": true}], [{"t": "rotunda", "b": false}, {"t": "roundabout", "b": true}], [{"t": "cais/plataforma", "b": false}, {"t": "platform", "b": true}], [{"t": "paragem de autocarro", "b": false}, {"t": "bus stop", "b": true}]]}], "tip": false}, {"title": "Vocabulário: compras e trabalho", "blocks": [{"type": "table", "headers": ["Significado", "Inglês"], "rows": [[{"t": "Pode fazer-me um desconto?", "b": false}, {"t": "Can you give me a discount?", "b": true}], [{"t": "tamanho (roupa)", "b": false}, {"t": "size", "b": true}], [{"t": "cabine de provas", "b": false}, {"t": "fitting room", "b": true}], [{"t": "reunião", "b": false}, {"t": "meeting", "b": true}], [{"t": "prazo", "b": false}, {"t": "deadline", "b": true}], [{"t": "candidatura a emprego", "b": false}, {"t": "job application", "b": true}], [{"t": "entrevista de emprego", "b": false}, {"t": "job interview", "b": true}], [{"t": "salário", "b": false}, {"t": "salary", "b": true}]]}], "tip": false}, {"title": "Etiqueta: formal ou informal?", "blocks": [{"type": "p", "html": "Ao contrário do português (tu/você/o senhor), o inglês moderno já não distingue formal e informal através de um pronome diferente — «you» usa-se sempre. A formalidade exprime-se, em vez disso, através do vocabulário, dos modais (would, could) e das fórmulas de abertura e fecho de e-mails.", "italic": false}, {"type": "list", "label": "Regras práticas", "intro": null, "items": ["Num e-mail formal: abre com «Dear Mr./Ms. [Apelido]» e fecha com «Best regards» ou «Kind regards».", "Num contexto informal: «Hi [nome]» e «Best» ou «Cheers» (sobretudo no Reino Unido) são perfeitamente aceitáveis.", "Usa «could you» ou «would you mind» em vez de uma ordem direta para pareceres mais educado."]}], "tip": false}, {"title": "Expressões idiomáticas avançadas", "blocks": [{"type": "table", "headers": ["Significado", "Expressão"], "rows": [[{"t": "Custar os olhos da cara", "b": false}, {"t": "To cost an arm and a leg", "b": true}], [{"t": "Estar com a cabeça nas nuvens", "b": false}, {"t": "To have your head in the clouds", "b": true}], [{"t": "Fazer de conta que nada se passou", "b": false}, {"t": "To act as if nothing happened", "b": true}], [{"t": "Estar teso/sem dinheiro", "b": false}, {"t": "To be broke", "b": true}], [{"t": "Meter-se em sarilhos", "b": false}, {"t": "To get into trouble", "b": true}], [{"t": "Quebrar o gelo", "b": false}, {"t": "To break the ice", "b": true}]]}], "tip": false}, {"title": "Diálogos práticos avançados", "blocks": [{"type": "p", "html": "Cenário: resolver um problema no hotel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Hóspede:", "orig": "Hello, there's a problem with my room, the air conditioning isn't working.", "trans": "Olá, há um problema com o meu quarto, o ar condicionado não funciona."}, {"speaker": "Rececionista:", "orig": "I'm so sorry, I'll send someone right away. Would you like to change rooms in the meantime?", "trans": "Lamento imenso, vou já enviar alguém. Prefere mudar de quarto entretanto?"}, {"speaker": "Hóspede:", "orig": "Yes, that would be easier, thank you.", "trans": "Sim, seria mais fácil, obrigado."}]}, {"type": "p", "html": "Cenário: no médico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "What seems to be the problem?", "trans": "O que se passa?"}, {"speaker": "Paciente:", "orig": "I've had a sore throat for three days and I have a slight fever.", "trans": "Tenho dores de garganta há três dias e um pouco de febre."}, {"speaker": "Médico:", "orig": "I'll prescribe you some medicine. Get plenty of rest.", "trans": "Vou receitar-lhe uns medicamentos. Descanse bem."}]}], "tip": false}, {"title": "Conclusão e próximos passos rumo à fluência", "blocks": [{"type": "list", "label": "Como continuar a progredir", "intro": null, "items": ["Vê séries e filmes em inglês com legendas em inglês, não em português, para habituar o ouvido.", "Lê todos os dias um artigo curto de um jornal inglês online (BBC, The Guardian).", "Encontra um parceiro linguístico para fazeres intercâmbios de conversação (tandem).", "Escreve um pequeno diário de algumas frases em inglês todos os dias.", "Não temas os erros: a verdadeira fluência nasce da prática constante, não da perfeição gramatical."]}], "tip": true}], "closingBasic": "Parabéns antecipados pela tua jornada no inglês — Good luck! (boa sorte!)", "closingAdvanced": "Parabéns pelo caminho já percorrido — continua assim, a verdadeira fluência está mais perto do que pensas! Good luck!"}, "ptbr": {"chapters": [{"title": "Introdução: por que aprender inglês?", "blocks": [{"type": "p", "html": "O inglês é a língua mais falada como segunda língua no mundo, oficial em mais de 50 países, e é a língua dos negócios, da ciência e da internet. Este livro te dá uma base sólida no inglês padrão, com algumas notas sobre as diferenças entre a pronúncia britânica e a americana.", "italic": false}, {"type": "p", "html": "A boa notícia: a gramática inglesa é mais simples que a portuguesa — não tem gênero gramatical para objetos, e as conjugações verbais são muito mais regulares. A principal dificuldade está na pronúncia, que muitas vezes não bate com a escrita, e em sons de vogais que não existem em português.", "italic": false}, {"type": "list", "label": "Objetivos deste livro", "intro": null, "items": ["Te dar uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Focar na pronúncia correta para que seu sotaque soe compreensível e natural.", "Te dar frases práticas para usar desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e as bases da pronúncia", "blocks": [{"type": "p", "html": "O inglês usa o alfabeto latino, mas a pronúncia de uma palavra muitas vezes não bate nada com a escrita — diferente do português, onde cada letra quase sempre se lê do mesmo jeito. Essa tabela mostra alguns sons distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "haus", "b": false}, {"t": "house (o e final é mudo)", "b": true}], [{"t": "oi/bom dia", "b": false}, {"t": "rêlôu", "b": false}, {"t": "hello (o h é aspirado, não é mudo)", "b": true}], [{"t": "obrigado", "b": false}, {"t": "thenk iú", "b": false}, {"t": "thank you (th = som interdental que não existe em português)", "b": true}], [{"t": "gato", "b": false}, {"t": "quét", "b": false}, {"t": "cat", "b": true}], [{"t": "eu", "b": false}, {"t": "ai", "b": false}, {"t": "I (se escreve sempre com uma letra maiúscula!)", "b": true}], [{"t": "menino", "b": false}, {"t": "bói", "b": false}, {"t": "boy", "b": true}], [{"t": "água", "b": false}, {"t": "uóra", "b": false}, {"t": "water (o t entre vogais soa quase como um d leve no inglês americano)", "b": true}], [{"t": "ovo", "b": false}, {"t": "égui", "b": false}, {"t": "egg", "b": true}], [{"t": "vinho", "b": false}, {"t": "uáin", "b": false}, {"t": "wine (w = som labial que não existe em português)", "b": true}], [{"t": "sapato", "b": false}, {"t": "chu", "b": false}, {"t": "shoe (sh = som «ch»)", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Essas 6 regras de ouro fazem toda a diferença para um sotaque compreensível e natural:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["A letra h sempre se pronuncia aspirada (house, hello) — nunca muda.", "O grupo th tem dois sons interdentais (a língua entre os dentes) que não existem em português: um surdo (think) e um sonoro (this) — treine na frente do espelho.", "O w se pronuncia com os lábios arredondados como pra dar um beijo (water, we) — bem diferente do v.", "O acento tônico em inglês muda o significado da palavra com frequência, e precisa ser aprendido palavra por palavra — não tem uma regra fixa como em português.", "As vogais em inglês têm muito mais sons que as do português: a mesma letra a pode soar de jeitos completamente diferentes (cat, cake, car).", "O inglês britânico e o americano diferem principalmente no r (pronunciado sempre no americano, muitas vezes mudo no fim da palavra no britânico) e em algumas vogais."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Inglês"], "rows": [[{"t": "Bom dia (formal)", "b": false}, {"t": "gud mórning", "b": false}, {"t": "Good morning", "b": true}], [{"t": "Boa noite (ao chegar)", "b": false}, {"t": "gud ívning", "b": false}, {"t": "Good evening", "b": true}], [{"t": "Oi (informal)", "b": false}, {"t": "rêlôu / rai", "b": false}, {"t": "Hello / Hi", "b": true}], [{"t": "Como você está?", "b": false}, {"t": "rau ar iú", "b": false}, {"t": "How are you?", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "aim fain, thenk iú", "b": false}, {"t": "I'm fine, thank you", "b": true}], [{"t": "Prazer em conhecer você", "b": false}, {"t": "nais tu mit iú", "b": false}, {"t": "Nice to meet you", "b": true}], [{"t": "Até logo", "b": false}, {"t": "si iú sun", "b": false}, {"t": "See you soon", "b": true}], [{"t": "Até amanhã", "b": false}, {"t": "si iú tumórou", "b": false}, {"t": "See you tomorrow", "b": true}], [{"t": "Tchau", "b": false}, {"t": "gudbai", "b": false}, {"t": "Goodbye", "b": true}], [{"t": "Por favor", "b": false}, {"t": "plíz", "b": false}, {"t": "Please", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "thenk iú", "b": false}, {"t": "Thank you", "b": true}], [{"t": "De nada", "b": false}, {"t": "iór uélcam", "b": false}, {"t": "You're welcome", "b": true}], [{"t": "Desculpa", "b": false}, {"t": "sóri / ikscúz mi", "b": false}, {"t": "Sorry / Excuse me", "b": true}], [{"t": "Sim", "b": false}, {"t": "iés", "b": false}, {"t": "Yes", "b": true}], [{"t": "Não", "b": false}, {"t": "nôu", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "Os pronomes e o verbo «to be» (ser/estar)", "blocks": [{"type": "p", "html": "Diferente do português, o inglês não tem dois verbos separados para «ser» e «estar» — um único verbo, «to be», cobre identidade, descrição e estado temporário ao mesmo tempo.", "italic": false}, {"type": "h3", "text": "Pronomes"}, {"type": "table", "headers": ["Português", "Inglês"], "rows": [[{"t": "eu", "b": false}, {"t": "I", "b": true}], [{"t": "você", "b": false}, {"t": "you", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "he / she", "b": true}], [{"t": "nós", "b": false}, {"t": "we", "b": true}], [{"t": "vocês", "b": false}, {"t": "you", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "they", "b": true}]]}, {"type": "h3", "text": "to be — ser/estar"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "I", "b": false}, {"t": "am", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "he/she", "b": false}, {"t": "is", "b": true}], [{"t": "we", "b": false}, {"t": "are", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "they", "b": false}, {"t": "are", "b": true}]]}, {"type": "p", "html": "Exemplo: I am Brazilian — Sou brasileiro. — I am in London — Estou (agora) em Londres. Repare como o mesmo verbo cobre as duas situações!", "italic": false}], "tip": false}, {"title": "Verbos comuns e sua conjugação", "blocks": [{"type": "p", "html": "A grande vantagem do inglês: no presente, a maioria dos verbos tem só duas formas — a forma base e a forma com -s para a terceira pessoa do singular (he/she/it).", "italic": false}, {"type": "table", "headers": ["Pronome", "to speak (falar)", "to work (trabalhar)"], "rows": [[{"t": "I", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "you", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}], [{"t": "we", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "you", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}]]}, {"type": "h3", "text": "Verbos irregulares importantes (formas «I»/«he»)"}, {"type": "table", "headers": ["Significado", "I", "he/she", "Verbo"], "rows": [[{"t": "ter", "b": false}, {"t": "have", "b": false}, {"t": "has", "b": false}, {"t": "to have", "b": true}], [{"t": "ir", "b": false}, {"t": "go", "b": false}, {"t": "goes", "b": false}, {"t": "to go", "b": true}], [{"t": "fazer", "b": false}, {"t": "do", "b": false}, {"t": "does", "b": false}, {"t": "to do", "b": true}], [{"t": "poder", "b": false}, {"t": "can", "b": false}, {"t": "can", "b": false}, {"t": er Inglês — Fácil, Divertido e Rápido», que cobriu as bases. Se você já terminou o nível básico e quer chegar a um nível que te permita realmente se virar viajando, trabalhando e no dia a dia, este livro vai te dar: os tempos verbais que você precisa, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "Antes de começar", "intro": null, "items": ["Você já deve saber: cumprimentos, pronomes, o verbo to be, a conjugação no presente, e os números — tudo isso está no livro básico.", "Nosso objetivo aqui não é te ensinar tudo sobre o idioma, mas te dar ferramentas suficientes pra você se virar sozinho em qualquer situação.", "Vá com calma em cada capítulo, e pratique os exemplos em voz alta antes de passar pro próximo."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "table", "headers": ["I", "you", "he/she", "we", "you/they"], "rows": [[{"t": "eu", "b": false}, {"t": "você", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vocês/eles", "b": true}]]}, {"type": "h3", "text": "Presente — os padrões regulares"}, {"type": "table", "headers": ["Pronome", "to speak", "to work"], "rows": [[{"t": "I/you/we/they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}]]}], "tip": false}, {"title": "O passado: Past Simple e Past Continuous", "blocks": [{"type": "p", "html": "O inglês, assim como o português, distingue uma ação pontual e terminada no passado (Past Simple) de uma ação em andamento num momento do passado (Past Continuous). O Past Simple dos verbos regulares se forma com -ed:", "italic": false}, {"type": "table", "headers": ["Verbo", "Past Simple", "Exemplo"], "rows": [[{"t": "to work", "b": false}, {"t": "worked", "b": false}, {"t": "I worked yesterday — Trabalhei ontem", "b": true}], [{"t": "to play", "b": false}, {"t": "played", "b": false}, {"t": "She played tennis — Ela jogou tênis", "b": true}]]}, {"type": "p", "html": "Atenção: muitos verbos comuns são irregulares e precisam ser decorados à parte: go → went, have → had, see → saw, do → did, come → came.", "italic": false}, {"type": "h3", "text": "O Past Continuous"}, {"type": "table", "headers": ["Pronome", "was/were + -ing"], "rows": [[{"t": "I/he/she", "b": false}, {"t": "was working", "b": true}], [{"t": "you/we/they", "b": false}, {"t": "were working", "b": true}]]}, {"type": "p", "html": "Exemplo: I was watching TV when you called — Eu estava assistindo TV quando você ligou (ação em andamento interrompida por outra).", "italic": false}], "tip": false}, {"title": "O Present Perfect e sua diferença do passado", "blocks": [{"type": "p", "html": "O Present Perfect (have/has + particípio passado) é um dos conceitos mais difíceis pra quem fala português, porque não corresponde exatamente ao nosso pretérito perfeito. É usado pra uma ação passada ligada ao presente, sem um momento específico:", "italic": false}, {"type": "table", "headers": ["Uso", "Exemplo", "Tradução"], "rows": [[{"t": "Experiência de vida (sem tempo específico)", "b": false}, {"t": "I have visited Paris", "b": false}, {"t": "Já visitei Paris (uma vez, não importa quando)", "b": true}], [{"t": "Ação passada com tempo específico → Past Simple", "b": false}, {"t": "I visited Paris in 2019", "b": false}, {"t": "Visitei Paris em 2019", "b": true}], [{"t": "Ação que começou no passado e continua", "b": false}, {"t": "I have lived here for 5 years", "b": false}, {"t": "Moro aqui há 5 anos", "b": true}]]}, {"type": "p", "html": "Regra prática: se tem um momento específico na frase (yesterday, in 2019, last week), use sempre o Past Simple, nunca o Present Perfect — um erro muito comum entre falantes de português.", "italic": false}], "tip": false}, {"title": "Futuro: will, going to e o presente contínuo", "blocks": [{"type": "table", "headers": ["Uso", "Formação", "Exemplo"], " <script>
(function(){
  var DATA = window.GUIDE_DATA;       // { ar: {chapters:[...], closingBasic, closingAdvanced}, en: {...}, ... }
  var STR = window.GUIDE_STRINGS;     // per-language UI strings for this guide
  var META = window.GUIDE_META;       // { waNumberByLang, ptFallback }

  function waLink(lang){
    var num = META.waNumberByLang[lang] || META.waNumberByLang.en;
    var msg = STR.waMsg[lang] || STR.waMsg.en;
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }

  function renderTableBlock(b){
    var html = '<table><thead><tr>' + b.headers.map(function(h){ return '<th>'+h+'</th>'; }).join('') + '</tr></thead><tbody>';
    b.rows.forEach(function(row){
      html += '<tr>' + row.map(function(c){ return '<td'+(c.b?' class="phrase-it"':'')+'>'+c.t+'</td>'; }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function renderListBlock(b, isTip, tipLabelFallback){
    var boxClass = isTip ? 'tip-box' : 'goal-box';
    var html = '<div class="'+boxClass+'">';
    if (isTip) {
      html += '<span class="tip-label">' + (b.label || tipLabelFallback || '') + '</span>';
    } else if (b.label) {
      html += '<strong>' + b.label + '</strong>';
    }
    if (b.intro) html += '<p style="margin-top:8px;">' + b.intro + '</p>';
    if (b.items && b.items.length) {
      html += '<ul>' + b.items.map(function(it){ return '<li>' + it + '</li>'; }).join('') + '</ul>';
    }
    html += '</div>';
    return html;
  }

  function renderDialogueBlock(b){
    var html = '<div class="dialogue">';
    b.lines.forEach(function(line){
      html += '<div class="line">';
      if (line.speaker) html += '<span class="speaker">' + line.speaker + '</span> ';
      html += '<span class="orig">' + line.orig + '</span><br><span class="trans">' + (line.trans || '') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderBlock(b, isTip, tipLabelFallback){
    switch(b.type){
      case 'p': return '<p' + (b.italic ? ' style="font-style:italic;"' : '') + '>' + b.html + '</p>';
      case 'h3': return '<h3>' + b.text + '</h3>';
      case 'table': return renderTableBlock(b);
      case 'list': return renderListBlock(b, isTip, tipLabelFallback);
      case 'dialogue': return renderDialogueBlock(b);
      default: return '';
    }
  }

  function render(lang){
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    var doc = DATA[lang] || DATA.en || DATA.ar || DATA[Object.keys(DATA)[0]];
    var s = STR;

    document.getElementById('brand-text').textContent = s.brand[lang] || s.brand.en;
    document.getElementById('back-link').textContent = s.backLink[lang] || s.backLink.en;
    document.getElementById('nav-cta').innerHTML = '💬 ' + (s.navCta[lang] || s.navCta.en);
    document.getElementById('nav-cta').href = waLink(lang);
    document.getElementById('hero-title').textContent = s.mainTitle[lang] || s.mainTitle.en;
    document.getElementById('hero-subtitle').textContent = s.mainSubtitle[lang] || s.mainSubtitle.en;
    document.getElementById('byline-name').textContent = s.bylineName[lang] || s.bylineName.en;
    document.getElementById('byline-meta').textContent = s.bylineMeta[lang] || s.bylineMeta.en;
    document.getElementById('toc-heading').textContent = s.tocHeading[lang] || s.tocHeading.en;
    document.getElementById('cta-h3').textContent = s.ctaH3[lang] || s.ctaH3.en;
    document.getElementById('cta-p').textContent = s.ctaP[lang] || s.ctaP.en;
    document.getElementById('cta-btn-text').textContent = s.navCta[lang] || s.navCta.en;
    document.getElementById('cta-btn-bottom').href = waLink(lang);
    document.getElementById('floating-wa').href = waLink(lang);
    document.getElementById('footer-copyright').textContent = s.footerCopyright[lang] || s.footerCopyright.en;
    document.getElementById('footer-back').textContent = s.footerBack[lang] || s.footerBack.en;

    var chapters = doc.chapters;
    var tocHtml = '';
    var chaptersHtml = '';
    chapters.forEach(function(ch, i){
      var num = i + 1;
      if (ch.dividerBefore) {
        tocHtml += '<span class="toc-part">' + (s.partTag[lang]||s.partTag.en) + ' — ' + (s.partTitle[lang]||s.partTitle.en) + '</span>';
      }
      tocHtml += '<a href="#c' + num + '">' + num + '. ' + ch.title + '</a>';

      if (ch.dividerBefore) {
        chaptersHtml += '<div class="part-divider"><span class="tag">' + (s.partTag[lang]||s.partTag.en) + '</span><h2>' + (s.partTitle[lang]||s.partTitle.en) + '</h2></div>';
      }
      chaptersHtml += '<div class="chapter" id="c' + num + '"><h2>' + num + '. ' + ch.title + '</h2>';
      ch.blocks.forEach(function(b){
        chaptersHtml += renderBlock(b, ch.tip, null);
      });
      if (i === chapters.length - 1 && doc.closingAdvanced) {
        chaptersHtml += '<p style="text-align:center;font-weight:800;color:var(--brand-blue-dark);margin-top:20px;">' + doc.closingAdvanced + '</p>';
      }
      chaptersHtml += '</div>';
    });
    document.getElementById('toc-grid').innerHTML = tocHtml;
    document.getElementById('chapters-container').innerHTML = chaptersHtml;
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ render(btn.getAttribute('data-lang')); });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(DATA[savedLang] ? savedLang : 'ar');
})();
</script>

</body>
</html>
