  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--brand-orange);color:#fff;font-weight:800;font-size:15px;padding:14px 24px;border-radius:12px;}

  .footer-inner{max-width:1140px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-size:13px;}

 "speaks", "b": false}, {"t": "works", "b": true}]]}], "tip": false}, {"title": "الماضي: Past Simple و Past Continuous", "blocks": [{"type": "p", "html": "الإنجليزي بيفرّق بين حدث تم وخلص في الماضي (Past Simple) وحدث كان مستمر في لحظة معينة في الماضي (Past Continuous). الـ Past Simple للأفعال المنتظمة بتتكون بإضافة -ed:", "italic": false}, {"type": "table", "headers": ["الفعل", "Past Simple", "مثال"], "rows": [[{"t": "to work", "b": false}, {"t": "worked", "b": false}, {"t": "I worked yesterday — شغلت إمبارح", "b": true}], [{"t": "to play", "b": false}, {"t": "played", "b": false}, {"t": "She played tennis — لعبت تنس", "b": true}]]}, {"type": "p", "html": "خد بالك: كتير من الأفعال الشائعة شاذة ولازم تحفظها لوحدها: go → went, have → had, see → saw, do → did, come → came.", "italic": false}, {"type": "h3", "text": "الـ Past Continuous"}, {"type": "table", "headers": ["الضمير", "was/were + -ing"], "rows": [[{"t": "I/he/she", "b": false}, {"t": "was working", "b": true}], [{"t": "you/we/they", "b": false}, {"t": "were working", "b": true}]]}, {"type": "p", "html": "مثال: I was watching TV when you called — كنت بتفرج على التلفزيون لما اتصلت (حدث مستمر قاطعه حدث تاني).", "italic": false}], "tip": false}, {"title": "الـ Present Perfect وفرقه عن الماضي", "blocks": [{"type": "p", "html": "الـ Present Perfect (have/has + التصريف التالت) من أصعب المفاهيم اللي المصري ممكن يواجهها، لأنه مالهوش مقابل مباشر في العربي. بيتستخدم لحدث في الماضي متربط بالحاضر، من غير وقت محدد:", "italic": false}, {"type": "table", "headers": ["الاستخدام", "مثال", "الترجمة"], "rows": [[{"t": "خبرة حياتية (من غير وقت محدد)", "b": false}, {"t": "I have visited Paris", "b": false}, {"t": "زرت باريس (مرة، مش مهم إمتى)", "b": true}], [{"t": "حدث في الماضي بوقت محدد → Past Simple", "b": false}, {"t": "I visited Paris in 2019", "b": false}, {"t": "زرت باريس سنة 2019", "b": true}], [{"t": "حدث بدأ في الماضي ولسه مستمر", "b": false}, {"t": "I have lived here for 5 years", "b": false}, {"t": "عايش هنا من 5 سنين"  "البروتوكول: رسمي ولا غير رسمي؟", "blocks": [{"type": "p", "html": "الإنجليزي الحديث مافيهوش تفرقة بين رسمي وغير رسمي بضمير مختلف زي في لغات تانية — «you» بتستخدم دايماً. الرسمية بتتعبر عنها من خلال المفردات، صيغ الأفعال (would, could)، وطريقة فتح وقفل الإيميلات.", "italic": false}, {"type": "list", "label": "قواعد عملية", "intro": null, "items": ["في إيميل رسمي: ابدأ بـ«Dear Mr./Ms. [الاسم]» واقفل بـ«Best regards» أو «Kind regards».", "في سياق غير رسمي: «Hi [الاسم]» و«Best» أو «Cheers» (خصوصاً في بريطانيا) مقبولين تماماً.", "استخدم «could you» أو «would you mind» بدل الأمر المباشر عشان تبان أكثر لباقة."]}], "tip": false}, {"title": "تعبيرات اصطلاحية متقدمة", "blocks": [{"type": "table", "headers": ["المعنى", "التعبير"], "rows": [[{"t": "يكلف تعب القلب (غالي جداً)", "b": false}, {"t": "To cost an arm and a leg", "b": true}], [{"t": "يكون شارد الذهن", "b": false}, {"t": "To have your head in the clouds", "b": true}], [{"t": "يتظاهر إنه مش حاسس بحاجة", "b": false}, {"t": "To act as if nothing happened", "b": true}], [{"t": "يكون مفلس", "b": false}, {"t": "To be broke", "b": true}], [{"t": "يقع في مشاكل", "b": false}, {"t": "To get into trouble", "b": true}], [{"t": "يكسر الجليد", "b": false}, {"t": "To break the ice", "b": true}]]}], "tip": false}, {"title": "حوارات عملية متقدمة", "blocks": [{"type": "p", "html": "سيناريو: حل مشكلة في الفندق.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "الضيف:", "orig": "Hello, there's a problem with my room, the air conditioning isn't working.", "trans": "أهلاً، فيه مشكلة في الأوضة بتاعتي، التكييف مش شغال."}, {"speaker": "الريسبشن:", "orig": "I'm so sorry, I'll send someone right away. Would you like to change rooms in the meantime?", "trans": "آسفة جداً، هبعت حد على طول. حضرتك عايز تغير أوضة لحد ما نصلح؟"}, {"speaker": "الضيف:", "orig": "Yes, that would be easier, thank you.", "trans": "أيوه، هيكون أسهل، شكراً."}]}, {"type": "p", "html": "سيناريو: عند الدكتور.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "الدكتور:", "orig": "What seems to be the problem?", "trans": "إيه المشكلة؟"}, {"speaker": "المريض:", "orig": "I've had a sore throat for three days and I have a slight fever.", "trans": "زوري بيوجعني من ثلات أيام وعندي شوية سخونية."}, {"speaker": "الدكتور:", "orig": "I'll prescribe you some medicine. Get plenty of rest.", "trans": "هكتبلك دوا. ارتاح كويس."}]}], "tip": false}, {"title": "الخاتمة والخطوات الجاية نحو الطلاقة", "blocks": [{"type": "list", "label": "إزاي تكمل تتقدم", "intro": null, "items": ["شوف مسلسلات وأفلام بالإنجليزي بترجمة إنجليزي، مش عربي، عشان تعوّد ودنك.", "اقرا كل يوم مقال قصير من جريدة إنجليزية أونلاين (BBC, The Guardian).", "دور على حد يعمل معاك تبادل لغوي (تاندم) عشان تتمرنوا على الكلام مع بعض.", "اكتب يوميات قصيرة كل يوم بالإنجليزي.", "متخافش من الغلط: الطلاقة الحقيقية بتيجي من التمرين المستمر، مش من الكمال في القواعد."]}], "tip": true}], "closingBasic": "مبروك مقدماً على رحلتك مع الإنجليزي — Good luck! (بالتوفيق!)", "closingAdvanced": "مبروك على الشوط اللي قطعته — كمّل كده، الطلاقة الحقيقية أقرب مما تتخيل! Good luck!"}, "it": {"chapters": [{"title": "Introduzione: perché imparare l'inglese?", "blocks": [{"type": "p", "html": "L'inglese è la lingua più parlata al mondo come seconda lingua, ufficiale in più di 50 paesi, ed è la lingua degli affari, della scienza e di Internet. Questo libro ti dà una base solida nell'inglese standard, con qualche nota sulle differenze tra pronuncia britannica e americana.", "italic": false}, {"type": "p", "html": "La buona notizia: la grammatica inglese è più semplice di quella italiana — niente generi grammaticali per gli oggetti, coniugazioni verbali molto più regolari. La difficoltà principale sta nella pronuncia, spesso lontana dalla scrittura, e nei suoni vocalici che non esistono in italiano.", "italic": false}, {"type": "list", "label": "Obiettivi di questo libro", "intro": null, "items": ["Darti una base solida di vocabolario e grammatica essenziale nel minor tempo possibile.", "Concentrarci sulla pronuncia corretta perché il tuo accento sia comprensibile e naturale.", "Darti frasi pratiche da usare fin dal primo giorno in situazioni reali."]}], "tip": false}, {"title": "L'alfabeto e le basi della pronuncia", "blocks": [{"type": "p", "html": "L'inglese usa l'alfabeto latino, ma la pronuncia di una parola spesso non corrisponde affatto alla sua scrittura — a differenza dell'italiano, dove ogni lettera si legge quasi sempre nello stesso modo. Questa tabella presenta alcuni suoni distintivi:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Parola"], "rows": [[{"t": "casa", "b": false}, {"t": "haus", "b": false}, {"t": "house (la finale e è muta)", "b": true}], [{"t": "ciao/buongiorno", "b": false}, {"t": "hallòu", "b": false}, {"t": "hello (la h si aspira, non è muta come in italiano)", "b": true}], [{"t": "grazie", "b": false}, {"t": "senk-iù", "b": false}, {"t": "thank you (th = suono interdentale che non esiste in italiano)", "b": true}], [{"t": "gatto", "b": false}, {"t": "chat", "b": false}, {"t": "cat", "b": true}], [{"t": "io", "b": false}, {"t": "ai", "b": false}, {"t": "I (si scrive con una sola lettera maiuscola!)", "b": true}], [{"t": "ragazzo", "b": false}, {"t": "boi", "b": false}, {"t": "boy", "b": true}], [{"t": "acqua", "b": false}, {"t": "uòter", "b": false}, {"t": "water (la t tra vocali suona quasi come una d leggera in americano)", "b": true}], [{"t": "uovo", "b": false}, {"t": "egh", "b": false}, {"t": "egg", "b": true}], [{"t": "vino", "b": false}, {"t": "uain", "b": false}, {"t": "wine (w = suono labiale che non esiste in italiano)", "b": true}], [{"t": "scarpa", "b": false}, {"t": "shiù", "b": false}, {"t": "shoe (sh = suono «sc» come in «scena»)", "b": true}]]}], "tip": false}, {"title": "Le regole d'oro per una pronuncia autentica", "blocks": [{"type": "p", "html": "Queste 6 regole d'oro fanno la maggiore differenza per un accento comprensibile e naturale:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["La lettera h si pronuncia sempre aspirata (house, hello) — mai muta come in italiano.", "Il gruppo th ha due suoni interdentali (con la lingua tra i denti) che non esistono in italiano: uno sordo (think) e uno sonoro (this) — vanno praticati davanti allo specchio.", "La w si pronuncia con le labbra arrotondate come per fare un bacio (water, we) — molto diversa dalla v italiana.", "L'accento tonico in inglese cambia spesso il significato della parola e va imparato parola per parola — non esiste una regola fissa come in italiano.", "Le vocali inglesi hanno molti più suoni di quelle italiane: la stessa lettera a puo suonare in modi completamente diversi (cat, cake, car).", "L'inglese britannico e quello americano differiscono soprattutto nella r (pronunciata sempre in americano, spesso muta in fine di parola in britannico) e in alcune vocali."]}], "tip": false}, {"title": "Saluti e frasi essenziali", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Inglese"], "rows": [[{"t": "Buongiorno (formale)", "b": false}, {"t": "gud mòrning", "b": false}, {"t": "Good morning", "b": true}], [{"t": "Buonasera", "b": false}, {"t": "gud ìvning", "b": false}, {"t": "Good evening", "b": true}], [{"t": "Ciao (informale)", "b": false}, {"t": "hallòu / hai", "b": false}, {"t": "Hello / Hi", "b": true}], [{"t": "Come stai?", "b": false}, {"t": "hau ar iù", "b": false}, {"t": "How are you?", "b": true}], [{"t": "Bene, grazie", "b": false}, {"t": "aim faìn, senk iù", "b": false}, {"t": "I'm fine, thank you", "b": true}], [{"t": "Piacere di conoscerti", "b": false}, {"t": "naisс tu mìt iù", "b": false}, {"t": "Nice to meet you", "b": true}], [{"t": "A presto", "b": false}, {"t": "si iù sun", "b": false}, {"t": "See you soon", "b": true}], [{"t": "A domani", "b": false}, {"t": "si iù tomorrou", "b": false}, {"t": "See you tomorrow", "b": true}], [{"t": "Arrivederci", "b": false}, {"t": "gudbài", "b": false}, {"t": "Goodbye", "b": true}], [{"t": "Per favore", "b": false}, {"t": "plìs", "b": false}, {"t": "Please", "b": true}], [{"t": "Grazie", "b": false}, {"t": "senk iù", "b": false}, {"t": "Thank you", "b": true}], [{"t": "Prego", "b": false}, {"t": "iòr uèlkam", "b": false}, {"t": "You're welcome", "b": true}], [{"t": "Scusa", "b": false}, {"t": "sòri / eskiùs mi", "b": false}, {"t": "Sorry / Excuse me", "b": true}], [{"t": "Sì", "b": false}, {"t": "iès", "b": false}, {"t": "Yes", "b": true}], [{"t": "No", "b": false}, {"t": "nòu", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "I pronomi e il verbo «to be» (essere)", "blocks": [{"type": "p", "html": "Come l'italiano, l'inglese ha un solo verbo per «essere» in tutti i sensi — identità, stato temporaneo, posizione. Il grande vantaggio: la conjugazione è estremamente semplice, con solo tre forme diverse al presente.", "italic": false}, {"type": "h3", "text": "Pronomi"}, {"type": "table", "headers": ["Italiano", "Inglese"], "rows": [[{"t": "io", "b": false}, {"t": "I", "b": true}], [{"t": "tu", "b": false}, {"t": "you", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "he / she", "b": true}], [{"t": "noi", "b": false}, {"t": "we", "b": true}], [{"t": "voi", "b": false}, {"t": "you", "b": true}], [{"t": "loro", "b": false}, {"t": "they", "b": true}]]}, {"type": "h3", "text": "to be — essere"}, {"type": "table", "headers": ["Pronome", "Coniugazione"], "rows": [[{"t": "I", "b": false}, {"t": "am", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "he/she", "b": false}, {"t": "is", "b": true}], [{"t": "we", "b": false}, {"t": "are", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "they", "b": false}, {"t": "are", "b": true}]]}, {"type": "p", "html": "Esempio: I am Italian — Sono italiano. — I am in London — Sono (ora) a Londra. Nota come lo stesso verbo copre entrambe le situazioni, esattamente come essere in italiano!", "italic": false}], "tip": false}, {"title": "Verbi comuni e la loro a coffee, please.", "trans": "Ciao! Vorrei un caffè, per favore."}, {"speaker": "Cameriere:", "orig": "Is that all?", "trans": "Solo questo?"}, {"speaker": "Cliente:", "orig": "Yes, and the bill, please.", "trans": "Sì, e il conto, per favore."}, {"speaker": "Cameriere:", "orig": "That's two euros. Thanks!", "trans": "Sono due euro. Grazie!"}, {"speaker": "Cliente:", "orig": "You're welcome, see you soon!", "trans": "Prego, a presto!"}]}], "tip": false}, {"title": "Piano d'azione: come imparare in fretta", "blocks": [{"type": "list", "label": "7 passi per fissare la lingua velocemente", "intro": null, "items": ["Ascolta podcast e guarda serie in inglese ogni giorno, anche solo 10 minuti — l'orecchio si abitua prima della mente.", "Pratica lo «shadowing»: ascolta una frase breve e ripetila subito con lo stesso ritmo e la stessa velocità.", "Pratica i suoni th e w davanti allo specchio — sono la sfida più grande per un italiano.", "Non tradurre nella tua testa — prova a pensare direttamente in inglese.", "Usa un'app come Duolingo o Babbel insieme a questo libro per rinforzare il vocabolario.", "Parla fin dal primo giorno, anche se sbagli — la scioltezza viene dalla pratica, non dalla memorizzazione.", "Guarda film e serie prima con sottotitoli in inglese, poi senza — è il modo più veloce per abituare l'orecchio."]}], "tip": true}, {"title": "Introduzione: per chi è questo libro?", "blocks": [{"type": "p", "html": "Questo libro è la seconda parte dopo «Imparare l'Inglese — Facile, Divertente e Veloce», che ha coperto le basi. Se hai già finito il livello base e vuoi raggiungere un livello che ti permetta davvero di cavartela in viaggio, al lavoro e nella vita quotidiana, questo libro ti darà: i tempi verbali di cui hai bisogno, vocabolario pratico per situazioni reali, e dialoghi realistici.", "italic": false}, {"type": "list", "label": "Prima di iniziare", "intro": null, "items": ["Dovresti già conoscere: saluti, pronomi, il verbo to be, la coniugazione del presente e i numeri — tutto questo è nel libro base.", "Il nostro obiettivo qui non è insegnarti tutto sulla lingua, ma darti abbastanza strumenti per cavartela da solo in qualsiasi situazione.", "Vai con calma in ogni capitolo, e pratica gli esempi ad alta voce prima di passare al successivo."]}], "tip": false, "dividerBefore": true}, {"title": "Ripasso veloce del livello base", "blocks": [{"type": "table", "headers": ["I", "you", "he/she", "we", "you/they"], "rows": [[{"t": "io", "b": false}, {"t": "tu", "b": false}, {"t": "lui/lei", "b": false}, {"t": "noi", "b": false}, {"t": "voi/loro", "b": true}]]}, {"type": "h3", "text": "Presente — gli schemi regolari"}, {"type": "table", "headers": ["Pronome", "to speak", "to work"], "rows": [[{"t": "I/you/we/they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}]]}], "tip": false}, {"title": "Il passato: Past Simple e Past Continuous", "blocks": [{"type": "p", "html": "L'inglese, come l'italiano, distingue un'azione compiuta e puntuale nel passato (Past Simple, simile al passato remoto/prossimo) da un'azione in corso in un momento del passato (Past Continuous, simile a un imperfetto progressivo). Il Past Simple dei verbi regolari si forma con -ed:", "italic": false}, {"type": "table", "headers": ["Verbo", "Past Simple", "Esempio"], "rows": [[{"t": "to work", "b": false}, {"t": "worked", "b": false}, {"t": "I worked yesterday — Ho lavorato ieri", "b": true}], [{"t": "to play", "b": false}, {"t": "played", "b": false}, {"t": "She played tennis — Ha giocato a tennis", "b": true}]]}, {"type": "p", "html": "Attenzione: molti verbi comuni sono irregolari e vanno memorizzati a parte: go → went, have → had, see → saw, do → did, come → came.", "italic": false}, {"type": "h3", "text": "Il Past Continuous"}, {"type": "table", "headers": ["Pronome", "was/were + -ing"], "rows": [[{"t": "I/he/she", "b": false}, {"t": "was working", "b": true}], [{"t": "you/we/they", "b": false}, {"t": "were working", "b": true}]]}, {"type": "p", "html": "Esempio: I was watching TV when you called — Stavo guardando la TV quando hai chiamato (azione in corso interrotta da un'altra).", "italic": false}], "tip": false}, {"title": "Il Present Perfect e la sua differenza dal passato", "blocks": [{"type": "p", "html": "Il Present Perfect (have/has + participio passato) è uno dei concetti più difficili per un italiano, perché non corrisponde esattamente al nostro passato composto. Si usa per un'azione passata collegata al presente, senza un momento preciso:", "italic": false}, {"type": "table", "headers": ["Uso", "Esempio", "Traduzione"], "rows": [[{"t": "Esperienza di vita (senza tempo preciso)", "b": false}, {"t": "I have visited Paris", "b": false}, {"t": "Sono stato a Parigi (una volta, non importa quando)", "b": true}], [{"t": "Azione passata con tempo preciso → Past Simple", "b": false}, {"t": "I visited Paris in 2019", "b": false}, {"t": "Sono stato a Parigi nel 2019", "b": true}], [{"t": "Azione iniziata nel passato e ancora in corso", "b": false}, {"t": "I have lived here for 5 years", "b": false}, {"t": "Vivo qui da 5 anni", "b": true}]]}, {"type": "p", "html": "Regola pratica: se c'è un momento preciso nella frase (yesterday, in 2019, last week), usa sempre il Past Simple, mai il Present Perfect — un errore molto comune tra gli italiani.", "italic": false}], "tip": false}, {"title": "Futuro: will, going to e il presente continuo", "blocks": [{"type": "table", "headers": ["Uso", "Formazione", "Esempio"], "rows": [[{"t": "Previsione/decisione spontanea", "b": false}, {"t": "will + infinito", "b": false}, {"t": "I will call you tomorrow — Ti chiamerò domani", "b": true}], [{"t": "Intenzione/piano già deciso", "b": false}, {"t": "going to + infinito", "b": false}, {"t": "I'm going to visit Rome — Ho intenzione di visitare Roma", "b": true}], [{"t": "Programma fissato (con orario)", "b": false}, {"t": "presente continuo", [{"t": "comune/municipio", "b": false}, {"t": "town hall", "b": true}], [{"t": "permesso di soggiorno", "b": false}, {"t": "residence permit", "b": true}]]}], "tip": false}, {"title": "Vocabolario: trasporti e indicazioni", "blocks": [{"type": "table", "headers": ["Significato", "Inglese"], "rows": [[{"t": "biglietto di sola andata", "b": false}, {"t": "one-way ticket", "b": true}], [{"t": "andata e ritorno", "b": false}, {"t": "round trip / return ticket", "b": true}], [{"t": "noleggio auto", "b": false}, {"t": "car rental", "b": true}], [{"t": "Giri a destra", "b": false}, {"t": "Turn right", "b": true}], [{"t": "Vada dritto", "b": false}, {"t": "Go straight ahead", "b": true}], [{"t": "semaforo", "b": false}, {"t": "traffic light", "b": true}], [{"t": "rotatoria", "b": false}, {"t": "roundabout", "b": true}], [{"t": "binario", "b": false}, {"t": "platform", "b": true}], [{"t": "fermata dell'autobus", "b": false}, {"t": "bus stop", "b": true}]]}], "tip": false}, {"title": "Vocabolario: shopping e lavoro", "blocks": [{"type": "table", "headers": ["Significato", "Inglese"], "rows": [[{"t": "Può farmi uno sconto?", "b": false}, {"t": "Can you give me a discount?", "b": true}], [{"t": "taglia (vestiti)", "b": false}, {"t": "size", "b": true}], [{"t": "camerino", "b": false}, {"t": "fitting room", "b": true}], [{"t": "riunione", "b": false}, {"t": "meeting", "b": true}], [{"t": "scadenza", "b": false}, {"t": "deadline", "b": true}], [{"t": "candidatura di lavoro", "b": false}, {"t": "job application", "b": true}], [{"t": "colloquio", "b": false}, {"t": "job interview", "b": true}], [{"t": "stipendio", "b": false}, {"t": "salary", "b": true}]]}], "tip": false}, {"title": "Galateo: formale o informale?", "blocks": [{"type": "p", "html": "A differenza dell'italiano (tu/Lei), l'inglese moderno non distingue più formale e informale con un pronome diverso — «you» si usa sempre. La formalità si esprime invece attraverso il vocabolario, i modi verbali (would, could) e le formule di apertura/chiusura delle email.", "italic": false}, {"type": "list", "label": "Regole pratiche", "intro": null, "items": ["In un'email formale: apri con «Dear Mr./Ms. [Cognome]» e chiudi con «Best regards» o «Kind regards».", "In un contesto informale: «Hi [nome]» e «Best» o «Cheers» (soprattutto in UK) sono perfettamente accettabili.", "Usa «could you» o «would you mind» invece di un comando diretto per sembrare più educato."]}], "tip": false}, {"title": "Espressioni idiomatiche avanzate", "blocks": [{"type": "table", "headers": ["Significato", "Espressione"], "rows": [[{"t": "Costare un occhio della testa", "b": false}, {"t": "To cost an arm and a leg", "b": true}], [{"t": "Avere altro per la testa (essere distratto)", "b": false}, {"t": "To have your head in the clouds", "b": true}], [{"t": "Fare finta di niente", "b": false}, {"t": "To act as if nothing happened", "b": true}], [{"t": "Essere al verde", "b": false}, {"t": "To be broke", "b": true}], [{"t": "Mettersi nei guai", "b": false}, {"t": "To get into trouble", "b": true}], [{"t": "Rompere il ghiaccio", "b": false}, {"t": "To break the ice", "b": true}]]}], "tip": false}, {"title": "Dialoghi pratici avanzati", "blocks": [{"type": "p", "html": "Scenario: risolvere un problema in albergo.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Hello, there's a problem with my room, the air conditioning isn't working.", "trans": "Buongiorno, c'è un problema con la mia camera, l'aria condizionata non funziona."}, {"speaker": "Receptionist:", "orig": "I'm so sorry, I'll send someone right away. Would you like to change rooms in the meantime?", "trans": "Mi dispiace molto, manderò subito qualcuno. Vuole cambiare camera nel frattempo?"}, {"speaker": "Guest:", "orig": "Yes, that would be easier, thank you.", "trans": "Sì, sarebbe più semplice, grazie."}]}, {"type": "p", "html": "Scenario: dal medico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "What seems to be the problem?", "trans": "Cosa non va?"}, {"speaker": "Patient:", "orig": "I've had a sore throat for three days and I have a slight fever.", "trans": "Ho mal di gola da tre giorni e ho un po' di febbre."}, {"speaker": "Doctor:", "orig": "I'll prescribe you some medicine. Get plenty of rest.", "trans": "Le prescriverò dei medicinali. Riposi molto."}]}], "tip": false}, {"title": "Conclusione e prossimi passi verso la scioltezza", "blocks": [{"type": "list", "label": "Come continuare a progredire", "intro": null, "items": ["Guarda serie e film in inglese con sottotitoli in inglese, non in italiano, per abituare l'orecchio.", "Leggi ogni giorno un breve articolo di un giornale inglese online (BBC, The Guardian).", "Trova un partner linguistico per fare scambi di conversazione (tandem).", "Scrivi un diario giornaliero di poche frasi in inglese.", "Non temere gli errori: la scioltezza vera nasce dalla pratica costante, non dalla perfezione grammaticale."]}], "tip": true}], "closingBasic": "Congratulazioni in anticipo per il tuo viaggio nell'inglese — Good luck! (buona fortuna!)", "closingAdvanced": "Complimenti per il percorso fatto finora — continua così, la vera scioltezza è più vicina di quanto pensi! Good luck!"}, "fr": {"chapters": [{"title": "Introduction : pourquoi apprendre l'anglais ?", "blocks": [{"type": "p", "html": "L'anglais est la langue la plus parlée au monde comme seconde langue, officielle dans plus de 50 pays, et c'est la langue des affaires, des sciences et d'Internet. Ce livre te donne une base solide en anglais standard, avec quelques notes sur les différences entre prononciation britannique et américaine.", "italic": false}, {"type": "p", "html": "La bonne nouvelle : la grammaire anglaise est plus simple que la française — pas de genre grammatical pour les objets, des conjugaisons bien plus régulières. La principale difficulté est la prononciation, souvent très éloignée de l'écriture, et des sons vocaliques qui n'existent pas en français.", "italic": false}, {"type": "list", "label": "Objectifs de ce livre", "intro": null, "items": ["Te donner une base solide de vocabulaire et de grammaire essentielle en un minimum de temps.", "Te concentrer sur une prononciation correcte pour que ton accent soit clair et naturel.", "Te donner des phrases pratiques utilisables dès le premier jour dans des situations réelles."]}], "tip": false}, {"title": "L'alphabet et les bases de la prononciation", "blocks": [{"type": "p", "html": "L'anglais utilise l'alphabet latin, mais la prononciation d'un mot ne correspond souvent pas du tout à son écriture — contrairement au français où les règles restent plus prévisibles. Ce tableau présente quelques sons distinctifs :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Mot"], "rows": [[{"t": "maison", "b": false}, {"t": "haouss", "b": false}, {"t": "house", "b": true}], [{"t": "bonjour/salut", "b": false}, {"t": "hallôou", "b": false}, {"t": "hello (le h est toujours aspiré, jamais muet comme en français)", "b": true}], [{"t": "merci", "b": false}, {"t": "senk-iou", "b": false}, {"t": "thank you (th = son interdental qui n'existe pas en français)", "b": true}], [{"t": "chat", "b": false}, {"t": "cat", "b": false}, {"t": "cat", "b": true}], [{"t": "je", "b": false}, {"t": "aï", "b": false}, {"t": "I (s'écrit toujours avec une majuscule !)", "b": true}], [{"t": "garçon", "b": false}, {"t": "boï", "b": false}, {"t": "boy", "b": true}], [{"t": "eau", "b": false}, {"t": "ouôteur", "b": false}, {"t": "water (le w = son labial très différent du v français)", "b": true}], [{"t": "œuf", "b": false}, {"t": "ègg", "b": false}, {"t": "egg", "b": true}], [{"t": "vin", "b": false}, {"t": "ouaïn", "b": false}, {"t": "wine", "b": true}], [{"t": "chaussure", "b": false}, {"t": "chou", "b": false}, {"t": "shoe (sh = son «ch» français)", "b": true}]]}], "tip": false}, {"title": "Les règles d'or pour une prononciation authentique", "blocks": [{"type": "p", "html": "Ces 6 règles d'or feront toute la différence pour un accent clair et naturel :", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["La lettre h se prononce toujours aspirée (house, hello) — jamais muette comme en français.", "Le groupe th a deux sons interdentaux (langue entre les dents) qui n'existent pas en français : un sourd (think) et un sonore (this) — à pratiquer devant un miroir.", "Le w se prononce avec les lèvres arrondies comme pour un baiser (water, we) — très différent du v ou du ou français.", "L'accent tonique en anglais change souvent le sens d'un mot et s'apprend mot par mot — il n'y a pas de règle fixe comme la dernière syllabe en français.", "Les voyelles anglaises ont beaucoup plus de sons que les voyelles françaises : la même lettre a peut sonner de façons complètement différentes (cat, cake, car).", "L'anglais britannique et américain diffèrent surtout sur le r (toujours prononcé en américain, souvent muet en fin de mot en britannique) et certaines voyelles."]}], "tip": false}, {"title": "Salutations et phrases essentielles", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Anglais"], "rows": [[{"t": "Bonjour (formel)", "b": false}, {"t": "goud môrning", "b": false}, {"t": "Good morning", "b": true}], [{"t": "Bonsoir", "b": false}, {"t": "goud ivning", "b": false}, {"t": "Good evening", "b": true}], [{"t": "Salut (informel)", "b": false}, {"t": "hallôou / haï", "b": false}, {"t": "Hello / Hi", "b": true}], [{"t": "Comment ça va ?", "b": false}, {"t": "haou ar iou", "b": false}, {"t": "How are you?", "b": true}], [{"t": "Bien, merci", "b": false}, {"t": "aïm faïn, senk iou", "b": false}, {"t": "I'm fine, thank you", "b": true}], [{"t": "Enchanté", "b": false}, {"t": "naïss tou mit iou", "b": false}, {"t": "Nice to meet you", "b": true}], [{"t": "À bientôt", "b": false}, {"t": "si iou soun", "b": false}, {"t": "See you soon", "b": true}], [{"t": "À demain", "b": false}, {"t": "si iou toumôrôou", "b": false}, {"t": "See you tomorrow", "b": true}], [{"t": "Au revoir", "b": false}, {"t": "goudbaï", "b": false}, {"t": "Goodbye", "b": true}], [{"t": "S'il te plaît", "b": false}, {"t": "pliz", "b": false}, {"t": "Please", "b": true}], [{"t": "Merci", "b": false}, {"t": "senk iou", "b": false}, {"t": "Thank you", "b": true}], [{"t": "De rien", "b": false}, {"t": "ior ouèlkeum", "b": false}, {"t": "You're welcome", "b": true}], [{"t": "Pardon/Excusez-moi", "b": false}, {"t": "sôri / èxkiouz mi", "b": false}, {"t": "Sorry / Excuse me", "b": true}], [{"t": "Oui", "b": false}, {"t": "iès", "b": false}, {"t": "Yes", "b": true}], [{"t": "Non", "b": false}, {"t": "nôou", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "Les pronoms et le verbe «to be» (être)", "blocks": [{"type": "p", "html": "Comme le français, l'anglais n'a qu'un seul verbe pour «être» dans tous les sens — identité, état temporaire, position. Le grand avantage : la conjugaison est extrêmement simple, avec seulement trois formes différentes au présent.", "italic": false}, {"type": "h3", "text": "Pronoms"}, {"type": "table", "headers": ["Français", "Anglais"], "rows": [[{"t": "je", "b": false}, {"t": "I", "b": true}], [{"t": "tu/vous", "b": false}, {"t": "you", "b": true}], [{"t": "il/elle", "b": false}, {"t": "he / she", "b": true}], [{"t": "nous", "b": false}, {"t": "we", "b": true}], [{"t": "vous", "b": false}, {"t": "you", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "they", "b": true}]]}, {"type": "h3", "text": "to be — être"}, {"type": "table", "headers": ["Pronom", "Conjugaison"], "rows": [[{"t": "I", "b": false}, {"t": "am", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "he/she", "b": false}, {"t": "is", "b": true}], [{"t": "we", "b": false}, {"t": "are", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "they", "b": false}, {"t": "are", "b": true}]]}, {"type": "p", "html": "Exemple : I am French — Je suis français. — I am in London — Je suis (en ce moment) à Londres. Remarque comment le même verbe couvre les deux situations, exactement comme «être» en français !", "italic": false}], "tip": false}, {"title": "Verbes courants et leur conjugaison", "blocks": [{"type": "p", "html": "Le grand avantage de l'anglais : au présent, la plupart des verbes n'ont que deux formes — la forme de base et celle avec -s pour la troisième personne du singulier (he/she/it).", "italic": false}, {"type": "table", "headers": ["Pronom", "to speak (parler)", "to work (travailler)"], "rows": [[{"t": "I", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "you", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}], [{"t": "we", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "you", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}]]}, {"type": "h3", "text": "Verbes irréguliers importants (formes «I»/«he»)"}, {"type": "table", "headers": ["Signification", "I", "he/she", "Verbe"], "rows": [[{"t": "avoir", "b": false}, {"t": "have", "b": false}, {"t": "has", "b": false}, {"t": "to have", "b": true}], [{"t": "aller", "b": false}, {"t": "go", "b": false}, {"t": "goes", "b": false}, {"t": "to go", "b": true}], [{"t": "faire", "b": false}, {"t": "do", "b": false}, {"t": "does", "b": false}, {"t": "to do", "b": true}], [{"t": "pouvoir", "b": false}, {"t": "can", "b": false}, {"t": "can", "b": false}, {"t": "can", "b": true}], [{"t": "vouloir", "b": false}, {"t": "want", "b": false}, {"t": "wants", "b": false}, {"t": "to want", "b": true}], [{"t": "savoir", "b": false}, {"t": "know", "b": false}, {"t": "knows", "b": false}, {"t": "to know", "b": true}]]}], "tip": false}, {"title": "Les nombres de 0 à 100", "blocks": [{"type": "table", "headers": ["Nº", "Anglais", "Nº", "Anglais"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "eleven", "b": true}], [{"t": "1", "b": false}, {"t": "one", "b": false}, {"t": "12", "b": false}, {"t": "twelve", "b": true}], [{"t": "2", "b": false}, {"t": "two", "b": false}, {"t": "13", "b": false}, {"t": "thirteen", "b": true}], [{"t": "3", "b": false}, {"t": "three", "b": false}, {"t": "14", "b": false}, {"t": "fourteen", "b": true}], [{"t": "4", "b": false}, {"t": "four", "b": false}, {"t": "15", "b": false}, {"t": "fifteen", "b": true}], [{"t": "5", "b": false}, {"t": "five", "b": false}, {"t": "16", "b": false}, {"t": "sixteen", "b": true}], [{"t": "6", "b": false}, {"t": "six", "b": false}, {"t": "17", "b": false}, {"t": "seventeen", "b": true}], [{"t": "7", "b": false}, {"t": "seven", "b": false}, {"t": "18", "b": false}, {"t": "eighteen", "b": true}], [{"t": "8", "b": false}, {"t": "eight", "b": false}, {"t": "19", "b": false}, {"t": "nineteen", "b": true}], [{"t": "9", "b": false}, {"t": "nine", "b": false}, {"t": "20", "b": false}, {"t": "twenty", "b": true}], [{"t": "10", "b": false}, {"t": "ten", "b": false}, {"t": "30", "b": false}, {"t": "thirty", "b": true}]]}, {"type": "table", "headers": ["Nº", "Anglais", "Nº", "Anglais"], "rows": [[{"t": "40", "b": false}, {"t": "forty", "b": false}, {"t": "80", "b": false}, {"t": "eighty", "b": true}], [{"t": "50", "b": false}, {"t": "fifty", "b": false}, {"t": "90", "b": false}, {"t": "ninety", "b": true}], [{"t": "60", "b": false}, {"t": "sixty", "b": false}, {"t": "100", "b": false}, {"t": "one hundred", "b": true}], [{"t": "70", "b": false}, {"t": "seventy", "b": false}, {"t": "", "b": false}, {"t": "", "b": true}]]}, {"type": "p", "html": "Bonne nouvelle : contrairement au français, l'anglais a un mot simple pour chaque dizaine (seventy, eighty, ninety) — aucun piège comme «soixante-dix» ou «quatre-vingts» !", "italic": true}], "tip": false}, {"title": "Les jours de la semaine et les mois", "blocks": [{"type": "table", "headers": ["Jour", "Anglais"], "rows": [[{"t": "lundi", "b": false}, {"t": "Monday", "b": true}], [{"t": "mardi", "b": false}, {"t": "Tuesday", "b": true}], [{"t": "mercredi", "b": false}, {"t": "Wednesday", "b": true}], [{"t": "jeudi", "b": false}, {"t": "Thursday", "b": true}], [{"t": "vendredi", "b": false}, {"t": "Friday", "b": true}], [{"t": "samedi", "b": false}, {"t": "Saturday", "b": true}], [{"t": "dimanche", "b": false}, {"t": "Sunday", "b": true}]]}, {"type": "h3", "text": "Mois"}, {"type": "table", "headers": ["Mois", "Anglais", "Mois", "Anglais"], "rows": [[{"t": "janvier", "b": false}, {"t": "January", "b": false}, {"t": "juillet", "b": false}, {"t": "July", "b": true}], [{"t": "février", "b": false}, {"t": "February", "b": false}, {"t": "août", "b": false}, {"t": "August", "b": true}], [{"t": "mars", "b": false}, {"t": "March", "b": false}, {"t": "septembre", "b": false}, {"t": "September", "b": true}], [{"t": "avril", "b": false}, {"t": "April", "b": false}, {"t": "octobre", "b": false}, {"t": "October", "b": true}], [{"t": "mai", "b": false}, {"t": "May", "b": false}, {"t": "novembre", "b": false}, {"t": "November", "b": true}], [{"t": "juin", "b": false}, {"t": "June", "b": false}, {"t": "décembre", "b": false}, {"t": "December", "b": true}]]}, {"type": "p", "html": "Attention : en anglais, les jours de la semaine et les mois prennent toujours une majuscule — contrairement au français !", "italic": true}], "tip": false}, {"title": "Les couleurs", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Anglais"], "rows": [[{"t": "rouge", "b": false}, {"t": "rèd", "b": false}, {"t": "red", "b": true}], [{"t": "bleu", "b": false}, {"t": "blou", "b": false}, {"t": "blue", "b": true}], [{"t": "vert", "b": false}, {"t": "grine", "b": false}, {"t": "green", "b": true}], [{"t": "jaune", "b": false}, {"t": "iélôou", "b": false}, {"t": "yellow", "b": true}], [{"t": "noir", "b": false}, {"t": "blèk", "b": false} "b": false}, {"t": "ouôteur", "b": false}, {"t": "water", "b": true}], [{"t": "café", "b": false}, {"t": "côfi", "b": false}, {"t": "coffee", "b": true}], [{"t": "thé", "b": false}, {"t": "ti", "b": false}, {"t": "tea", "b": true}], [{"t": "viande", "b": false}, {"t": "mite", "b": false}, {"t": "meat", "b": true}], [{"t": "poulet", "b": false}, {"t": "tchikeun", "b": false}, {"t": "chicken", "b": true}], [{"t": "poisson", "b": false}, {"t": "fich", "b": false}, {"t": "fish", "b": true}], [{"t": "fromage", "b": false}, {"t": "tchiz", "b": false}, {"t": "cheese", "b": true}], [{"t": "fruit", "b": false}, {"t": "froute", "b": false}, {"t": "fruit", "b": true}], [{"t": "légumes", "b": false}, {"t": "vèdjteubelz", "b": false}, {"t": "vegetables", "b": true}], [{"t": "dessert", "b": false}, {"t": "dizeurt", "b": false}, {"t": "dessert", "b": true}], [{"t": "petit-déjeuner", "b": false}, {"t": "brèkfeust", "b": false}, {"t": "breakfast", "b": true}], [{"t": "déjeuner", "b": false}, {"t": "leunntch", "b": false}, {"t": "lunch", "b": true}], [{"t": "dîner", "b": false}, {"t": "dineur", "b": false}, {"t": "dinner", "b": true}]]}], "tip": false}, {"title": "Phrases essentielles pour voyager et à l'hôtel", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Anglais"], "rows": [[{"t": "Où est...?", "b": false}, {"t": "ouère iz", "b": false}, {"t": "Where is...?", "b": true}], [{"t": "Combien ça coûte ?", "b": false}, {"t": "haou meutch iz it", "b": false}, {"t": "How much is it?", "b": true}], [{"t": "Puis-je voir le menu ?", "b": false}, {"t": "keun aï si de mènou", "b": false}, {"t": "Can I see the menu?", "b": true}], [{"t": "L'addition, s'il vous plaît", "b": false}, {"t": "de bil, pliz", "b": false}, {"t": "The bill, please", "b": true}], [{"t": "Où sont les toilettes ?", "b": false}, {"t": "ouère iz de toïlet", "b": false}, {"t": "Where is the toilet?", "b": true}], [{"t": "J'ai besoin d'aide", "b": false}, {"t": "aï nid help", "b": false}, {"t": "I , "b": true}]]}], "tip": false}, {"title": "Dialogue pratique complet", "blocks": [{"type": "p", "html": "Un dialogue simple dans un café — lis-le à voix haute plusieurs fois et essaie d'imiter la prononciation :", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Serveur :", "orig": "Hello! Welcome. What would you like?", "trans": "Bonjour ! Bienvenue. Que désirez-vous ?"}, {"speaker": "Client :", "orig": "Hi! I'd like a coffee, please.", "trans": "Bonjour ! Je voudrais un café, s'il vous plaît."}, {"speaker": "Serveur :", "orig": "Is that all?", "trans": "Ce sera tout ?"}, {"speaker": "Client :", "orig": "Yes, and the bill, please.", "trans": "Oui, et l'addition, s'il vous plaît."}, {"speaker": "Serveur :", "orig": "That's two euros. Thanks!", "trans": "Ça fait deux euros. Merci !"}, {"speaker": "Client :", "orig": "You're welcome, see you soon!", "trans": "De rien, à bientôt !"}]}], "tip": false}, {"title": "Plan d'action : comment apprendre vite", "blocks": [{"type": "list", "label": "7 étapes pour progresser rapidement", "intro": null, "items": ["Écoute des podcasts et regarde des séries en anglais chaque jour, même 10 minutes — l'oreille s'habitue avant l'esprit.", "Pratique le « shadowing » : écoute une phrase courte et répète-la immédiatement au même rythme.", "Entraîne les sons th et w devant un miroir — ce sont les plus grands défis pour un francophone.", "Ne traduis pas dans ta tête — essaie de penser directement en anglais.", "Utilise une application comme Duolingo ou Babbel en complément de ce livre pour renforcer le vocabulaire.", "Parle dès le premier jour, même en faisant des erreurs — la fluidité vient de la pratique, pas de la mémorisation.", "Regarde des films et séries d'abord avec des sous-titres en anglais, puis sans — c'est le moyen le plus rapide d'habituer ton oreille."]}], "tip": true}, {"title": "Introduction : pour qui est ce livre ?", "blocks": [{"type": "p", "html": "Ce livre est la suite de «Apprendre l'Anglais — Facile, Amusant et Rapide», qui couvrait les bases. Si tu as déjà terminé le niveau de base et veux atteindre un niveau qui te permette vraiment de te débrouiller en voyage, au travail et dans la vie quotidienne, ce livre va te donner : les temps verbaux dont tu as besoin, du vocabulaire pratique pour des situations réelles, et des dialogues réalistes.", "italic": false}, {"type": "list", "label": "Avant de commencer", "intro": null, "items": ["Tu devrais déjà connaître : les salutations, les pronoms, le verbe to be, la conjugaison au présent, et les nombres — tout cela est dans le livre de base.", "Notre objectif ici n'est pas de tout t'enseigner sur la langue, mais de te donner assez d'outils pour te débrouiller seul dans n'importe quelle situation.", "Prends ton temps dans chaque chapitre, et entraîne-toi à voix haute sur les exemples avant de passer au suivant."]}], "tip": false, "dividerBefore": true}, {"title": "Révision rapide du niveau de base", "blocks": [{"type": "table", "headers": ["I", "you", "he/she", "we", "you/they"], "rows": [[{"t": "je", "b": false}, {"t": "tu", "b": false}, {"t": "il/elle", "b": false}, {"t": "nous", "b": false}, {"t": "vous/ils", "b": true}]]}, {"type": "h3", "text": "Présent — les schémas réguliers"}, {"type": "table", "headers": ["Pronom", "to speak", "to work"], "rows": [[{"t": "I/you/we/they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}]]}], "tip": false}, {"title": "Le passé : Past Simple et Past Continuous", "blocks": [{"type": "p", "html": "L'anglais, comme le français, distingue une action ponctuelle et achevée dans le passé (Past Simple, proche du passé composé) d'une action en cours à un moment du passé (Past Continuous). Le Past Simple des verbes réguliers se forme avec -ed :", "italic": false}, {"type": "table", "headers": ["Verbe", "Past Simple", "Exemple"], "rows": [[{"t": "to work", "b": false}, {"t": "worked", "b": false}, {"t": "I worked yesterday — J'ai travaillé hier", "b": true}], [{"t": "to play", "b": false}, {"t": "played", "b": false}, {"t": "She played tennis — Elle a joué au tennis", "b": true}]]}, {"type": "p", "html": "Attention : de nombreux verbes courants sont irréguliers et doivent être mémorisés séparément : go → went, have → had, see → saw, do → did, come → came.", "italic": false}, {"type": "h3", "text": "Le Past Continuous"}, {"type": "table", "headers": ["Pronom", "was/were + -ing"], "rows": [[{"t": "I/he/she", "b": false}, {"t": "was working", "b": true}], [{"t": "you/we/they", "b": false}, {"t": "were working", "b": true}]]}, {"type": "p", "html": "Exemple : I was watching TV when you called — Je regardais la télé quand tu as appelé (action en cours interrompue par une autre).", "italic": false}], "tip": false}, {"title": "Le Present Perfect et sa différence avec le passé", "blocks": [{"type": "p", "html": "Le Present Perfect (have/has + participe passé) est l'un des concepts les plus difficiles pour un francophone, car il ne correspond pas exactement à notre passé composé. Il s'utilise pour une action passée liée au présent, sans moment précis :", "italic": false}, {"type": "table", "headers": ["Usage", "Exemple", "Traduction"], "rows": [[{"t": "Expérience de vie (sans temps précis)", "b": false}, {"t": "I have visited Paris", "b": false}, {"t": "J'ai visité Paris (une fois, peu importe quand)", "b": true}], [{"t": "Action passée avec un temps précis → Past Simple", "b": false}, {"t": "I visited Paris in 2019", "b": false}, {"t": "J'ai visité Paris en 2019", "b": true}], [{"t": "Action commencée dans le passé et toujours en cours", "b": false}, {"t": "I have lived here for 5 years", "b": false}, {"t": "J'habite ici depuis 5 ans", "b": true}]]}, {"type": "p", "html": "Règle pratique : s'il y a un moment précis dans la phrase (yesterday, in 2019, last week), utilise toujours le Past Simple, jamais le Present Perfect — une erreur très fréquente chez les francophones.", "italic": false}], "tip": false}, {"title": "Le futur : will, going to et le présent continu", "blocks": [{"type": "table", "headers": ["Usage", "Formation", "Exemple"], "rows": [[{"t": "Prédiction/décision spontanée", "b": false}, {"t": "will + infinitif", "b": false}, {"t": "I will call you tomorrow — Je t'appellerai demain", "b": true}], [{"t": "Intention/plan déjà décidé", "b": false}, {"t": "going to + infinitif", "b": false}, {"t": "I'm going to visit Rome — Je vais visiter Rome", "b": true}], [{"t": "Programme fixé (avec horaire)", "b": false}, {"t": "présent continu", "b": false}, {"t": "I'm flying to London on Monday — Je m'envole pour Londres lundi", "b": true}]]}], "tip": false}, {"title": "Les verbes modaux et leur nuance", "blocks": [{"type": "table", "headers": ["Verbe modal", "Signification", "Exemple"], "rows": [[{"t": "can", "b": false}, {"t": "pouvoir (capacité)", "b": false}, {"t": "I can swim — Je sais nager", "b": true}], [{"t": "could", "b": false}, {"t": "pouvoir (passé/politesse)", "b": false}, {"t": "Could you help me? — Pourriez-vous m'aider ?", "b": true}], [{"t": "must", "b": false}, {"t": "devoir (obligation forte)", "b": false}, {"t": "You must wear a seatbelt — Tu dois mettre ta ceinture", "b": true}], [{"t": "should", "b": false}, {"t": "devrait (conseil)", "b": false}, {"t": "You should see a doctor — Tu devrais voir un médecin", "b": true}], [{"t": "might", "b": false}, {"t": "pourrait (possibilité)", "b": false}, {"t": "It might rain — Il pourrait pleuvoir", "b": true}]]}], "tip": false}, {"title": "Prépositions et phrasal verbs", "blocks": [{"type": "p", "html": "Les phrasal verbs (verbe + préposition qui change complètement le sens) sont l'un des plus grands défis de l'anglais avancé — ils n'ont pas de véritable équivalent logique en français et doivent être appris par cœur :", "italic": false}, {"type": "table", "headers": ["Phrasal verb", "Signification"], "rows": [[{"t": "give up", "b": false}, {"t": "abandonner/renoncer", "b": true}], [{"t": "look for", "b": false}, {"t": "chercher", "b": true}], [{"t": "get on with", "b": false}, {"t": "bien s'entendre avec", "b": true}], [{"t": "run out of", "b": false}, {"t": "manquer de (quelque chose)", "b": true}], [{"t": "look forward to", "b": false}, {"t": "avoir hâte de", "b": true}], [{"t": "put off", "b": false}, {"t": "reporter", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : aéroport et douane", "blocks": [{"type": "table", "headers": ["Signification", "Anglais"], "rows": [[{"t": "carte d'embarquement", "b": false}, {"t": "boarding pass", "b": true}], [{"t": "bagage à main", "b": false}, {"t": "hand luggage / carry-on", "b": true}], [{"t": "retrait des bagages", "b": false}, {"t": "baggage claim", "b": true}], [{"t": "vol retardé", "b": false}, {"t": "delayed flight", "b": true}], [{"t": "douane", "b": false}, {"t": "customs", "b": true}], [{"t": "passeport", "b": false}, {"t": "passport", "b": true}], [{"t": "rien à déclarer", "b": false}, {"t": "nothing to declare", "b": true}], [{"t": "porte d'embarquement", "b": false}, {"t": "boarding gate", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : hôtel, santé et urgences", "blocks": [{"type": "table", "headers": ["Signification", "Anglais"], "rows": [[{"t": "Il n'y a pas d'eau chaude", "b": false}, {"t": "There's no hot water", "b": true}], [{"t": "La chambre n'est pas prête", "b": false}, {"t": "The room isn't ready", "b": true}], [{"t": "Je voudrais changer de chambre", "b": false}, {"t": "I would like to change rooms", "b": true}], [{"t": "pharmacie", "b": false}, {"t": "pharmacy", "b": true}], [{"t": "J'ai besoin d'un médecin", "b": false}, {"t": "I need a doctor", "b": true}], [{"t": "J'ai mal ici", "b": false}, {"t": "It hurts here", "b": true}], [{"t": "Appelez une ambulance !", "b": false}, {"t": "Call an ambulance!", "b": true}], [{"t": "hôpital", "b": false}, {"t": "hospital", "b": true}], [{"t": "assurance maladie", "b": false}, {"t": "health insurance ng room", "b": true}], [{"t": "réunion", "b": false}, {"t": "meeting", "b": true}], [{"t": "date limite", "b": false}, {"t": "deadline", "b": true}], [{"t": "candidature", "b": false}, {"t": "job application", "b": true}], [{"t": "entretien d'embauche", "b": false}, {"t": "job interview", "b": true}], [{"t": "salaire", "b": false}, {"t": "salary", "b": true}]]}], "tip": false}, {"title": "Étiquette : formel ou informel ?", "blocks": [{"type": "p", "html": "Contrairement au français (tu/vous), l'anglais moderne ne distingue plus le formel et l'informel par un pronom différent — «you» s'utilise toujours. La formalité s'exprime à travers le vocabulaire, les modaux (would, could) et les formules d'ouverture et de clôture des emails.", "italic": false}, {"type": "list", "label": "Règles pratiques", "intro": null, "items": ["Dans un email formel : ouvre avec «Dear Mr./Ms. [Nom]» et ferme avec «Best regards» ou «Kind regards».", "Dans un contexte informel : «Hi [prénom]» et «Best» ou «Cheers» (surtout au Royaume-Uni) sont parfaitement acceptables.", "Utilise «could you» ou «would you mind» plutôt qu'un ordre direct pour paraître plus poli."]}], "tip": false}, {"title": "Expressions idiomatiques avancées", "blocks": [{"type": "table", "headers": ["Signification", "Expression"], "rows": [[{"t": "Coûter les yeux de la tête", "b": false}, {"t": "To cost an arm and a leg", "b": true}], [{"t": "Avoir la tête dans les nuages", "b": false}, {"t": "To have your head in the clouds", "b": true}], [{"t": "Faire comme si de rien n'était", "b": false}, {"t": "To act as if nothing happened", "b": true}], [{"t": "Être fauché", "b": false}, {"t": "To be broke", "b": true}], [{"t": "Se mettre dans le pétrin", "b": false}, {"t": "To get into trouble", "b": true}], [{"t": "Briser la glace", "b": false}, {"t": "To break the ice", "b": true}]]}], "tip": false}, {"title": "Dialogues pratiques avancés", "blocks": [{"type": "p", "html": "Scénario : résoudre un problème à l'hôtel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Client :", "orig": "Hello, there's a problem with my room, the air conditioning isn't working.", "trans": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas."}, {"speaker": "Réceptionniste :", "orig": "I'm so sorry, I'll send someone right away. Would you like to change rooms in the meantime?", "trans": "Je suis vraiment désolée, j'envoie quelqu'un tout de suite. Voulez-vous changer de chambre en attendant ?"}, {"speaker": "Client :", "orig": "Yes, that would be easier, thank you.", "trans": "Oui, ce serait plus simple, merci."}]}, {"type": "p", "html": "Scénario : chez le médecin.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médecin :", "orig": "What seems to be the problem?", "trans": "Qu'est-ce qui ne va pas ?"}, {"speaker": "Patient :", "orig": "I've had a sore throat for three days and I have a slight fever.", "trans": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre."}, {"speaker": "Médecin :", "orig": "I'll prescribe you some medicine. Get plenty of rest.", "trans": "Je vais vous prescrire des médicaments. Reposez-vous bien."}]}], "tip": false}, {"title": "Conclusion et prochaines étapes vers la fluidité", "blocks": [{"type": "list", "label": "Comment continuer à progresser", "intro": null, "items": ["Regarde des séries et des films en anglais avec des sous-titres en anglais, pas en français, pour habituer ton oreille.", "Lis chaque jour un court article d'un journal anglais en ligne (BBC, The Guardian).", "Trouve un partenaire linguistique pour faire des échanges de conversation (tandem).", "Écris un petit journal quotidien de quelques phrases en anglais.", "N'aie pas peur des erreurs : la vraie fluidité vient de la pratique constante, pas de la perfection grammaticale."]}], "tip": true}], "closingBasic": "Félicitations d'avance pour ton parcours en anglais — Good luck! (bonne chance !)", "closingAdvanced": "Bonne chance par avance pour ton parcours en anglais — continue comme ça, la vraie fluidité est plus proche que tu ne le penses ! Good luck!"}, "pt": {"chapters": [{"title": "Introdução: porque aprender inglês?", "blocks": [{"type": "p", "html": "O inglês é a língua mais falada como segunda língua no mundo, oficial em mais de 50 países, e é a língua dos negócios, da ciência e da Internet. Este livro dá-te uma base sólida no inglês padrão, com algumas notas sobre as diferenças entre a pronúncia britânica e a americana.", "italic": false}, {"type": "p", "html": "A boa notícia: a gramática inglesa é mais simples do que a portuguesa — não há géneros gramaticais para objetos, e as conjugações verbais são muito mais regulares. A principal dificuldade está na pronúncia, frequentemente distante da escrita, e em sons vocálicos que não existem em português.", "italic": false}, {"type": "list", "label": "Objetivos deste livro", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Concentrarmo-nos na pronúncia correta para que o teu sotaque soe compreensível e natural.", "Dar-te frases práticas para usares desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e as bases da pronúncia", "blocks": [{"type": "p", "html": "O inglês usa o alfabeto latino, mas a pronúncia de uma palavra frequentemente não corresponde nada à sua escrita — ao contrário do português, onde cada letra se lê quase sempre da mesma forma. Esta tabela apresenta alguns sons distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "haus", "b": false}, {"t": "house (o e final é mudo)", "b": true}], [{"t": "olá/bom dia", "b": false}, {"t": "rêlôu", "b": false}, {"t": "hello (o h aspira-se, não é mudo)", "b": true}], [{"t": "obrigado", "b": false}, {"t": "thenk iú", "b": false}, {"t": "thank you (th = som interdental que não existe em português)", "b": true}], [{"t": "gato", "b": false}, {"t": "cat", "b": false}, {"t": "cat", "b": true}], [{"t": "eu", "b": false}, {"t": "ai", "b": false}, {"t": "I (escreve-se sempre com uma letra maiúscula!)", "b": true}], [{"t": "rapaz", "b": false}, {"t": "bôi", "b": false}, {"t": "boy", "b": true}], [{"t": "água", "b": false}, {"t": "uóra", "b": false}, {"t": "water (o t entre vogais soa quase como um d leve no inglês americano)", "b": true}], [{"t": "ovo", "b": false}, {"t": "egue", "b": false}, {"t": "egg", "b": true}], [{"t": "vinho", "b": false}, {"t": "uain", "b": false}, {"t": "wine (w = som labial que não existe em português)", "b": true}], [{"t": "sapato", "b": false}, {"t": "chu", "b": false}, {"t": "shoe (sh = som «ch»)", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro fazem a maior diferença para um sotaque compreensível e natural:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["A letra h pronuncia-se sempre aspirada (house, hello) — nunca muda como às vezes em português.", "O grupo th tem dois sons interdentais (a língua entre os dentes) que não existem em português: um surdo (think) e um sonoro (this) — pratica-os ao espelho.", "O w pronuncia-se com os lábios arredondados como para dar um beijo (water, we) — muito diferente do v.", "O acento tónico em inglês muda frequentemente o significado da palavra e tem de ser aprendido palavra a palavra — não há uma regra fixa como em português.", "As vogais inglesas têm muitos mais sons do que as portuguesas: a mesma letra a pode soar de formas completamente diferentes (cat, cake, car).", "O inglês britânico e o americano diferem sobretudo no r (pronunciado sempre no americano, muitas vezes mudo no fim de palavra no britânico) e nalgumas vogais."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Inglês"], "rows": [[{"t": "Bom dia (formal)", "b": false}, {"t": "gud mórning", "b": false}, {"t": "Good morning", "b": true}], [{"t": "Boa noite (ao chegar)", "b": false}, {"t": "gud ívning", "b": false}, {"t": "Good evening", "b": true}], [{"t": "Olá (informal)", "b": false}, {"t": "rêlôu / rai", "b": false}, {"t": "Hello / Hi", "b": true}], [{"t": "Como estás?", "b": false}, {"t": "rau ar iú", "b": false}, {"t": "How are you?", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "aim fain, thenk iú", "b": false}, {"t": "I'm fine, thank you", "b": true}], [{"t": "Prazer em conhecer-te", "b": false}, {"t": "nais tu mit iú", "b": false}, {"t": "Nice to meet you", "b": true}], [{"t": "Até breve", "b": false}, {"t": "si iú sun", "b": false}, {"t": "See you soon", "b": true}], [{"t": "Até amanhã", "b": false}, {"t": "si iú tumórou", "b": false}, {"t": "See you tomorrow", "b": true}], [{"t": "Adeus", "b": false}, {"t": "gudbai", "b": false}, {"t": "Goodbye", "b": true}], [{"t": "Por favor", "b": false}, {"t": "plíz", "b": false}, {"t": "Please", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "thenk iú", "b": false}, {"t": "Thank you", "b": true}], [{"t": "De nada", "b": false}, {"t": "iór uélkam", "b": false}, {"t": "You're welcome", "b": true}], [{"t": "Desculpa", "b": false}, {"t": "sóri / ikscúz mi", "b": false}, {"t": "Sorry / Excuse me", "b": true}], [{"t": "Sim", "b": false}, {"t": "iés", "b": false}, {"t": "Yes", "b": true}], [{"t": "Não", "b": false}, {"t": "nôu", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "Os pronomes e o verbo «to be» (ser/estar)", "blocks": [{"type": "p", "html": "Ao contrário do português, o inglês não tem dois verbos separados para «ser» e «estar» — um único verbo, «to be», cobre a identidade, a descrição e o estado temporário ao mesmo tempo.", "italic": false}, {"type": "h3", "text": "Pronomes"}, {"type": "table", "headers": ["Português", "Inglês"], "rows": [[{"t": "eu", "b": false}, {"t": "I", "b": true}], [{"t": "tu", "b": false}, {"t": "you", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "he / she", "b": true}], [{"t": "nós", "b": false}, {"t": "we", "b": true}], [{"t": "vocês", "b": false}, {"t": "you", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "they", "b": true}]]}, {"type": "h3", "text": "to be — ser/estar"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "I", "b": false}, {"t": "am", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "he/she", "b": false}, {"t": "is", "b": true}], [{"t": "we", "b": false}, {"t": "are", "b": true}], [{"t": "you", "b": false}, {"t": "are", "b": true}], [{"t": "they", "b": false}, {"t": "are", "b": true}]]}, {"type": "p", "html": "Exemplo: I am Portuguese — Sou português. — I am in London — Estou (agora) em Londres. Repara como o mesmo verbo cobre as duas situações!", "italic": false}], "tip": false}, {"title": "Verbos comuns e a sua conjugação", "blocks": [{"type": "p", "html": "A grande vantagem do inglês: no presente, a maioria dos verbos tem apenas duas formas — a forma base e a forma com -s para a terceira pessoa do singular (he/she/it).", "italic": false}, {"type": "table", "headers": ["Pronome", "to speak (falar)", "to work (trabalhar)"], "rows": [[{"t": "I", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "you", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "he/she", "b": false}, {"t": "speaks", "b": false}, {"t": "works", "b": true}], [{"t": "we", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "you", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}], [{"t": "they", "b": false}, {"t": "speak", "b": false}, {"t": "work", "b": true}]]}, {"type": "h3", "text": "Verbos irregulares importantes (formas «I»/«he»)"}, {"type": "table", "headers": ["Significado", "I", "he/she", "Verbo"], "rows": [[{"t": "ter", "b": false}, {"t": "have", "b": false}, {"t": "has", "b": false}, {"t": "to have", "b": true}], [{"t": "ir", "b": false}, {"t": "go", "b": false}, {"t": "goes", "b": false}, {"t": "to go", "b": true}], [{"t": "fazer", "b": false}, {"t": "do", "b": false}, {"t": "does", "b": false}, {"t": "to do", "b": true}], [{"t": "poder", "b": false}, {"t": "can", "b": false}, {"t": "can", "b": false}, {"t": "can", "b": true}], [{"t": "querer", "b": false}, {"t": "want", "b": false}, {"t": "wants", "b": false}, {"t": "to want", "b": true}], [{"t": "saber", "b": false}, {"t": "know", "b": false}, {"t": "knows", "b": false}, {"t": "to know", "b": true}]]}], "tip": false}, {"title": "Os números de 0 a 100", "blocks": [{"type": "table", "headers": ["Nº", "Inglês", "Nº", "Inglês"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "eleven", "b": true}], [{"t": "1", "b": false}, {"t": "one", "b": false}, {"t": "12", "b": false}, {"t": "twelve", "b": true}], [{"t": "2", "b": false}, {"t": "two", "b": false}, {"t": "13", "b": false}, {"t": "thirteen", "b": true}], [{"t": "3", "b": false}, {"t": "three", "b": false}, {"t": "14", "b": false}, {"t": "fourteen", "b": true}], [{"t": "4", "b": false}, {"t": "four", "b": false}, {"t": "15", "b": false}, {"t": "fifteen", "b": true}], [{"t": "5", "b": false}, {"t": "five", "b": false}, {"t": "16", "b": false}, {"t": "sixteen", "b": true}], [{"t": "6", "b": false}, {"t": "six", "b": false}, {"t": "17", "b": false}, {"t": "seventeen", "b": true}], [{"t": "7", "b": false}, {"t": "seven", "b": false}, {"t": "18", "b": false}, {"t": "eighteen", "b": true}], [{"t": "8", "b": false}, {"t": "eight", "b": false}, {"t": "19", "b": false}, {"t": "nineteen", "b": true}], [{"t": "9", "b": false}, {"t": "nine", "b": false}, {"t": "20", "b": false}, {"t": "twenty", "b": true}], [{"t": "10", "b": false}, {"t": "ten", "b": false}, {"t": "30", "b": false}, {"t": "thirty", "b": true}]]}, {"type": "table", "headers": ["Nº", "Inglês", "Nº", "Inglês"], "rows": [[{"t": "40", "b": false}, {"t": "forty", "b": false}, {"t": "80", "b": fal
