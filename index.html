<style>
  :root{
    --brand-blue:#0365A3;
    --brand-blue-dark:#023152;
    --brand-orange:#F1560B;
    --brand-orange-dark:#C7430A;
    --ink:#0B2036;
    --paper:#FFF9F1;
    --paper-card:#FFFFFF;
    --line:#E4D9C8;
    --whatsapp:#25D366;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    overflow-x:hidden;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;}

  /* ===== NAV ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,249,241,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;}
  .brand img{height:44px;width:auto;}
  .nav-links{display:flex;gap:30px;font-weight:700;font-size:16px;}
  .nav-links a{opacity:0.85;position:relative;transition:opacity .2s,color .2s,transform .2s;}
  .nav-links a::after{content:"";position:absolute;inset-inline:0;bottom:-8px;height:2px;background:var(--brand-orange);transform:scaleX(0);transform-origin:center;transition:transform .2s;}\n  .nav-links a:hover{opacity:1;color:var(--brand-blue);transform:translateY(-1px);}.nav-links a:hover::after{transform:scaleX(1);}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .lang-switch{display:flex;flex-wrap:nowrap;gap:3px;background:rgba(3,101,163,0.08);border-radius:999px;padding:4px;max-width:340px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;}
  .lang-switch::-webkit-scrollbar{display:none;}
  .lang-btn{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;
    border:none;color:var(--brand-blue);background:transparent;border-radius:999px;
    padding:6px 8px;cursor:pointer;transition:background .2s, color .2s;white-space:nowrap;
  }
  .lang-btn.active{background:var(--brand-blue);color:#fff;}
  .lang-btn:not(.active):hover{background:rgba(3,101,163,0.15);}
  .nav-cta{
    display:flex;align-items:center;gap:8px;
    background:var(--brand-orange);color:#fff;
    padding:10px 20px;border-radius:999px;
    font-weight:700;font-size:14px;
    box-shadow:0 4px 14px rgba(241,86,11,0.35);
    transition:transform .15s, box-shadow .15s;
    white-space:nowrap;
  }
  .nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(241,86,11,0.4);}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    background:linear-gradient(160deg, var(--brand-blue-dark) 0%, var(--brand-blue) 55%, #0483C9 100%);
    color:#fff;
    padding:90px 0 120px;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;z-index:1;
    background-image:
      radial-gradient(circle at 85% 20%, rgba(255,255,255,0.10) 0, transparent 40%),
      radial-gradient(circle at 10% 85%, rgba(241,86,11,0.22) 0, transparent 45%),
      linear-gradient(160deg, rgba(2,49,82,0.55) 0%, rgba(3,101,163,0.42) 55%, rgba(4,131,201,0.32) 100%);
  }
  .hero-inner{position:relative;z-index:3;display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;}

  /* خلفية متحركة بتلف بين خدماتنا: طيران، فنادق، نايل كروز، سي كروز */
  .hero-scenes{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .hero-scene{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity 1.8s ease;
  }
  .hero-scene.active{opacity:1;}
  .hero-scene img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transform:scale(1.06);
    transition:opacity 1.4s ease, transform 8s ease;
  }
  .hero-scene.active img{transform:scale(1.14);}
  .hero-scene img.loaded{opacity:0.62;}
  .hero-scene .scene-tint{position:absolute;inset:0;opacity:0.78;mix-blend-mode:multiply;}
  .hero-scene.has-photo .scene-tint{opacity:0.42;mix-blend-mode:normal;}
  .hero-scene .scene-icon{
    position:relative;font-size:200px;line-height:1;opacity:0.12;
    transform:scale(1);transition:opacity .6s ease, transform 7s ease;
  }
  .hero-scene.active .scene-icon{transform:scale(1.1);}
  .hero-scene.has-photo .scene-icon{opacity:0;}
  @media (prefers-reduced-motion: reduce){
    .hero-scene{transition:none;}
    .hero-scene img{transition:none;transform:none;}
    .hero-scene.active img{transform:none;}
    .hero-scene .scene-icon{transition:none;}
  }

  .floating-plane{
    position:absolute;z-index:2;font-size:26px;opacity:0.18;pointer-events:none;
    animation:fly-across 22s linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.3));
  }
  .floating-plane.p2{font-size:16px;opacity:0.12;animation-duration:30s;animation-delay:-10s;top:65%;}
  @keyframes fly-across{
    0%{transform:translate(-10%,20%) rotate(8deg);}
    50%{transform:translate(60%,-5%) rotate(4deg);}
    100%{transform:translate(120%,15%) rotate(8deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .floating-plane{animation:none;display:none;}
  }

  /* ظهور تدريجي للعناصر لما تنزل الصفحة */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.revealed{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;
    background:rgba(255,255,255,0.12);
    border:1px dashed rgba(255,255,255,0.5);
    padding:6px 14px;border-radius:999px;margin-bottom:22px;
  }
  .hero h1{font-size:44px;font-weight:900;line-height:1.35;margin-bottom:20px;}
  .hero h1 span{color:#FFD9B0;}
  .hero p{font-size:17px;opacity:0.92;max-width:520px;margin-bottom:34px;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:16px;}

  .ticket-btn{
    position:relative;
    display:flex;align-items:center;gap:12px;
    background:var(--brand-orange);
    color:#fff;font-weight:800;font-size:16px;
    padding:16px 26px;border-radius:12px;
    box-shadow:0 10px 28px rgba(0,0,0,0.25);
    transition:transform .15s;
  }
  .ticket-btn{transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;}\n  .ticket-btn:hover{transform:translateY(-4px) scale(1.01);filter:saturate(1.08);box-shadow:0 14px 30px rgba(0,0,0,.20);}
  .ticket-btn.outline{
    background:transparent;border:2px solid rgba(255,255,255,0.6);
    box-shadow:none;
  }

  .boarding-strip{
    margin-top:46px;
    background:rgba(255,255,255,0.08);
    border:1px dashed rgba(255,255,255,0.4);
    border-radius:14px;
    padding:18px 20px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .boarding-strip div{text-align:center;flex:1;min-width:90px;}
  .boarding-strip .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;color:#FFD9B0;}
  .boarding-strip .lbl{font-size:12px;opacity:0.85;margin-top:4px;}

  .hero-visual{
    position:relative;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:34px 26px;
    color:var(--ink);
    box-shadow:0 30px 60px rgba(0,0,0,0.3);
  }
  .hero-visual img{width:170px;margin:0 auto 14px;}
  .hero-visual .code{
    font-family:'IBM Plex Mono',monospace;text-align:center;font-size:13px;color:var(--brand-blue);
    letter-spacing:3px;margin-bottom:10px;
  }
  .hero-visual .barcode{
    height:34px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 7px, transparent 7px 11px, var(--ink) 11px 12px, transparent 12px 16px);
    margin-top:16px;opacity:0.85;
  }
  .perf{
    position:absolute;top:-12px;right:36px;width:24px;height:24px;background:var(--paper);border-radius:50%;
  }
  .perf.two{top:auto;bottom:-12px;left:36px;right:auto;}

  /* ===== SECTIONS ===== */
  section{padding:70px 0;}
  .section-head{text-align:center;max-width:640px;margin:0 auto 52px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--brand-orange);
    font-weight:600;display:block;margin-bottom:12px;
  }
  .section-head h2{font-size:36px;font-weight:900;color:var(--brand-blue-dark);margin-bottom:14px;}
  .section-head p{font-size:17px;color:#4B5A66;}

  /* رحلة العميل — Timeline بصري بأيقونات كبيرة وواضحة */
  .journey{background:linear-gradient(180deg,var(--paper) 0%,#FBF7EF 100%);padding:34px 0 26px;overflow:hidden;}
  .journey-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .journey-kicker{font:800 11px 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:var(--brand-orange);text-transform:uppercase;}
  .journey-note{font-size:12px;color:#73838F;font-weight:700;}
  .journey-shell{position:relative;padding:16px 6px 8px;}
  .journey-line{position:absolute;left:7%;right:7%;top:86px;height:4px;background:linear-gradient(90deg,#C9DDE8 0%,#9FC5D8 45%,#F1C09B 100%);border-radius:999px;opacity:.8;}
  .journey-line::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.85) 18px 28px);opacity:.75;}
  .journey-stops{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
  .journey-stop{text-align:center;}
  .journey-icon{
    width:104px;height:104px;margin:0 auto 12px;border-radius:28px;
    display:grid;place-items:center;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(3,101,163,.12);
    box-shadow:0 14px 30px rgba(11,32,54,.10);
    color:var(--brand-blue-dark);
    position:relative;
    transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;
  }
  .journey-stop:hover .journey-icon{transform:translateY(-7px) scale(1.04);box-shadow:0 22px 38px rgba(11,32,54,.15);border-color:rgba(3,101,163,.25);}
  .journey-icon svg{width:58px;height:58px;display:block;overflow:visible;}
  .journey-icon .accent{fill:var(--brand-orange);}
  .journey-icon .stroke{stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .journey-stop:nth-child(2) .journey-icon{color:#0C728F;}
  .journey-stop:nth-child(3) .journey-icon{color:#175A86;}
  .journey-stop:nth-child(4) .journey-icon{color:#C45118;}
  .journey-stop:nth-child(5) .journey-icon{color:#086B64;}
  .journey-label{
    display:block;font-size:16px;font-weight:900;color:var(--brand-blue-dark);
    line-height:1.3;
  }
  .journey-sub{display:block;margin-top:4px;font:700 10px 'IBM Plex Mono',monospace;color:#8A9BA8;letter-spacing:.4px;}
  .journey-traveler{
    position:absolute;top:56px;left:6.5%;z-index:4;
    width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;
    background:#fff;border:3px solid var(--brand-orange);
    box-shadow:0 10px 22px rgba(241,86,11,.24);
    offset-path:path("M 0 0 C 190 0 230 0 320 0 C 430 0 480 0 560 0 C 680 0 740 0 860 0 C 960 0 1030 0 1120 0");
    offset-distance:0%;
    animation:journey-drive 11s linear infinite;
    pointer-events:none;
  }
  .journey-traveler svg{width:28px;height:28px;fill:var(--brand-orange);transform:rotate(90deg);}
  @keyframes journey-drive{to{offset-distance:100%;}}
  @media (prefers-reduced-motion:reduce){.journey-traveler{animation:none;display:none;}}
  @media (max-width:700px){
    .journey{padding:22px 0 16px;}
    .journey-head{align-items:flex-start;flex-direction:column;gap:4px;}
    .journey-note{font-size:11px;}
    .journey-shell{overflow-x:auto;padding-bottom:14px;scrollbar-width:none;}
    .journey-shell::-webkit-scrollbar{display:none;}
    .journey-stops{min-width:820px;gap:14px;}
    .journey-line{left:55px;right:55px;top:76px;}
    .journey-icon{width:82px;height:82px;border-radius:23px;}
    .journey-icon svg{width:47px;height:47px;}
    .journey-label{font-size:13px;}
    .journey-sub{font-size:9px;}
    .journey-traveler{display:none;}
  }

  /* Services - ticket stub cards */
  .services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .ticket-card{
    position:relative;
    background:var(--paper-card);
    border-radius:18px;
    box-shadow:0 14px 32px rgba(11,32,54,0.09);
    overflow:hidden;
    transition:transform .28s ease,box-shadow .28s ease;
  }
  .ticket-card:hover{transform:translateY(-8px);box-shadow:0 24px 42px rgba(11,32,54,0.14);}
  .ticket-card .top{
    padding:22px 22px 20px;
    border-bottom:2px dashed var(--line);
    position:relative;
  }
  .service-media{position:relative;height:156px;overflow:hidden;background:linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue));}
  .service-media img{width:100%;height:100%;object-fit:cover;transition:transform .65s ease;}
  .ticket-card:hover .service-media img{transform:scale(1.08);}
  .service-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,49,82,.05),rgba(2,49,82,.65));}
  .service-icon-floating{position:absolute;z-index:2;inset-inline-start:18px;bottom:16px;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.92);box-shadow:0 10px 24px rgba(0,0,0,.18);backdrop-filter:blur(8px);}

  .icon-badge{
    width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg, var(--brand-orange), var(--brand-orange-dark));
    display:flex;align-items:center;justify-content:center;
    font-size:24px;margin-bottom:18px;
  }
  .ticket-card h3{font-size:21px;font-weight:900;color:var(--brand-blue-dark);margin-bottom:10px;}
  .ticket-card p{font-size:15.5px;color:#4B5A66;}
  .ticket-card .bottom{
    padding:18px 26px;display:flex;justify-content:space-between;align-items:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8A9BA8;letter-spacing:1px;
  }


  /* Language Academy teaser */
  .academy{background:linear-gradient(135deg,#F6FBFE 0%,#FFF9F1 100%);border-top:1px solid rgba(3,101,163,.08);border-bottom:1px solid rgba(3,101,163,.08);}
  .academy-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center;}
  .academy-visual{position:relative;display:grid;grid-template-columns:1.25fr .75fr;grid-template-rows:145px 145px;gap:12px;min-height:300px;}
  .academy-photo{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 18px 34px rgba(11,32,54,.12);border:1px solid rgba(3,101,163,.08);}
  .academy-photo.main{grid-row:1/3;}
  .academy-photo img{width:100%;height:100%;object-fit:cover;transition:transform .65s ease;}
  .academy-photo:hover img{transform:scale(1.07);}
  .academy-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(2,49,82,.5));}
  .academy-visual-badge{position:absolute;z-index:3;bottom:18px;inset-inline-start:18px;background:rgba(255,255,255,.94);border-radius:14px;padding:10px 13px;box-shadow:0 10px 22px rgba(11,32,54,.16);font:800 11px 'IBM Plex Mono',monospace;color:var(--brand-blue-dark);}
  .academy-copy .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.7px;color:var(--brand-orange);font-weight:700;display:block;margin-bottom:10px;}
  .academy-copy h2{font-size:31px;line-height:1.35;color:var(--brand-blue-dark);font-weight:900;margin-bottom:12px;}
  .academy-copy p{color:#4B5A66;font-size:15px;margin-bottom:20px;max-width:620px;}
  .academy-pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 22px;}
  .academy-pair{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:12px;font-weight:800;color:var(--brand-blue-dark);box-shadow:0 7px 18px rgba(11,32,54,.05);transition:transform .2s,box-shadow .2s;}
  .academy-pair:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(11,32,54,.09);}
  .academy-pair .arrow{color:var(--brand-orange);font-size:16px;}
  .academy-open{display:inline-flex;align-items:center;gap:9px;background:var(--brand-blue-dark);color:#fff;padding:13px 18px;border-radius:12px;font-weight:800;box-shadow:0 10px 20px rgba(2,49,82,.18);transition:transform .2s,box-shadow .2s;}
  .academy-open:hover{transform:translateY(-3px);box-shadow:0 16px 28px rgba(2,49,82,.23);}
  @media(max-width:900px){.academy-grid{grid-template-columns:1fr}.academy-visual{max-width:680px;margin:auto;width:100%;}}
  @media(max-width:700px){.journey-svg{height:150px}.services{grid-template-columns:1fr}.academy-copy h2{font-size:25px}.academy-pairs{grid-template-columns:1fr}.academy-visual{grid-template-rows:120px 120px;min-height:248px}}

  /* Destination finder */
  .destination-tools{
    display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;
    padding:16px;background:rgba(3,101,163,0.05);border:1px solid var(--line);
    border-radius:18px;margin:0 0 22px;
  }
  .destination-tools-main{display:flex;align-items:end;gap:10px;flex-wrap:wrap;flex:1;min-width:260px;}
  .destination-label{display:block;font-size:12px;font-weight:800;color:var(--brand-blue-dark);margin-bottom:7px;width:100%;}
  .destination-select{
    flex:1;min-width:210px;border:1px solid var(--line);border-radius:12px;background:#fff;
    color:var(--brand-blue-dark);font:700 14px 'Cairo',sans-serif;padding:12px 14px;outline:none;
    transition:border-color .2s, box-shadow .2s, transform .2s;
  }

<script>
(function(){
  var cfg = window.SITE_CONFIG;
  var currentLang = 'ar';

  function waLink(lang){
    var num = cfg.contact.whatsappNumberByLang[lang] || cfg.contact.whatsappNumberByLang.ar;
    var msg = cfg.contact.whatsappDefaultMessage[lang] || cfg.contact.whatsappDefaultMessage.ar;
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }

  // بيدور على النص بلغة الصفحة، ولو مش موجود يرجع للإنجليزي وبعدين العربي
  function pick(obj, field, lang){
    return obj[lang + '_' + field] || obj['en_' + field] || obj['ar_' + field] || '';
  }

  function parseStat(str){
    var raw = String(str == null ? '' : str).trim();
    var m = raw.match(/^(\d+(?:\.\d+)?)(.*)$/);
    if (!m) return { num: null, suffix: raw };
    return { num: parseFloat(m[1]), suffix: m[2] };
  }

  var selectedDestinationId = null;

  function localized(obj, lang){
    return obj[lang + '_name'] || obj.en_name || obj.ar_name || '';
  }

  function renderDestinationPicker(lang, t){
    var select=document.getElementById('destination-select');
    var label=document.getElementById('destination-label');
    var search=document.getElementById('destination-search');
    var bookBtn=document.getElementById('destination-book-btn');
    if(!select || !label || !search || !bookBtn) return;
    label.textContent=t.destinationFinder.label;
    search.placeholder=t.destinationFinder.search;
    bookBtn.title=t.destinationFinder.book;
    select.innerHTML='<option value="">'+t.destinationFinder.label+'</option>'+cfg.destinations.map(function(d){
      return '<option value="'+d.id+'">'+localized(d,lang)+'</option>';
    }).join('');
    if(selectedDestinationId && cfg.destinations.some(function(d){return d.id===selectedDestinationId;})){
      select.value=selectedDestinationId;
    }
    search.value=search.dataset.keepValue || '';
  }

  function waDestinationLink(destination, lang){
    var num=cfg.contact.whatsappNumberByLang[lang] || cfg.contact.whatsappNumberByLang.ar;
    var name=localized(destination,lang);
    var msgMap={
      ar:'مرحباً، عايز أحجز لـ '+name+' ✈️',
      en:"Hello, I'd like to book a trip to "+name+" ✈️",
      it:"Ciao, vorrei prenotare un viaggio a "+name+" ✈️",
      fr:"Bonjour, je voudrais réserver un voyage à "+name+" ✈️",
      pt:"Olá, gostaria de reservar uma viagem para "+name+" ✈️",
      ptbr:"Oi, eu queria reservar uma viagem para "+name+" ✈️"
    };
    return 'https://wa.me/'+num+'?text='+encodeURIComponent(msgMap[lang] || msgMap.en);
  }

  function selectDestination(id, shouldScroll){
    var d=cfg.destinations.find(function(x){return x.id===id;});
    if(!d) return;
    selectedDestinationId=id;
    var lang=document.documentElement.lang || 'ar';
    var t=cfg.i18n[lang] || cfg.i18n.ar;
    var select=document.getElementById('destination-select');
    if(select) select.value=id;
    document.querySelectorAll('.dest-card').forEach(function(card){
      card.classList.toggle('selected',card.getAttribute('data-destination-id')===id);
    });
    var picked=document.getElementById('destination-picked');
    if(picked){
      var name=localized(d,lang);
      picked.innerHTML='<div class="destination-picked-card"><div><span>'+t.destinationFinder.selected+'</span><br><strong>'+name+'</strong></div><button class="picked-action" type="button" data-book-picked>💬 '+t.destinationFinder.book+'</button></div>';
      picked.querySelector('[data-book-picked]').addEventListener('click',function(){ window.open(waDestinationLink(d,lang),'_blank'); });
    }
    if(shouldScroll){
      var card=document.querySelector('.dest-card[data-destination-id="'+id+'"]');
      if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
    }
  }

  function bindDestinationCards(){
    document.querySelectorAll('.dest-card').forEach(function(card){
      card.addEventListener('click',function(){ selectDestination(card.getAttribute('data-destination-id'),false); });
      card.addEventListener('dblclick',function(){
        var d=cfg.destinations.find(function(x){return x.id===card.getAttribute('data-destination-id');});
        if(d) window.open(waDestinationLink(d,document.documentElement.lang || 'ar'),'_blank');
      });
    });
    var select=document.getElementById('destination-select');
    var search=document.getElementById('destination-search');
    var book=document.getElementById('destination-book-btn');
    if(select && !select.dataset.bound){
      select.addEventListener('change',function(){ if(this.value) selectDestination(this.value,true); });
      select.dataset.bound='1';
    }
    if(book && !book.dataset.bound){
      book.addEventListener('click',function(){
        var d=cfg.destinations.find(function(x){return x.id===selectedDestinationId;});
        if(d) window.open(waDestinationLink(d,document.documentElement.lang || 'ar'),'_blank');
      });
      book.dataset.bound='1';
    }
    if(search && !search.dataset.bound){
      search.addEventListener('input',function(){
        search.dataset.keepValue=this.value;
        var q=this.value.trim().toLowerCase();
        document.querySelectorAll('.dest-card').forEach(function(card){
          var d=cfg.destinations.find(function(x){return x.id===card.getAttribute('data-destination-id');});
          var name=d ? localized(d,document.documentElement.lang || 'ar').toLowerCase() : '';
          card.style.display=!q || name.indexOf(q)!==-1 ? '' : 'none';
        });
      });
      search.dataset.bound='1';
    }
  }

  function animateCount(el){
    var target = Number(el.getAttribute('data-target'));
    var suffix = el.getAttribute('data-suffix') || '';
    if (!isFinite(target)) { el.textContent = suffix; return; }
    var duration = 1000, start = null;
    function step(ts){
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      var value = target >= 100 || Math.floor(target) === target ? Math.floor(progress * target) : Math.round(progress * target * 10) / 10;
      el.textContent = value + suffix;
      if (progress < 1) requestAnimationFrame(step);
      else el.textContent = target + suffix;
    }
    requestAnimationFrame(step);
  }

  // كاروسيل التوصيات: بيتحرك لوحده، وبرضو تقدر تسحبه بإيدك (بالماوس أو باللمس على الموبايل)
  function setupReviewsCarousel(track, reviewCount){
    var offset = 0;
    var isDragging = false;
    var isHovering = false;
    var startX = 0;
    var startOffset = 0;
    var lastTs = null;
    var duration = Math.max(30, reviewCount * 4); // ثواني للفة كاملة، زي القديم بالظبط
    var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame(ts){
      var halfWidth = track.scrollWidth / 2;
      if (!isDragging && !isHovering && !reducedMotion && halfWidth > 0) {
        if (lastTs !== null) {
          var dt = (ts - lastTs) / 1000;
          offset -= (halfWidth / duration) * dt;
        }
      }
      lastTs = ts;
      if (halfWidth > 0) {
        if (offset <= -halfWidth) offset += halfWidth;
        if (offset > 0) offset -= halfWidth;
      }
      track.style.transform = 'translateX(' + offset + 'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    track.addEventListener('pointerdown', function(e){
      isDragging = true;
      track.classList.add('dragging');
      startX = e.clientX;
      startOffset = offset;
      try { track.setPointerCapture(e.pointerId); } catch(err){}
    });
    track.addEventListener('pointermove', function(e){
      if (!isDragging) return;
      offset = startOffset + (e.clientX - startX);
    });
    function endDrag(){
      isDragging = false;
      track.classList.remove('dragging');
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);

    var viewport = track.closest('.reviews-viewport');
    if (viewport) {
      viewport.addEventListener('mouseenter', function(){ isHovering = true; });
      viewport.addEventListener('mouseleave', function(){ isHovering = false; });
    }
  }

  function setupPointerCards(){
    document.querySelectorAll('.pointer-card').forEach(function(card){
      if(card.dataset.pointerBound) return;
      card.addEventListener('pointermove',function(e){
        var r=card.getBoundingClientRect();
        card.style.setProperty('--spot-x',((e.clientX-r.left)/r.width*100)+'%');
        card.style.setProperty('--spot-y',((e.clientY-r.top)/r.height*100)+'%');
      });
      card.addEventListener('pointerleave',function(){
        card.style.setProperty('--spot-x','50%');
        card.style.setProperty('--spot-y','50%');
      });
      card.dataset.pointerBound='1';
    });
  }

  function setupRevealAndCounters(){
    var revealTargets = document.querySelectorAll(
      '.section-head, .ticket-card, .dest-card, .step, .why-item, .why-card, .faq-item, .review-card'
    );
    revealTargets.forEach(function(el){ el.classList.add('reveal'); });
    if ('IntersectionObserver' in window) {
      var revealObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      revealTargets.forEach(function(el){ revealObserver.observe(el); });

      var countEls = document.querySelectorAll('.stat-count');
      var countObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            animateCount(entry.target);
            countObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });
      countEls.forEach(function(el){ countObserver.observe(el); });
    } else {
      revealTargets.forEach(function(el){ el.classList.add('revealed'); });
    }
  }

  function render(lang){
    currentLang = lang;
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    var t = cfg.i18n[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    // روابط التواصل (بتتحدث برسالة واتساب باللغة الحالية)
    document.querySelectorAll('[data-wa]').forEach(function(el){ el.href = waLink(lang); });
    document.querySelectorAll('[data-fb]').forEach(function(el){ el.href = cfg.contact.facebook; });
    document.querySelectorAll('[data-phone]').forEach(function(el){ el.href = 'tel:' + cfg.contact.phoneDial; });
    document.querySelectorAll('[data-email]').forEach(function(el){ el.href = 'mailto:' + cfg.contact.email; });

    // Nav
    document.querySelector('[data-nav="services"]').textContent = t.nav.services;
    document.querySelector('[data-nav="destinations"]').textContent = t.nav.destinations;
    document.querySelector('[data-nav="reviews"]').textContent = t.nav.reviews;
    document.querySelector('[data-nav="how"]').textContent = t.nav.how;
    document.querySelector('[data-nav="faq"]').textContent = t.nav.faq;
    document.querySelector('[data-nav="blog"]').textContent = t.nav.blog;
    document.getElementById('nav-cta-text').innerHTML = '💬 ' + t.nav.cta;

    // Hero
    document.getElementById('hero-eyebrow').textContent = t.hero.eyebrow;
    document.getElementById('hero-title-1').textContent = t.hero.titleLine1;
    document.getElementById('hero-title-2').textContent = t.hero.titleHighlight;
    document.getElementById('hero-subtitle').textContent = t.hero.subtitle;
    document.getElementById('hero-cta-wa').innerHTML = '💬 ' + t.hero.ctaWa;
    document.getElementById('hero-cta-fb').textContent = t.hero.ctaFb;
    var stripIcons = ['✈', '🏨', '🎟', '🤝'];
    document.getElementById('hero-strip').innerHTML = t.hero.strip.map(function(label, i){
      return '<div><div class="num">' + stripIcons[i] + '</div><div class="lbl">' + label + '</div></div>';
    }).join('');

    t.journeyStops.forEach(function(label, i){
      var el = document.getElementById('journey-label-' + i);
      if (el) el.textContent = label;
    });

    // خلفية الـHero المتحركة (تتبنى مرة واحدة بس، مش لازم تتكرر مع تبديل اللغة)
    var scenesEl = document.getElementById('hero-scenes');
    if (!scenesEl.dataset.built) {
      scenesEl.innerHTML = cfg.heroScenes.map(function(s, i){
        return '<div class="hero-scene' + (i === 0 ? ' active' : '') + '">' +
                 '<div class="scene-tint" style="background:' + s.gradient + '"></div>' +
                 '<img src="' + s.image + '" alt="" ' +
                   'onload="this.classList.add(\'loaded\');this.closest(\'.hero-scene\').classList.add(\'has-photo\')" onerror="this.remove()">' +
                 '<span class="scene-icon">' + s.icon + '</span>' +
               '</div>';
      }).join('');
      scenesEl.dataset.built = '1';
      var sceneEls = scenesEl.querySelectorAll('.hero-scene');
      var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (sceneEls.length > 1 && !reducedMotion) {
        var currentScene = 0;
        setInterval(function(){
          sceneEls[currentScene].classList.remove('active');
          currentScene = (currentScene + 1) % sceneEls.length;
          sceneEls[currentScene].classList.add('active');
        }, 5000);
      }
    }

    // Services
    document.getElementById('services-tag').textContent = t.servicesHead.tag;
    document.getElementById('services-h2').textContent = t.servicesHead.h2;
    document.getElementById('services-p').textContent = t.servicesHead.p;
    document.getElementById('services-grid').innerHTML = cfg.services.map(function(s, idx){
      var title = pick(s, 'title', lang);
      var desc = pick(s, 'desc', lang);
      var cover = (cfg.heroScenes[idx] && cfg.heroScenes[idx].image) || (cfg.heroScenes[0] && cfg.heroScenes[0].image) || '';
      return '<div class="ticket-card pointer-card">' +
             '<div class="service-media"><img src="' + cover + '" alt="' + title + '" loading="lazy" decoding="async"><span class="service-icon-floating">' + s.icon + '</span></div>' +
             '<div class="top">' +
             '<h3>' + title + '</h3><p>' + desc + '</p></div>' +
             '<div class="bottom"><span>' + s.tag + '</span><span>✓</span></div></div>';
    }).join('');

    // Destinations
    document.getElementById('destinations-tag').textContent = t.destinationsHead.tag;
    document.getElementById('destinations-h2').textContent = t.destinationsHead.h2;
    document.getElementById('destinations-p').textContent = t.destinationsHead.p;
    renderDestinationPicker(lang, t);
    document.getElementById('destinations-grid').innerHTML = cfg.destinations.map(function(d){
      var name = pick(d, 'name', lang);
      var groupLabel = d.holy ? t.destinationGroups.holy : t.destinationGroups[d.group];
      var langLabel = d.language ? (' · ' + d.language.toUpperCase()) : '';
      return '<button type="button" class="dest-card pointer-card" data-destination-id="' + d.id + '" aria-label="' + name + '">' +
               '<div class="dest-img">' +
                 '<img src="' + d.image + '" alt="' + name + '" loading="lazy" decoding="async" onerror="this.parentElement.classList.add(\'no-img\')">' +
                 '<span class="dest-badge"><span>' + groupLabel + '</span>' + (d.language ? '<span class="dest-lang-badge">' + d.language.toUpperCase() + '</span>' : '') + '</span>' +
               '</div>' +
               '<div class="dest-name"><span>' + name + '</span><span class="dest-arrow">↗</span></div>' +
             '</button>';
    }).join('');
    bindDestinationCards();

    // Reviews
    document.getElementById('reviews-tag').textContent = t.reviewsHead.tag;
    document.getElementById('reviews-h2').textContent = t.reviewsHead.h2;
    document.getElementById('reviews-p').textContent = t.reviewsHead.p;
    document.getElementById('reviews-cta-text').textContent = t.reviewsCta;
    document.getElementById('reviews-fb-link').href = cfg.social.facebookReviewsUrl;

    var statsData = [
      { value: cfg.social.followers, label: t.statsLabels.followers },
      { value: cfg.social.totalReviews, label: t.statsLabels.reviews },
      { value: cfg.social.recommendPercent, label: t.statsLabels.recommend }
    ];
    document.getElementById('reviews-stats').innerHTML = statsData.map(function(s){
      var p = parseStat(s.value);
      var display = p.num === null ? p.suffix : (String(p.num) + p.suffix);
      return '<div class="stat-block"><div class="stat-num">' + display + '</div><div class="stat-lbl">' + s.label + '</div></div>';
    }).join('');

    var reviewsGridEl = document.getElementById('reviews-grid');
    if (!reviewsGridEl.dataset.built) {
      var reviewsHtml = cfg.reviews.map(function(r){
        var initial = r.name.trim().charAt(0).toUpperCase();
        return '<div class="review-card pointer-card">' +
                 '<div class="review-top">' +
                   '<div class="review-avatar">' + initial + '</div>' +
                   '<div class="review-name">' + r.name + '</div>' +
                 '</div>' +
                 '<div class="review-quote-mark">❝</div>' +
                 '<div class="review-text" dir="auto">' + r.text + '</div>' +
               '</div>';
      }).join('');
      reviewsGridEl.innerHTML = reviewsHtml + reviewsHtml;
      reviewsGridEl.dataset.built = '1';
      setupReviewsCarousel(reviewsGridEl, cfg.reviews.length);
    }

    // How it works
    document.getElementById('how-tag').textContent = t.howHead.tag;
    document.getElementById('how-h2').textContent = t.howHead.h2;
    document.getElementById('how-p').textContent = t.howHead.p;
    document.getElementById('steps-grid').innerHTML = cfg.steps.map(function(s){
      var title = pick(s, 'title', lang);
      var desc = pick(s, 'desc', lang);
      return '<div class="step pointer-card"><div class="n">' + s.n + '</div><h4>' + title + '</h4><p>' + desc + '</p></div>';
    }).join('');

    // Why us
    document.getElementById('why-tag').textContent = t.whyHead.tag;
    document.getElementById('why-h2').textContent = t.whyHead.h2;
    document.getElementById('why-list').innerHTML = cfg.why.map(function(w){
      var title = pick(w, 'title', lang);
      var desc = pick(w, 'desc', lang);
      return '<div class="why-item pointer-card"><div class="mark">' + w.mark + '</div>' +
             '<div><h4>' + title + '</h4><p>' + desc + '</p></div></div>';
    }).join('');
    var fq = pick(cfg.founderNote, 'quote', lang);
    var fa = pick(cfg.founderNote, 'attribution', lang);
    document.getElementById('founder-quote').textContent = '"' + fq + '"';
    document.getElementById('founder-who').textContent = '— ' + fa;

    // FAQ
    document.getElementById('faq-tag').textContent = t.faqHead.tag;
    document.getElementById('faq-h2').textContent = t.faqHead.h2;
    document.getElementById('faq-p').textContent = t.faqHead.p;
    document.getElementById('faq-list').innerHTML = cfg.faq.map(function(item){
      var q = pick(item, 'q', lang);
      var a = pick(item, 'a', lang);
      return '<details class="faq-item pointer-card"><summary>' + q + '</summary><div class="faq-a">' + a + '</div></details>';
    }).join('');

    // Contact
    document.getElementById('contact-h2').textContent = t.contactHead.h2;
    document.getElementById('contact-p').textContent = t.contactHead.p;
    document.getElementById('cbtn-wa').textContent = t.contactBtns.wa;
    document.getElementById('cbtn-fb').textContent = t.contactBtns.fb;
    document.getElementById('cbtn-ph').textContent = t.contactBtns.ph;
    document.getElementById('cbtn-em').textContent = t.contactBtns.em;

    // Footer
    document.getElementById('footer-brand-text').textContent = t.brand;
    document.getElementById('footer-fb-text').textContent = t.contactBtns.fb;
    document.getElementById('footer-wa-text').textContent = t.contactBtns.wa;
    document.getElementById('footer-email-text').textContent = cfg.contact.email;
    document.getElementById('footer-phone-text').textContent = cfg.contact.phoneDisplay;
    document.getElementById('footer-copyright').textContent = t.footerCopyright;

    // إعادة تفعيل تأثير الظهور التدريجي على أي عناصر اتبنت جديد
    setupPointerCards();
    if(selectedDestinationId) selectDestination(selectedDestinationId, false);
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      render(btn.getAttribute('data-lang'));
    });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(cfg.i18n[savedLang] ? savedLang : 'ar');
})();
</script>

      choose:'Com o que você precisa de ajuda?',book:'Ótimo — vou montar seu pedido de reserva passo a passo. Comece pelo serviço.',destination:'Escolha o destino ou digite o nome da cidade.',origin:'De qual cidade você vai sair? Pode digitar.',date:'Qual é a data da viagem? Exemplo: 20/12/2026',travelers:'Quantos viajantes? Digite o número.',nights:'Quantas noites você vai ficar?',eventDate:'Qual é a data do evento ou da visita?',summary:'Perfeito. Confira estes dados antes de enviar:',send:'Enviar pedido no WhatsApp',options:'Ações rápidas',placeholder:'Pergunte algo ou digite cidade/data...',back:'← Voltar',restart:'Começar de novo',destInfo:'Esse destino está disponível. Posso preparar a mensagem de reserva.',human:'💬 Falar com uma pessoa',learn:'🗣️ Aprender um idioma de viagem',destBtn:'🗺️ Destinos',faqBtn:'❓ FAQ',bookingBtn:'📅 Começar reserva',languageBtn:'🗣️ Academia de idiomas',price:'💰 Perguntar o preço',pay:'💳 Pagamento',cancel:'↩️ Cancelamento',name:'Nome',home:'🏠 Site'}
  };

  function lang(){return document.documentElement.lang||'ar'}
  function t(){return TXT[lang()]||TXT.en}
  function norm(s){
    return String(s||'').toLowerCase()
      .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^\p{L}\p{N}\s-]/gu,' ').replace(/\s+/g,' ').trim();
  }
  function localized(d){return d[lang()+'_name']||d.en_name||d.ar_name}
  function serviceLabel(id){
    var arr=SERVICES[lang()]||SERVICES.en;
    var x=arr.find(function(v){return v[0]===id});return x?x[1]:id
  }
  function addMsg(text,user,strong){
    var d=document.createElement('div');d.className='sara-msg'+(user?' user':'')+(strong?' strong':'');d.textContent=text;messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight
  }
  function typing(){
    var d=document.createElement('div');d.className='sara-typing';d.innerHTML='<i></i><i></i><i></i>';messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight;return d
  }
  function reply(text,actions,delay){
    var dot=typing();setTimeout(function(){if(dot&&dot.parentNode)dot.parentNode.removeChild(dot);addMsg(text,false);setOptions(actions||[]);},delay||320)
  }
  function setProgress(){
    var p={root:0,service:20,origin:40,dest:55,date:72,nights:82,travelers:88,summary:100};
    progressEl.style.width=(p[state.mode]||0)+'%'
  }
  function setOptions(items){
    optionsEl.innerHTML='';
    items.forEach(function(item){
      var b=document.createElement('button');b.type='button';b.className='sara-opt-btn'+(item.wa?' wa':'')+(item.wide?' wide':'');b.textContent=item.label;
      b.addEventListener('click',function(){handleAction(item)});optionsEl.appendChild(b)
    });
    optionsLabel.textContent=t().options;setProgress();
  }
  function chooseDirection(actions){
    setOptions(actions.concat([
      {label:t().learn,action:function(){window.location.href='language-academy.html';},wide:true},
      {label:t().human,wa:true,action:function(){window.open(makeSimpleWa(t().choose),'_blank');},wide:true}
    ]))
  }
  function root(){
    state={mode:'root',service:null,destination:null,origin:null,date:null,travelers:null,nights:null};history=[];
    addMsg(t().welcome,false,true);
    chooseDirection([
      {label:t().bookingBtn,action:startBooking},
      {label:t().destBtn,action:showDestinations},
      {label:t().faqBtn,action:showFaq},
      {label:t().price,action:priceHelp}
    ])
  }
  function startBooking(){
    state={mode:'service',service:null,destination:null,origin:null,date:null,travelers:null,nights:null};history=['root'];
    addMsg(t().book,false);
    setOptions((SERVICES[lang()]||SERVICES.en).map(function(s){return {label:s[1],action:function(){selectService(s[0],s[1])}}}).concat([{label:t().back,action:root,wid‌e:true}]));
  }
  function selectService(id,label){
    state.service=id;
    addMsg(label,true);
    history.push('service');
    if(id==='flight'||id==='package'){askOrigin()}
    else {askDestination()}
  }
  function askOrigin(){
    state.mode='origin';addMsg(t().origin,false);setOptions([{label:t().back,action:startBooking,wid‌e:true}]);focusInput()
  }
  function askDestination(){
    state.mode='dest';addMsg(t().destination,false);
    setOptions(destinationButtons([{label:t().back,action:startBooking,wid‌e:true}]));setProgress()
  }
  function destinationButtons(tail){
    var buttons=cfg.destinations.map(function(d){
      return {label:'📍 '+localized(d),action:function(){selectDestination(d.id)}}
    });
    return buttons.concat(tail||[])
  }
  function selectDestination(id){
    var d=cfg.destinations.find(function(x){return x.id===id});if(!d)return;
    state.destination=id;addMsg(localized(d),true);
    if(state.service==='hotel'){state.mode='date';reply(t().date,[{label:t().back,action:askDestination,wid‌e:true}])}
    else if(state.service==='event'){state.mode='date';reply(t().eventDate,[{label:t().back,action:askDestination,wid‌e:true}])}
    else {state.mode='date';reply(t().date,[{label:t().back,action:function(){askDestination()},wide:true}])}
  }
  function askTravelers(){
    state.mode='travelers';reply(t().travelers,[{label:t().back,action:function(){state.mode='date';addMsg(t().date,false);focusInput();},wide:true}]);focusInput()
  }
  function askNights(){
    state.mode='nights';reply(t().nights,[{label:t().back,action:function(){state.mode='date';addMsg(t().date,false);focusInput();},wide:true}]);focusInput()
  }
  function finishDate(raw){
    state.date=raw;
    if(state.service==='hotel'){askNights();return}
    askTravelers()
  }
  function finishNights(raw){
    state.nights=raw;askTravelers()
  }
  function finishTravelers(raw){
    var n=(String(raw).match(/\d+/)||[])[0];if(!n){reply(lang()==='de'?'Bitte gib eine Zahl ein.':'Please enter a number.',[],260);focusInput();return}
    state.travelers=n;showSummary()
  }
  function showSummary(){
    state.mode='summary';
    var d=cfg.destinations.find(function(x){return x.id===state.destination});
    var bits=[serviceLabel(state.service)];
    if(state.origin)bits.push((lang()==='ar'?'من ':'From ')+state.origin);
    bits.push(localized(d));bits.push((lang()==='ar'?'التاريخ: ':'Date: ')+state.date);
    if(state.nights)bits.push((lang()==='ar'?'الليالي: ':'Nights: ')+state.nights);
    bits.push((lang()==='ar'?'المسافرين: ':'Travelers: ')+state.travelers);
    addMsg(t().summary,false,true);addMsg(bits.join(' · '),false);
    setOptions([
      {label:'💬 '+t().send,wa:true,action:function(){window.open(buildBookingWa(),'_blank')},wide:true},
      {label:t().back,action:startBooking},
      {label:t().restart,action:root}
    ])
  }
  function buildBookingWa(){
    var l=lang(),d=cfg.destinations.find(function(x){return x.id===state.destination}),name=d?localized(d):state.destination||'',num=cfg.contact.whatsappNumberByLang[l]||cfg.contact.whatsappNumberByLang.ar;
    var svc=serviceLabel(state.service),parts={
      ar:'مرحباً، أريد طلب حجز عبر سارة:\\nالخدمة: '+svc+'\\nمن: '+(state.origin||'غير محدد')+'\\nالوجهة: '+name+'\\nالتاريخ: '+state.date+'\\n'+(state.nights?'الليالي: '+state.nights+'\\n':'')+'عدد المسافرين: '+state.travelers,
      en:'Hello, I would like to request a booking through Sara:\\nService: '+svc+'\\nFrom: '+(state.origin||'Not specified')+'\\nDestination: '+name+'\\nDate: '+state.date+'\\n'+(state.nights?'Nights: '+state.nights+'\\n':'')+'Travelers: '+state.travelers,
      de:'Hallo, ich möchte über Sara eine Buchungsanfrage senden:\\nLeistung: '+svc+'\\nAbflugort: '+(state.origin||'Nicht angegeben')+'\\nReiseziel: '+name+'\\nDatum: '+state.date+'\\n'+(state.nights?'Nächte: '+state.nights+'\\n':'')+'Reisende: '+state.travelers,
      it:'Ciao, vorrei richiedere una prenotazione tramite Sara:\\nServizio: '+svc+'\\nPartenza: '+(state.origin||'Non specificata')+'\\nDestinazione: '+name+'\\nData: '+state.date+'\\n'+(state.nights?'Notti: '+state.nights+'\\n':'')+'Viaggiatori: '+state.travelers,
      fr:'Bonjour, je souhaite demander une réservation via Sara :\\nService : '+svc+'\\nDépart : '+(state.origin||'Non précisé')+'\\nDestination : '+name+'\\nDate : '+state.date+'\\n'+(state.nights?'Nuits : '+state.nights+'\\n':'')+'Voyageurs : '+state.travelers,
      pt:'Olá, gostaria de solicitar uma reserva através da Sara:\\nServiço: '+svc+'\\nOrigem: '+(state.origin||'Não informado')+'\\nDestino: '+name+'\\nData: '+state.date+'\\n'+(state.nights?'Noites: '+state.nights+'\\n':'')+'Viajantes: '+state.travelers,
      ptbr:'Oi, eu queria solicitar uma reserva pela Sara:\\nServiço: '+svc+'\\nOrigem: '+(state.origin||'Não informado')+'\\nDestino: '+name+'\\nData: '+state.date+'\\n'+(state.nights?'Noites: '+state.nights+'\\n':'')+'Viajantes: '+state.travelers
    };
    return 'https://wa.me/'+num+'?text='+encodeURIComponent(parts[l]||parts.en)
  }
  function makeSimpleWa(text){
    var l=lang(),num=cfg.contact.whatsappNumberByLang[l]||cfg.contact.whatsappNumberByLang.ar;return 'https://wa.me/'+num+'?text='+encodeURIComponent(text)
  }
  function showDestinations(){
    state.mode='dest';addMsg(t().destBtn,true);reply(t().destination,destinationButtons([{label:t().back,action:root,wide:true}]),260)
  }
  function showFaq(){
    state.mode='faq';addMsg(t().faqBtn,true);reply(t().choose,[],220);
    var list=(cfg.faq||[]).slice(0,8).map(function(f){
      var q=f[lang()+'_q']||f.en_q||f.ar_q,a=f[lang()+'_a']||f.en_a||f.ar_a;
      return {label:'❓ '+q,action:function(){addMsg(q,true);reply(a,[{label:t().human,wa:true,action:function(){window.open(makeSimpleWa(q),'_blank')}},{label:t().back,action:showFaq}]);}}
    });
    setTimeout(function(){setOptions(list.concat([{label:t().back,action:root,wide:true}]));},240)
  }
  function priceHelp(){
    addMsg(t().price,true);
    var msg={ar:'السعر بيتحدد حسب الخدمة والتاريخ والوجهة. اختار الخدمة وسارة تجمع البيانات وتبعتها للفريق عشان يرجعلك بأفضل عرض متاح.',en:'Pricing depends on the service, date, and destination. Start a booking and Sara will collect the details needed for the available offer.',de:'Der Preis hängt von Leistung, Datum und Reiseziel ab. Starte eine Buchung, damit Sara die nötigen Angaben sammelt.',it:'Il prezzo dipende da servizio, data e destinazione. Inizia una prenotazione e Sara raccoglierà i dati necessari.',fr:'Le prix dépend du service, de la date et de la destination. Commencez une réservation et Sara recueillera les informations nécessaires.',pt:'O preço depende do serviço, data e destino. Comece uma reserva e a Sara recolherá os dados necessários.',ptbr:'O preço depende do serviço, data e destino. Comece uma reserva e a Sara vai coletar os dados necessários.'};
    reply(msg[lang()]||msg.en,[{label:t().bookingBtn,action:startBooking},{label:t().human,wa:true,action:function(){window.open(makeSimpleWa(msg[lang()]||msg.en),'_blank')}},{label:t().back,action:root}],360)
  }
  function findDestination(raw){
    var q=norm(raw);
    return cfg.destinations.find(function(d){
      return Object.keys(d).filter(function(k){return /_name$/.test(k)}).some(function(k){var n=norm(d[k]);return q===n||q.indexOf(n)!==-1||n.indexOf(q)!==-1;});
    })
  }
  function knowledge(raw){
    var q=norm(raw);
    var dest=findDestination(raw);
    if(dest)return {text:t().destInfo+' '+localized(dest),actions:[
      {label:'📅 '+t().bookingBtn,action:function(){state.service='package';state.destination=dest.id;state.mode='date';addMsg(localized(dest),true);reply(t().date,[{label:t().back,action:root,wid‌e:true}]);}},
      {label:'💬 '+t().send,wa:true,action:function(){window.open(waDestination(dest.id),'_blank')}}
    ]};
    var patterns=[
      {keys:['book','booking','reserve','reservation','حجز','احجز','حجزلي','prenot','reservation','reserv','buchen','buchung','reservierung'],action:startBooking},
      {keys:['learn','language','تعلم','لغه','لغة','apprendre','imparare','aprender','lernen','sprache'],action:function(){window.location.href='language-academy.html'}},
      {keys:['payment','pay','الدفع','ادفع','paiement','pagamento','pagamento','zahlung'],action:function(){jumpFaq('payment')}},
      {keys:['cancel','cancellation','الغاء','إلغاء','annulation','cancellazione','cancelamento','stornierung'],action:function(){jumpFaq('cancel')}},
      {keys:['price','cost','السعر','سعر','prix','prezzo','preco','preis'],action:priceHelp}
    ];
    for(var i=0;i<patterns.length;i++){if(patterns[i].keys.some(function(k){return q.indexOf(norm(k))!==-1;})){patterns[i].action();return null;}}
    return {text:{ar:'أقدر أفهم منك حاجات كتير، بس مش هخمن في تفاصيل سعر أو حجز. اختار حجز، وجهة، سؤال شائع، أو مدرسة اللغات.',en:"I can guide you, but I won't guess a live price or booking detail. Choose booking, a destination, an FAQ, or the Language Academy.",de:'Ich kann dich führen, aber keinen Live-Preis oder Buchungsdetails erfinden. Wähle Buchung, Reiseziel, FAQ oder Sprachakademie.',it:'Posso guidarti, ma non invento prezzi o dettagli di prenotazione. Scegli prenotazione, destinazione, FAQ o Academy.',fr:'Je peux vous guider, mais je n’inventerai pas un prix ou un détail de réservation. Choisissez réservation, destination, FAQ ou Académie.',pt:'Posso ajudar, mas não vou inventar preço ou detalhes de reserva. Escolha reserva, destino, FAQ ou academia.',ptbr:'Posso te guiar, mas não vou inventar preço ou detalhe de reserva. Escolha reserva, destino, FAQ ou academia.'}[lang()]||TXT.en};
  }
  function jumpFaq(kind){
    var f=(cfg.faq||[]).find(function(x){var q=norm((x[lang()+'_q']||x.en_q||x.ar_q));return kind==='payment'?q.indexOf(norm('pay'))!==-1||q.indexOf(norm('الدفع'))!==-1:q.indexOf(norm('cancel'))!==-1||q.indexOf(norm('إلغاء'))!==-1});
    if(f){var q=f[lang()+'_q']||f.en_q||f.ar_q,a=f[lang()+'_a']||f.en_a||f.ar_a;reply(q+'\n\n'+a,[{label:t().human,wa:true,action:function(){window.open(makeSimpleWa(q),'_blank')}},{label:t().back,action:root}],280)}
    else showFaq()
  }
  function waDestination(id){
    var d=cfg.destinations.find(function(x){return x.id===id}),name=d?localized(d):'',l=lang(),num=cfg.contact.whatsappNumberByLang[l]||cfg.contact.whatsappNumberByLang.ar;
    var msgs={ar:'مرحباً، أريد حجز '+name+' وأريد معرفة الأسعار والخيارات المتاحة.',en:"Hello, I'd like to book "+name+" and see the available prices and options.",de:'Hallo, ich möchte '+name+' buchen und die verfügbaren Preise und Optionen erfahren.',it:'Ciao, vorrei prenotare '+name+' e conoscere prezzi e opzioni disponibili.',fr:'Bonjour, je voudrais réserver '+name+' et connaître les prix et options disponibles.',pt:'Olá, gostaria de reservar '+name+' e ver preços e opções disponíveis.',ptbr:'Oi, eu queria reservar '+name+' e ver os preços e opções disponíveis.'};
    return 'https://wa.me/'+num+'?text='+encodeURIComponent(msgs[l]||msgs.en)
  }
  function handleAction(item){
    if(item.action){item.action();return}
    if(item.wa){window.open(makeSimpleWa(item.message||t().choose),'_blank')}
  }
  function handleText(){
    var raw=inputEl.value.trim();if(!raw)return;inputEl.value='';addMsg(raw,true);
    if(state.mode==='origin'){state.origin=raw;askDestination();return}
    if(state.mode==='dest'){
      var d=findDestination(raw);
      if(d){selectDestination(d.id);return}
      reply(t().destination,[{label:t().back,action:root,wid‌e:true}],220);return
    }
    if(state.mode==='date'){
      if(!/^\\s*\\d{1,2}[\\/.\\-]\\d{1,2}[\\/.\\-]\\d{2,4}\\s*$/.test(raw)){reply(lang()==='de'?'Nutze bitte z. B. 20.12.2026.':lang()==='ar'?'اكتب التاريخ مثل 20/12/2026.':'Please use a date like 20/12/2026.',[],240);focusInput();return}
      finishDate(raw);return
    }
    if(state.mode==='nights'){var n=(raw.match(/\\d+/)||[])[0];if(!n){reply(t().nights,[],220);focusInput();return}finishNights(n);return}
    if(state.mode==='travelers'){finishTravelers(raw);return}
    var ans=knowledge(raw);if(ans)reply(ans.text,ans.actions||[],320)
  }
  function focusInput(){setTimeout(function(){if(inputEl)inputEl.focus()},70)}
  function refresh(){
    var l=lang(),tt=t();document.getElementById('saraPanelStatus').textContent='● '+tt.online;inputEl.placeholder=tt.placeholder;
    document.getElementById('saraSend').setAttribute('aria-label',tt.placeholder);optionsLabel.textContent=tt.options
  }
  function resetAndRender(){
    messagesEl.innerHTML='';optionsEl.innerHTML='';state={mode:'root',service:null,destination:null,origin:null,date:null,travelers:null,nights:null};history=[];refresh();root()
  }
  function init(){
    fab=document.getElementById('saraFab');panel=document.getElementById('saraPanel');messagesEl=document.getElementById('saraMessages');optionsEl=document.getElementById('saraOptions');inputEl=document.getElementById('saraInput');sendEl=document.getElementById('saraSend');progressEl=document.getElementById('saraProgress');optionsLabel=document.getElementById('saraOptionsLabel');
    fab.addEventListener('click',function(){panel.classList.toggle('open');if(panel.classList.contains('open')&&!messagesEl.childNodes.length)root();refresh()});
    document.getElementById('saraClose').addEventListener('click',function(){panel.classList.remove('open')});
    document.getElementById('saraReset').addEventListener('click',resetAndRender);
    sendEl.addEventListener('click',handleText);inputEl.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();handleText()}});
    new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});refresh()
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()
})();
</script>
