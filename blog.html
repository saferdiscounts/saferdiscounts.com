  function pick(obj, field, lang){
    return obj[lang + '_' + field] || obj['en_' + field] || obj['ar_' + field] || '';
  }

  function cardHtml(post, lang, t){
    var title = pick(post, 'title', lang);
    var excerpt = pick(post, 'excerpt', lang);
    var catLabel = t.categories[post.category];
    var isSoon = post.status === 'soon';
    var isGuide = !!post.isFullGuide;
    var linkLabel = isSoon ? t.comingSoon : (isGuide ? t.readGuide : t.readMore);
    var href = isSoon ? 'javascript:void(0)' : post.url;
    return '<div class="blog-card' + (isSoon ? ' soon' : '') + '" data-cat="' + post.category + '">' +
             '<div class="blog-card-img">' +
               '<img src="' + post.image + '" alt="' + title + '" onerror="this.onerror=null;this.remove();this.parentElement.classList.add(\'img-fallback\')">' +
               '<span class="blog-card-cat">' + catLabel + '</span>' +
               (isSoon ? '<span class="blog-card-soon-badge">' + t.comingSoon + '</span>' : '') +
               (isGuide && !isSoon ? '<span class="blog-card-full-badge">📘 ' + t.fullGuide + '</span>' : '') +
             '</div>' +
             '<div class="blog-card-body">' +
               '<h3>' + title + '</h3>' +
               '<p>' + excerpt + '</p>' +
               '<div class="blog-card-author"><img src="' + cfg.sara.photo + '" alt="Sara"><span>' + t.byline + '</span></div>' +
               '<a class="blog-card-link" href="' + href + '">' + linkLabel + (isSoon ? '' : ' ←') + '</a>' +
             '</div>' +
           '</div>';
  }

  function renderGrid(lang, t){
    var grid = document.getElementById('blog-grid');
    var posts = cfg.posts.filter(function(p){
      if (p.targetLang && p.targetLang === lang) return false;
      return activeFilter === 'all' || p.category === activeFilter;
    });
    grid.innerHTML = posts.map(function(p){ return cardHtml(p, lang, t); }).join('');
  }

  function renderFilters(lang, t){
    var cats = ['all'].concat(Object.keys(t.categories));
    document.getElementById('blog-filters').innerHTML = cats.map(function(c){
      var label = c === 'all' ? (lang === 'ar' ? 'الكل' : (lang === 'it' ? 'Tutti' : (lang === 'fr' ? 'Tous' : (lang === 'pt' || lang === 'ptbr' ? 'Todos' : 'All')))) : t.categories[c];
      var active = c === activeFilter;
      return '<button type="button" class="blog-filter" data-cat="' + c + '" style="' +
             (active ? 'background:var(--brand-blue);color:#fff;' : '') + '">' + label + '</button>';
    }).join('');
    document.querySelectorAll('.blog-filter').forEach(function(btn){
      btn.addEventListener('click', function(){
        activeFilter = btn.getAttribute('data-cat');
        render(currentLang);
      });
    });
  }

  function render(lang){
    currentLang = lang;
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    var t = cfg.i18n[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    document.querySelectorAll('[data-wa]').forEach(function(el){ el.href = waLink(lang); });
    document.querySelectorAll('[data-fb]').forEach(function(el){ el.href = cfg.contact.facebook; });
    document.querySelectorAll('[data-phone]').forEach(function(el){ el.href = 'tel:' + cfg.contact.phoneDial; });
    document.querySelectorAll('[data-email]').forEach(function(el){ el.href = 'mailto:' + cfg.contact.email; });

    document.querySelector('[data-nav="services"]').textContent = t.nav.services;
    document.querySelector('[data-nav="destinations"]').textContent = t.nav.destinations;
    document.querySelector('[data-nav="reviews"]').textContent = t.nav.reviews;
    document.querySelector('[data-nav="how"]').textContent = t.nav.how;
    document.querySelector('[data-nav="faq"]').textContent = t.nav.faq;
    document.querySelector('[data-nav="blog"]').textContent = t.nav.blog;
    document.getElementById('nav-cta-text').innerHTML = '💬 ' + t.nav.cta;

    document.getElementById('blog-eyebrow').textContent = t.blogHero.eyebrow;
    document.getElementById('blog-h1').textContent = t.blogHero.h1;
    document.getElementById('blog-p').textContent = t.blogHero.p;

    renderFilters(lang, t);
    renderGrid(lang, t);

    document.getElementById('footer-brand-text').textContent = t.brand;
    document.getElementById('footer-home-text').textContent = lang === 'ar' ? 'الرئيسية' : (lang === 'it' ? 'Home' : (lang === 'fr' ? 'Accueil' : (lang === 'pt' || lang === 'ptbr' ? 'Início' : 'Home')));
    document.getElementById('footer-fb-text').textContent = t.contactBtns.fb;
    document.getElementById('footer-wa-text').textContent = t.contactBtns.wa;
    document.getElementById('footer-email-text').textContent = cfg.contact.email;
    document.getElementById('footer-phone-text').textContent = cfg.contact.phoneDisplay;
    document.getElementById('footer-copyright').textContent = t.footerCopyright;
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      render(btn.getAttribute('data-lang'));
    });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(cfg.i18n[savedLang] ? savedLang : 'ar');
})();
</script>

      msg:{ar:"الإلغاء بيرجع لسياسة شركة الطيران أو الفندق نفسها، وبنوضحلك ده قبل ما تأكد الحجز مش بعده.",
           en:"Cancellation follows the airline's or hotel's own policy, and we explain this before you confirm, not after.",
           it:"La cancellazione segue la politica della compagnia aerea o dell'hotel, spiegata prima della conferma.",
           fr:"L'annulation suit la politique de la compagnie aérienne ou de l'hôtel, expliquée avant confirmation.",
           pt:"O cancelamento segue a política da companhia aérea ou hotel, explicada antes da confirmação.",
           ptbr:"O cancelamento segue a política da companhia aérea ou hotel, explicada antes da confirmação."},
      options:[
        {label:{ar:"← رجوع",en:"← Back",it:"← Indietro",fr:"← Retour",pt:"← Voltar",ptbr:"← Voltar"}, goto:"faq"}
      ]
    }
  };

  var history = ["root"];
  var messagesEl, optionsEl, fab, panel;

  function currentLang(){
    return document.documentElement.lang || (function(){ try{return localStorage.getItem('sd_lang')||'ar';}catch(e){return 'ar';} })();
  }

  function pick(dict){ var l = currentLang(); return dict[l] || dict.en || dict.ar; }

  function addMsg(text, isUser){
    var div = document.createElement('div');
    div.className = 'sara-msg' + (isUser ? ' user' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderNode(nodeId){
    var node = TREE[nodeId];
    addMsg(pick(node.msg), false);
    optionsEl.innerHTML = '';
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'sara-opt-btn' + (opt.wa ? ' wa' : '');
      btn.textContent = pick(opt.label);
      btn.addEventListener('click', function(){ handleOption(opt, nodeId); });
      optionsEl.appendChild(btn);
    });
  }

  function handleOption(opt, fromNode){
    if (!opt.back) addMsg(pick(opt.label), true);
    if (opt.wa) {
      window.open(waLink(currentLang()), '_blank');
      return;
    }
    if (opt.link) {
      window.location.href = opt.link;
      return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

  function openPanel(){
    panel.classList.add('open');
    document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
    if (!messagesEl.hasChildNodes()) {
      history = ["root"];
      renderNode("root");
    }
  }

  function init(){
    fab = document.getElementById('saraFab');
    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<!-- =================== END SARA ASSISTANT WIDGET =================== -->
