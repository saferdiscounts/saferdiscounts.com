de souci", "b": false}, {"t": "sem estressi", "b": false}, {"t": "Sem estresse", "b": true}], [{"t": "Génial/cool (très courant chez les jeunes)", "b": false}, {"t": "daora", "b": false}, {"t": "Daora", "b": true}]]}], "tip": false}, {"title": "Dialogue pratique complet", "blocks": [{"type": "p", "html": "Un dialogue simple dans un café — lis-le à voix haute plusieurs fois et essaie d'imiter la prononciation :", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Garçom :", "orig": "Bom dia! Seja bem-vindo. O que você vai querer?", "trans": "Bonjour ! Bienvenue. Que désirez-vous ?"}, {"speaker": "Cliente :", "orig": "Bom dia! Eu queria um café, por favor.", "trans": "Bonjour ! Je voudrais un café, s'il vous plaît."}, {"speaker": "Garçom :", "orig": "Só isso?", "trans": "Seulement ça ?"}, {"speaker": "Cliente :", "orig": "Sim, e a conta, por favor.", "trans": "Oui, et l'addition, s'il vous plaît."}, {"speaker": "Garçom :", "orig": "Deu dois euros. Obrigado!", "trans": "Ça fait deux euros. Merci !"}, {"speaker": "Cliente :", "orig": "De nada, até logo!", "trans": "De rien, à bientôt !"}]}], "tip": false}, {"title": "Plan d'action : comment apprendre vite", "blocks": [{"type": "list", "label": "7 étapes pour progresser rapidement", "intro": null, "items": ["Écoute de la musique brésilienne (MPB, samba, funk) et regarde des novelas ou séries chaque jour.", "Pratique le « shadowing » : écoute une phrase courte et répète-la immédiatement au même rythme.", "Le brésilien est plus facile à l'oreille qu'au Portugal pour un débutant — profites-en pour t'entraîner à voix haute dès le début.", "Ne traduis pas dans ta tête — essaie de penser directement en portugais.", "Utilise une application comme Duolingo ou Babbel en complément de ce livre pour renforcer le vocabulaire.", "Parle dès le premier jour, même en faisant des erreurs — la fluidité vient de la pratique.", "Habitue-toi à utiliser « você » naturellement — c'est la forme la plus courante à l'oral au Brésil."]}], "tip": true}, {"title": "Introduction : pour qui est ce livre ?", "blocks": [{"type": "p", "html": "Ce livre est la suite de « Aprender Português — Fácil, Divertido e Rápido », qui couvrait les bases. Si tu as terminé le niveau de base et veux atteindre un niveau où tu peux vraiment te débrouiller en voyage, au travail et dans la vie quotidienne au Brésil, ce livre va te donner : les temps verbaux dont tu as besoin, du vocabulaire pratique, et des dialogues réalistes.", "italic": false}, {"type": "list", "label": "Avant de commencer", "intro": null, "items": ["Tu devrais déjà connaître : les salutations, les pronoms, ser/estar, la conjugaison au présent, et les nombres — tout cela est dans le livre de base.", "Notre objectif ici n'est pas de tout t'enseigner sur la langue, mais de te donner assez d'outils pour te débrouiller seul.", "Prends ton temps dans chaque chapitre, et entraîne-toi à voix haute sur les exemples."]}], "tip": false, "dividerBefore": true}, {"title": "Révision rapide du niveau de base", "blocks": [{"type": "table", "headers": ["eu", "você", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "je", "b": false}, {"t": "tu/vous", "b": false}, {"t": "il/elle", "b": false}, {"t": "nous", "b": false}, {"t": "vous/ils", "b": true}]]}, {"type": "h3", "text": "Présent — les schémas réguliers"}, {"type": "table", "headers": ["Pronom", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "Le passé : Pretérito Perfeito et Imperfeito", "blocks": [{"type": "p", "html": "Comme en portugais européen, le brésilien distingue une action ponctuelle et achevée (Pretérito Perfeito) d'une action habituelle ou descriptive (Imperfeito). C'est un temps simple, sans auxiliaire :", "italic": false}, {"type": "table", "headers": ["Pronom", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "você", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "L'Imperfeito"}, {"type": "table", "headers": ["Pronom", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "você", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Exemple : Quando eu era pequeno, morava em Paris (Imperfeito : description) — Ontem eu fui ao mercado (Pretérito Perfeito : fait ponctuel). À l'oral au Brésil, on entend souvent « tava » au lieu de « estava » dans un registre informel.", "italic": false}], "tip": false}, {"title": "Le futur et le conditionnel", "blocks": [{"type": "table", "headers": ["Usage", "Formation", "Exemple"], "rows": [[{"t": "Futur proche (très utilisé à l'oral)", "b": false}, {"t": "ir (présent) + infinitif", "b": false}, {"t": "Vou viajar amanhã — Je vais voyager demain", "b": true}], [{"t": "Futur simple (plus formel/écrit)", "b": false}, {"t": "infinitif + terminaisons -ei, -á, -emos, -ão", "b": false}, {"t": "Viajarei ano que vem — Je voyagerai l'année prochaine", "b": true}], [{"t": "Conditionnel (hypothèse, politesse)", "b": false}, {"t": "infinitif + terminaisons -ia, -ia, -íamos, -iam", "b": false}, {"t": "Eu queria um café — Je voudrais un café", "b": true}]]}, {"type": "p", "html": "Au Brésil, à l'oral, le futur proche (ir + infinitif) est de très loin la forme la plus utilisée pour parler du futur — le futur simple reste plus fréquent à l'écrit et dans un registre soutenu.", "italic": false}], "tip": false}, {"title": "Verbes pronominaux et pronoms compléments", "blocks": [{"type": "table", "headers": ["Pronom sujet", "Pronom réfléchi", "lavar-se (se laver)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "eu me lavo", "b": true}], [{"t": "você", "b": false}, {"t": "se", "b": false}, {"t": "você se lava", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "nós nos lavamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "vocês se lavam", "b": true}]]}, {"type": "p", "html": "Contrairement au Portugal, au Brésil le pronom complément se place presque toujours avant le verbe à l'oral, comme en français : Eu te vejo (Je te vois), au lieu de « Vejo-te ».", "italic": false}], "tip": false}, {"title": "Les contractions de prépositions", "blocks": [{"type": "p", "html": "Les mêmes contractions qu'en portugais européen s'appliquent au Brésil :", "italic": false}, {"type": "table", "headers": ["Préposition", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Exemple : Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparatifs, superlatifs et connecteurs avancés", "blocks": [{"type": "table", "headers": ["Structure", "Portugais (Brésil)", "Signification"], "rows": [[{"t": "plus... que", "b": false}, {"t": "mais... do que", "b": false}, {"t": "Ele é mais alto do que eu", "b": true}], [{"t": "moins... que", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "aussi... que", "b": false}, {"t": "tão... quanto", "b": false}, {"t": "Ela é tão rápida quanto ele", "b": true}], [{"t": "le plus/la plus", "b": false}, {"t": "o mais / a mais", "b": false}, {"t": "É o bairro mais bonito", "b": true}], [{"t": "cependant", "b": false}, {"t": "no entanto / porém", "b": false}, {"t": "connecteur de contraste", "b": true}], [{"t": "donc", "b": false}, {"t": "então / portanto", "b": false}, {"t": "connecteur de conséquence", "b": true}], [{"t": "bien que", "b": false}, {"t": "embora (+ subjonctif)", "b": false}, {"t": "connecteur de concession", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : aéroport et douane", "blocks": [{"type": "table", "headers": ["Signification", "Portugais (Brésil)"], "rows": [[{"t": "carte d'embarquement", "b": false}, {"t": "cartão de embarque", "b": true}], [{"t": "bagage à main", "b": false}, {"t": "bagagem de mão", "b": true}], [{"t": "retrait des bagages", "b": false}, {"t": "retirada de bagagem", "b": true}], [{"t": "vol retardé", "b": false}, {"t": "voo atrasado", "b": true}], [{"t": "douane", "b": false}, {"t": "alfândega", "b": true}], [{"t": "passeport", "b": false}, {"t": "passaporte", "b": true}], [{"t": "rien à déclarer", "b": false}, {"t": "nada a declarar", "b": true}], [{"t": "porte d'embarquement", "b": false}, {"t": "portão de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : hôtel, santé et urgences", "blocks": [{"type": "table", "headers": ["Signification", "Portugais (Brésil)"], "rows": [[{"t": "Il n'y a pas d'eau chaude", "b": false}, {"t": "Não tem água quente", "b": true}], [{"t": "La chambre n'est pas prête", "b": false}, {"t": "O quarto não está pronto", "b": true}], [{"t": "Je voudrais changer de chambre", "b": false}, {"t": "Eu queria trocar de quarto", "b": true}], [{"t": "pharmacie", "b": false}, {"t": "farmácia", "b": true}], [{"t": "J'ai besoin d'un médecin", "b": false}, {"t": "Preciso de um médico", "b": true}], [{"t": "J'ai mal ici", "b": false}, {"t": "Está doendo aqui", "b": true}], [{"t": "Appelez une ambulance !", "b": false}, {"t": "Chama uma ambulância!", "b": true}], [{"t": "hôpital", "b": false}, {"t": "hospital", "b": true}], [{"t": "assurance maladie", "b": false}, {"t": "plano de saúde", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : banque, police et démarches officielles", "blocks": [{"type": "table", "headers": ["Signification", "Portugais (Brésil)"], "rows": [[{"t": "compte courant", "b": false}, {"t": "conta corrente", "b": true}], [{"t": "distributeur automatique", "b": false}, {"t": "caixa eletrônico", "b": true}], [{"t": "taux de change", "b": false}, {"t": "taxa de câmbio", "b": true}], [{"t": "J'ai perdu mon portefeuille", "b": false}, {"t": "Perdi minha carteira", "b": true}], [{"t": "dépôt de plainte", "b": false}, {"t": "registro de boletim de ocorrência", "b": true}], [{"t": "commissariat de police", "b": false}, {"t": "delegacia de polícia", "b": true}], [{"t": "mairie", "b": false}, {"t": "prefeitura", "b": true}], [{"t": "titre de séjour", "b": false}, {"t": "visto de residência", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : transports et directions", "blocks": [{"type": "table", "headers": ["Signification", "Portugais (Brésil)"], "rows": [[{"t": "billet aller simple", "b": false}, {"t": "passagem só de ida", "b": true}], [{"t": "aller-retour", "b": false}, {"t": "ida e volta", "b": true}], [{"t": "location de voiture", "b": false}, {"t": "aluguel de carro", "b": true}], [{"t": "Tournez à droite", "b": false}, {"t": "Vire à direita", "b": true}], [{"t": "Allez tout droit", "b": false}, {"t": "Siga em frente", "b": true}], [{"t": "feu (de circulation)", "b": false}, {"t": "sinal / semáforo", "b": true}], [{"t": "rond-point", "b": false}, {"t": "rotatória", "b": true}], [{"t": "quai", "b": false}, {"t": "plataforma", "b": true}], [{"t": "arrêt de bus", "b": false}, {"t": "ponto de ônibus", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : shopping et travail", "blocks": [{"type": "table", "headers": ["Signification", "Portugais (Brésil)"], "rows": [[{"t": "Pouvez-vous me faire une remise ?", "b": false}, {"t": "Você pode me dar um desconto?", "b": true}], [{"t": "taille (vêtements)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "cabine d'essayage", "b": false}, {"t": "provador", "b": true}], [{"t": "réunion", "b": false}, {"t": "reunião", "b": true}], [{"t": "date limite", "b": false}, {"t": "prazo", "b": true}], [{"t": "candidature", "b": false}, {"t": "candidatura", "b": true}], [{"t": "entretien d'embauche", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "salaire", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Étiquette : você et les registres de politesse", "blocks": [{"type": "p", "html": "Au Brésil, « você » est utilisé presque partout, y compris avec des inconnus, et le brésilien parlé est globalement plus informel et chaleureux que le portugais européen. La vraie marque de respect se fait surtout par le ton et par l'usage de « o senhor / a senhora » avec les personnes âgées ou en contexte très formel (banque, administration).", "italic": false}, {"type": "list", "label": "Règles pratiques", "intro": null, "items": ["Avec la plupart des gens, même des inconnus : você suffit largement, y compris en contexte professionnel courant.", "Avec des personnes âgées ou en contexte très formel (administration, entretien d'embauche) : o senhor / a senhora.", "Les e-mails formels s'ouvrent par « Prezado(a) » et se terminent par « Atenciosamente »."]}], "tip": false}, {"title": "Expressions idiomatiques avancées", "blocks": [{"type": "table", "headers": ["Signification", "Expression"], "rows": [[{"t": "Coûter les yeux de la tête", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "Avoir la tête ailleurs", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "Faire comme si de rien n'était", "b": false}, {"t": "Fazer de conta que nada aconteceu", "b": true}], [{"t": "Être fauché", "b": false}, {"t": "Estar duro / sem grana", "b": true}], [{"t": "Se mettre dans le pétrin", "b": false}, {"t": "Se meter numa enrascada", "b": true}], [{"t": "Casser la glace", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Dialogues pratiques avancés", "blocks": [{"type": "p", "html": "Scénario : régler un problème à l'hôtel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Hóspede:", "orig": "Bom dia, tem um problema com meu quarto, o ar-condicionado não funciona.", "trans": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas."}, {"speaker": "Recepcionista:", "orig": "Sinto muito, vou mandar alguém já. Prefere trocar de quarto enquanto isso?", "trans": "Je suis vraiment désolée, j'envoie quelqu'un tout de suite. Préférez-vous changer de chambre en attendant ?"}, {"speaker": "Hóspede:", "orig": "Sim, seria mais fácil, obrigado.", "trans": "Oui, ce serait plus simple, merci."}]}, {"type": "p", "html": "Scénario : chez le médecin.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "O que está acontecendo?", "trans": "Qu'est-ce qui ne va pas ?"}, {"speaker": "Paciente:", "orig": "Estou com dor de garganta há três dias e um pouco de febre.", "trans": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre."}, {"speaker": "Médico:", "orig": "Vou receitar uns remédios. Descanse bastante.", "trans": "Je vais vous prescrire des médicaments. Reposez-vous bien."}]}], "tip": false}, {"title": "Conclusion et prochaines étapes vers la fluidité", "blocks": [{"type": "list", "label": "Comment continuer à progresser", "intro": null, "items": ["Regarde des novelas, des séries et des films brésiliens avec des sous-titres en portugais pour habituer ton oreille.", "Lis chaque jour un court article d'un journal brésilien en ligne (Folha de S.Paulo, G1).", "Trouve un partenaire linguistique pour des échanges de conversation (tandem).", "Tiens un petit journal quotidien de quelques phrases en portugais.", "N'aie pas peur des erreurs : la vraie fluidité vient de la pratique constante, et les Brésiliens sont réputés pour leur patience avec les débutants."]}], "tip": true}], "closingBasic": "Parabéns antecipados pela sua jornada no português — Boa sorte! (bonne chance !)", "closingAdvanced": "Parabéns antecipados pela sua jornada no português brasileiro — Boa sorte!"}, "pt": {"chapters": [{"title": "Introduction: why learn Brazilian Portuguese?", "blocks": [{"type": "p", "html": "Brazilian Portuguese is spoken by over 210 million people in Brazil, making it by far the most widely spoken variety of Portuguese in the world. Its pronunciation, more open and melodic than European Portuguese, is also the one you'll hear most in music and TV shows.", "italic": false}, {"type": "p", "html": "The good news: core vocabulary stays close to European Portuguese, and most vowels are pronounced clearly in Brazil, unlike Portugal where they're often reduced — which actually makes Brazilian easier to follow for a beginner.", "italic": false}, {"type": "list", "label": "Goals of this book", "intro": null, "items": ["Give you a solid base of essential vocabulary and grammar in the shortest time possible.", "Focus on authentic Brazilian pronunciation, more open and musical.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The alphabet and pronunciation basics", "blocks": [{"type": "p", "html": "Brazilian Portuguese uses the same alphabet as European Portuguese, but vowels are pronounced more openly and fully. This table shows the most distinctive sounds:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Word"], "rows": [[{"t": "house", "b": false}, {"t": "KAH-zuh", "b": false}, {"t": "casa", "b": true}], [{"t": "good morning", "b": false}, {"t": "bohm JEE-uh", "b": false}, {"t": "bom dia (d before i = \"j\")", "b": true}], [{"t": "thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "obrigado / obrigada", "b": true}], [{"t": "cat", "b": false}, {"t": "GAH-too", "b": false}, {"t": "gato", "b": true}], [{"t": "I", "b": false}, {"t": "EH-oo", "b": false}, {"t": "eu", "b": true}], [{"t": "boy", "b": false}, {"t": "hah-PAHZ", "b": false}, {"t": "rapaz (initial r sounds like an English h in Brazil)", "b": true}], [{"t": "bread", "b": false}, {"t": "POWNG (nasal)", "b": false}, {"t": "pão", "b": true}], [{"t": "water", "b": false}, {"t": "AH-gwuh", "b": false}, {"t": "água", "b": true}], [{"t": "egg", "b": false}, {"t": "OH-voo", "b": false}, {"t": "ovo", "b": true}], [{"t": "wine", "b": false}, {"t": "VEE-nyoo (nasal)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "The golden rules for authentic pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference to sounding truly Brazilian:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Unlike Portugal, Brazilian Portuguese pronounces almost every vowel clearly — a real advantage for a beginner.", "The r at the start of a word (or rr) sounds like an English h (rato → \"hato\").", "D and t followed by i are pronounced \"j\" and \"tch\" (dia → \"JEE-uh\", noite → \"NOY-tchee\").", "The «ão» sound stays a nasal vowel, but a bit more open than in Portugal.", "The group lh is pronounced like the \"lli\" in \"million\" (filho) — already familiar!", "Final s is usually pronounced \"ss\", not \"sh\" as in Portugal (dois → \"doyss\", not \"doysh\")."]}], "tip": false}, {"title": "Greetings and essential phrases", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese (Brazil)"], "rows": [[{"t": "Good morning", "b": false}, {"t": "bohm JEE-uh", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Good afternoon", "b": false}, {"t": "BOH-uh TAR-jee", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Hi (casual)", "b": false}, {"t": "oy", "b": false}, {"t": "Oi", "b": true}], [{"t": "How are you?", "b": false}, {"t": "KOH-moo voh-SAY ish-TAH", "b": false}, {"t": "Como você está?", "b": true}], [{"t": "Fine, thanks", "b": false}, {"t": "beng, oh-bree-GAH-doo", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Nice to meet you", "b": false}, {"t": "prah-ZEHR", "b": false}, {"t": "Prazer", "b": true}], [{"t": "See you later", "b": false}, {"t": "ah-TEH LOH-goo", "b": false}, {"t": "Até logo", "b": true}], [{"t": "See you tomorrow", "b": false}, {"t": "ah-TEH ah-mahn-YAH", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Bye", "b": false}, {"t": "chow", "b": false}, {"t": "Tchau", "b": true}], [{"t": "Please", "b": false}, {"t": "por fah-VOR", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "You're welcome", "b": false}, {"t": "jee NAH-duh", "b": false}, {"t": "De nada", "b": true}], [{"t": "Sorry", "b": false}, {"t": "dish-KOOL-puh", "b": false}, {"t": "Desculpa", "b": true}], [{"t": "Yes", "b": false}, {"t": "seeng", "b": false}, {"t": "Sim", "b": true}], [{"t": "No", "b": false}, {"t": "nowng", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "Pronouns and the verbs «ser» and «estar» (to be)", "blocks": [{"type": "p", "html": "As in Portugal, Brazilian Portuguese distinguishes «ser» (permanent identity) from «estar» (temporary state). A key practical difference: in Brazil, «você» largely replaces «tu» in everyday use, even among friends, and takes third-person conjugation.", "italic": false}, {"type": "h3", "text": "Pronouns"}, {"type": "table", "headers": ["English", "Portuguese (Brazil)"], "rows": [[{"t": "I", "b": false}, {"t": "eu", "b": true}], [{"t": "you (informal)", "b": false}, {"t": "você", "b": true}], [{"t": "he/she", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "we", "b": false}, {"t": "nós / a gente", "b": true}], [{"t": "you (plural)", "b": false}, {"t": "vocês", "b": true}], [{"t": "they", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — to be (permanent)"}, {"type": "table", "headers": ["Pronoun", "Conjugation"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "você", "b": false}, {"t": "é", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "é", "b": true}], [{"t": "nós", "b": false}, {"t": "somos", "b": true}], [{"t": "vocês", "b": false}, {"t": "são", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "são", "b": true}]]}, {"type": "p", "html": "Example: Eu sou inglês — I am English. — Eu estou em São Paulo — I am (right now) in São Paulo. Many Brazilians also say «a gente» instead of «nós» (a gente é inglês, with a third-person singular verb).", "italic": false}], "tip": false}, {"title": "Common verbs and their conjugation", "blocks": [{"type": "p", "html": "Regular verbs fall into three groups by their ending: -ar, -er, -ir. In Brazil, everyday conjugation uses «você» instead of «tu» (third person singular).", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "você", "b": false}, {"t": "fala", "b": false}, {"t": "come", "b": false}, {"t": "parte", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}, {"type": "h3", "text": "Key irregular verbs (eu form)"}, {"type": "table", "headers": ["Meaning", "eu", "Verb"], "rows": [[{"t": "to have", "b": false}, {"t": "tenho", "b": false}, {"t": "ter", "b": true}], [{"t": "to go", "b": false}, {"t": "vou", "b": false}, {"t": "ir", "b": true}], [{"t": "to do/make", "b": false}, {"t": "faço", "b": false}, {"t": "fazer", "b": true}], [{"t": "to be able to", "b": false}, {"t": "posso", "b": false}, {"t": "poder", "b": true}], [{"t": "to want", "b": false}, {"t": "quero", "b": false}, {"t": "querer", "b": true}], [{"t": "to know", "b": false}, {"t": "sei", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "Numbers from 0 to 100", "blocks": [{"type": "table", "headers": ["No.", "Portuguese (Brazil)", "No.", "Portuguese (Brazil)"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": true}], [{"t": "1", "b": false}, {"t": "um", "b": false}, {"t": "12", "b": false}, {"t": "doze", "b": true}], [{"t": "2", "b": false}, {"t": "dois", "b": false}, {"t": "13", "b": false}, {"t": "treze", "b": true}], [{"t": "3", "b": false}, {"t": "três", "b": false}, {"t": "14", "b": false}, {"t": "quatorze", "b": true}], [{"t": "4", "b": false}, {"t": "quatro", "b": false}, {"t": "15", "b": false}, {"t": "quinze", "b": true}], [{"t": "5", "b": false}, {"t": "cinco", "b": false}, {"t": "16", "b": false}, {"t": "dezesseis", "b": true}], [{"t": "6", "b": false}, {"t": "seis", "b": false}, {"t": "17", "b": false}, {"t": "dezessete", "b": true}], [{"t": "7", "b": false}, {"t": "sete", "b": false}, {"t": "18", "b": false}, {"t": "dezoito", "b": true}], [{"t": "8", "b": false}, {"t": "oito", "b": false}, {"t": "19", "b": false}, {"t": "dezenove", "b": true}], [{"t": "9", "b": false}, {"t": "nove", "b": false}, {"t": "20", "b": false}, {"t": "vinte", "b": true}], [{"t": "10", "b": false}, {"t": "dez", "b": false}, {"t": "30", "b": false}, {"t": "trinta", "b": true}]]}, {"type": "table", "headers": ["No.", "Portuguese (Brazil)", "No.", "Portuguese (Brazil)"], "rows": [[{"t": "40", "b": false}, {"t": "quarenta", "b": false}, {"t": "80", "b": false}, {"t": "oitenta", "b": true}], [{"t": "50", "b": false}, {"t": "cinquenta", "b": false}, {"t": "90", "b": false}, {"t": "noventa", "b": true}], [{"t": "60", "b": false}, {"t": "sessenta", "b": false}, {"t": "100", "b": false}, {"t": "cem", "b": true}], [{"t": "70", "b": false}, {"t": "setenta", "b": false}, {"t": "", "b": false}, {"t": "", "b": true}]]}, {"type": "p", "html": "Note the Brazilian spelling (dezesseis, dezessete, dezenove) — European Portuguese spells these differently (dezasseis, dezassete, dezanove).", "italic": true}], "tip": false}, {"title": "Days of the week and months", "blocks": [{"type": "table", "headers": ["Day", "Portuguese (Brazil)"], "rows": [[{"t": "Monday", "b": false}, {"t": "segunda-feira", "b": true}], [{"t": "Tuesday", "b": false}, {"t": "terça-feira", "b": true}], [{"t": "Wednesday", "b": false}, {"t": "quarta-feira", "b": true}], [{"t": "Thursday", "b": false}, {"t": "quinta-feira", "b": true}], [{"t": "Friday", "b": false}, {"t": "sexta-feira", "b": true}], [{"t": "Saturday", "b": false}, {"t": "sábado", "b": true}], [{"t": "Sunday", "b": false}, {"t": "domingo", "b": true}]]}, {"type": "h3", "text": "Months"}, {"type": "table", "headers": ["Month", "Portuguese (Brazil)", "Month", "Portuguese (Brazil)"], "rows": [[{"t": "January", "b": false}, {"t": "janeiro", "b": false}, {"t": "July", "b": false}, {"t": "julho", "b": true}], [{"t": "February", "b": false}, {"t": "fevereiro", "b": false}, {"t": "August", "b": false}, {"t": "agosto", "b": true}], [{"t": "March", "b": false}, {"t": "março", "b": false}, {"t": "September", "b": false}, {"t": "setembro", "b": true}], [{"t": "April", "b": false}, {"t": "abril", "b": false}, {"t": "October", "b": false}, {"t": "outubro", "b": true}], [{"t": "May", "b": false}, {"t": "maio", "b": false}, {"t": "November", "b": false}, {"t": "novembro", "b": true}], [{"t": "June", "b": false}, {"t": "junho", "b": false}, {"t": "December", "b": false}, {"t": "dezembro", "b": true}]]}], "tip": false}, {"title": "Colours", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese (Brazil)"], "rows": [[{"t": "red", "b": false}, {"t": "vehr-MEH-lyoo", "b": false}, {"t": "vermelho", "b": true}]  {"t": "tio", "b": true}], [{"t": "aunt", "b": false}, {"t": "TCHEE-uh", "b": false}, {"t": "tia", "b": true}]]}], "tip": false}, {"title": "Food and drink", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese (Brazil)"], "rows": [[{"t": "bread", "b": false}, {"t": "POWNG", "b": false}, {"t": "pão", "b": true}], [{"t": "water", "b": false}, {"t": "AH-gwuh", "b": false}, {"t": "água", "b": true}], [{"t": "coffee", "b": false}, {"t": "kuh-FEH", "b": false}, {"t": "café", "b": true}], [{"t": "tea", "b": false}, {"t": "SHAH", "b": false}, {"t": "chá", "b": true}], [{"t": "meat", "b": false}, {"t": "KAR-nee", "b": false}, {"t": "carne", "b": true}], [{"t": "chicken", "b": false}, {"t": "FRAHN-goo", "b": false}, {"t": "frango", "b": true}], [{"t": "fish", "b": false}, {"t": "PAY-shee", "b": false}, {"t": "peixe", "b": true}], [{"t": "cheese", "b": false}, {"t": "KAY-zhoo", "b": false}, {"t": "queijo", "b": true}], [{"t": "fruit", "b": false}, {"t": "FROO-tuh", "b": false}, {"t": "fruta", "b": true}], [{"t": "vegetables", "b": false}, {"t": "luh-GOO-meesh", "b": false}, {"t": "legumes", "b": true}], [{"t": "dessert", "b": false}, {"t": "soh-bruh-MEH-zuh", "b": false}, {"t": "sobremesa", "b": true}], [{"t": "breakfast", "b": false}, {"t": "kuh-FEH duh mahn-YAH", "b": false}, {"t": "café da manhã", "b": true}], [{"t": "lunch", "b": false}, {"t": "al-MOH-soo", "b": false}, {"t": "almoço", "b": true}], [{"t": "dinner", "b": false}, {"t": "zhahn-TAR", "b": false}, {"t": "jantar", "b": true}]]}], "tip": false}, {"title": "Essential phrases for travel and hotels", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese (Brazil)"], "rows": [[{"t": "Where is...?", "b": false}, {"t": "OHN-jee FEE-kuh", "b": false}, {"t": "Onde fica...?", "b": true}], [{"t": "How much is this?", "b": false}, {"t": "KWAHN-too KOOSH-tuh", "b": false}, {"t": "Quanto custa?", "b": true}], [{"t": "Can I see the menu?", "b": false}, {"t": "POH-soo vehr oo kar-DAH-pyoo", "b": false}, {"t": "Posso ver o cardápio?", "b": true}], [{"t": "The bill, please", "b": false}, {"t": "uh KOHN-tuh por fah-VOR", "b": false}, {"t": "A conta, por favor", "b": true}], [{"t": "Where is the bathroom?", "b": false}, {"t": "OHN-jee eh oo bahn-YAY-roo", "b": false}, {"t": "Onde é o banheiro?", "b": true}], [{"t": "I need help", "b": false}, {"t": "pruh-SEE-zoo jee uh-ZHOO-duh", "b": false}, {"t": "Preciso de ajuda", "b": true}], [{"t": "I don't understand", "b": false}, {"t": "nowng ehn-TEHN-doo", "b": false}, {"t": "Não entendo", "b": true}], [{"t": "Can you repeat, please?", "b": false}, {"t": "POH-jee heh-peh-TEER", "b": false}, {"t": "Pode repetir, por favor?", "b": true}], [{"t": "Do you speak English?", "b": false}, {"t": "voh-SAY FAH-luh eeng-GLESH", "b": false}, {"t": "Você fala inglês?", "b": true}], [{"t": "I'd like to book a room", "b": false}, {"t": "keh-REE-uh heh-zehr-VAR oong KWAR-too", "b": false}, {"t": "Queria reservar um quarto", "b": true}], [{"t": "What time does the train leave?", "b": false}, {"t": "uh kee OR-ush sy oo trehng", "b": false}, {"t": "A que horas sai o trem?", "b": true}], [{"t": "Where can I get a taxi?", "b": false}, {"t": "OHN-jee POH-soo peh-GAR oong TAHK-see", "b": false}, {"t": "Onde posso pegar um táxi?", "b": true}]]}], "tip": false}, {"title": "Authentic Brazilian expressions and slang", "blocks": [{"type": "p", "html": "These expressions are what separate «textbook» Portuguese from Portuguese that sounds genuinely Brazilian. Use them in the right context:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Expression"], "rows": [[{"t": "Cool/sounds good", "b": false}, {"t": "beh-LEH-zuh", "b": false}, {"t": "Beleza", "b": true}], [{"t": "How cool!", "b": false}, {"t": "kee leh-GAL", "b": false}, {"t": "Que legal!", "b": true}], [{"t": "So/right (very common filler)", "b": false}, {"t": "ehn-TOWNG", "b": false}, {"t": "Então", "b": true}], [{"t": "Thing/stuff (generic word)", "b": false}, {"t": "neh-GOH-syoo", "b": false}, {"t": "Negócio", "b": true}], [{"t": "Whatever/no worries", "b": false}, {"t": "vy lah", "b": false}, {"t": "Vai lá", "b": true}], [{"t": "No stress", "b": false}, {"t": "seng ish-TREH-see", "b": false}, {"t": "Sem estresse", "b": true}], [{"t": "Awesome/cool (very popular with young people)", "b": false}, {"t": "dah-OH-ruh", "b": false}, {"t": "Daora", "b": true}]]}], "tip": false}, {"title": "Full practice dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it aloud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "Bom dia! Seja bem-vindo. O que você vai querer?", "trans": "Good morning! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "Bom dia! Eu queria um café, por favor.", "trans": "Good morning! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "Só isso?", "trans": "Is that all?"}, {"speaker": "Customer:", "orig": "Sim, e a conta, por favor.", "trans": "Yes, and the bill, please."}, {"speaker": "Waiter:", "orig": "Deu dois euros. Obrigado!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "De nada, até logo!", "trans": "You're welcome, see you later!"}]}], "tip": false}, {"title": "Action plan: how to learn fast", "blocks": [{"type": "list", "label": "7 steps to lock in the language quickly", "intro": null, "items": ["Listen to Brazilian music (MPB, samba, funk) and watch telenovelas or shows every day.", "Practise «shadowing»: listen to a short sentence and repeat it immediately at the same rhythm.", "Brazilian Portuguese is easier on the ear than European Portuguese for a beginner — take advantage and practise speaking out loud from the start.", "Don't translate in your head — try to think directly in Portuguese.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary.", "Speak from day one, even if you make mistakes — fluency comes from practice.", "Get comfortable using «você» naturally — it's the most common form in everyday speech in Brazil."]}], "tip": true}, {"title": "Introduction: who is this book for?", "blocks": [{"type": "p", "html": "This book is the second part after «Learn Portuguese — Brazilian Portuguese, Easy, Fun and Fast», which covered the basics. If you've already finished the basic level and want to reach a level where you can genuinely get by while travelling, working, and living day to day in Brazil, this book will give you: the verb tenses you need, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "Before you start", "intro": null, "items": ["You should already know: greetings, pronouns, ser/estar, present-tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take each chapter slowly, and practise the examples out loud before moving on to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick review of the basic level", "blocks": [{"type": "table", "headers": ["eu", "você", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you (pl)/they", "b": true}]]}, {"type": "h3", "text": "Present tense — the regular patterns"}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "The past: Pretérito Perfeito and Imperfeito", "blocks": [{"type": "p", "html": "As in European Portuguese, Brazilian Portuguese distinguishes a completed, one-off action (Pretérito Perfeito) from a habitual or descriptive past (Imperfeito). It's a simple tense, with no auxiliary verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "você", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "The Imperfeito"}, {"type": "table", "headers": ["Pronoun", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "você", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Example: Quando eu era pequeno, morava em Londres (Imperfeito: description) — Ontem eu fui ao mercado (Pretérito Perfeito: one-off event). In everyday Brazilian speech you'll often hear «tava» instead of «estava» in casual registers.", "italic": false}], "tip": false}, {"title": "Future and conditional", "blocks": [{"type": "table", "headers": ["Use", "Formation", "Example"], "rows": [[{"t": "Near future (very common in speech)", "b": false}, {"t": "ir (present) + infinitive", "b": false}, {"t": "Vou viajar amanhã — I'm going to travel tomorrow", "b": true}], [{"t": "Simple future (more formal/written)", "b": false}, {"t": "infinitive + endings -ei, -á, -emos, -ão", "b": false}, {"t": "Viajarei ano que vem — I will travel next year", "b": true}], [{"t": "Conditional (hypothesis, politeness)", "b": false}, {"t": "infinitive + endings -ia, -ia, -íamos, -iam", "b": false}, {"t": "Eu queria um café — I would like a coffee", "b": true}]]}, {"type": "p", "html": "In Brazil, the near future (ir + infinitive) is by far the most common way to talk about the future in speech — the simple future stays more common in writing and formal registers.", "italic": false}], "tip": false}, {"title": "Reflexive verbs and object pronouns", "blocks": [{"type": "table", "headers": ["Subject pronoun", "Reflexive pronoun", "lavar-se (to wash oneself)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "eu me lavo", "b": true}], [{"t": "você", "b": false}, {"t": "se", "b": false}, {"t": "você se lava", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "nós nos lavamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "vocês se lavam", "b": true}]]}, {"type": "p", "html": "Unlike Portugal, in Brazil the object pronoun almost always goes before the verb in speech, just like in English: Eu te vejo (I see you), rather than \"Vejo-te\".", "italic": false}], "tip": false}, {"title": "Preposition + article contractions", "blocks": [{"type": "p", "html": "The same contractions from European Portuguese apply in Brazil:", "italic": false}, {"type": "table", "headers": ["Preposition", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Example: Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparatives, superlatives and advanced connectors", "blocks": [{"type": "table", "headers": ["Structure", "Portuguese (Brazil)", "Meaning"], "rows": [[{"t": "more... than", "b": false}, {"t": "mais... do que", "b": false}, {"t": "Ele é mais alto do que eu", "b": true}], [{"t": "less... than", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "as... as", "b": false}, {"t": "tão... quanto", "b": false}, {"t": "Ela é tão rápida quanto ele", "b": true}], [{"t": "the most", "b": false}, {"t": "o mais / a mais", "b": false}, {"t": "É o bairro mais bonito", "b": true}], [{"t": "however", "b": false}, {"t": "no entanto / porém", "b": false}, {"t": "contrast connector", "b": true}], [{"t": "therefore/so", "b": false}, {"t": "então / portanto", "b": false}, {"t": "consequence connector", "b": true}], [{"t": "although", "b": false}, {"t": "embora (+ subjunctive)", "b": false}, {"t": "concession connector", "b": true}]]}], "tip": false}, {"title": "Vocabulary: airport and customs", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese (Brazil)"], "rows": [[{"t": "boarding pass", "b": false}, {"t": "cartão de embarque", "b": true}], [{"t": "carry-on luggage", "b": false}, {"t": "bagagem de mão", "b": true}], [{"t": "baggage claim", "b": false}, {"t": "retirada de bagagem", "b": true}], [{"t": "delayed flight", "b": false}, {"t": "voo atrasado", "b": true}], [{"t": "customs", "b": false}, {"t": "alfândega", "b": true}], [{"t": "passport", "b": false}, {"t": "passaporte", "b": true}], [{"t": "nothing to declare", "b": false}, {"t": "nada a declarar", "b": true}], [{"t": "boarding gate", "b": false}, {"t": "portão de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabulary: hotel, health and emergencies", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese (Brazil)"], "rows": [[{"t": "There's no hot water", "b": false}, {"t": "Não tem água quente", "b": true}], [{"t": "The room isn't ready", "b": false}, {"t": "O quarto não está pronto", "b": true}], [{"t": "I'd like to change rooms", "b": false}, {"t": "Eu queria trocar de quarto", "b": true}], [{"t": "pharmacy", "b": false}, {"t": "farmácia", "b": true}], [{"t": "I need a doctor", "b": false}, {"t": "Preciso de um médico", "b "Meaning", "Portuguese (Brazil)"], "rows": [[{"t": "Can you give me a discount?", "b": false}, {"t": "Você pode me dar um desconto?", "b": true}], [{"t": "size (clothing)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "fitting room", "b": false}, {"t": "provador", "b": true}], [{"t": "meeting", "b": false}, {"t": "reunião", "b": true}], [{"t": "deadline", "b": false}, {"t": "prazo", "b": true}], [{"t": "job application", "b": false}, {"t": "candidatura", "b": true}], [{"t": "job interview", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "salary", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Etiquette: você and levels of politeness", "blocks": [{"type": "p", "html": "In Brazil, «você» is used almost everywhere, even with strangers, and spoken Brazilian Portuguese is generally more informal and warm than European Portuguese. Real respect is mostly conveyed through tone and through «o senhor / a senhora» with older people or in very formal settings (banks, government offices).", "italic": false}, {"type": "list", "label": "Practical rules", "intro": null, "items": ["With most people, even strangers: você works fine, including in everyday professional settings.", "With older people or in very formal contexts (government offices, job interviews): o senhor / a senhora.", "Formal emails open with «Prezado(a)» and close with «Atenciosamente»."]}], "tip": false}, {"title": "Advanced idiomatic expressions", "blocks": [{"type": "table", "headers": ["Meaning", "Expression"], "rows": [[{"t": "To cost an arm and a leg", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "To be daydreaming/distracted", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "To pretend nothing happened", "b": false}, {"t": "Fazer de conta que nada aconteceu", "b": true}], [{"t": "To be broke", "b": false}, {"t": "Estar duro / sem grana", "b": true}], [{"t": "To get into trouble", "b": false}, {"t": "Se meter numa enrascada", "b": true}], [{"t": "To break the ice", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Advanced practice dialogues", "blocks": [{"type": "p", "html": "Scenario: solving a hotel problem.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Bom dia, tem um problema com meu quarto, o ar-condicionado não funciona.", "trans": "Good morning, there's a problem with my room, the air conditioning isn't working."}, {"speaker": "Receptionist:", "orig": "Sinto muito, vou mandar alguém já. Prefere trocar de quarto enquanto isso?", "trans": "I'm very sorry, I'll send someone right away. Would you prefer to change rooms in the meantime?"}, {"speaker": "Guest:", "orig": "Sim, seria mais fácil, obrigado.", "trans": "Yes, that would be easier, thank you."}]}, {"type": "p", "html": "Scenario: at the doctor's.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "O que está acontecendo?", "trans": "What's wrong?"}, {"speaker": "Patient:", "orig": "Estou com dor de garganta há três dias e um pouco de febre.", "trans": "I've had a sore throat for three days and a bit of a fever."}, {"speaker": "Doctor:", "orig": "Vou receitar uns remédios. Descanse bastante.", "trans": "I'll prescribe some medicine. Get plenty of rest."}]}], "tip": false}, {"title": "Conclusion and next steps toward fluency", "blocks": [{"type": "list", "label": "How to keep improving", "intro": null, "items": ["Watch Brazilian telenovelas, shows and films with Portuguese subtitles to train your ear.", "Read a short article from an online Brazilian newspaper every day (Folha de S.Paulo, G1).", "Find a language exchange partner for conversation practice (tandem).", "Write a short daily diary of a few sentences in Portuguese.", "Don't fear mistakes: true fluency comes from consistent practice, and Brazilians are known for being patient with beginners."]}], "tip": true}], "closingBasic": "Good luck in advance on your Portuguese <script>

  function renderBlock(b, isTip, tipLabelFallback){
    switch(b.type){
      case 'p': return '<p' + (b.italic ? ' style="font-style:italic;"' : '') + '>' + b.html + '</p>';
      case 'h3': return '<h3>' + b.text + '</h3>';
      case 'table': return renderTableBlock(b);
      case 'list': return renderListBlock(b, isTip, tipLabelFallback);
      case 'dialogue': return renderDialogueBlock(b);
      default: return '';
    }
  }

  function render(lang){
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    var doc = DATA[lang] || DATA.en;
    var s = STR;

    document.getElementById('brand-text').textContent = s.brand[lang] || s.brand.en;
    document.getElementById('back-link').textContent = s.backLink[lang] || s.backLink.en;
    document.getElementById('nav-cta').innerHTML = '💬 ' + (s.navCta[lang] || s.navCta.en);
    document.getElementById('nav-cta').href = waLink(lang);
    document.getElementById('hero-title').textContent = s.mainTitle[lang] || s.mainTitle.en;
    document.getElementById('hero-subtitle').textContent = s.mainSubtitle[lang] || s.mainSubtitle.en;
    document.getElementById('byline-name').textContent = s.bylineName[lang] || s.bylineName.en;
    document.getElementById('byline-meta').textContent = s.bylineMeta[lang] || s.bylineMeta.en;
    document.getElementById('toc-heading').textContent = s.tocHeading[lang] || s.tocHeading.en;
    document.getElementById('cta-h3').textContent = s.ctaH3[lang] || s.ctaH3.en;
    document.getElementById('cta-p').textContent = s.ctaP[lang] || s.ctaP.en;
    document.getElementById('cta-btn-text').textContent = s.navCta[lang] || s.navCta.en;
    document.getElementById('cta-btn-bottom').href = waLink(lang);
    document.getElementById('floating-wa').href = waLink(lang);
    document.getElementById('footer-copyright').textContent = s.footerCopyright[lang] || s.footerCopyright.en;
    document.getElementById('footer-back').textContent = s.footerBack[lang] || s.footerBack.en;

    var chapters = doc.chapters;
    var tocHtml = '';
    var chaptersHtml = '';
    chapters.forEach(function(ch, i){
      var num = i + 1;
      if (ch.dividerBefore) {
        tocHtml += '<span class="toc-part">' + (s.partTag[lang]||s.partTag.en) + ' — ' + (s.partTitle[lang]||s.partTitle.en) + '</span>';
      }
      tocHtml += '<a href="#c' + num + '">' + num + '. ' + ch.title + '</a>';

      if (ch.dividerBefore) {
        chaptersHtml += '<div class="part-divider"><span class="tag">' + (s.partTag[lang]||s.partTag.en) + '</span><h2>' + (s.partTitle[lang]||s.partTitle.en) + '</h2></div>';
      }
      chaptersHtml += '<div class="chapter" id="c' + num + '"><h2>' + num + '. ' + ch.title + '</h2>';
      ch.blocks.forEach(function(b){
        chaptersHtml += renderBlock(b, ch.tip, null);
      });
      if (i === chapters.length - 1 && doc.closingAdvanced) {
        chaptersHtml += '<p style="text-align:center;font-weight:800;color:var(--brand-blue-dark);margin-top:20px;">' + doc.closingAdvanced + '</p>';
      }
      chaptersHtml += '</div>';
    });
    document.getElementById('toc-grid').innerHTML = tocHtml;
    document.getElementById('chapters-container').innerHTML = chaptersHtml;
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ render(btn.getAttribute('data-lang')); });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(DATA[savedLang] ? savedLang : 'ar');
})();
</script>

</body>
</html>
