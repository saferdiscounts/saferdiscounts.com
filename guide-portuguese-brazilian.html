ي أسوكار؟"}, {"speaker": "Local:", "orig": "Siga em frente e depois vire à direita na segunda rua.", "trans": "كمّل دُغري وبعدين لف يمين في تاني شارع."}, {"speaker": "Turista:", "orig": "É muito longe daqui?", "trans": "ده بعيد أوي من هنا؟"}, {"speaker": "Local:", "orig": "Não, fica uns dez minutos a pé.", "trans": "لأ، حوالي ١٠ دقايق مشي."}]}], "tip": false}, {"title": "نص قرائي للتدريب", "blocks": [{"type": "p", "html": "اقرأ النص ده كذا مرة بصوت عالٍ، وحاول تفهمه من غير ما تترجم كل كلمة:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>مفردات مهمة من النص</strong>"}, {"type": "table", "headers": ["المعنى", "الكلمة"], "rows": [[{"t": "يمسك/ياخد (مواصلات)", "b": false}, {"t": "pegar", "b": false}], [{"t": "جبل بان دي أسوكار في ريو", "b": false}, {"t": "Pão de Açúcar", "b": false}], [{"t": "عصير جوز الهند", "b": false}, {"t": "suco de coco", "b": false}], [{"t": "ما يُنسى", "b": false}, {"t": "inesquecível", "b": false}]]}, {"type": "h3", "text": "<strong>أسئلة للفهم</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["الأسرة راحت ريو دي جانيرو إمتى؟", "عملوا إيه بعد الـcheck-in؟", "شربوا إيه في العصرية؟"]}, {"type": "p", "html": "<em>الإجابات: ١) بالأمس ٢) راحوا الـPão de Açúcar يشوفوا المنظر ٣) سوكو دي كوكو (عصير جوز هند)</em>", "italic": true}], "tip": false}, {"title": "خاتمة وخطوات نحو الطلاقة الكاملة", "blocks": [{"type": "list", "label": "<strong>للوصول للطلاقة الكاملة</strong>", "intro": null, "items": ["اسمع بودكاست أو أخبار برازيلية بسيطة يوميًا وحاول تفهم من السياق قبل ما تترجم.", "اتكلم مع متحدثين أصليين (أونلاين أو لو سافرت) — التطبيق العملي أهم حاجة دلوقتي.", "اكتب يوميات قصيرة بالبرتغالي كل يوم — حتى ٣-٤ جمل بتفرق كتير على المدى الطويل.", "راجع الأزمنة دي كل شوية لحد ما تبقى تلقائية من غير ما تفكر فيها.", "متخافش من الغلط في المحادثة — البرازيليين من أكتر الناس ترحيبًا بحد بيحاول يتكلم لغتهم."]}], "tip": true}], "closingBasic": "مبروك مقدمًا على رحلتك مع البرتغالية البرازيلية — Boa sorte! (حظ سعيد!)", "closingAdvanced": "رحلتك مع البرتغالية البرازيلية بقت جاهزة للمستوى اللي تقدر تعتمد عليه فعلاً — Boa sorte e força! (حظ سعيد وقوة!)"}, "en": {"chapters": [{"title": "Introduction: why learn Brazilian Portuguese?", "blocks": [{"type": "p", "html": "Brazilian Portuguese is spoken by over 210 million people in Brazil, making it by far the most widely spoken variety of Portuguese in the world. Its pronunciation, more open and melodic than European Portuguese, is also the one you'll hear most in music and TV shows.", "italic": false}, {"type": "p", "html": "The good news: core vocabulary stays close to European Portuguese, and most vowels are pronounced clearly in Brazil, unlike Portugal where they're often reduced — which actually makes Brazilian easier to follow for a beginner.", "italic": false}, {"type": "list", "label": "Goals of this book", "intro": null, "items": ["Give you a solid base of essential vocabulary and grammar in the shortest time possible.", "Focus on authentic Brazilian pronunciation, more open and musical.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The alphabet and pronunciation basics", "blocks": [{"type": "p", "html": "Brazilian Portuguese uses the same alphabet as European Portuguese, but vowels are pronounced more openly and fully. This table shows the most distinctive sounds:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Word"], "rows": [[{"t": "house", "b": false}, {"t": "KAH-zuh", "b": false}, {"t": "casa", "b": true}], [{"t": "good morning", "b": false}, {"t": "bohm JEE-uh", "b": false}, {"t": "bom dia (d before i = \"j\")", "b": true}], [{"t": "thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "obrigado / obrigada", "b": true}], [{"t": "cat", "b": false}, {"t": "GAH-too", "b": false}, {"t": "gato", "b": true}], [{"t": "I", "b": false}, {"t": "EH-oo", "b": false}, {"t": "eu", "b": true}], [{"t": "boy", "b": false}, {"t": "hah-PAHZ", "b": false}, {"t": "rapaz (initial r sounds like an English h in Brazil)", "b": true}], [{"t": "bread", "b": false}, {"t": "POWNG (nasal)", "b": false}, {"t": "pão", "b": true}], [{"t": "water", "b": false}, {"t": "AH-gwuh", "b": false}, {"t": "água", "b": true}], [{"t": "egg", "b": false}, {"t": "OH-voo", "b": false}, {"t": "ovo", "b": true}], [{"t": "wine", "b": false}, {"t": "VEE-nyoo (nasal)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "The golden rules for authentic pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference to sounding truly Brazilian:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Unlike Portugal, Brazilian Portuguese pronounces almost every vowel clearly — a real advantage for a beginner.", "The r at the start of a word (or rr) sounds like an English h (rato → \"hato\").", "D and t followed by i are pronounced \"j\" and \"tch\" (dia → \"JEE-uh\", noite → \"NOY-tchee\").", "The «ão» sound stays a nasal vowel, but a bit more open than in Portugal.", "The group lh is pronounced like the \"lli\" in \"million\" (filho) — already familiar!", "Final s is usually pronounced \"ss\", not \"sh\" as in Portugal (dois → \"doyss\", not \"doysh\")."]}], "tip": false}, {"title": "Greetings and essential phrases", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese (Brazil)"], "rows": [[{"t": "Good morning", "b": false}, {"t": "bohm JEE-uh", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Good afternoon", "b": false}, {"t": "BOH-uh TAR-jee", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Hi (casual)", "b": false}, {"t": "oy", "b": false}, {"t": "Oi", "b": true}], [{"t": "How are you?", "b": false}, {"t": "KOH-moo voh-SAY ish-TAH", "b": false}, {"t": "Como você está?", "b": true}], [{"t": "Fine, thanks", "b": false}, {"t": "beng, oh-bree-GAH-doo", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Nice to meet you", "b": false}, {"t": "prah-ZEHR", "b": false}, {"t": "Prazer", "b": true}], [{"t": "See you later", "b": false}, {"t": "ah-TEH LOH-goo", "b": false}, {"t": "Até logo", "b": true}], [{"t": "See you tomorrow", "b": false}, {"t": "ah-TEH ah-mahn-YAH", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Bye", "b": false}, {"t": "chow", "b": false}, {"t": "Tchau", "b": true}], [{"t": "Please", "b": false}, {"t": "por fah-VOR", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "You're welcome", "b": false}, {"t": "jee NAH-duh", "b": false}, {"t": "De nada", "b": true}], [{"t": "Sorry", "b": false}, {"t": "dish-KOOL-puh", "b": false}, {"t": "Desculpa", "b": true}], [{"t": "Yes", "b": false}, {"t": "seeng", "b": false}, {"t": "Sim", "b": true}], [{"t": "No", "b": false}, {"t": "nowng", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "Pronouns and the verbs «ser» and «estar» (to be)", "blocks": [{"type": "p", "html": "As in Portugal, Brazilian Portuguese distinguishes «ser» (permanent identity) from «estar» (temporary state). A key practical difference: in Brazil, «você» largely replaces «tu» in everyday use, even among friends, and takes third-person conjugation.", "italic": false}, {"type": "h3", "text": "Pronouns"}, {"type": "table", "headers": ["English", "Portuguese (Brazil)"], "rows": [[{"t": "I", "b": false}, {"t": "eu", "b": true}], [{"t": "you (informal)", "b": false}, {"t": "você", "b": true}], [{"t": "he/she", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "we", "b": false}, {"t": "nós / a gente", "b": true}], [{"t": "you (plural)", "b": false}, {"t": "vocês", "b": true}], [{"t": "they", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — to be (permanent)"}, {"type": "table", "headers": ["Pronoun", "Conjugation"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "você", "b": false}, {"t": "é", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "é", "b": true}], [{"t": "nós", "b": false}, {"t": "somos", "b": true}], [{"t": "vocês", "b": false}, {"t": "são", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "são", "b": true}]]}, {"type": "p", "html": "Example: Eu sou inglês — I am English. — Eu estou em São Paulo — I am (right now) in São Paulo. Many Brazilians also say «a gente» instead of «nós» (a gente é inglês, with a third-person singular verb).", "italic": false}], "tip": false}, {"title": "Common verbs and their conjugation", "blocks": [{"type": "p", "html": "Regular verbs fall into three groups by their ending: -ar, -er, -ir. In Brazil, everyday conjugation uses «você» instead of «tu» (third person singular).", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "você", "b": false}, {"t": "fala", "b": false}, {"t": "come", "b": false}, {"t": "parte", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}, {"type": "h3", "text": "Key irregular verbs (eu form)"}, {"type": "table", "headers": ["Meaning", "eu", "Verb"], "rows": [[{"t": "to have", "b": false}, {"t": "tenho", "b": false}, {"t": "ter", "b": true}], [{"t": "to go", "b": false}, {"t": "vou", "b": false}, {"t": "ir", "b": true}], [{"t": "to do/make", "b": false}, {"t": "faço", "b": false}, {"t": "fazer", "b": true}], [{"t": "to be able to", "b": false}, {"t": "posso", "b": false}, {"t": "poder", "b": true}], [{"t": "to want", "b": false}, {"t": "quero", "b": false}, {"t": "querer", "b": true}], [{"t": "to know", "b": false}, {"t": "sei", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "Numbers from 0 to 100", "blocks": [{"type": "table", "headers": ["No.", "Portuguese (Brazil)", "No.", "Portuguese (Brazil)"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": true}], [{"t": "1", "b": false}, {"t": "um", "b": false}, {"t": "12", "b": false}, {"t": "doze", "b": true}], [{"t": "2", "b": false}, {"t": "dois", "b": false}, {"t": "13", "b": false}, {"t": "treze", "b": true}], [{"t": "3", "b": false}, {"t": "três", "b": false}, {"t": "14", "b": false}, {"t": "quatorze", "b": true}], [{"t": "4", "b": false}, {"t": "quatro", "b": false}, {"t": "15", "b": false}, {"t": "quinze", "b": true}], [{"t": "5", "b": false}, {"t": "cinco", "b": false}, {"t": "16", "b": false}, {"t": "dezesseis", "b": true}], [{"t": "6", "b": false}, {"t": "seis", "b": false}, {"t": "17", "b": false}, {"t": "dezessete", "b": true}], [{"t": "7", "b": false}, {"t": "sete", "b": false}, {"t": "18", "b": false}, {"t": "dezoito", "b": true}], [{"t": "8", "b": false}, {"t": "oito", "b": false}, {"t": "19", "b": false}, {"t": "dezenove", "b": true}], [{"t": "9", "b": false}, {"t": "nove", "b": false}, {"t": "20", "b": false}, {"t": "vinte", "b": true}], [{"t": "10", "b": false}, {"t": "dez", "b": false}, {"t": "30", "b": false}, {"t": "trinta", "b": true}]]}, {"type": "table", "headers": ["No.", "Portuguese (Brazil)", "No.", "Portuguese (Brazil)"], "rows": [[{"t": "40", "b": false}, {"t": "quarenta", "b": false}, {"t": "80", "b": false}, {"t": "oitenta", "b": true}], [{"t": "50", "b": false}, {"t": "cinquenta", "b": false}, {"t": "90", "b": false}, {"t": "noventa", "b": true}], [{"t": "60", "b": false}, {"t": "sessenta", "b": false}, {"t": "100", "b": false}, {"t": "cem", "b": true}], [{"t": "70", "b": false}, {"t": "setenta", "b": false}, {"t": "", "b": false}, {"t": "", "b": true}]]}, {"type": "p", "html": "Note the Brazilian spelling (dezesseis, dezessete, dezenove) — European Portuguese spells these differently (dezasseis, dezassete, dezanove).", "italic": true}], "tip": false}, {"title": "Days of the week and months", "blocks": [{"type": "table", "headers": ["Day", "Portuguese (Brazil)"], "rows": [[{"t": "Monday", "b": false}, {"t": "segunda-feira", "b": true}], [{"t": "Tuesday", "b": false}, {"t": "terça-feira", "b": true}], [{"t": "Wednesday", "b": false}, {"t": "quarta-feira", "b": true}], [{"t": "Thursday", "b": false}, {"t": "quinta-feira", "b": true}], [{"t": "Friday", "b": false}, {"t": "sexta-feira", "b": true}], [{"t": "Saturday", "b": false}, {"t": "sábado", "b": true}], [{"t": "Sunday", "b": false}, {"t": "domingo", "b": true}]]}, {"type": "h3", "text": "Months"}, {"type": "table", "headers": ["Month", "Portuguese (Brazil)", "Month", "Portuguese (Brazil)"], "rows": [[{"t": "January", "b": false}, {"t": "janeiro", "b": false}, {"t": "July", "b": false}, {"t": "julho", "b": true}], [{"t": "February", "b": false}, {"t": "fevereiro", "b": false}, {"t": "August", "b": false}, {"t": "agosto", "b": true}], [{"t": "March", "b": false}, {"t": "março", "b": false}, {"t": "September", "b": false}, {"t": "setembro", "b": true}], [{"t": "April", "b": false}, {"t": "abril", "b": false}, {"t": "October", "b": false}, {"t": "outubro", "b": true}], [{"t": "May", "b": false}, {"t": "maio", "b": false}, {"t": "November", "b": false}, {"t": "novembro", "b": true}], [{"t": "June", "b": false}, {"t": "junho", "b": false}, {"t": "December", "b": false}, {"t": "dezembro", "b": true}]]}], "tip": false}, {"title": "Colours", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese (Brazil)"], "rows": [[{"t": "red", "b": false}, {"t": "vehr-MEH-lyoo", "b": false}, {"t": "vermelho", "b": true}], [{"t": "blue", "b": false}, {"t": "ah-ZOOL", "b": false}, {"t": "azul", "b": true}], [{"t": "green", "b": false}, {"t": "VEHR-jee", "b": false}, {"t": "verde", "b": true}], [{"t": "yellow", "b": false}, {"t": "ah-mah-REH-loo", "b": false}, {"t": "amarelo", "b": eh oo bahn-YAY-roo", "b": false}, {"t": "Onde é o banheiro?", "b": true}], [{"t": "I need help", "b": false}, {"t": "pruh-SEE-zoo jee uh-ZHOO-duh", "b": false}, {"t": "Preciso de ajuda", "b": true}], [{"t": "I don't understand", "b": false}, {"t": "nowng ehn-TEHN-doo", "b": false}, {"t": "Não entendo", "b": true}], [{"t": "Can you repeat, please?", "b": false}, {"t": "POH-jee heh-peh-TEER", "b": false}, {"t": "Pode repetir, por favor?", "b": true}], [{"t": "Do you speak English?", "b": false}, {"t": "voh-SAY FAH-luh eeng-GLESH", "b": false}, {"t": "Você fala inglês?", "b": true}], [{"t": "I'd like to book a room", "b": false}, {"t": "keh-REE-uh heh-zehr-VAR oong KWAR-too", "b": false}, {"t": "Queria reservar um quarto", "b": true}], [{"t": "What time does the train leave?", "b": false}, {"t": "uh kee OR-ush sy oo trehng", "b": false}, {"t": "A que horas sai o trem?", "b": true}], [{"t": "Where can I get a taxi?", "b": false}, {"t": "OHN-jee POH-soo peh-GAR oong TAHK-see", "b": false}, {"t": "Onde posso pegar um táxi?", "b": true}]]}], "tip": false}, {"title": "Authentic Brazilian expressions and slang", "blocks": [{"type": "p", "html": "These expressions are what separate «textbook» Portuguese from Portuguese that sounds genuinely Brazilian. Use them in the right context:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Expression"], "rows": [[{"t": "Cool/sounds good", "b": false}, {"t": "beh-LEH-zuh", "b": false}, {"t": "Beleza", "b": true}], [{"t": "How cool!", "b": false}, {"t": "kee leh-GAL", "b": false}, {"t": "Que legal!", "b": true}], [{"t": "So/right (very common filler)", "b": false}, {"t": "ehn-TOWNG", "b": false}, {"t": "Então", "b": true}], [{"t": "Thing/stuff (generic word)", "b": false}, {"t": "neh-GOH-syoo", "b": false}, {"t": "Negócio", "b": true}], [{"t": "Whatever/no worries", "b": false}, {"t": "vy lah", "b": false}, {"t": "Vai lá", "b": true}], [{"t": "No stress", "b": false}, {"t": "seng ish-TREH-see", "b": false}, {"t": "Sem estresse", "b": true}], [{"t": "Awesome/cool (very popular with young people)", "b": false}, {"t": "dah-OH-ruh", "b": false}, {"t": "Daora", "b": true}]]}], "tip": false}, {"title": "Full practice dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it aloud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "Bom dia! Seja bem-vindo. O que você vai querer?", "trans": "Good morning! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "Bom dia! Eu queria um café, por favor.", "trans": "Good morning! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "Só isso?", "trans": "Is that all?"}, {"speaker": "Customer:", "orig": "Sim, e a conta, por favor.", "trans": "Yes, and the bill, please."}, {"speaker": "Waiter:", "orig": "Deu dois euros. Obrigado!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "De nada, até logo!", "trans": "You're welcome, see you later!"}]}], "tip": false}, {"title": "Action plan: how to learn fast", "blocks": [{"type": "list", "label": "7 steps to lock in the language quickly", "intro": null, "items": ["Listen to Brazilian music (MPB, samba, funk) and watch telenovelas or shows every day.", "Practise «shadowing»: listen to a short sentence and repeat it immediately at the same rhythm.", "Brazilian Portuguese is easier on the ear than European Portuguese for a beginner — take advantage and practise speaking out loud from the start.", "Don't translate in your head — try to think directly in Portuguese.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary.", "Speak from day one, even if you make mistakes — fluency comes from practice.", "Get comfortable using «você» naturally — it's the most common form in everyday speech in Brazil."]}], "tip": true}, {"title": "Introduction: who is this book for?", "blocks": [{"type": "p", "html": "This book is the second part after «Learn Portuguese — Brazilian Portuguese, Easy, Fun and Fast», which covered the basics. If you've already finished the basic level and want to reach a level where you can genuinely get by while travelling, working, and living day to day in Brazil, this book will give you: the verb tenses you need, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "Before you start", "intro": null, "items": ["You should already know: greetings, pronouns, ser/estar, present-tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take each chapter slowly, and practise the examples out loud before moving on to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick review of the basic level", "blocks": [{"type": "table", "headers": ["eu", "você", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you (pl)/they", "b": true}]]}, {"type": "h3", "text": "Present tense — the regular patterns"}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "The past: Pretérito Perfeito and Imperfeito", "blocks": [{"type": "p", "html": "As in European Portuguese, Brazilian Portuguese distinguishes a completed, one-off action (Pretérito Perfeito) from a habitual or descriptive past (Imperfeito). It's a simple tense, with no auxiliary verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "você", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "The Imperfeito"}, {"type": "table", "headers": ["Pronoun", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "você", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Example: Quando eu era pequeno, morava em Londres (Imperfeito: description) — Ontem eu fui ao mercado (Pretérito Perfeito: one-off event). In everyday Brazilian speech you'll often hear «tava» instead of «estava» in casual registers.", "italic": false}], "tip": false}, {"title": "Future and conditional", "blocks": [{"type": "table", "headers": ["Use", "Formation", "Example"], "rows": [[{"t": "Near future (very common in speech)", "b": false}, {"t": "ir (present) + infinitive", "b": false}, {"t": "Vou viajar amanhã — I'm going to travel tomorrow", "b": true}], [{"t": "Simple future (more formal/written)", "b": false}, {"t": "infinitive + endings -ei, -á, -emos, -ão", "b": false}, {"t": "Viajarei ano que vem — I will travel next year", "b": true}], [{"t": "Conditional (hypothesis, politeness)", "b": false}, {"t": "infinitive + endings -ia, -ia, -íamos, -iam", "b": false}, {"t": "Eu queria um café — I would like a coffee", "b": true}]]}, {"type": "p", "html": "In Brazil, the near future (ir + infinitive) is by far the most common way to talk about the future in speech — the simple future stays more common in writing and formal registers.", "italic": false}], "tip": false}, {"title": "Reflexive verbs and object pronouns", "blocks": [{"type": "table", "headers": ["Subject pronoun", "Reflexive pronoun", "lavar-se (to wash oneself)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "eu me lavo", "b": true}], [{"t": "você", "b": false}, {"t": "se", "b": false}, {"t": "você se lava", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "nós nos lavamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "vocês se lavam", "b": true}]]}, {"type": "p", "html": "Unlike Portugal, in Brazil the object pronoun almost always goes before the verb in speech, just like in English: Eu te vejo (I see you), rather than \"Vejo-te\".", "italic": false}], "tip": false}, {"title": "Preposition + article contractions", "blocks": [{"type": "p", "html": "The same contractions from European Portuguese apply in Brazil:", "italic": false}, {"type": "table", "headers": ["Preposition", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Example: Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparatives, superlatives and advanced connectors", "blocks": [{"type": "table", "headers": ["Structure", "Portuguese (Brazil)", "Meaning"], "rows": [[{"t": "more... than", "b": false}, {"t": "mais... do que", "b": false}, {"t": "Ele é mais alto do que eu", "b": true}], [{"t": "less... than", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "as... as", "b": false}, {"t": "tão... quanto", "b": false}, {"t": "Ela é tão rápida quanto ele", "b": true}], [{"t": "the most", "b": false}, {"t": "b": false}, {"t": "plano de saúde", "b": true}]]}], "tip": false}, {"title": "Vocabulary: bank, police and official matters", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese (Brazil)"], "rows": [[{"t": "current account", "b": false}, {"t": "conta corrente", "b": true}], [{"t": "ATM", "b": false}, {"t": "caixa eletrônico", "b": true}], [{"t": "exchange rate", "b": false}, {"t": "taxa de câmbio", "b": true}], [{"t": "I've lost my wallet", "b": false}, {"t": "Perdi minha carteira", "b": true}], [{"t": "police report", "b": false}, {"t": "registro de boletim de ocorrência", "b": true}], [{"t": "police station", "b": false}, {"t": "delegacia de polícia", "b": true}], [{"t": "town hall", "b": false}, {"t": "prefeitura", "b": true}], [{"t": "residence permit", "b": false}, {"t": "visto de residência", "b": true}]]}], "tip": false}, {"title": "Vocabulary: transport and directions", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese (Brazil)"], "rows": [[{"t": "one-way ticket", "b": false}, {"t": "passagem só de ida", "b": true}], [{"t": "round trip", "b": false}, {"t": "ida e volta", "b": true}], [{"t": "car rental", "b": false}, {"t": "aluguel de carro", "b": true}], [{"t": "Turn right", "b": false}, {"t": "Vire à direita", "b": true}], [{"t": "Go straight ahead", "b": false}, {"t": "Siga em frente", "b": true}], [{"t": "traffic light", "b": false}, {"t": "sinal / semáforo", "b": true}], [{"t": "roundabout", "b": false}, {"t": "rotatória", "b": true}], [{"t": "platform", "b": false}, {"t": "plataforma", "b": true}], [{"t": "bus stop", "b": false}, {"t": "ponto de ônibus", "b": true}]]}], "tip": false}, {"title": "Vocabulary: shopping and work", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese (Brazil)"], "rows": [[{"t": "Can you give me a discount?", "b": false}, {"t": "Você pode me dar um desconto?", "b": true}], [{"t": "size (clothing)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "fitting room", "b": false}, {"t": "prov ", "lines": [{"speaker": "Guest:", "orig": "Bom dia, tem um problema com meu quarto, o ar-condicionado não funciona.", "trans": "Good morning, there's a problem with my room, the air conditioning isn't working."}, {"speaker": "Receptionist:", "orig": "Sinto muito, vou mandar alguém já. Prefere trocar de quarto enquanto isso?", "trans": "I'm very sorry, I'll send someone right away. Would you prefer to change rooms in the meantime?"}, {"speaker": "Guest:", "orig": "Sim, seria mais fácil, obrigado.", "trans": "Yes, that would be easier, thank you."}]}, {"type": "p", "html": "Scenario: at the doctor's.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "O que está acontecendo?", "trans": "What's wrong?"}, {"speaker": "Patient:", "orig": "Estou com dor de garganta há três dias e um pouco de febre.", "trans": "I've had a sore throat for three days and a bit of a fever."}, {"speaker": "Doctor:", "orig": "Vou receitar uns remédios. Descanse bastante.", "trans": "I'll prescribe some medicine. Get plenty of rest."}]}], "tip": false}, {"title": "Conclusion and next steps toward fluency", "blocks": [{"type": "list", "label": "How to keep improving", "intro": null, "items": ["Watch Brazilian telenovelas, shows and films with Portuguese subtitles to train your ear.", "Read a short article from an online Brazilian newspaper every day (Folha de S.Paulo, G1).", "Find a language exchange partner for conversation practice (tandem).", "Write a short daily diary of a few sentences in Portuguese.", "Don't fear mistakes: true fluency comes from consistent practice, and Brazilians are known for being patient with beginners."]}], "tip": true}], "closingBasic": "Good luck in advance on your Portuguese journey — Boa sorte!", "closingAdvanced": "Congratulations on how far you've come — Boa sorte!"}, "it": {"chapters": [{"title": "Introduzione: perché imparare il portoghese del Brasile?", "blocks": [{"type": "p", "html": "Il portoghese brasiliano è parlato da oltre 210 milioni di persone in Brasile, la variante di gran lunga più parlata del portoghese nel mondo. La sua pronuncia, più aperta e cantilenante di quella del Portogallo, è anche quella che si sente di più nella musica e nelle serie TV.", "italic": false}, {"type": "p", "html": "La buona notizia: il vocabolario di base resta molto vicino al portoghese europeo e all'italiano. La differenza principale nel parlato è che in Brasile quasi tutte le vocali si pronunciano chiaramente, a differenza del Portogallo dove sono spesso ridotte — il che rende in realtà il brasiliano più facile da capire per un principiante.", "italic": false}, {"type": "list", "label": "Obiettivi di questo libro", "intro": null, "items": ["Darti una base solida di vocabolario e grammatica essenziale nel minor tempo possibile.", "Concentrarci sulla pronuncia brasiliana autentica, più aperta e musicale.", "Darti frasi pratiche da usare fin dal primo giorno in situazioni reali."]}], "tip": false}, {"title": "L'alfabeto e le basi della pronuncia", "blocks": [{"type": "p", "html": "Il portoghese brasiliano usa lo stesso alfabeto del portoghese europeo, ma le vocali si pronunciano in modo più aperto e completo. Questa tabella presenta i suoni più distintivi:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Parola"], "rows": [[{"t": "casa", "b": false}, {"t": "kaza", "b": false}, {"t": "casa", "b": true}], [{"t": "buongiorno", "b": false}, {"t": "bon djia", "b": false}, {"t": "bom dia (d davanti a i = «dj»)", "b": true}], [{"t": "grazie", "b": false}, {"t": "obrigadu/a", "b": false}, {"t": "obrigado / obrigada", "b": true}], [{"t": "gatto", "b": false}, {"t": "gatu", "b": false}, {"t": "gato", "b": true}], [{"t": "io", "b": false}, {"t": "éu", "b": false}, {"t": "eu", "b": true}], [{"t": "ragazzo", "b": false}, {"t": "hapàz", "b": false}, {"t": "rapaz (la r iniziale si pronuncia come una h aspirata in Brasile)", "b": true}], [{"t": "pane", "b": false}, {"t": "pãu (nasale)", "b": false}, {"t": "pão", "b": true}], [{"t": "acqua", "b": false}, {"t": "àgua", "b": false}, {"t": "água", "b": true}], [{"t": "uovo", "b": false}, {"t": "òvu", "b": false}, {"t": "ovo", "b": true}], [{"t": "vino", "b": false}, {"t": "vignu (nasale)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "Le regole d'oro per una pronuncia autentica", "blocks": [{"type": "p", "html": "Queste 6 regole d'oro fanno la maggiore differenza per suonare davvero brasiliano:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["A differenza del Portogallo, il portoghese del Brasile pronuncia quasi tutte le vocali chiaramente — un netto vantaggio per un principiante.", "La r a inizio parola (o rr) si pronuncia come una h aspirata, vicina alla r francese o spagnola dura (rato → «hatu»).", "La d e la t seguite da i si pronunciano «dj» e «tch» (dia → «djia», noite → «nòitchi»).", "Il suono «ão» resta una vocale nasale, ma un po' più aperta che in Portogallo — praticala come una «a» seguita da una «o» nasale.", "Il gruppo lh si pronuncia come il «gli» italiano (filho) — già familiare!", "La s a fine parola si pronuncia generalmente «ss», e non «sh» come in Portogallo (dois → «doiss», non «doish»)."]}], "tip": false}, {"title": "Saluti e frasi essenziali", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Portoghese (Brasile)"], "rows": [[{"t": "Buongiorno (mattina)", "b": false}, {"t": "bon djia", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Buonasera/buon pomeriggio", "b": false}, {"t": "bòa tardji", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Ciao (informale)", "b": false}, {"t": "oi", "b": false}, {"t": "Oi", "b": true}], [{"t": "Come stai?", "b": false}, {"t": "kòmu vosê eshtà", "b": false}, {"t": "Como você está?", "b": true}], [{"t": "Bene, grazie", "b": false}, {"t": "being, obrigadu", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Piacere", "b": false}, {"t": "prazér", "b": false}, {"t": "Prazer", "b": true}], [{"t": "A presto", "b": false}, {"t": "atè lògu", "b": false}, {"t": "Até logo", "b": true}], [{"t": "A domani", "b": false}, {"t": "atè amagniã", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Arrivederci", "b": false}, {"t": "ciàu", "b": false}, {"t": "Tchau", "b": true}], [{"t": "Per favore", "b": false}, {"t": "por favòr", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Grazie", "b": false}, {"t": "obrigadu/a", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "Prego", "b": false}, {"t": "dji nada", "b": false}, {"t": "De nada", "b": true}], [{"t": "Scusa", "b": false}, {"t": "deshkùlpa", "b": false}, {"t": "Desculpa", "b": true}], [{"t": "Sì", "b": false}, {"t": "sing", "b": false}, {"t": "Sim", "b": true}], [{"t": "No", "b": false}, {"t": "nãu", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "I pronomi e i verbi «ser» ed «estar» (essere)", "blocks": [{"type": "p", "html": "Come in Portogallo, il brasiliano distingue «ser» (identità permanente) ed «estar» (stato temporaneo). Grande differenza pratica: in Brasile, «você» sostituisce ampiamente «tu» nell'uso corrente, anche tra amici, e si coniuga alla terza persona.", "italic": false}, {"type": "h3", "text": "Pronomi"}, {"type": "table", "headers": ["Italiano", "Portoghese (Brasile)"], "rows": [[{"t": "io", "b": false}, {"t": "eu", "b": true}], [{"t": "tu (informale)", "b": false}, {"t": "você", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "noi", "b": false}, {"t": "nós / a gente", "b": true}], [{"t": "voi", "b": false}, {"t": "vocês", "b": true}], [{"t": "loro", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — essere (permanente)"}, {"type": "table", "headers": ["Pronome", "Coniugazione"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "você", "b": false}, {"t": "é", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "é", "b": true}], [{"t": "nós", "b": false}, {"t": "somos", "b": true}], [{"t": "vocês", "b": false}, {"t": "são", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "são", "b": true}]]}, {"type": "p", "html": "Esempio: Eu sou italiano — Sono italiano. — Eu estou em São Paulo — Sono (ora) a San Paolo. Nel parlato, molti brasiliani dicono anche «a gente» al posto di «nós» (a gente é italiano, con verbo alla 3ª persona singolare).", "italic": false}], "tip": false}, {"title": "Verbi comuni e la loro coniugazione", "blocks": [{"type": "p", "html": "I verbi regolari si dividono in tre gruppi secondo la desinenza: -ar, -er, -ir. In Brasile, la coniugazione corrente usa «você» al posto di «tu» (terza persona singolare).", "italic": false}, {"type": "table", "headers": ["Pronome", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "você", "b": false}, {"t": "fala", "b": false}, {"t": "come", "b": false}, {"t": "parte", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}, {"type": "h3", "text": "Verbi irregolari importanti (forma «eu»)"}, {"type": "table", "headers": ["Significato", "eu", "Verbo"], "rows": [[{"t": "avere", "b": false}, {"t": "tenho", "b": false}, {"t": "ter", "b": true}], [{"t": "andare", "b": false}, {"t": "vou", "b": false}, {"t": "ir", "b": true}], [{"t": "fare", "b": false}, {"t": "faço", "b": false}, {"t": "fazer", "b": true}], [{"t": "potere", "b": false}, {"t": "posso", "b": false}, {"t": "poder", "b": true}], [{"t": "volere", "b": false}, {"t": "quero", "b": false}, {"t": "querer", "b": true}], [{"t": "sapere", "b": false}, {"t": "sei", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "I numeri da 0 a 100", "blocks": [{"type": "table", "headers": ["Nº", "Portoghese (Brasile)", "Nº", "Portoghese (Brasile)"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": true}], [{"t": "1", "b": false}, {"t": "um", "b": false}, {"t": "12", "b": false}, {"t": "doze", "b": true}], [{"t": "2", "b": false}, {"t": "dois", "b": false}, {"t": "13", "b": false}, {"t": "treze", "b": true}], [{"t": "3", "b": false}, {"t": "três", "b": false}, {"t": "14", "b": false}, {"t": "quatorze", "b": true}], [{"t": "4", "b": false}, {"t": "quatro", "b": false}, {"t": "15", "b": false}, {"t": "quinze", "b": true}], [{"t": "5", "b": false}, {"t": "cinco", "b": false}, {"t": "16", "b": false}, {"t": "dezesseis", "b": true}], [{"t": "6", "b": false}, {"t": "seis", "b": false}, {"t": "17", "b": false}, {"t": "dezessete", "b": true}], [{"t": "7", "b": false}, {"t": "sete", "b": false}, {"t": "18", "b": false}, {"t": "dezoito", "b": true}], [{"t": "8", "b": false}, {"t": "oito", "b": false}, {"t": "19", "b": false}, {"t": "dezenove", "b": true}], [{"t": "9", "b": false}, {"t": "nove", "b": false}, {"t": "20", "b": false}, {"t": "vinte", "b": true}], [{"t": "10", "b": false}, {"t": "dez", "b": false}, {"t": "30", "b": false}, {"t": "trinta", "b": true}]]}, {"type": "table", "headers": ["Nº", "Portoghese (Brasile)", "Nº", "Portoghese (Brasile)"], "rows": [[{"t": "40", "b": false}, {"t": "quarenta", "b": false}, {"t": "80", "b": false}, {"t": "oitenta", "b": true}], [{"t": "50", "b": false}, {"t": "cinquenta", "b": false}, {"t": "90", "b": false}, {"t": "noventa", "b": true}], [{"t": "60", "b": false}, {"t": "sessenta", "b": false}, {"t": "100", "b": false}, {"t": "cem", "b": true}], [{"t": "70", "b": false}, {"t": "setenta", "b": false}, {"t": "", "b": false}, {"t": "", "b": true}]]}, {"type": "p", "html": "Attenzione all'ortografia: il Brasile scrive dezesseis, dezessete, dezenove, mentre il Portogallo scrive dezasseis, dezassete, dezanove — una piccola differenza ereditata dalla riforma ortografica.", "italic": t": "Non capisco", "b": false}, {"t": "nãu entendu", "b": false}, {"t": "Não entendo", "b": true}], [{"t": "Può ripetere, per favore?", "b": false}, {"t": "pòdji repetìr", "b": false}, {"t": "Pode repetir, por favor?", "b": true}], [{"t": "Parla italiano?", "b": false}, {"t": "vosê fala itàliàno", "b": false}, {"t": "Você fala italiano?", "b": true}], [{"t": "Vorrei prenotare una camera", "b": false}, {"t": "kéria rezervàr um kuàrtu", "b": false}, {"t": "Queria reservar um quarto", "b": true}], [{"t": "A che ora parte il treno?", "b": false}, {"t": "a ke òrash sai u treng", "b": false}, {"t": "A que horas sai o trem?", "b": true}], [{"t": "Dove posso prendere un taxi?", "b": false}, {"t": "ondji pòssu pegàr um tàxi", "b": false}, {"t": "Onde posso pegar um táxi?", "b": true}]]}], "tip": false}, {"title": "Espressioni e slang brasiliano autentico", "blocks": [{"type": "p", "html": "Queste espressioni fanno la differenza tra un portoghese «da manuale» e un portoghese che suona davvero brasiliano. Usale al momento giusto:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Espressione"], "rows": [[{"t": "Va bene/d'accordo", "b": false}, {"t": "belèza", "b": false}, {"t": "Beleza", "b": true}], [{"t": "Fantastico!", "b": false}, {"t": "ke legàl", "b": false}, {"t": "Que legal!", "b": true}], [{"t": "Certo/esattamente (intercalare comune)", "b": false}, {"t": "entãu", "b": false}, {"t": "Então", "b": true}], [{"t": "Coso/roba (parola generica)", "b": false}, {"t": "negòssiu", "b": false}, {"t": "Negócio", "b": true}], [{"t": "Boh (indifferenza)", "b": false}, {"t": "vai là", "b": false}, {"t": "Vai lá", "b": true}], [{"t": "Nessun problema", "b": false}, {"t": "seng eshtressi", "b": false}, {"t": "Sem estresse", "b": true}], [{"t": "Fantastico/bello (molto usato dai giovani)", "b": false}, {"t": "daòra", "b": false}, {"t": "Daora", "b": true}]]}], "tip": false}, {"title": "Dialogo pratico completo", "blocks": [{"type": "p", "html": "Un dialogo semplice in un caffè — leggilo ad alta voce più volte e prova a imitare la pronuncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Garçom:", "orig": "Bom dia! Seja bem-vindo. O que você vai querer?", "trans": "Buongiorno! Benvenuto. Cosa desidera?"}, {"speaker": "Cliente:", "orig": "Bom dia! Eu queria um café, por favor.", "trans": "Buongiorno! Vorrei un caffè, per favore."}, {"speaker": "Garçom:", "orig": "Só isso?", "trans": "Solo questo?"}, {"speaker": "Cliente:", "orig": "Sim, e a conta, por favor.", "trans": "Sì, e il conto, per favore."}, {"speaker": "Garçom:", "orig": "Deu dois euros. Obrigado!", "trans": "Sono due euro. Grazie!"}, {"speaker": "Cliente:", "orig": "De nada, até logo!", "trans": "Prego, a presto!"}]}], "tip": false}, {"title": "Piano d'azione: come imparare in fretta", "blocks": [{"type": "list", "label": "7 passi per progredire velocemente", "intro": null, "items": ["Ascolta musica brasiliana (MPB, samba, funk) e guarda telenovelas o serie ogni giorno.", "Pratica lo «shadowing»: ascolta una frase breve e ripetila subito con lo stesso ritmo.", "Il brasiliano è più facile all'orecchio del portoghese europeo per un principiante — approfittane per esercitarti ad alta voce fin dall'inizio.", "Non tradurre nella tua testa — prova a pensare direttamente in portoghese.", "Usa un'app come Duolingo o Babbel insieme a questo libro per rinforzare il vocabolario.", "Parla fin dal primo giorno, anche se sbagli — la scioltezza viene dalla pratica.", "Abituati a usare «você» in modo naturale — è la forma più comune nel parlato in Brasile."]}], "tip": true}, {"title": "Introduzione: per chi è questo libro?", "blocks": [{"type": "p", "html": "Questo libro è la seconda parte dopo «Imparare il Portoghese del Brasile — Facile, Divertente e Veloce», che ha coperto le basi. Se hai già finito il livello base e vuoi raggiungere un livello che ti permetta davvero di cavartela in viaggio, al lavoro e nella vita quotidiana in Brasile, questo libro ti darà: i tempi verbali di cui hai bisogno, vocabolario pratico, e dialoghi realistici.", "italic": false}, {"type": "list", "label": "Prima di iniziare", "intro": null, "items": ["Dovresti già conoscere: saluti, pronomi, ser/estar, la coniugazione del presente e i numeri — tutto questo è nel libro base.", "Il nostro obiettivo qui non è insegnarti tutto sulla lingua, ma darti abbastanza strumenti per cavartela da solo.", "Vai con calma in ogni capitolo, e pratica gli esempi ad alta voce."]}], "tip": false, "dividerBefore": true}, {"title": "Ripasso veloce del livello base", "blocks": [{"type": "table", "headers": ["eu", "você", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "io", "b": false}, {"t": "tu/lei", "b": false}, {"t": "lui/lei", "b": false}, {"t": "noi", "b": false}, {"t": "voi/loro", "b": true}]]}, {"type": "h3", "text": "Presente — gli schemi regolari"}, {"type": "table", "headers": ["Pronome", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "Il passato: Pretérito Perfeito e Imperfeito", "blocks": [{"type": "p", "html": "Come nel portoghese europeo, il brasiliano distingue un'azione puntuale e conclusa (Pretérito Perfeito) da un'azione abituale o descrittiva (Imperfeito). È un tempo semplice, senza ausiliare:", "italic": false}, {"type": "table", "headers": ["Pronome", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "você", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "L'Imperfeito"}, {"type": "table", "headers": ["Pronome", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "você", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Esempio: Quando eu era pequeno, morava em Roma (Imperfeito: descrizione) — Ontem eu fui ao mercado (Pretérito Perfeito: fatto puntuale). Nel parlato in Brasile, si sente spesso «tava» al posto di «estava» in un registro informale.", "italic": false}], "tip": false}, {"title": "Il futuro e il condizionale", "blocks": [{"type": "table", "headers": ["Uso", "Formazione", "Esempio"], "rows": [[{"t": "Futuro prossimo (molto usato a voce)", "b": false}, {"t": "ir (presente) + infinito", "b": false}, {"t": "Vou viajar amanhã — Sto per viaggiare domani", "b": true}], [{"t": "Futuro semplice (più formale/scritto)", "b": false}, {"t": "infinito + terminazioni -ei, -á, -emos, -ão", "b": false}, {"t": "Viajarei ano que vem — Viaggerò l'anno prossimo", "b": true}], [{"t": "Condizionale (ipotesi, cortesia)", "b": false}, {"t": "infinito + terminazioni -ia, -ia, -íamos, -iam", "b": false}, {"t": "Eu queria um café — Vorrei un caffè", "b": true}]]}, {"type": "p", "html": "In Brasile, nel parlato, il futuro prossimo (ir + infinito) è di gran lunga la forma più usata per parlare del futuro — il futuro semplice resta più frequente nello scritto e in un registro sostenuto.", "italic": false}], "tip": false}, {"title": "Verbi pronominali e pronomi complemento", "blocks": [{"type": "table", "headers": ["Pronome soggetto", "Pronome riflessivo", "lavar-se (lavarsi)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "eu me lavo", "b": true}], [{"t": "você", "b": false}, {"t": "se", "b": false}, {"t": "você se lava", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "nós nos lavamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "vocês se lavam", "b": true}]]}, {"type": "p", "html": "A differenza del Portogallo, in Brasile il pronome complemento si colloca quasi sempre prima del verbo nel parlato, come in italiano: Eu te vejo (Ti vedo), invece di «Vejo-te».", "italic": false}], "tip": false}, {"title": "Le contrazioni delle preposizioni", "blocks": [{"type": "p", "html": "Le stesse contrazioni del portoghese europeo si applicano in Brasile:", "italic": false}, {"type": "table", "headers": ["Preposizione", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Esempio: Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparativi, superlativi e connettori avanzati", "blocks": [{"type": "table", "headers": ["Struttura", "Portoghese (Brasile)", "Significato"], "rows": [[{"t": "più... di", "b": false}, {"t": "mais... do que", "b": false}, {"t": "Ele é mais alto do que eu", "b": true}], [{"t": "meno... di", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "tanto quanto", "b": false}, {"t": "tão... quanto", "b": false}, {"t": "Ela é tão rápida quanto ele", "b": true}], [{"t": "il più/la più", "b": false}, {"t": "o mais / a mais", "b": false}, {"t": "É o bairro mais bonito", "b": true}], [{"t": "tuttavia", "b": false}, {"t": "no entanto / porém", "b": false}, {"t": "connettore di contrasto", "b": true}], [{"t": "quindi", "b": false}, {"t": "então / portanto", "b": false}, {"t": "connettore di conseguenza", "b": true}], [{"t": "sebbene", "b": false}, {"t": "embora (+ congiuntivo)", "b": false}, {"t": "connettore di concessione", "b": true}]]}], "tip": false}, {"title": "Vocabolario: aeroporto e dogana", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese (Brasile)"], "rows": [[{"t": "carta d'imbarco", "b": false}, {"t": "cartão de embarque", "b": true}], [{"t": "bagaglio a mano", "b": false}, {"t": "bagagem de mão", "b": true}], [{"t": "ritiro bagagli", "b": false}, {"t": "retirada de bagagem", "b": true}], [{"t": "volo in ritardo", "b": false}, {"t": "voo atrasado", "b": true}], [{"t": "dogana", "b": false}, {"t": "alfândega", "b": true}], [{"t": "passaporto", "b": false}, {"t": "passaporte", "b": true}], [{"t": "niente da dichiarare", "b": false}, {"t": "nada a declarar", "b": true}], [{"t": "porta d'imbarco", "b": false}, {"t": "portão de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabolario: albergo, salute ed emergenze", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese (Brasile)"], "rows": [[{"t": "Non c'è acqua calda", "b": false}, {"t": "Não tem água quente", "b": true}], [{"t": "La camera non è pronta", "b": false}, {"t": "O quarto não está pronto", "b": true}], [{"t": "Vorrei cambiare camera", "b": false}, {"t": "Eu queria trocar de quarto", "b": true}], [{"t": "farmacia", "b": false}, {"t": "farmácia", "b": true}], [{"t": "Ho bisogno di un medico", "b": false}, {"t": "Preciso de um médico", "b": true}], [{"t": "Mi fa male qui", "b": false}, {"t": "Está doendo aqui", "b": true}], [{"t": "Chiamate un'ambulanza!", "b": false}, {"t": "Chama uma ambulância!", "b": true}], [{"t": "ospedale", "b": false}, {"t": "hospital", "b": true}], [{"t": "assicurazione sanitaria", "b": false}, {"t": "plano de saúde", "b": true}]]}], "tip": false}, {"title": "Vocabolario: banca, polizia e uffici", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese (Brasile)"], "rows": [[{"t": "conto corrente", "b": false}, {"t": "conta corrente", "b": true}], [{"t": "bancomat", "b": false}, {"t": "caixa eletrônico", "b": true}], [{"t": "tasso di cambio", "b": false}, {"t": "taxa de câmbio", "b": true}], [{"t": "Ho perso il mio portafoglio", "b": false}, {"t": "Perdi minha carteira", "b": true}], [{"t": "denuncia", "b": false}, {"t": "registro de boletim de ocorrência", "b": true}], [{"t": "commissariato", "b": false}, {"t": "delegacia de polícia", "b": true}], [{"t": "comune/municipio", "b": false}, {"t": "prefeitura", "b": true}], [{"t": "permesso di soggiorno", "b": false}, {"t": "visto de residência", "b": true}]]}], "tip": false}, {"title": "Vocabolario: trasporti e indicazioni", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese (Brasile)"], "rows": [[{"t": "biglietto di sola andata", "b": false}, {"t": "passagem só de ida", "b": true}], [{"t": "andata e ritorno", "b": false}, {"t": "ida e volta", "b": true}], [{"t": "noleggio auto", "b": false}, {"t": "aluguel de carro", "b": true}], [{"t": "Giri a destra", "b": false}, {"t": "Vire à direita", "b": true}], [{"t": "Vada dritto", "b": false}, {"t": "Siga em frente", "b": true}], [{"t": "semaforo", "b": false}, {"t": "sinal / semáforo", "b": true}], [{"t": "rotatoria", "b": false}, {"t": "rotatória", "b": true}], [{"t": "binario", "b": false}, {"t": "plataforma", "b": true}], [{"t": "fermata dell'autobus", "b": false}, {"t": "ponto de ônibus", "b": true}]]}], "tip": false}, {"title": "Vocabolario: shopping e lavoro", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese (Brasile)"], "rows": [[{"t": "Può farmi uno sconto?", "b": false}, {"t": "Você pode me dar um desconto?", "b": true}], [{"t": "taglia (vestiti)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "camerino", "b": false}, {"t": "provador", "b": true}], [{"t": "riunione", "b": false}, {"t": "reunião", "b": true}], [{"t": "scadenza", "b": false}, {"t": "prazo", "b": true}], [{"t": "candidatura di lavoro", "b": false}, {"t": "candidatura", "b": true}], [{"t": "colloquio", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "stipendio", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Galateo: você e i registri di cortesia", "blocks": [{"type": "p", "html": "In Brasile, «você» si usa quasi ovunque, anche con sconosciuti, e il brasiliano parlato è complessivamente più informale e caloroso del portoghese europeo. Il vero segno di rispetto passa soprattutto dal tono e dall'uso di «o senhor / a senhora» con le persone anziane o in contesti molto formali (banca, amministrazione).", "italic": false}, {"type": "list", "label": "Regole pratiche", "intro": null, "items": ["Con la maggior parte delle persone, anche sconosciuti: você va benissimo, anche in contesto professionale corrente.", "Con persone anziane o in contesti molto formali (amministrazione, colloquio di lavoro): o senhor / a senhora.", "Le email formali si aprono con «Prezado(a)» e si chiudono con «Atenciosamente»."]}], "tip": false}, {"title": "Espressioni idiomatiche avanzate", "blocks": [{"type": "table", "headers": ["Significato", "Espressione"], "rows": [[{"t": "Costare un occhio della testa", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "Avere la testa fra le nuvole", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "Fare finta di niente", "b": false}, {"t": "Fazer de conta que nada aconteceu", "b": true}], [{"t": "Essere al verde", "b": false}, {"t": "Estar duro / sem grana", "b": true}], [{"t": "Mettersi nei guai", "b": false}, {"t": "Se meter numa enrascada", "b": true}], [{"t": "Rompere il ghiaccio", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Dialoghi pratici avanzati", "blocks": [{"type": "p", "html": "Scenario: risolvere un problema in albergo.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Hóspede:", "orig": "Bom dia, tem um problema com meu quarto, o ar-condicionado não funciona.", "trans": "Buongiorno, c'è un problema con la mia camera, l'aria condizionata non funziona."}, {"speaker": "Recepcionista:", "orig": "Sinto muito, vou mandar alguém já. Prefere trocar de quarto enquanto isso?", "trans": "Mi dispiace tantissimo, mando subito qualcuno. Preferisce cambiare camera nel frattempo?"}, {"speaker": "Hóspede:", "orig": "Sim, seria mais fácil, obrigado.", "trans": "Sì, sarebbe più semplice, grazie."}]}, {"type": "p", "html": "Scenario: dal medico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "O que está acontecendo?", "trans": "Cosa non va?"}, {"speaker": "Paciente:", "orig": "Estou com dor de garganta há três dias e um pouco de febre.", "trans": "Ho mal di gola da tre giorni e ho un po' di febbre."}, {"speaker": "Médico:", "orig": "Vou receitar uns remédios. Descanse bastante.", "trans": "Le prescriverò dei medicinali. Riposi molto."}]}], "tip": false}, {"title": "Conclusione e prossimi passi verso la scioltezza", "blocks": [{"type": "list", "label": "Come continuare a progredire", "intro": null, "items": ["Guarda telenovelas, serie e film brasiliani con sottotitoli in portoghese per abituare l'orecchio.", "Leggi ogni giorno un breve articolo di un giornale brasiliano online (Folha de S.Paulo, G1).", "Trova un partner linguistico per fare scambi di conversazione (tandem).", "Scrivi un diario giornaliero di poche frasi in portoghese.", "Non temere gli errori: la scioltezza vera nasce dalla pratica costante, e i brasiliani sono noti per la loro pazienza con i principianti."]}], "tip": true}], "closingBasic": "Congratulazioni in anticipo per il tuo viaggio nel portoghese — Boa sorte! (buona fortuna!)", "closingAdvanced": "Congratulazioni in anticipo per il tuo viaggio nel portoghese brasiliano — Boa sorte!"}, "fr": {"chapters": [{"title": "Introduction : pourquoi apprendre le portugais du Brésil ?", "blocks": [{"type": "p", "html": "Le portugais brésilien est parlé par plus de 210 millions de personnes au Brésil, ce qui en fait de loin la variante la plus parlée du portugais dans le monde. Sa prononciation, plus ouverte et plus chantante que celle du Portugal, est aussi celle que l'on entend le plus dans la musique et les séries.", "italic": false}, {"type": "p", "html": "La bonne nouvelle : le vocabulaire de base reste très proche du portugais européen et du français. La principale différence à l'oral est que les voyelles se prononcent presque toutes clairement au Brésil, contrairement au Portugal où elles sont souvent réduites — ce qui rend en réalité le brésilien plus facile à comprendre pour un débutant.", "italic": false}, {"type": "list", "label": "Objectifs de ce livre", "intro": null, "items": ["Te donner une base solide de vocabulaire et de grammaire essentielle en un minimum de temps.", "Te concentrer sur la prononciation brésilienne authentique, plus ouverte et musicale.", "Te donner des phrases pratiques utilisables dès le premier jour dans des situations réelles."]}], "tip": false}, {"title": "L'alphabet et les bases de la prononciation", "blocks": [{"type": "p", "html": "Le portugais brésilien utilise le même alphabet que le portugais européen, mais les voyelles sont prononcées de façon plus ouverte et plus complète. Ce tableau présente les sons les plus distinctifs :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Mot"], "rows": [[{"t": "maison", "b": false}, {"t": "kaza", "b": false}, {"t": "casa", "b": true}], [{"t": "bonjour", "b": false}, {"t": "bonn djia", "b": false}, {"t": "bom dia (d devant i = « dji »)", "b": true}], [{"t": "merci", "b": false}, {"t": "obrigadou / obrigada", "b": false}, {"t": "obrigado / obrigada", "b": true}], [{"t": "chat", "b": false}, {"t": "gatou", "b": false}, {"t": "gato", "b": true}], [{"t": "je", "b": false}, {"t": "éou", "b": false}, {"t": "eu", "b": true}], [{"t": "garçon", "b": false}, {"t": "hapaz", "b": false}, {"t": "rapaz (le r initial se prononce comme un h aspiré au Brésil)", "b": true}], [{"t": "pain", "b": false}, {"t": "pãou (nasal)", "b": false}, {"t": "pão", "b": true}], [{"t": "eau", "b": false}, {"t": "agoua", "b": false}, {"t": "água", "b": true}], [{"t": "œuf", "b": false}, {"t": "ovou", "b": false}, {"t": "ovo", "b": true}], [{"t": "vin", "b": false}, {"t": "vign-you (nasal)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "Les règles d'or pour une prononciation authentique", "blocks": [{"type": "p", "html": "Ces 6 règles d'or feront toute la différence pour sonner vraiment brésilien :", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Contrairement au Portugal, le portugais du Brésil prononce presque toutes les voyelles clairement — un net avantage pour un débutant.", "Le r en début de mot (ou rr) se prononce comme un h aspiré, proche du r français ou espagnol dur (rato → « hatou »).", "Le d et le t suivis d'un i se prononcent « dji » et « tchi » (dia → « djia », noite → « noitchi »).", "Le son « ão » reste une voyelle nasale, mais un peu plus ouverte qu'au Portugal — pratique-la comme un « an » suivi d'un « on » nasal.", "Le lh se prononce comme le « ll » espagnol ou le « gli » italien (filho).", "Le s en fin de mot se prononce généralement « ss », et non « ch » comme au Portugal (dois → « doiss », pas « doich »)."]}], "tip": false}, {"title": "Salutations et phrases essentielles", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Portugais (Brésil)"], "rows": [[{"t": "Bonjour (matin)", "b": false}, {"t": "bonn djia", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Bonsoir/bonne après-midi", "b": false}, {"t": "boa tardji", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Salut (informel)", "b": false}, {"t": "oii", "b": false}, {"t": "Oi", "b": true}], [{"t": "Comment ça va ?", "b": false}, {"t": "komou vosê eshta", "b": false}, {"t": "Como você está?", "b": true}], [{"t": "Bien, merci", "b": false}, {"t": "bem, obrigadou", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Enchanté", "b": false}, {"t": "prazer", "b": false}, {"t": "Prazer", "b": true}], [{"t": "À bientôt", "b": false}, {"t": "atté logou", "b": false}, {"t": "Até logo", "b": true}], [{"t": "À demain", "b": false}, {"t": "atté amanyan", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Au revoir", "b": false}, {"t": "tchaou", "b": false}, {"t": "Tchau", "b": true}], [{"t": "S'il te plaît", "b": false}, {"t": "por favorr", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Merci", "b": false}, {"t": "obrigadou/a", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "De rien", "b": false}, {"t": "dji nada", "b": false}, {"t": "De nada", "b": true}], [{"t": "Pardon/Excusez-moi", "b": false}, {"t": "desculpa", "b": false}, {"t": "Desculpa", "b": true}], [{"t": "Oui", "b": false}, {"t": "sim", "b": false}, {"t": "Sim", "b": true}], [{"t": "Non", "b": false}, {"t": "nãou", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "Les pronoms et les verbes « ser » et « estar » (être)", "blocks": [{"type": "p", "html": "Comme au Portugal, le brésilien distingue « ser » (identité permanente) et « estar » (état temporaire). Grande différence pratique : au Brésil, « você » remplace largement « tu » dans l'usage courant, y compris entre amis, et se conjugue à la troisième personne.", "italic": false}, {"type": "h3", "text": "Pronoms"}, {"type": "table", "headers": ["Français", "Portugais (Brésil)"], "rows": [[{"t": "je", "b": false}, {"t": "eu", "b": true}], [{"t": "tu/vous (informel)", "b": false}, {"t": "você", "b": true}], [{"t": "il/elle", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "nous", "b": false}, {"t": "nós / a gente", "b": true}], [{"t": "vous (pluriel)", "b": false}, {"t": "vocês", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — être (permanent)"}, {"type": "table", "headers": ["Pronom", "Conjugaison"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "você", "
