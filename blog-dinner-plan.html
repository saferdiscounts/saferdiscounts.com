<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Guide</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:ital,wght@0,500;0,600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

a por seção."}, {"title": "Cozinhe na ordem que quiser", "body": "Os dias são numerados por organização, não por obrigação. Guarde a receita mais rápida para o dia mais corrido."}, {"title": "Use as dicas de substituição", "body": "Cada receita se adapta às suas necessidades alimentares ou à proteína que estiver em promoção — sem precisar improvisar."}, {"title": "Não desperdice as sobras", "body": "Cada receita já traz uma sugestão pronta pro que sobrar no dia seguinte."}]}, "shopping": {"eyebrow": "SUA ÚNICA IDA AO MERCADO", "title": "Lista de compras", "note": "Sal, pimenta e azeite são considerados itens básicos que você já tem — por isso não estão na lista.", "categories": [{"name": "Hortifrúti", "items": ["1 limão siciliano", "1 kg de legumes variados", "1 cebola amarela", "4 dentes de alho", "2 pimentões", "1 cabeça pequena de brócolis", "1 limão-taiti", "Coentro fresco (opcional)", "1 abobrinha ou vagem"]}, {"name": "Laticínios", "items": ["Manteiga", "Creme de leite fresco", "Queijo parmesão", "Queijo ralado"]}, {"name": "Proteína", "items": ["4 sobrecoxas ou peitos de frango", "500g de carne moída", "500g de camarão grande", "500g de peru moído", "4 filés de salmão"]}, {"name": "Despensa", "items": ["1 pacote de macarrão", "1 lata de tomate pelado", "1 xícara de arroz", "Molho de soja · Mel", "Tempero para taco", "Tortilhas pequenas", "Caldo (1 xícara)"]}]}, "recipes": [{"title": "Frango ao Alho e Limão na Assadeira", "time": "35 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 sobrecoxas ou peitos de frango", "1 kg de legumes variados, picados", "3 dentes de alho, picados", "1 limão siciliano, fatiado", "3 colheres (sopa) de azeite", "Sal e pimenta"], "steps": ["Preaqueça o forno a 220°C.", "Misture os legumes com 2 colheres de azeite, alho, sal e pimenta na assadeira.", "Tempere o frango com o azeite restante, sal e pimenta; acomode na assadeira.", "Cubra o frango com as fatias de limão.", "Asse por 22–25 min, até o frango atingir 74°C internamente."], "swap": "Sem forma própria pro forno? Doure o frango na frigideira 6–7 min de cada lado e asse os legumes à parte. Vegano: troque por tofu firme (asse por 18 min).", "leftover": "Desfie e misture com folhas verdes e limão para uma salada rápida no almoço."}, {"title": "Macarrão Cremoso de Tomate na Panela Única", "time": "20 min", "serves": "Serve 4", "equip": "1 panela", "ing": ["1 pacote de macarrão", "1 lata de tomate pelado", "1/2 xícara de creme de leite", "3 dentes de alho, picados", "1/2 xícara de parmesão ralado", "2 colheres (sopa) de azeite", "Sal, pimenta e pimenta calabresa (opcional)"], "steps": ["Aqueça o azeite numa panela grande; refogue o alho por 1 min até perfumar.", "Adicione o tomate pelado e 500ml de água; deixe ferver.", "Junte o macarrão direto na panela; cozinhe por 12–14 min, mexendo de vez em quando.", "Fora do fogo, misture o creme de leite e o parmesão. Ajuste o sal."], "swap": "Adicione frango cozido, camarão ou feijão branco para deixar mais substancioso. Sem lactose? Use leite de coco integral.", "leftover": "Esquenta bem com um pouco de água ou leite para soltar o molho."}, {"title": "Carne com Brócolis na Frigideira em 15 Minutos", "time": "15 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de carne moída (ou proteína vegetal)", "1 cabeça pequena de brócolis, em pedaços pequenos", "3 colheres (sopa) de molho de soja", "1 colher (sopa) de mel", "2 dentes de alho, picados", "1 colher (sopa) de óleo", "Arroz cozido, para servir"], "steps": ["Aqueça o óleo numa frigideira grande em fogo alto. Doure a carne, desmanchando, por ~5 min.", "Adicione o brócolis e o alho; refogue por 4–5 min até o verde ficar vivo.", "Misture o molho de soja e o mel; cozinhe por mais 1 min.", "Sirva sobre arroz."], "swap": "Peru moído, frango ou tempeh esfarelado também funcionam. Qualquer legume de cozimento rápido substitui o brócolis.", "leftover": "Congela bem por até 2 meses — porcione antes de adicionar o arroz."}, {"title": "Frango Fajita na Assadeira", "time": "30 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 sobrecoxas de frango, fatiadas (ou 1 lata de grão-de-bico)", "2 pimentões, fatiados", "1 cebola amarela, fatiada", "2 colheres (sopa) de tempero para taco", "2 colheres (sopa) de óleo", "1 xícara de arroz cozido", "1 limão-taiti · Coentro (opcional)"], "steps": ["Preaqueça o forno a 220°C.", "Misture o frango, os pimentões e a cebola com óleo e tempero para taco na assadeira.", "Asse por 18–20 min, mexendo uma vez, até as bordas ficarem tostadas.", "Sirva sobre arroz com limão e coentro."], "swap": "Noite vegetariana — troque o frango por uma lata de grão-de-bico escorrida, asse por só 12 min.", "leftover": "Fica ótimo gelado no dia seguinte, num wrap ou sobre uma salada."}, {"title": "Camarão na Manteiga de Alho com Arroz", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de camarão limpo (ou 1 lata de grão-de-bico)", "3 colheres (sopa) de manteiga", "4 dentes de alho, picados", "Suco de 1 limão", "1 xícara de arroz cozido", "Sal, pimenta e pimenta calabresa (opcional)"], "steps": ["Derreta a manteiga numa frigideira em fogo médio-alto.", "Adicione o alho, cozinhe por 30 seg até perfumar.", "Adicione o camarão; cozinhe 2–3 min de cada lado até ficar rosado.", "Misture o suco de limão, sal e pimenta. Sirva sobre arroz."], "swap": "Doure o grão-de-bico na mesma manteiga de alho por 5–6 min até crocante, ou use pedaços de peixe branco.", "leftover": "Esquente numa frigideira em fogo baixo — o micro-ondas deixa o camarão borrachudo."}, {"title": "Taco de Peru na Frigideira", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de peru moído (ou 1 lata de lentilha)", "2 colheres (sopa) de tempero para taco", "1/2 xícara de água ou caldo", "Queijo ralado", "Tortilhas pequenas ou cascas de taco", "Coberturas: alface, salsa, coentro"], "steps": ["Doure o peru numa frigideira em fogo médio-alto, por ~5–6 min.", "Misture o tempero para taco e a água; cozinhe por 3–4 min até engrossar.", "Cubra com queijo e sirva nas tortilhas com as coberturas."], "swap": "Carne moída, frango ou uma lata de lentilha/feijão preto para uma noite sem carne (cozinhe por 5 min).", "leftover": "Sem a tortilha — vira uma salada de taco ou recheio de batata assada."}, {"title": "Salmão com Mel e Soja e Legumes Assados", "time": "25 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 filés de salmão (ou 1 bloco de tofu firme)", "3 colheres (sopa) de molho de soja", "2 colheres (sopa) de mel", "1 dente de alho, picado", "1 abobrinha ou vagem", "2 colheres (sopa) de óleo"], "steps": ["Preaqueça o forno a 200°C. Misture os legumes com óleo, sal e pimenta; asse por 10 min.", "Misture o molho de soja, o mel e o alho.", "Empurre os legumes para o lado, adicione o salmão e pincele com a mistura.", "Asse por mais 10–12 min, até o salmão lascar facilmente."], "swap": "Para tofu — prense, corte em cubos, misture com a mistura e asse junto com os legumes o tempo todo (20 min).", "leftover": "Desfie num bowl de arroz com mais um pouco da mistura para um almoço rápido no dia seguinte."}], "bonus": {"eyebrow": "BÔNUS", "title": "Guia de congelamento e sobras", "items": ["O recheio da carne com brócolis e do taco de peru congelam bem por até 2 meses — porcione antes de congelar.", "O arroz congela muito bem: distribua em sacos achatados e esquente direto do congelador com um pouco de água.", "Camarão e salmão esquentam melhor numa frigideira em fogo baixo, não no micro-ondas.", "Os legumes assados de qualquer noite podem virar uma sopa rápida com um pouco de caldo."]}, "closing": {"title": "Você consegue.", "body": "Sete jantares, uma ida ao mercado, zero tempo parada na frente da geladeira. Guarde este guia em algum lugar que você realmente vai ver, e reaproveite sempre que quiser suas noites de volta.", "madeBy": "FEITO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Modo de preparo", "swap": "Substituição", "leftover": "Dica de sobras", "day": "Dia"}}, "es": {"dir": "ltr", "meta": {"htmlLang": "es", "pageTitle": "El Plan de Cenas Sin Decisiones de 7 Días"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUÍA DE RECETAS GRATIS", "title1": "EL PLAN DE CENAS", "accent": "Sin Decisiones", "title2": "DE 7 DÍAS", "subtitle": "Deja de quedarte parada frente al refrigerador. Empieza a comer mejor esta noche.", "footer": "7 CENAS DE VERDAD · 1 LISTA DE COMPRAS · CERO DUDAS"}, "intro": {"eyebrow": "INTRODUCCIÓN", "title": "Por qué cansa tanto la pregunta \"¿qué hago de cenar?\"", "p": ["Son las 6pm. Estás cansada. Abres el refrigerador, te quedas mirando por cuarta vez, lo cierras y sigues sin tener idea de qué hacer. Esto no es un problema de cocina — es un problema de decisión. Después de un día entero lleno de decisiones, tu cerebro ya no tiene energía para planear una comida desde cero.", "Este plan elimina la decisión por completo. Siete cenas de verdad, organizadas en orden, con una sola lista de compras que haces una vez. No vas a pensar \"¿qué hago de cenar?\" toda la semana — solo abres esta guía y cocinas."], "rules": ["30 minutos o menos, de principio a fin", "Ingredientes comunes de cualquier supermercado", "Limpieza mínima — la mayoría de las noches, una sola sartén u olla"]}, "howto": {"eyebrow": "CÓMO USAR ESTE PLAN", "title": "Cuatro pasos. Nada más.", "steps": [{"title": "Compra una sola vez", "body": "Usa la lista consolidada en la siguiente página — las 7 cenas, un solo viaje, organizada por sección del súper."}, {"title": "Cocina en cualquier orden", "body": "Los días están numerados por organización, no por obligación. Guarda la receta más rápida para tu noche más ocupada."}, {"title": "Usa los tips de sustitución", "body": "Cada receta se adapta a tus necesidades alimenticias o a la proteína que esté en oferta — sin necesidad de improvisar."}, {"title": "No desperdicies las sobras", "body": "Cada receta incluye qué hacer con las porciones extra al día siguiente."}]}, "shopping": {"eyebrow": "TU ÚNICO VIAJE AL SÚPER", "title": "Lista de compras", "note": "La sal, la pimienta y el aceite de oliva se consideran básicos que ya tienes en casa, por eso no están en la lista.", "categories": [{"name": "Verduras y frutas", "items": ["1 limón amarillo", "1 kg de verduras mixtas", "1 cebolla amarilla", "4 dientes de ajo", "2 pimientos morrones", "1 cabeza pequeña de brócoli", "1 limón verde", "Cilantro fresco (opcional)", "1 calabacita o ejotes"]}, {"name": "Lácteos y refrigerador", "items": ["Mantequilla", "Crema para cocinar", "Queso parmesano", "Queso rallado"]}, {"name": "Proteína", "items": ["4 muslos o pechugas de pollo", "500g de carne molida", "500g de camarón grande", "500g de pavo molido", "4 filetes de salmón"]}, {"name": "Despensa", "items": ["1 paquete de pasta", "1 lata de tomate triturado", "1 taza de arroz", "Salsa de soya · Miel", "Sazonador para tacos", "Tortillas pequeñas", "Caldo (1 taza)"]}]}, "recipes": [{"title": "Pollo al Horno con Limón, Ajo y Verduras", "time": "35 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 muslos o pechugas de pollo", "1 kg de verduras mixtas, picadas", "3 dientes de ajo, picados", "1 limón amarillo, en rodajas", "3 cdas de aceite de oliva", "Sal y pimienta"], "steps": ["Precalienta el horno a 220°C.", "Mezcla las verduras con 2 cdas de aceite, el ajo, sal y pimienta en la bandeja.", "Unta el pollo con el aceite restante, sal y pimienta; acomódalo en la bandeja.", "Cubre el pollo con las rodajas de limón.", "Hornea 22–25 min, hasta que el pollo alcance 74°C internos."], "swap": "¿Sin bandeja apta para horno? Dora el pollo en sartén 6–7 min por lado y hornea las verduras aparte. Vegano: sustituye por tofu firme (hornea 18 min).", "leftover": "Deshébralo y mézclalo con verduras de hoja y limón para una ensalada rápida al día siguiente."}, {"title": "Pasta Cremosa de Tomate en Una Sola Olla", "time": "20 min", "serves": "Para 4", "equip": "1 olla", "ing": ["1 paquete de pasta", "1 lata de tomate triturado", "1/2 taza de crema para cocinar", "3 dientes de ajo, picados", "1/2 taza de parmesano rallado", "2 cdas de aceite de oliva", "Sal, pimienta y chile en hojuelas (opcional)"], "steps": ["Calienta el aceite en una olla grande; sofríe el ajo 1 min hasta que aromatice.", "Agrega el tomate triturado y 2 tazas de agua; deja hervir.", "Añade la pasta directo a la olla; cocina 12–14 min, moviendo de vez en cuando.", "Retira del fuego y agrega la crema y el parmesano. Ajusta la sazón."], "swap": "Agrega pollo cocido, camarón o frijoles blancos para que rinda más. ¿Sin lácteos? Usa leche de coco entera.", "leftover": "Se recalienta bien con un poco de agua o leche para aflojar la salsa."}, {"title": "Salteado de Res y Brócoli en 15 Minutos", "time": "15 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de carne molida (o proteína vegetal)", "1 cabeza pequeña de brócoli, en trozos pequeños", "3 cdas de salsa de soya", "1 cda de miel", "2 dientes de ajo, picados", "1 cda de aceite", "Arroz cocido, para servir"], "steps": ["Calienta el aceite en un sartén grande a fuego alto. Dora la carne, desmenuzándola, ~5 min.", "Agrega el brócoli y el ajo; saltea 4–5 min hasta que el verde se intensifique.", "Agrega la salsa de soya y la miel; cocina 1 min más.", "Sirve sobre arroz."], "swap": "Pavo molido, pollo o tempeh desmenuzado también funcionan. Cualquier verdura de cocción rápida puede reemplazar el brócoli.", "leftover": "Se congela bien hasta por 2 meses — porciona antes de agregar el arroz."}, {"title": "Bowls de Fajitas de Pollo al Horno", "time": "30 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 muslos de pollo, en tiras (o 1 lata de garbanzos)", "2 pimientos morrones, en tiras", "1 cebolla amarilla, en tiras", "2 cdas de sazonador para tacos", "2 cdas de aceite", "1 taza de arroz cocido", "1 limón verde · Cilantro (opcional)"], "steps": ["Precalienta el horno a 220°C.", "Mezcla el pollo, los pimientos y la cebolla con aceite y sazonador para tacos en la bandeja.", "Hornea 18–20 min, moviendo una vez, hasta que se doren las orillas.", "Sirve sobre arroz con limón y cilantro."], "swap": "Noche vegetariana — sustituye el pollo por una lata de garbanzos escurridos, hornea solo 12 min.", "leftover": "Sabe increíble frío al día siguiente, en un wrap o sobre una ensalada."}, {"title": "Camarones al Ajillo con Mantequilla y Arroz", "time": "20 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de camarón pelado (o 1 lata de garbanzos)", "3 cdas de mantequilla", "4 dientes de ajo, picados", "Jugo de 1 limón", "1 taza de arroz cocido", "Sal, pimienta y chile en hojuelas (opcional)"], "steps": ["Derrite la mantequilla en un sartén a fuego medio-alto.", "Agrega el ajo, cocina 30 seg hasta que aromatice.", "Agrega el camarón; cocina 2–3 min por lado hasta que esté rosado.", "Agrega el jugo de limón, sal y pimienta. Sirve sobre arroz."], "swap": "Dora los garbanzos en la misma mantequilla de ajo 5–6 min hasta que estén crujientes, o usa trozos de pescado blanco.", "leftover": "Recalienta en sartén a fuego bajo — el microondas deja el camarón chicloso."}, {"title": "Sartén de Taco de Pavo", "time": "20 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de pavo molido (o 1 lata de lentejas)", "2 cdas de sazonador para tacos", "1/2 taza de agua o caldo", "Queso rallado", "Tortillas pequeñas o conchas de taco", "Para servir: lechuga, salsa, cilantro"], "steps": ["Dora el pavo en un sartén a fuego medio-alto, ~5–6 min.", "Agrega el sazonador para tacos y el agua; cocina 3–4 min hasta que espese.", "Cubre con queso y sirve en tortillas con lo que gustes."], "swap": "Carne molida, pollo o una lata de lentejas/frijoles negros para una noche sin carne (cocina 5 min).", "leftover": "Sin la tortilla — conviértelo en ensalada de taco o relleno de papa horneada."}, {"title": "Salmón con Miel y Soya y Verduras Asadas", "time": "25 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 filetes de salmón (o 1 bloque de tofu firme)", "3 cdas de salsa de soya", "2 cdas de miel", "1 diente de ajo, picado", "1 calabacita o ejotes", "2 cdas de aceite"], "steps": ["Precalienta el horno a 200°C. Mezcla las verduras con aceite, sal y pimienta; hornea 10 min.", "Mezcla la salsa de soya, la miel y el ajo.", "Empuja las verduras a un lado, agrega el salmón y báñalo con la mezcla.", "Hornea 10–12 min más, hasta que el salmón se desmenuce fácilmente."], "swap": "Para tofu — prénsalo, córtalo en cubos, mézclalo con la salsa y hornéalo junto con las verduras todo el tiempo (20 min).", "leftover": "Desmenúzalo en un bowl de arroz con un poco más de la mezcla para un almuerzo rápido al día siguiente."}], "bonus": {"eyebrow": "EXTRA", "title": "Guía de congelación y sobras", "items": ["El relleno de res con brócoli y el taco de pavo se congelan bien hasta por 2 meses — porciona antes de congelar.", "El arroz se congela muy bien: repártelo en bolsas planas y caliéntalo directo del congelador con un poco de agua.", "El camarón y el salmón se recalientan mejor en sartén a fuego bajo, no en el microondas.", "Las verduras asadas que sobren de cualquier noche se pueden licuar con caldo para una sopa rápida."]}, "closing": {"title": "Tú puedes con esto.", "body": "Siete cenas, un solo viaje al súper, cero tiempo parada frente al refrigerador. Guarda esta guía en algún lugar donde realmente la veas, y úsala cualquier semana que quieras recuperar tus noches.", "madeBy": "HECHO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Preparación", "swap": "Sustitución", "leftover": "Tip de sobras", "day": "Día"}}, "fr": {"dir": "ltr", "meta": {"htmlLang": "fr", "pageTitle": "Le Plan de Dîners Sans Prise de Tête sur 7 Jours"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UN GUIDE DE RECETTES GRATUIT", "title1": "LE PLAN DE DÎNERS", "accent": "Sans Prise de Tête", "title2": "SUR 7 JOURS", "subtitle": "Arrête de rester plantée devant le frigo. Commence à mieux manger ce soir.", "footer": "7 VRAIS DÎNERS · 1 LISTE DE COURSES · ZÉRO HÉSITATION"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Pourquoi la question « qu'est-ce qu'on mange ce soir ? » épuise autant", "p": ["Il est 18h. Tu es fatiguée. Tu ouvres le frigo, tu fixes le contenu pour la quatrième fois, tu le refermes, et tu n'as toujours aucune idée de quoi préparer. Ce n'est pas un problème de cuisine — c'est un problème de décision. Après une journée entière remplie de choix, ton cerveau n'a plus l'énergie de planifier un repas à partir de rien.", "Ce plan supprime complètement la décision. Sept vrais dîners, organisés dans l'ordre, avec une seule liste de courses que tu achètes en une fois. Tu n'auras plus à te demander « qu'est-ce qu'on mange ? » toute la semaine — il te suffit d'ouvrir ce guide et de cuisiner."], "rules": ["30 minutes ou moins, du début à la fin", "Des ingrédients courants qu'on trouve dans n'importe quel supermarché", "Un minimum de vaisselle — la plupart des soirs, une seule poêle ou casserole"]}, "howto": {"eyebrow": "COMMENT UTILISER CE PLAN", "title": "Quatre étapes. C'est tout.", "steps": [{"title": "Fais les courses une seule fois", "body": "Utilise la liste regroupée à la page suivante — les 7 dîners, en un seul passage, organisée par rayon."}, {"title": "Cuisine dans l'ordre que tu veux", "body": "Les jours sont numérotés pour l'organisation, pas pour l'obligation. Garde la recette la plus rapide pour ton soir le plus chargé."}, {"title": "Utilise les astuces de substitution", "body": "Chaque recette s'adapte à tes besoins alimentaires ou à la protéine en promotion — sans avoir à improviser."}, {"title": "Ne gaspille pas les restes", "body": "Chaque recette inclut une suggestion toute prête pour les restes du lendemain."}]}, "shopping": {"eyebrow": "TON SEUL PASSAGE AU SUPERMARCHÉ", "title": "Liste de courses", "note": "Le sel, le poivre et l'huile d'olive sont considérés comme des basiques que tu as déjà — ils ne sont donc pas listés ci-dessous.", "categories": [{"name": "Fruits et légumes", "items": ["1 citron", "1 kg de légumes variés", "1 oignon jaune", "4 gousses d'ail", "2 poivrons", "1 petite tête de brocoli", "1 citron vert", "Coriandre fraîche (facultatif)", "1 courgette ou des haricots verts"]}, {"name": "Produits laitiers", "items": ["Beurre", "Crème fraîche épaisse", "Parmesan", "Fromage râpé"]}, {"name": "Protéines", "items": ["4 hauts de cuisse ou blancs de poulet", "500g de bœuf haché", "500g de grosses crevettes", "500g de dinde hachée", "4 pavés de saumon"]}, {"name": "Épicerie", "items": ["1 paquet de pâtes", "1 boîte de tomates concassées", "1 tasse de riz", "Sauce soja · Miel", "Assaisonnement à taco", "Petites tortillas", "Bouillon (1 tasse)"]}]}, "recipes": [{"title": "Poulet Rôti au Citron et à l'Ail, Légumes en Plaque", "time": "35 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 hauts de cuisse ou blancs de poulet", "1 kg de légumes variés, coupés", "3 gousses d'ail, hachées", "1 citron, en tranches", "3 c. à soupe d'huile d'olive", "Sel et poivre"], "steps": ["Préchauffe le four à 220°C.", "Mélange les légumes avec 2 c. à soupe d'huile, l'ail, le sel et le poivre sur la plaque.", "Enduis le poulet avec le reste de l'huile, le sel et le poivre ; place-le sur la plaque.", "Recouvre le poulet de tranches de citron.", "Fais cuire 22–25 min, jusqu'à ce que le poulet atteigne 74°C à cœur."], "swap": "Pas de plaque allant au four ? Fais dorer le poulet à la poêle 6–7 min de chaque côté et fais cuire les légumes séparément. Végétal : remplace par du tofu ferme (cuisson 18 min).", "leftover": "Effiloche et mélange avec des feuilles vertes et du jus de citron pour une salade rapide le lendemain."}, {"title": "Pâtes Crémeuses à la Tomate, Une Seule Casserole", "time": "20 min", "serves": "Pour 4", "equip": "1 casserole", "ing": ["1 paquet de pâtes", "1 boîte de tomates concassées", "1/2 tasse de crème fraîche épaisse", "3 gousses d'ail, hachées", "1/2 tasse de parmesan râpé", "2 c. à soupe d'huile d'olive", "Sel, poivre et piment en flocons (facultatif)"], "steps": ["Fais chauffer l'huile dans une grande casserole ; fais revenir l'ail 1 min jusqu'à ce qu'il embaume.", "Ajoute les tomates concassées et 500 ml d'eau ; porte à ébullition.", "Ajoute les pâtes directement dans la casserole ; laisse mijoter 12–14 min en remuant de temps en temps.", "Hors du feu, incorpore la crème et le parmesan. Assaisonne à ton goût."], "swap": "Ajoute du poulet cuit, des crevettes ou des haricots blancs pour un plat plus consistant. Sans lactose ? Utilise du lait de coco entier.", "leftover": "Se réchauffe bien avec un peu d'eau ou de lait pour détendre la sauce."}, {"title": "Sauté de Bœuf et Brocoli en 15 Minutes", "time": "15 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de bœuf haché (ou protéine végétale)", "1 petite tête de brocoli, en petits morceaux", "3 c. à soupe de sauce soja", "1 c. à soupe de miel", "2 gousses d'ail, hachées", "1 c. à soupe d'huile", "Riz cuit, pour servir"], "steps": ["Fais chauffer l'huile dans une grande poêle à feu vif. Fais dorer le bœuf en l'émiettant, ~5 min.", "Ajoute le brocoli et l'ail ; fais sauter 4–5 min jusqu'à ce que le vert devienne vif.", "Ajoute la sauce soja et le miel ; laisse cuire 1 min de plus.", "Sers sur du riz."], "swap": "De la dinde hachée, du poulet ou du tempeh émietté fonctionnent aussi. Tout légume à cuisson rapide peut remplacer le brocoli.", "leftover": "Se congèle bien jusqu'à 2 mois — portionne avant d'ajouter le riz."}, {"title": "Bols Fajitas au Poulet en Plaque", "time": "30 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 hauts de cuisse de poulet, en lanières (ou 1 boîte de pois chiches)", "2 poivrons, en lanières", "1 oignon jaune, en lanières", "2 c. à soupe d'assaisonnement à taco", "2 c. à soupe d'huile", "1 tasse de riz cuit", "1 citron vert · Coriandre (facultatif)"], "steps": ["Préchauffe le four à 220°C.", "Mélange le poulet, les poivrons et l'oignon avec l'huile et l'assaisonnement à taco sur la plaque.", "Fais cuire 18–20 min, en remuant une fois, jusqu'à ce que les bords soient dorés.", "Sers sur du riz avec du citron vert et de la coriandre."], "swap": "Soirée végétarienne — remplace le poulet par une boîte de pois chiches égouttés, ne cuis que 12 min.", "leftover": "Délicieux froid le lendemain, dans un wrap ou sur une salade."}, {"title": "Poêlée de Crevettes au Beurre à l'Ail avec Riz", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de crevettes décortiquées (ou 1 boîte de pois chiches)", "3 c. à soupe de beurre", "4 gousses d'ail, hachées", "Jus d'1 citron", "1 tasse de riz cuit", "Sel, poivre et piment en flocons (facultatif)"], "steps": ["Fais fondre le beurre dans une poêle à feu moyen-vif.", "Ajoute l'ail, fais cuire 30 sec jusqu'à ce qu'il embaume.", "Ajoute les crevettes ; fais cuire 2–3 min de chaque côté jusqu'à ce qu'elles soient roses.", "Incorpore le jus de citron, le sel et le poivre. Sers sur du riz."], "swap": "Fais dorer les pois chiches dans le même beurre à l'ail pendant 5–6 min jusqu'à ce qu'ils soient croustillants, ou utilise des morceaux de poisson blanc.", "leftover": "Réchauffe à la poêle à feu doux — le micro-ondes rend les crevettes caoutchouteuses."}, {"title": "Poêlée de Taco à la Dinde", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de dinde hachée (ou 1 boîte de lentilles)", "2 c. à soupe d'assaisonnement à taco", "1/2 tasse d'eau ou de bouillon", "Fromage râpé", "Petites tortillas ou coquilles à taco", "Garnitures : laitue, salsa, coriandre"], "steps": ["Fais dorer la dinde dans une poêle à feu moyen-vif, ~5–6 min.", "Ajoute l'assaisonnement à taco et l'eau ; laisse mijoter 3–4 min jusqu'à épaississement.", "Recouvre de fromage et sers dans les tortillas avec les garnitures."], "swap": "Du bœuf haché, du poulet ou une boîte de lentilles/haricots noirs pour une soirée sans viande (cuisson 5 min).", "leftover": "Sans la tortilla — transforme-le en salade de taco ou en garniture de pomme de terre au four."}, {"title": "Saumon Miel-Soja et Légumes Rôtis", "time": "25 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 pavés de saumon (ou 1 bloc de tofu ferme)", "3 c. à soupe de sauce soja", "2 c. à soupe de miel", "1 gousse d'ail, hachée", "1 courgette ou des haricots verts", "2 c. à soupe d'huile"], "steps": ["Préchauffe le four à 200°C. Mélange les légumes avec l'huile, le sel et le poivre ; fais cuire 10 min.", "Fouette ensemble la sauce soja, le miel et l'ail.", "Pousse les légumes sur le côté, ajoute le saumon et badigeonne-le du mélange.", "Fais cuire 10–12 min de plus, jusqu'à ce que le saumon s'effeuille facilement."], "swap": "Pour le tofu — presse-le, coupe-le en cubes, enrobe-le du mélange et fais-le cuire avec les légumes du début à la fin (20 min).", "leftover": "Émiette dans un bol de riz avec un peu plus de sauce pour un déjeuner rapide le lendemain."}], "bonus": {"eyebrow": "EN BONUS", "title": "Guide de congélation et de restes", "items": ["La garniture bœuf-brocoli et le taco à la dinde se congèlent bien jusqu'à 2 mois — portionne avant de congeler.", "Le riz se congèle très bien : répartis-le dans des sachets à plat, et réchauffe-le congelé avec un peu d'eau.", "Les crevettes et le saumon se réchauffent mieux à la poêle à feu doux, pas au micro-ondes.", "Les légumes rôtis qui restent peuvent être mixés avec du bouillon pour une soupe rapide."]}, "closing": {"title": "Tu vas y arriver.", "body": "Sept dîners, un seul passage au supermarché, zéro minute plantée devant le frigo. Garde ce guide quelque part où tu le verras vraiment, et réutilise-le chaque semaine où tu veux retrouver tes soirées.", "madeBy": "CRÉÉ PAR @SARA.ALARABY"}, "labels": {"ingredients": "Ingrédients", "instructions": "Préparation", "swap": "Substitution", "leftover": "Astuce restes", "day": "Jour"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena di 7 Giorni Senza Pensieri"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA", "title1": "7 GIORNI,", "accent": "Zero Pensieri:", "title2": "IL PIANO CENA", "subtitle": "Basta stare impalata davanti al frigo. Inizia a mangiare meglio da stasera.", "footer": "7 CENE VERE · 1 LISTA DELLA SPESA · ZERO INDECISIONE"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Perché \"cosa preparo per cena\" è così estenuante", "p": ["Sono le 18. Sei stanca. Apri il frigo, lo fissi per la quarta volta, lo richiudi, e ancora non hai idea di cosa preparare. Non è un problema di cucina — è un problema di decisioni. Dopo una giornata intera di scelte, il tuo cervello non ha più energie per pianificare un pasto da zero.", "Questo piano elimina la decisione del tutto. Sette cene vere, organizzate in ordine, con un'unica lista della spesa da comprare una volta sola. Non devi pensare a cosa preparare per tutta la settimana — apri semplicemente questa guida e cucini."], "rules": ["30 minuti o meno, dall'inizio alla fine", "Ingredienti comuni, disponibili in qualsiasi supermercato", "Pulizia minima — quasi sempre una sola padella o pentola"]}, "howto": {"eyebrow": "COME USARE QUESTO PIANO", "title": "Quattro passaggi. Tutto qui.", "steps": [{"title": "Fai la spesa una volta", "body": "Usa la lista unica nella pagina successiva — tutte e 7 le cene, un solo giro, organizzata per reparto del supermercato."}, {"title": "Cucina nell'ordine che vuoi", "body": "I giorni sono numerati per comodità, non per obbligo. Tieni la ricetta più veloce per la sera più impegnata."}, {"title": "Usa i consigli per le sostituzioni", "body": "Ogni ricetta si adatta a esigenze alimentari diverse o a qualunque proteina sia in offerta — senza bisogno di improvvisare."}, {"title": "Non sprecare gli avanzi", "body": "Ogni ricetta include un'idea per riutilizzare le porzioni avanzate il giorno dopo."}]}, "shopping": {"eyebrow": "LA TUA LISTA IN UN SOLO GIRO", "title": "Lista della spesa", "note": "Sale, pepe e olio d'oliva sono considerati basi di dispensa e non sono elencati qui sotto.", "categories": [{"name": "Frutta e verdura", "items": ["1 limone", "900 g di verdure miste", "1 cipolla dorata", "4 spicchi d'aglio", "2 peperoni", "1 broccolo piccolo", "1 lime", "Coriandolo fresco (facoltativo)", "1 zucchina o fagiolini"]}, {"name": "Latticini e frigo", "items": ["Burro", "Panna fresca o panna leggera", "Parmigiano grattugiato", "Formaggio filante grattugiato"]}, {"name": "Proteine", "items": ["4 cosce o petti di pollo", "450 g di carne macinata di manzo", "450 g di gamberi grandi", "450 g di tacchino macinato", "4 filetti di salmone"]}, {"name": "Dispensa", "items": ["1 confezione di pasta", "1 lattina di pomodori pelati", "1 tazza di riso", "Salsa di soia · Miele", "Spezie per taco", "Tortillas piccole", "Brodo (1 tazza)"]}]}, "recipes": [{"title": "Pollo al Limone e Aglio con Verdure al Forno", "time": "35 min", "serves": "Per 4 persone", "equip": "1 teglia", "ing": ["4 cosce o petti di pollo", "900 g di verdure miste, a pezzi", "3 spicchi d'aglio, tritati", "1 limone, a fette", "3 cucchiai di olio d'oliva", "Sale e pepe"], "steps": ["Preriscalda il forno a 220°C.", "Condisci le verdure con 2 cucchiai di olio, l'aglio, sale e pepe su una teglia.", "Massaggia il pollo con l'olio rimasto, sale e pepe; sistemalo nella teglia.", "Guarnisci il pollo con le fette di limone.", "Cuoci in forno 22–25 min, finché il pollo raggiunge 74°C internamente."], "swap": "Non hai una teglia da forno? Cuoci il pollo in padella 6–7 min per lato, e arrostisci le verdure a parte. Versione vegetale: sostituisci con tofu extra-compatto (cuoci 18 min).", "leftover": "Sfilaccia e mescola con insalata verde e succo di limone per un pranzo veloce."}, {"title": "Pasta Cremosa al Pomodoro in Un Solo Tegame", "time": "20 min", "serves": "Per 4 persone", "equip": "1 pentola", "ing": ["1 confezione di pasta", "1 lattina di pomodori pelati", "125 ml di panna fresca o panna leggera", "3 spicchi d'aglio, tritati", "50 g di parmigiano grattugiato", "2 cucchiai di olio d'oliva", "Sale, pepe, peperoncino in scaglie (facoltativo)"], "steps": ["Scalda l'olio in una pentola grande; fai soffriggere l'aglio per 1 minuto finché profuma.", "Aggiungi i pomodori pelati e 500 ml di acqua; porta a ebollizione.", "Aggiungi la pasta direttamente nella pentola; cuoci a fuoco lento 12–14 min, mescolando di tanto in tanto.", "A fuoco spento, mescola panna e parmigiano. Regola di sale."], "swap": "Aggiungi pollo cotto, gamberi o fagioli bianchi per renderla più sostanziosa. Senza latticini? Usa latte di cocco intero.", "leftover": "Si riscalda bene con un goccio d'acqua o latte per ammorbidire di nuovo il sugo."}, {"title": "Salta in Padella di Manzo e Broccoli in 15 Minuti", "time": "15 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["450 g di carne macinata di manzo (o alternativa vegetale)", "1 broccolo piccolo, tagliato fine", "3 cucchiai di salsa di soia", "1 cucchiaio di miele", "2 spicchi d'aglio, tritati", "1 cucchiaio di olio", "Riso cotto, per servire"], "steps": ["Scalda l'olio in una padella grande a fuoco alto. Rosola il manzo, sgretolandolo, per circa 5 min.", "Aggiungi broccoli e aglio; salta in padella 4–5 min finché diventano verde brillante.", "Aggiungi salsa di soia e miele; cuoci ancora 1 minuto.", "Servi sopra il riso."], "swap": "Vanno bene anche tacchino macinato, pollo, o tempeh sbriciolato. Qualsiasi verdura a cottura rapida può sostituire i broccoli.", "leftover": "Si congela bene fino a 2 mesi — dividi in porzioni prima di aggiungere il riso."}, {"title": "Ciotole di Fajitas di Pollo al Forno", "time": "30 min", "serves": "Per 4 persone", "equip": "1 teglia", "ing": ["4 cosce di pollo, a fette (o 1 lattina di ceci)", "2 peperoni, a fette", "1 cipolla dorata, a fette", "2 cucchiai di spezie per taco", "2 cucchiai di olio", "1 tazza di riso, cotto", "1 lime · Coriandolo (facoltativo)"], "steps": ["Preriscalda il forno a 220°C.", "Condisci pollo, peperoni e cipolla con olio e spezie per taco su una teglia.", "Cuoci in forno 18–20 min, mescolando una volta, finché i bordi sono leggermente bruciacchiati.", "Servi sopra il riso con lime e coriandolo."], "swap": "Serata vegetariana — sostituisci il pollo con una lattina di ceci scolati, cuoci solo 12 min.", "leftover": "Ottimo freddo il giorno dopo, in una piadina o sopra insalata verde."}, {"title": "Gamberi al Burro e Aglio in Padella con Riso", "time": "20 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["450 g di gamberi, sgusciati (o 1 lattina di ceci)", "3 cucchiai di burro", "4 spicchi d'aglio, tritati", "Succo di 1 limone", "1 tazza di riso, cotto", "Sale, pepe, peperoncino in scaglie (facoltativo)"], "steps": ["Sciogli il burro in padella a fuoco medio-alto.", "Aggiungi l'aglio, cuoci 30 secondi finché profuma.", "Aggiungi i gamberi; cuoci 2–3 min per lato finché diventano rosa e opachi.", "Aggiungi il succo di limone, sale e pepe. Servi sopra il riso."], "swap": "Salta i ceci nello stesso burro all'aglio per 5–6 min finché croccanti, oppure usa pezzi di pesce bianco.", "leftover": "Riscalda in padella a fuoco basso — il microonde rende i gamberi gommosi."}, {"title": "Taco di Tacchino in Padella", "time": "20 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["450 g di tacchino macinato (o 1 lattina di lenticchie)", "2 cucchiai di spezie per taco", "125 ml di acqua o brodo", "Formaggio filante grattugiato", "Tortillas piccole o gusci per taco", "Guarnizioni: lattuga, salsa, coriandolo"], "steps": ["Rosola il tacchino in padella a fuoco medio-alto, circa 5–6 min.", "Aggiungi le spezie per taco e l'acqua; cuoci a fuoco lento 3–4 min finché si addensa.", "Guarnisci con formaggio e servi nelle tortillas con le guarnizioni."], "swap": "Vanno bene anche manzo macinato, pollo, o una lattina di lenticchie/fagioli neri per una serata senza carne (cuoci 5 min).", "leftover": "Salta la tortilla — trasformalo in un'insalata in stile taco o in una patata al forno ripiena."}, {"title": "Salmone al Miele e Soia con Verdure al Forno", "time": "25 min", "serves": "Per 4 persone", "equip": "1 teglia", "ing": ["4 filetti di salmone (o 1 panetto di tofu compatto)", "3 cucchiai di salsa di soia", "2 cucchiai di miele", "1 spicchio d'aglio, tritato", "1 zucchina o un sacchetto di fagiolini", "2 cucchiai di olio"], "steps": ["Preriscalda il forno a 200°C. Condisci le verdure con olio, sale e pepe; cuoci 10 min.", "Sbatti insieme salsa di soia, miele e aglio.", "Sposta le verdure di lato, aggiungi il salmone, spennella con la glassa.", "Cuoci altri 10–12 min, finché il salmone si sfalda facilmente."], "swap": "Per il tofu — pressalo, taglialo a cubetti, condiscilo con la glassa, e cuocilo insieme alle verdure per tutto il tempo (20 min).", "leftover": "Sfalda in una ciotola di riso con altra glassa per un pranzo veloce il giorno dopo."}], "bonus": {"eyebrow": "BONUS", "title": "Guida a congelatore e avanzi", "items": ["Sia il saltato di manzo che il ripieno dei taco di tacchino si congelano bene fino a 2 mesi — dividi in porzioni prima di congelare.", "Il riso si congela benissimo: dividilo in sacchetti piatti e riscaldalo direttamente da congelato con un goccio d'acqua.", "Gamberi e salmone si riscaldano meglio in padella a fuoco basso, non nel microonde.", "Le verdure al forno di qualsiasi sera possono essere frullate con del brodo per una zuppa veloce, invece di mangiarle semplici."]}, "closing": {"title": "Ce la puoi fare.", "body": "Sette cene, un solo giro di spesa, zero minuti impalata davanti al frigo. Tieni questa guida da qualche parte dove la vedrai davvero, e riusala ogni settimana in cui vuoi riprenderti le tue serate.", "madeBy": "MADE BY @SARA.ALARABY"}, "labels": {"ingredients": "Ingredienti", "instructions": "Istruzioni", "swap": "Sostituzioni", "leftover": "Consiglio per gli avanzi", "day": "Giorno"}}, "ptbr": {"dir": "ltr", "meta": {" const DAY_COLORS = ["var(--day1)","var(--day2)","var(--day3)","var(--day4)","var(--day5)","var(--day6)","var(--day7)"];

const RECIPE_EYEBROW = {ar:"الوصفات",en:"THE RECIPES",pt:"AS RECEITAS",es:"LAS RECETAS",fr:"LES RECETTES",it:"LE RICETTE",ptbr:"AS RECEITAS"};

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function render(lang){
  const d = DATA[lang];
  if(!d) return;
  document.documentElement.lang = d.meta.htmlLang;
  document.documentElement.dir = d.dir;
  document.title = d.meta.pageTitle;

  document.getElementById('brandName').textContent = d.nav.brand;

  document.querySelectorAll('#langSwitcher button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang')===lang);
  });

  // Hero
  document.getElementById('hEyebrow').textContent = d.hero.eyebrow;
  document.getElementById('hTitle1').textContent = d.hero.title1;
  document.getElementById('hAccent').textContent = d.hero.accent;
  document.getElementById('hTitle2').textContent = d.hero.title2;
  document.getElementById('hSubtitle').textContent = d.hero.subtitle;
  document.getElementById('hFoottag').textContent = d.hero.footer;

  // Intro
  document.getElementById('iEyebrow').textContent = d.intro.eyebrow;
  document.getElementById('iTitle').textContent = d.intro.title;
  const iParas = document.getElementById('iParas'); iParas.innerHTML='';
  d.intro.p.forEach(t=>{ const p = el('p','',t); iParas.appendChild(p); });
  const iRules = document.getElementById('iRules'); iRules.innerHTML='';
  d.intro.rules.forEach(t=>{ iRules.appendChild(el('div','',t)); });

  // How to
  document.getElementById('hwEyebrow').textContent = d.howto.eyebrow;
  document.getElementById('hwTitle').textContent = d.howto.title;
  const hwSteps = document.getElementById('hwSteps'); hwSteps.innerHTML='';
  d.howto.steps.forEach((s,i)=>{
    const step = el('div','step');
    const num = el('div','step-num', String(i+1));
    const body = el('div','step-body');
    body.appendChild(el('h3','',s.title));
    body.appendChild(el('p','',s.body));
    step.appendChild(num); step.appendChild(body);
    hwSteps.appendChild(step);
  });

  // Shopping
  document.getElementById('shEyebrow').textContent = d.shopping.eyebrow;
  document.getElementById('shTitle').textContent = d.shopping.title;
  document.getElementById('shNote').textContent = d.shopping.note;
  const shGrid = document.getElementById('shGrid'); shGrid.innerHTML='';
  const colA = el('div','shop-col'); const colB = el('div','shop-col');
  d.shopping.categories.forEach((cat,i)=>{
    const block = el('div','shop-block');
    block.appendChild(el('div','shop-cat', cat.name));
    cat.items.forEach(it=>{
      const row = el('div','shop-item');
      row.appendChild(el('span','box'));
      row.appendChild(el('span','',it));
      block.appendChild(row);
    });
    (i % 2 === 0 ? colA : colB).appendChild(block);
  });
  shGrid.appendChild(colA); shGrid.appendChild(colB);

  // Recipes
  document.getElementById('rcEyebrow').textContent = RECIPE_EYEBROW[lang] || "RECIPES";
  document.getElementById('rcTitle').textContent = RECIPE_WORD[lang] || "Recipes";
  const list = document.getElementById('recipeList'); list.innerHTML='';
  d.recipes.forEach((r,i)=>{
    const card = el('div','recipe');
    const head = el('div','recipe-head');
    head.style.background = DAY_COLORS[i];
    head.appendChild(el('div','day-label', d.labels.day + ' ' + (i+1) + ' / 7'));
    head.appendChild(el('h3','', r.title));
    const badges = el('div','badges');
    [r.time, r.serves, r.equip].forEach(b=>{ badges.appendChild(el('span','badge', b)); });
    head.appendChild(badges);
    card.appendChild(head);

    const body = el('div','recipe-body');
    const ingCol = el('div','');
    ingCol.appendChild(el('div','block-label', d.labels.ingredients));
    r.ing.forEach(it=>{ ingCol.appendChild(el('div','ing-item', '— '+it)); });
    const tips = el('div','tips');
    const swapTip = el('div','tip'); const swapB = el('b','',d.labels.swap+': '); swapTip.appendChild(swapB); swapTip.appendChild(document.createTextNode(r.swap));
    const leftTip = el('div','tip'); const leftB = el('b','',d.labels.leftover+': '); leftTip.appendChild(leftB); leftTip.appendChild(document.createTextNode(r.leftover));
    tips.appendChild(swapTip); tips.appendChild(leftTip);
    ingCol.appendChild(tips);

    const insCol = el('div','');
    insCol.appendChild(el('div','block-label', d.labels.instructions));
    r.steps.forEach((s,si)=>{
      const row = el('div','ins-step');
      const num = el('div','ins-num', String(si+1));
      num.style.background = DAY_COLORS[i];
      row.appendChild(num);
      row.appendChild(el('div','ins-text', s));
      insCol.appendChild(row);
    });

    body.appendChild(ingCol); body.appendChild(insCol);
    card.appendChild(body);
    list.appendChild(card);
  });

  // Bonus
  document.getElementById('bnEyebrow').textContent = d.bonus.eyebrow;
  document.getElementById('bnTitle').textContent = d.bonus.title;
  const bnItems = document.getElementById('bnItems'); bnItems.innerHTML='';
  d.bonus.items.forEach(t=>{ bnItems.appendChild(el('div','',t)); });

  // Closing
  document.getElementById('clTitle').textContent = d.closing.title;
  document.getElementById('clBody').textContent = d.closing.body;
  document.getElementById('clMadeBy').textContent = d.closing.madeBy;

  document.getElementById('backLink').textContent = (window.BACK_LINK_TEXT[lang] || window.BACK_LINK_TEXT.en);
  document.getElementById('ctaEyebrow').textContent = (window.CTA_LABEL[lang] || window.CTA_LABEL.en);
  document.getElementById('ctaBody').textContent = (window.CTA_BODY[lang] || window.CTA_BODY.en);
  document.getElementById('ctaBtn').innerHTML = '💬 ' + (window.CTA_BTN[lang] || window.CTA_BTN.en);
  document.getElementById('ctaBtn').href = 'https://wa.me/' + (window.WA_NUMBER_BY_LANG[lang]||window.WA_NUMBER_BY_LANG.en) + '?text=' + encodeURIComponent(window.WA_MSG[lang]||window.WA_MSG.en);

  try{ localStorage.setItem('sd_lang', lang); }catch(e){}
}

document.getElementById('langSwitcher').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  render(btn.getAttribute('data-lang'));
});

(function init(){
  let lang = 'en';
  try{
    const saved = localStorage.getItem('sd_lang');
    if(saved && DATA[saved]) lang = saved;
    else {
      const nav = (navigator.language||'en').slice(0,2).toLowerCase();
      if(DATA[nav]) lang = nav;
    }
  }catch(e){}
  render(lang);
})();
</script>
