«إيده في العجينة»)", "b": false}, {"t": "Avere le mani in pasta", "b": false}], [{"t": "شاطر/فاهم (حرفيًا «في الرِّجل»)", "b": false}, {"t": "Essere in gamba", "b": false}], [{"t": "يعمل حركة ضد الحسد (حرفيًا «يعمل قرون»)", "b": false}, {"t": "Fare le corna", "b": false}], [{"t": "يستهزئ بحد (حرفيًا «ياخده حواليه»)", "b": false}, {"t": "Prendere in giro", "b": false}]]}], "tip": false}, {"title": "حوارات تدريبية متقدمة (٥ مواقف واقعية)", "blocks": [{"type": "h3", "text": "<strong>١) في المطار — تأخير في الرحلة</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Passeggero:", "orig": "Buonasera, il mio volo per Roma è in ritardo?", "trans": "مساء الخير، رحلتي لروما متأخرة؟"}, {"speaker": "Impiegato:", "orig": "Sì, purtroppo è in ritardo di un'ora.", "trans": "أيوه للأسف متأخرة ساعة."}, {"speaker": "Passeggero:", "orig": "Perderò la coincidenza per Milano?", "trans": "هفوّت الرحلة اللي هتوصلني ميلانو؟"}, {"speaker": "Impiegato:", "orig": "Non si preoccupi, abbiamo già riorganizzato il suo viaggio.", "trans": "متقلقش، إحنا رتبنا رحلتك تاني."}]}, {"type": "h3", "text": "<strong>٢) شكوى في الفندق</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Ospite:", "orig": "Mi scusi, il condizionatore della mia camera non funziona.", "trans": "معلش، تكييف أوضتي مش شغال."}, {"speaker": "Reception:", "orig": "Mi dispiace molto. Mando subito qualcuno.", "trans": "آسفين جدًا. هبعتلك حد فورًا."}, {"speaker": "Ospite:", "orig": "Grazie. Vorrei anche cambiare camera, se possibile.", "trans": "شكرًا. حبيت كمان أغيّر أوضة لو ممكن."}, {"speaker": "Reception:", "orig": "Certo, controllo la disponibilità.", "trans": "أكيد، هشوف لو فيه أوضة فاضية."}]}, {"type": "h3", "text": "<strong>٣) في الصيدلية</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Buonasera, non mi sento bene. Ho mal di testa e febbre.", "trans": "مساء الخير، مش حاسس إني كويس. عندي صداع وسخونية."}, {"speaker": "Farmacista:", "orig": "Da quanto tempo ha questi sintomi?", "trans": "من امتى وأنت حاسس بالأعراض دي؟"}, {"speaker": "Cliente:", "orig": "Da ieri sera.", "trans": "من امبارح بالليل."}, {"speaker": "Farmacista:", "orig": "Prenda questa medicina ogni otto ore.", "trans": "خد الدوا ده كل ٨ ساعات."}]}, {"type": "h3", "text": "<strong>٤) تأجير عربية</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Vorrei noleggiare una macchina per tre giorni.", "trans": "عايز أأجّر عربية لتلات أيام."}, {"speaker": "Impiegato:", "orig": "Certo. Posso vedere la sua patente, per favore?", "trans": "أكيد. ممكن أشوف رخصة القيادة لو سمحت؟"}, {"speaker": "Cliente:", "orig": "Ecco a lei. L'assicurazione è inclusa?", "trans": "اتفضل. التأمين داخل في السعر؟"}, {"speaker": "Impiegato:", "orig": "Sì, l'assicurazione di base è inclusa nel prezzo.", "trans": "أيوه، التأمين الأساسي داخل في السعر."}]}, {"type": "h3", "text": "<strong>٥) سؤال عن الاتجاهات</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Turista:", "orig": "Mi scusi, come arrivo al Colosseo?", "trans": "معلش، أروح إزاي للكوليزيوم؟"}, {"speaker": "Locale:", "orig": "Vada sempre dritto e poi giri a destra alla seconda strada.", "trans": "كمّل دُغري وبعدين لف يمين في تاني شارع."}, {"speaker": "Turista:", "orig": "È molto lontano da qui?", "trans": "ده بعيد أوي من هنا؟"}, {"speaker": "Locale:", "orig": "No, è a circa dieci minuti a piedi.", "trans": "لأ، حوالي ١٠ دقايق مشي."}]}], "tip": false}, {"title": "نص قرائي للتدريب", "blocks": [{"type": "p", "html": "اقرأ النص ده كذا مرة بصوت عالٍ، وحاول تفهمه من غير ما تترجم كل كلمة:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>مفردات مهمة من النص</strong>"}, {"type": "table", "headers": ["المعنى", "الكلمة"], "rows": [[{"t": "مطعم تقليدي/محلي", "b": false}, {"t": "ristorante tipico", "b": false}], [{"t": "الكوليزيوم", "b": false}, {"t": "il Colosseo", "b": false}], [{"t": "موسيقى حية", "b": false}, {"t": "musica dal vivo", "b": false}], [{"t": "ما يُنسى", "b": false}, {"t": "indimenticabile", "b": false}]]}, {"type": "h3", "text": "<strong>أسئلة للفهم</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["الأسرة راحت روما إمتى؟", "عملوا إيه بعد الـcheck-in؟", "سمعوا موسيقى حية فين؟"]}, {"type": "p", "html": "<em>الإجابات: ١) بالأمس ٢) راحوا الوسط يتغدّوا ٣) جنب ميدان نافونا بالليل</em>", "italic": true}], "tip": false}, {"title": "خاتمة وخطوات نحو الطلاقة الكاملة", "blocks": [{"type": "list", "label": "<strong>للوصول للطلاقة الكاملة</strong>", "intro": null, "items": ["اقرأ جرايد أو مقالات إيطالية بسيطة يوميًا وحاول تفهم من السياق قبل ما تترجم.", "اتكلم مع متحدثين أصليين (أونلاين أو لو سافرت) — التطبيق العملي أهم حاجة دلوقتي.", "اكتب يوميات قصيرة بالإيطالي كل يوم — حتى ٣-٤ جمل بتفرق كتير على المدى الطويل.", "راجع الأزمنة دي كل شوية لحد ما تبقى تلقائية من غير ما تفكر فيها.", "متخافش من الغلط في المحادثة — الإيطاليين بيتقدّروا جدًا أي حد بيحاول يتكلم لغتهم."]}], "tip": true}], "closingBasic": "مبروك مقدمًا على رحلتك مع اللغة الإيطالية — In bocca al lupo! (حظ سعيد!)", "closingAdvanced": "رحلتك مع الإيطالية بقت جاهزة للمستوى اللي تقدر تعتمد عليه فعلاً — In bocca al lupo! (حظ سعيد!)"}, "en": {"chapters": [{"title": "Introduction: Why Learn Italian?", "blocks": [{"type": "p", "html": "Italian is the official language of Italy, Switzerland, San Marino, and the Vatican, spoken by more than 65 million people as a native language, and recognized worldwide as the language of art, music, and food. This book gives you a solid foundation in the standard Italian spoken across Italy.", "italic": false}, {"type": "p", "html": "Good news: Italian, like Spanish and Portuguese, is a Romance language with very logical, well-organized grammar. Its pronunciation is also one of the easiest among Romance languages, because almost every letter is pronounced exactly as it's written, without disappearing or shifting in strange ways.", "italic": false}, {"type": "list", "label": "<strong>Goals of This Book</strong>", "intro": null, "items": ["Give you a solid foundation of vocabulary and essential grammar in the shortest time possible.", "Focus on correct pronunciation so your accent sounds authentically Italian.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The Alphabet & Pronunciation Basics", "blocks": [{"type": "p", "html": "Italian uses the Latin alphabet, and most letters are pronounced exactly as they're written. This table introduces the letters and sounds that are most distinctive:", "italic": false}, {"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>casa</strong>", "b": true}, {"t": "KAH-sah", "b": false}, {"t": "house — every letter is clearly pronounced", "b": false}], [{"t": "<strong>ciao</strong>", "b": true}, {"t": "CHOW", "b": false}, {"t": "hi/bye (informal) — \"ci\" before a/o sounds like \"ch\", just like in English", "b": false}], [{"t": "<strong>gelato</strong>", "b": true}, {"t": "jeh-LAH-toh", "b": false}, {"t": "ice cream — \"ge/gi\" sounds like the \"j\" in \"jelly\"", "b": false}], [{"t": "<strong>gatto</strong>", "b": true}, {"t": "GAHT-toh", "b": false}, {"t": "cat — \"ga/go/gu\" is a hard g; the double \"tt\" is held slightly longer", "b": false}], [{"t": "<strong>spaghetti</strong>", "b": true}, {"t": "spah-GET-tee", "b": false}, {"t": "spaghetti — \"gh\" is always a hard g sound", "b": false}], [{"t": "<strong>famiglia</strong>", "b": true}, {"t": "fah-MEE-lyah", "b": false}, {"t": "family — \"gli\" sounds like the \"lli\" in \"million\"", "b": false}], [{"t": "<strong>gnocchi</strong>", "b": true}, {"t": "NYOH-kee", "b": false}, {"t": "gnocchi (a type of pasta) — \"gn\" sounds like the \"ny\" in \"canyon\"", "b": false}], [{"t": "<strong>pesce</strong>", "b": true}, {"t": "PEH-sheh", "b": false}, {"t": "fish — \"sce/sci\" sounds like \"sh\"", "b": false}], [{"t": "<strong>scuola</strong>", "b": true}, {"t": "SKWOH-lah", "b": false}, {"t": "school — \"sca/sco/scu\" sounds like \"sk\"", "b": false}], [{"t": "<strong>pizza</strong>", "b": true}, {"t": "PEET-sah", "b": false}, {"t": "pizza — \"z/zz\" sounds like \"ts\" or \"dz\"", "b": false}]]}], "tip": false}, {"title": "Golden Rules for Authentic Pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference in sounding truly Italian:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["The vowels (a, e, i, o, u) are always pronounced with a short, pure, clear sound — English tends to \"glide\" vowels into two sounds (like the \"o\" in \"go\"), but Italian vowels stay crisp and single the whole way through.", "The letter c before e or i sounds like \"ch\" (as in ciao), and before a, o, or u sounds like a regular \"k\" (as in casa).", "The letter g before e or i sounds like \"j\" (as in gelato), and before a, o, or u sounds like a hard g (as in gatto).", "The combination gn sounds exactly like the \"ny\" in \"canyon\" or the \"ni\" in \"onion\" — a sound English already has, just spelled differently.", "Double consonants (like tt, ll, nn, ss) are held noticeably longer than single ones — this can completely change a word's meaning, so pay attention. English doesn't really have this feature, so it takes some practice.", "The letter r is a light, flipped/rolled r made with the tip of the tongue — not the English r. If you've never rolled an r before, this one takes practice."]}], "tip": false}, {"title": "Essential Greetings & Phrases", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>Ciao</strong>", "b": true}, {"t": "CHOW", "b": false}, {"t": "Hi / Bye (very casual, used both ways)", "b": false}], [{"t": "<strong>Buongiorno</strong>", "b": true}, {"t": "bwohn-JOR-noh", "b": false}, {"t": "Good morning", "b": false}], [{"t": "<strong>Buonasera</strong>", "b": true}, {"t": "bwoh-nah-SEH-rah", "b": false}, {"t": "Good afternoon/evening", "b": false}], [{"t": "<strong>Buonanotte</strong>", "b": true}, {"t": "bwoh-nah-NOT-teh", "b": false}, {"t": "Good night", "b": false}], [{"t": "<strong>Come stai?</strong>", "b": true}, {"t": "KOH-meh STY", "b": false}, {"t": "How are you? (casual)", "b": false}], [{"t": "<strong>Come sta?</strong>", "b": true}, {"t": "KOH-meh STAH", "b": false}, {"t": "How are you? (formal)", "b": false}], [{"t": "<strong>Sto bene, grazie</strong>", "b": true}, {"t": "stoh BEH-neh, GRAH-tsyeh", "b": false}, {"t": "I'm well, thank you", "b": false}], [{"t": "<strong>Piacere</strong>", "b": true}, {"t": "pyah-CHEH-reh", "b": false}, {"t": "Nice to meet you", "b": false}], [{"t": "<strong>A dopo</strong>", "b": true}, {"t": "ah DOH-poh", "b": false}, {"t": "See you later", "b": false}], [{"t": "<strong>A presto</strong>", "b": true}, {"t": "ah PRES-toh", "b": false}, {"t": "See you soon", "b": false}], [{"t": "<strong>Arrivederci</strong>", "b": true}, {"t": "ah-ree-veh-DER-chee", "b": false}, {"t": "Goodbye (formal/final)", "b": false}], [{"t": "<strong>Per favore</strong>", "b": true}, {"t": "per fah-VOH-reh", "b": false}, {"t": "Please", "b": false}], [{"t": "<strong>Grazie</strong>", "b": true}, {"t": "GRAH-tsyeh", "b": false}, {"t": "Thank you", "b": false}], [{"t": "<strong>Prego</strong>", "b": true}, {"t": "PREH-goh", "b": false}, {"t": "You're welcome", "b": false}], [{"t": "<strong>Scusa / Mi dispiace</strong>", "b": true}, {"t": "SKOO-zah / mee dees-PYAH-cheh", "b": false}, {"t": "Sorry / I'm sorry", "b": false}], [{"t": "<strong>Sì</strong>", "b": true}, {"t": "SEE", "b": false}, {"t": "Yes", "b": false}], [{"t": "<strong>No</strong>", "b": true}, {"t": "NOH", "b": false}, {"t": "No", "b": false}]]}], "tip": false}, {"title": "Pronouns & the Verb \"To Be\" (Essere / Stare)", "blocks": [{"type": "p", "html": "Italian has two verbs meaning \"to be\": Essere for identity and permanent traits, and Stare for temporary state and location (it's also the base of the daily greeting, as we just saw).", "italic": false}, {"type": "h3", "text": "<strong>Pronouns</strong>"}, {"type": "table", "headers": ["English", "Italian"], "rows": [[{"t": "I", "b": false}, {"t": "io", "b": false}], [{"t": "you", "b": false}, {"t": "tu", "b": false}], [{"t": "he/she", "b": false}, {"t": "lui / lei", "b": false}], [{"t": "we", "b": false}, {"t": "noi", "b": false}], [{"t": "you all", "b": false}, {"t": "voi", "b": false}], [{"t": "they", "b": false}, {"t": "loro", "b": false}]]}, {"type": "h3", "text": "<strong>Essere — for identity and permanent traits</strong>"}, {"type": "table", "headers": ["Pronoun", "Conjugation"], "rows": [[{"t": "io", "b": false}, {"t": "sono", "b": false}], [{"t": "tu", "b": false}, {"t": "sei", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "è", "b": false}], [{"t": "noi", "b": false}, {"t": "siamo", "b": false}], [{"t": "voi", "b": false}, {"t": "siete", "b": false}], [{"t": "loro", "b": false}, {"t": "sono", "b": false}]]}, {"type": "p", "html": "Example: Io sono egiziano — I am Egyptian.", "italic": false}, {"type": "h3", "text": "<strong>Stare — for temporary state and location</strong>"}, {"type": "table", "headers": ["Pronoun", "Conjugation"], "rows": [[{"t": "io", "b": false}, {"t": "sto", "b": false}], [{"t": "tu", "b": false}, {"t": "stai", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "sta", "b": false}], [{"t": "noi", "b": false}, {"t": "stiamo", "b": false}], [{"t": "voi", "b": false}, {"t": "state", "b": false}], [{"t": "loro", "b": false}, {"t": "stanno", "b": false}]]}, {"type": "p", "html": "Example: Sto a Roma — I am (currently) in Rome.", "italic": false}], "tip": false}, {"title": "Common Verbs & Their Conjugation", "blocks": [{"type": "p", "html": "Regular Italian verbs fall into 3 groups based on their ending: -are, -ere, -ire. Once you know the pattern, you can conjugate any regular verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ire (dormire: to sleep)", "-ere (scrivere: to write)", "-are (parlare: to speak)"], "rows": ": false}]]}], "tip": false}, {"title": "Family Members", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>madre</strong>", "b": true}, {"t": "MAH-dreh", "b": false}, {"t": "mother", "b": false}], [{"t": "<strong>padre</strong>", "b": true}, {"t": "PAH-dreh", "b": false}, {"t": "father", "b": false}], [{"t": "<strong>fratello</strong>", "b": true}, {"t": "frah-TEL-loh", "b": false}, {"t": "brother", "b": false}], [{"t": "<strong>sorella</strong>", "b": true}, {"t": "soh-REL-lah", "b": false}, {"t": "sister", "b": false}], [{"t": "<strong>figlio</strong>", "b": true}, {"t": "FEE-lyoh", "b": false}, {"t": "son", "b": false}], [{"t": "<strong>figlia</strong>", "b": true}, {"t": "FEE-lyah", "b": false}, {"t": "daughter", "b": false}], [{"t": "<strong>nonno</strong>", "b": true}, {"t": "NOHN-noh", "b": false}, {"t": "grandfather", "b": false}], [{"t": "<strong>nonna</strong>", "b": true}, {"t": "NOHN-nah", "b": false}, {"t": "grandmother", "b": false}], [{"t": "<strong>marito</strong>", "b": true}, {"t": "mah-REE-toh", "b": false}, {"t": "husband", "b": false}], [{"t": "<strong>moglie</strong>", "b": true}, {"t": "MOH-lyeh", "b": false}, {"t": "wife", "b": false}], [{"t": "<strong>zio</strong>", "b": true}, {"t": "TSEE-oh", "b": false}, {"t": "uncle", "b": false}], [{"t": "<strong>zia</strong>", "b": true}, {"t": "TSEE-ah", "b": false}, {"t": "aunt", "b": false}]]}], "tip": false}, {"title": "Food & Drink", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>pane</strong>", "b": true}, {"t": "PAH-neh", "b": false}, {"t": "bread", "b": false}], [{"t": "<strong>acqua</strong>", "b": true}, {"t": "AH-kwah", "b": false}, {"t": "water", "b": false}], [{"t": "<strong>caffè</strong>", "b": true}, {"t": "kahf-FEH", "b": false}, {"t": "coffee", "b": false}], [{"t": "<strong>tè</strong>", "b": true}, {"t": "TEH", "b": false}, {"t": "tea", "b": false}], [{"t": "<strong>carne</strong>", "b": true}, {"t": "KAR-neh", "b": false}, {"t": "meat", "b": false}], [{"t": "<strong>pollo</strong>", "b": true}, {"t": "POHL-loh", "b": false}, {"t": "chicken", "b": false}], [{"t": "<strong>pesce</strong>", "b": true}, {"t": "PEH-sheh", "b": false}, {"t": "fish", "b": false}], [{"t": "<strong>formaggio</strong>", "b": true}, {"t": "for-MAHJ-joh", "b": false}, {"t": "cheese", "b": false}], [{"t": "<strong>frutta</strong>", "b": true}, {"t": "FROOT-tah", "b": false}, {"t": "fruit", "b": false}], [{"t": "<strong>verdura</strong>", "b": true}, {"t": "ver-DOO-rah", "b": false}, {"t": "vegetables", "b": false}], [{"t": "<strong>dolci</strong>", "b": true}, {"t": "DOHL-chee", "b": false}, {"t": "sweets", "b": false}], [{"t": "<strong>colazione</strong>", "b": true}, {"t": "koh-lah-TSYOH-neh", "b": false}, {"t": "breakfast", "b": false}], [{"t": "<strong>pranzo</strong>", "b": true}, {"t": "PRAHN-tsoh", "b": false}, {"t": "lunch", "b": false}], [{"t": "<strong>cena</strong>", "b": true}, {"t": "CHEH-nah", "b": false}, {"t": "dinner", "b": false}]]}], "tip": false}, {"title": "Essential Travel & Hotel Phrases", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>Dove si trova...?</strong>", "b": true}, {"t": "DOH-veh see TROH-vah", "b": false}, {"t": "Where is...?", "b": false}], [{"t": "<strong>Quanto costa questo?</strong>", "b": true}, {"t": "KWAN-toh KOS-tah KWES-toh", "b": false}, {"t": "How much does this cost?", "b": false}], [{"t": "<strong>Posso vedere il menu?</strong>", "b": true}, {"t": "POS-soh veh-DEH-reh eel meh-NOO", "b": false}, {"t": "Can I see the menu?", "b": false}], [{"t": "<strong>Il conto, per favore</strong>", "b": true}, {"t": "eel KOHN-toh, per fah-VOH-reh", "b": false}, {"t": "The bill, please", "b": false}], [{"t": "<strong>Dov'è il bagno?</strong>", "b": true}, {"t": "doh-VEH eel BAH-nyoh", "b": false}, {"t": "Where is the bathroom?", "b": false}], [{"t": "<strong>Ho bisogno di aiuto</strong>", "b": true}, {"t": "oh bee-ZOH-nyoh dee ah-YOO-toh", "b": false}, {"t": "I need help", "b": false}], [{"t": "<strong>Non capisco</strong>", "b": true}, {"t": "nohn kah-PEES-koh", "b": false}, {"t": "I don't understand", "b": false}], [{"t": "<strong>Può ripetere, per favore?</strong>", "b": true}, {"t": "PWOH ree-PEH-teh-reh, per fah-VOH-reh", "b": false}, {"t": "Can you repeat that, please?", "b": false}], [{"t": "<strong>Parla inglese?</strong>", "b": true}, {"t": "PAR-lah een-GLEH-zeh", "b": false}, {"t": "Do you speak English?", "b": false}], [{"t": "<strong>Vorrei prenotare una camera</strong>", "b": true}, {"t": "vor-RAY preh-noh-TAH-reh OO-nah KAH-meh-rah", "b": false}, {"t": "I want to book a room", "b": false}], [{"t": "<strong>A che ora parte il treno?</strong>", "b": true}, {"t": "ah keh OH-rah PAR-teh eel TREH-noh", "b": false}, {"t": "What time does the train leave?", "b": false}], [{"t": "<strong>Dove posso prendere un taxi?</strong>", "b": true}, {"t": "DOH-veh POS-soh PREN-deh-reh oon TAK-see", "b": false}, {"t": "Where can I catch a taxi?", "b": false}]]}], "tip": false}, {"title": "Authentic Italian Slang & Expressions", "blocks": [{"type": "p", "html": "These are the phrases that separate someone who speaks \"correct\" Italian from someone who sounds truly Italian. Use them in the right context and you'll get a completely different reaction from native speakers:", "italic": false}, {"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>Dai!</strong>", "b": true}, {"t": "DY", "b": false}, {"t": "Come on! / Seriously? — very common, used to encourage or express surprise", "b": false}], [{"t": "<strong>Magari!</strong>", "b": true}, {"t": "mah-GAH-ree", "b": false}, {"t": "If only! / I wish!", "b": false}], [{"t": "<strong>Boh</strong>", "b": true}, {"t": "BOH", "b": false}, {"t": "No idea — an extremely common expression of uncertainty", "b": false}], [{"t": "<strong>Figo</strong>", "b": true}, {"t": "FEE-goh", "b": false}, {"t": "Cool / awesome", "b": false}], [{"t": "<strong>Che casino!</strong>", "b": true}, {"t": "keh kah-ZEE-noh", "b": false}, {"t": "What a mess!", "b": false}], [{"t": "<strong>In bocca al lupo</strong>", "b": true}, {"t": "een BOHK-kah al LOO-poh", "b": false}, {"t": "Good luck (literally \"in the wolf's mouth\") — a traditional way to wish someone luck", "b": false}], [{"t": "<strong>Andiamo!</strong>", "b": true}, {"t": "an-DYAH-moh", "b": false}, {"t": "Let's go!", "b": false}]]}], "tip": false}, {"title": "Full Practice Dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it out loud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "Ciao! Benvenuto. Cosa desidera?", "trans": "Hi! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "Ciao! Vorrei un caffè, per favore.", "trans": "Hi! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "Solo questo?", "trans": "Just that?"}, {"speaker": "Customer:", "orig": "Sì, e il conto, per favore.", "trans": "Yes, and the bill, please."}, {"speaker": "Waiter:", "orig": "Sono due euro. Grazie!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "Prego, a dopo!", "trans": "You're welcome, see you later!"}]}], "tip": false}, {"title": "Action Plan: How to Learn Fast", "blocks": [{"type": "list", "label": "<strong>7 Steps to Lock In the Language Fast</strong>", "intro": null, "items": ["Listen to Italian songs and TV shows every day, even just 10 minutes — your ear adapts to the rhythm before your brain does.", "Practice \"shadowing\": listen to a short sentence and repeat it immediately with the same rhythm and speed.", "Focus on double consonants (like tt and ll) and try to hold them slightly longer, just like Italians do.", "Don't translate in your head — try to think directly in Italian instead of going through English first.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary through repetition.", "Speak from day one, even with mistakes — fluency comes from practice, not memorization.", "Notice the similarities between Italian and Spanish or Portuguese if you've studied them before — it'll make this much easier."]}], "tip": true}, {"title": "Introduction: Who Is This Book For?", "blocks": [{"type": "p", "html": "This book is the second part after \"Learn Italian — Easy, Fun, and Fast\", which covered the basics. If you've finished the basic level and want to reach a level you can actually rely on for travel, work, and daily life in Italy, this book will give you: the tenses you need to talk about the past and future, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "<strong>Before You Start</strong>", "intro": null, "items": ["You should already know: greetings, pronouns, the verb Essere/Stare, present tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take your time with each chapter, and practice the examples out loud before moving to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick Review of the Basics", "blocks": [{"type": "h3", "text": "<strong>Pronouns</strong>"}, {"type": "table", "headers": ["io", "tu", "lui/lei", "noi", "voi/loro"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you all/they", "b": false}]]}, {"type": "h3", "text": "<strong>Present tense — the regular patterns</strong>"}, {"type": "table", "headers": ["Pronoun", "-ire (dormire)", "-ere (scrivere)", "-are (parlare)"], "rows": [[{"t": "io", "b": false}, {"t": "dormo", "b": false}, {"t": "scrivo", "b": false}, {"t": "parlo", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "dorme", "b": false}, {"t": "scrive", "b": false}, {"t": "parla", "b": false}], [{"t": "noi", "b": false}, {"t": "dormiamo", "b": false}, {"t": "scriviamo", "b": false}, {"t": "parliamo", "b": false}], [{"t": "loro", "b": false}, {"t": "dormono", "b": false}, {"t": "scrivono", "b": false}, {"t": "parlano", "b": false}]]}, {"type": "h3", "text": "<strong>Essere / Stare (present tense)</strong>"}, {"type": "table", "headers": ["Pronoun", "Stare", "Essere"], "rows": [[{"t": "io", "b": false}, {"t": "sto", "b": false}, {"t": "sono", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "sta", "b": false}, {"t": "è", "b": false}], [{"t": "noi", "b": false}, {"t": "stiamo", "b": false}, {"t": "siamo", "b": false}], [{"t": "loro", "b": false}, {"t": "stanno", "b": false}, {"t": "sono", "b": false}]]}], "tip": false}, {"title": "The Recent Past (Passato Prossimo)", "blocks": [{"type": "p", "html": "This is the basic past tense in spoken Italian, formed with an auxiliary verb (Avere or Essere) in the present tense + the past participle.", "italic": false}, {"type": "h3", "text": "<strong>With Avere (for most verbs)</strong>"}, {"type": "table", "headers": ["Pronoun", "Full conjugation"], "rows": [[{"t": "io", "b": false}, {"t": "ho parlato (I spoke)", "b": false}], [{"t": "tu", "b": false}, {"t": "hai parlato", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "ha parlato", "b": false}], [{"t": "noi", "b": false}, {"t": "abbiamo parlato", "b": false}], [{"t": "loro", "b": false}, {"t": "hanno parlato", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "With Essere (motion verbs and reflexive verbs)", "trans": "Very important: with Essere, the past participle must agree in gender and number with the subject, just like an adjective would."}]}, {"type": "table", "headers": ["Pronoun", "Full conjugation"], "rows": [[{"t": "io (male speaker)", "b": false}, {"t": "sono andato (I went)", "b": false}], [{"t": "io (female speaker)", "b": false}, {"t": "sono andata", "b": false}], [{"t": "lui", "b": false}, {"t": "è andato", "b": false}], [{"t": "lei", "b": false}, {"t": "è andata", "b": false}], [{"t": "noi (masc./mixed)", "b": false}, {"t": "siamo andati", "b": false}]]}, {"type": "p", "html": "<em>Quick rule: verbs indicating motion or movement (andare, venire, partire) or reflexive verbs use Essere; everything else uses Avere.</em>", "italic": true}], "tip": false}, {"title": "The Imperfect Past (Imperfetto)", "blocks": [{"type": "p", "html": "Used to describe something that happened repeatedly or continuously in the past — not a single completed event, but a habit or a description of a state.", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ire/-ere (dormire/scrivere)", "-are (parlare)"], "rows": [[{"t": "io", "b": false}, {"t": "dormivo / scrivevo", "b": false}, {"t": "parlavo", "b": false}], [{"t": "tu", "b": false}, {"t": "dormivi / scrivevi", "b": false}, {"t": "parlavi", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "dormiva / scriveva", "b": false}, {"t": "parlava", "b": false}], [{"t": "noi", "b": false}, {"t": "dormivamo / scrivevamo", "b": false}, {"t": "parlavamo", "b": false}], [{"t": "loro", "b": false}, {"t": "dormivano / scrivevano", "b": false}, {"t": "parlavano", "b": false}]]}, {"type": "p", "html": "Examples: Quando ero bambino, vivevo al Cairo. (When I was a child, I lived in Cairo.) — Lui lavorava tutti i giorni. (He used to work every day.)", "italic": false}], "tip": false}, {"title": "The Future & the Conditional", "blocks": [{"type": "dialogue", "lines": [{"speaker": null, "orig": "Future (Futuro)", "trans": "Formed from the infinitive (dropping the final e and changing a to e in -are verbs) + fixed endings:"}]}, {"type": "table", "headers": ["Pronoun", "parlare"], "rows": [[{"t": "io", "b": false}, {"t": "parlerò", "b": false}], [{"t": "tu", "b": false}, {"t": "parlerai", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "parlerà", "b": false}], [{"t": "noi", "b": false}, {"t": "parleremo", "b": false}], [{"t": "loro", "b": false}, {"t": "parleranno", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "The Conditional — for polite requests and hypotheticals", "trans": "Same base as the future + endings ei, esti, ebbe, emmo, este, ebbero:"}]}, {"type": "table", "headers": ["Pronoun", "parlare", "volere"], "rows": [[{"t": "io", "b": false}, {"t": "parlerei", "b": false}, {"t": "vorrei", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "parlerebbe", "b": false}, {"t": "vorrebbe", "b": false}], [{"t": "noi", "b": false}, {"t": "parleremmo", "b": false}, {"t": "vorremmo", "b": false}]]}, {"type": "p", "html": "Practical examples: Vorrei prenotare un tavolo. (I'd like to book a table.) — Potrebbe aiutarmi? (Could you help me?)", "italic": false}], "tip": false}, {"title": "The Subjunctive Mood — Congiuntivo (Basics)", "blocks": [{"type": "p", "html": "Used for doubt, wishes, hypotheticals, or after verbs like \"to want that\", \"to hope that\", \"to think that\". It usually follows the word \"che\" (that).", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ire (dormire)", "-ere (scrivere)", "-are (parlare)"], "rows": [[{"t": "che io", "b": false}, {"t": "dorma", "b": false}, {"t": "scriva", "b": false}, {"t": "parli", "b": false}], [{"t": "che tu", "b": false}, {"t": "dorma", "b": false}, {"t": "scriva", "b": false}, {"t": "parli", "b": false}], [{"t": "che noi", "b": false}, {"t": "dormiamo", "b": false}, {"t": "scriviamo", "b": false}, {"t": "parliamo", "b": false}], [{"t": "che loro", "b": false}, {"t": "dormano", "b": false}, {"t": "scrivano", "b": false}, {"t": "parlino", "b": false}]]}, {"type": "h3", "text": "<strong>When do you use it?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["After \"spero che\" (I hope that...): Spero che tu stia bene. (I hope you're doing well.)", "After \"penso che\" (I think that...): Penso che sia vero. (I think it's true.)", "After \"voglio che\" (I want you to...): Voglio che tu mi aiuti. (I want you to help me.)", "After \"è possibile che\" (it's possible that): È possibile che piova. (It might rain.)", "After \"sebbene\" (although): Sebbene sia stanco, vado a lavorare. (Although I'm tired, I'm going to work.)"]}], "tip": false}, {"title": "Reflexive Verbs", "blocks": [{"type": "p", "html": "The pronoun always goes before the conjugated verb — this is the standard position in Italian:", "italic": false}, {"type": "table", "headers": ["Pronoun", "chiamarsi (to be called)", "alzarsi (to get up)", "vestirsi (to get dressed)"], "rows": [[{"t": "io", "b": false}, {"t": "mi chiamo", "b": false}, {"t": "mi alzo", "b": false}, {"t": "mi vesto", "b": false}], [{"t": "tu", "b": false}, {"t": "ti chiami", "b": false}, {"t": "ti alzi", "b": false}, {"t": "ti vesti", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "si chiama", "b": false}, {"t": "si alza", "b": false}, {"t": "si veste", "b": false}], [{"t": "noi", "b": false}, {"t": "ci chiamiamo", "b": false}, {"t": "ci alziamo", "b": false}, {"t": "ci vestiamo", "b": false}]]}, {"type": "p", "html": "A very common example: \"Come ti chiami?\" (What's your name?) — The answer: \"Mi chiamo Ahmed.\" (My name is Ahmed.)", "italic": false}], "tip": false}, {"title": "Object Pronouns & Their Placement", "blocks": [{"type": "h3", "text": "<strong>The table</strong>"}, {"type": "table", "headers": ["Subject", "Direct object", "Indirect object"], "rows": [[{"t": "io", "b": false}, {"t": "mi", "b": false}, {"t": "mi", "b": false}], [{"t": "tu", "b": false}, {"t": "ti", "b": false}, {"t": "ti", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "lo / la", "b": false}, {"t": "gli / le", "b": false}], [{"t": "noi", "b": false}, {"t": "ci", "b": false}, {"t": "ci", "b": false}], [{"t": "loro", "b": false}, {"t": "li / le", "b": false}, {"t": "gli", "b": false}]]}, {"type": "h3", "text": "<strong>Where does the pronoun go?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["General rule: the pronoun always goes before the conjugated verb: Ti vedo domani. (I'll see you tomorrow.)", "It attaches to the end of the verb with the infinitive (after dropping the final e), the gerund, or the imperative: vederti, vedendoti, Dimmi! (Tell me!)", "Notice that the third-person singular indirect object pronoun changes by gender: gli for a man, le for a woman — an important difference from English, which just uses \"him/her/them\"."]}], "tip": false}, {"title": "Prepositions & Their Fusion with Definite Articles", "blocks": [{"type": "p", "html": "Italian has the richest system of merging prepositions with definite articles among the Romance languages:", "italic": false}, {"type": "table", "headers": ["Preposition", "+ il", "+ lo", "+ la", "+ i", "+ le"], "rows": [[{"t": "di (of)", "b": false}, {"t": "del", "b": false}, {"t": "dello", "b": false}, {"t": "della", "b": false}, {"t": "dei", "b": false}, {"t": "delle", "b": false}], [{"t": "a (to)", "b": false}, {"t": "al", "b": false}, {"t": "allo", "b": false}, {"t": "alla", "b": false}, {"t": "ai", "b": false}, {"t": "alle", "b": false}], [{"t": "da (from)", "b": false}, {"t": "dal", "b": false}, {"t": "dallo", "b": false}, {"t": "dalla", "b": false}, {"t": "dai", "b": false}, {"t": "dalle", "b": false}], [{"t": "in (in)", "b": false}, {"t": "nel", "b": false}, {"t": "nello", "b": false}, {"t": "nella", "b": false}, {"t": "nei", "b": false}, {"t": "nelle", "b": false}], [{"t": "su (on)", "b": false}, {"t": "sul", "b": false}, {"t": "sullo", "b": false}, {"t": "sulla", "b": false}, {"t": "sui", "b": false}, {"t": "sulle", "b": false}]]}, {"type": "p", "html": "Examples: Vado al mercato. (I'm going to the market.) — Il libro è dello studente. (The book belongs to the student.) — Sono nel giardino. (I'm in the garden.)", "italic": false}], "tip": false}, {"title": "Comparatives, Superlatives & Advanced Connectors", "blocks": [{"type": "h3", "text": "<strong>Comparatives and superlatives</strong>"}, {"type": "table", "headers": ["Use", "Structure", "Example"], "rows": [[{"t": "more than", "b": false}, {"t": "più... di", "b": false}, {"t": "Più caro di (more expensive than)", "b": false}], [{"t": "less than", "b": false}, {"t": "meno... di", "b": false}, {"t": "Meno caro di (less expensive than)", "b": false}], [{"t": "as... as", "b": false}, {"t": "così... come", "b": false}, {"t": "Così bravo come (as good as)", "b": false}], [{"t": "the most", "b": false}, {"t": "il più / la più", "b": false}, {"t": "Il più caro (the most expensive)", "b": false}]]}, {"type": "table", "headers": ["Adjective", "Irregular comparative"], "rows": [[{"t": "buono (good)", "b": false}, {"t": "migliore (better)", "b": false}], [{"t": "cattivo (bad)", "b": false}, {"t": "peggiore (worse)", "b": false}], [{"t": "grande (big)", "b": false}, {"t": "maggiore (bigger)", "b": false}], [{"t": "piccolo (small)", "b": false}, {"t": "minore (smaller)", "b": false}]]}, {"type": "h3", "text": "<strong>Advanced connectors</strong>"}, {"type": "table", "headers": ["Meaning", "Connector"], "rows": [[{"t": "but", "b": false}, {"t": "ma", "b": false}], [{"t": "but (more formal)", "b": false}, {"t": "però / tuttavia", "b": false}], [{"t": "therefore", "b": false}, {"t": "quindi", "b": false}], [{"t": "because", "b": false}, {"t": "perché", "b": false}], [{"t": "given that", "b": false}, {"t": "dato che", "b": false}], [{"t": "although", "b": false}, {"t": "sebbene", "b": false}], [{"t": "despite", "b": false}, {"t": "nonostante", "b": false}], [{"t": "in case", "b": false}, {"t": "nel caso in cui", "b": false}]]}], "tip": false}, {"title": "Vocabulary: Airport & Customs", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>passaporto</strong>", "b": true}, {"t": "pahs-sah-POR-toh", "b": false}, {"t": "passport", "b": false}], [{"t": "<strong>visto</strong>", "b": true}, {"t": "VEE-stoh", "b": false}, {"t": "visa", "b": false}], [{"t": "<strong>biglietto</strong>", "b": true}, {"t": "bee-LYET-toh", "b": false}, {"t": "ticket", "b": false}], [{"t": "<strong>imbarco</strong>", "b": true}, {"t": "eem-BAR-koh", "b": false}, {"t": "boarding", "b": false}], [{"t": "<strong>bagagli</strong>", "b": true}, {"t": "bah-GAH-lyee", "b": false}, {"t": "luggage", "b": false}], [{"t": "<strong>bagaglio a mano</strong>", "b": true}, {"t": "bah-GAH-lyoh ah MAH-noh", "b": false}, {"t": "hand luggage", "b": false}], [{"t": "<strong>volo</strong>", "b": true}, {"t": "VOH-loh", "b": false}, {"t": "flight", "b": false}], [{"t": "<strong>ritardo</strong>", "b": true}, {"t": "ree-TAR-doh", "b": false}, {"t": "delay", "b": false}], [{"t": "<strong>cancellato</strong>", "b": true}, {"t": "kahn-chel-LAH-toh", "b": false}, {"t": "cancelled", "b": false}], [{"t": "<strong>dogana</strong>", "b": true}, {"t": "doh-GAH-nah", "b": false}, {"t": "customs", "b": false}], [{"t": "<strong>Ho qualcosa da dichiarare</strong>", "b": true}, {"t": "oh kwahl-KOH-zah dah dee-kyah-RAH-reh", "b": false}, {"t": "I have something to declare", "b": false}]]}], "tip": false}, {"title": "Vocabulary: Hotel Problems", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>Il condizionatore non funziona</strong>", "b": true}, {"t": "eel kon-dee-tsyoh-nah-TOH-reh nohn foon-TSYOH-nah", "b": false}, {"t": "The air conditioning isn't working", "b": false}], [{"t": "<strong>Non c'è acqua calda</strong>", "b": true}, {"t": "nohn cheh AH-kwah KAHL-dah", "b": false}, {"t": "There's no hot water", "b": false}], [{"t": "<strong>Vorrei cambiare camera</strong>", "b": true}, {"t": "vor-RAY kahm-BYAH-reh KAH-meh-rah", "b": false}, {"t": "I would like to change rooms", "b": false}], [{"t": "<strong>La chiave non funziona</strong>", "b": true}, {"t": "lah KYAH-veh nohn foon-TSYOH-nah", "b": false}, {"t": "The key isn't working", "b": false}], [{"t": "<strong>Potete pulire la camera?</strong>", "b": true}, {"t": "poh-TEH-teh poo-LEE-reh lah KAH-meh-rah", "b": false}, {"t": "Can you clean the room?", "b": false}], [{"t": "<strong>A che ora è il check-out?</strong>", "b": true}, {"t": "ah keh OH-rah eh eel check-out", "b": false}, {"t": "What time is check-out?", "b": false}], [{"t": "<strong>reclamo</strong>", "b": true}, {"t": "reh-KLAH-moh", "b": false}, {"t": "complaint", "b": false}], [{"t": "<strong>reception</strong>", "b": true}, {"t": "ree-SEP-shun", "b": false}, {"t": "reception/front desk", "b": false}], [{"t": "<strong>prenotazione</strong>", "b": true}, {"t": "preh-noh-tah-TSYOH-neh", "b": false}, {"t": "reservation", "b": false}]]}], "tip": false}, {"title": "Vocabulary: Health, Emergencies & the Pharmacy", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>medico</strong>", "b": true}, {"t": "MEH-dee-koh", "b": false}, {"t": "doctor", "b": false}], [{"t": "<strong>ospedale</strong>", "b": true}, {"t": "os-peh-DAH-leh", "b": false}, {"t": "hospital", "b": false}], [{"t": "<strong>farmacia</strong>", "b": true}, {"t": "far-mah-CHEE-ah", "b": false}, {"t": "pharmacy", "b": false}], [{"t": "<strong>dolore</strong>", "b": true}, {"t": "doh-LOH-reh", "b": false}, {"t": "pain", "b": false}], [{"t": "<strong>Ho bisogno di un medico</strong>", "b": true}, {"t": "oh bee-ZOH-nyoh dee oon MEH-dee-koh", "b": false}, {"t": "I need a doctor", "b": false}], [{"t": "<strong>Non mi sento bene</strong>", "b": true}, {"t": "nohn mee SEN-toh BEH-neh", "b": false}, {"t": "I don't feel well", "b": false}], [{"t": "<strong>febbre</strong>", "b": true}, {"t": "FEB-breh", "b": false}, {"t": "fever", "b": false}], [{"t": "<strong>mal di testa</strong>", "b": true}, {"t": "mahl dee TES-tah", "b": false}, {"t": "headache", "b": false}], [{"t": "<strong>mal di stomaco</strong>", "b": true}, {"t": "mahl dee STOH-mah-koh", "b": false}, {"t": "stomach ache", "b": false}], [{"t": "<strong>ricetta medica</strong>", "b": true}, {"t": "ree-CHET-tah MEH-dee-kah", "b": false}, {"t": "prescription", "b": false}], [{"t": "<strong>ambulanza</strong>", "b": true}, {"t": "am-boo-LAHN-tsah", "b": false}, {"t": "ambulance", "b": false}], [{"t": "<strong>emergenza</strong>", "b": true}, {"t": "eh-mer-JEN-tsah", "b": false}, {"t": "emergency", "b": false}], [{"t": "<strong>Chiama un'ambulanza!</strong>", "b": true}, {"t": "KYAH-mah oon am-boo-LAHN-tsah", "b": false}, {"t": "Call an ambulance!", "b": false}], [{"t": "<strong>allergia</strong>", "b": true}, {"t": "al-ler-JEE-ah", "b": false}, {"t": "allergy", "b": false}], [{"t": "<strong>medicina</strong>", "b": true}, {"t": "meh-dee-CHEE-nah", "b": false}, {"t": "medication", "b": false}]]}], "tip": false}, {"title": "Vocabulary: Bank, Police & Official Matters", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>banca</strong>", "b": true}, {"t": "BAHN-kah", "b": false}, {"t": "bank", "b": false}], [{"t": "<strong>cambio valuta</strong>", "b": true}, {"t": "KAHM-byoh vah-LOO-tah", "b": false}, {"t": "currency exchange", "b": false}], [{"t": "<strong>prelevare soldi</strong>", "b": true}, {"t": "preh-leh-VAH-reh SOHL-dee", "b": false}, {"t": "to withdraw money", "b": false}], [{"t": "<strong>carta di credito</strong>", "b": true}, {"t": "KAR-tah dee KREH-dee-toh", "b": false}, {"t": "credit card", "b": false}], [{"t": "<strong>bancomat</strong>", "b": true}, {"t": "BAHN-koh-mat", "b": false}, {"t": "ATM", "b": false}], [{"t": "<strong>stazione di polizia</strong>", "b": true}, {"t": "stah-TSYOH-neh dee poh-lee-TSEE-ah", "b": false}, {"t": "police station", "b": false}], [{"t": "<strong>Sono stato derubato</strong>", "b": true}, {"t": "SOH-noh STAH-toh deh-roo-BAH-toh", "b": false}, {"t": "I've been robbed", "b": false}], [{"t": "<strong>Ho perduto il mio passaporto</strong>", "b": true}, {"t": "oh per-DOO-toh eel MEE-oh pahs-sah-POR-toh", "b": false}, {"t": "I've lost my passport", "b": false}], [{"t": "<strong>documento di identità</strong>", "b": true}, {"t": "doh-koo-MEN-toh dee ee-den-tee-TAH", "b": false}, {"t": "ID document", "b": false}], [{"t": "<strong>ambasciata</strong>", "b": true}, {"t": "am-bah-SHAH-tah", "b": false}, {"t": "embassy", "b": false}]]}], "tip": false}, {"title": "Vocabulary: Transportation, Car Rental & Directions", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>noleggiare una macchina</strong>", "b": true}, {"t": "noh-led-JAH-reh OO-nah MAHK-kee-nah", "b": false}, {"t": "to rent a car", "b": false}], [{"t": "<strong>patente</strong>", "b": true}, {"t": "pah-TEN-teh", "b": false}, {"t": "driver's license", "b": false}], [{"t": "<strong>assicurazione</strong>", "b": true}, {"t": "as-see-koo-rah-TSYOH-neh", "b": false}, {"t": "insurance", "b": false}], [{"t": "<strong>benzina</strong>", "b": true}, {"t": "ben-DZEE-nah", "b": false}, {"t": "gasoline", "b": false}], [{"t": "<strong>parcheggio</strong>", "b": true}, {"t": "par-KED-joh", "b": false}, {"t": "parking", "b": false}], [{"t": "<strong>Giri a destra/sinistra</strong>", "b": true}, {"t": "JEE-ree ah DES-trah/see-NEE-strah", "b": false}, {"t": "Turn right/left", "b": false}], [{"t": "<strong>Vada sempre dritto</strong>", "b": true}, {"t": "VAH-dah SEM-preh DREET-toh", "b": false}, {"t": "Keep going straight", "b": false}], [{"t": "<strong>semaforo</strong>", "b": true}, {"t": "seh-MAH-foh-roh", "b": false}, {"t": "traffic light", "b": false}], [{"t": "<strong>rotatoria</strong>", "b": true}, {"t": "roh-tah-TOH-ree-ah", "b": false}, {"t": "roundabout", "b": false}], [{"t": "<strong>autostrada</strong>", "b": true}, {"t": "ow-toh-STRAH-dah", "b": false}, {"t": "highway", "b": false}], [{"t": "<strong>pedaggio</strong>", "b": true}, {"t": "peh-DAHD-joh", "b": false}, {"t": "toll", "b": false}], [{"t": "<strong>metro</strong>", "b": true}, {"t": "MEH-troh", "b": false}, {"t": "subway", "b": false}], [{"t": "<strong>stazione</strong>", "b": true}, {"t": "stah-TSYOH-neh", "b": false}, {"t": "station", "b": false}]]}], "tip": false}, {"title": "Vocabulary: Shopping, Bargaining & Business", "blocks": [{"type": "table", "headers": ["Italian", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>Può fare uno sconto?</strong>", "b": true}, {"t": "PWOH FAH-reh OO-noh SKON-toh", "b": false}, {"t": "Can you give me a discount?", "b": false}], [{"t": "<strong>È molto caro</strong>", "b": true}, {"t": "eh MOHL-toh KAH-roh", "b": false}, {"t": "It's very expensive", "b": false}], [{"t": "<strong>offerta</strong>", "b": true}, {"t": "of-FER-tah", "b": false}, {"t": "special offer", "b": false}], [{"t": "<strong>fattura</strong>", "b": true}, {"t": "faht-TOO-rah", "b": false}, {"t": "invoice", "b": false}], [{"t": "<strong>riunione</strong>", "b": true}, {"t": "ryoo-NYOH-neh", "b": false}, {"t": "meeting", "b": false}], [{"t": "<strong>affare</strong>", "b": true}, {"t": "af-FAH-reh", "b": false}, {"t": "business deal", "b": false}], [{"t": "<strong>azienda</strong>", "b": true}, {"t": "ah-DZYEN-dah", "b": false}, {"t": "company", "b": false}], [{"t": "<strong>cliente</strong>", "b": true}, {"t": "klee-EN-teh", "b": false}, {"t": "client", "b": false}], [{"t": "<strong>contratto</strong>", "b": true}, {"t": "kon-TRAHT-toh", "b": false}, {"t": "contract", "b": false}], [{"t": "<strong>scadenza</strong>", "b": true}, {"t": "skah-DEN-tsah", "b": false}, {"t": "deadline", "b": false}]]}], "tip": false}, {"title": "Etiquette: Formal or Informal?", "blocks": [{"type": "h3", "text": "<strong>When to use tu vs. Lei?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Use \"Lei\" (capitalized, the formal form of address) with anyone older than you, at work, or the first time you meet someone — it's conjugated like third-person singular (she).", "Use \"tu\" with friends, family, or people your age.", "Italians like meals to take their time — lunch and dinner are social occasions, not just quick fuel stops.", "Tipping isn't mandatory the way it is in the US, but rounding up the bill at restaurants is common and appreciated.", "Punctuality matters in formal settings, but social gatherings tend to allow some flexibility with timing."]}], "tip": false}, {"title": "Advanced Idioms & Expressions", "blocks": [{"type": "table", "headers": ["Meaning / Use", "Italian Expression"], "rows": [[{"t": "Good luck (literally \"in the wolf's mouth\")", "b": false}, {"t": "In bocca al lupo", "b": false}], [{"t": "Very expensive (literally \"cost an eye of the head\")", "b": false}, {"t": "Costare un occhio della testa", "b": false}], [{"t": "Can't wait (literally \"I don't see the hour\")", "b": false}, {"t": "Non vedo l'ora", "b": false}], [{"t": "To be involved in something (literally \"have hands in the dough\")", "b": false}, {"t": "Avere le mani in pasta", "b": false}], [{"t": "To be sharp/on the ball (literally \"to be in leg\")", "b": false}, {"t": "Essere in gamba", "b": false}], [{"t": "To make a gesture against bad luck (literally \"make horns\")", "b": false}, {"t": "Fare le corna", "b": false}], [{"t": "To tease/make fun of someone (literally \"take around\")", "b": false}, {"t": "Prendere in giro", "b": false}]]}], "tip": false}, {"title": "Advanced Practice Dialogues (5 Real Scenarios)", "blocks": [{"type": "h3", "text": "<strong>1) At the Airport — Flight Delay</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Passenger:", "orig": "Buonasera, il mio volo per Roma è in ritardo?", "trans": "Good evening, is my flight to Rome delayed?"}, {"speaker": "Employee:", "orig": "Sì, purtroppo è in ritardo di un'ora.", "trans": "Yes, unfortunately it's an hour late."}, {"speaker": "Passenger:", "orig": "Perderò la coincidenza per Milano?", "trans": "Am I going to miss my connection to Milan?"}, {"speaker": "Employee:", "orig": "Non si preoccupi, abbiamo già riorganizzato il suo viaggio.", "trans": "Don't worry, we've already rearranged your trip."}]}, {"type": "h3", "text": "<strong>2) Hotel Complaint</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Mi scusi, il condizionatore della mia camera non funziona.", "trans": "Excuse me, the air conditioning in my room isn't working."}, {"speaker": "Reception:", "orig": "Mi dispiace molto. Mando subito qualcuno.", "trans": "I'm so sorry. I'll send someone right away."}, {"speaker": "Guest:", "orig": "Grazie. Vorrei anche cambiare camera, se possibile.", "trans": "Thanks. I'd also like to change rooms if possible."}, {"speaker": "Reception:", "orig": "Certo, controllo la disponibilità.", "trans": "Of course, let me check availability."}]}, {"type": "h3", "text": "<strong>3) At the Pharmacy</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Customer:", "orig": "Buonasera, non mi sento bene. Ho mal di testa e febbre.", "trans": "Good evening, I don't feel well. I have a headache and a fever."}, {"speaker": "Pharmacist:", "orig": "Da quanto tempo ha questi sintomi?", "trans": "How long have you had these symptoms?"}, {"speaker": "Customer:", "orig": "Da ieri sera.", "trans": "Since last night."}, {"speaker": "Pharmacist:", "orig": "Prenda questa medicina ogni otto ore.", "trans": "Take this medication every eight hours."}]}, {"type": "h3", "text": "<strong>4) Renting a Car</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Customer:", "orig": "Vorrei noleggiare una macchina per tre giorni.", "trans": "I'd like to rent a car for three days."}, {"speaker": "Employee:", "orig": "Certo. Posso vedere la sua patente, per favore?", "trans": "Of course. Can I see your driver's license, please?"}, {"speaker": "Customer:", "orig": "Ecco a lei. L'assicurazione è inclusa?", "trans": "Here you go. Is insurance included?"}, {"speaker": "Employee:", "orig": "Sì, l'assicurazione di base è inclusa nel prezzo.", "trans": "Yes, basic insurance is included in the price."}]}, {"type": "h3", "text": "<strong>5) Asking for Directions</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Tourist:", "orig": "Mi scusi, come arrivo al Colosseo?", "trans": "Excuse me, how do I get to the Colosseum?"}, {"speaker": "Local:", "orig": "Vada sempre dritto e poi giri a destra alla seconda strada.", "trans": "Keep going straight and then turn right at the second street."}, {"speaker": "Tourist:", "orig": "È molto lontano da qui?", "trans": "Is it very far from here?"}, {"speaker": "Local:", "orig": "No, è a circa dieci minuti a piedi.", "trans": "No, it's about a ten-minute walk."}]}], "tip": false}, {"title": "Reading Passage for Practice", "blocks": [{"type": "p", "html": "Read this passage out loud a few times, and try to understand it without translating every single word:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>Key vocabulary from the passage</strong>"}, {"type": "table", "headers": ["Meaning", "Word"], "rows": [[{"t": "typical/local restaurant", "b": false}, {"t": "ristorante tipico", "b": false}], [{"t": "the Colosseum", "b": false}, {"t": "il Colosseo", "b": false}], [{"t": "live music", "b": false}, {"t": "musica dal vivo", "b": false}], [{"t": "unforgettable", "b": false}, {"t": "indimenticabile", "b": false}]]}, {"type": "h3", "text": "<strong>Comprehension questions</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["When did the family go to Rome?", "What did they do after check-in?", "Where did they listen to live music?"]}, {"type": "p", "html": "<em>Answers: 1) Yesterday 2) They went downtown for lunch 3) Near Piazza Navona, at night</em>", "italic": true}], "tip": false}, {"title": "Conclusion: Your Next Steps to Fluency", "blocks": [{"type": "list", "label": "<strong>To Reach Full Fluency</strong>", "intro": null, "items": ["Read simple Italian news articles or blogs daily, and try to understand from context before translating.", "Talk with native speakers (online, or in person if you travel) — real practice is the most valuable thing now.", "Write a short daily journal in Italian — even 3-4 sentences a day makes a big difference over time.", "Review these tenses periodically until they become automatic and you no longer need to think about them.", "Don't be afraid of making mistakes in conversation — Italians deeply appreciate anyone who tries to speak their language."]}], "tip": true}], "closingBasic": "Congratulations in advance on your Italian journey — In bocca al lupo! (Good luck!)", "closingAdvanced": "Your Italian journey is now ready for a level you can truly rely on — In bocca al lupo! (Good luck!)"}, "fr": {"chapters": [{"title": "Introduction : pourquoi apprendre l'italien ?", "blocks": [{"type": "p", "html": "L'italien est la langue officielle de l'Italie et de la Suisse (partiellement), parlée par plus de 65 millions de personnes, et reconnue dans le monde entier comme la langue de l'art, de la musique et de la gastronomie. Ce livre te donne une base solide en italien standard tel qu'on le parle en Italie.", "italic": false}, {"type": "p", "html": "La bonne nouvelle : l'italien, comme le français, est une langue latine, et son vocabulaire te semblera souvent familier. La principale difficulté réside dans les doubles consonnes, qui changent réellement le sens d'un mot, et dans un rythme de la phrase très musical, presque chanté.", "italic": false}, {"type": "list", "label": "Objectifs de ce livre", "intro": null, "items": ["Te donner une base solide de vocabulaire et de grammaire essentielle en un minimum de temps.", "Te concentrer sur une prononciation correcte pour que ton accent sonne authentiquement italien.", "Te donner des phrases pratiques utilisables dès le premier jour dans des situations réelles."]}], "tip": false}, {"title": "L'alphabet et les bases de la prononciation", "blocks": [{"type": "p", "html": "L'italien utilise l'alphabet latin (sans j, k, w, x, y dans les mots d'origine italienne) et se prononce presque comme il s'écrit — un net avantage par rapport au français. Ce tableau présente les sons les plus distinctifs :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Mot"], "rows": [[{"t": "maison", "b": false}, {"t": "ka-za", "b": false}, {"t": "casa (le c reste dur devant a)", "b": true}], [{"t": "bonjour", "b": false}, {"t": "bwon-jor-no", "b": false}, {"t": "buongiorno", "b": true}], [{"t": "merci", "b": false}, {"t": "gra-tsié", "b": false}, {"t": "grazie (zi = « tsi »)", "b": true}], [{"t": "chat", "b": false}, {"t": "gat-to", "b": false}, {"t": "gatto (double t bien marquée)", "b": true}], [{"t": "je", "b": false}, {"t": "io", "b": false}, {"t": "io (se prononce « i-o », deux syllabes)", "b": true}], [{"t": "garçon", "b": false}, {"t": "ra-gat-tso", "b": false}, {"t": "ragazzo (zz = « tso »)", "b": true}], [{"t": "ciel", "b": false}, {"t": "tché-lo", "b": false}, {"t": "cielo (ci devant e/o = « tché »)", "b": true}], [{"t": "eau", "b": false}, {"t": "ak-koua", "b": false}, {"t": "acqua (double c = son renforcé)", "b": true}], [{"t": "œuf", "b": false}, {"t": "wo-vo", "b": false}, {"t": "uovo", "b": true}], [{"t": "vin", "b": false}, {"t": "vi-no", "b": false}, {"t": "vino", "b": true}]]}], "tip": false}, {"title": "Les règles d'or pour une prononciation authentique", "blocks": [{"type": "p", "html": "Ces 6 règles d'or feront toute la différence pour sonner vraiment italien :", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Les doubles consonnes se prononcent réellement plus longues (« nonno » grand-père ≠ « nono » neuvième) — c'est souvent la clé pour être bien compris.", "La lettre c se prononce « k » devant a, o, u, mais « tch » devant e, i (casa vs cielo).", "La lettre g se prononce dur devant a, o, u, mais « dj » devant e, i (gatto vs gelato).", "Le groupe gli se prononce comme le « ll » du mot français « million » (famiglia).", "Le groupe gn se prononce comme le gn français de « montagne » (gnocchi, bagno).", "Presque tous les mots italiens se terminent par une voyelle, et cette voyelle finale se prononce toujours clairement — ne l'avale jamais comme en français."]}], "tip": false}, {"title": "Salutations et phrases essentielles", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Italien"], "rows": [[{"t": "Bonjour (matin/formel)", "b": false}, {"t": "bwon-jor-no", "b": false}, {"t": "Buongiorno", "b": true}], [{"t": "Bonsoir", "b": false}, {"t": "bwo-na-sé-ra", "b": false}, {"t": "Buonasera", "b": true}], [{"t": "Salut (informel)", "b": false}, {"t": "chao", "b": false}, {"t": "Ciao", "b": true}], [{"t": "Comment ça va ?", "b": false}, {"t": "ko-mé va", "b": false}, {"t": "Come va?", "b": true}], [{"t": "Bien, merci", "b": false}, {"t": "bé-né, gra-tsié", "b": false}, {"t": "Bene, grazie", "b": true}], [{"t": "Enchanté", "b": false}, {"t": "pia-ché-ré", "b": false}, {"t": "Piacere", "b": true}], [{"t": "À bientôt", "b": false}, {"t": "a pré-sto", "b": false}, {"t": "A presto", "b": true}], [{"t": "À demain", "b": false}, {"t": "a do-ma-ni", "b": false}, {"t": "A domani", "b": true}], [{"t": "Au revoir", "b": false}, {"t": "a-rivé-dér-tchi", "b": false}, {"t": "Arrivederci", "b": true}], [{"t": "S'il te plaît", "b": false}, {"t": "pér fa-vo-ré", "b": false}, {"t": "Per favore", "b": true}], [{"t": "Merci", "b": false}, {"t": "gra-tsié", "b": false}, {"t": "Grazie", "b": true}], [{"t": "De rien", "b": false}, {"t": "pré-go", "b": false}, {"t": "Prego", "b": true}], [{"t": "Pardon/Excusez-moi", "b": false}, {"t": "sku-za", "b": false}, {"t": "Scusa", "b": true}], [{"t": "Oui", "b": false}, {"t": "si", "b": false}, {"t": "Sì", "b": true}], [{"t": "Non", "b": false}, {"t": "no", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "Les pronoms et le verbe « essere » (être)", "blocks": [{"type": "p", "html": "Comme le français, l'italien distingue « essere » (être, identité/état) et « stare » (rester, se trouver, se sentir) — mais leurs usages se recoupent moins qu'on ne le croit. Voici « essere » :", "italic": false}, {"type": "h3", "text": "Pronoms"}, {"type": "table", "headers": ["Français", "Italien"], "rows": [[{"t": "je", "b": false}, {"t": "io", "b": true}], [{"t": "tu", "b": false}, {"t": "tu", "b": true}], [{"t": "il/elle", "b": false}, {"t": "lui / lei", "b": true}], [{"t": "nous", "b": false}, {"t": "noi", "b": true}], [{"t": "vous", "b": false}, {"t": "voi", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "loro", "b": true}]]}, {"type": "h3", "text": "essere — être"}, {"type": "table", "headers": ["Pronom", "Conjugaison"], "rows": [[{"t": "io", "b": false}, {"t": "sono", "b": true}], [{"t": "tu", "b": false}, {"t": "sei", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "è", "b": true}], [{"t": "noi", "b": false}, {"t": "siamo", "b": true}], [{"t": "voi", "b": false}, {"t": "siete", "b": true}], [{"t": "loro", "b": false}, {"t": "sono", "b": true}]]}, {"type": "p", "html": "Exemple : Io sono francese — Je suis français. En italien courant, le pronom sujet (io, tu...) est souvent omis, car la terminaison du verbe indique déjà qui parle.", "italic": false}], "tip": false}, {"title": "Verbes courants et leur conjugaison", "blocks": [{"type": "p", "html": "Les verbes réguliers italiens se répartissent en trois groupes selon leur terminaison : -are, -ere, -ire.", "italic": false}, {"type": "table", "headers": ["Pronom", "-are (parlare)", "-ere (vedere)", "-ire (dormire)"], "rows": [[{"t": "io", "b": false}, {"t": "parlo", "b": false}, {"t": "vedo", "b": false}, {"t": "dormo", "b": true}], [{"t": "tu", "b": false}, {"t": "parli", "b": false}, {"t": "vedi", "b": false}, {"t": "dormi", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "parla", "b": false}, {"t": "vede", "b": false}, {"t": "dorme", "b": true}], [{"t": "noi", "b": false}, {"t": "parliamo", "b": false}, {"t": "vediamo", "b": false}, {"t": "dormiamo", "b": true}], [{"t": "voi", "b": false}, {"t": "parlate", "b": false}, {"t": "vedete", "b": false}, {"t": "dormite", "b": true}], [{"t": "loro", "b": false}, {"t"
