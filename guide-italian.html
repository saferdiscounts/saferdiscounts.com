e": "table", "headers": ["Signification", "Prononciation", "Italien"], "rows": [[{"t": "Où se trouve...?", "b": false}, {"t": "do-vé si tro-va", "b": false}, {"t": "Dove si trova...?", "b": true}], [{"t": "Combien ça coûte ?", "b": false}, {"t": "kouan-to kos-ta", "b": false}, {"t": "Quanto costa?", "b": true}], [{"t": "Puis-je voir le menu ?", "b": false}, {"t": "pos-so vé-dé-ré il mé-nou", "b": false}, {"t": "Posso vedere il menù?", "b": true}], [{"t": "L'addition, s'il vous plaît", "b": false}, {"t": "il kon-to, pér fa-vo-ré", "b": false}, {"t": "Il conto, per favore", "b": true}], [{"t": "Où sont les toilettes ?", "b": false}, {"t": "do-vé so-no i ba-nyi", "b": false}, {"t": "Dove sono i bagni?", "b": true}], [{"t": "J'ai besoin d'aide", "b": false}, {"t": "o bi-so-nyo di a-yu-to", "b": false}, {"t": "Ho bisogno di aiuto", "b": true}], [{"t": "Je ne comprends pas", "b": false}, {"t": "non ka-pis-ko", "b": false}, {"t": "Non capisco", "b": true}], [{"t": "Pouvez-vous répéter, s'il vous plaît ?", "b": false}, {"t": "puo ri-pé-té-ré", "b": false}, {"t": "Può ripetere, per favore?", "b": true}], [{"t": "Parlez-vous anglais ?", "b": false}, {"t": "par-la in-glé-zé", "b": false}, {"t": "Parla inglese?", "b": true}], [{"t": "Je voudrais réserver une chambre", "b": false}, {"t": "vor-ré-i pré-no-ta-ré ou-na ka-mé-ra", "b": false}, {"t": "Vorrei prenotare una camera", "b": true}], [{"t": "À quelle heure part le train ?", "b": false}, {"t": "a ké o-ra par-té il tré-no", "b": false}, {"t": "A che ora parte il treno?", "b": true}], [{"t": "Où puis-je prendre un taxi ?", "b": false}, {"t": "do-vé pos-so pren-dé-ré oun tak-si", "b": false}, {"t": "Dove posso prendere un taxi?", "b": true}]]}], "tip": false}, {"title": "Expressions et argot italien authentique", "blocks": [{"type": "p", "html": "Ces expressions font la différence entre un italien « scolaire » et un italien qui sonne vraiment vécu. Utilise-les au bon moment et observe la réaction des gens :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Expression"], "rows": [[{"t": "D'accord/ça marche", "b": false}, {"t": "va bé-né", "b": false}, {"t": "Va bene", "b": true}], [{"t": "Génial !", "b": false}, {"t": "fi-gou-ra-ti / da-ou-a", "b": false}, {"t": "Figurati! / Dai!", "b": true}], [{"t": "Franchement (mot-cheville très courant)", "b": false}, {"t": "in-som-ma", "b": false}, {"t": "Insomma", "b": true}], [{"t": "Truc/chose (mot générique)", "b": false}, {"t": "kaf-fa-ré", "b": false}, {"t": "Coso", "b": true}], [{"t": "Bof (indifférence)", "b": false}, {"t": "ma-bo", "b": false}, {"t": "Mah, boh", "b": true}], [{"t": "Ce n'est pas grave", "b": false}, {"t": "non fa nien-té", "b": false}, {"t": "Non fa niente", "b": true}], [{"t": "Allez !/vas-y !", "b": false}, {"t": "da-i", "b": false}, {"t": "Dai!", "b": true}]]}], "tip": false}, {"title": "Dialogue pratique complet", "blocks": [{"type": "p", "html": "Un dialogue simple dans un café — lis-le à voix haute plusieurs fois et essaie d'imiter la prononciation :", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Serveur :", "orig": "Buongiorno! Benvenuto. Cosa desidera?", "trans": "Bonjour ! Bienvenue. Que désirez-vous ?"}, {"speaker": "Client :", "orig": "Buongiorno! Vorrei un caffè, per favore.", "trans": "Bonjour ! Je voudrais un café, s'il vous plaît."}, {"speaker": "Serveur :", "orig": "Solo questo?", "trans": "Seulement ça ?"}, {"speaker": "Client :", "orig": "Sì, e il conto, per favore.", "trans": "Oui, et l'addition, s'il vous plaît."}, {"speaker": "Serveur :", "orig": "Sono due euro. Grazie!", "trans": "Ça fait deux euros. Merci !"}, {"speaker": "Client :", "orig": "Prego, a presto!", "trans": "De rien, à bientôt !"}]}], "tip": false}, {"title": "Plan d'action : comment apprendre vite", "blocks": [{"type": "list", "label": "7 étapes pour progresser rapidement", "intro": null, "items": ["Écoute de la musique et des séries italiennes chaque jour, même 10 minutes — l'oreille s'habitue au rythme avant l'esprit.", "Pratique le « shadowing » : écoute une phrase courte et répète-la immédiatement au même rythme.", "Marque bien les doubles consonnes en t'exerçant à voix haute — c'est le piège numéro un pour un francophone.", "Ne traduis pas dans ta tête — essaie de penser directement en italien plutôt que de passer par le français.", "Utilise une application comme Duolingo ou Babbel en complément de ce livre pour renforcer le vocabulaire.", "Parle dès le premier jour, même en faisant des erreurs — la fluidité vient de la pratique, pas de la mémorisation.", "Prononce bien chaque voyelle finale des mots — c'est ce qui donne à l'italien sa musicalité si reconnaissable."]}], "tip": true}, {"title": "Introduction : pour qui est ce livre ?", "blocks": [{"type": "p", "html": "Ce livre est la suite de « Apprendre l'Italien — Facile, Amusant et Rapide », qui couvrait les bases. Si tu as terminé le niveau de base et que tu veux atteindre un niveau où tu peux vraiment te débrouiller en voyage, au travail et dans la vie quotidienne en Italie, ce livre va te donner : les temps verbaux dont tu as besoin, du vocabulaire pratique pour des situations réelles, et des dialogues réalistes.", "italic": false}, {"type": "list", "label": "Avant de commencer", "intro": null, "items": ["Tu devrais déjà connaître : les salutations, les pronoms, le verbe essere, la conjugaison au présent, et les nombres — tout cela est dans le livre de base.", "Notre objectif ici n'est pas de tout t'enseigner sur la langue, mais de te donner assez d'outils pour te débrouiller seul dans n'importe quelle situation.", "Prends ton temps dans chaque chapitre, et entraîne-toi à voix haute sur les exemples avant de passer au suivant."]}], "tip": false, "dividerBefore": true}, {"title": "Révision rapide du niveau de base", "blocks": [{"type": "table", "headers": ["io", "tu", "lui/lei", "noi", "voi/loro"], "rows": [[{"t": "je", "b": false}, {"t": "tu", "b": false}, {"t": "il/elle", "b": false}, {"t": "nous", "b": false}, {"t": "vous/ils", "b": true}]]}, {"type": "h3", "text": "Présent — les schémas réguliers"}, {"type": "table", "headers": ["Pronom", "-are (parlare)", "-ere (vedere)", "-ire (dormire)"], "rows": [[{"t": "io", "b": false}, {"t": "parlo", "b": false}, {"t": "vedo", "b": false}, {"t": "dormo", "b": true}], [{"t": "noi", "b": false}, {"t": "parliamo", "b": false}, {"t": "vediamo", "b": false}, {"t": "dormiamo", "b": true}], [{"t": "loro", "b": false}, {"t": "parlano", "b": false}, {"t": "vedono", "b": false}, {"t": "dormono", "b": true}]]}], "tip": false}, {"title": "Le passé : Passato Prossimo et Imperfetto", "blocks": [{"type": "p", "html": "Comme le français, l'italien distingue une action ponctuelle et achevée (Passato Prossimo, comme le passé composé) d'une action habituelle ou descriptive (Imperfetto, comme l'imparfait). Le Passato Prossimo se forme avec avere ou essere + participe passé.", "italic": false}, {"type": "table", "headers": ["Pronom", "avere + participe (parlare → parlato)", "essere + participe (andare → andato)"], "rows": [[{"t": "io", "b": false}, {"t": "ho parlato", "b": false}, {"t": "sono andato/a", "b": true}], [{"t": "tu", "b": false}, {"t": "hai parlato", "b": false}, {"t": "sei andato/a", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "ha parlato", "b": false}, {"t": "è andato/a", "b": true}], [{"t": "noi", "b": false}, {"t": "abbiamo parlato", "b": false}, {"t": "siamo andati/e", "b": true}], [{"t": "voi", "b": false}, {"t": "avete parlato", "b": false}, {"t": "siete andati/e", "b": true}], [{"t": "loro", "b": false}, {"t": "hanno parlato", "b": false}, {"t": "sono andati/e", "b": true}]]}, {"type": "p", "html": "Règle pratique : comme en français, un groupe de verbes de mouvement/changement d'état (andare, venire, partire, arrivare, entrare, uscire, salire, scendere, nascere, morire, etc.) et tous les verbes pronominaux utilisent essere — et le participe s'accorde alors avec le sujet en genre et en nombre.", "italic": false}, {"type": "h3", "text": "L'Imperfetto"}, {"type": "table", "headers": ["Pronom", "parlare → imperfetto"], "rows": [[{"t": "io", "b": false}, {"t": "parlavo", "b": true}], [{"t": "tu", "b": false}, {"t": "parlavi", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "parlava", "b": true}], [{"t": "noi", "b": false}, {"t": "parlavamo", "b": true}], [{"t": "voi", "b": false}, {"t": "parlavate", "b": true}], [{"t": "loro", "b": false}, {"t": "parlavano", "b": true}]]}, {"type": "p", "html": "Exemple : Quando ero piccolo, abitavo a Parigi (Imperfetto : description) — Ieri sono andato al mercato (Passato Prossimo : fait ponctuel).", "italic": false}], "tip": false}, {"title": "Le futur et le conditionnel", "blocks": [{"type": "table", "headers": ["Usage", "Formation", "Exemple"], "rows": [[{"t": "Futur simple (prévision)", "b": false}, {"t": "infinitif (sans -e final) + terminaisons -ò, -ai, -à, -emo, -ete, -anno", "b": false}, {"t": "Partirò l'anno prossimo — Je partirai l'année prochaine", "b": true}], [{"t": "Conditionnel (hypothèse, politesse)", "b": false}, {"t": "même radical que le futur + terminaisons -ei, -esti, -ebbe...", "b": false}, {"t": "Vorrei un caffè — Je voudrais un café", "b": true}]]}, {"type": "p", "html": "Contrairement au français, l'italien n'a pas de « futur proche » aussi courant : on utilise simplement le présent ou le futur simple pour parler d'un événement proche (Domani vado a Roma — Demain je vais à Rome).", "italic": false}], "tip": false}, {"title": "Verbes pronominaux et pronoms compléments", "blocks": [{"type": "table", "headers": ["Pronom sujet", "Pronom réfléchi", "lavarsi (se laver)"], "rows": [[{"t": "io", "b": false}, {"t": "mi", "b": false}, {"t": "mi lavo", "b": true}], [{"t": "tu", "b": false}, {"t": "ti", "b": false}, {"t": "ti lavi", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "si", "b": false}, {"t": "si lava", "b": true}], [{"t": "noi", "b": false}, {"t": "ci", "b": false}, {"t": "ci laviamo", "b": true}], [{"t": "voi", "b": false}, {"t": "vi", "b": false}, {"t": "vi lavate", "b": true}], [{"t": "loro", "b": false}, {"t": "si", "b": false}, {"t": "si lavano", "b": true}]]}, {"type": "p", "html": "Les pronoms compléments directs (mi, ti, lo/la, ci, vi, li/le) et indirects (mi, ti, gli/le, ci, vi, gli) se placent avant le verbe conjugué, comme en français : Lo vedo (Je le vois), Gli parlo (Je lui parle).", "italic": false}], "tip": false}, {"title": "Les prépositions articulées", "blocks": [{"type": "p", "html": "En italien, les prépositions se contractent avec l'article défini bien plus systématiquement qu'en français — il faut apprendre toute la grille :", "italic": false}, {"type": "table", "headers": ["Préposition", "+ il", "+ la", "+ i / le"], "rows": [[{"t": "a", "b": false}, {"t": "al", "b": false}, {"t": "alla", "b": false}, {"t": "ai / alle", "b": true}], [{"t": "di", "b": false}, {"t": "del", "b": false}, {"t": "della", "b": false}, {"t": "dei / delle", "b": true}], [{"t": "da", "b": false}, {"t": "dal", "b": false}, {"t": "dalla", "b": false}, {"t": "dai / dalle", "b": true}], [{"t": "in", "b": false}, {"t": "nel", "b": false}, {"t": "nella", "b": false}, {"t": "nei / nelle", "b": true}]]}, {"type": "p", "html": "Exemple : Vado al mercato (à + il = al), Il colore delle case (di + le = delle).", "italic": false}], "tip": false}, {"title": "Comparatifs, superlatifs et connecteurs avancés", "blocks": [{"type": "table", "headers": ["Structure", "Italien", "Signification"], "rows": [[{"t": "plus... que", "b": false}, {"t": "più... di / che", "b": false}, {"t": "È più alto di me", "b": true}], [{"t": "moins... que", "b": false}, {"t": "meno... di", "b": false}, {"t": "È meno caro di prima", "b": true}], [{"t": "aussi... que", "b": false}, {"t": "tanto... quanto", "b": false}, {"t": "È tanto veloce quanto lui", "b": true}], [{"t": "le plus/la plus", "b": false}, {"t": "il più / la più", "b": false}, {"t": "È il quartiere più bello", "b": true}], [{"t": "extrêmement (superlatif absolu -issimo)", "b": false}, {"t": "bellissimo, buonissimo", "b": false}, {"t": "suffixe très productif en italien", "b": true}], [{"t": "cependant", "b": false}, {"t": "tuttavia", "b": false}, {"t": "connecteur de contraste", "b": true}], [{"t": "bien que", "b": false}, {"t": "sebbene / nonostante (+ subjonctif)", "b": false}, {"t": "connecteur de concession", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : aéroport et douane", "blocks": [{"type": "table", "headers": ["Signification", "Italien"], "rows": [[{"t": "carte d'embarquement", "b": false}, {"t": "carta d'imbarco", "b": true}], [{"t": "bagage à main", "b": false}, {"t": "bagaglio a mano", "b": true}], [{"t": "retrait des bagages", "b": false}, {"t": "ritiro bagagli", "b": true}], [{"t": "vol retardé", "b": false}, {"t": "volo in ritardo", "b": true}], [{"t": "douane", "b": false}, {"t": "dogana", "b": true}], [{"t": "passeport", "b": false}, {"t": "passaporto", "b": true}], [{"t": "rien à déclarer", "b": false}, {"t": "niente da dichiarare", "b": true}], [{"t": "porte d'embarquement", "b": false}, {"t": "gate / uscita d'imbarco", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : hôtel, santé et urgences", "blocks": [{"type": "table", "headers": ["Signification", "Italien"], "rows": [[{"t": "Il n'y a pas d'eau chaude", "b": false}, {"t": "Non c'è acqua calda", "b": true}], [{"t": "La chambre n'est pas prête", "b": false}, {"t": "La camera non è pronta", "b": true}], [{"t": "Je voudrais changer de chambre", "b": false}, {"t": "Vorrei cambiare camera", "b": true}], [{"t": "pharmacie", "b": false}, {"t": "farmacia", "b": true}], [{"t": "J'ai besoin d'un médecin", "b": false}, {"t": "Ho bisogno di un medico", "b": true}], [{"t": "J'ai mal ici", "b": false}, {"t": "Mi fa male qui", "b": true}], [{"t": "Appelez une ambulance !", "b": false}, {"t": "Chiamate un'ambulanza!", "b": true}], [{"t": "hôpital", "b": false}, {"t": "ospedale", "b": true}], [{"t": "assurance maladie", "b": false}, {"t": "assicurazione sanitaria", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : banque, police et démarches officielles", "blocks": [{"type": "table", "headers": ["Signification", "Italien"], "rows": [[{"t": "compte courant", "b": false}, {"t": "conto corrente", "b": true}], [{"t": "distributeur automatique", "b": false}, {"t": "bancomat", "b": true}], [{"t": "taux de change", "b": false}, {"t": "tasso di cambio", "b": true}], [{"t": "J'ai perdu mon portefeuille", "b": false}, {"t": "Ho perso il portafoglio", "b": true}], [{"t": "dépôt de plainte", "b": false}, {"t": "denuncia", "b": true}], [{"t": "commissariat de police", "b": false}, {"t": "commissariato", "b": true}], [{"t": "mairie", "b": false}, {"t": "comune / municipio", "b": true}], [{"t": "titre de séjour", "b": false}, {"t": "permesso di soggiorno", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : transports et directions", "blocks": [{"type": "table", "headers": ["Signification", "Italien"], "rows": [[{"t": "billet aller simple", "b": false}, {"t": "biglietto di sola andata", "b": true}], [{"t": "aller-retour", "b": false}, {"t": "andata e ritorno", "b": true}], [{"t": "location de voiture", "b": false}, {"t": "noleggio auto", "b": true}], [{"t": "Tournez à droite", "b": false}, {"t": "Giri a destra", "b": true}], [{"t": "Allez tout droit", "b": false}, {"t": "Vada dritto", "b": true}], [{"t": "feu (de circulation)", "b": false}, {"t": "semaforo", "b": true}], [{"t": "rond-point", "b": false}, {"t": "rotatoria", "b": true}], [{"t": "quai", "b": false}, {"t": "binario", "b": true}], [{"t": "arrêt de bus", "b": false}, {"t": "fermata dell'autobus", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : shopping et travail", "blocks": [{"type": "table", "headers": ["Signification", "Italien"], "rows": [[{"t": "Pouvez-vous me faire une remise ?", "b": false}, {"t": "Può farmi uno sconto?", "b": true}], [{"t": "taille (vêtements)", "b": false}, {"t": "taglia", "b": true}], [{"t": "cabine d'essayage", "b": false}, {"t": "camerino", "b": true}], [{"t": "réunion", "b": false}, {"t": "riunione", "b": true}], [{"t": "date limite", "b": false}, {"t": "scadenza", "b": true}], [{"t": "candidature", "b": false}, {"t": "candidatura", "b": true}], [{"t": "entretien d'embauche", "b": false}, {"t": "colloquio di lavoro", "b": true}], [{"t": "salaire", "b": false}, {"t": "stipendio", "b": true}]]}], "tip": false}, {"title": "Étiquette : tu ou lei ?", "blocks": [{"type": "p", "html": "L'italien distingue « tu » (informel, amis et famille) et « Lei » — la troisième personne du singulier utilisée par politesse (formel, inconnus, supérieurs, contexte professionnel), un usage plus subtil que le simple tu/vous français. Dans le doute, utilise « Lei » jusqu'à ce qu'on te propose de passer au tu (Ci possiamo dare del tu?).", "italic": false}, {"type": "list", "label": "Règles pratiques", "intro": null, "items": ["Avec des inconnus, commerçants, collègues peu familiers : Lei (« Lei come si chiama? » et non « tu come ti chiami? »).", "Avec des amis, des enfants, la famille : tu.", "Les e-mails formels s'ouvrent par « Gentile Signore/Signora » et se terminent par « Cordiali saluti »."]}], "tip": false}, {"title": "Expressions idiomatiques avancées", "blocks": [{"type": "table", "headers": ["Signification", "Expression"], "rows": [[{"t": "Coûter les yeux de la tête", "b": false}, {"t": "Costare un occhio della testa", "b": true}], [{"t": "Avoir la tête ailleurs", "b": false}, {"t": "Avere la testa fra le nuvole", "b": true}], [{"t": "Faire comme si de rien n'était", "b": false}, {"t": "Fare finta di niente", "b": true}], [{"t": "Être fauché", "b": false}, {"t": "Essere al verde", "b": true}], [{"t": "Se mettre dans le pétrin", "b": false}, {"t": "Cacciarsi nei guai", "b": true}], [{"t": "Casser la glace", "b": false}, {"t": "Rompere il ghiaccio", "b": true}]]}], "tip": false}, {"title": "Dialogues pratiques avancés", "blocks": [{"type": "p", "html": "Scénario : régler un problème à l'hôtel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cliente :", "orig": "Buongiorno, c'è un problema con la mia camera, l'aria condizionata non funziona.", "trans": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas."}, {"speaker": "Receptionist :", "orig": "Mi dispiace, mando subito qualcuno. Vuole cambiare camera nel frattempo?", "trans": "Je suis désolée, j'envoie quelqu'un tout de suite. Voulez-vous changer de chambre en attendant ?"}, {"speaker": "Cliente :", "orig": "Sì, sarebbe più semplice, grazie.", "trans": "Oui, ce serait plus simple, merci."}]}, {"type": "p", "html": "Scénario : chez le médecin.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Medico :", "orig": "Cosa non va?", "trans": "Qu'est-ce qui ne va pas ?"}, {"speaker": "Paziente :", "orig": "Ho mal di gola da tre giorni e ho un po' di febbre.", "trans": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre."}, {"speaker": "Medico :", "orig": "Le prescrivo delle medicine. Riposi bene.", "trans": "Je vais vous prescrire des médicaments. Reposez-vous bien."}]}], "tip": false}, {"title": "Conclusion et prochaines étapes vers la fluidité", "blocks": [{"type": "list", "label": "Comment continuer à progresser", "intro": null, "items": ["Regarde des séries et des films italiens avec des sous-titres en italien, pas en français, pour habituer ton oreille.", "Lis chaque jour un court article d'un journal italien en ligne (Corriere della Sera, La Repubblica).", "Trouve un partenaire linguistique pour des échanges de conversation (tandem).", "Tiens un petit journal quotidien de quelques phrases en italien.", "N'aie pas peur des erreurs : la vraie fluidité vient de la pratique constante, pas de la perfection grammaticale."]}], "tip": true}], "closingBasic": "Félicitations d'avance pour ton parcours en italien — In bocca al lupo ! (bonne chance !)", "closingAdvanced": "Félicitations pour le chemin parcouru — continue ainsi, la vraie fluidité est plus proche que tu ne le penses ! In bocca al lupo!"}, "pt": {"chapters": [{"title": "Introdução: Porque aprender italiano?", "blocks": [{"type": "p", "html": "O italiano é a língua oficial de Itália, Suíça, San Marino e do Vaticano, falada por mais de 65 milhões de pessoas como língua materna, e reconhecida mundialmente como a língua da arte, da música e da gastronomia. Este livro dá-te uma base sólida no italiano padrão falado em toda a Itália.", "italic": false}, {"type": "p", "html": "A boa notícia: o italiano, tal como o português, é uma língua latina, com uma gramática muito lógica e organizada. A pronúncia é também das mais fáceis entre as línguas latinas, porque quase todas as letras se pronunciam exatamente como estão escritas, sem desaparecerem ou mudarem de forma estranha.", "italic": false}, {"type": "list", "label": "<strong>Objetivos deste livro</strong>", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Focar na pronúncia correta para que o teu sotaque soe autenticamente italiano.", "Dar-te frases práticas que podes usar desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e fundamentos de pronúncia", "blocks": [{"type": "p", "html": "O italiano usa o alfabeto latino, e a maior parte das letras pronuncia-se exatamente como está escrita. Esta tabela apresenta as letras e sons mais distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "cázà", "b": false}, {"t": "<strong>casa (todas as letras claras)</strong>", "b": true}], [{"t": "olá (informal)", "b": false}, {"t": "tcháo", "b": false}, {"t": "<strong>ciao (ci antes de a/o = «tch»)</strong>", "b": true}], [{"t": "gelado", "b": false}, {"t": "djelato", "b": false}, {"t": "<strong>gelato (ge/gi = «dj», som já conhecido do português brasileiro)</strong>", "b": true}], [{"t": "gato", "b": false}, {"t": "gatto", "b": false}, {"t": "<strong>gatto (ga/go/gu = g dura; tt duplo alonga-se na pronúncia)</strong>", "b": true}], [{"t": "esparguete", "b": false}, {"t": "spaguetti", "b": false}, {"t": "<strong>spaghetti (gh = g dura sempre)</strong>", "b": true}], [{"t": "família", "b": false}, {"t": "famíllia", "b": false}, {"t": "<strong>famiglia (gli = exatamente como o «lh» português!)</strong>", "b": true}], [{"t": "nhoque", "b": false}, {"t": "gnóki", "b": false}, {"t": "<strong>gnocchi (gn = exatamente como o «nh» português!)</strong>", "b": true}], [{"t": "peixe", "b": false}, {"t": "pêshe", "b": false}, {"t": "<strong>pesce (sce/sci = «sh»)</strong>", "b": true}], [{"t": "escola", "b": false}, {"t": "scuóla", "b": false}, {"t": "<strong>scuola (sca/sco/scu = «sk»)</strong>", "b": true}], [{"t": "piza", "b": false}, {"t": "pítsa", "b": false}, {"t": "<strong>pizza (z/zz = «ts» ou «dz»)</strong>", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro vão fazer a maior diferença para soares verdadeiramente italiano:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["As vogais (a, e, i, o, u) pronunciam-se sempre com clareza e pureza, sem se enfraquecerem ou desaparecerem como acontece em português.", "A letra c antes de e ou i pronuncia-se «tch» (como em ciao), e antes de a, o ou u pronuncia-se «k» normal (como em casa).", "A letra g antes de e ou i pronuncia-se «dj» (como em gelato), e antes de a, o ou u pronuncia-se g dura (como em gatto).", "Boa notícia: os grupos gli e gn são exatamente os mesmos sons que já conheces do português — lh e nh! Uma grande vantagem para ti.", "As consoantes duplas (como tt, ll, nn, ss) pronunciam-se com um alongamento claro — isto pode mudar completamente o significado de uma palavra, por isso presta atenção. Este é um conceito novo, já que o português não tem este fenómeno.", "Cuidado com um \"falso amigo\": em italiano, ce/ci soa \"tch\", mas em português ce/ci soa \"s\" — são sons diferentes apesar da grafia parecida."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Italiano"], "rows": [[{"t": "Olá (muito casual, usa-se para cumprimentar e despedir)", "b": false}, {"t": "tcháo", "b": false}, {"t": "<strong>Ciao</strong>", "b": true}], [{"t": "Bom dia", "b": false}, {"t": "buondjórno", "b": false}, {"t": "<strong>Buongiorno</strong>", "b": true}], [{"t": "Boa tarde", "b": false}, {"t": "buonaséra", "b": false}, {"t": "<strong>Buonasera</strong>", "b": true}], [{"t": "Boa noite", "b": false}, {"t": "buonanótte", "b": false}, {"t": "<strong>Buonanotte</strong>", "b": true}], [{"t": "Como estás? (casual)", "b": false}, {"t": "cóme stái?", "b": false}, {"t": "<strong>Come stai?</strong>", "b": true}], [{"t": "Como está? (formal)", "b": false}, {"t": "cóme stá?", "b": false}, {"t": "<strong>Come sta?</strong>", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "sto béne, grátsie", "b": false}, {"t": "<strong>Sto bene, grazie</strong>", "b": true}], [{"t": "Prazer em conhecer-te", "b": false}, {"t": "piatchére", "b": false}, {"t": "<strong>Piacere</strong>", "b": true}], [{"t": "Até já", "b": false}, {"t": "a dópo", "b": false}, {"t": "<strong>A dopo</strong>", "b": true}], [{"t": "Até breve", "b": false}, {"t": "a préesto", "b": false}, {"t": "<strong>A presto</strong>", "b": true}], [{"t": "Adeus (formal/definitivo)", "b": false}, {"t": "arrivedértchi", "b": false}, {"t": "<strong>Arrivederci</strong>", "b": true}], [{"t": "Por favor", "b": false}, {"t": "per favóre", "b": false}, {"t": "<strong>Per favore</strong>", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "grátsie", "b": false}, {"t": "<strong>Grazie</strong>", "b": true}], [{"t": "De nada", "b": false}, {"t": "prégo", "b": false}, {"t": "<strong>Prego</strong>", "b": true}], [{"t": "Desculpa", "b": false}, {"t": "scúza / mi dispiátche", "b": false}, {"t": "<strong>Scusa / Mi dispiace</strong>", "b": true}], [{"t": "Sim", "b": false}, {"t": "sí", "b": false}, {"t": "<strong>Sì</strong>", "b": true}], [{"t": "Não", "b": false}, {"t": "nó", "b": false}, {"t": "<strong>No</strong>", "b": true}]]}], "tip": false}, {"title": "Pronomes e o verbo «ser/estar» (Essere / Stare)", "blocks": [{"type": "p", "html": "Tal como em português, o italiano tem dois verbos que significam «ser/estar»: Essere para a identidade e características permanentes, e Stare para o estado temporário e o lugar (e também é a base do cumprimento diário, como já vimos).", "italic": false}, {"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["Português", "Italiano"], "rows": [[{"t": "eu", "b": false}, {"t": "io", "b": false}], [{"t": "tu", "b": false}, {"t": "tu", "b": false}], [{"t": "ele/ela", "b": false}, {"t": "lui / lei", "b": false}], [{"t": "nós", "b": false}, {"t": "noi", "b": false}], [{"t": "vós/vocês", "b": false}, {"t": "voi", "b": false}], [{"t": "eles/elas", "b": false}, {"t": "loro", "b": false}]]}, {"type": "h3", "text": "<strong>Essere — para a identidade e características permanentes</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "io", "b": false}, {"t": "sono", "b": false}], [{"t": "tu", "b": false}, {"t": "sei", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "è", "b": false}], [{"t": "noi", "b": false}, {"t": "siamo", "b": false}], [{"t": "voi", "b": false}, {"t": "siete", "b": false}], [{"t": "loro", "b": false}, {"t": "sono", "b": false}]]}, {"type": "p", "html": "Exemplo: Io sono egiziano — Eu sou egípcio.", "italic": false}, {"type": "h3", "text": "<strong>Stare — para o estado e o lugar temporário</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "io", "b": false}, {"t": "sto", "b": false}], [{"t": "tu", "b": false}, {"t": "stai", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "sta", "b": false}], /strong>", "b": true}], [{"t": "Posso ver o menu?", "b": false}, {"t": "pósso vedére il menu?", "b": false}, {"t": "<strong>Posso vedere il menu?</strong>", "b": true}], [{"t": "A conta, por favor", "b": false}, {"t": "il cónto, per favóre", "b": false}, {"t": "<strong>Il conto, per favore</strong>", "b": true}], [{"t": "Onde é a casa de banho?", "b": false}, {"t": "dovè il bánio?", "b": false}, {"t": "<strong>Dov'è il bagno?</strong>", "b": true}], [{"t": "Preciso de ajuda", "b": false}, {"t": "ó bisóño di aiúto", "b": false}, {"t": "<strong>Ho bisogno di aiuto</strong>", "b": true}], [{"t": "Não percebo", "b": false}, {"t": "non capísco", "b": false}, {"t": "<strong>Non capisco</strong>", "b": true}], [{"t": "Pode repetir, por favor?", "b": false}, {"t": "pu.ó ripétere, per favóre?", "b": false}, {"t": "<strong>Può ripetere, per favore?</strong>", "b": true}], [{"t": "Fala inglês?", "b": false}, {"t": "párla inglése?", "b": false}, {"t": "<strong>Parla inglese?</strong>", "b": true}], [{"t": "Quero reservar um quarto", "b": false}, {"t": "vorréi prenotáre úna cámera", "b": false}, {"t": "<strong>Vorrei prenotare una camera</strong>", "b": true}], [{"t": "A que horas parte o comboio?", "b": false}, {"t": "a ke óra párte il tréno?", "b": false}, {"t": "<strong>A che ora parte il treno?</strong>", "b": true}], [{"t": "Onde posso apanhar um táxi?", "b": false}, {"t": "dóve pósso prendere un táxi?", "b": false}, {"t": "<strong>Dove posso prendere un taxi?</strong>", "b": true}]]}], "tip": false}, {"title": "Expressões e gírias italianas autênticas", "blocks": [{"type": "p", "html": "Estas expressões são as que separam quem fala italiano «correto» de quem soa verdadeiramente italiano. Usa-as no contexto certo e vais ver a reação das pessoas mudar completamente:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Expressão"], "rows": [[{"t": "Vá lá!/A sério? (muito comum, para incentivar ou espantar)", "b": false}, {"t": "dái", "b": false}, {"t": "<strong>Dai!</strong>", "b": true}], [{"t": "Quem me dera! (desejo)", "b": false}, {"t": "madjári", "b": false}, {"t": "<strong>Magari!</strong>", "b": true}], [{"t": "Sei lá (expressão de dúvida usadíssima)", "b": false}, {"t": "bó", "b": false}, {"t": "<strong>Boh</strong>", "b": true}], [{"t": "Fixe/Bonito", "b": false}, {"t": "fígo", "b": false}, {"t": "<strong>Figo</strong>", "b": true}], [{"t": "Que confusão! (para uma situação caótica)", "b": false}, {"t": "ke cazíno", "b": false}, {"t": "<strong>Che casino!</strong>", "b": true}], [{"t": "Boa sorte (literalmente «na boca do lobo» — expressão tradicional de incentivo)", "b": false}, {"t": "in bócca al lúpo", "b": false}, {"t": "<strong>In bocca al lupo</strong>", "b": true}], [{"t": "Vamos!", "b": false}, {"t": "andiámo", "b": false}, {"t": "<strong>Andiamo!</strong>", "b": true}]]}], "tip": false}, {"title": "Diálogo prático completo", "blocks": [{"type": "p", "html": "Um diálogo simples num café — lê em voz alta várias vezes e tenta imitar a pronúncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "Ciao! Benvenuto. Cosa desidera?", "trans": "Olá! Bem-vindo. O que deseja?"}, {"speaker": "Cliente:", "orig": "Ciao! Vorrei un caffè, per favore.", "trans": "Olá! Quero um café, por favor."}, {"speaker": "Empregado:", "orig": "Solo questo?", "trans": "Só isso?"}, {"speaker": "Cliente:", "orig": "Sì, e il conto, per favore.", "trans": "Sim, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "Sono due euro. Grazie!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "Prego, a dopo!", "trans": "De nada, até já!"}]}], "tip": false}, {"title": "Plano de ação: como aprender rápido", "blocks": [{"type": "list", "label": "<strong>7 passos para fixar a língua rapidamente</strong>", "intro": null, "items": ["Ouve música e séries italianas todos os dias, nem que sejam 10 minutos — o ouvido adapta-se ao ritmo antes da mente.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo e velocidade.", "Concentra-te nas consoantes duplas (como tt e ll) e tenta alongá-las na pronúncia tal como os italianos fazem.", "Não traduzas na tua cabeça — tenta pensar diretamente na palavra italiana em vez de passares primeiro pelo português.", "Usa uma aplicação como o Duolingo ou o Babbel junto com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo com erros — a fluência vem da prática, não da memorização.", "Repara nas semelhanças entre o italiano e o português (e o espanhol, se já os estudaste) — isso vai facilitar-te muito o processo."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Italiano — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível em que realmente consigas desenrascar-te em viagens, no trabalho e no dia a dia em Itália, este livro vai dar-te: os tempos verbais que precisas para falar do passado e do futuro, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "<strong>Antes de começares</strong>", "intro": null, "items": ["Deves já saber: cumprimentos, pronomes, o verbo Essere/Stare, a conjugação do presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenrascares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de avançares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["io", "tu", "lui/lei", "noi", "voi/loro"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vós/eles", "b": false}]]}, {"type": "h3", "text": "<strong>Presente — os padrões regulares</strong>"}, {"type": "table", "headers": ["Pronome", "-ire (dormire)", "-ere (scrivere)", "-are (parlare)"], "rows": [[{"t": "io", "b": false}, {"t": "dormo", "b": false}, {"t": "scrivo", "b": false}, {"t": "parlo", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "dorme", "b": false}, {"t": "scrive", "b": false}, {"t": "parla", "b": false}], [{"t": "noi", "b": false}, {"t": "dormiamo", "b": false}, {"t": "scriviamo", "b": false}, {"t": "parliamo", "b": false}], [{"t": "loro", "b": false}, {"t": "dormono", "b": false}, {"t": "scrivono", "b": false}, {"t": "parlano", "b": false}]]}, {"type": "h3", "text": "<strong>Essere / Stare (presente)</strong>"}, {"type": "table", "headers": ["Pronome", "Stare", "Essere"], "rows": [[{"t": "io", "b": false}, {"t": "sto", "b": false}, {"t": "sono", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "sta", "b": false}, {"t": "è", "b": false}], [{"t": "noi", "b": false}, {"t": "stiamo", "b": false}, {"t": "siamo", "b": false}], [{"t": "loro", "b": false}, {"t": "stanno", "b": false}, {"t": "sono", "b": false}]]}], "tip": false}, {"title": "O passado próximo (Passato Prossimo)", "blocks": [{"type": "p", "html": "Este é o tempo básico do passado no italiano falado, formado por um verbo auxiliar (Avere ou Essere) no presente + o particípio passado.", "italic": false}, {"type": "h3", "text": "<strong>Com Avere (para a maioria dos verbos)</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": "io", "b": false}, {"t": "ho parlato (falei)", "b": false}], [{"t": "tu", "b": false}, {"t": "hai parlato", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "ha parlato", "b": false}], [{"t": "noi", "b": false}, {"t": "abbiamo parlato", "b": false}], [{"t": "loro", "b": false}, {"t": "hanno parlato", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "Com Essere (verbos de movimento e reflexivos)", "trans": "Muito importante: com Essere, o particípio passado tem de concordar em género e número com o sujeito, tal como um adjetivo."}]}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": "io (homem)", "b": false}, {"t": "sono andato (fui)", "b": false}], [{"t": "io (mulher)", "b": false}, {"t": "sono andata", "b": false}], [{"t": "lui", "b": false}, {"t": "è andato", "b": false}], [{"t": "lei", "b": false}, {"t": "è andata", "b": false}], [{"t": "noi (masc./misto)", "b": false}, {"t": "siamo andati", "b": false}]]}, {"type": "p", "html": "<em>Regra rápida: verbos que indicam movimento ou deslocação (andare, venire, partire) ou verbos reflexivos usam Essere; o resto usa Avere.</em>", "italic": true}], "tip": false}, {"title": "O passado imperfeito (Imperfetto)", "blocks": [{"type": "p", "html": "Usa-se para descrever algo que acontecia repetidamente ou de forma contínua no passado — não um evento único e concluído, mas um hábito ou a descrição de um estado.", "italic": false}, {"type": "table", "headers": ["Pronome", "-ire/-ere (dormire/scrivere)", "-are (parlare)"], "rows": [[{"t": "io", "b": false}, {"t": "dormivo / scrivevo", "b": false}, {"t": "parlavo", "b": false}], [{"t": "tu", "b": false}, {"t": "dormivi / scrivevi", "b": false}, {"t": "parlavi", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "dormiva / scriveva", "b": false}, {"t": "parlava", "b": false}], [{"t": "noi", "b": false}, {"t": "dormivamo / scrivevamo", "b": false}, {"t": "parlavamo", "b": false}], [{"t": "loro", "b": false}, {"t": "dormivano / scrivevano", "b": false}, {"t": "parlavano", "b": false}]]}, {"type": "p", "html": "Exemplos: Quando ero bambino, vivevo al Cairo. (Quando era criança, vivia no Cairo) — Lui lavorava tutti i giorni. (Ele trabalhava todos os dias)", "italic": false}], "tip": false}, {"title": "O futuro e o condicional", "blocks": [{"type": "dialogue", "lines": [{"speaker": null, "orig": "Futuro", "trans": "Forma-se a partir do infinitivo (retirando o e final e mudando o a para e nos verbos -are) + terminações fixas:"}]}, {"type": "table", "headers": ["Pronome", "parlare"], "rows": [[{"t": "io", "b": false}, {"t": "parlerò", "b": false}], [{"t": "tu", "b": false}, {"t": "parlerai", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "parlerà", "b": false}], [{"t": "noi", "b": false}, {"t": "parleremo", "b": false}], [{"t": "loro", "b": false}, {"t": "parleranno", "b": false}]]}, {"type": "dialogue", "lines": [{"speaker": null, "orig": "Condicional — para pedidos educados e hipóteses", "trans": "Mesma base do futuro + terminações ei, esti, ebbe, emmo, este, ebbero:"}]}, {"type": "table", "headers": ["Pronome", "parlare", "volere"], "rows": [[{"t": "io", "b": false}, {"t": "parlerei", "b": false}, {"t": "vorrei", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "parlerebbe", "b": false}, {"t": "vorrebbe", "b": false}], [{"t": "noi", "b": false}, {"t": "parleremmo", "b": false}, {"t": "vorremmo", "b": false}]]}, {"type": "p", "html": "Exemplos práticos: Vorrei prenotare un tavolo. (Gostaria de reservar uma mesa) — Potrebbe aiutarmi? (Podia ajudar-me?)", "italic": false}], "tip": false}, {"title": "O modo conjuntivo — Congiuntivo (aspetos básicos)", "blocks": [{"type": "p", "html": "Esta forma usa-se para a dúvida, o desejo, a hipótese, ou depois de verbos como «querer que», «esperar que», «achar que». Costuma vir depois da palavra «che» (que).", "italic": false}, {"type": "table", "headers": ["Pronome", "-ire (dormire)", "-ere (scrivere)", "-are (parlare)"], "rows": [[{"t": "che io", "b": false}, {"t": "dorma", "b": false}, {"t": "scriva", "b": false}, {"t": "parli", "b": false}], [{"t": "che tu", "b": false}, {"t": "dorma", "b": false}, {"t": "scriva", "b": false}, {"t": "parli", "b": false}], [{"t": "che noi", "b": false}, {"t": "dormiamo", "b": false}, {"t": "scriviamo", "b": false}, {"t": "parliamo", "b": false}], [{"t": "che loro", "b": false}, {"t": "dormano", "b": false}, {"t": "scrivano", "b": false}, {"t": "parlino", "b": false}]]}, {"type": "h3", "text": "<strong>Quando se usa?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Depois de «spero che» (espero que...): Spero che tu stia bene. (Espero que estejas bem)", "Depois de «penso che» (acho que...): Penso che sia vero. (Acho que é verdade)", "Depois de «voglio che» (quero que...): Voglio che tu mi aiuti. (Quero que me ajudes)", "Depois de «è possibile che» (é possível que): È possibile che piova. (É possível que chova)", "Depois de «sebbene» (embora): Sebbene sia stanco, vado a lavorare. (Embora esteja cansado, vou trabalhar)"]}], "tip": false}, {"title": "Os verbos reflexivos", "blocks": [{"type": "p", "html": "Tal como em português, o pronome coloca-se antes do verbo conjugado — esta é a posição padrão em italiano:", "italic": false}, {"type": "table", "headers": ["Pronome", "chiamarsi (chamar-se)", "alzarsi (levantar-se)", "vestirsi (vestir-se)"], "rows": [[{"t": "io", "b": false}, {"t": "mi chiamo", "b": false}, {"t": "mi alzo", "b": false}, {"t": "mi vesto", "b": false}], [{"t": "tu", "b": false}, {"t": "ti chiami", "b": false}, {"t": "ti alzi", "b": false}, {"t": "ti vesti", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "si chiama", "b": false}, {"t": "si alza", "b": false}, {"t": "si veste", "b": false}], [{"t": "noi", "b": false}, {"t": "ci chiamiamo", "b": false}, {"t": "ci alziamo", "b": false}, {"t": "ci vestiamo", "b": false}]]}, {"type": "p", "html": "Exemplo muito comum: «Come ti chiami?» (Como te chamas?) — Resposta: «Mi chiamo Ahmed.» (Chamo-me Ahmed)", "italic": false}], "tip": false}, {"title": "Pronomes de objeto e a sua posição", "blocks": [{"type": "h3", "text": "<strong>A tabela</strong>"}, {"type": "table", "headers": ["Sujeito", "Objeto direto", "Objeto indireto"], "rows": [[{"t": "io", "b": false}, {"t": "mi", "b": false}, {"t": "mi", "b": false}], [{"t": "tu", "b": false}, {"t": "ti", "b": false}, {"t": "ti", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "lo / la", "b": false}, {"t": "gli / le", "b": false}], [{"t": "noi", "b": false}, {"t": "ci", "b": false}, {"t": "ci", "b": false}], [{"t": "loro", "b": false}, {"t": "li / le", "b": false}, {"t": "gli", "b": false}]]}, {"type": "h3", "text": "<strong>Onde colocar o pronome?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Regra geral: o pronome coloca-se sempre antes do verbo conjugado: Ti vedo domani. (Vejo-te amanhã)", "Cola-se ao fim do verbo no infinitivo (depois de retirar o e final), no gerúndio, ou no imperativo: vederti, vedendoti, Dimmi! (Diz-me!)", "Repara que o pronome de objeto indireto na terceira pessoa do singular muda consoante o género: gli para um homem, le para uma mulher — uma diferença importante em relação ao português."]}], "tip": false}, {"title": "Preposições e a sua fusão com os artigos definidos", "blocks": [{"type": "p", "html": "O italiano tem o sistema de fusão entre preposições e artigos definidos mais rico de todas as línguas latinas que já estudámos:", "italic": false}, {"type": "table", "headers": ["Preposição", "+ il", "+ lo", "+ la", "+ i", "+ le"], "rows": [[{"t": "di (de)", "b": false}, {"t": "del", "b": false}, {"t": "dello", "b": false}, {"t": "della", "b": false}, {"t": "dei", "b": false}, {"t": "delle", "b": false}], [{"t": "a (a/para)", "b": false}, {"t": "al", "b": false}, {"t": "allo", "b": false}, {"t": "alla", "b": false}, {"t": "ai", "b": false}, {"t": "alle", "b": false}], [{"t": "da (de/desde)", "b": false}, {"t": "dal", "b": false}, {"t": "dallo", "b": false}, {"t": "dalla", "b": false}, {"t": "dai", "b": false}, {"t": "dalle", "b": false}], [{"t": "in (em)", "b": false}, {"t": "nel", "b": false}, {"t": "nello", "b": false}, {"t": "nella", "b": false}, {"t": "nei", "b": false}, {"t": "nelle", "b": false}], [{"t": "su (sobre)", "b": false}, {"t": "sul", "b": false}, {"t": "sullo", "b": false}, {"t": "sulla", "b": false}, {"t": "sui", "b": false}, {"t": "sulle", "b": false}]]}, {"type": "p", "html": "Exemplos: Vado al mercato. (Vou ao mercado) — Il libro è dello studente. (O livro é do aluno) — Sono nel giardino. (Estou no jardim)", "italic": false}], "tip": false}, {"title": "Comparação, superlativos e conectores avançados", "blocks": [{"type": "h3", "text": "<strong>Comparação e superlativos</strong>"}, {"type": "table", "headers": ["Uso", "Estrutura", "Exemplo"], "rows": [[{"t": "mais... que", "b": false}, {"t": "più... di", "b": false}, {"t": "Più caro di (mais caro que)", "b": false}], [{"t": "menos... que", "b": false}, {"t": "meno... di", "b": false}, {"t": "Meno caro di (menos caro que)", "b": false}], [{"t": "tão... como", "b": false}, {"t": "così... come", "b": false}, {"t": "Così bravo come (tão bom como)", "b": false}], [{"t": "o mais", "b": false}, {"t": "il più / la più", "b": false}, {"t": "Il più caro (o mais caro)", "b": false}]]}, {"type": "table", "headers": ["Adjetivo", "Forma comparativa irregular"], "rows": [[{"t": "buono (bom)", "b": false}, {"t": "migliore (melhor)", "b": false}], [{"t": "cattivo (mau)", "b": false}, {"t": "peggiore (pior)", "b": false}], [{"t": "grande (grande)", "b": false}, {"t": "maggiore (maior)", "b": false}], [{"t": "piccolo (pequeno)", "b": false}, {"t": "minore (menor)", "b": false}]]}, {"type": "h3", "text": "<strong>Conectores avançados</strong>"}, {"type": "table", "headers": ["Significado", "Conector"], "rows": [[{"t": "mas", "b": false}, {"t": "ma", "b": false}], [{"t": "mas (mais formal)", "b": false}, {"t": "però / tuttavia", "b": false}], [{"t": "por isso", "b": false}, {"t": "quindi", "b": false}], [{"t": "porque", "b": false}, {"t": "perché", "b": false}], [{"t": "visto que", "b": false}, {"t": "dato che", "b": false}], [{"t": "embora", "b": false}, {"t": "sebbene", "b": false}], [{"t": "apesar de", "b": false}, {"t": "nonostante", "b": false}], [{"t": "caso", "b": false}, {"t": "nel caso in cui", "b": false}]]}], "tip": false}, {"title": "Vocabulário: aeroporto e alfândega", "blocks": [ o</strong>", "b": true}], [{"t": "receita médica", "b": false}, {"t": "ritchétta médica", "b": false}, {"t": "<strong>ricetta medica</strong>", "b": true}], [{"t": "ambulância", "b": false}, {"t": "ambulántsa", "b": false}, {"t": "<strong>ambulanza</strong>", "b": true}], [{"t": "emergência", "b": false}, {"t": "emerdjéntsa", "b": false}, {"t": "<strong>emergenza</strong>", "b": true}], [{"t": "Chame uma ambulância!", "b": false}, {"t": "kiáma un'ambulántsa!", "b": false}, {"t": "<strong>Chiama un'ambulanza!</strong>", "b": true}], [{"t": "alergia", "b": false}, {"t": "allerdjía", "b": false}, {"t": "<strong>allergia</strong>", "b": true}], [{"t": "medicamento", "b": false}, {"t": "meditchína", "b": false}, {"t": "<strong>medicina</strong>", "b": true}]]}], "tip": false}, {"title": "Vocabulário: banco, polícia e assuntos oficiais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Italiano"], "rows": [[{"t": "banco", "b": false}, {"t": "bánca", "b": false}, {"t": "<strong>banca</strong>", "b": true}], [{"t": "câmbio", "b": false}, {"t": "cámbio valúta", "b": false}, {"t": "<strong>cambio valuta</strong>", "b": true}], [{"t": "levantar dinheiro", "b": false}, {"t": "prelleváre sóldi", "b": false}, {"t": "<strong>prelevare soldi</strong>", "b": true}], [{"t": "cartão de crédito", "b": false}, {"t": "cárta di crédito", "b": false}, {"t": "<strong>carta di credito</strong>", "b": true}], [{"t": "multibanco", "b": false}, {"t": "bancomát", "b": false}, {"t": "<strong>bancomat</strong>", "b": true}], [{"t": "esquadra da polícia", "b": false}, {"t": "statsióne di politsía", "b": false}, {"t": "<strong>stazione di polizia</strong>", "b": true}], [{"t": "Fui roubado", "b": false}, {"t": "sóno státo derubáto", "b": false}, {"t": "<strong>Sono stato derubato</strong>", "b": true}], [{"t": "Perdi o meu passaporte", "b": false}, {"t": "ó perdúto il mío passapórto", "b": false}, {"t": "<strong>Ho perduto il mio passaporto</strong>", "b": true}], [{"t": "documento de identificação", "b": false}, {"t": "documénto di identitá", "b": false}, {"t": "<strong>documento di identità</strong>", "b": true}], [{"t": "embaixada", "b": false}, {"t": "ambashiáta", "b": false}, {"t": "<strong>ambasciata</strong>", "b": true}]]}], "tip": false}, {"title": "Vocabulário: transportes, aluguer de carro e direções", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Italiano"], "rows": [[{"t": "alugar um carro", "b": false}, {"t": "nolledjáre úna mákkina", "b": false}, {"t": "<strong>noleggiare una macchina</strong>", "b": true}], [{"t": "carta de condução", "b": false}, {"t": "paténte", "b": false}, {"t": "<strong>patente</strong>", "b": true}], [{"t": "seguro", "b": false}, {"t": "assicuratsióne", "b": false}, {"t": "<strong>assicurazione</strong>", "b": true}], [{"t": "gasolina", "b": false}, {"t": "bendzína", "b": false}, {"t": "<strong>benzina</strong>", "b": true}], [{"t": "parque de estacionamento", "b": false}, {"t": "parkédjo", "b": false}, {"t": "<strong>parcheggio</strong>", "b": true}], [{"t": "Vira à direita/esquerda", "b": false}, {"t": "djíri a déstra/sinístra", "b": false}, {"t": "<strong>Giri a destra/sinistra</strong>", "b": true}], [{"t": "Segue sempre em frente", "b": false}, {"t": "váda sémpre drítto", "b": false}, {"t": "<strong>Vada sempre dritto</strong>", "b": true}], [{"t": "semáforo", "b": false}, {"t": "semáforo", "b": false}, {"t": "<strong>semaforo</strong>", "b": true}], [{"t": "rotunda", "b": false}, {"t": "rotatória", "b": false}, {"t": "<strong>rotatoria</strong>", "b": true}], [{"t": "autoestrada", "b": false}, {"t": "autostráda", "b": false}, {"t": "<strong>autostrada</strong>", "b": true}], [{"t": "portagem", "b": false}, {"t": "pedádjo", "b": false}, {"t": "<strong>pedaggio</strong>", "b": true}], [{"t": "metro", "b": false}, {"t": "métro", "b": false}, {"t": "<strong>metro</strong>", "b": true}], [{"t": "estação", "b": false}, {"t": "statsióne", "b": false}, {"t": "<strong>stazione</strong>", "b": true}]]}], "tip": false}, {"title": "Vocabulário: compras, negociação e trabalho", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Italiano"], "rows": [[{"t": "Pode fazer-me um desconto?", "b": false}, {"t": "pu.ó fáre uno skónto?", "b": false}, {"t": "<strong>Può fare uno sconto?</strong>", "b": true}], [{"t": "Está muito caro", "b": false}, {"t": "è mólto cáro", "b": false}, {"t": "<strong>È molto caro</strong>", "b": true}], [{"t": "promoção", "b": false}, {"t": "offérta", "b": false}, {"t": "<strong>offerta</strong>", "b": true}], [{"t": "fatura", "b": false}, {"t": "fattúra", "b": false}, {"t": "<strong>fattura</strong>", "b": true}], [{"t": "reunião", "b": false}, {"t": "riunióne", "b": false}, {"t": "<strong>riunione</strong>", "b": true}], [{"t": "negócio", "b": false}, {"t": "affáre", "b": false}, {"t": "<strong>affare</strong>", "b": true}], [{"t": "empresa", "b": false}, {"t": "atsiénda", "b": false}, {"t": "<strong>azienda</strong>", "b": true}], [{"t": "cliente", "b": false}, {"t": "cliénte", "b": false}, {"t": "<strong>cliente</strong>", "b": true}], [{"t": "contrato", "b": false}, {"t": "contrátto", "b": false}, {"t": "<strong>contratto</strong>", "b": true}], [{"t": "prazo", "b": false}, {"t": "scadéntsa", "b": false}, {"t": "<strong>scadenza</strong>", "b": true}]]}], "tip": false}, {"title": "Etiqueta: formal ou informal?", "blocks": [{"type": "h3", "text": "<strong>Quando usar tu e quando usar Lei?</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Usa «Lei» (com maiúscula, forma formal de tratamento) com qualquer pessoa mais velha, no trabalho, ou da primeira vez que te encontras com alguém — conjuga-se como a terceira pessoa do singular (ela).", "Usa «tu» com amigos, família, ou pessoas da tua idade.", "Os italianos gostam que as refeições tenham o seu tempo — o almoço e o jantar são momentos sociais, não apenas comer depressa.", "A gorjeta não é obrigatória como nos EUA, mas arredondar a conta para cima nos restaurantes é comum e apreciado.", "A pontualidade é importante em contextos formais, mas em encontros sociais há alguma flexibilidade no horário."]}], "tip": false}, {"title": "Expressões idiomáticas italianas avançadas", "blocks": [{"type": "table", "headers": ["Significado/uso", "Expressão em italiano"], "rows": [[{"t": "Boa sorte (literalmente «na boca do lobo»)", "b": false}, {"t": "In bocca al lupo", "b": false}], [{"t": "Muito caro (literalmente «custa um olho da cabeça»)", "b": false}, {"t": "Costare un occhio della testa", "b": false}], [{"t": "Mal posso esperar (literalmente «não vejo a hora»)", "b": false}, {"t": "Non vedo l'ora", "b": false}], [{"t": "Estar envolvido em algo (literalmente «ter as mãos na massa»)", "b": false}, {"t": "Avere le mani in pasta", "b": false}], [{"t": "Ser esperto/despachado (literalmente «estar na perna»)", "b": false}, {"t": "Essere in gamba", "b": false}], [{"t": "Fazer um gesto contra o azar (literalmente «fazer chifres»)", "b": false}, {"t": "Fare le corna", "b": false}], [{"t": "Gozar com alguém (literalmente «levar à roda»)", "b": false}, {"t": "Prendere in giro", "b": false}]]}], "tip": false}, {"title": "Diálogos práticos avançados (5 cenários reais)", "blocks": [{"type": "h3", "text": "<strong>1) No aeroporto — atraso no voo</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Passeggero:", "orig": "Buonasera, il mio volo per Roma è in ritardo?", "trans": "Boa noite, o meu voo para Roma está atrasado?"}, {"speaker": "Impiegato:", "orig": "Sì, purtroppo è in ritardo di un'ora.", "trans": "Sim, infelizmente está atrasado uma hora."}, {"speaker": "Passeggero:", "orig": "Perderò la coincidenza per Milano?", "trans": "Vou perder a ligação para Milão?"}, {"speaker": "Impiegato:", "orig": "Non si preoccupi, abbiamo già riorganizzato il suo viaggio.", "trans": "Não se preocupe, já reorganizámos a sua viagem."}]}, {"type": "h3", "text": "<strong>2) Reclamação no hotel</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Ospite:", "orig": "Mi scusi, il condizionatore della mia camera non funziona.", "trans": "Desculpe, o ar condicionado do meu quarto não funciona."}, {"speaker": "Reception:", "orig": "Mi dispiace molto. Mando subito qualcuno.", "trans": "Lamento imenso. Vou já enviar alguém."}, {"speaker": "Ospite:", "orig": "Grazie. Vorrei anche cambiare camera, se possibile.", "trans": "Obrigado. Gostaria também de mudar de quarto, se possível."}, {"speaker": "Reception:", "orig": "Certo, controllo la disponibilità.", "trans": "Claro, vou verificar a disponibilidade."}]}, {"type": "h3", "text": "<strong>3) Na farmácia</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Buonasera, non mi sento bene. Ho mal di testa e febbre.", "trans": "Boa noite, não me sinto bem. Tenho dor de cabeça e febre."}, {"speaker": "Farmacista:", "orig": "Da quanto tempo ha questi sintomi?", "trans": "Há quanto tempo tem estes sintomas?"}, {"speaker": "Cliente:", "orig": "Da ieri sera.", "trans": "Desde ontem à noite."}, {"speaker": "Farmacista:", "orig": "Prenda questa medicina ogni otto ore.", "trans": "Tome este medicamento a cada oito horas."}]}, {"type": "h3", "text": "<strong>4) Aluguer de um carro</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Vorrei noleggiare una macchina per tre giorni.", "trans": "Gostaria de alugar um carro por três dias."}, {"speaker": "Impiegato:", "orig": "Certo. Posso vedere la sua patente, per favore?", "trans": "Claro. Posso ver a sua carta de condução, por favor?"}, {"speaker": "Cliente:", "orig": "Ecco a lei. L'assicurazione è inclusa?", "trans": "Aqui tem. O seguro está incluído?"}, {"speaker": "Impiegato:", "orig": "Sì, l'assicurazione di base è inclusa nel prezzo.", "trans": "Sim, o seguro básico está incluído no preço."}]}, {"type": "h3", "text": "<strong>5) Perguntar por direções</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Turista:", "orig": "Mi scusi, come arrivo al Colosseo?", "trans": "Desculpe, como chego ao Coliseu?"}, {"speaker": "Locale:", "orig": "Vada sempre dritto e poi giri a destra alla seconda strada.", "trans": "Siga sempre em frente e depois vire à direita na segunda rua."}, {"speaker": "Turista:", "orig": "È molto lontano da qui?", "trans": "É muito longe daqui?"}, {"speaker": "Locale:", "orig": "No, è a circa dieci minuti a piedi.", "trans": "Não, fica a cerca de dez minutos a pé."}]}], "tip": false}, {"title": "Texto de leitura para prática", "blocks": [{"type": "p", "html": "Lê este texto em voz alta algumas vezes, e tenta perceber sem traduzires cada palavra:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>Vocabulário-chave do texto</strong>"}, {"type": "table", "headers": ["Significado", "Palavra"], "rows": [[{"t": "restaurante típico/local", "b": false}, {"t": "ristorante tipico", "b": false}], [{"t": "o Coliseu", "b": false}, {"t": "il Colosseo", "b": false}], [{"t": "música ao vivo", "b": false}, {"t": "musica dal vivo", "b": false}], [{"t": "inesquecível", "b": false}, {"t": "indimenticabile", "b": false}]]}, {"type": "h3", "text": "<strong>Perguntas de compreensão</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Quando é que a família foi a Roma?", "O que fizeram depois do check-in?", "Onde ouviram música ao vivo?"]}, {"type": "p", "html": "<em>Respostas: 1) Ontem 2) Foram ao centro almoçar 3) Perto da Piazza Navona, à noite</em>", "italic": true}], "tip": false}, {"title": "Conclusão e próximos passos para a fluência", "blocks": [{"type": "list", "label": "<strong>Para atingires a fluência completa</strong>", "intro": null, "items": ["Lê jornais ou artigos italianos simples diariamente e tenta perceber pelo contexto antes de traduzir.", "Fala com falantes nativos (online, ou se viajares) — a prática real é a coisa mais valiosa agora.", "Escreve um pequeno diário em italiano todos os dias — até 3-4 frases fazem grande diferença ao longo do tempo.", "Revê estas estruturas de vez em quando até se tornarem automáticas.", "Não tenhas medo de errar na conversa — os italianos são das pessoas mais calorosas do mundo quando alguém tenta falar a sua língua."]}], "tip": true}], "closingBasic": "Parabéns antecipados pela tua jornada com o italiano — In bocca al lupo! (boa sorte!)", "closingAdvanced": "A tua jornada com o italiano está agora pronta para um nível em que realmente podes confiar — In bocca al lupo! (boa sorte!)"}, "ptbr": {"chapters": [{"title": "Introdução: Porque aprender italiano?", "blocks": [{"type": "p", "html": "O italiano é a língua oficial de Itália, Suíça, San Marino e do Vaticano, falada por mais de 65 milhões de pessoas como língua materna, e reconhecida mundialmente como a língua da arte, da música e da gastronomia. Este livro dá-te uma base sólida no italiano padrão falado em toda a Itália.", "italic": false}, {"type": "p", "html": "A boa notícia: o italiano, tal como o português, é uma língua latina, com uma gramática muito lógica e organizada. A pronúncia é também das mais fáceis entre as línguas latinas, porque quase todas as letras se pronunciam exatamente como estão escritas, sem desaparecerem ou mudarem de forma estranha.", "italic": false}, {"type": "list", "label": "<strong>Objetivos deste livro</strong>", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Focar na pronúncia correta para que o teu sotaque soe autenticamente italiano.", "Dar-te frases práticas que podes usar desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e fundamentos de pronúncia", "blocks": [{"type": "p", "html": "O italiano usa o alfabeto latino, e a maior parte das letras pronuncia-se exatamente como está escrita. Esta tabela apresenta as letras e sons mais distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "cázà", "b": false}, {"t": "<strong>casa (todas as letras claras)</strong>", "b": true}], [{"t": "olá (informal)", "b": false}, {"t": "tcháo", "b": false}, {"t": "<strong>ciao (ci antes de a/o = «tch»)</strong>", "b": true}], [{"t": "gelado", "b": false}, {"t": "djelato", "b": false}, {"t": "<strong>gelato (ge/gi = «dj», som já conhecido do português brasileiro)</strong>", "b": true}], [{"t": "gato", "b": false}, {"t": "gatto", "b": false}, {"t": "<strong>gatto (ga/go/gu = g dura; tt duplo alonga-se na pronúncia)</strong>", "b": true}], [{"t": "esparguete", "b": false}, {"t": "spaguetti", "b": false}, {"t": "<strong>spaghetti (gh = g dura sempre)</strong>", "b": true}], [{"t": "família", "b": false}, {"t": "famíllia", "b": false}, {"t": "<strong>famiglia (gli = exatamente como o «lh» português!)</strong>", "b": true}], [{"t": "nhoque", "b": false}, {"t": "gnóki", "b": false}, {"t": "<strong>gnocchi (gn = exatamente como o «nh» português!)</strong>", "b": true}], [{"t": "peixe", "b": false}, {"t": "pêshe", "b": false}, {"t": "<strong>pesce (sce/sci = «sh»)</strong>", "b": true}], [{"t": "escola", "b": false}, {"t": "scuóla", "b": false}, {"t": "<strong>scuola (sca/sco/scu = «sk»)</strong>", "b": true}], [{"t": "piza", "b": false}, {"t": "pítsa", "b": false}, {"t": "<strong>pizza (z/zz = «ts» ou «dz»)</strong>", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro vão fazer a maior diferença para soares verdadeiramente italiano:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["As vogais (a, e, i, o, u) pronunciam-se sempre com clareza e pureza, sem se enfraquecerem ou desaparecerem como acontece em português.", "A letra c antes de e ou i pronuncia-se «tch» (como em ciao), e antes de a, o ou u pronuncia-se «k» normal (como em casa).", "A letra g antes de e ou i pronuncia-se «dj» (como em gelato), e antes de a, o ou u pronuncia-se g dura (como em gatto).", "Boa notícia: os grupos gli e gn são exatamente os mesmos sons que já conheces do português — lh e nh! Uma grande vantagem para ti.", "As consoantes duplas (como tt, ll, nn, ss) pronunciam-se com um alongamento claro — isto pode mudar completamente o significado de uma palavra, por isso presta atenção. Este é um conceito novo, já que o português não tem este fenómeno.", "Cuidado com um \"falso amigo\": em italiano, ce/ci soa \"tch\", mas em português ce/ci soa \"s\" — são sons diferentes apesar da grafia parecida."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Italiano"], "rows": [[{"t": "Olá (muito casual, usa-se para cumprimentar e despedir)", "b": false}, {"t": "tcháo", "b": false}, {"t": "<strong>Ciao</strong>", "b": true}], [{"t": "Bom dia", "b": false}, {"t": "buondjórno", "b": false}, {"t": "<strong>Buongiorno</strong>", "b": true}], [{"t": "Boa tarde", "b": false}, {"t": "buonaséra", "b": false}, {"t": "<strong>Buonasera</strong>", "b": true}], [{"t": "Boa noite", "b": false}, {"t": "buonanótte", "b": false}, {"t": "<strong>Buonanotte</strong>", "b": true}], [{"t": "Como estás? (casual)", "b": false}, {"t": "cóme stái?", "b": false}, {"t": "<strong>Come stai?</strong>", "b": true}], [{"t": "Como está? (formal)", "b": false}, {"t": "cóme stá?", "b": false}, {"t": "<strong>Come sta?</strong>", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "sto béne, grátsie", "b": false}, {"t": "<strong>Sto bene, grazie</strong>", "b": true}], [{"t": "Prazer em conhecer-te", "b": false}, {"t": "piatchére", "b": false}, {"t": "<strong>Piacere</strong>", "b": true}], [{"t": "Até já", "b": false}, {"t": "a dópo", "b": false}, {"t": "<strong>A dopo</strong>", "b": true}], [{"t": "Até breve", "b": false}, {"t": "a préesto", "b": false}, {"t": "<strong>A presto</strong>", "b": true}], [{"t": "Adeus (formal/definitivo)", "b": false}, {"t": "arrivedértchi", "b": false}, {"t": "<strong>Arrivederci</strong>", "b": true}], [{"t": "Por favor", "b": false}, {"t": "per favóre", "b": false}, {"t": "<strong>Per favore</strong>", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "grátsie", "b": false}, {"t": "<strong>Grazie</strong>", "b": true}], [{"t": "De nada", "b": false}, {"t": "prégo", "b": false}, {"t": "<strong>Prego</strong>", "b": true}], [{"t": "Desculpa", "b": false}, {"t": "scúza / mi dispiátche", "b": false}, {"t": "<strong>Scusa / Mi dispiace</strong>", "b": true}], [{"t": "Sim", "b": false}, {"t": "sí", "b": false}, {"t": "<strong>Sì</strong>", "b": true}], [{"t": "Não", "b": false}, {"t": "nó", "b": false}, {"t": "<strong>No</strong>", "b": true}]]}], "tip": false}, {"title": "Pronomes e o verbo «ser/estar» (Essere / Stare)", "blocks": [{"type": "p", "html": "Tal como em português, o italiano tem dois verbos que significam «ser/estar»: Essere para a identidade e características permanentes, e Stare para o estado temporário e o lugar (e também é a base do cumprimento diário, como já vimos).", "italic": false}, {"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["Português", "Italiano"], "rows": [[{"t": "eu", "b": false}, {"t": "io", "b": false}], [{"t": "tu", "b": false}, {"t": "tu", "b": false}], [{"t": "ele/ela", "b": false}, {"t": "lui / lei", "b": false}], [{"t": "nós", "b": false}, {"t": "noi", "b": false}], [{"t": "vós/vocês", "b": false}, {"t": "voi", "b": false}], [{"t": "eles/elas", "b": false}, {"t": "loro", "b": false}]]}, {"type": "h3", "text": "<strong>Essere — para a identidade e características permanentes</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "io", "b": false}, {"t": "sono", "b": false}], [{"t": "tu", "b": false}, {"t": "sei", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "è", "b": false}], [{"t": "noi", "b": false}, {"t": "siamo", "b": false}], [{"t": "voi", "b": false}, {"t": "siete", "b": false}], [{"t": "loro", "b": false}, {"t": "sono", "b": false}]]}, {"type": "p", "html": "Exemplo: Io sono egiziano — Eu sou egípcio.", "italic": false}, {"type": "h3", "text": "<strong>Stare — para o estado e o lugar temporário</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "io", "b": false}, {"t": "sto", "b": false}], [{"t": "tu", "b": false}, {"t": "stai", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "sta", "b": false}], [{"t": "noi", "b": false}, {"t": "stiamo", "b": false}], [{"t": "voi", "b": false}, {"t": "state", "b": false}], [{"t": "loro", "b": false}, {"t": "stanno", "b": false}]]}, {"type": "p", "html": "Exemplo: Sto a Roma — Estou (atualmente) em Roma.", "italic": false}], "tip": false}, {"title": "Verbos comuns e a sua conjugação", "blocks": [{"type": "p", "html": "Os verbos regulares italianos dividem-se em 3 grupos consoante a terminação: are, ere, ire. Sabendo o padrão, consegues conjugar qualquer verbo regular:", "italic": false}, {"type": "table", "headers": ["Pronome", "-ire (dormire: dormir)", "-ere (scrivere: escrever)", "-are (parlare: falar)"], "rows": [[{"t": "io", "b": false}, {"t": "dormo", "b": false}, {"t": "scrivo", "b": false}, {"t": "parlo", "b": false}], [{"t": "tu", "b": false}, {"t": "dormi", "b": false}, {"t": "scrivi", "b": false}, {"t": "parli", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "dorme", "b": false}, {"t": "scrive", "b": false}, {"t": "parla", "b": false}], [{"t": "noi", "b": false}, {"t": "dormiamo", "b": false}, {"t": "scriviamo", "b": false}, {"t": "parliamo", "b": false}], [{"t": "loro", "b": false}, {"t": "dormono", "b": false}, {"t": "scrivono", "b": false}, {"t": "parlano", "b": false}]]}, {"type": "h3", "text": "<strong>Verbos irregulares importantes (formas «io» e «tu»)</strong>"}, {"type": "table", "headers": ["Significado", "io", "tu", "Verbo"], "rows": [[{"t": "ter", "b": false}, {"t": "ho", "b": false}, {"t": "hai", "b": false}, {"t": "avere", "b": false}], [{"t": "ir", "b": false}, {"t": "vado", "b":  true}]]}], "tip": false}, {"title": "Frases essenciais para viagens e hotéis", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Italiano"], "rows": [[{"t": "Onde está...?", "b": false}, {"t": "dóve si tróva...?", "b": false}, {"t": "<strong>Dove si trova...?</strong>", "b": true}], [{"t": "Quanto custa isto?", "b": false}, {"t": "cuánto cósta cuésto?", "b": false}, {"t": "<strong>Quanto costa questo?</strong>", "b": true}], [{"t": "Posso ver o menu?", "b": false}, {"t": "pósso vedére il menu?", "b": false}, {"t": "<strong>Posso vedere il menu?</strong>", "b": true}], [{"t": "A conta, por favor", "b": false}, {"t": "il cónto, per favóre", "b": false}, {"t": "<strong>Il conto, per favore</strong>", "b": true}], [{"t": "Onde é a casa de banho?", "b": false}, {"t": "dovè il bánio?", "b": false}, {"t": "<strong>Dov'è il bagno?</strong>", "b": true}], [{"t": "Preciso de ajuda", "b": false}, {"t": "ó bisóño di aiúto", "b": false}, {"t": "<strong>Ho bisogno di aiuto</strong>", "b": true}], [{"t": "Não percebo", "b": false}, {"t": "non capísco", "b": false}, {"t": "<strong>Non capisco</strong>", "b": true}], [{"t": "Pode repetir, por favor?", "b": false}, {"t": "pu.ó ripétere, per favóre?", "b": false}, {"t": "<strong>Può ripetere, per favore?</strong>", "b": true}], [{"t": "Fala inglês?", "b": false}, {"t": "párla inglése?", "b": false}, {"t": "<strong>Parla inglese?</strong>", "b": true}], [{"t": "Quero reservar um quarto", "b": false}, {"t": "vorréi prenotáre úna cámera", "b": false}, {"t": "<strong>Vorrei prenotare una camera</strong>", "b": true}], [{"t": "A que horas parte o comboio?", "b": false}, {"t": "a ke óra párte il tréno?", "b": false}, {"t": "<strong>A che ora parte il treno?</strong>", "b": true}], [{"t": "Onde posso apanhar um táxi?", "b": false}, {"t": "dóve pósso prendere un táxi?", "b": false}, {"t": "<strong>Dove posso prendere un taxi?</strong>", "b": true}]]}], "tip": false}, {"title": "Expressões e gírias italianas autênticas", "blocks": [{"type": "p", "html": "Estas expressões são as que separam quem fala italiano «correto» de quem soa verdadeiramente italiano. Usa-as no contexto certo e vais ver a reação das pessoas mudar completamente:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Expressão"], "rows": [[{"t": "Vá lá!/A sério? (muito comum, para incentivar ou espantar)", "b": false}, {"t": "dái", "b": false}, {"t": "<strong>Dai!</strong>", "b": true}], [{"t": "Quem me dera! (desejo)", "b": false}, {"t": "madjári", "b": false}, {"t": "<strong>Magari!</strong>", "b": true}], [{"t": "Sei lá (expressão de dúvida usadíssima)", "b": false}, {"t": "bó", "b": false}, {"t": "<strong>Boh</strong>", "b": true}], [{"t": "Fixe/Bonito", "b": false}, {"t": "fígo", "b": false}, {"t": "<strong>Figo</strong>", "b": true}], [{"t": "Que confusão! (para uma situação caótica)", "b": false}, {"t": "ke cazíno", "b": false}, {"t": "<strong>Che casino!</strong>", "b": true}], [{"t": "Boa sorte (literalmente «na boca do lobo» — expressão tradicional de incentivo)", "b": false}, {"t": "in bócca al lúpo", "b": false}, {"t": "<strong>In bocca al lupo</strong>", "b": true}], [{"t": "Vamos!", "b": false}, {"t": "andiámo", "b": false}, {"t": "<strong>Andiamo!</strong>", "b": true}]]}], "tip": false}, {"title": "Diálogo prático completo", "blocks": [{"type": "p", "html": "Um diálogo simples num café — lê em voz alta várias vezes e tenta imitar a pronúncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "Ciao! Benvenuto. Cosa desidera?", "trans": "Olá! Bem-vindo. O que deseja?"}, {"speaker": "Cliente:", "orig": "Ciao! Vorrei un caffè, per favore.", "trans": "Olá! Quero um café, por favor."}, {"speaker": "Empregado:", "orig": "Solo questo?", "trans": "Só isso?"}, {"speaker": "Cliente:", "orig": "Sì, e il conto, per favore.", "trans": "Sim, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "Sono due euro. Grazie!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "Prego, a dopo!", "trans": "De nada, até já!"}]}], "tip": false}, {"title": "Plano de ação: como aprender rápido", "blocks": [{"type": "list", "label": "<strong>7 passos para fixar a língua rapidamente</strong>", "intro": null, "items": ["Ouve música e séries italianas todos os dias, nem que sejam 10 minutos — o ouvido adapta-se ao ritmo antes da mente.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo e velocidade.", "Concentra-te nas consoantes duplas (como tt e ll) e tenta alongá-las na pronúncia tal como os italianos fazem.", "Não traduzas na tua cabeça — tenta pensar diretamente na palavra italiana em vez de passares primeiro pelo português.", "Usa uma aplicação como o Duolingo ou o Babbel junto com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo com erros — a fluência vem da prática, não da memorização.", "Repara nas semelhanças entre o italiano e o português (e o espanhol, se já os estudaste) — isso vai facilitar-te muito o processo."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Italiano — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível em que realmente consigas desenrascar-te em viagens, no trabalho e no dia a dia em Itália, este livro vai dar-te: os tempos verbais que precisas para falar do passado e do futuro, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "<strong>Antes de começares</strong>", "intro": null, "items": ["Deves já saber: cumprimentos, pronomes, o verbo Essere/Stare, a conjugação do presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenrascares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de avançares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "h3", "text": "<strong>Pronomes</strong>"}, {"type": "table", "headers": ["io", "tu", "lui/lei", "noi", "voi/loro"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vós/eles", "b": false}]]}, {"type": "h3", "text": "<strong>Presente — os padrões regulares</strong>"}, {"type": "table", "headers": ["Pronome", "-ire (dormire)", "-ere (scrivere)", "-are (parlare)"], "rows": [[{"t": "io", "b": false}, {"t": "dormo", "b": false}, {"t": "scrivo", "b": false}, {"t": "parlo", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "dorme", "b": false}, {"t": "scrive", "b": false}, {"t": "parla", "b": false}], [{"t": "noi", "b": false}, {"t": "dormiamo", "b": false}, {"t": "scriviamo", "b": false}, {"t": "parliamo", "b": false}], [{"t": "loro", "b": false}, {"t": "dormono", "b": false}, {"t": "scrivono", "b": false}, {"t": "parlano", "b": false}]]}, {"type": "h3", "text": "<strong>Essere / Stare (presente)</strong>"}, {"type": "table", "headers": ["Pronome", "Stare", "Essere"], "rows": [[{"t": "io", "b": false}, {"t": "sto", "b": false}, {"t": "sono", "b": false}], [{"t": "lui/lei", "b": false}, {"t": "sta", "b": false}, {"t": "è", "b": false}], [{"t": "noi", "b": false}, {"t": "stiamo", "b": false}, {"t": "siamo", "b": false}], [{"t": "loro", "b": false}, {"t": "stanno", "b": false}, {"t": "sono", "b": false}]]}], "tip": false}, {"title": "O passado próximo (Passato Prossimo)", "blocks": [{"type": "p", "html": "Este é o tempo básico do passado no italiano falado, formado por um verbo auxiliar (Avere ou Essere) no presente + o particípio passado.", "italic": false}, {"type": "h3", "text": "<strong>Com Avere (para a maioria dos verbos)</strong>"}, {"type": "table", "headers": ["Pronome", "Conjugação completa"], "rows": [[{"t": iente:", "orig": "Ecco a lei. L'assicurazione è inclusa?", "trans": "Aqui tem. O seguro está incluído?"}, {"speaker": "Impiegato:", "orig": "Sì, l'assicurazione di base è inclusa nel prezzo.", "trans": "Sim, o seguro básico está incluído no preço."}]}, {"type": "h3", "text": "<strong>5) Perguntar por direções</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Turista:", "orig": "Mi scusi, come arrivo al Colosseo?", "trans": "Desculpe, como chego ao Coliseu?"}, {"speaker": "Locale:", "orig": "Vada sempre dritto e poi giri a destra alla seconda strada.", "trans": "Siga sempre em frente e depois vire à direita na segunda rua."}, {"speaker": "Turista:", "orig": "È molto lontano da qui?", "trans": "É muito longe daqui?"}, {"speaker": "Locale:", "orig": "No, è a circa dieci minuti a piedi.", "trans": "Não, fica a cerca de dez minutos a pé."}]}], "tip": false}, {"title": "Texto de leitura para prática", "blocks": [{"type": "p", "html": "Lê este texto em voz alta algumas vezes, e tenta perceber sem traduzires cada palavra:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>Vocabulário-chave do texto</strong>"}, {"type": "table", "headers": ["Significado", "Palavra"], "rows": [[{"t": "restaurante típico/local", "b": false}, {"t": "ristorante tipico", "b": false}], [{"t": "o Coliseu", "b": false}, {"t": "il Colosseo", "b": false}], [{"t": "música ao vivo", "b": false}, {"t": "musica dal vivo", "b": false}], [{"t": "inesquecível", "b": false}, {"t": "indimenticabile", "b": false}]]}, {"type": "h3", "text": "<strong>Perguntas de compreensão</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["Quando é que a família foi a Roma?", "O que fizeram depois do check-in?", "Onde ouviram música ao vivo?"]}, {"type": "p", "html": "<em>Respostas: 1) Ontem 2) Foram ao centro almoçar 3) Perto da Piazza Navona, à noite</em>", "italic": true}], "tip": false}, {"title": "Conclusão e próximos passos para a fluên
