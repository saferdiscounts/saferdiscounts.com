kaz-a-dë-ban-yo", "b": false}, {"t": "Onde é a casa de banho?", "b": true}], [{"t": "J'ai besoin d'aide", "b": false}, {"t": "prechizo dë ajouda", "b": false}, {"t": "Preciso de ajuda", "b": true}], [{"t": "Je ne comprends pas", "b": false}, {"t": "nan-ou pércébou", "b": false}, {"t": "Não percebo", "b": true}], [{"t": "Pouvez-vous répéter, s'il vous plaît ?", "b": false}, {"t": "pod-ë rrepétirr", "b": false}, {"t": "Pode repetir, por favor?", "b": true}], [{"t": "Parlez-vous anglais ?", "b": false}, {"t": "fala inglech", "b": false}, {"t": "Fala inglês?", "b": true}], [{"t": "Je voudrais réserver une chambre", "b": false}, {"t": "kéria rrézervarr oum kouartou", "b": false}, {"t": "Queria reservar um quarto", "b": true}], [{"t": "À quelle heure part le train ?", "b": false}, {"t": "a kë orash sai ou komboiou", "b": false}, {"t": "A que horas sai o comboio?", "b": true}], [{"t": "Où puis-je prendre un taxi ?", "b": false}, {"t": "onndë poss-ou apannyar oum taxi", "b": false}, {"t": "Onde posso apanhar um táxi?", "b": true}]]}], "tip": false}, {"title": "Expressions et argot portugais authentique", "blocks": [{"type": "p", "html": "Ces expressions font la différence entre un portugais « scolaire » et un portugais qui sonne vraiment local. Utilise-les au bon moment :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Expression"], "rows": [[{"t": "D'accord/ça marche", "b": false}, {"t": "fikk-a bem", "b": false}, {"t": "Fica bem", "b": true}], [{"t": "Génial !", "b": false}, {"t": "fee-chè / j-i-ral", "b": false}, {"t": "Fixe! / Giro!", "b": true}], [{"t": "Franchement (intercalaire courant)", "b": false}, {"t": "punn", "b": false}, {"t": "Pronto", "b": true}], [{"t": "Truc/chose (mot générique)", "b": false}, {"t": "koiza", "b": false}, {"t": "Coisa", "b": true}], [{"t": "Bof (indifférence)", "b": false}, {"t": "sé kalyarr", "b": false}, {"t": "Se calhar", "b": true}], [{"t": "Ce n'est pas grave", "b": false}, {"t": "nan-ou faz mal", "b": false}, {"t": "Não faz mal", "b": true}], [{"t": "Cool/sympa (très courant chez les jeunes)", "b": false}, {"t": "fee-chë", "b": false}, {"t": "Fixe", "b": true}]]}], "tip": false}, {"title": "Dialogue pratique complet", "blocks": [{"type": "p", "html": "Un dialogue simple dans un café — lis-le à voix haute plusieurs fois et essaie d'imiter la prononciation :", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado :", "orig": "Bom dia! Bem-vindo. O que deseja?", "trans": "Bonjour ! Bienvenue. Que désirez-vous ?"}, {"speaker": "Cliente :", "orig": "Bom dia! Queria um café, por favor.", "trans": "Bonjour ! Je voudrais un café, s'il vous plaît."}, {"speaker": "Empregado :", "orig": "Mais alguma coisa?", "trans": "Autre chose ?"}, {"speaker": "Cliente :", "orig": "Não, e a conta, por favor.", "trans": "Non, et l'addition, s'il vous plaît."}, {"speaker": "Empregado :", "orig": "São dois euros. Obrigado!", "trans": "Ça fait deux euros. Merci !"}, {"speaker": "Cliente :", "orig": "De nada, até breve!", "trans": "De rien, à bientôt !"}]}], "tip": false}, {"title": "Plan d'action : comment apprendre vite", "blocks": [{"type": "list", "label": "7 étapes pour progresser rapidement", "intro": null, "items": ["Écoute de la musique et des séries portugaises (fado, RTP) chaque jour, même 10 minutes.", "Pratique le « shadowing » : écoute une phrase courte et répète-la immédiatement au même rythme.", "Entraîne ton oreille aux voyelles « avalées » du portugais européen — regarde des vidéos avec sous-titres portugais pour t'habituer.", "Ne traduis pas dans ta tête — essaie de penser directement en portugais.", "Utilise une application comme Duolingo ou Babbel en complément de ce livre pour renforcer le vocabulaire.", "Parle dès le premier jour, même en faisant des erreurs — la fluidité vient de la pratique.", "Fais bien la distinction entre ser et estar dès le début — c'est la base de toute phrase correcte."]}], "tip": true}, {"title": "Introduction : pour qui est ce livre ?", "blocks": [{"type": "p", "html": "Ce livre est la suite de « Apprendre le Portugais — Facile, Amusant et Rapide », qui couvrait les bases. Si tu as terminé le niveau de base et veux atteindre un niveau où tu peux vraiment te débrouiller en voyage, au travail et dans la vie quotidienne au Portugal, ce livre va te donner : les temps verbaux dont tu as besoin, du vocabulaire pratique, et des dialogues réalistes.", "italic": false}, {"type": "list", "label": "Avant de commencer", "intro": null, "items": ["Tu devrais déjà connaître : les salutations, les pronoms, ser/estar, la conjugaison au présent, et les nombres — tout cela est dans le livre de base.", "Notre objectif ici n'est pas de tout t'enseigner sur la langue, mais de te donner assez d'outils pour te débrouiller seul.", "Prends ton temps dans chaque chapitre, et entraîne-toi à voix haute sur les exemples."]}], "tip": false, "dividerBefore": true}, {"title": "Révision rapide du niveau de base", "blocks": [{"type": "table", "headers": ["eu", "tu", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "je", "b": false}, {"t": "tu", "b": false}, {"t": "il/elle", "b": false}, {"t": "nous", "b": false}, {"t": "vous/ils", "b": true}]]}, {"type": "h3", "text": "Présent — les schémas réguliers"}, {"type": "table", "headers": ["Pronom", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "Le passé : Pretérito Perfeito et Imperfeito", "blocks": [{"type": "p", "html": "Le portugais, comme le français, distingue une action ponctuelle et achevée (Pretérito Perfeito, comme le passé composé) d'une action habituelle ou descriptive (Imperfeito, comme l'imparfait). Contrairement au français, le Pretérito Perfeito portugais est un temps simple, sans auxiliaire :", "italic": false}, {"type": "table", "headers": ["Pronom", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "tu", "b": false}, {"t": "falaste", "b": false}, {"t": "foste", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falámos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "L'Imperfeito"}, {"type": "table", "headers": ["Pronom", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "tu", "b": false}, {"t": "falavas", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Exemple : Quando era pequeno, morava em Paris (Imperfeito : description) — Ontem fui ao mercado (Pretérito Perfeito : fait ponctuel).", "italic": false}], "tip": false}, {"title": "Le futur et le conditionnel", "blocks": [{"type": "table", "headers": ["Usage", "Formation", "Exemple"], "rows": [[{"t": "Futur proche (intention)", "b": false}, {"t": "ir (présent) + infinitif", "b": false}, {"t": "Vou partir amanhã — Je vais partir demain", "b": true}], [{"t": "Futur simple (prévision)", "b": false}, {"t": "infinitif + terminaisons -ei, -ás, -á, -emos, -ão", "b": false}, {"t": "Partirei no próximo ano — Je partirai l'année prochaine", "b": true}], [{"t": "Conditionnel (hypothèse, politesse)", "b": false}, {"t": "infinitif + terminaisons -ia, -ias, -ia, -íamos, -iam", "b": false}, {"t": "Queria um café — Je voudrais un café", "b": true}]]}], "tip": false}, {"title": "Verbes pronominaux et pronoms compléments", "blocks": [{"type": "table", "headers": ["Pronom sujet", "Pronom réfléchi", "lavar-se (se laver)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "lavo-me", "b": true}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "lavas-te", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "se", "b": false}, {"t": "lava-se", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "lavamo-nos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "lavam-se", "b": true}]]}, {"type": "p", "html": "Particularité du portugais européen : le pronom complément se place souvent après le verbe, relié par un trait d'union (Chamo-me Marta — Je m'appelle Marta), contrairement au français où il précède toujours le verbe.", "italic": false}], "tip": false}, {"title": "Les contractions de prépositions", "blocks": [{"type": "p", "html": "Comme en italien, les prépositions portugaises se contractent obligatoirement avec les articles définis :", "italic": false}, {"type": "table", "headers": ["Préposition", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Exemple : Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparatifs, superlatifs et connecteurs avancés", "blocks": [{"type": "table", "headers": ["Structure", "Portugais", "Signification"], "rows": [[{"t": "plus... que", "b": false}, {"t": "mais... do que", "b": false}, {"t": "É mais alto do que eu", "b": true}], [{"t": "moins... que", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "aussi... que", "b": false}, {"t": "tão... como", "b": false}, {"t": "É tão rápida como ele", "b": true}], [{"t": "le plus/la plus", "b": false}, {"t": "o mais / a mais", "b": false}, {"t": "É o bairro mais bonito", "b": true}], [{"t": "cependant", "b": false}, {"t": "no entanto", "b": false}, {"t": "connecteur de contraste", "b": true}], [{"t": "donc", "b": false}, {"t": "portanto", "b": false}, {"t": "connecteur de conséquence", "b": true}], [{"t": "bien que", "b": false}, {"t": "embora (+ subjonctif)", "b": false}, {"t": "connecteur de concession", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : aéroport et douane", "blocks": [{"type": "table", "headers": ["Signification", "Portugais"], "rows": [[{"t": "carte d'embarquement", "b": false}, {"t": "cartão de embarque", "b": true}], [{"t": "bagage à main", "b": false}, {"t": "bagagem de mão", "b": true}], [{"t": "retrait des bagages", "b": false}, {"t": "recolha de bagagem", "b": true}], [{"t": "vol retardé", "b": false}, {"t": "voo atrasado", "b": true}], [{"t": "douane", "b": false}, {"t": "alfândega", "b": true}], [{"t": "passeport", "b": false}, {"t": "passaporte", "b": true}], [{"t": "rien à déclarer", "b": false}, {"t": "nada a declarar", "b": true}], [{"t": "porte d'embarquement", "b": false}, {"t": "porta de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : hôtel, santé et urgences", "blocks": [{"type": "table", "headers": ["Signification", "Portugais"], "rows": [[{"t": "Il n'y a pas d'eau chaude", "b": false}, {"t": "Não há água quente", "b": true}], [{"t": "La chambre n'est pas prête", "b": false}, {"t": "O quarto não está pronto", "b": true}], [{"t": "Je voudrais changer de chambre", "b": false}, {"t": "Queria mudar de quarto", "b": true}], [{"t": "pharmacie", "b": false}, {"t": "farmácia", "b": true}], [{"t": "J'ai besoin d'un médecin", "b": false}, {"t": "Preciso de um médico", "b": true}], [{"t": "J'ai mal ici", "b": false}, {"t": "Dói-me aqui", "b": true}], [{"t": "Appelez une ambulance !", "b": false}, {"t": "Chame uma ambulância!", "b": true}], [{"t": "hôpital", "b": false}, {"t": "hospital", "b": true}], [{"t": "assurance maladie", "b": false}, {"t": "seguro de saúde", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : banque, police et démarches officielles", "blocks": [{"type": "table", "headers": ["Signification", "Portugais"], "rows": [[{"t": "compte courant", "b": false}, {"t": "conta à ordem", "b": true}], [{"t": "distributeur automatique", "b": false}, {"t": "multibanco", "b": true}], [{"t": "taux de change", "b": false}, {"t": "taxa de câmbio", "b": true}], [{"t": "J'ai perdu mon portefeuille", "b": false}, {"t": "Perdi a carteira", "b": true}], [{"t": "dépôt de plainte", "b": false}, {"t": "apresentação de queixa", "b": true}], [{"t": "commissariat de police", "b": false}, {"t": "esquadra da polícia", "b": true}], [{"t": "mairie", "b": false}, {"t": "câmara municipal", "b": true}], [{"t": "titre de séjour", "b": false}, {"t": "autorização de residência", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : transports et directions", "blocks": [{"type": "table", "headers": ["Signification", "Portugais"], "rows": [[{"t": "billet aller simple", "b": false}, {"t": "bilhete simples", "b": true}], [{"t": "aller-retour", "b": false}, {"t": "ida e volta", "b": true}], [{"t": "location de voiture", "b": false}, {"t": "aluguer de carro", "b": true}], [{"t": "Tournez à droite", "b": false}, {"t": "Vire à direita", "b": true}], [{"t": "Allez tout droit", "b": false}, {"t": "Siga em frente", "b": true}], [{"t": "feu (de circulation)", "b": false}, {"t": "semáforo", "b": true}], [{"t": "rond-point", "b": false}, {"t": "rotunda", "b": true}], [{"t": "quai", "b": false}, {"t": "cais / plataforma", "b": true}], [{"t": "arrêt de bus", "b": false}, {"t": "paragem de autocarro", "b": true}]]}], "tip": false}, {"title": "Vocabulaire : shopping et travail", "blocks": [{"type": "table", "headers": ["Signification", "Portugais"], "rows": [[{"t": "Pouvez-vous me faire une remise ?", "b": false}, {"t": "Pode fazer-me um desconto?", "b": true}], [{"t": "taille (vêtements)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "cabine d'essayage", "b": false}, {"t": "cabine de provas", "b": true}], [{"t": "réunion", "b": false}, {"t": "reunião", "b": true}], [{"t": "date limite", "b": false}, {"t": "prazo", "b": true}], [{"t": "candidature", "b": false}, {"t": "candidatura", "b": true}], [{"t": "entretien d'embauche", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "salaire", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Étiquette : tu ou você ?", "blocks": [{"type": "p", "html": "Au Portugal, « tu » est très répandu même dans des contextes assez informels entre jeunes, mais « você » et surtout les formes de politesse avec le nom ou le titre (« o senhor », « a senhora », « a doutora ») restent la norme en contexte professionnel ou avec des personnes âgées ou inconnues.", "italic": false}, {"type": "list", "label": "Règles pratiques", "intro": null, "items": ["Avec des inconnus, des supérieurs, des personnes âgées : utilise la troisième personne avec « o senhor / a senhora » plutôt que « você », qui peut paraître un peu abrupt au Portugal.", "Avec des amis, la famille, des collègues proches : tu.", "Les e-mails formels s'ouvrent par « Exmo(a). Senhor(a) » et se terminent par « Com os melhores cumprimentos »."]}], "tip": false}, {"title": "Expressions idiomatiques avancées", "blocks": [{"type": "table", "headers": ["Signification", "Expression"], "rows": [[{"t": "Coûter les yeux de la tête", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "Avoir la tête ailleurs", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "Faire comme si de rien n'était", "b": false}, {"t": "Fazer de conta que nada se passou", "b": true}], [{"t": "Être fauché", "b": false}, {"t": "Estar teso / sem uma coroa", "b": true}], [{"t": "Se mettre dans le pétrin", "b": false}, {"t": "Meter-se em sarilhos", "b": true}], [{"t": "Casser la glace", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Dialogues pratiques avancés", "blocks": [{"type": "p", "html": "Scénario : régler un problème à l'hôtel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Hóspede :", "orig": "Bom dia, há um problema com o meu quarto, o ar condicionado não funciona.", "trans": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas."}, {"speaker": "Rececionista :", "orig": "Lamento imenso, vou já enviar alguém. Prefere mudar de quarto entretanto?", "trans": "Je suis vraiment désolée, j'envoie quelqu'un tout de suite. Préférez-vous changer de chambre entre-temps ?"}, {"speaker": "Hóspede :", "orig": "Sim, seria mais simples, obrigado.", "trans": "Oui, ce serait plus simple, merci."}]}, {"type": "p", "html": "Scénario : chez le médecin.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico :", "orig": "O que se passa?", "trans": "Qu'est-ce qui ne va pas ?"}, {"speaker": "Paciente :", "orig": "Tenho dores de garganta há três dias e um pouco de febre.", "trans": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre."}, {"speaker": "Médico :", "orig": "Vou receitar-lhe uns medicamentos. Descanse bem.", "trans": "Je vais vous prescrire des médicaments. Reposez-vous bien."}]}], "tip": false}, {"title": "Conclusion et prochaines étapes vers la fluidité", "blocks": [{"type": "list", "label": "Comment continuer à progresser", "intro": null, "items": ["Regarde des séries et des films portugais avec des sous-titres en portugais pour habituer ton oreille au rythme européen.", "Lis chaque jour un court article d'un journal portugais en ligne (Público, Expresso).", "Trouve un partenaire linguistique pour des échanges de conversation (tandem).", "Tiens un petit journal quotidien de quelques phrases en portugais.", "N'aie pas peur des erreurs : la vraie fluidité vient de la pratique constante."]}], "tip": true}], "closingBasic": "Félicitations d'avance pour ton parcours en portugais — Boa sorte! (bonne chance !)", "closingAdvanced": "Parabéns antecipados pelo teu percurso em português — Boa sorte!"}, "ptbr": {"chapters": [{"title": "Introduction: why learn Portuguese?", "blocks": [{"type": "p", "html": "Portuguese is spoken by over 250 million people worldwide, the official language of Portugal, Brazil, Angola, Mozambique and several other countries. This book gives you a solid foundation in European Portuguese, the variety spoken in Portugal, whose pronunciation is quite different from the Brazilian one.", "italic": false}, {"type": "p", "html": "The good news: Portuguese is a Romance language, and much of its vocabulary will feel familiar if you already know some French or Spanish. The main difficulty is pronunciation — vowels are often reduced or swallowed, there are nasal sounds, and the distinctive «ão», none of which have a direct English equivalent.", "italic": false}, {"type": "list", "label": "Goals of this book", "intro": null, "items": ["Give you a solid base of essential vocabulary and grammar in the shortest time possible.", "Focus on correct pronunciation so your accent sounds authentically Portuguese.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The alphabet and pronunciation basics", "blocks": [{"type": "p", "html": "Portuguese uses the Latin alphabet, but many unstressed vowels shrink or nearly disappear in speech, especially in Portugal. This table shows the most distinctive sounds:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Word"], "rows": [[{"t": "house", "b": false}, {"t": "KAH-zuh", "b": false}, {"t": "casa", "b": true}], [{"t": "good morning", "b": false}, {"t": "bohm DEE-uh", "b": false}, {"t": "bom dia", "b": true}], [{"t": "thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "obrigado (said by a man, obrigada by a woman)", "b": true}], [{"t": "cat", "b": false}, {"t": "GAH-too", "b": false}, {"t": "gato", "b": true}], [{"t": "I", "b": false}, {"t": "EH-oo", "b": false}, {"t": "eu", "b": true}], [{"t": "boy", "b": false}, {"t": "rah-PAHZ", "b": false}, {"t": "rapaz", "b": true}], [{"t": "bread", "b": false}, {"t": "POWNG (nasal)", "b": false}, {"t": "pão (ão = a unique nasal vowel, between «ow» and «own»)", "b": true}], [{"t": "water", "b": false}, {"t": "AH-gwuh", "b": false}, {"t": "água", "b": true}], [{"t": "egg", "b": false}, {"t": "OH-voo", "b": false}, {"t": "ovo", "b": true}], [{"t": "wine", "b": false}, {"t": "VEE-nyoo (nasal)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "The golden rules for authentic pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference to sounding truly Portuguese:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["European Portuguese swallows many of its unstressed vowels, which makes it sound more compressed and \"hushed\" than Brazilian Portuguese.", "The «ão» sound is a unique nasal vowel — practise it as an \"ow\" followed by a soft nasal \"n\", all through the nose.", "The letter s at the end of a word, or before a consonant, is often pronounced «sh» in Portugal (dois → \"doysh\").", "The ç and c before e/i are pronounced «s»: França.", "The group lh is pronounced like the \"lli\" in \"million\" (velho, filho).", "The group nh is pronounced like the \"ny\" in \"canyon\" (senhor, vinho)."]}], "tip": false}, {"title": "Greetings and essential phrases", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese"], "rows": [[{"t": "Good morning", "b": false}, {"t": "bohm DEE-uh", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Good afternoon", "b": false}, {"t": "BOH-uh TAR-duh", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Hi (casual)", "b": false}, {"t": "oh-LAH", "b": false}, {"t": "Olá", "b": true}], [{"t": "How are you?", "b": false}, {"t": "KOH-moo ish-TASH", "b": false}, {"t": "Como estás?", "b": true}], [{"t": "Fine, thanks", "b": false}, {"t": "beng, oh-bree-GAH-doo", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Nice to meet you", "b": false}, {"t": "prah-ZEHR", "b": false}, {"t": "Prazer", "b": true}], [{"t": "See you soon", "b": false}, {"t": "ah-TEH BREH-vuh", "b": false}, {"t": "Até breve", "b": true}], [{"t": "See you tomorrow", "b": false}, {"t": "ah-TEH ah-mahn-YAH", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Goodbye", "b": false}, {"t": "ah-DEH-oosh", "b": false}, {"t": "Adeus", "b": true}], [{"t": "Please", "b": false}, {"t": "por fah-VOR", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "You're welcome", "b": false}, {"t": "duh NAH-duh", "b": false}, {"t": "De nada", "b": true}], [{"t": "Excuse me/sorry", "b": false}, {"t": "dish-KOOL-puh", "b": false}, {"t": "Desculpe", "b": true}], [{"t": "Yes", "b": false}, {"t": "seeng", "b": false}, {"t": "Sim", "b": true}], [{"t": "No", "b": false}, {"t": "nowng", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "Pronouns and the verbs «ser» and «estar» (to be)", "blocks": [{"type": "p", "html": "Unlike English, Portuguese has two verbs for \"to be\": «ser» for identity and permanent traits, and «estar» for temporary states and location.", "italic": false}, {"type": "h3", "text": "Pronouns"}, {"type": "table", "headers": ["English", "Portuguese"], "rows": [[{"t": "I", "b": false}, {"t": "eu", "b": true}], [{"t": "you", "b": false}, {"t": "tu", "b": true}], [{"t": "he/she", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "we", "b": false}, {"t": "nós", "b": true}], [{"t": "you (plural)", "b": false}, {"t": "vocês", "b": true}], [{"t": "they", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — to be (permanent)"}, {"type": "table", "headers": ["Pronoun", ill, please", "b": false}, {"t": "uh KOHN-tuh por fah-VOR", "b": false}, {"t": "A conta, por favor", "b": true}], [{"t": "Where is the toilet?", "b": false}, {"t": "OHN-duh eh uh KAH-zuh duh BAHN-yoo", "b": false}, {"t": "Onde é a casa de banho?", "b": true}], [{"t": "I need help", "b": false}, {"t": "pruh-SEE-zoo duh uh-ZHOO-duh", "b": false}, {"t": "Preciso de ajuda", "b": true}], [{"t": "I don't understand", "b": false}, {"t": "nowng pehr-SEH-boo", "b": false}, {"t": "Não percebo", "b": true}], [{"t": "Can you repeat, please?", "b": false}, {"t": "POH-duh reh-puh-TEER", "b": false}, {"t": "Pode repetir, por favor?", "b": true}], [{"t": "Do you speak English?", "b": false}, {"t": "FAH-luh eeng-GLEHSH", "b": false}, {"t": "Fala inglês?", "b": true}], [{"t": "I'd like to book a room", "b": false}, {"t": "kuh-REE-uh reh-zehr-VAR oong KWAR-too", "b": false}, {"t": "Queria reservar um quarto", "b": true}], [{"t": "What time does the train leave?", "b": false}, {"t": "uh keh OH-rush sy oo kohm-BOY-oo", "b": false}, {"t": "A que horas sai o comboio?", "b": true}], [{"t": "Where can I get a taxi?", "b": false}, {"t": "OHN-duh POH-soo uh-pahn-YAR oong TAHK-see", "b": false}, {"t": "Onde posso apanhar um táxi?", "b": true}]]}], "tip": false}, {"title": "Authentic Portuguese expressions and slang", "blocks": [{"type": "p", "html": "These expressions are what separate someone who speaks «textbook» Portuguese from someone who sounds genuinely local. Use them in the right context:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Expression"], "rows": [[{"t": "Okay/sounds good", "b": false}, {"t": "FEE-kuh beng", "b": false}, {"t": "Fica bem", "b": true}], [{"t": "Cool!", "b": false}, {"t": "FEESH / ZHEE-roo", "b": false}, {"t": "Fixe! / Giro!", "b": true}], [{"t": "Right/okay (common filler)", "b": false}, {"t": "PROHN-too", "b": false}, {"t": "Pronto", "b": true}], [{"t": "Thing/stuff (generic word)", "b": false}, {"t": "KOY-zuh", "b": false}, {"t": "Coisa", "b": true}], [{"t": "Maybe/probably", "b": false}, {"t": "suh kul-YAR", "b": false}, {"t": "Se calhar", "b": true}], [{"t": "No big deal", "b": false}, {"t": "nowng fahz mal", "b": false}, {"t": "Não faz mal", "b": true}], [{"t": "Cool/nice (very common with young people)", "b": false}, {"t": "FEESH", "b": false}, {"t": "Fixe", "b": true}]]}], "tip": false}, {"title": "Full practice dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it aloud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "Bom dia! Bem-vindo. O que deseja?", "trans": "Good morning! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "Bom dia! Queria um café, por favor.", "trans": "Good morning! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "Mais alguma coisa?", "trans": "Anything else?"}, {"speaker": "Customer:", "orig": "Não, e a conta, por favor.", "trans": "No, and the bill, please."}, {"speaker": "Waiter:", "orig": "São dois euros. Obrigado!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "De nada, até breve!", "trans": "You're welcome, see you soon!"}]}], "tip": false}, {"title": "Action plan: how to learn fast", "blocks": [{"type": "list", "label": "7 steps to lock in the language quickly", "intro": null, "items": ["Listen to Portuguese music (fado, RTP) and shows every day, even just 10 minutes.", "Practise «shadowing»: listen to a short sentence and repeat it immediately at the same rhythm.", "Train your ear for the swallowed vowels of European Portuguese — watch videos with Portuguese subtitles to get used to it.", "Don't translate in your head — try to think directly in Portuguese.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary.", "Speak from day one, even if you make mistakes — fluency comes from practice.", "Get comfortable distinguishing ser and estar from the start — it's the foundation of every correct sentence."]}], "tip": true}, {"title": "Introduction: who is this book for?", "blocks": [{"type": "p", "html": "This book is the second part after «Learn Portuguese — European Portuguese, Easy, Fun and Fast», which covered the basics. If you've already finished the basic level and want to reach a level where you can genuinely get by while travelling, working, and living day to day in Portugal, this book will give you: the verb tenses you need, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "Before you start", "intro": null, "items": ["You should already know: greetings, pronouns, ser/estar, present-tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take each chapter slowly, and practise the examples out loud before moving on to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick review of the basic level", "blocks": [{"type": "table", "headers": ["eu", "tu", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you (pl)/they", "b": true}]]}, {"type": "h3", "text": "Present tense — the regular patterns"}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "The past: Pretérito Perfeito and Imperfeito", "blocks": [{"type": "p", "html": "Portuguese distinguishes a completed, one-off action (Pretérito Perfeito, roughly the English simple past) from a habitual or descriptive past (Imperfeito, roughly \"used to\" / \"was -ing\"). Unlike English, the Pretérito Perfeito is a simple tense, with no auxiliary verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "tu", "b": false}, {"t": "falaste", "b": false}, {"t": "foste", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falámos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "The Imperfeito"}, {"type": "table", "headers": ["Pronoun", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "tu", "b": false}, {"t": "falavas", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Example: Quando era pequeno, morava em Londres (Imperfeito: description) — Ontem fui ao mercado (Pretérito Perfeito: one-off event).", "italic": false}], "tip": false}, {"title": "Future and conditional", "blocks": [{"type": "table", "headers": ["Use", "Formation", "Example"], "rows": [[{"t": "Near future (intention)", "b": false}, {"t": "ir (present) + infinitive", "b": false}, {"t": "Vou partir amanhã — I'm going to leave tomorrow", "b": true}], [{"t": "Simple future (prediction)", "b": false}, {"t": "infinitive + endings -ei, -ás, -á, -emos, -ão", "b": false}, {"t": "Partirei no próximo ano — I will leave next year", "b": true}], [{"t": "Conditional (hypothesis, politeness)", "b": false}, {"t": "infinitive + endings -ia, -ias, -ia, -íamos, -iam", "b": false}, {"t": "Queria um café — I would like a coffee", "b": true}]]}], "tip": false}, {"title": "Reflexive verbs and object pronouns", "blocks": [{"type": "table", "headers": ["Subject pronoun", "Reflexive pronoun", "lavar-se (to wash oneself)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "lavo-me", "b": true}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "lavas-te", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "se", "b": false}, {"t": "lava-se", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "lavamo-nos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "lavam-se", "b": true}]]}, {"type": "p", "html": "A key feature of European Portuguese: the object pronoun often attaches after the verb with a hyphen (Chamo-me Marta — My name is Marta), unlike English word order, where it always precedes.", "italic": false}], "tip": false}, {"title": "Preposition + article contractions", "blocks": [{"type": "p", "html": "Portuguese prepositions obligatorily contract with definite articles:", "italic": false}, {"type": "table", "headers": ["Preposition", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Example: Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparatives, superlatives and advanced connectors", "blocks": [{"type": "table", "headers": ["Structure", "Portuguese", "Meaning"], "rows": [[{"t": "more... than", "b": false}, {"t": "mais... do que", "b": false}, {"t": "É mais alto do que eu", "b": true}], [{"t": "less... than", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "as... as", "b": false}, {"t": "tão... como", "b": false}, {"t": "É tão rápida como ele", "b": true}], [{"t": "the most", "b": false}, {"t": "o mais / a mais", "b": false}, {"t": "É o bairro mais bonito", "b": true}], [{"t": "however", "b": false}, {"t": "no entanto", "b": false}, {"t": "formal contrast connector", "b": true}], [{"t": "therefore/so", "b": false}, {"t": "portanto", "b": false}, {"t": "consequence connector", "b": true}], [{"t": "although", "b": false}, {"t": "embora (+ subjunctive)", "b": false}, {"t": "concession connector", "b": true}]]}], "tip": false}, {"title": "Vocabulary: airport and customs", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese"], "rows": [[{"t": "boarding pass", "b": false}, {"t": "cartão de embarque", "b": true}], [{"t": "carry-on luggage", "b": false}, {"t": "bagagem de mão", "b": true}], [{"t": "baggage claim", "b": false}, {"t": "recolha de bagagem", "b": true}], [{"t": "delayed flight", "b": false}, {"t": "voo atrasado", "b": true}], [{"t": "customs", "b": false}, {"t": "alfândega", "b": true}], [{"t": "passport", "b": false}, {"t": "passaporte", "b": true}], [{"t": "nothing to declare", "b": false}, {"t": "nada a declarar", "b": true}], [{"t": "boarding gate", "b": false}, {"t": "porta de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabulary: hotel, health and emergencies", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese"], "rows": [[{"t": "There's no hot water", "b": false}, {"t": "Não há água quente", "b": true}], [{"t": "The room isn't ready", "b": false}, {"t": "O quarto não está pronto", "b": true}], [{"t": "I'd like to change rooms", "b": false}, {"t": "Queria mudar de quarto", "b": true}], [{"t": "pharmacy", "b": false}, {"t": "farmácia", "b": true}], [{"t": "I need a doctor", "b": false}, {"t": "Preciso de um médico", "b": true}], [{"t": "It hurts here", "b": false}, {"t": "Dói-me aqui", "b": true}], [{"t": "Call an ambulance!", "b": false}, {"t": "Chame uma ambulância!", "b": true}], [{"t": "hospital", "b": false}, {"t": "hospital", "b": true}], [{"t": "health insurance", "b": false}, {"t": "seguro de saúde", "b": true}]]}], "tip": false}, {"title": "Vocabulary: bank, police and official matters", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese"], "rows": [[{"t": "current account", "b": false}, {"t": "conta à ordem", "b": true}], [{"t": "ATM", "b": false}, {"t": "multibanco", "b": true}], [{"t": "exchange rate", "b": false}, {"t": "taxa de câmbio", "b": true}], [{"t": "I've lost my wallet", "b": false}, {"t": "Perdi a carteira", "b": true}], [{"t": "police report", "b": false}, {"t": "apresentação de queixa", "b": true}], [{"t": "police station", "b": false}, {"t": "esquadra da polícia", "b": true}], [{"t": "town hall", "b": false}, {"t": "câmara municipal", "b": true}], [{"t": "residence permit", "b": false}, {"t": "autorização de residência", "b": true}]]}], "tip": false}, {"title": "Vocabulary: transport and directions", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese"], "rows": [[{"t": "one-way ticket", "b": false}, {"t": "bilhete simples", "b": true}], [{"t": "round trip", "b": false}, {"t": "ida e volta", "b": true}], [{"t": "car rental", "b": false}, {"t": "aluguer de carro", "b": true}], [{"t": "Turn right", "b": false}, {"t": "Vire à direita", "b": true}], [{"t": "Go straight ahead", "b": false}, {"t": "Siga em frente", "b": true}], [{"t": "traffic light", "b": false}, {"t": "semáforo", "b": true}], [{"t": "roundabout", "b": false}, {"t": "rotunda", "b": true}], [{"t": "platform", "b": false}, {"t": "cais / plataforma", "b": true}], [{"t": "bus stop", "b": false}, {"t": "paragem de autocarro", "b": true}]]}], "tip": false}, {"title": "Vocabulary: shopping and work", "blocks": [{"type": "table", "headers": ["Meaning", "Portuguese"], "rows": [[{"t": "Can you give me a discount?", "b": false}, {"t": "Pode fazer-me um desconto?", "b": true}], [{"t": "size (clothing)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "fitting room", "b": false}, {"t": "cabine de provas", "b": true}], [{"t": "meeting", "b": false}, {"t": "reunião", "b": true}], [{"t": "deadline", "b": false}, {"t": "prazo", "b": true}], [{"t": "job application", "b": false}, {"t": "candidatura", "b": true}], [{"t": "job interview", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "salary", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Etiquette: tu or você?", "blocks": [{"type": "p", "html": "In Portugal, tu is widespread even in fairly informal contexts among young people, but você and, above all, polite forms with a name or title («o senhor», «a senhora», «a doutora») remain the norm in professional settings or with older or unfamiliar people.", "italic": false}, {"type": "list", "label": "Practical rules", "intro": null, "items": ["With strangers, superiors, older people: use the third person with «o senhor / a senhora» rather than «você», which can feel a bit blunt in Portugal.", "With friends, family, close colleagues: tu.", "Formal emails open with «Exmo(a). Senhor(a)» and close with «Com os melhores cumprimentos»."]}], "tip": false}, {"title": "Advanced idiomatic expressions", "blocks": [{"type": "table", "headers": ["Meaning", "Expression"], "rows": [[{"t": "To cost an arm and a leg", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "To be daydreaming/distracted", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "To pretend nothing happened", "b": false}, {"t": "Fazer de conta que nada se passou", "b": true}], [{"t": "To be broke", "b": false}, {"t": "Estar teso / sem uma coroa", "b": true}], [{"t": "To get into trouble", "b": false}, {"t": "Meter-se em sarilhos", "b": true}], [{"t": "To break the ice", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Advanced practice dialogues", "blocks": [{"type": "p", "html": "Scenario: solving a hotel problem.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Bom dia, há um problema com o meu quarto, o ar condicionado não funciona.", "trans": "Good morning, there's a problem with my room, the air conditioning isn't working."}, {"speaker": "Receptionist:", "orig": "Lamento imenso, vou já enviar alguém. Prefere mudar de quarto entretanto?", "trans": "I'm very sorry, I'll send someone right away. Would you prefer to change rooms in the meantime?"}, {"speaker": "Guest:", "orig": "Sim, seria mais simples, obrigado.", "trans": "Yes, that would be simpler, thank you."}]}, {"type": "p", "html": "Scenario: at the doctor's.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "O que se passa?", "trans": "What's wrong?"}, {"speaker": "Patient:", "orig": "Tenho dores de garganta há três dias e um pouco de febre.", "trans": "I've had a sore throat for three days and a bit of a fever."}, {"speaker": "Doctor:", "orig": "Vou receitar-lhe uns medicamentos. Descanse bem.", "trans": "I'll prescribe you some medicine. Rest well."}]}], "tip": false}, {"title": "Conclusion and next steps toward fluency", "blocks": [{"type": "list", "label": "How to keep improving", "intro": null, "items": ["Watch Portuguese shows and films with Portuguese subtitles, to train your ear to the European rhythm.", "Read a short article from an online Portuguese newspaper every day (Público, Expresso).", "Find a language exchange partner for conversation practice (tandem).", "Write a short daily diary of a few sentences in Portuguese.", "Don't fear mistakes: true fluency comes from consistent practice."]}], "tip": true}], "closingBasic": "Good luck in advance on your Portuguese journey — Boa sorte!", "closingAdvanced": "Congratulations on how far you've come — Boa sorte!"}};

<script>
(function(){
  var DATA = window.GUIDE_DATA;       // { ar: {chapters:[...], closingBasic, closingAdvanced}, en: {...}, ... }
  var STR = window.GUIDE_STRINGS;     // per-language UI strings for this guide
  var META = window.GUIDE_META;       // { waNumberByLang, ptFallback }

  function waLink(lang){
    var num = META.waNumberByLang[lang] || META.waNumberByLang.en;
    var msg = STR.waMsg[lang] || STR.waMsg.en;
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }

  function renderTableBlock(b){
    var html = '<table><thead><tr>' + b.headers.map(function(h){ return '<th>'+h+'</th>'; }).join('') + '</tr></thead><tbody>';
    b.rows.forEach(function(row){
      html += '<tr>' + row.map(function(c){ return '<td'+(c.b?' class="phrase-it"':'')+'>'+c.t+'</td>'; }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function renderListBlock(b, isTip, tipLabelFallback){
    var boxClass = isTip ? 'tip-box' : 'goal-box';
    var html = '<div class="'+boxClass+'">';
    if (isTip) {
      html += '<span class="tip-label">' + (b.label || tipLabelFallback || '') + '</span>';
    } else if (b.label) {
      html += '<strong>' + b.label + '</strong>';
    }
    if (b.intro) html += '<p style="margin-top:8px;">' + b.intro + '</p>';
    if (b.items && b.items.length) {
      html += '<ul>' + b.items.map(function(it){ return '<li>' + it + '</li>'; }).join('') + '</ul>';
    }
    html += '</div>';
    return html;
  }

  function renderDialogueBlock(b){
    var html = '<div class="dialogue">';
    b.lines.forEach(function(line){
      html += '<div class="line">';
      if (line.speaker) html += '<span class="speaker">' + line.speaker + '</span> ';
      html += '<span class="orig">' + line.orig + '</span><br><span class="trans">' + (line.trans || '') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderBlock(b, isTip, tipLabelFallback){
    switch(b.type){
      case 'p': return '<p' + (b.italic ? ' style="font-style:italic;"' : '') + '>' + b.html + '</p>';
      case 'h3': return '<h3>' + b.text + '</h3>';
      case 'table': return renderTableBlock(b);
      case 'list': return renderListBlock(b, isTip, tipLabelFallback);
      case 'dialogue': return renderDialogueBlock(b);
      default: return '';
    }
  }

  function render(lang){
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    var doc = DATA[lang] || DATA.en || DATA.ar || DATA[Object.keys(DATA)[0]];
    var s = STR;

    document.getElementById('brand-text').textContent = s.brand[lang] || s.brand.en;
    document.getElementById('back-link').textContent = s.backLink[lang] || s.backLink.en;
    document.getElementById('nav-cta').innerHTML = '💬 ' + (s.navCta[lang] || s.navCta.en);
    document.getElementById('nav-cta').href = waLink(lang);
    document.getElementById('hero-title').textContent = s.mainTitle[lang] || s.mainTitle.en;
    document.getElementById('hero-subtitle').textContent = s.mainSubtitle[lang] || s.mainSubtitle.en;
    document.getElementById('byline-name').textContent = s.bylineName[lang] || s.bylineName.en;
    document.getElementById('byline-meta').textContent = s.bylineMeta[lang] || s.bylineMeta.en;
    document.getElementById('toc-heading').textContent = s.tocHeading[lang] || s.tocHeading.en;
    document.getElementById('cta-h3').textContent = s.ctaH3[lang] || s.ctaH3.en;
    document.getElementById('cta-p').textContent = s.ctaP[lang] || s.ctaP.en;
    document.getElementById('cta-btn-text').textContent = s.navCta[lang] || s.navCta.en;
    document.getElementById('cta-btn-bottom').href = waLink(lang);
    document.getElementById('floating-wa').href = waLink(lang);
    document.getElementById('footer-copyright').textContent = s.footerCopyright[lang] || s.footerCopyright.en;
    document.getElementById('footer-back').textContent = s.footerBack[lang] || s.footerBack.en;

    var chapters = doc.chapters;
    var tocHtml = '';
    var chaptersHtml = '';
    chapters.forEach(function(ch, i){
      var num = i + 1;
      if (ch.dividerBefore) {
        tocHtml += '<span class="toc-part">' + (s.partTag[lang]||s.partTag.en) + ' — ' + (s.partTitle[lang]||s.partTitle.en) + '</span>';
      }
      tocHtml += '<a href="#c' + num + '">' + num + '. ' + ch.title + '</a>';

      if (ch.dividerBefore) {
        chaptersHtml += '<div class="part-divider"><span class="tag">' + (s.partTag[lang]||s.partTag.en) + '</span><h2>' + (s.partTitle[lang]||s.partTitle.en) + '</h2></div>';
      }
      chaptersHtml += '<div class="chapter" id="c' + num + '"><h2>' + num + '. ' + ch.title + '</h2>';
      ch.blocks.forEach(function(b){
        chaptersHtml += renderBlock(b, ch.tip, null);
      });
      if (i === chapters.length - 1 && doc.closingAdvanced) {
        chaptersHtml += '<p style="text-align:center;font-weight:800;color:var(--brand-blue-dark);margin-top:20px;">' + doc.closingAdvanced + '</p>';
      }
      chaptersHtml += '</div>';
    });
    document.getElementById('toc-grid').innerHTML = tocHtml;
    document.getElementById('chapters-container').innerHTML = chaptersHtml;
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ render(btn.getAttribute('data-lang')); });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(DATA[savedLang] ? savedLang : 'ar');
})();
</script>

</body>
</html>
