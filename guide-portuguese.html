"type": "h3", "text": "<strong>٥) سؤال عن الاتجاهات</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Turista:", "orig": "Desculpe, como chego ao Castelo de São Jorge?", "trans": "معلش، أروح إزاي لقلعة سان جورجي؟"}, {"speaker": "Local:", "orig": "Siga em frente e depois vire à direita na segunda rua.", "trans": "كمّل دُغري وبعدين لف يمين في تاني شارع."}, {"speaker": "Turista:", "orig": "É muito longe daqui?", "trans": "ده بعيد أوي من هنا؟"}, {"speaker": "Local:", "orig": "Não, fica a cerca de dez minutos a pé.", "trans": "لأ، حوالي ١٠ دقايق مشي."}]}], "tip": false}, {"title": "نص قرائي للتدريب", "blocks": [{"type": "p", "html": "اقرأ النص ده كذا مرة بصوت عالٍ، وحاول تفهمه من غير ما تترجم كل كلمة:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>مفردات مهمة من النص</strong>"}, {"type": "table", "headers": ["المعنى", "الكلمة"], "rows": [[{"t": "يمسك/ياخد (مواصلات)", "b": false}, {"t": "apanhar", "b": false}], [{"t": "حي البايشا في لشبونة", "b": false}, {"t": "Baixa", "b": false}], [{"t": "فادو (نوع موسيقى برتغالي تقليدي)", "b": false}, {"t": "fado", "b": false}], [{"t": "ما يُنسى", "b": false}, {"t": "inesquecível", "b": false}]]}, {"type": "h3", "text": "<strong>أسئلة للفهم</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["الأسرة راحت لشبونة إمتى؟", "عملوا إيه بعد الـcheck-in؟", "سمعوا فادو فين؟"]}, {"type": "p", "html": "<em>الإجابات: ١) بالأمس ٢) راحوا الـBaixa يتغدّوا ٣) جنب نهر التاجو بالليل</em>", "italic": true}], "tip": false}, {"title": "خاتمة وخطوات نحو الطلاقة الكاملة", "blocks": [{"type": "list", "label": "<strong>للوصول للطلاقة الكاملة</strong>", "intro": null, "items": ["اقرأ جرايد أو مقالات برتغالية بسيطة يوميًا وحاول تفهم من السياق قبل ما تترجم.", "اتكلم مع متحدثين أصليين (أونلاين أو لو سافرت) — التطبيق العملي أهم حاجة دلوقتي.", "اكتب يوميات قصيرة بالبرتغالي كل يوم — حتى ٣-٤ جمل بتفرق كتير على المدى الطويل.", "راجع الأزمنة دي كل شوية لحد ما تبقى تلقائية من غير ما تفكر فيها.", "متخافش من الغلط في المحادثة — البرتغاليين بيتقدّروا جدًا أي حد بيحاول يتكلم لغتهم."]}], "tip": true}], "closingBasic": "مبروك مقدمًا على رحلتك مع اللغة البرتغالية — Boa sorte! (حظ سعيد!)", "closingAdvanced": "رحلتك مع البرتغالية بقت جاهزة للمستوى اللي تقدر تعتمد عليه فعلاً — Força e boa sorte! (قوة وحظ سعيد!)"}, "en": {"chapters": [{"title": "Introduction: why learn Portuguese?", "blocks": [{"type": "p", "html": "Portuguese is spoken by over 250 million people worldwide, the official language of Portugal, Brazil, Angola, Mozambique and several other countries. This book gives you a solid foundation in European Portuguese, the variety spoken in Portugal, whose pronunciation is quite different from the Brazilian one.", "italic": false}, {"type": "p", "html": "The good news: Portuguese is a Romance language, and much of its vocabulary will feel familiar if you already know some French or Spanish. The main difficulty is pronunciation — vowels are often reduced or swallowed, there are nasal sounds, and the distinctive «ão», none of which have a direct English equivalent.", "italic": false}, {"type": "list", "label": "Goals of this book", "intro": null, "items": ["Give you a solid base of essential vocabulary and grammar in the shortest time possible.", "Focus on correct pronunciation so your accent sounds authentically Portuguese.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The alphabet and pronunciation basics", "blocks": [{"type": "p", "html": "Portuguese uses the Latin alphabet, but many unstressed vowels shrink or nearly disappear in speech, especially in Portugal. This table shows the most distinctive sounds:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Word"], "rows": [[{"t": "house", "b": false}, {"t": "KAH-zuh", "b": false}, {"t": "casa", "b": true}], [{"t": "good morning", "b": false}, {"t": "bohm DEE-uh", "b": false}, {"t": "bom dia", "b": true}], [{"t": "thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "obrigado (said by a man, obrigada by a woman)", "b": true}], [{"t": "cat", "b": false}, {"t": "GAH-too", "b": false}, {"t": "gato", "b": true}], [{"t": "I", "b": false}, {"t": "EH-oo", "b": false}, {"t": "eu", "b": true}], [{"t": "boy", "b": false}, {"t": "rah-PAHZ", "b": false}, {"t": "rapaz", "b": true}], [{"t": "bread", "b": false}, {"t": "POWNG (nasal)", "b": false}, {"t": "pão (ão = a unique nasal vowel, between «ow» and «own»)", "b": true}], [{"t": "water", "b": false}, {"t": "AH-gwuh", "b": false}, {"t": "água", "b": true}], [{"t": "egg", "b": false}, {"t": "OH-voo", "b": false}, {"t": "ovo", "b": true}], [{"t": "wine", "b": false}, {"t": "VEE-nyoo (nasal)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "The golden rules for authentic pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference to sounding truly Portuguese:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["European Portuguese swallows many of its unstressed vowels, which makes it sound more compressed and \"hushed\" than Brazilian Portuguese.", "The «ão» sound is a unique nasal vowel — practise it as an \"ow\" followed by a soft nasal \"n\", all through the nose.", "The letter s at the end of a word, or before a consonant, is often pronounced «sh» in Portugal (dois → \"doysh\").", "The ç and c before e/i are pronounced «s»: França.", "The group lh is pronounced like the \"lli\" in \"million\" (velho, filho).", "The group nh is pronounced like the \"ny\" in \"canyon\" (senhor, vinho)."]}], "tip": false}, {"title": "Greetings and essential phrases", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese"], "rows": [[{"t": "Good morning", "b": false}, {"t": "bohm DEE-uh", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Good afternoon", "b": false}, {"t": "BOH-uh TAR-duh", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Hi (casual)", "b": false}, {"t": "oh-LAH", "b": false}, {"t": "Olá", "b": true}], [{"t": "How are you?", "b": false}, {"t": "KOH-moo ish-TASH", "b": false}, {"t": "Como estás?", "b": true}], [{"t": "Fine, thanks", "b": false}, {"t": "beng, oh-bree-GAH-doo", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Nice to meet you", "b": false}, {"t": "prah-ZEHR", "b": false}, {"t": "Prazer", "b": true}], [{"t": "See you soon", "b": false}, {"t": "ah-TEH BREH-vuh", "b": false}, {"t": "Até breve", "b": true}], [{"t": "See you tomorrow", "b": false}, {"t": "ah-TEH ah-mahn-YAH", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Goodbye", "b": false}, {"t": "ah-DEH-oosh", "b": false}, {"t": "Adeus", "b": true}], [{"t": "Please", "b": false}, {"t": "por fah-VOR", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Thank you", "b": false}, {"t": "oh-bree-GAH-doo/duh", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "You're welcome", "b": false}, {"t": "duh NAH-duh", "b": false}, {"t": "De nada", "b": true}], [{"t": "Excuse me/sorry", "b": false}, {"t": "dish-KOOL-puh", "b": false}, {"t": "Desculpe", "b": true}], [{"t": "Yes", "b": false}, {"t": "seeng", "b": false}, {"t": "Sim", "b": true}], [{"t": "No", "b": false}, {"t": "nowng", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "Pronouns and the verbs «ser» and «estar» (to be)", "blocks": [{"type": "p", "html": "Unlike English, Portuguese has two verbs for \"to be\": «ser» for identity and permanent traits, and «estar» for temporary states and location.", "italic": false}, {"type": "h3", "text": "Pronouns"}, {"type": "table", "headers": ["English", "Portuguese"], "rows": [[{"t": "I", "b": false}, {"t": "eu", "b": true}], [{"t": "you", "b": false}, {"t": "tu", "b": true}], [{"t": "he/she", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "we", "b": false}, {"t": "nós", "b": true}], [{"t": "you (plural)", "b": false}, {"t": "vocês", "b": true}], [{"t": "they", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — to be (permanent)"}, {"type": "table", "headers": ["Pronoun", "Conjugation"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "tu", "b": false}, {"t": "és", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "é", "b": true}], [{"t": "nós", "b": false}, {"t": "somos", "b": true}], [{"t": "vocês", "b": false}, {"t": "são", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "são", "b": true}]]}, {"type": "p", "html": "Example: Eu sou inglês — I am English (identity, permanent). — Eu estou em Lisboa — I am (right now) in Lisbon (temporary, with estar).", "italic": false}], "tip": false}, {"title": "Common verbs and their conjugation", "blocks": [{"type": "p", "html": "Regular Portuguese verbs fall into three groups by their ending: -ar, -er, -ir.", "italic": false}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "tu", "b": false}, {"t": "falas", "b": false}, {"t": "comes", "b": false}, {"t": "partes", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "fala", "b": false}, {"t": "come", "b": false}, {"t": "parte", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}, {"type": "h3", "text": "Key irregular verbs (eu form)"}, {"type": "table", "headers": ["Meaning", "eu", "Verb"], "rows": [[{"t": "to have", "b": false}, {"t": "tenho", "b": false}, {"t": "ter", "b": true}], [{"t": "to go", "b": false}, {"t": "vou", "b": false}, {"t": "ir", "b": true}], [{"t": "to do/make", "b": false}, {"t": "faço", "b": false}, {"t": "fazer", "b": true}], [{"t": "to be able to", "b": false}, {"t": "posso", "b": false}, {"t": "poder", "b": true}], [{"t": "to want", "b": false}, {"t": "quero", "b": false}, {"t": "querer", "b": true}], [{"t": "to know", "b": false}, {"t": "sei", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "Numbers from 0 to 100", "blocks": [{"type": "table", "headers": ["No.", "Portuguese", "No.", "Portuguese"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": true}], [{"t": "1", "b": false}, {"t": "um", "b": false}, {"t": "12", "b": false}, {"t": "doze", "b": true}], [{"t": "2", "b": false}, {"t": "dois", "b": false}, {"t": "13", "b": false}, {"t": "treze", "b": true}], [{"t": "3", "b": false}, {"t": "três", "b": false}, {"t": "14", "b": false}, {"t": "catorze", "b": true}], [{"t": "4", "b": false}, {"t": "quatro", "b": false}, {"t": "15", "b": false}, {"t": "quinze", "b": true}], [{"t": "5", "b": false}, {"t": "cinco", "b": false}, {"t": "16", "b": false}, {"t": "dezasseis", "b": true}], [{"t": "6", "b": false}, {"t": "seis", "b": false}, {"t": "17", "b": false}, {"t": "dezassete", "b": true}], [{"t": "7", "b": false}, {"t": "sete", "b": false}, {"t": "18", "b": false}, {"t": "dezoito", "b": true}], [{"t": "8", "b": false}, {"t": "oito", "b": false}, {"t": "19", "b": false}, {"t": "dezanove", "b": true}], [{"t": "9", "b": false}, {"t": "nove", "b": false}, {"t": "20", "b": false}, {"t": "vinte", "b": true}], [{"t": "10", "b": false}, {"t": "dez", "b": false}, {"t": "30", "b": false}, {"t": "trinta", "b": true}]]}, {"type": "table", "headers": ["No.", "Portuguese", "No.", "Portuguese"], "rows": [[{"t": "40", "b": false}, {"t": "quarenta", "b": false}, {"t": "80", "b": false}, {"t": "oitenta", "b": true}], [{"t": "50", "b": false}, {"t": "cinquenta", "b": false}, {"t": "90", "b": false}, {"t": "noventa", "b": true}], [{"t": "60", "b": false}, {"t": "sessenta", "b": false}, {"t": "100", "b": false}, {"t": "cem", "b": true}], [{"t": "70", "b": false}, {"t": "setenta", "b": false}, {"t": "", "b": false}, {"t": "", "b": true}]]}, {"type": "p", "html": "Note the European spelling (dezasseis, dezassete, dezanove) — Brazilian Portuguese spells these differently (dezesseis, dezessete, dezenove).", "italic": true}], "tip": false}, {"title": "Days of the week and months", "blocks": [{"type": "table", "headers": ["Day", "Portuguese"], "rows": [[{"t": "Monday", "b": false}, {"t": "segunda-feira", "b": true}], [{"t": "Tuesday", "b": false}, {"t": "terça-feira", "b": true}], [{"t": "Wednesday", "b": false}, {"t": "quarta-feira", "b": true}], [{"t": "Thursday", "b": false}, {"t": "quinta-feira", "b": true}], [{"t": "Friday", "b": false}, {"t": "sexta-feira", "b": true}], [{"t": "Saturday", "b": false}, {"t": "sábado", "b": true}], [{"t": "Sunday", "b": false}, {"t": "domingo", "b": true}]]}, {"type": "h3", "text": "Months"}, {"type": "table", "headers": ["Month", "Portuguese", "Month", "Portuguese"], "rows": [[{"t": "January", "b": false}, {"t": "janeiro", "b": false}, {"t": "July", "b": false}, {"t": "julho", "b": true}], [{"t": "February", "b": false}, {"t": "fevereiro", "b": false}, {"t": "August", "b": false}, {"t": "agosto", "b": true}], [{"t": "March", "b": false}, {"t": "março", "b": false}, {"t": "September", "b": false}, {"t": "setembro", "b": true}], [{"t": "April", "b": false}, {"t": "abril", "b": false}, {"t": "October", "b": false}, {"t": "outubro", "b": true}], [{"t": "May", "b": false}, {"t": "maio", "b": false}, {"t": "November", "b": false}, {"t": "novembro", "b": true}], [{"t": "June", "b": false}, {"t": "junho", "b": false}, {"t": "December", "b": false}, {"t": "dezembro", "b": true}]]}, {"type": "p", "html": "Fun fact: unlike English, weekdays Monday to Friday are built from «-feira» plus a number (literally \"second fair\", \"third fair\"...), a system inherited from the church calendar.", "italic": true}], "tip": false}, {"title": "Colours", "blocks": [{"type": "table", "headers": ["Meaning", "Pronunciation", "Portuguese"], "rows": [[{"t": "red", "b": false}, {" ": "Can I see the menu?", "b": false}, {"t": "POH-soo vehr uh eh-MEHN-tuh", "b": false}, {"t": "Posso ver a ementa?", "b": true}], [{"t": "The bill, please", "b": false}, {"t": "uh KOHN-tuh por fah-VOR", "b": false}, {"t": "A conta, por favor", "b": true}], [{"t": "Where is the toilet?", "b": false}, {"t": "OHN-duh eh uh KAH-zuh duh BAHN-yoo", "b": false}, {"t": "Onde é a casa de banho?", "b": true}], [{"t": "I need help", "b": false}, {"t": "pruh-SEE-zoo duh uh-ZHOO-duh", "b": false}, {"t": "Preciso de ajuda", "b": true}], [{"t": "I don't understand", "b": false}, {"t": "nowng pehr-SEH-boo", "b": false}, {"t": "Não percebo", "b": true}], [{"t": "Can you repeat, please?", "b": false}, {"t": "POH-duh reh-puh-TEER", "b": false}, {"t": "Pode repetir, por favor?", "b": true}], [{"t": "Do you speak English?", "b": false}, {"t": "FAH-luh eeng-GLEHSH", "b": false}, {"t": "Fala inglês?", "b": true}], [{"t": "I'd like to book a room", "b": false}, {"t": "kuh-REE-uh reh-zehr-VAR oong KWAR-too", "b": false}, {"t": "Queria reservar um quarto", "b": true}], [{"t": "What time does the train leave?", "b": false}, {"t": "uh keh OH-rush sy oo kohm-BOY-oo", "b": false}, {"t": "A que horas sai o comboio?", "b": true}], [{"t": "Where can I get a taxi?", "b": false}, {"t": "OHN-duh POH-soo uh-pahn-YAR oong TAHK-see", "b": false}, {"t": "Onde posso apanhar um táxi?", "b": true}]]}], "tip": false}, {"title": "Authentic Portuguese expressions and slang", "blocks": [{"type": "p", "html": "These expressions are what separate someone who speaks «textbook» Portuguese from someone who sounds genuinely local. Use them in the right context:", "italic": false}, {"type": "table", "headers": ["Meaning", "Pronunciation", "Expression"], "rows": [[{"t": "Okay/sounds good", "b": false}, {"t": "FEE-kuh beng", "b": false}, {"t": "Fica bem", "b": true}], [{"t": "Cool!", "b": false}, {"t": "FEESH / ZHEE-roo", "b": false}, {"t": "Fixe! / Giro!", "b": true}], [{"t": "Right/okay (common filler)", "b": false}, {"t": "PROHN-too", "b": false}, {"t": "Pronto", "b": true}], [{"t": "Thing/stuff (generic word)", "b": false}, {"t": "KOY-zuh", "b": false}, {"t": "Coisa", "b": true}], [{"t": "Maybe/probably", "b": false}, {"t": "suh kul-YAR", "b": false}, {"t": "Se calhar", "b": true}], [{"t": "No big deal", "b": false}, {"t": "nowng fahz mal", "b": false}, {"t": "Não faz mal", "b": true}], [{"t": "Cool/nice (very common with young people)", "b": false}, {"t": "FEESH", "b": false}, {"t": "Fixe", "b": true}]]}], "tip": false}, {"title": "Full practice dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it aloud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "Bom dia! Bem-vindo. O que deseja?", "trans": "Good morning! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "Bom dia! Queria um café, por favor.", "trans": "Good morning! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "Mais alguma coisa?", "trans": "Anything else?"}, {"speaker": "Customer:", "orig": "Não, e a conta, por favor.", "trans": "No, and the bill, please."}, {"speaker": "Waiter:", "orig": "São dois euros. Obrigado!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "De nada, até breve!", "trans": "You're welcome, see you soon!"}]}], "tip": false}, {"title": "Action plan: how to learn fast", "blocks": [{"type": "list", "label": "7 steps to lock in the language quickly", "intro": null, "items": ["Listen to Portuguese music (fado, RTP) and shows every day, even just 10 minutes.", "Practise «shadowing»: listen to a short sentence and repeat it immediately at the same rhythm.", "Train your ear for the swallowed vowels of European Portuguese — watch videos with Portuguese subtitles to get used to it.", "Don't translate in your head — try to think directly in Portuguese.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary.", "Speak from day one, even if you make mistakes — fluency comes from practice.", "Get comfortable distinguishing ser and estar from the start — it's the foundation of every correct sentence."]}], "tip": true}, {"title": "Introduction: who is this book for?", "blocks": [{"type": "p", "html": "This book is the second part after «Learn Portuguese — European Portuguese, Easy, Fun and Fast», which covered the basics. If you've already finished the basic level and want to reach a level where you can genuinely get by while travelling, working, and living day to day in Portugal, this book will give you: the verb tenses you need, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "Before you start", "intro": null, "items": ["You should already know: greetings, pronouns, ser/estar, present-tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take each chapter slowly, and practise the examples out loud before moving on to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick review of the basic level", "blocks": [{"type": "table", "headers": ["eu", "tu", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you (pl)/they", "b": true}]]}, {"type": "h3", "text": "Present tense — the regular patterns"}, {"type": "table", "headers": ["Pronoun", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "The past: Pretérito Perfeito and Imperfeito", "blocks": [{"type": "p", "html": "Portuguese distinguishes a completed, one-off action (Pretérito Perfeito, roughly the English simple past) from a habitual or descriptive past (Imperfeito, roughly \"used to\" / \"was -ing\"). Unlike English, the Pretérito Perfeito is a simple tense, with no auxiliary verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "tu", "b": false}, {"t": "falaste", "b": false}, {"t": "foste", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falámos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "The Imperfeito"}, {"type": "table", "headers": ["Pronoun", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "tu", "b": false}, {"t": "falavas", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Example: Quando era pequeno, morava em Londres (Imperfeito: description) — Ontem fui ao mercado (Pretérito Perfeito: one-off event).", "italic": false}], "tip": false}, {"title": "Future and conditional", "blocks": [{"type": "table", "headers": ["Use", "Formation", "Example"], "rows": [[{"t": "Near future (intention)", "b": false}, {"t": "ir (present) + infinitive", "b": false}, {"t": "Vou partir amanhã — I'm going to leave tomorrow", "b": true}], [{"t": "Simple future (prediction)", "b": false}, {"t": "infinitive + endings -ei, -ás, -á, -emos, -ão", "b": false}, {"t": "Partirei no próximo ano — I will leave next year", "b": true}], [{"t": "Conditional (hypothesis, politeness)", "b": false}, {"t": "infinitive + endings -ia, -ias, -ia, -íamos, -iam", "b": false}, {"t": "Queria um café — I would like a coffee", "b": true}]]}], "tip": false}, {"title": "Reflexive verbs and object pronouns", "blocks": [{"type": "table", "headers": ["Subject pronoun", "Reflexive pronoun", "lavar-se (to wash oneself)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "lavo-me", "b": true}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "lavas-te", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "se", "b": false}, {"t": "lava-se", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "lavamo-nos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "lavam-se", "b": true}]]}, {"type": "p", "html": "A key feature of European Portuguese: the object pronoun often attaches after the verb with a hyphen (Chamo-me Marta — My name is Marta), unlike English word order, where it always precedes.", "italic": false}], "tip": false}, {"title": "Preposition + article contractions", "blocks": [{"type": "p", "html": "Portuguese prepositions obligatorily contract with definite articles:", "italic": false}, {"type": "table", "headers": ["Preposition", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Example: Vou ao mercado (a + o = ao), A cor das flores (de + as = das).", "italic": false}], "tip": false}, {"title": "Comparatives, superlatives and advanced connectors", "blocks": [{"type": "table", "headers": ["Structure", "Portuguese", "Meaning"], "rows": [[{"t": "more... than", "b": false}, {"t": "mais... do que", "b": false}, {"t": "É mais alto do que eu", "b": true}], [ scount?", "b": false}, {"t": "Pode fazer-me um desconto?", "b": true}], [{"t": "size (clothing)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "fitting room", "b": false}, {"t": "cabine de provas", "b": true}], [{"t": "meeting", "b": false}, {"t": "reunião", "b": true}], [{"t": "deadline", "b": false}, {"t": "prazo", "b": true}], [{"t": "job application", "b": false}, {"t": "candidatura", "b": true}], [{"t": "job interview", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "salary", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Etiquette: tu or você?", "blocks": [{"type": "p", "html": "In Portugal, tu is widespread even in fairly informal contexts among young people, but você and, above all, polite forms with a name or title («o senhor», «a senhora», «a doutora») remain the norm in professional settings or with older or unfamiliar people.", "italic": false}, {"type": "list", "label": "Practical rules", "intro": null, "items": ["With strangers, superiors, older people: use the third person with «o senhor / a senhora» rather than «você», which can feel a bit blunt in Portugal.", "With friends, family, close colleagues: tu.", "Formal emails open with «Exmo(a). Senhor(a)» and close with «Com os melhores cumprimentos»."]}], "tip": false}, {"title": "Advanced idiomatic expressions", "blocks": [{"type": "table", "headers": ["Meaning", "Expression"], "rows": [[{"t": "To cost an arm and a leg", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "To be daydreaming/distracted", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "To pretend nothing happened", "b": false}, {"t": "Fazer de conta que nada se passou", "b": true}], [{"t": "To be broke", "b": false}, {"t": "Estar teso / sem uma coroa", "b": true}], [{"t": "To get into trouble", "b": false}, {"t": "Meter-se em sarilhos", "b": true}], [{"t": "To break the ice", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Advanced practice dialogues", "blocks": [{"type": "p", "html": "Scenario: solving a hotel problem.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Bom dia, há um problema com o meu quarto, o ar condicionado não funciona.", "trans": "Good morning, there's a problem with my room, the air conditioning isn't working."}, {"speaker": "Receptionist:", "orig": "Lamento imenso, vou já enviar alguém. Prefere mudar de quarto entretanto?", "trans": "I'm very sorry, I'll send someone right away. Would you prefer to change rooms in the meantime?"}, {"speaker": "Guest:", "orig": "Sim, seria mais simples, obrigado.", "trans": "Yes, that would be simpler, thank you."}]}, {"type": "p", "html": "Scenario: at the doctor's.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "O que se passa?", "trans": "What's wrong?"}, {"speaker": "Patient:", "orig": "Tenho dores de garganta há três dias e um pouco de febre.", "trans": "I've had a sore throat for three days and a bit of a fever."}, {"speaker": "Doctor:", "orig": "Vou receitar-lhe uns medicamentos. Descanse bem.", "trans": "I'll prescribe you some medicine. Rest well."}]}], "tip": false}, {"title": "Conclusion and next steps toward fluency", "blocks": [{"type": "list", "label": "How to keep improving", "intro": null, "items": ["Watch Portuguese shows and films with Portuguese subtitles, to train your ear to the European rhythm.", "Read a short article from an online Portuguese newspaper every day (Público, Expresso).", "Find a language exchange partner for conversation practice (tandem).", "Write a short daily diary of a few sentences in Portuguese.", "Don't fear mistakes: true fluency comes from consistent practice."]}], "tip": true}], "closingBasic": "Good luck in advance on your Portuguese journey — Boa sorte!", "closingAdvanced": "Congratulations on how far you've come — Boa sorte!"}, "it": {"chapters": [{"title": "Introduzione: perché imparare il portoghese?", "blocks": [{"type": "p", "html": "Il portoghese è parlato da oltre 250 milioni di persone nel mondo, lingua ufficiale del Portogallo, del Brasile, dell'Angola, del Mozambico e di molti altri paesi. Questo libro ti dà una base solida nel portoghese europeo, quello parlato in Portogallo, la cui pronuncia è nettamente diversa da quella brasiliana.", "italic": false}, {"type": "p", "html": "La buona notizia: il portoghese è una lingua latina molto vicina all'italiano nel vocabolario. La difficoltà principale è la pronuncia — vocali spesso «inghiottite» o ridotte, suoni nasali, e la caratteristica «ão», che non hanno un vero equivalente in italiano.", "italic": false}, {"type": "list", "label": "Obiettivi di questo libro", "intro": null, "items": ["Darti una base solida di vocabolario e grammatica essenziale nel minor tempo possibile.", "Concentrarci sulla pronuncia corretta perché il tuo accento suoni autenticamente portoghese.", "Darti frasi pratiche da usare fin dal primo giorno in situazioni reali."]}], "tip": false}, {"title": "L'alfabeto e le basi della pronuncia", "blocks": [{"type": "p", "html": "Il portoghese usa l'alfabeto latino, ma molte vocali non accentate si riducono o quasi scompaiono nel parlato, soprattutto in Portogallo. Questa tabella presenta i suoni più distintivi:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Parola"], "rows": [[{"t": "casa", "b": false}, {"t": "kaza", "b": false}, {"t": "casa", "b": true}], [{"t": "buongiorno", "b": false}, {"t": "bon dìa", "b": false}, {"t": "bom dia", "b": true}], [{"t": "grazie", "b": false}, {"t": "obrigadu", "b": false}, {"t": "obrigado (detto da un uomo, obrigada da una donna)", "b": true}], [{"t": "gatto", "b": false}, {"t": "gatu", "b": false}, {"t": "gato", "b": true}], [{"t": "io", "b": false}, {"t": "eu (si legge «éu»)", "b": false}, {"t": "eu", "b": true}], [{"t": "ragazzo", "b": false}, {"t": "rapàsh", "b": false}, {"t": "rapaz", "b": true}], [{"t": "pane", "b": false}, {"t": "pãu (nasale)", "b": false}, {"t": "pão (ão = vocale nasale unica, tra «au» e «aon»)", "b": true}], [{"t": "acqua", "b": false}, {"t": "àgua", "b": false}, {"t": "água", "b": true}], [{"t": "uovo", "b": false}, {"t": "òvu", "b": false}, {"t": "ovo", "b": true}], [{"t": "vino", "b": false}, {"t": "vìgnu (nasale)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "Le regole d'oro per una pronuncia autentica", "blocks": [{"type": "p", "html": "Queste 6 regole d'oro fanno la maggiore differenza per suonare davvero portoghese:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Il portoghese europeo «inghiotte» molte delle sue vocali non accentate, il che lo rende più compresso e «sussurrato» rispetto al portoghese brasiliano.", "Il suono «ão» è una vocale nasale tipica del portoghese — praticala come una «a» seguita da una leggera «o», il tutto pronunciato con il naso.", "La s a fine parola o prima di una consonante suona spesso «sh» in Portogallo (dois → «doish»).", "Il gruppo lh si pronuncia come il «gli» italiano (velho, filho) — un suono che già conosci!", "Il gruppo nh si pronuncia come il «gn» italiano di «montagna» (senhor, vinho) — anche questo ti sarà familiare.", "La r iniziale o doppia (rr) si pronuncia in modo gutturale, molto diversa dalla r italiana vibrante."]}], "tip": false}, {"title": "Saluti e frasi essenziali", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Portoghese"], "rows": [[{"t": "Buongiorno (mattina)", "b": false}, {"t": "bon dìa", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Buonasera/buon pomeriggio", "b": false}, {"t": "bòa tardi", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Ciao (informale)", "b": false}, {"t": "olà", "b": false}, {"t": "Olá", "b": true}], [{"t": "Come stai?", "b": false}, {"t": "kòmu eshtàsh", "b": false}, {"t": "Como estás?", "b": true}], [{"t": "Bene, grazie", "b": false}, {"t": "being, obrigadu", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Piacere", "b": false}, {"t": "prazér", "b": false}, {"t": "Prazer", "b": true}], [{"t": "A presto", "b": false}, {"t": "atè brève", "b": false}, {"t": "Até breve", "b": true}], [{"t": "A domani", "b": false}, {"t": "atè amagnian", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Arrivederci", "b": false}, {"t": "adéush", "b": false}, {"t": "Adeus", "b": true}], [{"t": "Per favore", "b": false}, {"t": "por favòr", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Grazie", "b": false}, {"t": "obrigadu/a", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "Prego", "b": false}, {"t": "de nada", "b": false}, {"t": "De nada", "b": true}], [{"t": "Scusa", "b": false}, {"t": "deshkùlpe", "b": false}, {"t": "Desculpe", "b": true}], [{"t": "Sì", "b": false}, {"t": "sing", "b": false}, {"t": "Sim", "b": true}], [{"t": "No", "b": false}, {"t": "nãu", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "I pronomi e i verbi «ser» ed «estar» (essere)", "blocks": [{"type": "p", "html": "Come l'italiano, il portoghese distingue «ser» (identità, caratteristica permanente) ed «estar» (stato temporaneo, posizione) — ma con un uso più sistematico di quanto pensi, molto simile al «essere/stare» che già usi.", "italic": false}, {"type": "h3", "text": "Pronomi"}, {"type": "table", "headers": ["Italiano", "Portoghese"], "rows": [[{"t": "io", "b": false}, {"t": "eu", "b": true}], [{"t": "tu", "b": false}, {"t": "tu", "b": true}], [{"t": "lui/lei", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "noi", "b": false}, {"t": "nós", "b": true}], [{"t": "voi", "b": false}, {"t": "vocês", "b": true}], [{"t": "loro", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — essere (permanente)"}, {"type": "table", "headers": ["Pronome", "Coniugazione"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "tu", "b": false}, {"t": "és", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "é", "b": true}], [{"t": "nós", "b": false}, {"t": "somos", "b": true}], [{"t": "vocês", "b": false}, {"t": "são", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "são", "b": true}]]}, {"type": "p", "html": "Esempio: Eu sou italiano — Sono italiano (identità, permanente). — Eu estou em Lisboa — Sono (ora) a Lisbona (temporaneo, con estar).", "italic": false}], "tip": false}, {"title": "Verbi comuni e la loro coniugazione", "blocks": [{"type": "p", "html": "I verbi regolari portoghesi si dividono in tre gruppi secondo la desinenza: -ar, -er, -ir.", "italic": false}, {"type": "table", "headers": ["Pronome", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "tu", "b": false}, {"t": "falas", "b": false}, {"t": "comes", "b": false}, {"t": "partes", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "fala", "b": false}, {"t": "come", "b": false}, {"t": "parte", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}, {"type": "h3", "text": "Verbi irregolari importanti (forma «eu»)"}, {"type": "table", "headers": ["Significato", "eu", "Verbo"], "rows": [[{"t": "avere", "b": false}, {"t": "tenho", "b": false}, {"t": "ter", "b": true}], [{"t": "andare", "b": false}, {"t": "vou", "b": false}, {"t": "ir", "b": true}], [{"t": "fare", "b": false}, {"t": "faço", "b": false}, {"t": "fazer", "b": true}], [{"t": "potere", "b": false}, {"t": "posso", "b": false}, {"t": "poder", "b": true}], [{"t": "volere", "b": false}, {"t": "quero", "b": false}, {"t": "querer", "b": true}], [{"t": "sapere", "b": false}, {"t": "sei", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "I numeri da 0 a 100", "blocks": [{"type": "table", "headers": ["Nº", "Portoghese", "Nº", "Portoghese"], "rows": [ toghese"], "rows": [[{"t": "lunedì", "b": false}, {"t": "segunda-feira", "b": true}], [{"t": "martedì", "b": false}, {"t": "terça-feira", "b": true}], [{"t": "mercoledì", "b": false}, {"t": "quarta-feira", "b": true}], [{"t": "giovedì", "b": false}, {"t": "quinta-feira", "b": true}], [{"t": "venerdì", "b": false}, {"t": "sexta-feira", "b": true}], [{"t": "sabato", "b": false}, {"t": "sábado", "b": true}], [{"t": "domenica", "b": false}, {"t": "domingo", "b": true}]]}, {"type": "h3", "text": "Mesi"}, {"type": "table", "headers": ["Mese", "Portoghese", "Mese", "Portoghese"], "rows": [[{"t": "gennaio", "b": false}, {"t": "janeiro", "b": false}, {"t": "luglio", "b": false}, {"t": "julho", "b": true}], [{"t": "febbraio", "b": false}, {"t": "fevereiro", "b": false}, {"t": "agosto", "b": false}, {"t": "agosto", "b": true}], [{"t": "marzo", "b": false}, {"t": "março", "b": false}, {"t": "settembre", "b": false}, {"t": "setembro", "b": true}], [{"t": "aprile", "b": false}, {"t": "abril", "b": false}, {"t": "ottobre", "b": false}, {"t": "outubro", "b": true}], [{"t": "maggio", "b": false}, {"t": "maio", "b": false}, {"t": "novembre", "b": false}, {"t": "novembro", "b": true}], [{"t": "giugno", "b": false}, {"t": "junho", "b": false}, {"t": "dicembre", "b": false}, {"t": "dezembro", "b": true}]]}, {"type": "p", "html": "Curiosità: a differenza dell'italiano, i giorni della settimana portoghesi (dal lunedì al venerdì) si costruiscono con «-feira» e un numero (letteralmente «seconda fiera», «terza fiera»...) — un sistema ereditato dal calendario ecclesiastico.", "italic": true}], "tip": false}, {"title": "I colori", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Portoghese"], "rows": [[{"t": "rosso", "b": false}, {"t": "vermélyu", "b": false}, {"t": "vermelho", "b": true}], [{"t": "blu", "b": false}, {"t": "azùl", "b": false}, {"t": "azul", "b": true}], [{"t": "verde", "b": false}, {"t": "vérde", "b": false}, {"t": "verde", "b": true}], [{"t": "giallo", "b : false}, {"title": "Dialogo pratico completo", "blocks": [{"type": "p", "html": "Un dialogo semplice in un caffè — leggilo ad alta voce più volte e prova a imitare la pronuncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "Bom dia! Bem-vindo. O que deseja?", "trans": "Buongiorno! Benvenuto. Cosa desidera?"}, {"speaker": "Cliente:", "orig": "Bom dia! Queria um café, por favor.", "trans": "Buongiorno! Vorrei un caffè, per favore."}, {"speaker": "Empregado:", "orig": "Mais alguma coisa?", "trans": "Altro?"}, {"speaker": "Cliente:", "orig": "Não, e a conta, por favor.", "trans": "No, e il conto, per favore."}, {"speaker": "Empregado:", "orig": "São dois euros. Obrigado!", "trans": "Sono due euro. Grazie!"}, {"speaker": "Cliente:", "orig": "De nada, até breve!", "trans": "Prego, a presto!"}]}], "tip": false}, {"title": "Piano d'azione: come imparare in fretta", "blocks": [{"type": "list", "label": "7 passi per progredire velocemente", "intro": null, "items": ["Ascolta musica portoghese (fado, RTP) e guarda serie ogni giorno, anche solo 10 minuti.", "Pratica lo «shadowing»: ascolta una frase breve e ripetila subito con lo stesso ritmo.", "Allena l'orecchio alle vocali «inghiottite» del portoghese europeo — guarda video con sottotitoli portoghesi per abituarti.", "Non tradurre nella tua testa — prova a pensare direttamente in portoghese.", "Usa un'app come Duolingo o Babbel insieme a questo libro per rinforzare il vocabolario.", "Parla fin dal primo giorno, anche se sbagli — la scioltezza viene dalla pratica.", "Distingui bene ser ed estar fin dall'inizio — è la base di ogni frase corretta."]}], "tip": true}, {"title": "Introduzione: per chi è questo libro?", "blocks": [{"type": "p", "html": "Questo libro è la seconda parte dopo «Imparare il Portoghese — Facile, Divertente e Veloce», che ha coperto le basi. Se hai già finito il livello base e vuoi raggiungere un livello che ti permetta davvero di cavartela in viaggio, al lavoro e nella vita quotidiana in Portogallo, questo libro ti darà: i tempi verbali di cui hai bisogno, vocabolario pratico, e dialoghi realistici.", "italic": false}, {"type": "list", "label": "Prima di iniziare", "intro": null, "items": ["Dovresti già conoscere: saluti, pronomi, ser/estar, la coniugazione del presente e i numeri — tutto questo è nel libro base.", "Il nostro obiettivo qui non è insegnarti tutto sulla lingua, ma darti abbastanza strumenti per cavartela da solo.", "Vai con calma in ogni capitolo, e pratica gli esempi ad alta voce."]}], "tip": false, "dividerBefore": true}, {"title": "Ripasso veloce del livello base", "blocks": [{"type": "table", "headers": ["eu", "tu", "ele/ela", "nós", "vocês/eles"], "rows": [[{"t": "io", "b": false}, {"t": "tu", "b": false}, {"t": "lui/lei", "b": false}, {"t": "noi", "b": false}, {"t": "voi/loro", "b": true}]]}, {"type": "h3", "text": "Presente — gli schemi regolari"}, {"type": "table", "headers": ["Pronome", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}], "tip": false}, {"title": "Il passato: Pretérito Perfeito e Imperfeito", "blocks": [{"type": "p", "html": "Il portoghese, come l'italiano, distingue un'azione puntuale e conclusa (Pretérito Perfeito, simile al passato prossimo/remoto) da un'azione abituale o descrittiva (Imperfeito, simile all'imperfetto). A differenza dell'italiano, il Pretérito Perfeito portoghese è un tempo semplice, senza ausiliare:", "italic": false}, {"type": "table", "headers": ["Pronome", "falar → Pretérito Perfeito", "ir → Pretérito Perfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falei", "b": false}, {"t": "fui", "b": true}], [{"t": "tu", "b": false}, {"t": "falaste", "b": false}, {"t": "foste", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falou", "b": false}, {"t": "foi", "b": true}], [{"t": "nós", "b": false}, {"t": "falámos", "b": false}, {"t": "fomos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falaram", "b": false}, {"t": "foram", "b": true}]]}, {"type": "h3", "text": "L'Imperfeito"}, {"type": "table", "headers": ["Pronome", "falar → imperfeito"], "rows": [[{"t": "eu", "b": false}, {"t": "falava", "b": true}], [{"t": "tu", "b": false}, {"t": "falavas", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "falava", "b": true}], [{"t": "nós", "b": false}, {"t": "falávamos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falavam", "b": true}]]}, {"type": "p", "html": "Esempio: Quando era pequeno, morava em Roma (Imperfeito: descrizione) — Ontem fui ao mercado (Pretérito Perfeito: fatto puntuale).", "italic": false}], "tip": false}, {"title": "Il futuro e il condizionale", "blocks": [{"type": "table", "headers": ["Uso", "Formazione", "Esempio"], "rows": [[{"t": "Futuro prossimo (intenzione)", "b": false}, {"t": "ir (presente) + infinito", "b": false}, {"t": "Vou partir amanhã — Sto per partire domani", "b": true}], [{"t": "Futuro semplice (previsione)", "b": false}, {"t": "infinito + terminazioni -ei, -ás, -á, -emos, -ão", "b": false}, {"t": "Partirei no próximo ano — Partirò l'anno prossimo", "b": true}], [{"t": "Condizionale (ipotesi, cortesia)", "b": false}, {"t": "infinito + terminazioni -ia, -ias, -ia, -íamos, -iam", "b": false}, {"t": "Queria um café — Vorrei un caffè", "b": true}]]}], "tip": false}, {"title": "Verbi pronominali e pronomi complemento", "blocks": [{"type": "table", "headers": ["Pronome soggetto", "Pronome riflessivo", "lavar-se (lavarsi)"], "rows": [[{"t": "eu", "b": false}, {"t": "me", "b": false}, {"t": "lavo-me", "b": true}], [{"t": "tu", "b": false}, {"t": "te", "b": false}, {"t": "lavas-te", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "se", "b": false}, {"t": "lava-se", "b": true}], [{"t": "nós", "b": false}, {"t": "nos", "b": false}, {"t": "lavamo-nos", "b": true}], [{"t": "vocês", "b": false}, {"t": "se", "b": false}, {"t": "lavam-se", "b": true}]]}, {"type": "p", "html": "Particolarità del portoghese europeo: il pronome complemento si posiziona spesso dopo il verbo, legato da un trattino (Chamo-me Marta — Mi chiamo Marta), a differenza dell'italiano dove normalmente precede il verbo coniugato.", "italic": false}], "tip": false}, {"title": "Le contrazioni delle preposizioni", "blocks": [{"type": "p", "html": "Come l'italiano, le preposizioni portoghesi si fondono obbligatoriamente con gli articoli determinativi:", "italic": false}, {"type": "table", "headers": ["Preposizione", "+ o", "+ a", "+ os/as"], "rows": [[{"t": "em", "b": false}, {"t": "no", "b": false}, {"t": "na", "b": false}, {"t": "nos / nas", "b": true}], [{"t": "de", "b": false}, {"t": "do", "b": false}, {"t": "da", "b": false}, {"t": "dos / das", "b": true}], [{"t": "a", "b": false}, {"t": "ao", "b": false}, {"t": "à", "b": false}, {"t": "aos / às", "b": true}]]}, {"type": "p", "html": "Esempio: Vou ao mercado (a + o = ao), A cor das flores (de + as = das) — esattamente come in italiano «al mercato», «delle rose».", "italic": false}], "tip": false}, {"title": "Comparativi, superlativi e connettori avanzati", "blocks": [{"type": "table", "headers": ["Struttura", "Portoghese", "Significato"], "rows": [[{"t": "più... di", "b": false}, {"t": "mais... do que", "b": false}, {"t": "É mais alto do que eu", "b": true}], [{"t": "meno... di", "b": false}, {"t": "menos... do que", "b": false}, {"t": "É menos caro do que antes", "b": true}], [{"t": "tanto quanto", "b": false}, {"t": "tão... como", "b": false}, {"t": "É tão rápida como ele", "b": true}], [{"t": "il più/la più", "b": false}, {"t": "o mais / a mais", "b": false}, {"t": "É o bairro mais bonito", "b": true}], [{"t": "tuttavia", "b": false}, {"t": "no entanto", "b": false}, {"t": "connettore di contrasto", "b": true}], [{"t": "quindi", "b": false}, {"t": "portanto", "b": false}, {"t": "connettore di conseguenza", "b": true}], [{"t": "sebbene", "b": false}, {"t": "embora (+ congiuntivo)", "b": false}, {"t": "connettore di concessione", "b": true}]]}], "tip": false}, {"title": "Vocabolario: aeroporto e dogana", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese"], "rows": [[{"t": "carta d'imbarco", "b": false}, {"t": "cartão de embarque", "b": true}], [{"t": "bagaglio a mano", "b": false}, {"t": "bagagem de mão", "b": true}], [{"t": "ritiro bagagli", "b": false}, {"t": "recolha de bagagem", "b": true}], [{"t": "volo in ritardo", "b": false}, {"t": "voo atrasado", "b": true}], [{"t": "dogana", "b": false}, {"t": "alfândega", "b": true}], [{"t": "passaporto", "b": false}, {"t": "passaporte", "b": true}], [{"t": "niente da dichiarare", "b": false}, {"t": "nada a declarar", "b": true}], [{"t": "porta d'imbarco", "b": false}, {"t": "porta de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabolario: albergo, salute ed emergenze", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese"], "rows": [[{"t": "Non c'è acqua calda", "b": false}, {"t": "Não há água quente", "b": true}], [{"t": "La camera non è pronta", "b": false}, {"t": "O quarto não está pronto", "b": true}], [{"t": "Vorrei cambiare camera", "b": false}, {"t": "Queria mudar de quarto", "b": true}], [{"t": "farmacia", "b": false}, {"t": "farmácia", "b": true}], [{"t": "Ho bisogno di un medico", "b": false}, {"t": "Preciso de um médico", "b": true}], [{"t": "Mi fa male qui", "b": false}, {"t": "Dói-me aqui", "b": true}], [{"t": "Chiamate un'ambulanza!", "b": false}, {"t": "Chame uma ambulância!", "b": true}], [{"t": "ospedale", "b": false}, {"t": "hospital", "b": true}], [{"t": "assicurazione sanitaria", "b": false}, {"t": "seguro de saúde", "b": true}]]}], "tip": false}, {"title": "Vocabolario: banca, polizia e uffici", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese"], "rows": [[{"t": "conto corrente", "b": false}, {"t": "conta à ordem", "b": true}], [{"t": "bancomat", "b": false}, {"t": "multibanco", "b": true}], [{"t": "tasso di cambio", "b": false}, {"t": "taxa de câmbio", "b": true}], [{"t": "Ho perso il mio portafoglio", "b": false}, {"t": "Perdi a carteira", "b": true}], [{"t": "denuncia", "b": false}, {"t": "apresentação de queixa", "b": true}], [{"t": "commissariato", "b": false}, {"t": "esquadra da polícia", "b": true}], [{"t": "comune/municipio", "b": false}, {"t": "câmara municipal", "b": true}], [{"t": "permesso di soggiorno", "b": false}, {"t": "autorização de residência", "b": true}]]}], "tip": false}, {"title": "Vocabolario: trasporti e indicazioni", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese"], "rows": [[{"t": "biglietto di sola andata", "b": false}, {"t": "bilhete simples", "b": true}], [{"t": "andata e ritorno", "b": false}, {"t": "ida e volta", "b": true}], [{"t": "noleggio auto", "b": false}, {"t": "aluguer de carro", "b": true}], [{"t": "Giri a destra", "b": false}, {"t": "Vire à direita", "b": true}], [{"t": "Vada dritto", "b": false}, {"t": "Siga em frente", "b": true}], [{"t": "semaforo", "b": false}, {"t": "semáforo", "b": true}], [{"t": "rotatoria", "b": false}, {"t": "rotunda", "b": true}], [{"t": "binario", "b": false}, {"t": "cais / plataforma", "b": true}], [{"t": "fermata dell'autobus", "b": false}, {"t": "paragem de autocarro", "b": true}]]}], "tip": false}, {"title": "Vocabolario: shopping e lavoro", "blocks": [{"type": "table", "headers": ["Significato", "Portoghese"], "rows": [[{"t": "Può farmi uno sconto?", "b": false}, {"t": "Pode fazer-me um desconto?", "b": true}], [{"t": "taglia (vestiti)", "b": false}, {"t": "tamanho", "b": true}], [{"t": "camerino", "b": false}, {"t": "cabine de provas", "b": true}], [{"t": "riunione", "b": false}, {"t": "reunião", "b": true}], [{"t": "scadenza", "b": false}, {"t": "prazo", "b": true}], [{"t": "candidatura di lavoro", "b": false}, {"t": "candidatura", "b": true}], [{"t": "colloquio", "b": false}, {"t": "entrevista de emprego", "b": true}], [{"t": "stipendio", "b": false}, {"t": "salário", "b": true}]]}], "tip": false}, {"title": "Galateo: tu o você?", "blocks": [{"type": "p", "html": "In Portogallo, «tu» è molto diffuso anche in contesti abbastanza informali tra giovani, ma «você» e soprattutto le forme di cortesia con il nome o il titolo («o senhor», «a senhora», «a doutora») restano la norma in contesto professionale o con persone anziane o sconosciute.", "italic": false}, {"type": "list", "label": "Regole pratiche", "intro": null, "items": ["Con sconosciuti, superiori, persone anziane: usa la terza persona con «o senhor / a senhora» piuttosto che «você», che può sembrare un po' brusco in Portogallo.", "Con amici, familiari, colleghi stretti: tu.", "Le email formali si aprono con «Exmo(a). Senhor(a)» e si chiudono con «Com os melhores cumprimentos»."]}], "tip": false}, {"title": "Espressioni idiomatiche avanzate", "blocks": [{"type": "table", "headers": ["Significato", "Espressione"], "rows": [[{"t": "Costare un occhio della testa", "b": false}, {"t": "Custar os olhos da cara", "b": true}], [{"t": "Avere la testa fra le nuvole", "b": false}, {"t": "Estar com a cabeça nas nuvens", "b": true}], [{"t": "Fare finta di niente", "b": false}, {"t": "Fazer de conta que nada se passou", "b": true}], [{"t": "Essere al verde", "b": false}, {"t": "Estar teso / sem uma coroa", "b": true}], [{"t": "Mettersi nei guai", "b": false}, {"t": "Meter-se em sarilhos", "b": true}], [{"t": "Rompere il ghiaccio", "b": false}, {"t": "Quebrar o gelo", "b": true}]]}], "tip": false}, {"title": "Dialoghi pratici avanzati", "blocks": [{"type": "p", "html": "Scenario: risolvere un problema in albergo.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Hóspede:", "orig": "Bom dia, há um problema com o meu quarto, o ar condicionado não funciona.", "trans": "Buongiorno, c'è un problema con la mia camera, l'aria condizionata non funziona."}, {"speaker": "Rececionista:", "orig": "Lamento imenso, vou já enviar alguém. Prefere mudar de quarto entretanto?", "trans": "Mi dispiace tantissimo, mando subito qualcuno. Preferisce cambiare camera nel frattempo?"}, {"speaker": "Hóspede:", "orig": "Sim, seria mais simples, obrigado.", "trans": "Sì, sarebbe più semplice, grazie."}]}, {"type": "p", "html": "Scenario: dal medico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "O que se passa?", "trans": "Cosa non va?"}, {"speaker": "Paciente:", "orig": "Tenho dores de garganta há três dias e um pouco de febre.", "trans": "Ho mal di gola da tre giorni e ho un po' di febbre."}, {"speaker": "Médico:", "orig": "Vou receitar-lhe uns medicamentos. Descanse bem.", "trans": "Le prescriverò dei medicinali. Riposi bene."}]}], "tip": false}, {"title": "Conclusione e prossimi passi verso la scioltezza", "blocks": [{"type": "list", "label": "Come continuare a progredire", "intro": null, "items": ["Guarda serie e film portoghesi con sottotitoli in portoghese per abituare l'orecchio al ritmo europeo.", "Leggi ogni giorno un breve articolo di un giornale portoghese online (Público, Expresso).", "Trova un partner linguistico per fare scambi di conversazione (tandem).", "Scrivi un diario giornaliero di poche frasi in portoghese.", "Non temere gli errori: la scioltezza vera nasce dalla pratica costante."]}], "tip": true}], "closingBasic": "Congratulazioni in anticipo per il tuo viaggio nel portoghese — Boa sorte! (buona fortuna!)", "closingAdvanced": "Congratulazioni per il percorso fatto finora — Boa sorte!"}, "fr": {"chapters": [{"title": "Introduction : pourquoi apprendre le portugais ?", "blocks": [{"type": "p", "html": "Le portugais est parlé par plus de 250 millions de personnes dans le monde, langue officielle du Portugal, du Brésil, de l'Angola, du Mozambique et de nombreux autres pays. Ce livre te donne une base solide en portugais européen, celui parlé au Portugal, dont la prononciation diffère nettement de la version brésilienne.", "italic": false}, {"type": "p", "html": "La bonne nouvelle : le portugais est une langue latine très proche du français dans son vocabulaire. La principale difficulté est la prononciation — des voyelles souvent « avalées » ou réduites, des sons nasaux, et le « ão » si caractéristique, qui n'ont pas vraiment d'équivalent en français.", "italic": false}, {"type": "list", "label": "Objectifs de ce livre", "intro": null, "items": ["Te donner une base solide de vocabulaire et de grammaire essentielle en un minimum de temps.", "Te concentrer sur une prononciation correcte pour que ton accent sonne authentiquement portugais.", "Te donner des phrases pratiques utilisables dès le premier jour dans des situations réelles."]}], "tip": false}, {"title": "L'alphabet et les bases de la prononciation", "blocks": [{"type": "p", "html": "Le portugais utilise l'alphabet latin, mais de nombreuses voyelles non accentuées se réduisent ou disparaissent presque à l'oral, surtout au Portugal. Ce tableau présente les sons les plus distinctifs :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Mot"], "rows": [[{"t": "maison", "b": false}, {"t": "ka-za", "b": false}, {"t": "casa", "b": true}], [{"t": "bonjour", "b": false}, {"t": "bon dii-a", "b": false}, {"t": "bom dia", "b": true}], [{"t": "merci", "b": false}, {"t": "obr-i-gad-ou", "b": false}, {"t": "obrigado (dit par un homme, obrigada par une femme)", "b": true}], [{"t": "chat", "b": false}, {"t": "gat-ou", "b": false}, {"t": "gato", "b": true}], [{"t": "je", "b": false}, {"t": "eu (« éou »)", "b": false}, {"t": "eu", "b": true}], [{"t": "garçon", "b": false}, {"t": "ra-pahz", "b": false}, {"t": "rapaz", "b": true}], [{"t": "pain", "b": false}, {"t": "pann (nasal)", "b": false}, {"t": "pão (ão = voyelle nasale unique, entre « an » et « aon »)", "b": true}], [{"t": "eau", "b": false}, {"t": "ag-ouah", "b": false}, {"t": "água", "b": true}], [{"t": "œuf", "b": false}, {"t": "ov-ou", "b": false}, {"t": "ovo", "b": true}], [{"t": "vin", "b": false}, {"t": "vinn-you (nasal)", "b": false}, {"t": "vinho", "b": true}]]}], "tip": false}, {"title": "Les règles d'or pour une prononciation authentique", "blocks": [{"type": "p", "html": "Ces 6 règles d'or feront toute la différence pour sonner vraiment portugais :", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Le portugais européen « avale » beaucoup ses voyelles non accentuées, ce qui le rend plus « chuinté » et compact que le portugais brésilien.", "Le son « ão » est une voyelle nasale propre au portugais — pratique-la comme un « an » suivi d'un léger « on », le tout par le nez.", "La lettre s en fin de mot ou avant une consonne se prononce souvent « ch » au Portugal (dois → « doich »).", "Le ç et le c devant e/i se prononcent « s » (comme en français) : França.", "Le lh se prononce comme le « ll » espagnol ou le « gli » italien (velho, filho).", "Le nh se prononce comme le gn français de « montagne » (senhor, vinho)."]}], "tip": false}, {"title": "Salutations et phrases essentielles", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Portugais"], "rows": [[{"t": "Bonjour (matin)", "b": false}, {"t": "bonn dii-a", "b": false}, {"t": "Bom dia", "b": true}], [{"t": "Bonsoir/bonne après-midi", "b": false}, {"t": "boa tard-ë", "b": false}, {"t": "Boa tarde", "b": true}], [{"t": "Salut (informel)", "b": false}, {"t": "olaa", "b": false}, {"t": "Olá", "b": true}], [{"t": "Comment ça va ?", "b": false}, {"t": "komou eshtash", "b": false}, {"t": "Como estás?", "b": true}], [{"t": "Bien, merci", "b": false}, {"t": "bemm, obrigad-ou", "b": false}, {"t": "Bem, obrigado", "b": true}], [{"t": "Enchanté", "b": false}, {"t": "prazer", "b": false}, {"t": "Prazer", "b": true}], [{"t": "À bientôt", "b": false}, {"t": "atté brévé", "b": false}, {"t": "Até breve", "b": true}], [{"t": "À demain", "b": false}, {"t": "atté a-mannyann", "b": false}, {"t": "Até amanhã", "b": true}], [{"t": "Au revoir", "b": false}, {"t": "adéouch", "b": false}, {"t": "Adeus", "b": true}], [{"t": "S'il te plaît", "b": false}, {"t": "sé faz favor / porr favor", "b": false}, {"t": "Se faz favor / Por favor", "b": true}], [{"t": "Merci", "b": false}, {"t": "obrigad-ou/a", "b": false}, {"t": "Obrigado / Obrigada", "b": true}], [{"t": "De rien", "b": false}, {"t": "dë nada", "b": false}, {"t": "De nada", "b": true}], [{"t": "Pardon/Excusez-moi", "b": false}, {"t": "dech-koulp-ë", "b": false}, {"t": "Desculpe", "b": true}], [{"t": "Oui", "b": false}, {"t": "sim", "b": false}, {"t": "Sim", "b": true}], [{"t": "Non", "b": false}, {"t": "nan-oun", "b": false}, {"t": "Não", "b": true}]]}], "tip": false}, {"title": "Les pronoms et le verbe « ser » et « estar » (être)", "blocks": [{"type": "p", "html": "Comme l'espagnol et l'italien, mais contrairement au français, le portugais distingue « ser » (identité, caractéristique permanente) et « estar » (état temporaire, position).", "italic": false}, {"type": "h3", "text": "Pronoms"}, {"type": "table", "headers": ["Français", "Portugais"], "rows": [[{"t": "je", "b": false}, {"t": "eu", "b": true}], [{"t": "tu", "b": false}, {"t": "tu", "b": true}], [{"t": "il/elle", "b": false}, {"t": "ele / ela", "b": true}], [{"t": "nous", "b": false}, {"t": "nós", "b": true}], [{"t": "vous", "b": false}, {"t": "vocês", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "eles / elas", "b": true}]]}, {"type": "h3", "text": "ser — être (permanent)"}, {"type": "table", "headers": ["Pronom", "Conjugaison"], "rows": [[{"t": "eu", "b": false}, {"t": "sou", "b": true}], [{"t": "tu", "b": false}, {"t": "és", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "é", "b": true}], [{"t": "nós", "b": false}, {"t": "somos", "b": true}], [{"t": "vocês", "b": false}, {"t": "são", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "são", "b": true}]]}, {"type": "p", "html": "Exemple : Eu sou francês — Je suis français (identité, permanent). — Eu estou em Lisboa — Je suis (en ce moment) à Lisbonne (temporaire, avec estar).", "italic": false}], "tip": false}, {"title": "Verbes courants et leur conjugaison", "blocks": [{"type": "p", "html": "Les verbes réguliers portugais se répartissent en trois groupes selon leur terminaison : -ar, -er, -ir.", "italic": false}, {"type": "table", "headers": ["Pronom", "-ar (falar)", "-er (comer)", "-ir (partir)"], "rows": [[{"t": "eu", "b": false}, {"t": "falo", "b": false}, {"t": "como", "b": false}, {"t": "parto", "b": true}], [{"t": "tu", "b": false}, {"t": "falas", "b": false}, {"t": "comes", "b": false}, {"t": "partes", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "fala", "b": false}, {"t": "come", "b": false}, {"t": "parte", "b": true}], [{"t": "nós", "b": false}, {"t": "falamos", "b": false}, {"t": "comemos", "b": false}, {"t": "partimos", "b": true}], [{"t": "vocês", "b": false}, {"t": "falam", "b": false}, {"t": "comem", "b": false}, {"t": "partem", "b": true}]]}, {"type": "h3", "text": "Verbes irréguliers importants (forme « eu »)"}, {"type": "table", "headers": ["Signification", "eu", "Verbe"], "rows": [[{"t": "avoir", "b": false}, {"t": "tenho", "b": false}, {"t": "ter", "b": true}], [{"t": "aller", "b": false}, {"t": "vou", "b": false}, {"t": "ir", "b": true}], [{"t": "faire", "b": false}, {"t": "faço", "b": false}, {"t": "fazer", "b": true}], [{"t": "pouvoir", "b": false}, {"t": "posso", "b": false}, {"t": "poder", "b": true}], [{"t": "vouloir", "b": false}, {"t": "quero", "b": false}, {"t": "querer", "b": true}], [{"t": "savoir", "b": false}, {"t": "sei", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "Les nombres de 0 à 100", "blocks": [{"type": "table", "headers": ["N°", "Portugais", "N°", "Portugais"], "rows": [[{"t": "0", "b": false}, {"t": "zero", "b": false}, {"t": "11", "b": false}, {"t": "onze", "b": true}], [{"t": "1", "b": false}, {"t": "um", "b": false}, {"t": "12", "b": undi", "b": false}, {"t": "segunda-feira", "b": true}], [{"t": "mardi", "b": false}, {"t": "terça-feira", "b": true}], [{"t": "mercredi", "b": false}, {"t": "quarta-feira", "b": true}], [{"t": "jeudi", "b": false}, {"t": "quinta-feira", "b": true}], [{"t": "vendredi", "b": false}, {"t": "sexta-feira", "b": true}], [{"t": "samedi", "b": false}, {"t": "sábado", "b": true}], [{"t": "dimanche", "b": false}, {"t": "domingo", "b": true}]]}, {"type": "h3", "text": "Mois"}, {"type": "table", "headers": ["Mois", "Portugais", "Mois", "Portugais"], "rows": [[{"t": "janvier", "b": false}, {"t": "janeiro", "b": false}, {"t": "juillet", "b": false}, {"t": "julho", "b": true}], [{"t": "février", "b": false}, {"t": "fevereiro", "b": false}, {"t": "août", "b": false}, {"t": "agosto", "b": true}], [{"t": "mars", "b": false}, {"t": "março", "b": false}, {"t": "septembre", "b": false}, {"t": "setembro", "b": true}], [{"t": "avril", "b": false}, {"t": "abril", "b": false}, {"t": "octobre", "b": false}, {"t": "outubro", "b": true}], [{"t": "mai", "b": false}, {"t": "maio", "b": false}, {"t": "novembre", "b": false}, {"t": "novembro", "b": true}], [{"t": "juin", "b": false}, {"t": "junho", "b": false}, {"t": "décembre", "b": false}, {"t": "dezembro", "b": true}]]}, {"type": "p", "html": "À noter : contrairement au français, les jours de la semaine portugais (du lundi au vendredi) se construisent avec « -feira » et un numéro (« deuxième foire », « troisième foire »...) — un système hérité du calendrier ecclésiastique.", "italic": true}], "tip": false}, {"title": "Les couleurs", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Portugais"], "rows": [[{"t": "rouge", "b": false}, {"t": "vér-mèl-you", "b": false}, {"t": "vermelho", "b": true}], [{"t": "bleu", "b": false}, {"t": "az-oul", "b": false}, {"t": "azul", "b": true}], [{"t": "vert", "b": false}, {"t": "vérd-ë", "b": false}, {"t": "verde", "b": true}], [{"t": "jaune", "b": false}, {"t": "a-marél-ou", "b": fals
