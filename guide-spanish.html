يب ده هو الجزء التاني بعد كتيب «تعلّم الإسبانية بسهولة» اللي غطّى الأساسيات. لو خلّصت المستوى الأساسي وعايز مستوى تقدر تعتمد عليه فعلاً في السفر والشغل والحياة اليومية في إسبانيا، فالكتيب ده هيدّيك: الأزمنة اللي هتحتاجها عشان تحكي عن الماضي والمستقبل، مفردات عملية لمواقف حقيقية، وحوارات واقعية بتحاكي مواقف ممكن تقابلها فعلاً.", "italic": false}, {"type": "list", "label": "<strong>قبل ما تبدأ</strong>", "intro": null, "items": ["لازم تكون عارف: التحيات، الضمائر، فعل Ser/Estar، تصريف المضارع، والأرقام — كلهم في الكتيب الأساسي.", "هدفنا هنا مش تعلّم كل حاجة عن اللغة، لكن نديك أدوات كافية تتصرف بيها لوحدك في أي موقف.", "خد وقتك في كل فصل، وطبّق الأمثلة بصوت عالٍ قبل ما تكمل للي بعده."]}], "tip": false, "dividerBefore": true}, {"title": "مراجعة سريعة للمستوى الأساسي", "blocks": [{"type": "h3", "text": "<strong>الضمائر</strong>"}, {"type": "table", "headers": ["yo", "tú", "usted/él/ella", "nosotros", "vosotros/ustedes"], "rows": [[{"t": "أنا", "b": false}, {"t": "إنتَ", "b": false}, {"t": "حضرتك/هو/هي", "b": false}, {"t": "إحنا", "b": false}, {"t": "إنتوا", "b": false}]]}, {"type": "h3", "text": "<strong>المضارع — الأنماط المنتظمة</strong>"}, {"type": "table", "headers": ["الضمير", "-ir (vivir)", "-er (comer)", "-ar (hablar)"], "rows": [[{"t": "yo", "b": false}, {"t": "vivo", "b": false}, {"t": "como", "b": false}, {"t": "hablo", "b": false}], [{"t": "usted/él/ella", "b": false}, {"t": "vive", "b": false}, {"t": "come", "b": false}, {"t": "habla", "b": false}], [{"t": "nosotros", "b": false}, {"t": "vivimos", "b": false}, {"t": "comemos", "b": false}, {"t": "hablamos", "b": false}], [{"t": "ustedes/ellos", "b": false}, {"t": "viven", "b": false}, {"t": "comen", "b": false}, {"t": "hablan", "b": false}]]}, {"type": "h3", "text": "<strong>Ser / Estar (المضارع)</strong>"}, {"type": "table", "headers": ["الضمير", "Estar", "Ser"], "rows": [[{"t": "yo", "b": false}, {"t": "estoy", "b": false}, {"t": "soy", "b": false}], [{"t": "usted/él/ella", "b": false}, {"t": "está", "b": fa استخدام", "التعبير بالإسبانية"], "rows": [[{"t": "شارد الذهن/بيحلم", "b": false}, {"t": "Estar en las nubes", "b": false}], [{"t": "غالي جدًا (نفس المعنى في البرتغالي بالظبط!)", "b": false}, {"t": "Costar un ojo de la cara", "b": false}], [{"t": "سهل جدًا", "b": false}, {"t": "Ser pan comido", "b": false}], [{"t": "بيقول اللي في دماغه من غير مواربة", "b": false}, {"t": "No tener pelos en la lengua", "b": false}], [{"t": "يصرف بسخاء زيادة عن اللزوم", "b": false}, {"t": "Tirar la casa por la ventana", "b": false}], [{"t": "يجمع نفسه/يبدأ يشتغل جد", "b": false}, {"t": "Ponerse las pilas", "b": false}], [{"t": "مجنون شوية", "b": false}, {"t": "Estar como una cabra", "b": false}], [{"t": "يحدد المشكلة بالظبط", "b": false}, {"t": "Dar en el clavo", "b": false}]]}], "tip": false}, {"title": "حوارات تدريبية متقدمة (٥ مواقف واقعية)", "blocks": [{"type": "h3", "text": "<strong>١) في المطار — تأخير في الرحلة</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Pasajero:", "orig": "Buenas tardes, ¿mi vuelo a Madrid tiene retraso?", "trans": "مساء الخير، رحلتي لمدريد متأخرة؟"}, {"speaker": "Empleado:", "orig": "Sí, por desgracia tiene una hora de retraso.", "trans": "أيوه للأسف متأخرة ساعة."}, {"speaker": "Pasajero:", "orig": "¿Voy a perder la conexión a Barcelona?", "trans": "هفوّت الرحلة اللي هتوصلني برشلونة؟"}, {"speaker": "Empleado:", "orig": "Tranquilo, ya hemos reorganizado su viaje.", "trans": "متقلقش، إحنا رتبنا رحلتك تاني."}]}, {"type": "h3", "text": "<strong>٢) شكوى في الفندق</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Huésped:", "orig": "Perdone, el aire acondicionado de mi habitación no funciona.", "trans": "معلش، تكييف أوضتي مش شغال."}, {"speaker": "Recepción:", "orig": "Lo siento mucho. Voy a enviar a alguien ahora mismo.", "trans": "آسفين جدًا. هبعتلك حد فورًا."}, {"speaker": "Huésped:", "orig": "Gracias. También querría cambiar de habitación, si es posible.", "trans": "شكرًا. حبيت كمان أغيّر أوضة لو ممكن."}, {"speaker": "Recepción:", "orig": "Claro, voy a comprobar la disponibilidad.", "trans": "أكيد، هشوف لو فيه أوضة فاضية."}]}, {"type": "h3", "text": "<strong>٣) في الصيدلية</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Buenas tardes, no me encuentro bien. Tengo dolor de cabeza y fiebre.", "trans": "مساء الخير، مش حاسس إني كويس. عندي صداع وسخونية."}, {"speaker": "Farmacéutico:", "orig": "¿Desde cuándo tiene estos síntomas?", "trans": "من امتى وأنت حاسس بالأعراض دي؟"}, {"speaker": "Cliente:", "orig": "Desde anoche.", "trans": "من امبارح بالليل."}, {"speaker": "Farmacéutico:", "orig": "Tome este medicamento cada ocho horas.", "trans": "خد الدوا ده كل ٨ ساعات."}]}, {"type": "h3", "text": "<strong>٤) تأجير عربية</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Querría alquilar un coche por tres días.", "trans": "عايز أأجّر عربية لتلات أيام."}, {"speaker": "Empleado:", "orig": "Claro. ¿Puedo ver su carné de conducir, por favor?", "trans": "أكيد. ممكن أشوف رخصة القيادة لو سمحت؟"}, {"speaker": "Cliente:", "orig": "Aquí tiene. ¿El seguro está incluido?", "trans": "اتفضل. التأمين داخل في السعر؟"}, {"speaker": "Empleado:", "orig": "Sí, el seguro básico está incluido en el precio.", "trans": "أيوه، التأمين الأساسي داخل في السعر."}]}, {"type": "h3", "text": "<strong>٥) سؤال عن الاتجاهات</strong>"}, {"type": "dialogue", "lines": [{"speaker": "Turista:", "orig": "Perdone, ¿cómo llego al Museo del Prado?", "trans": "معلش، أروح إزاي متحف البرادو؟"}, {"speaker": "Local:", "orig": "Siga todo recto y luego gire a la derecha en la segunda calle.", "trans": "كمّل دُغري وبعدين لف يمين في تاني شارع."}, {"speaker": "Turista:", "orig": "¿Está muy lejos de aquí?", "trans": "ده بعيد أوي من هنا؟"}, {"speaker": "Local:", "orig": "No, está a unos diez minutos a pie.", "trans": "لأ، حوالي ١٠ دقايق مشي."}]}], "tip": false}, {"title": "نص قرائي للتدريب", "blocks": [{"type": "p", "html": "اقرأ النص ده كذا مرة بصوت عالٍ، وحاول تفهمه من غير ما تترجم كل كلمة:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": []}, {"type": "h3", "text": "<strong>مفردات مهمة من النص</strong>"}, {"type": "table", "headers": ["المعنى", "الكلمة"], "rows": [[{"t": "يمسك/ياخد (مواصلات — الكلمة دي في بعض دول أمريكا اللاتينية عامية بذيئة، فخليك حذر برا إسبانيا)", "b": false}, {"t": "coger", "b": false}], [{"t": "الميدان الرئيسي في مدريد", "b": false}, {"t": "Plaza Mayor", "b": false}], [{"t": "فلامنكو (رقص وموسيقى إسباني تقليدي)", "b": false}, {"t": "flamenco", "b": false}], [{"t": "ما يُنسى", "b": false}, {"t": "inolvidable", "b": false}]]}, {"type": "h3", "text": "<strong>أسئلة للفهم</strong>"}, {"type": "list", "label": null, "intro": null, "items": ["الأسرة راحت مدريد إمتى؟", "عملوا إيه بعد الـcheck-in؟", "سمعوا فلامنكو فين؟"]}, {"type": "p", "html": "<em>الإجابات: ١) بالأمس ٢) راحوا الوسط يتغدّوا ٣) جنب ميدان الپلاثا مايور بالليل</em>", "italic": true}], "tip": false}, {"title": "خاتمة وخطوات نحو الطلاقة الكاملة", "blocks": [{"type": "list", "label": "<strong>للوصول للطلاقة الكاملة</strong>", "intro": null, "items": ["اقرأ جرايد أو مقالات إسبانية بسيطة يوميًا وحاول تفهم من السياق قبل ما تترجم.", "اتكلم مع متحدثين أصليين (أونلاين أو لو سافرت) — التطبيق العملي أهم حاجة دلوقتي.", "اكتب يوميات قصيرة بالإسباني كل يوم — حتى ٣-٤ جمل بتفرق كتير على المدى الطويل.", "راجع الأزمنة دي كل شوية لحد ما تبقى تلقائية من غير ما تفكر فيها.", "متخافش من الغلط في المحادثة — الإسبان بيتقدّروا جدًا أي حد بيحاول يتكلم لغتهم."]}], "tip": true}], "closingBasic": "مبروك مقدمًا على رحلتك مع اللغة الإسبانية — ¡Buena suerte! (حظ سعيد!)", "closingAdvanced": "رحلتك مع الإسبانية بقت جاهزة للمستوى اللي تقدر تعتمد عليه فعلاً — ¡Mucha suerte! (حظ سعيد!)"}, "en": {"chapters": [{"title": "Introduction: Why Learn Spanish?", "blocks": [{"type": "p", "html": "Spanish is the official language of Spain and more than 19 countries across Latin America, spoken by over 500 million people worldwide — making it one of the most widely spoken languages on Earth, right after Chinese and English. This book focuses on Castilian Spanish (the Spanish spoken in Spain itself), so you learn to speak with an authentic Spanish accent and vocabulary.", "italic": false}, {"type": "p", "html": "The good news: Spanish is one of the easiest Romance languages to pronounce, because almost every letter is pronounced exactly as it's written — no hidden complexity like French or Portuguese. The only real challenge is a handful of distinctive sounds, which we'll cover in the very first chapter.", "italic": false}, {"type": "list", "label": "<strong>Goals of This Book</strong>", "intro": null, "items": ["Give you a solid foundation of vocabulary and core grammar in the shortest time possible.", "Focus on correct pronunciation so your accent sounds authentically Spanish.", "Give you practical phrases you can use from day one in real situations."]}], "tip": false}, {"title": "The Alphabet & Pronunciation Basics", "blocks": [{"type": "p", "html": "Spanish uses the same Latin alphabet as English, and its biggest advantage is that most letters are pronounced exactly as they're written. This table introduces the letters and sounds that are most distinctive:", "italic": false}, {"type": "table", "headers": ["Spanish", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>casa</strong>", "b": true}, {"t": "KAH-sah", "b": false}, {"t": "house — every letter is clearly pronounced", "b": false}], [{"t": "<strong>hola</strong>", "b": true}, {"t": "OH-lah", "b": false}, {"t": "hello — the \"h\" is always silent", "b": false}], [{"t": "<strong>queso</strong>", "b": true}, {"t": "KEH-so", "b": false}, {"t": "cheese — \"qu\" sounds like \"k\", never \"kw\"", "b": false}], [{"t": "<strong>guerra</strong>", "b": true}, {"t": "GEH-rrah", "b": false}, {"t": "war — \"gu\" before e/i is a hard \"g\" sound", "b": false}], [{"t": "<strong>baño</strong>", "b": true}, {"t": "BAH-nyo", "b": false}, {"t": "bathroom — \"ñ\" sounds like \"ny\" in \"canyon\"", "b": false}], [{"t": "<strong>perro</strong>", "b": true}, {"t": "PEH-rroh", "b": false}, {"t": "dog — \"rr\" is a strong rolled/trilled r", "b": false}], [{"t": "<strong>cielo</strong>", "b": true}, {"t": "THYEH-lo", "b": false}, {"t": "sky — \"ci\" sounds like \"th\" in Spain", "b": false}], [{"t": "<strong>zapato</strong>", "b": true}, {"t": "thah-PAH-toh", "b": false}, {"t": "shoe — \"z\" always sounds like \"th\" in Spain", "b": false}], [{"t": "<strong>gente</strong>", "b": true}, {"t": "HEN-teh", "b": false}, {"t": "people — \"ge\"/\"gi\" is a strong throaty \"h\" sound", "b": false}], [{"t": "<strong>jamón</strong>", "b": true}, {"t": "hah-MOHN", "b": false}, {"t": "ham — \"j\" is always that same throaty \"h\" sound", "b": false}], [{"t": "<strong>llamar</strong>", "b": true}, {"t": "yah-MAR", "b": false}, {"t": "to call — \"ll\" sounds like \"y\" in most of Spain", "b": false}]]}], "tip": false}, {"title": "Golden Rules for Authentic Pronunciation", "blocks": [{"type": "p", "html": "These 6 golden rules will make the biggest difference in how authentic you sound — the goal is to sound like someone from Spain, not just someone reading Spanish words:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["The letter \"h\" is always silent — hola is pronounced \"OH-lah\", never \"HOH-lah\".", "The letter \"z\" (in any position), and the letter \"c\" before e or i, are pronounced like \"th\" in \"think\" in Spain — not like \"s\" as in Latin America. This is the single most famous difference between the two accents.", "The letter \"j\", and \"g\" before e or i, are pronounced with a strong throaty sound, similar to the \"ch\" in the Scottish word \"loch\".", "The letter \"r\" at the start of a word, or doubled as \"rr\", is a strong rolled/trilled sound made with the tip of the tongue.", "The vowels (a, e, i, o, u) always keep the exact same pure sound no matter where they appear in a word — unlike English, where vowel sounds shift constantly.", "Stress usually falls on the second-to-last syllable if a word ends in a vowel or n/s, and on the last syllable if it ends in another consonant — unless a written accent mark (´) shows you exactly where the stress falls."]}], "tip": false}, {"title": "Essential Greetings & Phrases", "blocks": [{"type": "table", "headers": ["Spanish", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>Hola</strong>", "b": true}, {"t": "OH-lah", "b": false}, {"t": "Hello", "b": false}], [{"t": "<strong>Buenos días</strong>", "b": true}, {"t": "BWEH-nos DEE-ahs", "b": false}, {"t": "Good morning", "b": false}], [{"t": "<strong>Buenas tardes</strong>", "b": true}, {"t": "BWEH-nas TAR-dehs", "b": false}, {"t": "Good afternoon", "b": false}], [{"t": "<strong>Buenas noches</strong>", "b": true}, {"t": "BWEH-nas NO-chehs", "b": false}, {"t": "Good evening / night", "b": false}], [{"t": "<strong>¿Cómo está?</strong>", "b": true}, {"t": "KOH-moh es-TAH", "b": false}, {"t": "How are you? (formal)", "b": false}], [{"t": "<strong>¿Qué tal?</strong>", "b": true}, {"t": "keh TAL", "b": false}, {"t": "How's it going? (casual)", "b": false}], [{"t": "<strong>Muy bien, gracias</strong>", "b": true}, {"t": "mwee byehn, GRAH-syahs", "b": false}, {"t": "Very well, thank you", "b": false}], [{"t": "<strong>Encantado / Encantada</strong>", "b": true}, {"t": "en-kan-TAH-doh/dah", "b": false}, {"t": "Nice to meet you (male/female speaker)", "b": false}], [{"t": "<strong>Hasta luego</strong>", "b": true}, {"t": "AHS-tah LWEH-go", "b": false}, {"t": "See you later", "b": false}], [{"t": "<strong>Hasta mañana</strong>", "b": true}, {"t": "AHS-tah mahn-YAH-nah", "b": false}, {"t": "See you tomorrow", "b": false}], [{"t": "<strong>Adiós</strong>", "b": true}, {"t": "ah-DYOHS", "b": false}, {"t": "Goodbye", "b": false}], [{"t": "<strong>Por favor</strong>", "b": true}, {"t": "por fah-VOR", "b": false}, {"t": "Please", "b": false}], [{"t": "<strong>Gracias</strong>", "b": true}, {"t": "GRAH-syahs", "b": false}, {"t": "Thank you", "b": false}], [{"t" se}, {"t": "lunch", "b": false}], [{"t": "<strong>cena</strong>", "b": true}, {"t": "SEH-nah", "b": false}, {"t": "dinner", "b": false}]]}], "tip": false}, {"title": "Essential Travel & Hotel Phrases", "blocks": [{"type": "table", "headers": ["Spanish", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>¿Dónde está...?</strong>", "b": true}, {"t": "DOHN-deh es-TAH", "b": false}, {"t": "Where is...?", "b": false}], [{"t": "<strong>¿Cuánto cuesta esto?</strong>", "b": true}, {"t": "KWAN-toh KWES-tah EHS-toh", "b": false}, {"t": "How much does this cost?", "b": false}], [{"t": "<strong>¿Puedo ver el menú?</strong>", "b": true}, {"t": "PWEH-doh vehr el meh-NOO", "b": false}, {"t": "Can I see the menu?", "b": false}], [{"t": "<strong>La cuenta, por favor</strong>", "b": true}, {"t": "lah KWEN-tah por fah-VOR", "b": false}, {"t": "The bill, please", "b": false}], [{"t": "<strong>¿Dónde está el baño?</strong>", "b": true}, {"t": "DOHN-deh es-TAH el BAH-nyo", "b": false}, {"t": "Where is the bathroom?", "b": false}], [{"t": "<strong>Necesito ayuda</strong>", "b": true}, {"t": "neh-seh-SEE-toh ah-YOO-dah", "b": false}, {"t": "I need help", "b": false}], [{"t": "<strong>No entiendo</strong>", "b": true}, {"t": "no en-TYEN-doh", "b": false}, {"t": "I don't understand", "b": false}], [{"t": "<strong>¿Puede repetir, por favor?</strong>", "b": true}, {"t": "PWEH-deh reh-peh-TEER por fah-VOR", "b": false}, {"t": "Can you repeat, please?", "b": false}], [{"t": "<strong>¿Habla inglés?</strong>", "b": true}, {"t": "AH-blah een-GLES", "b": false}, {"t": "Do you speak English?", "b": false}], [{"t": "<strong>Quiero reservar una habitación</strong>", "b": true}, {"t": "KYEH-roh reh-sehr-VAR OO-nah ah-bee-tah-SYOHN", "b": false}, {"t": "I want to book a room", "b": false}], [{"t": "<strong>¿A qué hora sale el tren?</strong>", "b": true}, {"t": "ah keh OH-rah SAH-leh el trehn", "b": false}, {"t": "What time does the train leave?", "b": false}], [{"t": "<strong>¿Dónde puedo coger un taxi?</strong>", "b": true}, {"t": "DOHN-deh PWEH-doh koh-HEHR oon TAK-see", "b": false}, {"t": "Where can I catch a taxi?", "b": false}]]}], "tip": false}, {"title": "Authentic Spanish Slang & Expressions", "blocks": [{"type": "p", "html": "These are the phrases that separate someone who speaks \"correct\" Spanish from someone who sounds truly Spanish. Use them in the right context and you'll get a completely different reaction from native speakers:", "italic": false}, {"type": "table", "headers": ["Spanish", "Pronunciation", "Meaning"], "rows": [[{"t": "<strong>¡Vale!</strong>", "b": true}, {"t": "BAH-leh", "b": false}, {"t": "Okay! / Alright! — the single most common word in Spain", "b": false}], [{"t": "<strong>¡Qué guay!</strong>", "b": true}, {"t": "keh gwhy", "b": false}, {"t": "How cool! / Awesome!", "b": false}], [{"t": "<strong>¡Qué fuerte!</strong>", "b": true}, {"t": "keh FWEHR-teh", "b": false}, {"t": "No way! / Wow, that's intense!", "b": false}], [{"t": "<strong>Me mola</strong>", "b": true}, {"t": "meh MOH-lah", "b": false}, {"t": "I like it / I'm into it — a very Spain-specific verb", "b": false}], [{"t": "<strong>Venga</strong>", "b": true}, {"t": "BEHN-gah", "b": false}, {"t": "Come on! / Alright then", "b": false}], [{"t": "<strong>Guay</strong>", "b": true}, {"t": "gwhy", "b": false}, {"t": "Cool / awesome (adjective)", "b": false}], [{"t": "<strong>¡Ostras!</strong>", "b": true}, {"t": "OH-strahs", "b": false}, {"t": "Wow! / Gosh! — a mild exclamation of surprise", "b": false}], [{"t": "<strong>Tío / Tía</strong>", "b": true}, {"t": "TEE-oh / TEE-ah", "b": false}, {"t": "Dude / mate — how young people in Spain address each other", "b": false}]]}], "tip": false}, {"title": "Full Practice Dialogue", "blocks": [{"type": "p", "html": "A simple café dialogue — read it out loud several times and try to imitate the pronunciation:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Waiter:", "orig": "¡Hola! Bienvenido. ¿Qué va a tomar?", "trans": "Hello! Welcome. What would you like?"}, {"speaker": "Customer:", "orig": "¡Hola! Quería un café, por favor.", "trans": "Hello! I'd like a coffee, please."}, {"speaker": "Waiter:", "orig": "¿Algo más?", "trans": "Anything else?"}, {"speaker": "Customer:", "orig": "Sí, la cuenta, por favor.", "trans": "Yes, the bill, please."}, {"speaker": "Waiter:", "orig": "Son dos euros. ¡Gracias!", "trans": "That's two euros. Thanks!"}, {"speaker": "Customer:", "orig": "De nada, ¡hasta luego!", "trans": "You're welcome, see you later!"}]}], "tip": false}, {"title": "Action Plan: How to Learn Fast", "blocks": [{"type": "list", "label": "<strong>7 Steps to Lock In the Language Fast</strong>", "intro": null, "items": ["Listen to Spanish songs and TV shows every day, even just 10 minutes — your ear adapts to the rhythm before your brain does.", "Practice \"shadowing\": listen to a short sentence and repeat it immediately with the same rhythm and speed.", "Focus on the z/c and j/g sounds in front of a mirror until they feel natural.", "Don't translate in your head — try to think directly in Spanish instead of going through English first.", "Use an app like Duolingo or Babbel alongside this book to reinforce vocabulary through repetition.", "Speak from day one, even with mistakes — fluency comes from practice, not memorization.", "Always remember the difference between Castilian Spanish (which this book focuses on) and Latin American Spanish, since pronunciation and some vocabulary differ."]}], "tip": true}, {"title": "Introduction: who is this book for?", "blocks": [{"type": "p", "html": "This book is the second part after «Learn Spanish — Easy, Fun and Fast», which covered the basics. If you've already finished the basic level and want to reach a level where you can genuinely get by while travelling, working, and living day to day in Spain, this book will give you: the verb tenses you need, practical vocabulary for real situations, and realistic dialogues.", "italic": false}, {"type": "list", "label": "Before you start", "intro": null, "items": ["You should already know: greetings, pronouns, ser/estar, present-tense conjugation, and numbers — all covered in the basic book.", "Our goal here isn't to teach you everything about the language, but to give you enough tools to handle yourself in any situation.", "Take each chapter slowly, and practise the examples out loud before moving on to the next one."]}], "tip": false, "dividerBefore": true}, {"title": "Quick review of the basic level", "blocks": [{"type": "table", "headers": ["yo", "tú", "él/ella", "nosotros", "vosotros/ellos"], "rows": [[{"t": "I", "b": false}, {"t": "you", "b": false}, {"t": "he/she", "b": false}, {"t": "we", "b": false}, {"t": "you (pl)/they", "b": true}]]}, {"type": "h3", "text": "Present tense — the regular patterns"}, {"type": "table", "headers": ["Pronoun", "-ar (hablar)", "-er (comer)", "-ir (vivir)"], "rows": [[{"t": "yo", "b": false}, {"t": "hablo", "b": false}, {"t": "como", "b": false}, {"t": "vivo", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "comemos", "b": false}, {"t": "vivimos", "b": true}], [{"t": "ellos", "b": false}, {"t": "hablan", "b": false}, {"t": "comen", "b": false}, {"t": "viven", "b": true}]]}], "tip": false}, {"title": "The past: Pretérito Indefinido and Imperfecto", "blocks": [{"type": "p", "html": "Spanish distinguishes between a completed, one-off action (Pretérito Indefinido, roughly the English simple past) and a habitual or descriptive past (Imperfecto, roughly \"used to\" / \"was -ing\"). It's a simple tense, with no auxiliary verb:", "italic": false}, {"type": "table", "headers": ["Pronoun", "hablar → Indefinido", "ir → Indefinido"], "rows": [[{"t": "yo", "b": false}, {"t": "hablé", "b": false}, {"t": "fui", "b": true}], [{"t": "tú", "b": false}, {"t": "hablaste", "b": false}, {"t": "fuiste", "b": true}], [{"t": "él/ella", "b": false}, {"t": "habló", "b": false}, {"t": "fue", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "fuimos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaron", "b": false}, {"t": "fueron", "b": true}]]}, {"type": "h3", "text": "The Imperfecto"}, {"type": "table", "headers": ["Pronoun", "hablar → imperfecto"], "rows": [[{"t": "yo", "b": false}, {"t": "hablaba", "b": true}], [{"t": "tú", "b": false}, {"t": "hablabas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hablaba", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablábamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaban", "b": true}]]}, {"type": "p", "html": "Example: Cuando era pequeño, vivía en Londres (Imperfecto: description) — Ayer fui al mercado (Indefinido: one-off event). Note: Spanish also has a Pretérito Perfecto (he hablado) used mainly for a very recent past still linked to the present — most storytelling uses the Indefinido instead.", "italic": false}], "tip": false}, {"title": "Future and conditional", "blocks": [{"type": "table", "headers": ["Use", "Formation", "Example"], "rows": [[{"t": "Near future (upcoming intention)", "b": false}, {"t": "ir a + infinitive", "b": false}, {"t": "Voy a salir mañana — I'm going to leave tomorrow", "b": true}], [{"t": "Simple future (prediction)", "b": false}, {"t": "infinitive + endings -é, -ás, -á, -emos, -án", "b": false}, {"t": "Saldré el año que viene — I will leave next year", "b": true}], [{"t": "Conditional (hypothesis, politeness)", "b": false}, {"t": "infinitive + endings -ía, -ías, -ía, -íamos, -ían", "b": false}, {"t": "Querría un café — I would like a coffee", "b": true}]]}], "tip": false}, {"title": "Reflexive verbs and object pronouns", "blocks": [{"type": "table", "headers": ["Subject pronoun", "Reflexive pronoun", "lavarse (to wash oneself)"], "rows": [[{"t": "yo", "b": false}, {"t": "me", "b": false}, {"t": "me lavo", "b": true}], [{"t": "tú", "b": false}, {"t": "te", "b": false}, {"t": "te lavas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "se", "b": false}, {"t": "se lava", "b": true}], [{"t": "nosotros", "b": false}, {"t": "nos", "b": false}, {"t": "nos lavamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "se", "b": false}, {"t": "se lavan", "b": true}]]}, {"type": "p", "html": "Direct object pronouns (me, te, lo/la, nos, os, los/las) and indirect object pronouns (me, te, le, nos, os, les) go before the conjugated verb, just like in English word order for many cases: Lo veo (I see it/him), Le hablo (I speak to him/her). With an infinitive or gerund, they can also attach to the end: Quiero verlo / Lo quiero ver.", "italic": false}], "tip": false}, {"title": "The subjunctive: the essential basics", "blocks": [{"type": "p", "html": "The Spanish subjunctive is used far more often than anything comparable in English, especially after expressions of wish, doubt or emotion (querer que, esperar que, es posible que).", "italic": false}, {"type": "table", "headers": ["Pronoun", "hablar → present subjunctive"], "rows": [[{"t": "yo", "b": false}, {"t": "hable", "b": true}], [{"t": "tú", "b": false}, {"t": "hables", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hable", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablemos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablen", "b": true}]]}, {"type": "p", "html": "Example: Espero que hables español pronto — I hope you'll speak Spanish soon. Unlike English, which can often just use a plain infinitive or \"that\" clause, Spanish requires \"que + subjunctive\" whenever the subject changes.", "italic": false}], "tip": false}, {"title": "Comparatives, superlatives and advanced connectors", "blocks": [{"type": "table", "headers": ["Structure", "Spanish", "Meaning"], "rows": [[{"t": "more... than", "b": false}, {"t": "más... que", "b": false}, {"t": "Es más alto que yo", "b": true}], [{"t": "less... than", "b": false}, {"t": "menos... que", "b": false}, {"t": "Es menos caro que antes", "b": true}], [{"t": "as... as", "b": false}, {"t": "tan... como", "b": false}, {"t": "Es tan rápida como él", "b": true}], [{"t": "the most", "b": false}, {"t": "el más / la más", "b": false}, {"t": "Es el barrio más bonito", "b": true}], [{"t": "however", "b": false}, {"t": "sin embargo", "b": false}, {"t": "formal contrast connector", "b": true}], [{"t": "therefore/so", "b": false}, {"t": "así que / por lo tanto", "b": false}, {"t": "consequence connector", "b": true}], [{"t": "although", "b": false}, {"t": "aunque (+ subjunctive)", "b": false}, {"t": "concession connector", "b": true}]]}], "tip": false}, {"title": "Vocabulary: airport and customs", "blocks": [{"type": "table", "headers": ["Meaning", "Spanish"], "rows": [[{"t": "boarding pass", "b": false}, {"t": "tarjeta de embarque", "b": true}], [{"t": "carry-on luggage", "b": false}, {"t": "equipaje de mano", "b": true}], [{"t": "baggage claim", "b": false}, {"t": "recogida de equipajes", "b": true}], [{"t": "delayed flight", "b": false}, {"t": "vuelo retrasado", "b": true}], [{"t": "customs", "b": false}, {"t": "aduana", "b": true}], [{"t": "passport", "b": false}, {"t": "pasaporte", "b": true}], [{"t": "nothing to declare", "b": false}, {"t": "nada que declarar", "b": true}], [{"t": "boarding gate", "b": false}, {"t": "puerta de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabulary: hotel, health and emergencies", "blocks": [{"type": "table", "headers": ["Meaning", "Spanish"], "rows": [[{"t": "There's no hot water", "b": false}, {"t": "No hay agua caliente", "b": true}], [{"t": "The room isn't ready", "b": false}, {"t": "La habitación no está lista", "b": true}], [{"t": "I'd like to change rooms", "b": false}, {"t": "Querría cambiar de habitación", "b": true}], [{"t": "pharmacy", "b": false}, {"t": "farmacia", "b": true}], [{"t": "I need a doctor", "b": false}, {"t": "Necesito un médico", "b": true}], [{"t": "It hurts here", "b": false}, {"t": "Me duele aquí", "b": true}], [{"t": "Call an ambulance!", "b": false}, {"t": "¡Llame a una ambulancia!", "b": true}], [{"t": "hospital", "b": false}, {"t": "hospital", "b": true}], [{"t": "health insurance", "b": false}, {"t": "seguro médico", "b": true}]]}], "tip": false}, {"title": "Vocabulary: bank, police and official matters", "blocks": [{"type": "table", "headers": ["Meaning", "Spanish"], "rows": [[{"t": "current account", "b": false}, {"t": "cuenta corriente", "b": true}], [{"t": "ATM", "b": false}, {"t": "cajero automático", "b": true}], [{"t": "exchange rate", "b": false}, {"t": "tipo de cambio", "b": true}], [{"t": "I've lost my wallet", "b": false}, {"t": "He perdido mi cartera", "b": true}], [{"t": "police report", "b": false}, {"t": "denuncia", "b": true}], [{"t": "police station", "b": false}, {"t": "comisaría", "b": true}], [{"t": "town hall", "b": false}, {"t": "ayuntamiento", "b": true}], [{"t": "residence permit", "b": false}, {"t": "permiso de residencia", "b": true}]]}], "tip": false}, {"title": "Vocabulary: transport and directions", "blocks": [{"type": "table", "headers": ["Meaning", "Spanish"], "rows": [[{"t": "one-way ticket", "b": false}, {"t": "billete de ida", "b": true}], [{"t": "round trip", "b": false}, {"t": "ida y vuelta", "b": true}], [{"t": "car rental", "b": false}, {"t": "alquiler de coches", "b": true}], [{"t": "Turn right", "b": false}, {"t": "Gire a la derecha", "b": true}], [{"t": "Go straight ahead", "b": false}, {"t": "Siga todo recto", "b": true}], [{"t": "traffic light", "b": false}, {"t": "semáforo", "b": true}], [{"t": "roundabout", "b": false}, {"t": "rotonda", "b": true}], [{"t": "platform", "b": false}, {"t": "andén", "b": true}], [{"t": "bus stop", "b": false}, {"t": "parada de autobús", "b": true}]]}], "tip": false}, {"title": "Vocabulary: shopping and work", "blocks": [{"type": "table", "headers": ["Meaning", "Spanish"], "rows": [[{"t": "Can you give me a discount?", "b": false}, {"t": "¿Puede hacerme un descuento?", "b": true}], [{"t": "size (clothing)", "b": false}, {"t": "talla", "b": true}], [{"t": "fitting room", "b": false}, {"t": "probador", "b": true}], [{"t": "meeting", "b": false}, {"t": "reunión", "b": true}], [{"t": "deadline", "b": false}, {"t": "fecha límite", "b": true}], [{"t": "job application", "b": false}, {"t": "candidatura", "b": true}], [{"t": "job interview", "b": false}, {"t": "entrevista de trabajo", "b": true}], [{"t": "salary", "b": false}, {"t": "salario", "b": true}]]}], "tip": false}, {"title": "Etiquette: tú or usted?", "blocks": [{"type": "p", "html": "Spanish distinguishes tú (informal, friends and family) from usted (formal, strangers, superiors, professional settings), which is conjugated in the third person singular. In Spain, tú is used more widely than in Latin America, sometimes even with strangers in a relaxed setting.", "italic": false}, {"type": "list", "label": "Practical rules", "intro": null, "items": ["With strangers, superiors, in very formal settings: usted.", "With friends, family, and increasingly at work in Spain: tú.", "Formal emails open with «Estimado/a Señor/a» and close with «Un cordial saludo»."]}], "tip": false}, {"title": "Advanced idiomatic expressions", "blocks": [{"type": "table", "headers": ["Meaning", "Expression"], "rows": [[{"t": "To cost an arm and a leg", "b": false}, {"t": "Costar un ojo de la cara", "b": true}], [{"t": "To be daydreaming/distracted", "b": false}, {"t": "Estar en las nubes", "b": true}], [{"t": "To pretend nothing happened", "b": false}, {"t": "Hacerse el sueco", "b": true}], [{"t": "To be broke", "b": false}, {"t": "Estar sin blanca", "b": true}], [{"t": "To get into trouble", "b": false}, {"t": "Meterse en un lío", "b": true}], [{"t": "To break the ice", "b": false}, {"t": "Romper el hielo", "b": true}]]}], "tip": false}, {"title": "Advanced practice dialogues", "blocks": [{"type": "p", "html": "Scenario: solving a hotel problem.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Guest:", "orig": "Hola, hay un problema con mi habitación, el aire acondicionado no funciona.", "trans": "Hello, there's a problem with my room, the air conditioning isn't working."}, {"speaker": "Receptionist:", "orig": "Lo siento mucho, voy a enviar a alguien enseguida. ¿Prefiere cambiar de habitación mientras tanto?", "trans": "I'm very sorry, I'll send someone right away. Would you like to change rooms in the meantime?"}, {"speaker": "Guest:", "orig": "Sí, sería más fácil, gracias.", "trans": "Yes, that would be easier, thank you."}]}, {"type": "p", "html": "Scenario: at the doctor's.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Doctor:", "orig": "¿Qué le pasa?", "trans": "What's wrong?"}, {"speaker": "Patient:", "orig": "Me duele la garganta desde hace tres días y tengo un poco de fiebre.", "trans": "I've had a sore throat for three days and I have a slight fever."}, {"speaker": "Doctor:", "orig": "Le voy a recetar unos medicamentos. Descanse bien.", "trans": "I'll prescribe you some medicine. Rest well."}]}], "tip": false}, {"title": "Conclusion and next steps toward fluency", "blocks": [{"type": "list", "label": "How to keep improving", "intro": null, "items": ["Watch Spanish shows and films with Spanish subtitles, not English ones, to train your ear.", "Read a short article from an online Spanish newspaper every day (El País, El Mundo).", "Find a language exchange partner for conversation practice (tandem).", "Write a short daily diary of a few sentences in Spanish.", "Don't fear mistakes: true fluency comes from consistent practice, not grammatical perfection."]}], "tip": true}], "closingBasic": "Congratulations in advance on your Spanish journey — ¡Buena suerte! (Good luck!)", "closingAdvanced": "Congratulations on how far you've come — keep going, real fluency is closer than you think! ¡Buena suerte!"}, "it": {"chapters": [{"title": "Introduzione: perché imparare lo spagnolo?", "blocks": [{"type": "p", "html": "Lo spagnolo è lingua ufficiale in 20 paesi, parlato da oltre 500 milioni di persone nel mondo, il che lo rende la seconda lingua madre più parlata dopo il mandarino. Questo libro ti dà una base solida nello spagnolo standard parlato in Spagna.", "italic": false}, {"type": "p", "html": "La buona notizia: lo spagnolo si pronuncia quasi esattamente come si scrive, senza lettere mute o eccezioni sorprendenti — e il vocabolario ti sembrerà spesso familiare, essendo anche lo spagnolo una lingua latina. La difficoltà principale è distinguere bene alcuni suoni che non esistono in italiano, come la «r» fortemente arrotata o la «jota».", "italic": false}, {"type": "list", "label": "Obiettivi di questo libro", "intro": null, "items": ["Darti una base solida di vocabolario e grammatica essenziale nel minor tempo possibile.", "Concentrarci sulla pronuncia corretta perché il tuo accento suoni autenticamente spagnolo.", "Darti frasi pratiche da usare fin dal primo giorno in situazioni reali."]}], "tip": false}, {"title": "L'alfabeto e le basi della pronuncia", "blocks": [{"type": "p", "html": "Lo spagnolo usa l'alfabeto latino con una lettera in più, la ñ. Ogni lettera si pronuncia quasi sempre allo stesso modo. Questa tabella presenta i suoni più distintivi:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Parola"], "rows": [[{"t": "casa", "b": false}, {"t": "kasa", "b": false}, {"t": "casa", "b": true}], [{"t": "ciao", "b": false}, {"t": "ola", "b": false}, {"t": "hola (la h è sempre muta)", "b": true}], [{"t": "grazie", "b": false}, {"t": "grasias", "b": false}, {"t": "gracias (c davanti a i/e = «s» in America, «th» nel nord della Spagna)", "b": true}], [{"t": "gatto", "b": false}, {"t": "gato", "b": false}, {"t": "gato", "b": true}], [{"t": "io", "b": false}, {"t": "yo", "b": false}, {"t": "yo", "b": true}], [{"t": "ragazzo", "b": false}, {"t": "chiko", "b": false}, {"t": "chico", "b": true}], [{"t": "rosso (r arrotata)", "b": false}, {"t": "ro-Rrro", "b": false}, {"t": "rojo (j si pronuncia come una jota gutturale forte, la r iniziale è arrotata)", "b": true}], [{"t": "acqua", "b": false}, {"t": "agua", "b": false}, {"t": "agua", "b": true}], [{"t": "uovo", "b": false}, {"t": "uèvo", "b": false}, {"t": "huevo (h muta)", "b": true}], [{"t": "vino", "b": false}, {"t": "vino", "b": false}, {"t": "vino", "b": true}]]}], "tip": false}, {"title": "Le regole d'oro per una pronuncia autentica", "blocks": [{"type": "p", "html": "Queste 6 regole d'oro fanno la maggiore differenza per suonare davvero spagnolo:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["La h è sempre muta in spagnolo (hola, hotel) — mai aspirata.", "La j, e la g davanti a e/i, si pronunciano con un suono gutturale molto marcato, prodotto più indietro nella gola rispetto alla nostra c dolce (jamón, gente).", "La r a inizio parola, o la rr, si arrota fortemente — un suono già familiare per un italiano, ma spesso più marcato.", "La ll e la y si pronunciano spesso come una «i» semiconsonante (calle → «ka-ye»), tranne in Argentina dove suonano piuttosto «sc/gi».", "La ñ si pronuncia come il «gn» italiano di «montagna» (español, niño) — un suono già tuo!", "In Spagna, la c davanti a e/i e la z si pronunciano «th» (come il th inglese di «think») — in America Latina si pronunciano semplicemente «s»."]}], "tip": false}, {"title": "Saluti e frasi essenziali", "blocks": [{"type": "table", "headers": ["Significato", "Pronuncia", "Spagnolo"], "rows": [[{"t": "Buongiorno (formale/mattina)", "b": false}, {"t": "buènos dìas", "b": false}, {"t": "Buenos días", "b": true}], [{"t": "Buonasera", "b": false}, {"t": "buènas tàrdes", "b": false}, {"t": "Buenas tardes", "b": true}], [{"t": "Ciao (informale)", "b": false}, {"t": "ola", "b": false}, {"t": "Hola", "b": true}], [{"t": "Come va?", "b": false}, {"t": "kè tal", "b": false}, {"t": "¿Qué tal?", "b": true}], [{"t": "Bene, grazie", "b": false}, {"t": "bièn, grasias", "b": false}, {"t": "Bien, gracias", "b": true}], [{"t": "Piacere", "b": false}, {"t": "enkantado", "b": false}, {"t": "Encantado", "b": tr italiano?", "b": false}, {"t": "abla italiano", "b": false}, {"t": "¿Habla italiano?", "b": true}], [{"t": "Vorrei prenotare una camera", "b": false}, {"t": "kerria reservar una abitasion", "b": false}, {"t": "Querría reservar una habitación", "b": true}], [{"t": "A che ora parte il treno?", "b": false}, {"t": "a kè ora sale el tren", "b": false}, {"t": "¿A qué hora sale el tren?", "b": true}], [{"t": "Dove posso prendere un taxi?", "b": false}, {"t": "donde puedo tomar un taxi", "b": false}, {"t": "¿Dónde puedo tomar un taxi?", "b": true}]]}], "tip": false}, {"title": "Espressioni e slang spagnolo autentico", "blocks": [{"type": "p", "html": "Queste espressioni fanno la differenza tra uno spagnolo «da manuale» e uno spagnolo che suona davvero vissuto. Usale al momento giusto:", "italic": false}, {"type": "table", "headers": ["Significato", "Pronuncia", "Espressione"], "rows": [[{"t": "Va bene/d'accordo", "b": false}, {"t": "vale", "b": false}, {"t": "Vale", "b": true}], [{"t": "Fantastico!", "b": false}, {"t": "kè guai / mola", "b": false}, {"t": "¡Qué guay! / ¡Mola!", "b": true}], [{"t": "Insomma (intercalare molto comune)", "b": false}, {"t": "en plan", "b": false}, {"t": "En plan", "b": true}], [{"t": "Coso/roba (parola generica)", "b": false}, {"t": "kosa", "b": false}, {"t": "Cosa", "b": true}], [{"t": "Ragazzo/tipo (molto colloquiale, Spagna)", "b": false}, {"t": "tio", "b": false}, {"t": "Tío", "b": true}], [{"t": "Non fa niente", "b": false}, {"t": "no pasa nada", "b": false}, {"t": "No pasa nada", "b": true}], [{"t": "Fico (molto usato dai giovani)", "b": false}, {"t": "molon", "b": false}, {"t": "Molón", "b": true}]]}], "tip": false}, {"title": "Dialogo pratico completo", "blocks": [{"type": "p", "html": "Un dialogo semplice in un caffè — leggilo ad alta voce più volte e prova a imitare la pronuncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Camarero:", "orig": "¡Hola! Bienvenido. ¿Qué va a tomar?", "trans": "Ciao! Benvenuto. Cosa desidera?"}, {"speaker": "Cliente:", "orig": "¡Hola! Querría un café, por favor.", "trans": "Ciao! Vorrei un caffè, per favore."}, {"speaker": "Camarero:", "orig": "¿Algo más?", "trans": "Altro?"}, {"speaker": "Cliente:", "orig": "No, y la cuenta, por favor.", "trans": "No, e il conto, per favore."}, {"speaker": "Camarero:", "orig": "Son dos euros. ¡Gracias!", "trans": "Sono due euro. Grazie!"}, {"speaker": "Cliente:", "orig": "De nada, ¡hasta pronto!", "trans": "Prego, a presto!"}]}], "tip": false}, {"title": "Piano d'azione: come imparare in fretta", "blocks": [{"type": "list", "label": "7 passi per progredire velocemente", "intro": null, "items": ["Ascolta musica e guarda serie spagnole ogni giorno, anche solo 10 minuti.", "Pratica lo «shadowing»: ascolta una frase breve e ripetila subito con lo stesso ritmo.", "Allena la r arrotata e la jota davanti allo specchio — l'italiano ti aiuta molto, sono già suoni vicini alla tua lingua.", "Non tradurre nella tua testa — prova a pensare direttamente in spagnolo.", "Usa un'app come Duolingo o Babbel insieme a questo libro per rinforzare il vocabolario.", "Parla fin dal primo giorno, anche se sbagli — la scioltezza viene dalla pratica.", "Distingui bene ser ed estar fin dall'inizio — è la base di ogni frase corretta."]}], "tip": true}, {"title": "Introduzione: per chi è questo libro?", "blocks": [{"type": "p", "html": "Questo libro è la seconda parte dopo «Imparare lo Spagnolo — Facile, Divertente e Veloce», che ha coperto le basi. Se hai già finito il livello base e vuoi raggiungere un livello che ti permetta davvero di cavartela in viaggio, al lavoro e nella vita quotidiana in Spagna, questo libro ti darà: i tempi verbali di cui hai bisogno, vocabolario pratico, e dialoghi realistici.", "italic": false}, {"type": "list", "label": "Prima di iniziare", "intro": null, "items": ["Dovresti già conoscere: saluti, pronomi, ser/estar, la coniugazione del presente e i numeri — tutto questo è nel libro base.", "Il nostro obiettivo qui non è insegnarti tutto sulla lingua, ma darti abbastanza strumenti per cavartela da solo.", "Vai con calma in ogni capitolo, e pratica gli esempi ad alta voce."]}], "tip": false, "dividerBefore": true}, {"title": "Ripasso veloce del livello base", "blocks": [{"type": "table", "headers": ["yo", "tú", "él/ella", "nosotros", "vosotros/ellos"], "rows": [[{"t": "io", "b": false}, {"t": "tu", "b": false}, {"t": "lui/lei", "b": false}, {"t": "noi", "b": false}, {"t": "voi/loro", "b": true}]]}, {"type": "h3", "text": "Presente — gli schemi regolari"}, {"type": "table", "headers": ["Pronome", "-ar (hablar)", "-er (comer)", "-ir (vivir)"], "rows": [[{"t": "yo", "b": false}, {"t": "hablo", "b": false}, {"t": "como", "b": false}, {"t": "vivo", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "comemos", "b": false}, {"t": "vivimos", "b": true}], [{"t": "ellos", "b": false}, {"t": "hablan", "b": false}, {"t": "comen", "b": false}, {"t": "viven", "b": true}]]}], "tip": false}, {"title": "Il passato: Pretérito Indefinido e Imperfecto", "blocks": [{"type": "p", "html": "Lo spagnolo, come l'italiano, distingue un'azione puntuale e conclusa (Pretérito Indefinido, simile al passato remoto/prossimo) da un'azione abituale o descrittiva (Imperfecto, simile all'imperfetto). È un tempo semplice, senza ausiliare:", "italic": false}, {"type": "table", "headers": ["Pronome", "hablar → Indefinido", "ir → Indefinido"], "rows": [[{"t": "yo", "b": false}, {"t": "hablé", "b": false}, {"t": "fui", "b": true}], [{"t": "tú", "b": false}, {"t": "hablaste", "b": false}, {"t": "fuiste", "b": true}], [{"t": "él/ella", "b": false}, {"t": "habló", "b": false}, {"t": "fue", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "fuimos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaron", "b": false}, {"t": "fueron", "b": true}]]}, {"type": "h3", "text": "L'Imperfecto"}, {"type": "table", "headers": ["Pronome", "hablar → imperfecto"], "rows": [[{"t": "yo", "b": false}, {"t": "hablaba", "b": true}], [{"t": "tú", "b": false}, {"t": "hablabas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hablaba", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablábamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaban", "b": true}]]}, {"type": "p", "html": "Esempio: Cuando era pequeño, vivía en Roma (Imperfecto: descrizione) — Ayer fui al mercado (Indefinido: fatto puntuale). Attenzione: a differenza dell'italiano, lo spagnolo usa il passato composto (Pretérito Perfecto: he hablado) soprattutto per un passato molto recente o ancora legato al presente, e preferisce l'Indefinido per la maggior parte dei racconti.", "italic": false}], "tip": false}, {"title": "Il futuro e il condizionale", "blocks": [{"type": "table", "headers": ["Uso", "Formazione", "Esempio"], "rows": [[{"t": "Futuro prossimo (intenzione)", "b": false}, {"t": "ir a + infinito", "b": false}, {"t": "Voy a salir mañana — Sto per uscire domani", "b": true}], [{"t": "Futuro semplice (previsione)", "b": false}, {"t": "infinito + terminazioni -é, -ás, -á, -emos, -án", "b": false}, {"t": "Saldré el año que viene — Uscirò l'anno prossimo", "b": true}], [{"t": "Condizionale (ipotesi, cortesia)", "b": false}, {"t": "infinito + terminazioni -ía, -ías, -ía, -íamos, -ían", "b": false}, {"t": "Querría un café — Vorrei un caffè", "b": true}]]}], "tip": false}, {"title": "Verbi pronominali e pronomi complemento", "blocks": [{"type": "table", "headers": ["Pronome soggetto", "Pronome riflessivo", "lavarse (lavarsi)"], "rows": [[{"t": "yo", "b": false}, {"t": "me", "b": false}, {"t": "me lavo", "b": true}], [{"t": "tú", "b": false}, {"t": "te", "b": false}, {"t": "te lavas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "se", "b": false}, {"t": "se lava", "b": true}], [{"t": "nosotros", "b": false}, {"t": "nos", "b": false}, {"t": "nos lavamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "se", "b": false}, {"t": "se lavan", "b": true}]]}, {"type": "p", "html": "I pronomi complemento diretto (me, te, lo/la, nos, os, los/las) e indiretto (me, te, le, nos, os, les) si posizionano prima del verbo coniugato, come in italiano: Lo veo (Lo vedo), Le hablo (Gli/Le parlo). Con un infinito o un gerundio, possono anche attaccarsi alla fine: Quiero verlo / Lo quiero ver.", "italic": false}], "tip": false}, {"title": "Il congiuntivo: le basi indispensabili", "blocks": [{"type": "p", "html": "Il congiuntivo spagnolo è usato molto più spesso che in italiano, soprattutto dopo espressioni di desiderio, dubbio o emozione (querer que, esperar que, es posible que).", "italic": false}, {"type": "table", "headers": ["Pronome", "hablar → congiuntivo presente"], "rows": [[{"t": "yo", "b": false}, {"t": "hable", "b": true}], [{"t": "tú", "b": false}, {"t": "hables", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hable", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablemos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablen", "b": true}]]}, {"type": "p", "html": "Esempio: Espero que hables español pronto — Spero che tu parli spagnolo presto. A differenza dell'italiano, dove a volte si può usare l'infinito, la struttura «que + congiuntivo» è obbligatoria appena cambia il soggetto.", "italic": false}], "tip": false}, {"title": "Comparativi, superlativi e connettori avanzati", "blocks": [{"type": "table", "headers": ["Struttura", "Spagnolo", "Significato"], "rows": [[{"t": "più... di", "b": false}, {"t": "más... que", "b": false}, {"t": "Es más alto que yo", "b": true}], [{"t": "meno... di", "b": false}, {"t": "menos... que", "b": false}, {"t": "Es menos caro que antes", "b": true}], [{"t": "tanto quanto", "b": false}, {"t": "tan... como", "b": false}, {"t": "Es tan rápida como él", "b": true}], [{"t": "il più/la più", "b": false}, {"t": "el más / la más", "b": false}, {"t": "Es el barrio más bonito", "b": true}], [{"t": "tuttavia", "b": false}, {"t": "sin embargo", "b": false}, {"t": "co ks": [{"type": "table", "headers": ["Significato", "Spagnolo"], "rows": [[{"t": "conto corrente", "b": false}, {"t": "cuenta corriente", "b": true}], [{"t": "bancomat", "b": false}, {"t": "cajero automático", "b": true}], [{"t": "tasso di cambio", "b": false}, {"t": "tipo de cambio", "b": true}], [{"t": "Ho perso il mio portafoglio", "b": false}, {"t": "He perdido mi cartera", "b": true}], [{"t": "denuncia", "b": false}, {"t": "denuncia", "b": true}], [{"t": "commissariato", "b": false}, {"t": "comisaría", "b": true}], [{"t": "comune/municipio", "b": false}, {"t": "ayuntamiento", "b": true}], [{"t": "permesso di soggiorno", "b": false}, {"t": "permiso de residencia", "b": true}]]}], "tip": false}, {"title": "Vocabolario: trasporti e indicazioni", "blocks": [{"type": "table", "headers": ["Significato", "Spagnolo"], "rows": [[{"t": "biglietto di sola andata", "b": false}, {"t": "billete de ida", "b": true}], [{"t": "andata e ritorno", "b": false}, {"t": "ida y vuelta", "b": true}], [{"t": "noleggio auto", "b": false}, {"t": "alquiler de coches", "b": true}], [{"t": "Giri a destra", "b": false}, {"t": "Gire a la derecha", "b": true}], [{"t": "Vada dritto", "b": false}, {"t": "Siga todo recto", "b": true}], [{"t": "semaforo", "b": false}, {"t": "semáforo", "b": true}], [{"t": "rotatoria", "b": false}, {"t": "rotonda", "b": true}], [{"t": "binario", "b": false}, {"t": "andén", "b": true}], [{"t": "fermata dell'autobus", "b": false}, {"t": "parada de autobús", "b": true}]]}], "tip": false}, {"title": "Vocabolario: shopping e lavoro", "blocks": [{"type": "table", "headers": ["Significato", "Spagnolo"], "rows": [[{"t": "Può farmi uno sconto?", "b": false}, {"t": "¿Puede hacerme un descuento?", "b": true}], [{"t": "taglia (vestiti)", "b": false}, {"t": "talla", "b": true}], [{"t": "camerino", "b": false}, {"t": "probador", "b": true}], [{"t": "riunione", "b": false}, {"t": "reunión", "b": true}], [{"t": "scadenza", "b": false}, {"t": "fecha límite", "b": true}], [{"t": "candidatura di lavoro", "b": false}, {"t": "candidatura", "b": true}], [{"t": "colloquio", "b": false}, {"t": "entrevista de trabajo", "b": true}], [{"t": "stipendio", "b": false}, {"t": "salario", "b": true}]]}], "tip": false}, {"title": "Galateo: tú o usted?", "blocks": [{"type": "p", "html": "Lo spagnolo distingue tú (informale, amici e famiglia) e usted (formale, sconosciuti, superiori, contesto professionale), che si coniuga alla terza persona singolare. In Spagna, l'uso di tú è più diffuso che in America Latina, a volte anche con sconosciuti in un contesto rilassato.", "italic": false}, {"type": "list", "label": "Regole pratiche", "intro": null, "items": ["Con sconosciuti, superiori, in contesto molto formale: usted.", "Con amici, familiari, e sempre più spesso al lavoro in Spagna: tú.", "Le email formali si aprono con «Estimado/a Señor/a» e si chiudono con «Un cordial saludo»."]}], "tip": false}, {"title": "Espressioni idiomatiche avanzate", "blocks": [{"type": "table", "headers": ["Significato", "Espressione"], "rows": [[{"t": "Costare un occhio della testa", "b": false}, {"t": "Costar un ojo de la cara", "b": true}], [{"t": "Avere la testa fra le nuvole", "b": false}, {"t": "Estar en las nubes", "b": true}], [{"t": "Fare finta di niente", "b": false}, {"t": "Hacerse el sueco", "b": true}], [{"t": "Essere al verde", "b": false}, {"t": "Estar sin blanca", "b": true}], [{"t": "Mettersi nei guai", "b": false}, {"t": "Meterse en un lío", "b": true}], [{"t": "Rompere il ghiaccio", "b": false}, {"t": "Romper el hielo", "b": true}]]}], "tip": false}, {"title": "Dialoghi pratici avanzati", "blocks": [{"type": "p", "html": "Scenario: risolvere un problema in albergo.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Hola, hay un problema con mi habitación, el aire acondicionado no funciona.", "trans": "Buongiorno, c'è un problema con la mia camera, l'aria condizionata non funziona."}, {"speaker": "Recepcionista:", "orig": "Lo siento mucho, voy a enviar a alguien enseguida. ¿Prefiere cambiar de habitación mientras tanto?", "trans": "Mi dispiace molto, mando subito qualcuno. Preferisce cambiare camera nel frattempo?"}, {"speaker": "Cliente:", "orig": "Sí, sería más fácil, gracias.", "trans": "Sì, sarebbe più semplice, grazie."}]}, {"type": "p", "html": "Scenario: dal medico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "¿Qué le pasa?", "trans": "Cosa non va?"}, {"speaker": "Paciente:", "orig": "Me duele la garganta desde hace tres días y tengo un poco de fiebre.", "trans": "Ho mal di gola da tre giorni e ho un po' di febbre."}, {"speaker": "Médico:", "orig": "Le voy a recetar unos medicamentos. Descanse bien.", "trans": "Le prescriverò dei medicinali. Riposi bene."}]}], "tip": false}, {"title": "Conclusione e prossimi passi verso la scioltezza", "blocks": [{"type": "list", "label": "Come continuare a progredire", "intro": null, "items": ["Guarda serie e film spagnoli con sottotitoli in spagnolo per abituare l'orecchio.", "Leggi ogni giorno un breve articolo di un giornale spagnolo online (El País, El Mundo).", "Trova un partner linguistico per fare scambi di conversazione (tandem).", "Scrivi un diario giornaliero di poche frasi in spagnolo.", "Non temere gli errori: la scioltezza vera nasce dalla pratica costante, non dalla perfezione grammaticale."]}], "tip": true}], "closingBasic": "Congratulazioni in anticipo per il tuo viaggio nello spagnolo — ¡Buena suerte! (buona fortuna!)", "closingAdvanced": "Congratulazioni in anticipo per il tuo viaggio nello spagnolo — ¡Buena suerte!"}, "fr": {"chapters": [{"title": "Introduction : pourquoi apprendre l'espagnol ?", "blocks": [{"type": "p", "html": "L'espagnol est la langue officielle de 20 pays, parlée par plus de 500 millions de personnes dans le monde, ce qui en fait la deuxième langue maternelle la plus parlée après le mandarin. Ce livre te donne une base solide en espagnol standard tel qu'on le parle en Espagne.", "italic": false}, {"type": "p", "html": "La bonne nouvelle : l'espagnol se prononce presque exactement comme il s'écrit, sans lettres muettes ni exceptions surprenantes — un vrai soulagement après le français ! La principale difficulté est de bien distinguer certains sons qui n'existent pas en français, comme le « r » roulé ou la « jota ».", "italic": false}, {"type": "list", "label": "Objectifs de ce livre", "intro": null, "items": ["Te donner une base solide de vocabulaire et de grammaire essentielle en un minimum de temps.", "Te concentrer sur une prononciation correcte pour que ton accent sonne authentiquement espagnol.", "Te donner des phrases pratiques utilisables dès le premier jour dans des situations réelles."]}], "tip": false}, {"title": "L'alphabet et les bases de la prononciation", "blocks": [{"type": "p", "html": "L'espagnol utilise l'alphabet latin avec une lettre supplémentaire, le ñ. Chaque lettre se prononce presque toujours de la même façon. Ce tableau présente les sons les plus distinctifs :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Mot"], "rows": [[{"t": "maison", "b": false}, {"t": "ka-za", "b": false}, {"t": "casa", "b": true}], [{"t": "bonjour", "b": false}, {"t": "o-la", "b": false}, {"t": "hola (le h est toujours muet)", "b": true}], [{"t": "merci", "b": false}, {"t": "gra-sias", "b": false}, {"t": "gracias (c devant i/e = « s » en Amérique, « th » en Espagne du nord)", "b": true}], [{"t": "chat", "b": false}, {"t": "ga-to", "b": false}, {"t": "gato", "b": true}], [{"t": "je", "b": false}, {"t": "yo", "b": false}, {"t": "yo", "b": true}], [{"t": "garçon", "b": false}, {"t": "tchi-ko", "b": false}, {"t": "chico", "b": true}], [{"t": "rouge (r roulé)", "b": false}, {"t": "ro-Rrro", "b": false}, {"t": "rojo (j se prononce comme une jota gutturale, la r initiale est roulée)", "b": true}], [{"t": "eau", "b": false}, {"t": "a-goua", "b": false}, {"t": "agua", "b": true}], [{"t": "œuf", "b": false}, {"t": "oué-vo", "b": false}, {"t": "huevo (h muet)", "b": true}], [{"t": "vin", "b": false}, {"t": "vi-no", "b": false}, {"t": "vino", "b": true}]]}], "tip": false}, {"title": "Les règles d'or pour une prononciation authentique", "blocks": [{"type": "p", "html": "Ces 6 règles d'or feront toute la différence pour sonner vraiment espagnol :", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["Le h est toujours muet en espagnol (hola, hotel) — jamais aspiré comme en français.", "Le j, et le g devant e/i, se prononcent avec un son guttural très marqué, proche du « r » français mais produit plus loin dans la gorge (jamón, gente).", "Le r en début de mot, ou le rr, se roule fortement — un vrai défi pour un francophone, à pratiquer devant un miroir.", "Le ll et le y se prononcent souvent comme un « y » (calle → « ka-yé »), sauf en Argentine où ils sonnent plutôt « ch/j ».", "Le ñ se prononce comme le « gn » français de « montagne » (español, niño).", "En Espagne, le c devant e/i et le z se prononcent « th » (comme le th anglais de « think ») — en Amérique latine, ils se prononcent simplement « s »."]}], "tip": false}, {"title": "Salutations et phrases essentielles", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Espagnol"], "rows": [[{"t": "Bonjour (formel/matin)", "b": false}, {"t": "boué-nos di-as", "b": false}, {"t": "Buenos días", "b": true}], [{"t": "Bonsoir", "b": false}, {"t": "boué-nas tar-dés", "b": false}, {"t": "Buenas tardes", "b": true}], [{"t": "Salut (informel)", "b": false}, {"t": "o-la", "b": false}, {"t": "Hola", "b": true}], [{"t": "Comment ça va ?", "b": false}, {"t": "ké tal", "b": false}, {"t": "¿Qué tal?", "b": true}], [{"t": "Bien, merci", "b": false}, {"t": "bien, gra-sias", "b": false}, {"t": "Bien, gracias", "b": true}], [{"t": "Enchanté", "b": false}, {"t": "en-kan-ta-do", "b": false}, {"t": "Encantado", "b": true}], [{"t": "À bientôt", "b": false}, {"t": "as-ta pron-to", "b": false}, {"t": "Hasta pronto", "b": true}], [{"t": "À demain", "b": false}, {"t": "as-ta ma-nya-na", "b": false}, {"t": "Hasta mañana", "b": true}], [{"t": "Au revoir", "b": false}, {"t": "a-dyos", "b": false}, {"t": "Adiós", "b": true}], [{"t": "S'il te plaît", "b": false}, {"t": "por fa-vor", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Merci", "b": false}, {"t": "gra-sias", "b": false}, {"t": "Gracias", "b": true}], [{"t": "De rien", "b": false}, {"t": "dé na-da", "b": false}, {"t": "De nada", "b": true}], [{"t": "Pardon/Excusez-moi", "b": false}, {"t": "per-do-né", "b": false}, {"t": "Perdone", "b": true}], [{"t": "Oui", "b": false}, {"t": "si", "b": false}, {"t": "Sí", "b": true}], [{"t": "Non", "b": false}, {"t": "no", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "Les pronoms et les verbes « ser » et « estar » (être)", "blocks": [{"type": "p", "html": "Comme le portugais et l'italien, mais contrairement au français, l'espagnol distingue « ser » (identité, caractéristique permanente) et « estar » (état temporaire, position).", "italic": false}, {"type": "h3", "text": "Pronoms"}, {"type": "table", "headers": ["Français", "Espagnol"], "rows": [[{"t": "je", "b": false}, {"t": "yo", "b": true}], [{"t": "tu", "b": false}, {"t": "tú", "b": true}], [{"t": "il/elle", "b": false}, {"t": "él / ella", "b": true}], [{"t": "nous", "b": false}, {"t": "nosotros", "b": true}], [{"t": "vous", "b": false}, {"t": "vosotros / ustedes", "b": true}], [{"t": "ils/elles", "b": false}, {"t": "ellos / ellas", "b": true}]]}, {"type": "h3", "text": "ser — être (permanent)"}, {"type": "table", "headers": ["Pronom", "Conjugaison"], "rows": [[{"t": "yo", "b": false}, {"t": "soy", "b": true}], [{"t": "tú", "b": false}, {"t": "eres", "b": true}], [{"t": "él/ella", "b": false}, {"t": "es", "b": true}], [{"t": "nosotros", "b": false}, {"t": "somos", "b": true}], [{"t": "vosotros", "b": false}, {"t": "sois", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "son", "b": true}]]}, {"type": "p", "html": "Exemple : Yo soy francés — Je suis français (identité, permanent). — Yo estoy en Madrid — Je suis (en ce moment) à Madrid (temporaire, avec estar).", "italic": false}], "tip": false}, {"title": "Verbes courants et leur conjugaison", "blocks": [{"type": "p", "html": "Les verbes réguliers espagnols se répartissent en trois groupes selon leur terminaison : -ar, -er, -ir.", "italic": false}, {"type": "table", "headers": ["Pronom", "-ar (hablar)", "-er (comer)", "-ir (vivir)"], "rows": [[{"t": "yo", "b": false}, {"t": "hablo", "b": false}, {"t": "como", "b": false}, {"t": "vivo", "b": true}], [{"t": "tú", "b": false}, {"t": "hablas", "b": false}, {"t": "comes", "b": false}, {"t": "vives", "b": true}], [{"t": "él/ella", "b": false}, {"t": "habla", "b": false}, {"t": "come", "b": false}, {"t": "vive", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "comemos", "b": false}, {"t": "vivimos", "b": true}], [{"t": "vosotros", "b": false}, {"t": "habláis", "b": false}, {"t": "coméis", "b": false}, {"t": "vivís", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablan", "b": false}, {"t": "comen", "b": false}, {"t": "viven", "b": true}]]}, {"type": "h3", "text": "Verbes irréguliers importants (forme « yo »)"}, {"type": "table", "headers": ["Signification", "yo", "Verbe"], "rows": [[{"t": "avoir", "b": false}, {"t": "tengo", "b": false}, {"t": "tener", "b": true}], [{"t": "aller", "b": false}, {"t": "voy", "b": false}, {"t": "ir", "b": true}], [{"t": "faire", "b": false}, {"t": "hago", "b": false}, {"t": "hacer", "b": true}], [{"t": "pouvoir", "b": false}, {"t": "puedo", "b": false}, {"t": "poder", "b": true}], [{"t": "vouloir", "b": false}, {"t": "quiero", "b": false}, {"t": "querer", "b": true}], [{"t": "savoir", "b": false}, {"t": "sé", "b": false}, {"t": "saber", "b": true}]]}], "tip": false}, {"title": "Les nombres de 0 à 100", "blocks": [{"type": "table", "headers": ["N°", "Espagnol", "N°", "Espagnol"], "rows": [[{"t": " e}, {"t": "té", "b": false}, {"t": "té", "b": true}], [{"t": "viande", "b": false}, {"t": "kar-né", "b": false}, {"t": "carne", "b": true}], [{"t": "poulet", "b": false}, {"t": "po-yo", "b": false}, {"t": "pollo", "b": true}], [{"t": "poisson", "b": false}, {"t": "pes-ka-do", "b": false}, {"t": "pescado", "b": true}], [{"t": "fromage", "b": false}, {"t": "ké-so", "b": false}, {"t": "queso", "b": true}], [{"t": "fruit", "b": false}, {"t": "fru-ta", "b": false}, {"t": "fruta", "b": true}], [{"t": "légumes", "b": false}, {"t": "vér-du-ras", "b": false}, {"t": "verduras", "b": true}], [{"t": "dessert", "b": false}, {"t": "pos-tré", "b": false}, {"t": "postre", "b": true}], [{"t": "petit-déjeuner", "b": false}, {"t": "dé-sa-you-no", "b": false}, {"t": "desayuno", "b": true}], [{"t": "déjeuner", "b": false}, {"t": "kom-i-da", "b": false}, {"t": "comida", "b": true}], [{"t": "dîner", "b": false}, {"t": "sé-na", "b": false}, {"t": "cena", "b": true}]]}], "tip": false}, {"title": "Phrases essentielles pour voyager et à l'hôtel", "blocks": [{"type": "table", "headers": ["Signification", "Prononciation", "Espagnol"], "rows": [[{"t": "Où se trouve...?", "b": false}, {"t": "don-dé és-ta", "b": false}, {"t": "¿Dónde está...?", "b": true}], [{"t": "Combien ça coûte ?", "b": false}, {"t": "kouan-to koues-ta", "b": false}, {"t": "¿Cuánto cuesta?", "b": true}], [{"t": "Puis-je voir le menu ?", "b": false}, {"t": "poué-do vér el mé-nu", "b": false}, {"t": "¿Puedo ver el menú?", "b": true}], [{"t": "L'addition, s'il vous plaît", "b": false}, {"t": "la kouen-ta, por fa-vor", "b": false}, {"t": "La cuenta, por favor", "b": true}], [{"t": "Où sont les toilettes ?", "b": false}, {"t": "don-dé és-tan los ba-nyos", "b": false}, {"t": "¿Dónde están los baños?", "b": true}], [{"t": "J'ai besoin d'aide", "b": false}, {"t": "né-sé-si-to a-you-da", "b": false}, {"t": "Necesito ayuda", "b": true}], [{"t": "Je ne comprends pas", "b": false}, {"t": "no en-tien-do", "b": false}, {"t": "No entiendo", "b": true}], [{"t": "Pouvez-vous répéter, s'il vous plaît ?", "b": false}, {"t": "poué-dé ré-pé-tir", "b": false}, {"t": "¿Puede repetir, por favor?", "b": true}], [{"t": "Parlez-vous anglais ?", "b": false}, {"t": "a-bla in-glés", "b": false}, {"t": "¿Habla inglés?", "b": true}], [{"t": "Je voudrais réserver une chambre", "b": false}, {"t": "ké-rri-a ré-sér-var ou-na a-bi-ta-sion", "b": false}, {"t": "Querría reservar una habitación", "b": true}], [{"t": "À quelle heure part le train ?", "b": false}, {"t": "a ké o-ra sa-lé el trén", "b": false}, {"t": "¿A qué hora sale el tren?", "b": true}], [{"t": "Où puis-je prendre un taxi ?", "b": false}, {"t": "don-dé poué-do to-mar oun tak-si", "b": false}, {"t": "¿Dónde puedo tomar un taxi?", "b": true}]]}], "tip": false}, {"title": "Expressions et argot espagnol authentique", "blocks": [{"type": "p", "html": "Ces expressions font la différence entre un espagnol « scolaire » et un espagnol qui sonne vraiment vécu. Utilise-les au bon moment :", "italic": false}, {"type": "table", "headers": ["Signification", "Prononciation", "Expression"], "rows": [[{"t": "D'accord/ça marche", "b": false}, {"t": "va-lé", "b": false}, {"t": "Vale", "b": true}], [{"t": "Génial !", "b": false}, {"t": "ké gé-nial / mo-lon", "b": false}, {"t": "¡Qué guay! / ¡Mola!", "b": true}], [{"t": "Franchement (intercalaire très courant)", "b": false}, {"t": "en pla-n", "b": false}, {"t": "En plan", "b": true}], [{"t": "Truc/chose (mot générique)", "b": false}, {"t": "ko-za", "b": false}, {"t": "Cosa", "b": true}], [{"t": "Mec/Type (très familier, Espagne)", "b": false}, {"t": "tio", "b": false}, {"t": "Tío", "b": true}], [{"t": "Ce n'est pas grave", "b": false}, {"t": "no pa-sa na-da", "b": false}, {"t": "No pasa nada", "b": true}], [{"t": "Trop cool (très courant chez les jeunes)", "b": false}, {"t": "mo-lon", "b": false}, {"t": "Molón", "b": true}]]}], "tip": false}, {"title": "Dialogue pratique complet", "blocks": [{"type": "p", "html": "Un dialogue simple dans un café — lis-le à voix haute plusieurs fois et essaie d'imiter la prononciation :", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Camarero:", "orig": "¡Hola! Bienvenido. ¿Qué va a tomar?", "trans": "Bonjour ! Bienvenue. Que désirez-vous ?"}, {"speaker": "Cliente:", "orig": "¡Hola! Querría un café, por favor.", "trans": "Bonjour ! Je voudrais un café, s'il vous plaît."}, {"speaker": "Camarero:", "orig": "¿Algo más?", "trans": "Autre chose ?"}, {"speaker": "Cliente:", "orig": "No, y la cuenta, por favor.", "trans": "Non, et l'addition, s'il vous plaît."}, {"speaker": "Camarero:", "orig": "Son dos euros. ¡Gracias!", "trans": "Ça fait deux euros. Merci !"}, {"speaker": "Cliente:", "orig": "De nada, ¡hasta pronto!", "trans": "De rien, à bientôt !"}]}], "tip": false}, {"title": "Plan d'action : comment apprendre vite", "blocks": [{"type": "list", "label": "7 étapes pour progresser rapidement", "intro": null, "items": ["Écoute de la musique et des séries espagnoles chaque jour, même 10 minutes.", "Pratique le « shadowing » : écoute une phrase courte et répète-la immédiatement au même rythme.", "Entraîne le r roulé et la jota devant un miroir — ce sont les deux plus gros défis pour un francophone.", "Ne traduis pas dans ta tête — essaie de penser directement en espagnol.", "Utilise une application comme Duolingo ou Babbel en complément de ce livre pour renforcer le vocabulaire.", "Parle dès le premier jour, même en faisant des erreurs — la fluidité vient de la pratique.", "Fais bien la distinction entre ser et estar dès le début — c'est la base de toute phrase correcte."]}], "tip": true}, {"title": "Introduction : pour qui est ce livre ?", "blocks": [{"type": "p", "html": "Ce livre est la suite de « Apprendre l'Espagnol — Facile, Amusant et Rapide », qui couvrait les bases. Si tu as terminé le niveau de base et veux atteindre un niveau où tu peux vraiment te débrouiller en voyage, au travail et dans la vie quotidienne en Espagne, ce livre va te donner : les temps verbaux dont tu as besoin, du vocabulaire pratique, et des dialogues réalistes.", "italic": false}, {"type": "list", "label": "Avant de commencer", "intro": null, "items": ["Tu devrais déjà connaître : les salutations, les pronoms, ser/estar, la conjugaison au présent, et les nombres — tout cela est dans le livre de base.", "Notre objectif ici n'est pas de tout t'enseigner sur la langue, mais de te donner assez d'outils pour te débrouiller seul.", "Prends ton temps dans chaque chapitre, et entraîne-toi à voix haute sur les exemples."]}], "tip": false, "dividerBefore": true}, {"title": "Révision rapide du niveau de base", "blocks": [{"type": "table", "headers": ["yo", "tú", "él/ella", "nosotros", "vosotros/ellos"], "rows": [[{"t": "je", "b": false}, {"t": "tu", "b": false}, {"t": "il/elle", "b": false}, {"t": "nous", "b": false}, {"t": "vous/ils", "b": true}]]}, {"type": "h3", "text": "Présent — les schémas réguliers"}, {"type": "table", "headers": ["Pronom", "-ar (hablar)", "-er (comer)", "-ir (vivir)"], "rows": [[{"t": "yo", "b": false}, {"t": "hablo", "b": false}, {"t": "como", "b": false}, {"t": "vivo", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "comemos", "b": false}, {"t": "vivimos", "b": true}], [{"t": "ellos", "b": false}, {"t": "hablan", "b": false}, {"t": "comen", "b": false}, {"t": "viven", "b": true}]]}], "tip": false}, {"title": "Le passé : Pretérito Indefinido et Imperfecto", "blocks": [{"type": "p", "html": "L'espagnol, comme le français, distingue une action ponctuelle et achevée (Pretérito Indefinido, comme le passé composé/simple) d'une action habituelle ou descriptive (Imperfecto, comme l'imparfait). C'est un temps simple, sans auxiliaire :", "italic": false}, {"type": "table", "headers": ["Pronom", "hablar → Indefinido", "ir → Indefinido"], "rows": [[{"t": "yo", "b": false}, {"t": "hablé", "b": false}, {"t": "fui", "b": true}], [{"t": "tú", "b": false}, {"t": "hablaste", "b": false}, {"t": "fuiste", "b": true}], [{"t": "él/ella", "b": false}, {"t": "habló", "b": false}, {"t": "fue", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "fuimos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaron", "b": false}, {"t": "fueron", "b": true}]]}, {"type": "h3", "text": "L'Imperfecto"}, {"type": "table", "headers": ["Pronom", "hablar → imperfecto"], "rows": [[{"t": "yo", "b": false}, {"t": "hablaba", "b": true}], [{"t": "tú", "b": false}, {"t": "hablabas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hablaba", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablábamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaban", "b": true}]]}, {"type": "p", "html": "Exemple : Cuando era pequeño, vivía en París (Imperfecto : description) — Ayer fui al mercado (Indefinido : fait ponctuel). Attention : contrairement au français, l'espagnol utilise le passé composé (Pretérito Perfecto : he hablado) surtout pour un passé très récent ou encore lié au présent, et préfère l'Indefinido pour la plupart des récits.", "italic": false}], "tip": false}, {"title": "Le futur et le conditionnel", "blocks": [{"type": "table", "headers": ["Usage", "Formation", "Exemple"], "rows": [[{"t": "Futur proche (intention)", "b": false}, {"t": "ir a + infinitif", "b": false}, {"t": "Voy a salir mañana — Je vais sortir demain", "b": true}], [{"t": "Futur simple (prévision)", "b": false}, {"t": "infinitif + terminaisons -é, -ás, -á, -emos, -án", "b": false}, {"t": "Saldré el año que viene — Je sortirai l'année prochaine", "b": true}], [{"t": "Conditionnel (hypothèse, politesse)", "b": false}, {"t": "infinitif + terminaisons -ía, -ías, -ía, -íamos, -ían", "b": false}, {"t": "Querría un café — Je voudrais un café", "b": true}]]}], "tip": false}, {"title": "Verbes pronominaux et pronoms compléments", "blocks": [{"type": "table", "headers": ["Pronom sujet", "Pronom réfléchi", "lavarse (se laver)"], "rows": [[{"t": "yo", "b": false}, {"t": "me", "b": false}, {"t": "me lavo", "b": true}], [{"t": "tú", "b": false}, {"t": "te", "b": false}, {"t": "te lavas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "se", "b": false}, {"t": "se lava", "b": true}], [{"t": "nosotros", "b": false}, {"t": "nos", "b": false}, {"t": "nos lavamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "se", "b": false}, {"t": "se lavan", "b": true}]]}, {"type": "p", "html": "Les pronoms compléments directs (me, te, lo/la, nos, os, los/las) et indirects (me, te, le, nos, os, les) se placent avant le verbe conjugué, comme en français : Lo veo (Je le vois), Le hablo (Je lui parle). Avec un infinitif ou un gérondif, ils peuvent aussi se coller à la fin : Quiero verlo / Lo quiero ver.", "italic": false}], "tip": false}, {"title": "Le subjonctif : les bases indispensables", "blocks": [{"type": "p", "html": "Le subjonctif espagnol est beaucoup plus utilisé qu'en français, surtout après des expressions de souhait, de doute ou d'émotion (querer que, esperar que, es posible que).", "italic": false}, {"type": "table", "headers": ["Pronom", "hablar → subjonctif présent"], "rows": [[{"t": "yo", "b": false}, {"t": "hable", "b": true}], [{"t": "tú", "b": false}, {"t": "hables", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hable", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablemos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablen", "b": true}]]}, {"type": "p", "html": "Exemple : Espero que hables español pronto — J'espère que tu parleras espagnol bientôt. Contrairement au français, on ne peut pas utiliser l'infinitif ici : la structure « que + subjonctif » est obligatoire dès qu'il y a un changement de sujet.", "italic": false}], "tip": false}, {"title": "Comparatifs, superlatifs et connecteurs avancés", "blocks": [{"type": "table", "headers": ["Structure", "Espagnol", "Signification"], "rows": [[{"t": "plus... que", "b": false}, {"t": "más... que", "b": false}, {"t": "Es más alto que yo", "b": true}], [{"t
