tle": "Vocabulaire : shopping et travail", "blocks": [{"type": "table", "headers": ["Signification", "Espagnol"], "rows": [[{"t": "Pouvez-vous me faire une remise ?", "b": false}, {"t": "¿Puede hacerme un descuento?", "b": true}], [{"t": "taille (vêtements)", "b": false}, {"t": "talla", "b": true}], [{"t": "cabine d'essayage", "b": false}, {"t": "probador", "b": true}], [{"t": "réunion", "b": false}, {"t": "reunión", "b": true}], [{"t": "date limite", "b": false}, {"t": "fecha límite", "b": true}], [{"t": "candidature", "b": false}, {"t": "candidatura", "b": true}], [{"t": "entretien d'embauche", "b": false}, {"t": "entrevista de trabajo", "b": true}], [{"t": "salaire", "b": false}, {"t": "salario", "b": true}]]}], "tip": false}, {"title": "Étiquette : tú ou usted ?", "blocks": [{"type": "p", "html": "L'espagnol distingue tú (informel, amis et famille) et usted (formel, inconnus, supérieurs, contexte professionnel), qui se conjugue à la troisième personne du singulier. En Espagne, l'usage de tú est plus répandu qu'en Amérique latine, y compris parfois avec des inconnus dans un contexte détendu.", "italic": false}, {"type": "list", "label": "Règles pratiques", "intro": null, "items": ["Avec des inconnus, des supérieurs, en contexte très formel : usted.", "Avec des amis, la famille, et de plus en plus au travail en Espagne : tú.", "Les e-mails formels s'ouvrent par « Estimado/a Señor/a » et se terminent par « Un cordial saludo »."]}], "tip": false}, {"title": "Expressions idiomatiques avancées", "blocks": [{"type": "table", "headers": ["Signification", "Expression"], "rows": [[{"t": "Coûter les yeux de la tête", "b": false}, {"t": "Costar un ojo de la cara", "b": true}], [{"t": "Avoir la tête ailleurs", "b": false}, {"t": "Estar en las nubes", "b": true}], [{"t": "Faire comme si de rien n'était", "b": false}, {"t": "Hacerse el sueco", "b": true}], [{"t": "Être fauché", "b": false}, {"t": "Estar sin blanca", "b": true}], [{"t": "Se mettre dans le pétrin", "b": false}, {"t": "Meterse en un lío", "b": true}], [{"t": "Casser la glace", "b": false}, {"t": "Romper el hielo", "b": true}]]}], "tip": false}, {"title": "Dialogues pratiques avancés", "blocks": [{"type": "p", "html": "Scénario : régler un problème à l'hôtel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Hola, hay un problema con mi habitación, el aire acondicionado no funciona.", "trans": "Bonjour, il y a un problème avec ma chambre, la climatisation ne fonctionne pas."}, {"speaker": "Recepcionista:", "orig": "Lo siento mucho, voy a enviar a alguien enseguida. ¿Prefiere cambiar de habitación mientras tanto?", "trans": "Je suis vraiment désolée, j'envoie quelqu'un tout de suite. Préférez-vous changer de chambre en attendant ?"}, {"speaker": "Cliente:", "orig": "Sí, sería más fácil, gracias.", "trans": "Oui, ce serait plus simple, merci."}]}, {"type": "p", "html": "Scénario : chez le médecin.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "¿Qué le pasa?", "trans": "Qu'est-ce qui ne va pas ?"}, {"speaker": "Paciente:", "orig": "Me duele la garganta desde hace tres días y tengo un poco de fiebre.", "trans": "J'ai mal à la gorge depuis trois jours et j'ai un peu de fièvre."}, {"speaker": "Médico:", "orig": "Le voy a recetar unos medicamentos. Descanse bien.", "trans": "Je vais vous prescrire des médicaments. Reposez-vous bien."}]}], "tip": false}, {"title": "Conclusion et prochaines étapes vers la fluidité", "blocks": [{"type": "list", "label": "Comment continuer à progresser", "intro": null, "items": ["Regarde des séries et des films espagnols avec des sous-titres en espagnol pour habituer ton oreille.", "Lis chaque jour un court article d'un journal espagnol en ligne (El País, El Mundo).", "Trouve un partenaire linguistique pour des échanges de conversation (tandem).", "Tiens un petit journal quotidien de quelques phrases en espagnol.", "N'aie pas peur des erreurs : la vraie fluidité vient de la pratique constante, pas de la perfection grammaticale."]}], "tip": true}], "closingBasic": "Félicitations d'avance pour ton parcours en espagnol — ¡Buena suerte! (bonne chance !)", "closingAdvanced": "Felicidades por adelantado por tu camino en español — ¡Buena suerte!"}, "pt": {"chapters": [{"title": "Introdução: porque aprender espanhol?", "blocks": [{"type": "p", "html": "O espanhol é língua oficial em 20 países, falado por mais de 500 milhões de pessoas no mundo, o que o torna a segunda língua materna mais falada depois do mandarim. Este livro dá-te uma base sólida no espanhol padrão falado em Espanha.", "italic": false}, {"type": "p", "html": "A boa notícia: o espanhol pronuncia-se quase exatamente como se escreve, sem letras mudas nem exceções surpreendentes — e o vocabulário vai parecer-te muitas vezes familiar, já que o português e o espanhol são línguas irmãs. A principal dificuldade é distinguir bem alguns sons que não existem em português, como o «r» fortemente vibrado ou a «jota».", "italic": false}, {"type": "list", "label": "Objetivos deste livro", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Concentrarmo-nos na pronúncia correta para que o teu sotaque soe autenticamente espanhol.", "Dar-te frases práticas para usares desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e as bases da pronúncia", "blocks": [{"type": "p", "html": "O espanhol usa o alfabeto latino com uma letra extra, o ñ. Cada letra pronuncia-se quase sempre da mesma forma. Esta tabela apresenta os sons mais distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "kasa", "b": false}, {"t": "casa", "b": true}], [{"t": "olá", "b": false}, {"t": "ola", "b": false}, {"t": "hola (o h é sempre mudo)", "b": true}], [{"t": "obrigado", "b": false}, {"t": "grasias", "b": false}, {"t": "gracias (c antes de i/e = «s» na América, «th» no norte de Espanha)", "b": true}], [{"t": "gato", "b": false}, {"t": "gato", "b": false}, {"t": "gato", "b": true}], [{"t": "eu", "b": false}, {"t": "yo", "b": false}, {"t": "yo", "b": true}], [{"t": "rapaz", "b": false}, {"t": "chico", "b": false}, {"t": "chico", "b": true}], [{"t": "vermelho (r vibrante)", "b": false}, {"t": "ro-Rro", "b": false}, {"t": "rojo (j pronuncia-se como uma jota gutural forte, o r inicial é vibrante)", "b": true}], [{"t": "água", "b": false}, {"t": "agua", "b": false}, {"t": "agua", "b": true}], [{"t": "ovo", "b": false}, {"t": "uévo", "b": false}, {"t": "huevo (h mudo)", "b": true}], [{"t": "vinho", "b": false}, {"t": "vino", "b": false}, {"t": "vino", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro fazem toda a diferença para soares realmente espanhol:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["O h é sempre mudo em espanhol (hola, hotel) — nunca aspirado.", "O j, e o g antes de e/i, pronunciam-se com um som gutural muito marcado, produzido mais atrás na garganta.", "O r no início de palavra, ou o rr, é fortemente vibrante — pratica-o em frente ao espelho.", "O ll e o y pronunciam-se muitas vezes como um «i» semiconsoante (calle → «ka-ye»), exceto na Argentina onde soam mais «ch/j».", "O ñ pronuncia-se como o «nh» português de «senhor» (español, niño) — já um som que conheces!", "Em Espanha, o c antes de e/i e o z pronunciam-se «th» (como o th inglês de «think») — na América Latina pronunciam-se simplesmente «s»."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Espanhol"], "rows": [[{"t": "Bom dia (formal)", "b": false}, {"t": "buénos días", "b": false}, {"t": "Buenos días", "b": true}], [{"t": "Boa tarde", "b": false}, {"t": "buénas tárdes", "b": false}, {"t": "Buenas tardes", "b": true}], [{"t": "Olá (in p": false}, {"title": "Diálogo prático completo", "blocks": [{"type": "p", "html": "Um diálogo simples num café — lê-o em voz alta várias vezes e tenta imitar a pronúncia:", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Empregado:", "orig": "¡Hola! Bienvenido. ¿Qué va a tomar?", "trans": "Olá! Bem-vindo. O que deseja?"}, {"speaker": "Cliente:", "orig": "¡Hola! Querría un café, por favor.", "trans": "Olá! Queria um café, por favor."}, {"speaker": "Empregado:", "orig": "¿Algo más?", "trans": "Mais alguma coisa?"}, {"speaker": "Cliente:", "orig": "No, y la cuenta, por favor.", "trans": "Não, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "Son dos euros. ¡Gracias!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "De nada, ¡hasta pronto!", "trans": "De nada, até já!"}]}], "tip": false}, {"title": "Plano de ação: como aprender depressa", "blocks": [{"type": "list", "label": "7 passos para progredir rapidamente", "intro": null, "items": ["Ouve música e vê séries espanholas todos os dias, mesmo que só 10 minutos.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo.", "Treina o r vibrante e a jota em frente ao espelho.", "Não traduzas na tua cabeça — tenta pensar diretamente em espanhol.", "Usa uma aplicação como o Duolingo ou o Babbel juntamente com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo que erres — a fluência vem da prática.", "Distingue bem ser e estar desde o início — é a base de qualquer frase correta."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Espanhol — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível que te permita realmente desenvencilhares-te a viajar, a trabalhar e no dia a dia em Espanha, este livro vai dar-te: os tempos verbais de que precisas, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "Antes de começar", "intro": null, "items": ["Já deves conhecer: cumprimentos, pronomes, ser/estar, a conjugação no presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenvencilhares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de passares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "table", "headers": ["yo", "tú", "él/ella", "nosotros", "vosotros/ellos"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vocês/eles", "b": true}]]}, {"type": "h3", "text": "Presente — os padrões regulares"}, {"type": "table", "headers": ["Pronome", "-ar (hablar)", "-er (comer)", "-ir (vivir)"], "rows": [[{"t": "yo", "b": false}, {"t": "hablo", "b": false}, {"t": "como", "b": false}, {"t": "vivo", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "comemos", "b": false}, {"t": "vivimos", "b": true}], [{"t": "ellos", "b": false}, {"t": "hablan", "b": false}, {"t": "comen", "b": false}, {"t": "viven", "b": true}]]}], "tip": false}, {"title": "O passado: Pretérito Indefinido e Imperfecto", "blocks": [{"type": "p", "html": "O espanhol distingue uma ação pontual e concluída (Pretérito Indefinido, próximo do pretérito perfeito simples) de um passado habitual ou descritivo (Imperfecto, próximo do pretérito imperfeito). É um tempo simples, sem verbo auxiliar:", "italic": false}, {"type": "table", "headers": ["Pronome", "hablar → Indefinido", "ir → Indefinido"], "rows": [[{"t": "yo", "b": false}, {"t": "hablé", "b": false}, {"t": "fui", "b": true}], [{"t": "tú", "b": false}, {"t": "hablaste", "b": false}, {"t": "fuiste", "b": true}], [{"t": "él/ella", "b": false}, {"t": "habló", "b": false}, {"t": "fue", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "fuimos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaron", "b": false}, {"t": "fueron", "b": true}]]}, {"type": "h3", "text": "O Imperfecto"}, {"type": "table", "headers": ["Pronome", "hablar → imperfecto"], "rows": [[{"t": "yo", "b": false}, {"t": "hablaba", "b": true}], [{"t": "tú", "b": false}, {"t": "hablabas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hablaba", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablábamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaban", "b": true}]]}, {"type": "p", "html": "Exemplo: Cuando era pequeño, vivía en Lisboa (Imperfecto: descrição) — Ayer fui al mercado (Indefinido: facto pontual). Nota: o espanhol também tem um Pretérito Perfecto (he hablado), usado sobretudo para um passado muito recente ainda ligado ao presente — a maioria das narrações usa o Indefinido.", "italic": false}], "tip": false}, {"title": "O futuro e o condicional", "blocks": [{"type": "table", "headers": ["Uso", "Formação", "Exemplo"], "rows": [[{"t": "Futuro próximo (intenção)", "b": false}, {"t": "ir a + infinitivo", "b": false}, {"t": "Voy a salir mañana — Vou sair amanhã", "b": true}], [{"t": "Futuro simples (previsão)", "b": false}, {"t": "infinitivo + terminações -é, -ás, -á, -emos, -án", "b": false}, {"t": "Saldré el año que viene — Sairei no próximo ano", "b": true}], [{"t": "Condicional (hipótese, cortesia)", "b": false}, {"t": "infinitivo + terminações -ía, -ías, -ía, -íamos, -ían", "b": false}, {"t": "Querría un café — Gostaria de um café", "b": true}]]}], "tip": false}, {"title": "Verbos pronominais e pronomes complemento", "blocks": [{"type": "table", "headers": ["Pronome sujeito", "Pronome reflexivo", "lavarse (lavar-se)"], "rows": [[{"t": "yo", "b": false}, {"t": "me", "b": false}, {"t": "me lavo", "b": true}], [{"t": "tú", "b": false}, {"t": "te", "b": false}, {"t": "te lavas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "se", "b": false}, {"t": "se lava", "b": true}], [{"t": "nosotros", "b": false}, {"t": "nos", "b": false}, {"t": "nos lavamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "se", "b": false}, {"t": "se lavan", "b": true}]]}, {"type": "p", "html": "Os pronomes complemento direto (me, te, lo/la, nos, os, los/las) e indireto (me, te, le, nos, os, les) colocam-se antes do verbo conjugado: Lo veo (Vejo-o), Le hablo (Falo-lhe). Com um infinitivo ou gerúndio, também se podem colar ao fim: Quiero verlo / Lo quiero ver.", "italic": false}], "tip": false}, {"title": "O conjuntivo: as bases indispensáveis", "blocks": [{"type": "p", "html": "O conjuntivo espanhol é usado com muito mais frequência do que o seu equivalente português, sobretudo depois de expressões de desejo, dúvida ou emoção (querer que, esperar que, es posible que).", "italic": false}, {"type": "table", "headers": ["Pronome", "hablar → conjuntivo presente"], "rows": [[{"t": "yo", "b": false}, {"t": "hable", "b": true}], [{"t": "tú", "b": false}, {"t": "hables", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hable", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablemos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablen", "b": true}]]}, {"type": "p", "html": "Exemplo: Espero que hables español pronto — Espero que fales espanhol em breve. A estrutura «que + conjuntivo» é obrigatória sempre que o sujeito muda, tal como em português.", "italic": false}], "tip": false}, {"title": "Comparativos, superlativos e conectores avançados", "blocks": [{"type": "table", "headers": ["Estrutura", "Espanhol", "Significado"], "rows": [[{"t": "mais... que", "b": false}, {"t": "más... que", "b": false}, {"t": "Es más alto que yo", "b": true}], [{"t": "menos... que", "b": false}, {"t": "menos... que", "b": false}, {"t": "Es menos caro que antes", "b": true}], [{"t": "tão... como", "b": false}, {"t": "tan... como", "b": false}, {"t": "Es tan rápida como él", "b": true}], [{"t": "o mais/a mais", "b": false}, {"t": "el más / la más", "b": false}, {"t": "Es el barrio más bonito", "b": true}], [{"t": "no entanto", "b": false}, {"t": "sin embargo", "b": false}, {"t": "conector de contraste", "b": true}], [{"t": "portanto", "b": false}, {"t": "así que / por lo tanto", "b": false}, {"t": "conector de consequência", "b": true}], [{"t": "embora", "b": false}, {"t": "aunque (+ conjuntivo)", "b": false}, {"t": "conector de concessão", "b": true}]]}], "tip": false}, {"title": "Vocabulário: aeroporto e alfândega", "blocks": [{"type": "table", "headers": ["Significado", "Espanhol"], "rows": [[{"t": "cartão de embarque", "b": false}, {"t": "tarjeta de embarque", "b": true}], [{"t": "bagagem de mão", "b": false}, {"t": "equipaje de mano", "b": true}], [{"t": "recolha de bagagem", "b": false}, {"t": "recogida de equipajes", "b": true}], [{"t": "voo atrasado", "b": false}, {"t": "vuelo retrasado", "b": true}], [{"t": "alfândega", "b": false}, {"t": "aduana", "b": true}], [{"t": "passaporte", "b": false}, {"t": "pasaporte", "b": true}], [{"t": "nada a declarar", "b": false}, {"t": "nada que declarar", "b": true}], [{"t": "porta de embarque", "b": false}, {"t": "puerta de embarque", "b": true}]]}], "tip": false}, {"title": "Vocabulário: hotel, saúde e emergências", "blocks": [{"type": "table", "headers": ["Significado", "Espanhol"], "rows": [[{"t": "Não há água quente", "b": false}, {"t": "No hay agua caliente", "b": true}], [{"t": "O quarto não está pronto", "b": false}, {"t": "La habitación no está lista", "b": true}], [{"t": "Queria mudar de quarto", "b": false}, {"t": "Querría cambiar de habitación", "b": true}], [{"t": "farmácia", "b": false}, {"t": "farmacia", "b": true}], [{"t": "Preciso de um médico", "b": false}, {"t": "Necesito un médico", "b": true}], [{"t": "Dói-me aqui", "b": false}, {"t": "Me duele aquí", "b": true}], [{"t": "Chame uma ambulância!", "b": false}, {"t": "¡Llame a una ambulancia!", "b": true}], [{"t" la", "b": true}], [{"t": "cabine de provas", "b": false}, {"t": "probador", "b": true}], [{"t": "reunião", "b": false}, {"t": "reunión", "b": true}], [{"t": "prazo", "b": false}, {"t": "fecha límite", "b": true}], [{"t": "candidatura", "b": false}, {"t": "candidatura", "b": true}], [{"t": "entrevista de emprego", "b": false}, {"t": "entrevista de trabajo", "b": true}], [{"t": "salário", "b": false}, {"t": "salario", "b": true}]]}], "tip": false}, {"title": "Etiqueta: tú ou usted?", "blocks": [{"type": "p", "html": "O espanhol distingue tú (informal, amigos e família) de usted (formal, desconhecidos, superiores, contexto profissional), conjugado na terceira pessoa do singular. Em Espanha, o uso de tú é mais alargado do que na América Latina, sendo por vezes usado mesmo com desconhecidos em contexto descontraído.", "italic": false}, {"type": "list", "label": "Regras práticas", "intro": null, "items": ["Com desconhecidos, superiores, em contexto muito formal: usted.", "Com amigos, família, e cada vez mais no trabalho em Espanha: tú.", "Os e-mails formais abrem com «Estimado/a Señor/a» e fecham com «Un cordial saludo»."]}], "tip": false}, {"title": "Expressões idiomáticas avançadas", "blocks": [{"type": "table", "headers": ["Significado", "Expressão"], "rows": [[{"t": "Custar os olhos da cara", "b": false}, {"t": "Costar un ojo de la cara", "b": true}], [{"t": "Estar com a cabeça na lua", "b": false}, {"t": "Estar en las nubes", "b": true}], [{"t": "Fazer-se de desentendido", "b": false}, {"t": "Hacerse el sueco", "b": true}], [{"t": "Estar teso/sem dinheiro", "b": false}, {"t": "Estar sin blanca", "b": true}], [{"t": "Meter-se numa alhada", "b": false}, {"t": "Meterse en un lío", "b": true}], [{"t": "Quebrar o gelo", "b": false}, {"t": "Romper el hielo", "b": true}]]}], "tip": false}, {"title": "Diálogos práticos avançados", "blocks": [{"type": "p", "html": "Cenário: resolver um problema no hotel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Hola, hay un problema con mi habitación, el aire acondicionado no funciona.", "trans": "Olá, há um problema com o meu quarto, o ar condicionado não funciona."}, {"speaker": "Rececionista:", "orig": "Lo siento mucho, voy a enviar a alguien enseguida. ¿Prefiere cambiar de habitación mientras tanto?", "trans": "Lamento imenso, vou enviar já alguém. Prefere mudar de quarto entretanto?"}, {"speaker": "Cliente:", "orig": "Sí, sería más fácil, gracias.", "trans": "Sim, seria mais fácil, obrigado."}]}, {"type": "p", "html": "Cenário: no médico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "¿Qué le pasa?", "trans": "O que se passa?"}, {"speaker": "Paciente:", "orig": "Me duele la garganta desde hace tres días y tengo un poco de fiebre.", "trans": "Tenho dores de garganta há três dias e um pouco de febre."}, {"speaker": "Médico:", "orig": "Le voy a recetar unos medicamentos. Descanse bien.", "trans": "Vou receitar-lhe uns medicamentos. Descanse bem."}]}], "tip": false}, {"title": "Conclusão e próximos passos rumo à fluência", "blocks": [{"type": "list", "label": "Como continuar a progredir", "intro": null, "items": ["Vê séries e filmes espanhóis com legendas em espanhol para habituar o ouvido.", "Lê todos os dias um artigo curto de um jornal espanhol online (El País, El Mundo).", "Encontra um parceiro linguístico para fazeres intercâmbios de conversação (tandem).", "Escreve um pequeno diário de algumas frases em espanhol todos os dias.", "Não temas os erros: a verdadeira fluência nasce da prática constante, não da perfeição gramatical."]}], "tip": true}], "closingBasic": "Parabéns antecipados pelo teu percurso em espanhol — ¡Buena suerte!", "closingAdvanced": "Parabéns pelo caminho já percorrido — continua assim, a verdadeira fluência está mais perto do que pensas! ¡Buena suerte!"}, "ptbr": {"chapters": [{"title": "Introdução: porque aprender espanhol?", "blocks": [{"type": "p", "html": "O espanhol é língua oficial em 20 países, falado por mais de 500 milhões de pessoas no mundo, o que o torna a segunda língua materna mais falada depois do mandarim. Este livro dá-te uma base sólida no espanhol padrão falado em Espanha.", "italic": false}, {"type": "p", "html": "A boa notícia: o espanhol pronuncia-se quase exatamente como se escreve, sem letras mudas nem exceções surpreendentes — e o vocabulário vai parecer-te muitas vezes familiar, já que o português e o espanhol são línguas irmãs. A principal dificuldade é distinguir bem alguns sons que não existem em português, como o «r» fortemente vibrado ou a «jota».", "italic": false}, {"type": "list", "label": "Objetivos deste livro", "intro": null, "items": ["Dar-te uma base sólida de vocabulário e gramática essencial no menor tempo possível.", "Concentrarmo-nos na pronúncia correta para que o teu sotaque soe autenticamente espanhol.", "Dar-te frases práticas para usares desde o primeiro dia em situações reais."]}], "tip": false}, {"title": "O alfabeto e as bases da pronúncia", "blocks": [{"type": "p", "html": "O espanhol usa o alfabeto latino com uma letra extra, o ñ. Cada letra pronuncia-se quase sempre da mesma forma. Esta tabela apresenta os sons mais distintivos:", "italic": false}, {"type": "table", "headers": ["Significado", "Pronúncia", "Palavra"], "rows": [[{"t": "casa", "b": false}, {"t": "kasa", "b": false}, {"t": "casa", "b": true}], [{"t": "olá", "b": false}, {"t": "ola", "b": false}, {"t": "hola (o h é sempre mudo)", "b": true}], [{"t": "obrigado", "b": false}, {"t": "grasias", "b": false}, {"t": "gracias (c antes de i/e = «s» na América, «th» no norte de Espanha)", "b": true}], [{"t": "gato", "b": false}, {"t": "gato", "b": false}, {"t": "gato", "b": true}], [{"t": "eu", "b": false}, {"t": "yo", "b": false}, {"t": "yo", "b": true}], [{"t": "rapaz", "b": false}, {"t": "chico", "b": false}, {"t": "chico", "b": true}], [{"t": "vermelho (r vibrante)", "b": false}, {"t": "ro-Rro", "b": false}, {"t": "rojo (j pronuncia-se como uma jota gutural forte, o r inicial é vibrante)", "b": true}], [{"t": "água", "b": false}, {"t": "agua", "b": false}, {"t": "agua", "b": true}], [{"t": "ovo", "b": false}, {"t": "uévo", "b": false}, {"t": "huevo (h mudo)", "b": true}], [{"t": "vinho", "b": false}, {"t": "vino", "b": false}, {"t": "vino", "b": true}]]}], "tip": false}, {"title": "As regras de ouro para uma pronúncia autêntica", "blocks": [{"type": "p", "html": "Estas 6 regras de ouro fazem toda a diferença para soares realmente espanhol:", "italic": false}, {"type": "list", "label": null, "intro": null, "items": ["O h é sempre mudo em espanhol (hola, hotel) — nunca aspirado.", "O j, e o g antes de e/i, pronunciam-se com um som gutural muito marcado, produzido mais atrás na garganta.", "O r no início de palavra, ou o rr, é fortemente vibrante — pratica-o em frente ao espelho.", "O ll e o y pronunciam-se muitas vezes como um «i» semiconsoante (calle → «ka-ye»), exceto na Argentina onde soam mais «ch/j».", "O ñ pronuncia-se como o «nh» português de «senhor» (español, niño) — já um som que conheces!", "Em Espanha, o c antes de e/i e o z pronunciam-se «th» (como o th inglês de «think») — na América Latina pronunciam-se simplesmente «s»."]}], "tip": false}, {"title": "Cumprimentos e frases essenciais", "blocks": [{"type": "table", "headers": ["Significado", "Pronúncia", "Espanhol"], "rows": [[{"t": "Bom dia (formal)", "b": false}, {"t": "buénos días", "b": false}, {"t": "Buenos días", "b": true}], [{"t": "Boa tarde", "b": false}, {"t": "buénas tárdes", "b": false}, {"t": "Buenas tardes", "b": true}], [{"t": "Olá (informal)", "b": false}, {"t": "ola", "b": false}, {"t": "Hola", "b": true}], [{"t": "Como estás?", "b": false}, {"t": "ke tal", "b": false}, {"t": "¿Qué tal?", "b": true}], [{"t": "Bem, obrigado", "b": false}, {"t": "bien, grasias", "b": false}, {"t": "Bien, gracias", "b": true}], [{"t": "Muito prazer", "b": false}, {"t": "enkantado", "b": false}, {"t": "Encantado", "b": true}], [{"t": "Até já", "b": false}, {"t": "asta pronto", "b": false}, {"t": "Hasta pronto", "b": true}], [{"t": "Até amanhã", "b": false}, {"t": "asta magniana", "b": false}, {"t": "Hasta mañana", "b": true}], [{"t": "Adeus", "b": false}, {"t": "adiós", "b": false}, {"t": "Adiós", "b": true}], [{"t": "Por favor", "b": false}, {"t": "por favor", "b": false}, {"t": "Por favor", "b": true}], [{"t": "Obrigado", "b": false}, {"t": "grasias", "b": false}, {"t": "Gracias", "b": true}], [{"t": "De nada", "b": false}, {"t": "de nada", "b": false}, {"t": "De nada", "b": true}], [{"t": "Desculpe", "b": false}, {"t": "perdone", "b": false}, {"t": "Perdone", "b": true}], [{"t": "Sim", "b": false}, {"t": "si", "b": false}, {"t": "Sí", "b": true}], [{"t": "Não", "b": false}, {"t": "no", "b": false}, {"t": "No", "b": true}]]}], "tip": false}, {"title": "Os pronomes e os verbos «ser» e «estar»", "blocks": [{"type": "p", "html": "Tal como o português, o espanhol distingue «ser» (identidade, característica permanente) e «estar» (estado temporário, localização) — um conceito que já dominas!", "italic": false}, {"type": "h3", "text": "Pronomes"}, {"type": "table", "headers": ["Português", "Espanhol"], "rows": [[{"t": "eu", "b": false}, {"t": "yo", "b": true}], [{"t": "tu", "b": false}, {"t": "tú", "b": true}], [{"t": "ele/ela", "b": false}, {"t": "él / ella", "b": true}], [{"t": "nós", "b": false}, {"t": "nosotros", "b": true}], [{"t": "vocês", "b": false}, {"t": "vosotros / ustedes", "b": true}], [{"t": "eles/elas", "b": false}, {"t": "ellos / ellas", "b": true}]]}, {"type": "h3", "text": "ser — ser (permanente)"}, {"type": "table", "headers": ["Pronome", "Conjugação"], "rows": [[{"t": "yo", "b": false}, {"t": "soy", "b": true}], [{"t": "tú", "b": false}, {"t": "eres", "b": true}], [{"t": "él/ella", "b": false}, {"t": "es", "b": true}], [{"t": "nosotros", "b": false}, {"t": "somos", "b": true}], [{"t": "vosotros", "b": false}, {"t": "sois", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "son", "b": true}]]}, {"t "trans": "Olá! Queria um café, por favor."}, {"speaker": "Empregado:", "orig": "¿Algo más?", "trans": "Mais alguma coisa?"}, {"speaker": "Cliente:", "orig": "No, y la cuenta, por favor.", "trans": "Não, e a conta, por favor."}, {"speaker": "Empregado:", "orig": "Son dos euros. ¡Gracias!", "trans": "São dois euros. Obrigado!"}, {"speaker": "Cliente:", "orig": "De nada, ¡hasta pronto!", "trans": "De nada, até já!"}]}], "tip": false}, {"title": "Plano de ação: como aprender depressa", "blocks": [{"type": "list", "label": "7 passos para progredir rapidamente", "intro": null, "items": ["Ouve música e vê séries espanholas todos os dias, mesmo que só 10 minutos.", "Pratica o «shadowing»: ouve uma frase curta e repete-a imediatamente com o mesmo ritmo.", "Treina o r vibrante e a jota em frente ao espelho.", "Não traduzas na tua cabeça — tenta pensar diretamente em espanhol.", "Usa uma aplicação como o Duolingo ou o Babbel juntamente com este livro para reforçar o vocabulário.", "Fala desde o primeiro dia, mesmo que erres — a fluência vem da prática.", "Distingue bem ser e estar desde o início — é a base de qualquer frase correta."]}], "tip": true}, {"title": "Introdução: para quem é este livro?", "blocks": [{"type": "p", "html": "Este livro é a segunda parte depois de «Aprender Espanhol — Fácil, Divertido e Rápido», que cobriu as bases. Se já terminaste o nível básico e queres atingir um nível que te permita realmente desenvencilhares-te a viajar, a trabalhar e no dia a dia em Espanha, este livro vai dar-te: os tempos verbais de que precisas, vocabulário prático para situações reais, e diálogos realistas.", "italic": false}, {"type": "list", "label": "Antes de começar", "intro": null, "items": ["Já deves conhecer: cumprimentos, pronomes, ser/estar, a conjugação no presente, e os números — tudo isto está no livro básico.", "O nosso objetivo aqui não é ensinar-te tudo sobre a língua, mas dar-te ferramentas suficientes para te desenvencilhares sozinho em qualquer situação.", "Vai com calma em cada capítulo, e pratica os exemplos em voz alta antes de passares para o seguinte."]}], "tip": false, "dividerBefore": true}, {"title": "Revisão rápida do nível básico", "blocks": [{"type": "table", "headers": ["yo", "tú", "él/ella", "nosotros", "vosotros/ellos"], "rows": [[{"t": "eu", "b": false}, {"t": "tu", "b": false}, {"t": "ele/ela", "b": false}, {"t": "nós", "b": false}, {"t": "vocês/eles", "b": true}]]}, {"type": "h3", "text": "Presente — os padrões regulares"}, {"type": "table", "headers": ["Pronome", "-ar (hablar)", "-er (comer)", "-ir (vivir)"], "rows": [[{"t": "yo", "b": false}, {"t": "hablo", "b": false}, {"t": "como", "b": false}, {"t": "vivo", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "comemos", "b": false}, {"t": "vivimos", "b": true}], [{"t": "ellos", "b": false}, {"t": "hablan", "b": false}, {"t": "comen", "b": false}, {"t": "viven", "b": true}]]}], "tip": false}, {"title": "O passado: Pretérito Indefinido e Imperfecto", "blocks": [{"type": "p", "html": "O espanhol distingue uma ação pontual e concluída (Pretérito Indefinido, próximo do pretérito perfeito simples) de um passado habitual ou descritivo (Imperfecto, próximo do pretérito imperfeito). É um tempo simples, sem verbo auxiliar:", "italic": false}, {"type": "table", "headers": ["Pronome", "hablar → Indefinido", "ir → Indefinido"], "rows": [[{"t": "yo", "b": false}, {"t": "hablé", "b": false}, {"t": "fui", "b": true}], [{"t": "tú", "b": false}, {"t": "hablaste", "b": false}, {"t": "fuiste", "b": true}], [{"t": "él/ella", "b": false}, {"t": "habló", "b": false}, {"t": "fue", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablamos", "b": false}, {"t": "fuimos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaron", "b": false}, {"t": "fueron", "b": true}]]}, {"type": "h3", "text": "O Imperfecto"}, {"type": "table", "headers": ["Pronome", "hablar → imperfecto"], "rows": [[{"t": "yo", "b": false}, {"t": "hablaba", "b": true}], [{"t": "tú", "b": false}, {"t": "hablabas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hablaba", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablábamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablaban", "b": true}]]}, {"type": "p", "html": "Exemplo: Cuando era pequeño, vivía en Lisboa (Imperfecto: descrição) — Ayer fui al mercado (Indefinido: facto pontual). Nota: o espanhol também tem um Pretérito Perfecto (he hablado), usado sobretudo para um passado muito recente ainda ligado ao presente — a maioria das narrações usa o Indefinido.", "italic": false}], "tip": false}, {"title": "O futuro e o condicional", "blocks": [{"type": "table", "headers": ["Uso", "Formação", "Exemplo"], "rows": [[{"t": "Futuro próximo (intenção)", "b": false}, {"t": "ir a + infinitivo", "b": false}, {"t": "Voy a salir mañana — Vou sair amanhã", "b": true}], [{"t": "Futuro simples (previsão)", "b": false}, {"t": "infinitivo + terminações -é, -ás, -á, -emos, -án", "b": false}, {"t": "Saldré el año que viene — Sairei no próximo ano", "b": true}], [{"t": "Condicional (hipótese, cortesia)", "b": false}, {"t": "infinitivo + terminações -ía, -ías, -ía, -íamos, -ían", "b": false}, {"t": "Querría un café — Gostaria de um café", "b": true}]]}], "tip": false}, {"title": "Verbos pronominais e pronomes complemento", "blocks": [{"type": "table", "headers": ["Pronome sujeito", "Pronome reflexivo", "lavarse (lavar-se)"], "rows": [[{"t": "yo", "b": false}, {"t": "me", "b": false}, {"t": "me lavo", "b": true}], [{"t": "tú", "b": false}, {"t": "te", "b": false}, {"t": "te lavas", "b": true}], [{"t": "él/ella", "b": false}, {"t": "se", "b": false}, {"t": "se lava", "b": true}], [{"t": "nosotros", "b": false}, {"t": "nos", "b": false}, {"t": "nos lavamos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "se", "b": false}, {"t": "se lavan", "b": true}]]}, {"type": "p", "html": "Os pronomes complemento direto (me, te, lo/la, nos, os, los/las) e indireto (me, te, le, nos, os, les) colocam-se antes do verbo conjugado: Lo veo (Vejo-o), Le hablo (Falo-lhe). Com um infinitivo ou gerúndio, também se podem colar ao fim: Quiero verlo / Lo quiero ver.", "italic": false}], "tip": false}, {"title": "O conjuntivo: as bases indispensáveis", "blocks": [{"type": "p", "html": "O conjuntivo espanhol é usado com muito mais frequência do que o seu equivalente português, sobretudo depois de expressões de desejo, dúvida ou emoção (querer que, esperar que, es posible que).", "italic": false}, {"type": "table", "headers": ["Pronome", "hablar → conjuntivo presente"], "rows": [[{"t": "yo", "b": false}, {"t": "hable", "b": true}], [{"t": "tú", "b": false}, {"t": "hables", "b": true}], [{"t": "él/ella", "b": false}, {"t": "hable", "b": true}], [{"t": "nosotros", "b": false}, {"t": "hablemos", "b": true}], [{"t": "ellos/ellas", "b": false}, {"t": "hablen", "b": true}]]}, {"type": "p", "html": "Exemplo: Espero que hables español pronto — Espero que fales espanhol em breve. A estrutura «que + conjuntivo» é obrigatória sempre que o sujeito muda, tal como em português.", "italic": false}], "tip": false}, {"title": "Comparativos, superlativos e conectores avançados", "blocks": [{"type": "table", "headers": ["Estrutura", "Espanhol", "Significado"], "rows": [[{"t": "mais... que", "b": false}, {"t": "más... que", "b": false}, {"t": "Es más alto que yo", "b": true}], [{"t": "menos... que", "b": false}, {"t": "menos... que", "b": false}, {"t": "Es menos caro que antes", "b": true}], [{"t": "tão... como", "b": false}, {"t": "tan... como", "b": false}, {"t": "Es tan rápida como él", "b": true}], [{"t": "o mais/a mais", "b": false}, {"t": "el más / la más", "b": false}, {"t": "Es el barrio más bonito", "b": true}], [{"t": "no entanto", "b": false}, {"t": "sin embargo", "b": false}, {"t": "conector de contraste", "b": true}], [{"t": "portanto", "b": false}, {"t": "así que / por lo tanto", "b": false}, {"t": "conector de consequência", "b": true}], [{"t": "embora", "b": false utomático", "b": true}], [{"t": "taxa de câmbio", "b": false}, {"t": "tipo de cambio", "b": true}], [{"t": "Perdi a carteira", "b": false}, {"t": "He perdido mi cartera", "b": true}], [{"t": "queixa na polícia", "b": false}, {"t": "denuncia", "b": true}], [{"t": "esquadra da polícia", "b": false}, {"t": "comisaría", "b": true}], [{"t": "câmara municipal", "b": false}, {"t": "ayuntamiento", "b": true}], [{"t": "autorização de residência", "b": false}, {"t": "permiso de residencia", "b": true}]]}], "tip": false}, {"title": "Vocabulário: transportes e direções", "blocks": [{"type": "table", "headers": ["Significado", "Espanhol"], "rows": [[{"t": "bilhete simples", "b": false}, {"t": "billete de ida", "b": true}], [{"t": "ida e volta", "b": false}, {"t": "ida y vuelta", "b": true}], [{"t": "aluguer de carro", "b": false}, {"t": "alquiler de coches", "b": true}], [{"t": "Vire à direita", "b": false}, {"t": "Gire a la derecha", "b": true}], [{"t": "Siga em frente", "b": false}, {"t": "Siga todo recto", "b": true}], [{"t": "semáforo", "b": false}, {"t": "semáforo", "b": true}], [{"t": "rotunda", "b": false}, {"t": "rotonda", "b": true}], [{"t": "cais/plataforma", "b": false}, {"t": "andén", "b": true}], [{"t": "paragem de autocarro", "b": false}, {"t": "parada de autobús", "b": true}]]}], "tip": false}, {"title": "Vocabulário: compras e trabalho", "blocks": [{"type": "table", "headers": ["Significado", "Espanhol"], "rows": [[{"t": "Pode fazer-me um desconto?", "b": false}, {"t": "¿Puede hacerme un descuento?", "b": true}], [{"t": "tamanho (roupa)", "b": false}, {"t": "talla", "b": true}], [{"t": "cabine de provas", "b": false}, {"t": "probador", "b": true}], [{"t": "reunião", "b": false}, {"t": "reunión", "b": true}], [{"t": "prazo", "b": false}, {"t": "fecha límite", "b": true}], [{"t": "candidatura", "b": false}, {"t": "candidatura", "b": true}], [{"t": "entrevista de emprego", "b": false}, {"t": "entrevista de trabajo", "b": true}], [{"t": "salário", "b": false}, {"t": "salario", "b": true}]]}], "tip": false}, {"title": "Etiqueta: tú ou usted?", "blocks": [{"type": "p", "html": "O espanhol distingue tú (informal, amigos e família) de usted (formal, desconhecidos, superiores, contexto profissional), conjugado na terceira pessoa do singular. Em Espanha, o uso de tú é mais alargado do que na América Latina, sendo por vezes usado mesmo com desconhecidos em contexto descontraído.", "italic": false}, {"type": "list", "label": "Regras práticas", "intro": null, "items": ["Com desconhecidos, superiores, em contexto muito formal: usted.", "Com amigos, família, e cada vez mais no trabalho em Espanha: tú.", "Os e-mails formais abrem com «Estimado/a Señor/a» e fecham com «Un cordial saludo»."]}], "tip": false}, {"title": "Expressões idiomáticas avançadas", "blocks": [{"type": "table", "headers": ["Significado", "Expressão"], "rows": [[{"t": "Custar os olhos da cara", "b": false}, {"t": "Costar un ojo de la cara", "b": true}], [{"t": "Estar com a cabeça na lua", "b": false}, {"t": "Estar en las nubes", "b": true}], [{"t": "Fazer-se de desentendido", "b": false}, {"t": "Hacerse el sueco", "b": true}], [{"t": "Estar teso/sem dinheiro", "b": false}, {"t": "Estar sin blanca", "b": true}], [{"t": "Meter-se numa alhada", "b": false}, {"t": "Meterse en un lío", "b": true}], [{"t": "Quebrar o gelo", "b": false}, {"t": "Romper el hielo", "b": true}]]}], "tip": false}, {"title": "Diálogos práticos avançados", "blocks": [{"type": "p", "html": "Cenário: resolver um problema no hotel.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Cliente:", "orig": "Hola, hay un problema con mi habitación, el aire acondicionado no funciona.", "trans": "Olá, há um problema com o meu quarto, o ar condicionado não funciona."}, {"speaker": "Rececionista:", "orig": "Lo siento mucho, voy a enviar a alguien enseguida. ¿Prefiere cambiar de habitación mientras tanto?", "trans": "Lamento imenso, vou enviar já alguém. Prefere mudar de quarto entretanto?"}, {"speaker": "Cliente:", "orig": "Sí, sería más fácil, gracias.", "trans": "Sim, seria mais fácil, obrigado."}]}, {"type": "p", "html": "Cenário: no médico.", "italic": false}, {"type": "dialogue", "lines": [{"speaker": "Médico:", "orig": "¿Qué le pasa?", "trans": "O que se passa?"}, {"speaker": "Paciente:", "orig": "Me duele la garganta desde hace tres días y tengo un poco de fiebre.", "trans": "Tenho dores de garganta há três dias e um pouco de febre."}, {"speaker": "Médico:", "orig": "Le voy a recetar unos medicamentos. Descanse bien.", "trans": "Vou receitar-lhe uns medicamentos. Descanse bem."}]}], "tip": false}, {"title": "Conclusão e próximos passos rumo à fluência", "blocks": [{"type": "list", "label": "Como continuar a progredir", "intro": null, "items": ["Vê séries e filmes espanhóis com legendas em espanhol para habituar o ouvido.", "Lê todos os dias um artigo curto de um jornal espanhol online (El País, El Mundo).", "Encontra um parceiro linguístico para fazeres intercâmbios de conversação (tandem).", "Escreve um pequeno diário de algumas frases em espanhol todos os dias.", "Não temas os erros: a verdadeira fluência nasce da prática constante, não da perfeição gramatical."]}], "tip": true}], "closingBasic": "Parabéns antecipados pelo teu percurso em espanhol — ¡Buena suerte!", "closingAdvanced": "Parabéns pelo caminho já percorrido — continua assim, a verdadeira fluência está mais perto do que pensas! ¡Buena suerte!"}};

<script>
(function(){

    var doc = DATA[lang] || DATA.en || DATA.ar || DATA[Object.keys(DATA)[0]];
    var s = STR;

    document.getElementById('brand-text').textContent = s.brand[lang] || s.brand.en;
    document.getElementById('back-link').textContent = s.backLink[lang] || s.backLink.en;
    document.getElementById('nav-cta').innerHTML = '💬 ' + (s.navCta[lang] || s.navCta.en);
    document.getElementById('nav-cta').href = waLink(lang);
    document.getElementById('hero-title').textContent = s.mainTitle[lang] || s.mainTitle.en;
    document.getElementById('hero-subtitle').textContent = s.mainSubtitle[lang] || s.mainSubtitle.en;
    document.getElementById('byline-name').textContent = s.bylineName[lang] || s.bylineName.en;
    document.getElementById('byline-meta').textContent = s.bylineMeta[lang] || s.bylineMeta.en;
    document.getElementById('toc-heading').textContent = s.tocHeading[lang] || s.tocHeading.en;
    document.getElementById('cta-h3').textContent = s.ctaH3[lang] || s.ctaH3.en;
    document.getElementById('cta-p').textContent = s.ctaP[lang] || s.ctaP.en;
    document.getElementById('cta-btn-text').textContent = s.navCta[lang] || s.navCta.en;
    document.getElementById('cta-btn-bottom').href = waLink(lang);
    document.getElementById('floating-wa').href = waLink(lang);
    document.getElementById('footer-copyright').textContent = s.footerCopyright[lang] || s.footerCopyright.en;
    document.getElementById('footer-back').textContent = s.footerBack[lang] || s.footerBack.en;

    var chapters = doc.chapters;
    var tocHtml = '';
    var chaptersHtml = '';
    chapters.forEach(function(ch, i){
      var num = i + 1;
      if (ch.dividerBefore) {
        tocHtml += '<span class="toc-part">' + (s.partTag[lang]||s.partTag.en) + ' — ' + (s.partTitle[lang]||s.partTitle.en) + '</span>';
      }
      tocHtml += '<a href="#c' + num + '">' + num + '. ' + ch.title + '</a>';

      if (ch.dividerBefore) {
        chaptersHtml += '<div class="part-divider"><span class="tag">' + (s.partTag[lang]||s.partTag.en) + '</span><h2>' + (s.partTitle[lang]||s.partTitle.en) + '</h2></div>';
      }
      chaptersHtml += '<div class="chapter" id="c' + num + '"><h2>' + num + '. ' + ch.title + '</h2>';
      ch.blocks.forEach(function(b){
        chaptersHtml += renderBlock(b, ch.tip, null);
      });
      if (i === chapters.length - 1 && doc.closingAdvanced) {
        chaptersHtml += '<p style="text-align:center;font-weight:800;color:var(--brand-blue-dark);margin-top:20px;">' + doc.closingAdvanced + '</p>';
      }
      chaptersHtml += '</div>';
    });
    document.getElementById('toc-grid').innerHTML = tocHtml;
    document.getElementById('chapters-container').innerHTML = chaptersHtml;
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ render(btn.getAttribute('data-lang')); });
  });

  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(DATA[savedLang] ? savedLang : 'ar');
})();
</script>

</body>
</html>
