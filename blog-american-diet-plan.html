<head>

<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

ixo sódio", "1 colher (sopa) de óleo", "1 xícara de arroz integral cozido"], "steps": ["Preaqueça o forno a 220°C.", "Misture o frango, os pimentões e a cebola com o óleo e o tempero para taco na assadeira.", "Asse por 18-20 min, mexendo uma vez, até as bordas dourarem e o frango cozinhar por completo.", "Sirva sobre arroz integral com um pouco de limão."], "swap": "Noite vegetariana — troque o frango por uma lata de feijão-preto escorrido, asse por só 10 min.", "leftover": "Fica ótimo gelado no dia seguinte, num wrap ou sobre uma salada."}, {"title": "Camarão ao Alho com Arroz Integral", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de camarão limpo", "4 dentes de alho, picados", "Suco de 1 limão", "1 colher (sopa) de azeite", "Salsinha picada", "1 xícara de arroz integral cozido"], "steps": ["Aqueça o azeite numa frigideira em fogo médio-alto.", "Adicione o alho e cozinhe por 30 seg até perfumar.", "Adicione o camarão e cozinhe 2-3 min de cada lado até ficar rosado.", "Misture o suco de limão e a salsinha, e sirva sobre o arroz integral."], "swap": "Tiras de frango ou peixe branco funcionam do mesmo jeito, só precisam de um pouco mais de tempo.", "leftover": "Esquente suavemente numa frigideira — o micro-ondas deixa o camarão borrachudo."}, {"title": "Taco de Peru na Frigideira em Folhas de Alface", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de peru moído magro", "1 colher (sopa) de tempero para taco de baixo sódio", "1/2 xícara de água ou caldo", "Folhas grandes de alface, para servir", "Tomate e abacate picados, para finalizar"], "steps": ["Doure o peru numa frigideira em fogo médio-alto, por cerca de 5-6 min.", "Misture o tempero para taco e a água; cozinhe por 3-4 min até engrossar.", "Sirva nas folhas de alface e finalize com tomate e abacate."], "swap": "Carne moída magra ou uma lata de feijão-preto funcionam do mesmo jeito para uma noite sem carne.", "leftover": "Transforme numa grande salada de taco ou recheio de batata-doce assada."}, {"title": "Peixe Branco Assado com Abobrinha Grelhada", "time": "25 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 filés de peixe branco", "1 abobrinha, fatiada", "1 dente de alho, picado", "1 limão, fatiado", "1 colher (sopa) de azeite", "Sal, pimenta e páprica"], "steps": ["Preaqueça o forno a 200°C. Misture a abobrinha com metade do azeite, sal e pimenta; asse por 10 min.", "Tempere o peixe com o alho, a páprica, o sal e a pimenta.", "Empurre a abobrinha para o lado, adicione o peixe e as fatias de limão na assadeira.", "Asse por mais 10-12 min, até o peixe lascar facilmente."], "swap": "Salmão ou camarão também ficam ótimos aqui, com um tempo de cozimento menor para o camarão.", "leftover": "Desfie num bowl de arroz para um almoço rápido no dia seguinte."}], "bonus": {"eyebrow": "BÔNUS", "title": "Guia de equilíbrio e sobras", "items": ["Porcione o arroz integral cozido em potes — congela bem por até um mês.", "Quer mais volume sem mais calorias? Adicione uma salada verde ou mais legumes assados a qualquer prato.", "Camarão e peixe esquentam melhor numa frigideira em fogo baixo, não no micro-ondas.", "Com pressa? Cozinhe uma quantidade maior de arroz integral de uma vez e reaproveite durante a semana."]}, "closing": {"title": "Uma semana completa, sem privação.", "body": "Sete jantares americanos saudáveis, uma ida ao mercado, e o sabor de comfort food que você realmente quer. Guarde este guia à mão e use sempre que quiser equilíbrio sem abrir mão da sua comida favorita.", "madeBy": "FEITO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Modo de preparo", "swap": "Substituição", "leftover": "Dica de sobras", "day": "Dia"}}, "es": {"dir": "ltr", "meta": {"htmlLang": "es", "pageTitle": "El Plan de Cenas Saludables de la Semana - Comfort Food Americana"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUÍA DE RECETAS SALUDABLES GRATIS", "title1": "EL PLAN DE CEN lo, unos 5 min.", "Agrega el tomate triturado y 1/2 taza de agua; deja cocinar 12-15 min.", "Mientras tanto, cocina la pasta según el paquete; escurre y mezcla con la salsa.", "Ajusta la sazón y sirve."], "swap": "Pollo molido o carne magra funcionan igual. Sustituye la pasta por calabacita en espiral en una noche con menos carbohidratos.", "leftover": "Se recalienta bien con un poco de agua para aflojar la salsa."}, {"title": "Salteado de Res y Brócoli en 15 Minutos", "time": "15 min", "serves": "Para 4", "equip": "1 sartén", "ing": ["500g de carne molida magra (93%)", "1 brócoli, en trozos pequeños", "3 cdas de salsa de soya baja en sodio", "1 cda de miel", "2 dientes de ajo, picados", "Arroz integral cocido, para servir"], "steps": ["Calienta un sartén a fuego alto. Dora la carne, desmenuzándola, unos 5 min.", "Agrega el brócoli y el ajo; saltea 4-5 min hasta que el verde se intensifique.", "Agrega la salsa de soya y la miel; cocina 1 min más.", "Sirve sobre arroz integral."], "swap": "Pavo o pollo molido también funcionan. Cualquier verdura de cocción rápida puede reemplazar el brócoli.", "leftover": "Se congela bien hasta por 2 meses — porciona antes de agregar el arroz."}, {"title": "Bowls de Fajitas de Pollo al Horno con Arroz Integral", "time": "30 min", "serves": "Para 4", "equip": "1 bandeja", "ing": ["4 pechugas de pollo, en tiras", "2 pimientos, en tiras", "1 cebolla amarilla, en tiras", "1 cda de sazonador para tacos bajo en sodio", "1 cda de aceite", "1 taza de arroz integral cocido"], "steps": ["Precalienta el horno a 220°C.", "Mezcla el pollo, los pimientos y la cebolla con el aceite y el sazonador para tacos en la bandeja.", "Hornea 18-20 min, moviendo una vez, hasta que se doren las orillas y el pollo esté bien cocido.", "Sirve sobre arroz integral con un poco de limón."], "swap": "Noche vegetariana — sustituye el pollo por una lata de frijoles negros escurridos, hornea solo 10 min.", "leftover": "Sabe increíble frío al día siguiente, en un wrap o s de limón en la bandeja.", "Hornea 10-12 min más, hasta que el pescado se desmenuce fácilmente."], "swap": "El salmón o el camarón también quedan bien aquí, con un tiempo de cocción más corto para el camarón.", "leftover": "Desmenúzalo en un bowl de arroz para un almuerzo rápido al día siguiente."}], "bonus": {"eyebrow": "EXTRA", "title": "Guía de equilibrio y sobras", "items": ["Porciona el arroz integral cocido en recipientes — se congela bien hasta por un mes.", "¿Quieres más volumen sin más calorías? Agrega una ensalada verde o más verduras asadas a cualquier plato.", "El camarón y el pescado se recalientan mejor en un sartén a fuego bajo, no en el microondas.", "¿Con prisa? Cocina una tanda más grande de arroz integral desde el principio y reutilízala durante la semana."]}, "closing": {"title": "Una semana completa, sin privaciones.", "body": "Siete cenas americanas saludables, un solo viaje al súper, y el sabor reconfortante que realmente se te antoja. Ten esta guía a la mano y úsala cualquier semana que quieras equilibrio sin renunciar a tu comida favorita.", "madeBy": "HECHO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Preparación", "swap": "Sustitución", "leftover": "Tip de sobras", "day": "Día"}}, "fr": {"dir": "ltr", "meta": {"htmlLang": "fr", "pageTitle": "Le Plan de Dîners Sains de la Semaine - Comfort Food Américaine"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UN GUIDE DE RECETTES SAINES GRATUIT", "title1": "LE PLAN DE DÎNERS", "accent": "Américains", "title2": "SAINS DE LA SEMAINE", "subtitle": "Tes classiques américains préférés, en version plus légère — grillés, au four, et pleins de légumes. Pas de plats de régime fades.", "footer": "7 DÎNERS SAINS · 1 LISTE DE COURSES · VRAIE SAVEUR RÉCONFORTANTE"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Le comfort food et bien manger ne sont pas opposés", "p": ["La plupart des « régimes » te demandent de renoncer à tout ce qui t'est familier et de manger comme une punition. Mais les classiques avec lesquels tu as grandi — poulet, pâtes, tacos, burgers — peuvent vraiment être allégés sans perdre ce qui les rend bons.", "Ce plan propose sept vrais dîners américains — grillés ou cuits au four plutôt que frits, des protéines maigres, et des légumes en plus dans chaque recette. Une seule liste de courses, une cuisine simple, sans complication."], "rules": ["Une alimentation saine générale — pas un régime strict ni restrictif", "Des protéines + des légumes dans chaque assiette", "La plupart des recettes utilisent une seule poêle ou plaque"]}, "howto": {"eyebrow": "COMMENT UTILISER CE PLAN", "title": "Quatre étapes. C'est tout.", "steps": [{"title": "Fais les courses une seule fois", "body": "Utilise la liste de courses à la page suivante — les 7 dîners en un seul passage."}, {"title": "Cuisine dans l'ordre que tu veux", "body": "Les jours sont numérotés pour l'organisation, pas pour l'obligation. Garde la recette la plus rapide pour ton soir le plus chargé."}, {"title": "Utilise les astuces de substitution", "body": "Chaque recette a une astuce si tu veux varier la protéine ou utiliser ce que tu as déjà au frigo."}, {"title": "Équilibre ton assiette", "body": "Complète n'importe quelle assiette avec plus de salade ou de légumes si tu veux plus de volume sans plus de calories."}]}, "shopping": {"eyebrow": "TON SEUL PASSAGE AU SUPERMARCHÉ", "title": "Liste de courses", "note": "Le sel, le poivre noir et l'huile d'olive sont considérés comme des basiques que tu as déjà — ils ne sont donc pas listés ci-dessous.", "categories": [{"name": "Fruits et légumes", "items": ["1 citron", "2 têtes d'ail", "2 poivrons", "1 petite tête de brocoli", "1 courgette", "1 oignon jaune", "Mélange de salades vertes", "Tomates cerises", "1 avocat (facultatif)"]}, {"name": "Produits laitiers", "items": ["Yaourt grec nature", "Fromage râpé (petite quantité)"]}, {"name": "Protéines", "items": ["6 blancs de poulet (pour deux recettes)", "500g de dinde hachée maigre", "500g de crevettes décortiquées", "500g de filets de poisson blanc", "500g de bœuf haché maigre (93%)"]}, {"name": "Épicerie", "items": ["Pâtes complètes", "Riz complet (1 tasse)", "Petites tortillas complètes", "Assaisonnement à taco (faible en sodium si possible)", "Tomates concassées en conserve"]}]}, "recipes": [{"title": "Poulet Rôti au Citron et à l'Ail avec Légumes en Plaque", "time": "35 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 blancs de poulet", "1 brocoli, en fleurettes", "1 poivron, en tranches", "3 gousses d'ail, hachées", "1 citron, en tranches", "1 c. à soupe d'huile d'olive"], "steps": ["Préchauffe le four à 220°C.", "Mélange le brocoli et le poivron avec 1 c. à café d'huile, la moitié de l'ail, le sel et le poivre sur la plaque.", "Enduis le poulet avec le reste de l'huile, l'ail, le sel et le poivre ; place-le sur la plaque.", "Recouvre le poulet de tranches de citron.", "Fais cuire 22-25 min, jusqu'à ce que le poulet atteigne 74°C à cœur et que les légumes soient tendres."], "swap": "Pas de plaque allant au four ? Fais cuire le poulet à la poêle 6-7 min de chaque côté et fais cuire les légumes séparément.", "leftover": "Effiloche et mélange avec des feuilles vertes et un peu de citron pour une salade rapide le lendemain midi."}, {"title": "Bolognaise de Dinde aux Pâtes Complètes", "time": "25 min", "serves": "Pour 4", "equip": "1 casserole", "ing": ["500g de dinde hachée maigre", "1 boîte de tomates concassées", "1 oignon, haché", "3 gousses d'ail, hachées", "200g de pâtes complètes", "1 c. à soupe d'huile d'olive"], "steps": ["Fais chauffer l'huile dans une casserole ; fais revenir l'oignon et l'ail 3-4 min jusqu'à ce qu'ils ramollissent.", "Ajoute la dinde et fais-la dorer en l'émiettant, environ 5 min.", "Incorpore les tomates concassées et 1/2 tasse d'eau ; laisse mijoter 12-15 min.", "Pendant ce temps, fais cuire les pâtes selon le paquet ; égoutte et mélange avec la sauce.", "Assaisonne à ton goût et sers."], "swap": "Le poulet haché ou le bœuf maigre fonctionnent de la même façon. Remplace les pâtes par de la courgette en spirale pour un soir moins riche en glucides.", "leftover": "Se réchauffe bien avec un peu d'eau pour détendre la sauce."}, {"title": "Sauté de Bœuf et Brocoli en 15 Minutes", "time": "15 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de bœuf haché maigre (93%)", "1 brocoli, en petits morceaux", "3 c. à soupe de sauce soja allégée en sel", "1 c. à soupe de miel", "2 gousses d'ail, hachées", "Riz complet cuit, pour servir"], "steps": ["Fais chauffer une poêle à feu vif. Fais dorer le bœuf en l'émiettant, environ 5 min.", "Ajoute le brocoli et l'ail ; fais sauter 4-5 min jusqu'à ce que le vert devienne vif.", "Ajoute la sauce soja et le miel ; laisse cuire 1 min de plus.", "Sers sur du riz complet."], "swap": "De la dinde ou du poulet haché fonctionnent aussi. Tout légume à cuisson rapide peut remplacer le brocoli.", "leftover": "Se congèle bien jusqu'à 2 mois — portionne avant d'ajouter le riz."}, {"title": "Bols Fajitas au Poulet en Plaque avec Riz Complet", "time": "30 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 blancs de poulet, en lanières", "2 poivrons, en lanières", "1 oignon jaune, en lanières", "1 c. à soupe d'assaisonnement à taco faible en sodium", "1 c. à soupe d'huile", "1 tasse de riz complet cuit"], "steps": ["Préchauffe le four à 220°C.", "Mélange le poulet, les poivrons et l'oignon avec l'huile et l'assaisonnement à taco sur la plaque.", "Fais cuire 18-20 min, en remuant une fois, jusqu'à ce que les bords soient dorés et le poulet bien cuit.", "Sers sur du riz complet avec un peu de citron vert."], "swap": "Soirée végétarienne — remplace le poulet par une boîte de haricots noirs égouttés, ne cuis que 10 min.", "leftover": "Délicieux froid le lendemain, dans un wrap ou sur une salade."}, {"title": "Poêlée de Crevettes à l'Ail avec Riz Complet", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de crevettes décortiquées", "4 gousses d'ail, hachées", "Jus d'1 citron", "1 c. à soupe d'huile d'olive", "Persil haché", "1 tasse de riz complet cuit"], "steps": ["Fais chauffer l'huile dans une poêle à feu moyen-vif.", "Ajoute l'ail et fais cuire 30 sec jusqu'à ce qu'il embaume.", "Ajoute les crevettes et fais cuire 2-3 min de chaque côté jusqu'à ce qu'elles soient roses.", "Incorpore le jus de citron et le persil, et sers sur le riz complet."], "swap": "Des lanières de poulet ou du poisson blanc fonctionnent de la même façon, il faut juste un peu plus de temps.", "leftover": "Réchauffe doucement à la poêle — le micro-ondes rend les crevettes caoutchouteuses."}, {"title": "Poêlée de Taco à la Dinde en Feuilles de Laitue", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de dinde hachée maigre", "1 c. à soupe d'assaisonnement à taco faible en sodium", "1/2 tasse d'eau ou de bouillon", "Grandes feuilles de laitue, pour servir", "Tomate et avocat en dés, pour garnir"], "steps": ["Fais dorer la dinde dans une poêle à feu moyen-vif, environ 5-6 min.", "Ajoute l'assaisonnement à taco et l'eau ; laisse mijoter 3-4 min jusqu'à épaississement.", "Sers dans les feuilles de laitue et garnis de tomate et d'avocat."], "swap": "Du bœuf haché maigre ou une boîte de haricots noirs fonctionnent de la même façon pour une soirée sans viande.", "leftover": "Transforme-le en grande salade de taco ou en garniture de patate douce au four."}, {"title": "Poisson Blanc au Four avec Courgette Rôtie", "time": "25 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 filets de poisson blanc", "1 courgette, en tranches", "1 gousse d'ail, hachée", "1 citron, en tranches", "1 c. à soupe d'huile d'olive", "Sel, poivre et paprika"], "steps": ["Préchauffe le four à 200°C. Mélange la courgette avec la moitié de l'huile, le sel et le poivre ; fais cuire 10 min.", "Assaisonne le poisson avec l'ail, le paprika, le sel et le poivre.", "Pousse la courgette sur le côté, ajoute le poisson et les tranches de citron sur la plaque.", "Fais cuire 10-12 min de plus, jusqu'à ce que le poisson s'effeuille facilement."], "swap": "Le saumon ou les crevettes fonctionnent bien ici aussi, avec un temps de cuisson plus court pour les crevettes.", "leftover": "Émiette dans un bol de riz pour un déjeuner rapide le lendemain."}], "bonus": {"eyebrow": "EN BONUS", "title": "Guide d'équilibre et de restes", "items": ["Répartis le riz complet cuit dans des contenants — il se congèle bien jusqu'à un mois.", "Envie de plus de volume sans plus de calories ? Ajoute une salade verte ou plus de légumes rôtis à n'importe quelle assiette.", "Les crevettes et le poisson se réchauffent mieux à la poêle à feu doux, pas au micro-ondes.", "Pressé ? Cuis une plus grande quantité de riz complet à l'avance et réutilise-la toute la semaine."]}, "closing": {"title": "Une semaine complète, sans privation.", "body": "Sept dîners américains sains, un seul passage au supermarché, et la saveur réconfortante dont tu as vraiment envie. Garde ce guide à portée de main et utilise-le chaque semaine où tu veux de l'équilibre sans renoncer à ton plat préféré.", "madeBy": "CRÉÉ PAR @SARA.ALARABY"}, "labels": {"ingredients": "Ingrédients", "instructions": "Préparation", "swap": "Substitution", "leftover": "Astuce restes", "day": "Jour"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena Sano della Settimana - Comfort Food Americano"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA A RICETTE SANE", "title1": "LA SETTIMANA", "accent": "Americana", "title2": "SANA A CENA", "subtitle": "I tuoi classici comfort food preferiti, resi più leggeri — alla griglia, al forno e pieni di verdure. Niente cibo da dieta insipido.", "footer": "7 CENE SANE · 1 LISTA DELLA SPESA · VERO SAPORE DI COMFORT FOOD"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Comfort food e alimentazione sana non sono opposti", "p": ["La maggior parte dei piani \"dieta\" ti chiede di rinunciare a tutto ciò che ti è familiare e di mangiare come se fosse una punizione. Ma i classici con cui sei cresciuta — pollo, pasta, tacos, hamburger — possono benissimo essere alleggeriti senza perdere ciò che li rende buoni.", "Questo piano ha sette vere cene americane — alla griglia o al forno invece che fritte, proteine magre, e verdure extra in ogni ricetta. Una lista della spesa, cottura semplice, senza complicazioni."], "rules": ["Alimentazione sana in generale — non una dieta rigida o restrittiva", "Proteine + verdure in ogni piatto", "La maggior parte delle ricette usa solo una padella o una teglia"]}, "howto": {"eyebrow": "COME USARE QUESTO PIANO", "title": "Quattro passaggi. Tutto qui.", "steps": [{"title": "Fai la spesa una volta", "body": "Usa la lista della spesa nella pagina successiva — tutte e 7 le cene in un solo giro."}, {"title": "Cucina nell'ordine che vuoi", "body": "I giorni sono numerati per comodità, non per obbligo. Tieni la ricetta più veloce per la sera più impegnata."}, {"title": "Usa i consigli per le sostituzioni", "body": "Ogni ricetta ha una sostituzione se vuoi variare la proteina o usare quello che hai già in frigo."}, {"title": "Bilancia il tuo piatto", "body": "Completa qualsiasi piatto con altra insalata o verdure se vuoi più volume senza più calorie."}]}, "shopping": {"eyebrow": "IL TUO UNICO GIRO", "title": "Lista della spesa", "note": "Sale, pepe nero e olio d'oliva sono considerati basi di dispensa e non sono elencati qui sotto.", "categories": [{"name": "Frutta e verdura", "items": ["1 limone", "2 teste d'aglio", "2 peperoni", "1 broccolo piccolo", "1 zucchina", "1 cipolla dorata", "Insalata mista", "Pomodorini", "1 avocado (facoltativo)"]}, {"name": "Latticini e frigo", "items": ["Yogurt greco bianco naturale", "Formaggio grattugiato (piccola quantità)"]}, {"name": "Proteine", "items": ["6 petti di pollo (per due ricette)", "450 g di tacchino macinato magro", "450 g di gamberi, sgusciati", "450 g di filetti di pesce bianco", "450 g di manzo macinato magro (93%)"]}, {"name": "Dispensa", "items": ["Pasta integrale", "Riso integrale (1 tazza)", "Piccole tortillas integrali", "Spezie per taco (a basso contenuto di sodio, se possibile)", "Pomodori pelati in scatola"]}]}, "recipes": [{"title": "Pollo al Limone e Aglio in Teglia con Verdure Arrosto", "time": "35 min", "serves": "Per 4 persone", "equip": "1 teglia", "ing": ["4 petti di pollo", "1 broccolo, a cimette", "1 peperone, a fette", "3 spicchi d'aglio, tritati", "1 limone, a fette", "1 cucchiaio di olio d'oliva"], "steps": ["Preriscalda il forno a 220°C.", "Condisci broccolo e peperone con 1 cucchiaino di olio, metà dell'aglio, sale e pepe su una teglia.", "Massaggia il pollo con l'olio rimasto, l'aglio, sale e pepe; sistemalo nella teglia.", "Guarnisci il pollo con le fette di limone.", "Cuoci in forno 22-25 min, finché il pollo raggiunge 74°C internamente e le verdure sono tenere."], "swap": "Non hai una teglia da forno? Cuoci il pollo in padella 6-7 min per lato e arrostisci le verdure a parte.", "leftover": "Sfilaccia e mescola con insalata verde e una spruzzata di limone per un pranzo veloce."}, {"title": "Ragù di Tacchino su Pasta Integrale", "time": "25 min", "serves": "Per 4 persone", "equip": "1 pentola", "ing": ["450 g di tacchino macinato magro", "1 lattina di pomodori pelati", "1 cipolla, a pezzetti", "3 spicchi d'aglio, tritati", "225 g di pasta integrale", "1 cucchiaio di olio d'oliva"], "steps": ["Scalda l'olio in una pentola; fai soffriggere cipolla e aglio 3-4 min finché morbidi.", "Aggiungi il tacchino e rosolalo, sgretolandolo, per circa 5 min.", "Aggiungi i pomodori pelati e 125 ml di acqua; cuoci a fuoco lento 12-15 min.", "Nel frattempo, cuoci la pasta seguendo le istruzioni della confezione; scola e mescola con il sugo.", "Regola di sale e servi."], "swap": "Pollo o manzo macinato magro funzionano allo stesso modo. Sostituisci la pasta con zucchine a spirale per una serata a basso contenuto di carboidrati.", "leftover": "Si riscalda bene con un goccio d'acqua per ammorbidire di nuovo il sugo."}, {"title": "Salta in Padella di Manzo e Broccoli in 15 Minuti", "time": "15 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["450 g di manzo macinato magro (93%)", "1 broccolo, tagliato fine", "3 cucchiai di salsa di soia a basso contenuto di sodio", "1 cucchiaio di miele", "2 spicchi d'aglio, tritati", "Riso integrale cotto, per servire"], "steps": ["Scalda una padella a fuoco alto. Rosola il manzo, sgretolandolo, per circa 5 min.", "Aggiungi broccoli e aglio; salta in padella 4-5 min finché diventano verde brillante.", "Aggiungi salsa di soia e miele; cuoci ancora 1 minuto.", "Servi sopra il riso integrale."], "swap": "Vanno bene anche tacchino o pollo macinati. Qualsiasi verdura a cottura rapida può sostituire i broccoli.", "leftover": "Si congela bene fino a 2 mesi — dividi in porzioni prima di aggiungere il riso."}, {"title": "Ciotole di Fajitas di Pollo in Teglia", "time": "30 min", "serves": "Per 4 persone", "equip": "1 teglia", "ing": ["4 petti di pollo, a fette", "2 peperoni, a fette", "1 cipolla dorata, a fette", "1 cucchiaio di spezie per taco a basso contenuto di sodio", "1 cucchiaio di olio", "1 tazza di riso integrale cotto"], "steps": ["Preriscalda il forno a 220°C.", "Condisci pollo, peperoni e cipolla con olio e spezie per taco su una teglia.", "Cuoci in forno 18-20 min, mescolando una volta, finché i bordi sono leggermente bruciacchiati e il pollo è cotto.", "Servi sopra il riso integrale con una spruzzata di lime."], "swap": "Serata vegetariana — sostituisci il pollo con una lattina di fagioli neri scolati, cuoci solo 10 min.", "leftover": "Ottimo freddo il giorno dopo, in una piadina o sopra insalata verde."}, {"title": "Gamberi all'Aglio in Padella con Riso Integrale", "time": "20 min", "serves": "Per 4 persone", "equip": "1 padella", "ing": ["450 g di gamberi, sgusciati", "4 spicchi d'aglio, tritati", "Succo di 1 limone", "1 cucc function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function render(lang){
  const d = DATA[lang];
  if(!d) return;
  document.documentElement.lang = d.meta.htmlLang;
  document.documentElement.dir = d.dir;
  document.title = d.meta.pageTitle;

  document.getElementById('brandName').textContent = d.nav.brand;

  document.querySelectorAll('#langSwitcher button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang')===lang);
  });

  // Hero
  document.getElementById('hEyebrow').textContent = d.hero.eyebrow;
  document.getElementById('hTitle1').textContent = d.hero.title1;
  document.getElementById('hAccent').textContent = d.hero.accent;
  document.getElementById('hTitle2').textContent = d.hero.title2;
  document.getElementById('hSubtitle').textContent = d.hero.subtitle;
  document.getElementById('hFoottag').textContent = d.hero.footer;

  // Intro
  document.getElementById('iEyebrow').textContent = d.intro.eyebrow;
  document.getElementById('iTitle').textContent = d.intro.title;
  const iParas = document.getElementById('iParas'); iParas.innerHTML='';
  d.intro.p.forEach(t=>{ const p = el('p','',t); iParas.appendChild(p); });
  const iRules = document.getElementById('iRules'); iRules.innerHTML='';
  d.intro.rules.forEach(t=>{ iRules.appendChild(el('div','',t)); });

  // How to
  document.getElementById('hwEyebrow').textContent = d.howto.eyebrow;
  document.getElementById('hwTitle').textContent = d.howto.title;
  const hwSteps = document.getElementById('hwSteps'); hwSteps.innerHTML='';
  d.howto.steps.forEach((s,i)=>{
    const step = el('div','step');
    const num = el('div','step-num', String(i+1));
    const body = el('div','step-body');
    body.appendChild(el('h3','',s.title));
    body.appendChild(el('p','',s.body));
    step.appendChild(num); step.appendChild(body);
    hwSteps.appendChild(step);
  });

  // Shopping
  document.getElementById('shEyebrow').textContent = d.shopping.eyebrow;
  document.getElementById('shTitle').textContent = d.shopping.title;
  document.getElementById('shNote').textContent = d.shopping.note;
  const shGrid = document.getElementById('shGrid'); shGrid.innerHTML='';
  const colA = el('div','shop-col'); const colB = el('div','shop-col');
  d.shopping.categories.forEach((cat,i)=>{
    const block = el('div','shop-block');
    block.appendChild(el('div','shop-cat', cat.name));
    cat.items.forEach(it=>{
      const row = el('div','shop-item');
      row.appendChild(el('span','box'));
      row.appendChild(el('span','',it));
      block.appendChild(row);
    });
    (i % 2 === 0 ? colA : colB).appendChild(block);
  });
  shGrid.appendChild(colA); shGrid.appendChild(colB);

  // Recipes
  document.getElementById('rcEyebrow').textContent = RECIPE_EYEBROW[lang] || "RECIPES";
  document.getElementById('rcTitle').textContent = RECIPE_WORD[lang] || "Recipes";
  const list = document.getElementById('recipeList'); list.innerHTML='';
  d.recipes.forEach((r,i)=>{
    const card = el('div','recipe');
    const head = el('div','recipe-head');
    head.style.background = DAY_COLORS[i];
    head.appendChild(el('div','day-label', d.labels.day + ' ' + (i+1) + ' / 7'));
    head.appendChild(el('h3','', r.title));
    const badges = el('div','badges');
    [r.time, r.serves, r.equip].forEach(b=>{ badges.appendChild(el('span','badge', b)); });
    head.appendChild(badges);
    card.appendChild(head);

    const body = el('div','recipe-body');
    const ingCol = el('div','');
    ingCol.appendChild(el('div','block-label', d.labels.ingredients));
    r.ing.forEach(it=>{ ingCol.appendChild(el('div','ing-item', '— '+it)); });
    const tips = el('div','tips');
    const swapTip = el('div','tip'); const swapB = el('b','',d.labels.swap+': '); swapTip.appendChild(swapB); swapTip.appendChild(document.createTextNode(r.swap));
    const leftTip = el('div','tip'); const leftB = el('b','',d.labels.leftover+': '); leftTip.appendChild(leftB); leftTip.appendChild(document.createTextNode(r.leftover));
    tips.appendChild(swapTip); tips.appendChild(leftTip);
    ingCol.appendChild(tips);

    const insCol = el('div','');
    insCol.appendChild(el('div','block-label', d.labels.instructions));
    r.steps.forEach((s,si)=>{
      const row = el('div','ins-step');
      const num = el('div','ins-num', String(si+1));
      num.style.background = DAY_COLORS[i];
      row.appendChild(num);
      row.appendChild(el('div','ins-text', s));
      insCol.appendChild(row);
    });

    body.appendChild(ingCol); body.appendChild(insCol);
    card.appendChild(body);
    list.appendChild(card);
  });

  // Bonus
  document.getElementById('bnEyebrow').textContent = d.bonus.eyebrow;
  document.getElementById('bnTitle').textContent = d.bonus.title;
  const bnItems = document.getElementById('bnItems'); bnItems.innerHTML='';
  d.bonus.items.forEach(t=>{ bnItems.appendChild(el('div','',t)); });

  // Closing
  document.getElementById('clTitle').textContent = d.closing.title;
  document.getElementById('clBody').textContent = d.closing.body;
  document.getElementById('clMadeBy').textContent = d.closing.madeBy;

  document.getElementById('backLink').textContent = (window.BACK_LINK_TEXT[lang] || window.BACK_LINK_TEXT.en);
  document.getElementById('ctaEyebrow').textContent = (window.CTA_LABEL[lang] || window.CTA_LABEL.en);
  document.getElementById('ctaBody').textContent = (window.CTA_BODY[lang] || window.CTA_BODY.en);
  document.getElementById('ctaBtn').innerHTML = '💬 ' + (window.CTA_BTN[lang] || window.CTA_BTN.en);
  document.getElementById('ctaBtn').href = 'https://wa.me/' + (window.WA_NUMBER_BY_LANG[lang]||window.WA_NUMBER_BY_LANG.en) + '?text=' + encodeURIComponent(window.WA_MSG[lang]||window.WA_MSG.en);

  try{ localStorage.setItem('sd_lang', lang); }catch(e){}
}

document.getElementById('langSwitcher').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  render(btn.getAttribute('data-lang'));
});

(function init(){
  let lang = 'en';
  try{
    const saved = localStorage.getItem('sd_lang');
    if(saved && DATA[saved]) lang = saved;
    else {
      const nav = (navigator.language||'en').slice(0,2).toLowerCase();
      if(DATA[nav]) lang = nav;
    }
  }catch(e){}
  render(lang);
})();
</script>

  var history = ["root"];
  var messagesEl, optionsEl, fab, panel;

  function currentLang(){
    return document.documentElement.lang || (function(){ try{return localStorage.getItem('sd_lang')||'ar';}catch(e){return 'ar';} })();
  }

  function pick(dict){ var l = currentLang(); return dict[l] || dict.en || dict.ar; }

  function addMsg(text, isUser){
    var div = document.createElement('div');
    div.className = 'sara-msg' + (isUser ? ' user' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderNode(nodeId){
    var node = TREE[nodeId];
    addMsg(pick(node.msg), false);
    optionsEl.innerHTML = '';
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'sara-opt-btn' + (opt.wa ? ' wa' : '');
      btn.textContent = pick(opt.label);
      btn.addEventListener('click', function(){ handleOption(opt, nodeId); });
      optionsEl.appendChild(btn);
    });
  }

  function handleOption(opt, fromNode){
    if (!opt.back) addMsg(pick(opt.label), true);
    if (opt.wa) {
      window.open(waLink(currentLang()), '_blank');
      return;
    }
    if (opt.link) {
      window.location.href = opt.link;
      return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

  function openPanel(){
    panel.classList.add('open');
    document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
    if (!messagesEl.hasChildNodes()) {
      history = ["root"];
      renderNode("root");
    }
  }

  function init(){
    fab = document.getElementById('saraFab');
    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
