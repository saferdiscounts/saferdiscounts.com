        <button class="lang-btn" data-lang="ar" type="button">AR</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="it" type="button">IT</button>
        <button class="lang-btn" data-lang="fr" type="button">FR</button>
        <button class="lang-btn" data-lang="pt" type="button">PT</button>
        <button class="lang-btn" data-lang="ptbr" type="button">PT-BR</button>
      </div>
      <a class="nav-cta" data-wa href="#" id="nav-cta-text">💬</a>
    </div>
  </nav>
</header>

<section class="article-hero">
  <div class="wrap">
    <a class="article-back" href="blog.html" id="article-back"></a>
    <span class="article-eyebrow" id="article-eyebrow"></span>
    <h1 id="article-title"></h1>
    <p class="sub" id="article-sub"></p>
    <div class="article-byline">
      <img src="images/sara.jpg" alt="Sara">
      <div><div class="name" id="article-byname"></div><div class="meta" id="article-bymeta"></div></div>
    </div>
  </div>
</section>

<div class="article-body">
  <p id="article-intro"></p>
  <h2 id="steps-h2"></h2>
  <div class="steps" id="steps-list"></div>
  <div class="tip-box"><span class="tip-label" id="tip-label"></span><p id="tip-text"></p></div>
  <p id="article-closing"></p>
  <div class="article-cta">
    <h3 id="cta-h3"></h3>
    <p id="cta-p"></p>
    <a class="ticket-btn" data-wa href="#" id="cta-btn" style="display:inline-flex;"></a>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-brand"><img src="logo.png" alt="Safer Discounts"> <span id="footer-brand-text"></span></div>
      <div class="footer-socials">
        <a href="blog.html" id="footer-blog-text"></a>
        <a data-fb href="#" target="_blank" id="footer-fb-text"></a>
        <a data-wa href="#" id="footer-wa-text"></a>
        <a data-email href="#" id="footer-email-text"></a>
        <a data-phone href="#" id="footer-phone-text"></a>
      </div>
    </div>
    <div class="footer-bottom"><span id="footer-copyright"></span><span class="mono">SAFERDISCOUNTS.COM</span></div>
  </div>
</footer>

<a class="floating-wa" data-wa href="#" aria-label="WhatsApp">💬</a>

<script>
(function(){
  var cfg = window.ARTICLE_CONFIG;
  function waLink(lang){
    var num = cfg.contact.whatsappNumberByLang[lang] || cfg.contact.whatsappNumberByLang.en;
    var msg = cfg.contact.whatsappDefaultMessage[lang] || cfg.contact.whatsappDefaultMessage.en;
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }
  function render(lang){
    var t = cfg.i18n[lang] || cfg.i18n.en;
    try { localStorage.setItem('sd_lang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang-btn').forEach(function(btn){ btn.classList.toggle('active', btn.getAttribute('data-lang') === lang); });
    document.querySelectorAll('[data-wa]').forEach(function(el){ el.href = waLink(lang); });
    document.querySelectorAll('[data-fb]').forEach(function(el){ el.href = cfg.contact.facebook; });
    document.querySelectorAll('[data-phone]').forEach(function(el){ el.href = 'tel:' + cfg.contact.phoneDial; });
    document.querySelectorAll('[data-email]').forEach(function(el){ el.href = 'mailto:' + cfg.contact.email; });
    document.querySelector('[data-nav="services"]').textContent = t.nav.services;
    document.querySelector('[data-nav="destinations"]').textContent = t.nav.destinations;
    document.querySelector('[data-nav="reviews"]').textContent = t.nav.reviews;
    document.querySelector('[data-nav="how"]').textContent = t.nav.how;
    document.querySelector('[data-nav="faq"]').textContent = t.nav.faq;
    document.querySelector('[data-nav="blog"]').textContent = t.nav.blog;
    document.getElementById('nav-cta-text').innerHTML = '💬 ' + t.nav.cta;
    document.getElementById('article-back').textContent = t.back;
    document.getElementById('article-eyebrow').textContent = t.eyebrow;
    document.getElementById('article-title').textContent = t.title;
    document.getElementById('article-sub').textContent = t.sub;
    document.getElementById('article-byname').textContent = t.byName;
    document.getElementById('article-bymeta').textContent = t.byMeta;
    document.getElementById('article-intro').textContent = t.intro;
    document.getElementById('steps-h2').textContent = t.stepsH2;
    document.getElementById('steps-list').innerHTML = t.steps.map(function(s){
      return '<div class="step"><div class="n">'+s.n+'</div><div><h3>'+s.title+'</h3><p>'+s.desc+'</p></div></div>';
    }).join('');
    document.getElementById('tip-label').textContent = t.tipLabel;
    document.getElementById('tip-text').textContent = t.tip;
    document.getElementById('article-closing').textContent = t.closing;
    document.getElementById('cta-h3').textContent = t.ctaH3;
    document.getElementById('cta-p').textContent = t.ctaP;
    document.getElementById('cta-btn').innerHTML = '💬 ' + t.ctaBtn;
    document.getElementById('footer-brand-text').textContent = t.brand;
    document.getElementById('footer-blog-text').textContent = t.nav.blog;
    document.getElementById('footer-fb-text').textContent = t.contactBtns.fb;
    document.getElementById('footer-wa-text').textContent = t.contactBtns.wa;
    document.getElementById('footer-email-text').textContent = cfg.contact.email;
    document.getElementById('footer-phone-text').textContent = cfg.contact.phoneDisplay;
    document.getElementById('footer-copyright').textContent = t.footerCopyright;
  }
  document.querySelectorAll('.lang-btn').forEach(function(btn){ btn.addEventListener('click', function(){ render(btn.getAttribute('data-lang')); }); });
  var savedLang = null;
  try { savedLang = localStorage.getItem('sd_lang'); } catch(e){}
  render(cfg.i18n[savedLang] ? savedLang : 'ar');
})();
</script>

</body>
</html>
