<style>
:root{
  --brand-blue:#0365A3;--brand-blue-dark:#023152;--brand-orange:#F1560B;--brand-orange-dark:#C7430A;
  --ink:#0B2036;--paper:#FFF9F1;--card:#FFFFFF;--line:#E4D9C8;--soft:#F3F7FA;--green:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Cairo,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
.wrap{width:min(1140px,calc(100% - 40px));margin:auto}
.mono{font-family:'IBM Plex Mono',monospace}
header{position:sticky;top:0;z-index:50;background:rgba(255,249,241,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.brand img{width:42px;height:42px;object-fit:contain}
.nav-right{display:flex;align-items:center;gap:12px;min-width:0}
.lang-switch{display:flex;gap:3px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:rgba(3,101,163,.08);padding:4px;border-radius:999px;max-width:min(100%,520px)}
.lang-switch::-webkit-scrollbar{display:none}
.lang-btn{flex:0 0 auto;border:0;background:transparent;color:var(--brand-blue);padding:7px 9px;border-radius:999px;font:700 10px 'IBM Plex Mono',monospace;cursor:pointer;transition:.2s}
.lang-btn.active,.lang-btn:hover{background:var(--brand-blue);color:#fff}
.nav-cta{display:inline-flex;align-items:center;gap:8px;background:var(--brand-orange);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;white-space:nowrap;box-shadow:0 8px 18px rgba(241,86,11,.22)}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,var(--brand-blue-dark),var(--brand-blue) 58%,#0b88cf);padding:64px 0 72px}
.hero::before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 12% 15%,rgba(255,255,255,.14),transparent 25%),
radial-gradient(circle at 85% 78%,rgba(241,86,11,.25),transparent 30%);}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}
.hero h1{font-size:clamp(34px,4vw,54px);line-height:1.18;font-weight:900;margin:14px 0 16px}
.hero p{max-width:670px;color:#E4F2F9;font-size:17px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.08);border-radius:999px;font:700 11px 'IBM Plex Mono',monospace;letter-spacing:.8px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:12px;background:var(--brand-orange);color:#fff;font-weight:800}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.45)}
.visual-collage{display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:150px 150px;gap:12px}
.visual-card{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 24px 50px rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18)}
.visual-card:first-child{grid-row:1 / 3}
.visual-card img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.visual-card:hover img{transform:scale(1.07)}
.visual-card .caption{position:absolute;inset:auto 12px 12px 12px;padding:10px 12px;border-radius:12px;background:rgba(2,49,82,.72);backdrop-filter:blur(8px);font-weight:800}
main{padding:62px 0}
.section-head{text-align:center;max-width:760px;margin:0 auto 34px}
.section-head .tag{display:block;color:var(--brand-orange);font:700 11px 'IBM Plex Mono',monospace;letter-spacing:1.4px;margin-bottom:8px}
.section-head h2{font-size:32px;color:var(--brand-blue-dark);font-weight:900;margin-bottom:8px}
.section-head p{color:#52636f}
.lab{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 16px 34px rgba(11,32,54,.08)}
.panel h3{font-size:19px;color:var(--brand-blue-dark);margin-bottom:12px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:800;color:#657682}
.field select{width:100%;background:var(--soft);border:1px solid #D7E4EB;border-radius:12px;padding:12px 13px;color:var(--brand-blue-dark);font-weight:800;outline:none}
.field select:focus{border-color:var(--brand-blue);box-shadow:0 0 0 4px rgba(3,101,163,.1)}
.swap{display:grid;place-items:center;margin:-2px 0 4px}
.swap button{width:48px;height:48px;border:1px solid #D7E4EB;border-radius:50%;background:#fff;color:var(--brand-blue);cursor:pointer;font-size:20px;box-shadow:0 8px 18px rgba(11,32,54,.08);transition:.2s}
.swap button:hover{transform:rotate(180deg) scale(1.05)}
.direction{margin-top:10px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#F5FAFD,#FFF7EF);border:1px dashed var(--line);color:#4B5A66;font-size:13px}
.direction strong{color:var(--brand-blue-dark)}
.practice-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.practice-badge{padding:7px 10px;border-radius:999px;background:rgba(3,101,163,.08);color:var(--brand-blue);font:700 10px 'IBM Plex Mono',monospace}
.phrases{display:grid;gap:10px}
.phrase{display:grid;grid-template-columns:48px 1fr 1fr;gap:12px;align-items:center;padding:14px 15px;border:1px solid var(--line);border-radius:15px;background:#fff;transition:.22s}
.phrase:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(11,32,54,.08);border-color:#BCD6E4}
.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-blue-dark);color:#fff;font:700 11px 'IBM Plex Mono',monospace}
.lang-pill{display:flex;align-items:center;gap:7px;font-size:11px;color:#72818b;margin-bottom:4px}
.phrase strong{display:block;color:var(--brand-blue-dark);font-size:15px}
.phrase .target strong{color:var(--brand-orange-dark)}
.guide-links{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.guide-link{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;transition:.2s}
.guide-link:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(11,32,54,.08)}
.guide-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-orange),var(--brand-orange-dark));color:#fff;font-size:20px;flex:0 0 auto}
.guide-link strong{display:block;color:var(--brand-blue-dark);font-size:13px}
.guide-link span{font-size:11px;color:#667983}
.cta{margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue));color:#fff;border-radius:20px;padding:24px}
.cta h3{font-size:20px;margin-bottom:4px}.cta p{color:#D5E7F1;font-size:13px}
footer{background:var(--brand-blue-dark);color:#C9DCE8;padding:34px 0}
.footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px}

];
var GUIDE={ar:'guide-english.html',en:'guide-english.html',de:'guide-german.html',it:'guide-italian.html',fr:'guide-french.html',pt:'guide-portuguese.html',ptbr:'guide-portuguese-brazilian.html',es:'guide-spanish.html'};
var ui='ar',source='ar',target='de';

function pickUi(){
 try{ui=localStorage.getItem('sd_lang')||'ar'}catch(e){ui='ar'}
 if(!COPY[ui]) ui='ar';
}
function fill(id,val){var el=document.getElementById(id);if(el)el.textContent=val}
function renderStatic(){
 var c=COPY[ui];
 document.documentElement.lang=ui;document.documentElement.dir=ui==='ar'?'rtl':'ltr';
 Object.keys(c).forEach(function(k){
   var map={heroTitle:'hero-title',heroCopy:'hero-copy',start:'hero-start',home:'hero-home',eyebrow:'eyebrow',labTag:'lab-tag',labTitle:'lab-title',labCopy:'lab-copy',panel:'panel-title',source:'source-label',target:'target-label',practice:'practice-title',practiceCopy:'practice-copy',badge:'practice-badge',guidesTag:'guides-tag',guidesTitle:'guides-title',guidesCopy:'guides-copy',cta:'cta-title',ctaCopy:'cta-copy',ctaBtn:'cta-btn',footer:'footer-copy'};
   if(map[k]) fill(map[k],c[k]);
 }
 document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.ui===ui)});
 var n=document.getElementById('nav-book');n.textContent='💬 '+c.ctaBtn;n.href='https://wa.me/201116666306?text='+encodeURIComponent(c.ctaBtn);
 fillSelects();
 renderPractice();
 renderGuides();
}
function fillSelects(){
 var s=document.getElementById('source'),t=document.getElementById('target');
 var keys=Object.keys(LANG);
 s.innerHTML=keys.map(function(k){return '<option value="'+k+'">'+LANG[k].flag+' '+LANG[k].label+'</option>'}).join('');
 t.innerHTML=s.innerHTML;
 s.value=source;t.value=target;
 var c=COPY[ui];
 var text=c.direction.replace('{target}',LANG[target].label).replace('{source}',LANG[source].label);
 document.getElementById('direction').innerHTML=text;
}
function renderPractice(){
 var box=document.getElementById('phrases');
 box.innerHTML=WORDS.map(function(w,i){
   var src=w[1][source],dst=w[1][target];
   return '<div class="phrase"><div class="num">'+String(i+1).padStart(2,'0')+'</div><div><div class="lang-pill">'+LANG[source].flag+' '+LANG[source].label+'</div><strong>'+src+'</strong></div><div class="target"><div class="lang-pill">'+LANG[target].flag+' '+LANG[target].label+'</div><strong>'+dst+'</strong></div></div>';
 }).join('');
}
function renderGuides(){
 var box=document.getElementById('guide-links');
 var c=COPY[ui];
 var targets=['de','en','it','fr','pt','ptbr','es'];
 box.innerHTML=targets.map(function(k){
  var targetName=LANG[k].label;
  var key=GUIDE[k];
  var label=ui==='de'?'Öffne den '+targetName+' Guide':ui==='ar'?'افتح دليل '+targetName:ui==='fr'?'Ouvrir le guide '+targetName:ui==='it'?'Apri la guida '+targetName:ui==='pt'?'Abrir o guia de '+targetName:ui==='ptbr'?'Abrir o guia de '+targetName:'Open the '+targetName+' guide';
  return '<a class="guide-link" href="'+key+'"><span class="guide-icon">'+LANG[k].flag+'</span><span><strong>'+label+'</strong><span>'+targetName+'</span></span></a>';
 }).join('');
}
function updateUrl(){
 var u=new URL(window.location.href);u.searchParams.set('source',source);u.searchParams.set('target',target);history.replaceState({},'',u);
}
document.getElementById('source').addEventListener('change',function(){source=this.value; if(source===target){target=Object.keys(LANG).find(function(k){return k!==source})||'de'} fillSelects();renderPractice();updateUrl()});
document.getElementById('target').addEventListener('change',function(){target=this.value; if(source===target){source=Object.keys(LANG).find(function(k){return k!==target})||'ar'} fillSelects();renderPractice();updateUrl()});
document.getElementById('swap').addEventListener('click',function(){var x=source;source=target;target=x;fillSelects();renderPractice();updateUrl()});
document.querySelectorAll('.lang-btn').forEach(function(b){b.addEventListener('click',function(){ui=b.dataset.ui;try{localStorage.setItem('sd_lang',ui)}catch(e){};renderStatic()})});
var params=new URLSearchParams(location.search);if(LANG[params.get('source')])source=params.get('source');if(LANG[params.get('target')])target=params.get('target');if(source===target)target=source==='de'?'en':'de';
pickUi();renderStatic();updateUrl();
})();
</script>
