<style>
  :root{
    --bg:#14100c; --bg-alt:#1a140f; --card:#1c1610; --gold:#d1a04d;
    --cream:#f3ead8; --muted:#cbb99a; --border:#3a2f22; --day1:#dfb066;
    --day2:#d97c48; --day3:#4d9a9a; --day4:#e5ac48; --day5:#87a066;
    --day6:#c06f3d; --day7:#a8586a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .display{font-family:'Noto Kufi Arabic',sans-serif;}
  .accent-italic{font-family:'Fraunces',serif; font-style:italic; color:var(--gold); font-weight:500;}
  html[lang="ar"] .accent-italic{font-family:'Noto Naskh Arabic',serif; font-style:normal;}

  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(20,16,12,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:900px; margin:0 auto; padding:14px 24px; display:flex;
    align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--cream);}
  html[lang="ar"] .brand{font-family:'Noto Kufi Arabic',sans-serif;}
  .langs{display:flex; gap:6px; flex-wrap:wrap;}
  .langs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.03em;
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
  }
  .langs button:hover{border-color:var(--gold); color:var(--cream);}
  .langs button.active{background:var(--gold); border-color:var(--gold); color:#14100c;}

  /* Hero */
  .hero{padding:76px 24px 56px; text-align:center; border-bottom:1px solid var(--border);}
  .hero .eyebrow{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
    margin-bottom:22px;
  }
  html[lang="ar"] .hero .eyebrow{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.03em;}
  .hero h1{font-size:clamp(30px,5.5vw,46px); font-weight:700; line-height:1.25; max-width:640px; margin:0 auto;}
  .hero .accent-line{font-size:clamp(26px,4.5vw,36px); margin:8px 0; display:block;}
  .hero .subtitle{
    margin:26px auto 0; max-width:480px; font-size:17px; color:var(--muted); line-height:1.8;
  }
  .hero .foottag{
    margin-top:34px; font-size:12.5px; letter-spacing:0.06em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .hero .foottag{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  /* Section shell */
  section{padding:64px 0; border-bottom:1px solid var(--border);}
  .eyebrow-sm{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:14px;
  }
  html[lang="ar"] .eyebrow-sm{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .sec-title{font-size:clamp(24px,3.6vw,32px); font-weight:700; line-height:1.4; margin-bottom:20px; max-width:640px;}

  /* Intro */
  .intro p{font-size:16px; color:#d8ccb8; line-height:1.9; max-width:640px; margin-bottom:18px;}
  .rules{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .rules div{font-size:15px; color:#e7dcc7; display:flex; gap:10px; align-items:flex-start;}
  .rules div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* How-to steps */
  .steps{display:flex; flex-direction:column; gap:28px; margin-top:8px;}
  .step{display:flex; gap:18px; max-width:600px;}
  html[lang="ar"] .step{flex-direction:row-reverse; text-align:right;}
  .step-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:15px; font-family:'Inter',sans-serif;
  }
  html[lang="ar"] .step-num{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body h3{font-size:16.5px; margin-bottom:5px; font-family:'Inter',sans-serif; font-weight:700;}
  html[lang="ar"] .step-body h3{font-family:'Noto Kufi Arabic',sans-serif;}
  .step-body p{font-size:14.5px; color:var(--muted); line-height:1.75;}

  /* Shopping list */
  .shop-note{font-size:13.5px; color:#8a7a63; margin-bottom:30px; max-width:600px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 44px;}
  @media (max-width:640px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat{
    font-size:12px; letter-spacing:0.1em; color:var(--gold); font-weight:700;
    border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:13px; margin-top:26px;
  }
  html[lang="ar"] .shop-cat{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .shop-block:first-child .shop-cat{margin-top:0;}
  .shop-item{font-size:14.5px; color:#e2d7c3; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;}
  .shop-item .box{flex:0 0 auto; width:13px; height:13px; border:1.4px solid var(--gold); border-radius:3px; margin-top:3px;}

  /* Recipes */
  .recipe-list{display:flex; flex-direction:column; gap:22px; margin-top:8px;}
  .recipe{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  }
  .recipe-head{padding:26px 26px 20px; position:relative;}
  .recipe-head .day-label{
    font-size:12px; letter-spacing:0.12em; font-weight:700; color:#14100c; opacity:0.7; margin-bottom:8px;
  }
  html[lang="ar"] .recipe-head .day-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .recipe-head h3{font-size:21px; color:#14100c; font-weight:700; line-height:1.35;}
  .badges{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12px; font-weight:600; background:rgba(20,16,12,0.15); border:1px solid rgba(20,16,12,0.35);
    color:#14100c; padding:5px 12px; border-radius:14px;
  }
  .recipe-body{padding:22px 26px 26px; display:grid; grid-template-columns:1fr 1.3fr; gap:30px;}
  @media (max-width:600px){ .recipe-body{grid-template-columns:1fr; gap:22px;} }
  .block-label{font-size:11.5px; letter-spacing:0.1em; font-weight:700; color:var(--gold); margin-bottom:12px;}
  html[lang="ar"] .block-label{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}
  .ing-item{font-size:13.5px; color:#dccfba; line-height:1.85;}
  .tips{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border);}
  .tip{font-size:12.5px; color:#b3a488; line-height:1.8; margin-bottom:10px;}
  .tip b{color:#e2d7c3;}
  .ins-step{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
  html[lang="ar"] .ins-step{flex-direction:row-reverse;}
  .ins-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; color:#14100c; font-size:11.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .ins-text{font-size:14px; color:#e2d7c3; line-height:1.75;}

  /* Bonus */
  .bonus-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bonus-list div{font-size:14.5px; color:#e7dcc7; line-height:1.75; display:flex; gap:10px;}
  .bonus-list div::before{content:"—"; color:var(--gold); flex:0 0 auto;}

  /* Closing */
  .closing{text-align:center; padding:76px 24px;}
  .closing h2{font-size:clamp(26px,4vw,34px); margin-bottom:18px;}
  .closing p{max-width:480px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.85;}
  .made-by{
    margin-top:30px; font-size:12px; letter-spacing:0.1em; color:#8a7a63; font-weight:600;
  }
  html[lang="ar"] .made-by{font-family:'Noto Kufi Arabic',sans-serif; letter-spacing:0.02em;}

  footer.site-footer{padding:30px 24px; text-align:center; font-size:12px; color:#5e5142;}
</style>
</head>

w": "INTRODUCTION", "title": "Eating healthy doesn't mean giving up your everyday cooking", "p": ["Most people think \"diet\" means cutting out everything you love and eating bland food. The truth is your favorite Spanish home cooking can be lighter and healthier without losing its flavor.", "This plan has seven real Spanish dinners — grilled or baked instead of fried, lean protein, and plenty of vegetables in every recipe. One shopping list, simple cooking."], "rules": ["General healthy eating — not a strict or restrictive diet", "Protein + vegetables on every plate", "Most recipes use just one pan or sheet"]}, "howto": {"eyebrow": "HOW TO USE THIS PLAN", "title": "Four steps. That's it.", "steps": [{"title": "Shop once", "body": "Use the shopping list on the next page — all 7 dinners in one trip."}, {"title": "Cook in any order", "body": "Days are numbered for convenience, not sequence. Save the fastest recipe for your busiest night."}, {"title": "Use the swap tips", "body": "Every recipe has a swap if you want to vary the protein or use what's already in your fridge."}, {"title": "Balance your plate", "body": "Round out any plate with extra salad or vegetables if you want more volume without more calories."}]}, "shopping": {"eyebrow": "YOUR ONE TRIP", "title": "Shopping list", "note": "Salt, black pepper, and extra virgin olive oil are assumed pantry basics and aren't listed below.", "categories": [{"name": "Produce", "items": ["2 lemons", "2 heads garlic", "1 zucchini", "1 eggplant", "3 peppers (red and green)", "1 onion", "1 red onion", "1 carrot", "1 small potato", "3 tomatoes", "Lettuce or mixed greens", "Parsley", "1 dried chili (optional)"]}, {"name": "Protein", "items": ["4 chicken breasts (for two recipes)", "4 skinless chicken thighs", "4 hake fillets", "1 lb shrimp, peeled", "2 cans tuna in water"]}, {"name": "Pantry", "items": ["Brown rice (2 cups)", "Lentils (1 cup)", "1 can cooked chickpeas", "1 bay leaf", "Extra virgin olive oil"]}]}, "recipes": [{"title": "Grilled Lemon-Garlic Chicken with Brown Rice & Vegetables", "time": "30 min", "serves": "Serves 4", "equip": "1 skillet + 1 pot for rice", "ing": ["4 chicken breasts", "3 cloves garlic, minced", "Juice of 2 lemons", "1 tbsp extra virgin olive oil", "1 cup brown rice", "1 cup mixed vegetables (zucchini, pepper, carrot)"], "steps": ["Cook the brown rice according to the package (it takes longer than white).", "Toss the chicken with garlic, lemon juice, oil, salt, and pepper; let it sit 10 min.", "Heat a skillet over medium-high heat and cook the chicken 6-7 min per side until cooked through.", "Meanwhile, sauté the vegetables in another pan with a little oil until tender but still firm.", "Serve the chicken with the rice and vegetables."], "swap": "Swap the chicken for lean pork loin or tofu. In a hurry? Use white rice instead of brown.", "leftover": "Shred the leftover chicken and toss with the vegetables in a big salad for lunch the next day."}, {"title": "Baked Hake with Vegetables", "time": "25 min", "serves": "Serves 4", "equip": "1 sheet pan", "ing": ["4 hake fillets (or any white fish)", "1 zucchini, sliced", "1 red pepper, in strips", "2 cloves garlic, minced", "1 lemon, sliced", "1 tbsp extra virgin olive oil"], "steps": ["Preheat the oven to 400°F (200°C).", "Toss the zucchini and pepper on a sheet pan with half the oil, salt, and pepper.", "Roast the vegetables 8 min.", "Place the fish on top of the vegetables, add the garlic, and top with lemon slices and the rest of the oil.", "Roast 12-15 min more, until the fish is opaque and flakes easily."], "swap": "Any white fish works just as well here, or swap in shrimp with a shorter roasting time.", "leftover": "Flake the hake over a big green salad for a fast lunch the next day."}, {"title": "Stewed Lentils with Vegetables", "time": "35 min", "serves": "Serves 4", "equip": "1 pot", "ing": ["1 cup lentils", "1 carrot, sliced", "1 small potato, cubed", "1 green pepper, chopped", "1 tomato, chopped", "2 cloves garlic, minced", "1 bay leaf"], "steps": ["Sauté the garlic and pepper in the pot with a little oil until soft.", "Add the tomato and cook 2-3 min.", "Add the lentils, carrot, potato, bay leaf, and water to cover; bring to a boil.", "Lower the heat and simmer 25-30 min until the lentils and vegetables are tender.", "Adjust the salt and serve hot."], "swap": "Add cooked shredded chicken for extra protein.", "leftover": "Freezes very well — keep portions on hand for a fast lunch anytime."}, {"title": "Light Garlic Shrimp with Brown Rice", "time": "20 min", "serves": "Serves 4", "equip": "1 skillet", "ing": ["1 lb shrimp, peeled", "4 cloves garlic, sliced", "1 dried chili (optional)", "1 tbsp extra virgin olive oil", "Chopped parsley", "1 cup cooked brown rice"], "steps": ["Heat the oil in a skillet over medium heat.", "Add the garlic and chili, and cook 1 min until the garlic starts to turn golden without burning.", "Raise the heat to medium-high, add the shrimp, and cook 2-3 min per side until pink.", "Stir in the parsley and serve right away over brown rice."], "swap": "Chicken strips or white fish work the same way, just cook a bit longer.", "leftover": "Reheat gently in a skillet — the microwave makes shrimp rubbery."}, {"title": "Spanish Vegetable Medley (Pisto) with Grilled Chicken Breast", "time": "35 min", "serves": "Serves 4", "equip": "1 large skillet + 1 skillet", "ing": ["1 zucchini, diced", "1 eggplant, diced", "1 red pepper, diced", "1 onion, chopped", "2 tomatoes, chopped", "4 chicken breasts"], "steps": ["Sauté the onion in a large skillet with a little oil until translucent.", "Add the pepper and eggplant, and cook 8-10 min.", "Add the zucchini and tomato, lower the heat, and cook 15-20 min until the vegetables are very tender.", "Meanwhile, season and grill the chicken in another skillet, 6-7 min per side.", "Serve the chicken over a generous portion of the vegetable medley."], "swap": "The vegetable medley is also great topped with a poached egg instead of chicken, for a meat-free night.", "leftover": "The vegetables taste even better the next day — reheat and add the chicken or an egg."}, {"title": "Baked Chicken with Peppers & Onion", "time": "40 min", "serves": "Serves 4", "equip": "1 sheet pan", "ing": ["4 chicken thighs, skinless", "2 peppers (red and green), sliced", "1 onion, sliced", "3 cloves garlic, minced", "1 tomato, sliced", "1 tbsp extra virgin olive oil"], "steps": ["Preheat the oven to 400°F (200°C).", "Arrange the chicken, peppers, onion, and tomato on a sheet pan.", "Add the garlic, oil, salt, and pepper, and toss well.", "Bake 35-40 min, until the chicken is cooked through and the vegetables are tender and lightly browned.", "Serve as is, or with a little brown rice."], "swap": "Use chicken breast instead of thighs for an even lighter version.", "leftover": "Tastes even better the next day — reheat and serve over rice or with whole-grain bread."}, {"title": "Full Salad with Tuna & Chickpeas", "time": "15 min", "serves": "Serves 4", "equip": "No cooking", "ing": ["2 cans tuna in water, drained", "1 can cooked chickpeas, drained", "Lettuce or mixed greens", "1 tomato, diced", "1/2 red onion, thinly sliced", "Extra virgin olive oil and vinegar, for dressing"], "steps": ["Toss the lettuce, tomato, and onion in a large bowl.", "Top with the tuna and chickpeas.", "Dress with olive oil, vinegar, salt, and pepper to taste.", "Serve right away."], "swap": "Swap the tuna for grilled chicken or cooked shrimp if you prefer.", "leftover": "Keep the ingredients separate in the fridge and build a fresh salad the next day."}], "bonus": {"eyebrow": "BONUS", "title": "Balance & leftover guide", "items": ["Cook the brown rice and lentils in a bigger batch early in the week — they're the base of several recipes.", "Want more volume without more calories? Add a green salad or extra vegetable medley to any plate.", "Shrimp and fish reheat best in a skillet over low heat, not the microwave.", "In a hurry? Cook a bigger batch of the vegetable medley and keep it for several days — it tastes even better with time."]}, "closing": {"title": "A full week, no deprivation.", "body": "Seven healthy Spanish dinners, one shopping trip, and the home-cooked flavor you actually love. Keep this guide handy and reach for it any week you want balance without giving up your favorite food.", "madeBy": "MADE BY @SARA.ALARABY"}, "labels": {"ingredients": "Ingredients", "instructions": "Instructions", "swap": "Swap it", "leftover": "Leftover tip", "day": "Day"}}, "pt": {"dir": "ltr", "meta": {"htmlLang": "pt", "pageTitle": "O Plano de Jantares Saudáveis da Semana - Comida Espanhola Caseira"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UM GUIA DE RECEITAS SAUDÁVEIS GRÁTIS", "title1": "O PLANO DE JANTARES", "accent": "Espanhóis", "title2": "SAUDÁVEIS DA SEMANA", "subtitle": "Seus pratos espanhóis caseiros favoritos, mais leves — grelhados, assados e cheios de legumes. Sem comida de dieta sem graça.", "footer": "7 JANTARES SAUDÁVEIS · 1 LISTA DE COMPRAS · SABOR CASEIRO DE VERDADE"}, "intro": {"eyebrow": "INTRODUÇÃO", "title": "Comer saudável não significa abrir mão da cozinha do dia a dia", "p": ["A maioria pensa que \"dieta\" significa cortar tudo que você ama e comer coisas sem graça. A verdade é que sua comida espanhola caseira favorita pode ficar mais leve e saudável sem perder o sabor.", "Este plano tem sete jantares espanhóis de verdade — grelhados ou assados em vez de fritos, proteína magra, e bastante legume em cada receita. Uma lista de compras, cozinha simples."], "rules": ["Alimentação saudável geral — não é uma dieta rígida ou restritiva", "Proteína + vegetais em cada prato", "A maioria das receitas usa só uma frigideira ou assadeira"]}, "howto": {"eyebrow": "COMO USAR ESSE PLANO", "title": "Quatro passos. Só isso.", "steps": [{"title": "Faça as compras de uma vez", "body": "Use a lista de compras na próxima página — os 7 jantares em uma só ida ao mercado."}, {"title": nto isso, refogue os legumes em outra panela com um pouco de azeite até ficarem macios mas ainda firmes.", "Sirva o frango com o arroz e os legumes."], "swap": "Troque o frango por lombo suíno magro ou tofu. Com pressa? Use arroz branco em vez do integral.", "leftover": "Desfie o frango que sobrou e misture com os legumes numa salada grande para o almoço do dia seguinte."}, {"title": "Pescada Assada com Legumes", "time": "25 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 filés de merluza (ou outro peixe branco)", "1 abobrinha, fatiada", "1 pimentão vermelho, em tiras", "2 dentes de alho, picados", "1 limão, fatiado", "1 colher (sopa) de azeite extra virgem"], "steps": ["Preaqueça o forno a 200°C.", "Misture a abobrinha e o pimentão numa assadeira com metade do azeite, sal e pimenta.", "Asse os legumes por 8 min.", "Coloque o peixe sobre os legumes, adicione o alho, e cubra com as fatias de limão e o restante do azeite.", "Asse por mais 12-15 min, até o peixe ficar opaco e lascar facilmente."], "swap": "Qualquer peixe branco funciona igualmente bem aqui, ou troque por camarão reduzindo o tempo de forno.", "leftover": "Desfie a pescada sobre uma salada verde grande para um almoço rápido no dia seguinte."}, {"title": "Ensopado de Lentilha com Legumes", "time": "35 min", "serves": "Serve 4", "equip": "1 panela", "ing": ["1 xícara de lentilha", "1 cenoura, fatiada", "1 batata pequena, em cubos", "1 pimentão verde, picado", "1 tomate, picado", "2 dentes de alho, picados", "1 folha de louro"], "steps": ["Refogue o alho e o pimentão na panela com um pouco de óleo até amolecerem.", "Adicione o tomate e cozinhe por 2-3 min.", "Adicione a lentilha, a cenoura, a batata, o louro e água até cobrir; deixe ferver.", "Abaixe o fogo e cozinhe por 25-30 min até a lentilha e os legumes ficarem macios.", "Ajuste o sal e sirva quente."], "swap": "Adicione frango cozido desfiado para mais proteína.", "leftover": "Congela muito bem — guarde porções para um almoço rápido a qualquer momento."}, {"title": "Camarão ao Alho Leve com Arroz Integral", "time": "20 min", "serves": "Serve 4", "equip": "1 frigideira", "ing": ["500g de camarão limpo", "4 dentes de alho, em lâminas", "1 pimenta seca (opcional)", "1 colher (sopa) de azeite extra virgem", "Salsinha picada", "1 xícara de arroz integral cozido"], "steps": ["Aqueça o azeite numa frigideira em fogo médio.", "Adicione o alho e a pimenta, e cozinhe por 1 min até o alho começar a dourar, sem queimar.", "Aumente para fogo médio-alto, adicione o camarão e cozinhe 2-3 min de cada lado até ficar rosado.", "Misture a salsinha e sirva imediatamente sobre o arroz integral."], "swap": "Tiras de frango ou peixe branco funcionam do mesmo jeito, só precisam de um pouco mais de tempo.", "leftover": "Esquente suavemente numa frigideira — o micro-ondas deixa o camarão borrachudo."}, {"title": "Legumes Refogados (Pisto) com Peito de Frango Grelhado", "time": "35 min", "serves": "Serve 4", "equip": "1 frigideira grande + 1 frigideira", "ing": ["1 abobrinha, em cubos", "1 berinjela, em cubos", "1 pimentão vermelho, em cubos", "1 cebola, picada", "2 tomates, picados", "4 peitos de frango"], "steps": ["Refogue a cebola numa frigideira grande com um pouco de óleo até ficar transparente.", "Adicione o pimentão e a berinjela, e cozinhe por 8-10 min.", "Adicione a abobrinha e o tomate, abaixe o fogo e cozinhe por 15-20 min até os legumes ficarem bem macios.", "Enquanto isso, tempere e grelhe o frango em outra frigideira, 6-7 min de cada lado.", "Sirva o frango sobre uma boa porção dos legumes."], "swap": "Os legumes também ficam ótimos com um ovo pochê por cima em vez do frango, para uma noite sem carne.", "leftover": "Os legumes ficam ainda melhores no dia seguinte — esquente e adicione o frango ou um ovo."}, {"title": "Frango Assado com Pimentões e Cebola", "time": "40 min", "serves": "Serve 4", "equip": "1 assadeira", "ing": ["4 sobrecoxas de frango, sem pele", "2 pimentões (vermelho e verde), fatiados", "1 cebola, fatiada", "3 dentes de alho, picados", "1 tomate, fatiado", "1 colher (sopa) de azeite extra virgem"], "steps": ["Preaqueça o forno a 200°C.", "Arrume o frango, os pimentões, a cebola e o tomate numa assadeira.", "Adicione o alho, o azeite, sal e pimenta, e misture bem.", "Asse por 35-40 min, até o frango cozinhar por completo e os legumes ficarem macios e levemente dourados.", "Sirva como está, ou com um pouco de arroz integral."], "swap": "Use peito de frango em vez de sobrecoxa para uma versão ainda mais leve.", "leftover": "Fica ainda melhor no dia seguinte — esquente e sirva com arroz ou pão integral."}, {"title": "Salada Completa com Atum e Grão-de-Bico", "time": "15 min", "serves": "Serve 4", "equip": "Sem cozimento", "ing": ["2 latas de atum em água, escorrido", "1 lata de grão-de-bico cozido, escorrido", "Alface ou folhas verdes variadas", "1 tomate, em cubos", "1/2 cebola roxa, em fatias finas", "Azeite extra virgem e vinagre, para temperar"], "steps": ["Misture a alface, o tomate e a cebola numa tigela grande.", "Adicione o atum e o grão-de-bico por cima.", "Tempere com azeite, vinagre, sal e pimenta a gosto.", "Sirva imediatamente."], "swap": "Troque o atum por frango grelhado ou camarão cozido, se preferir.", "leftover": "Guarde os ingredientes separados na geladeira e monte a salada fresca no dia seguinte."}], "bonus": {"eyebrow": "BÔNUS", "title": "Guia de equilíbrio e sobras", "items": ["Cozinhe o arroz integral e a lentilha em maior quantidade no início da semana — são a base de várias receitas.", "Quer mais volume sem mais calorias? Adicione uma salada verde ou mais legumes refogados a qualquer prato.", "Camarão e peixe esquentam melhor numa frigideira em fogo baixo, não no micro-ondas.", "Com pressa? Cozinhe os legumes refogados em maior quantidade e guarde por vários dias — o sabor melhora com o tempo."]}, "closing": {"title": "Uma semana completa, sem privação.", "body": "Sete jantares espanhóis saudáveis, uma ida ao mercado, e o sabor caseiro que você realmente ama. Guarde este guia à mão e use sempre que quiser equilíbrio sem abrir mão da sua comida favorita.", "madeBy": "FEITO POR @SARA.ALARABY"}, "labels": {"ingredients": "Ingredientes", "instructions": "Modo de preparo", "swap": "Substituição", "leftover": "Dica de sobras", "day": "Dia"}}, "fr": {"dir": "ltr", "meta": {"htmlLang": "fr", "pageTitle": "Le Plan de Dîners Sains de la Semaine - Cuisine Espagnole Maison"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UN GUIDE DE RECETTES SAINES GRATUIT", "title1": "LE PLAN DE DÎNERS", "accent": "Espagnols", "title2": "SAINS DE LA SEMAINE", "subtitle": "Tes plats espagnols maison préférés, en version plus légère — grillés, au four, et pleins de légumes. Pas de plats de régime fades.", "footer": "7 DÎNERS SAINS · 1 LISTE DE COURSES · VRAIE SAVEUR MAISON"}, "intro": {"eyebrow": "INTRODUCTION", "title": "Manger sainement ne veut pas dire renoncer à ta cuisine de tous les jours", "p": ["La plupart des gens pensent qu'un « régime » signifie éliminer tout ce qu'on aime et manger des plats fades. En réalité, ta cuisine espagnole maison préférée peut devenir plus légère et plus saine sans perdre sa saveur.", "Ce plan propose sept vrais dîners espagnols — grillés ou cuits au four plutôt que frits, des protéines maigres, et beaucoup de légumes dans chaque recette. Une seule liste de courses, une cuisine simple."], "rules": ["Une alimentation saine générale — pas un régime strict ni restrictif", "Des protéines + des légumes dans chaque assiette", "La plupart des recettes utilisent une seule poêle ou plaque"]}, "howto": {"eyebrow": "COMMENT UTILISER CE PLAN", "title": "Quatre étapes. C'est tout.", "steps": [{"title": "Fais les courses une seule fois", "body": "Utilise la liste de courses à la page suivante — les 7 dîners en un seul passage."}, {"title": "Cuisine dans l'ordre que tu veux", "body": "Les jours sont numérotés pour l'organisation, pas pour l'obligation. Garde la recette la plus rapide pour ton soir le plus chargé."}, {"title": "Utilise les astuces de substitution", "body": "Chaque recette a une astuce si tu veux varier la protéine ou utiliser ce que tu as déjà au frigo."}, {"title": "Équilibre ton assiette", "body": "Complète n'importe quelle assiette avec plus de salade ou de légumes si tu veux plus de volume sans plus de calories."}]}, "shopping": {"eyebrow": "TON SEUL PASSAGE AU SUPERMARCHÉ", "title": "Liste de courses", "note": "Le sel, le poivre noir et l'huile d'olive extra vierge sont considérés comme des basiques que tu as déjà — ils ne sont donc pas listés ci-dessous.", "categories": [{"name": "Fruits et légumes", "items": ["2 citrons", "2 têtes d'ail", "1 courgette", "1 aubergine", "3 poivrons (rouge et vert)", "1 oignon", "1 oignon rouge", "1 carotte", "1 petite pomme de terre", "3 tomates", "Laitue ou mélange de salades vertes", "Persil", "1 piment séché (facultatif)"]}, {"name": "Protéines", "items": ["4 blancs de poulet (pour deux recettes)", "4 hauts de cuisse de poulet sans peau", "4 filets de merlu", "500g de crevettes décortiquées", "2 boîtes de thon au naturel"]}, {"name": "Épicerie", "items": ["Riz complet (2 tasses)", "Lentilles (1 tasse)", "1 boîte de pois chiches cuits", "1 feuille de laurier", "Huile d'olive extra vierge"]}]}, "recipes": [{"title": "Poulet Grillé au Citron et à l'Ail, Riz Complet et Légumes", "time": "30 min", "serves": "Pour 4", "equip": "1 poêle + 1 casserole pour le riz", "ing": ["4 blancs de poulet", "3 gousses d'ail, hachées", "Jus de 2 citrons", "1 c. à soupe d'huile d'olive extra vierge", "1 tasse de riz complet", "1 tasse de légumes variés (courgette, poivron, carotte)"], "steps": ["Fais cuire le riz complet selon le paquet (plus long que le riz blanc).", "Mélange le poulet avec l'ail, le jus de citron, l'huile, le sel et le poivre ; laisse reposer 10 min.", "Fais chauffer une poêle à feu moyen-vif et cuis le poulet 6-7 min de chaque côté jusqu'à ce qu'il soit bien cuit.", "Pendant ce temps, fais sauter les légumes dans une autre poêle avec un peu d'huile jusqu'à ce qu'ils soient tendres mais encore fermes.", "Sers le poulet avec le riz et les légumes."], "swap": "Remplace le poulet par du filet de porc maigre ou du tofu. Pressé ? Utilise du riz blanc à la place du riz complet.", "leftover": "Effiloche le poulet restant et mélange-le avec les légumes dans une grande salade pour le déjeuner du lendemain."}, {"title": "Merlu au Four avec Légumes", "time": "25 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 filets de merlu (ou tout poisson blanc)", "1 courgette, en tranches", "1 poivron rouge, en lanières", "2 gousses d'ail, hachées", "1 citron, en tranches", "1 c. à soupe d'huile d'olive extra vierge"], "steps": ["Préchauffe le four à 200°C.", "Mélange la courgette et le poivron sur une plaque avec la moitié de l'huile, le sel et le poivre.", "Fais cuire les légumes 8 min.", "Place le poisson sur les légumes, ajoute l'ail, et recouvre de tranches de citron et du reste d'huile.", "Fais cuire 12-15 min de plus, jusqu'à ce que le poisson soit opaque et s'effeuille facilement."], "swap": "N'importe quel poisson blanc convient tout aussi bien ici, ou remplace par des crevettes avec un temps de cuisson plus court.", "leftover": "Émiette le merlu sur une grande salade verte pour un déjeuner rapide le lendemain."}, {"title": "Lentilles Mijotées aux Légumes", "time": "35 min", "serves": "Pour 4", "equip": "1 casserole", "ing": ["1 tasse de lentilles", "1 carotte, en tranches", "1 petite pomme de terre, en cubes", "1 poivron vert, haché", "1 tomate, hachée", "2 gousses d'ail, hachées", "1 feuille de laurier"], "steps": ["Fais revenir l'ail et le poivron dans la casserole avec un peu d'huile jusqu'à ce qu'ils ramollissent.", "Ajoute la tomate et fais cuire 2-3 min.", "Ajoute les lentilles, la carotte, la pomme de terre, le laurier et de l'eau à couvert ; porte à ébullition.", "Baisse le feu et laisse mijoter 25-30 min jusqu'à ce que les lentilles et les légumes soient tendres.", "Ajuste le sel et sers chaud."], "swap": "Ajoute du poulet cuit effiloché pour plus de protéines.", "leftover": "Se congèle très bien — garde des portions pour un déjeuner rapide à tout moment."}, {"title": "Crevettes à l'Ail Légères avec Riz Complet", "time": "20 min", "serves": "Pour 4", "equip": "1 poêle", "ing": ["500g de crevettes décortiquées", "4 gousses d'ail, en lamelles", "1 piment séché (facultatif)", "1 c. à soupe d'huile d'olive extra vierge", "Persil haché", "1 tasse de riz complet cuit"], "steps": ["Fais chauffer l'huile dans une poêle à feu moyen.", "Ajoute l'ail et le piment, et fais cuire 1 min jusqu'à ce que l'ail commence à dorer, sans brûler.", "Monte à feu moyen-vif, ajoute les crevettes et fais cuire 2-3 min de chaque côté jusqu'à ce qu'elles soient roses.", "Incorpore le persil et sers immédiatement sur le riz complet."], "swap": "Des lanières de poulet ou du poisson blanc fonctionnent de la même façon, il faut juste un peu plus de temps.", "leftover": "Réchauffe doucement à la poêle — le micro-ondes rend les crevettes caoutchouteuses."}, {"title": "Poêlée de Légumes (Pisto) avec Blanc de Poulet Grillé", "time": "35 min", "serves": "Pour 4", "equip": "1 grande poêle + 1 poêle", "ing": ["1 courgette, en dés", "1 aubergine, en dés", "1 poivron rouge, en dés", "1 oignon, haché", "2 tomates, hachées", "4 blancs de poulet"], "steps": ["Fais revenir l'oignon dans une grande poêle avec un peu d'huile jusqu'à ce qu'il devienne translucide.", "Ajoute le poivron et l'aubergine, et fais cuire 8-10 min.", "Ajoute la courgette et la tomate, baisse le feu, et fais cuire 15-20 min jusqu'à ce que les légumes soient très tendres.", "Pendant ce temps, assaisonne et fais griller le poulet dans une autre poêle, 6-7 min de chaque côté.", "Sers le poulet sur une bonne portion de la poêlée de légumes."], "swap": "La poêlée de légumes est aussi délicieuse avec un œuf poché à la place du poulet, pour une soirée sans viande.", "leftover": "Les légumes sont encore meilleurs le lendemain — réchauffe et ajoute le poulet ou un œuf."}, {"title": "Poulet au Four avec Poivrons et Oignon", "time": "40 min", "serves": "Pour 4", "equip": "1 plaque", "ing": ["4 hauts de cuisse de poulet, sans peau", "2 poivrons (rouge et vert), en tranches", "1 oignon, en tranches", "3 gousses d'ail, hachées", "1 tomate, en tranches", "1 c. à soupe d'huile d'olive extra vierge"], "steps": ["Préchauffe le four à 200°C.", "Dispose le poulet, les poivrons, l'oignon et la tomate sur une plaque.", "Ajoute l'ail, l'huile, le sel et le poivre, et mélange bien.", "Fais cuire 35-40 min, jusqu'à ce que le poulet soit bien cuit et les légumes tendres et légèrement dorés.", "Sers tel quel, ou avec un peu de riz complet."], "swap": "Utilise du blanc de poulet à la place des hauts de cuisse pour une version encore plus légère.", "leftover": "Encore meilleur le lendemain — réchauffe et sers avec du riz ou du pain complet."}, {"title": "Salade Complète au Thon et Pois Chiches", "time": "15 min", "serves": "Pour 4", "equip": "Sans cuisson", "ing": ["2 boîtes de thon au naturel, égoutté", "1 boîte de pois chiches cuits, égouttés", "Laitue ou mélange de salades vertes", "1 tomate, en dés", "1/2 oignon rouge, finement émincé", "Huile d'olive extra vierge et vinaigre, pour assaisonner"], "steps": ["Mélange la laitue, la tomate et l'oignon dans un grand bol.", "Ajoute le thon et les pois chiches par-dessus.", "Assaisonne avec l'huile d'olive, le vinaigre, le sel et le poivre selon ton goût.", "Sers immédiatement."], "swap": "Remplace le thon par du poulet grillé ou des crevettes cuites si tu préfères.", "leftover": "Garde les ingrédients séparés au frigo et compose une salade fraîche le lendemain."}], "bonus": {"eyebrow": "EN BONUS", "title": "Guide d'équilibre et de restes", "items": ["Cuis le riz complet et les lentilles en plus grande quantité en début de semaine — ils sont la base de plusieurs recettes.", "Envie de plus de volume sans plus de calories ? Ajoute une salade verte ou plus de poêlée de légumes à n'importe quelle assiette.", "Les crevettes et le poisson se réchauffent mieux à la poêle à feu doux, pas au micro-ondes.", "Pressé ? Cuis la poêlée de légumes en plus grande quantité et garde-la pour plusieurs jours — elle est encore meilleure avec le temps."]}, "closing": {"title": "Une semaine complète, sans privation.", "body": "Sept dîners espagnols sains, un seul passage au supermarché, et la saveur maison que tu aimes vraiment. Garde ce guide à portée de main et utilise-le chaque semaine où tu veux de l'équilibre sans renoncer à ton plat préféré.", "madeBy": "CRÉÉ PAR @SARA.ALARABY"}, "labels": {"ingredients": "Ingrédients", "instructions": "Préparation", "swap": "Substitution", "leftover": "Astuce restes", "day": "Jour"}}, "it": {"dir": "ltr", "meta": {"htmlLang": "it", "pageTitle": "Il Piano Cena Sano della Settimana - Cucina Casalinga Spagnola"}, "nav": {"brand": "sara.alaraby"}, "hero": {"eyebrow": "UNA GUIDA GRATUITA A RICETTE SANE", "title1": "LA SETTIMANA", "accent": "Spagnola", "title2": "SANA A CENA", "subtitle": "I tuoi piatti casalinghi spagnoli preferiti, resi più leggeri — alla griglia, al forno, e pieni di verdure. Niente cibo da dieta insipido.", "footer": "7 CENE SANE · 1 LISTA DELLA SPESA · VERO SAPORE DI CASA"}, "intro": {"eyebrow": "INTRODUZIONE", "title": "Mangiare sano non significa rinunciare alla tua cucina di ogni giorno", "p": ["Molte persone pensano che \"dieta\" significhi eliminare tutto ciò che ami e mangiare cibo insipido. La verità è che la tua cucina casalinga spagnola preferita può essere più leggera e sana senza perdere il suo sapore.", "Questo piano ha sette vere cene spagnole — alla griglia o al forno invece che fritte, proteine magre, e tante verdure in ogni ricetta. Una lista della spesa, cottura semplice."], "rules": ["Alimentazione sana in generale — non una dieta rigida o restrittiva", "Proteine + verdure in ogni piatto", "La maggior parte delle ricette usa solo una padella function el(tag, cls, text){

  return e;

  function addMsg(text, isUser){
    var div = document.createElement('div');
    div.className = 'sara-msg' + (isUser ? ' user' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderNode(nodeId){
    var node = TREE[nodeId];
    addMsg(pick(node.msg), false);
    optionsEl.innerHTML = '';
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'sara-opt-btn' + (opt.wa ? ' wa' : '');
      btn.textContent = pick(opt.label);
      btn.addEventListener('click', function(){ handleOption(opt, nodeId); });
      optionsEl.appendChild(btn);
    });
  }

  function handleOption(opt, fromNode){
    if (!opt.back) addMsg(pick(opt.label), true);
    if (opt.wa) {
      window.open(waLink(currentLang()), '_blank');
      return;
    }
    if (opt.link) {
      window.location.href = opt.link;
      return;
    }
    if (opt.back) {
      history.pop();
      var prev = history[history.length - 1] || 'root';
      renderNode(prev);
      return;
    }
    if (opt.goto) {
      history.push(opt.goto);
      renderNode(opt.goto);
      return;
    }
  }

    panel = document.getElementById('saraPanel');
    messagesEl = document.getElementById('saraMessages');
    optionsEl = document.getElementById('saraOptions');
    fab.addEventListener('click', function(){
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { openPanel(); }
    });
    document.getElementById('saraClose').addEventListener('click', function(){
      panel.classList.remove('open');
    });
    new MutationObserver(function(){
      if (panel.classList.contains('open')) {
        document.getElementById('saraPanelStatus').textContent = pick(STATUS_TXT);
      }
    }).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
